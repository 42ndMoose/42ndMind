<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>42ndMind Coverage Expansion Library Test v0.1</title><style>body{margin:0;background:#0f1115;color:#eef2ff;font:14px ui-monospace,Menlo,Consolas,monospace}header{padding:16px;background:#11141b;border-bottom:1px solid #2a3040}main{padding:12px}section{background:#171a21;border:1px solid #2a3040;border-radius:10px;padding:12px}pre{white-space:pre-wrap;background:#0d1016;border:1px solid #2a3040;border-radius:10px;padding:10px;overflow:auto;max-height:760px}.ok{color:#9dffb4}.bad{color:#ff8b8b}a{color:#9db6ff}</style></head><body><header><h1>42ndMind Coverage Expansion Library Test v0.1</h1><div>Tests general language-phenomenon coverage without dictionary population.</div></header><main><section><h2 id="summary">Running...</h2><div><a href="coverage-expansion-library.html?v=coverage-1">coverage expansion library page</a></div><pre id="out"></pre></section></main><script src="src/kernel-objective-claim-language-v0-1.js?v=claim-1"></script><script src="src/kernel-objective-claim-language-v0-1-1-patch.js?v=claim-2"></script><script src="src/kernel-external-anchor-packet-schema-v0-1.js?v=anchor-1"></script><script src="src/kernel-source-provenance-registry-v0-1.js?v=prov-1"></script><script src="src/kernel-evidence-media-registry-v0-1.js?v=evidence-1"></script><script src="src/kernel-truth-pressure-synthesis-v0-1.js?v=truth-1"></script><script src="src/kernel-truth-pressure-synthesis-v0-1-1-patch.js?v=truth-2"></script><script src="src/kernel-claim-narrative-benchmark-v0-1.js?v=bench-1"></script><script src="src/kernel-adversarial-narrative-pressure-v0-1.js?v=adv-1"></script><script src="src/kernel-real-world-packet-ingestion-discipline-v0-1.js?v=ingest-1"></script><script src="src/kernel-truth-ledger-preledger-v0-1.js?v=preledger-1"></script><script src="src/kernel-truth-ledger-preledger-stress-benchmark-v0-1.js?v=prestress-1"></script><script src="src/kernel-world-model-relation-expansion-v0-1.js?v=wmrel-1"></script><script src="src/kernel-world-model-relation-stress-benchmark-v0-1.js?v=wmrelstress-1"></script><script src="src/kernel-world-model-relation-stress-benchmark-v0-1-1-patch.js?v=wmrelstress-2"></script><script src="src/kernel-coverage-expansion-library-v0-1.js?v=coverage-1"></script><script>const tests=[];let packet=null;function add(n,f){tests.push({name:n,fn:f})}function assert(c,m){if(!c)throw new Error(m)}function arr(v){return Array.isArray(v)?v:[]}function records(){return arr(packet&&packet.coverage_records)}function validation(){return packet&&packet.validation||{}}function families(){return new Set(records().map(r=>r.coverage_family))}add('module loads and doctrine treats coverage as meta-grammar, not dictionary population',()=>{assert(window.KernelWorldModelRelationStressBenchmarkV01,'relation stress missing');assert(window.KernelCoverageExpansionLibraryV01,'coverage library missing');assert(KernelCoverageExpansionLibraryV01.VERSION==='0.1.0','version wrong');const d=KernelCoverageExpansionLibraryV01.doctrine();assert(d.unified_language_grammar_scope_is_one===true,'unified scope missing');assert(d.coverage_expansion_is_meta_grammar_not_dictionary_population===true,'meta-grammar doctrine missing');assert(d.language_phenomenon_class_can_be_known_before_exact_meaning===true,'class-before-meaning doctrine missing');assert(d.unknown_specifics_hold_for_admission_when_needed===true,'unknown hold doctrine missing');assert(d.no_fake_specific_meaning===true,'no fake meaning doctrine missing');assert(d.no_llm===true,'no LLM doctrine missing');assert(d.belief_movement==='none','belief movement wrong')});add('coverage expansion runs from patched relation stress benchmark',()=>{packet=KernelCoverageExpansionLibraryV01.runCoverageExpansionLibrary();assert(packet.ok===true,'packet not ok: '+JSON.stringify(validation()));assert(packet.source_relation_stress_ok===true,'source relation stress not ok');assert(packet.source_relation_stress_patch_version==='0.1.1','expected relation stress patch 0.1.1');assert(packet.source_relation_stress_records===16,'expected 16 relation stress records');assert(packet.source_relation_stress_families===16,'expected 16 relation stress families');assert(packet.coverage_record_count===22,'expected 22 coverage records');assert(packet.coverage_family_count===22,'expected 22 coverage families');assert(packet.coverage_expansion_is_final_truth_authority===false,'became final authority')});add('required general language phenomena are represented',()=>{['literal_statement','idiom_or_fixed_expression','sarcasm_or_irony','metaphor_or_analogy','ambiguity_polysemy','deixis_indexicality','scope_quantifier','modality_possibility','modality_necessity','conditional_relation','negation','comparison','identity_definition','obligation_permission','ability_capacity','temporal_relation','causal_relation','evidence_marker','question_request','command_directive','quotation_report','unknown_pattern_hold_for_admission'].forEach(f=>assert(families().has(f),f+' missing'));assert(validation().checks.required_language_phenomena_present===true,'required family check failed')});add('class detection works without exact instance or dictionary population',()=>{records().forEach(r=>{assert(r.dictionary_population_required===false,r.coverage_id+' dictionary population required');assert(r.exact_instance_population_required===false,r.coverage_id+' exact population required');assert(r.detail_learning_policy&&r.detail_learning_policy.class_detection_without_dictionary_population===true,r.coverage_id+' class detection policy missing');assert(r.detail_learning_policy&&r.detail_learning_policy.learn_detail_only_when_accuracy_requires_it===true,r.coverage_id+' needed-learning policy missing')});assert(validation().checks.meta_grammar_not_dictionary===true,'meta grammar check failed');assert(validation().checks.class_detection_without_exact_population===true,'class detection check failed');assert(validation().checks.learn_details_only_when_needed===true,'needed learning check failed')});add('idiom, sarcasm, metaphor, and unknown patterns classify without pretending exact meaning',()=>{const c=KernelCoverageExpansionLibraryV01.classifyLanguagePhenomenon;const idiom=c('That plan is up in the air.');const sarcasm=c('Great, another delay.');const metaphor=c('The queue is a bottleneck.');const unknown=c('Zorp flindle makes the bracket hum.');assert(idiom.coverage_family_candidate==='idiom_or_fixed_expression','idiom classification failed');assert(sarcasm.coverage_family_candidate==='sarcasm_or_irony','sarcasm classification failed');assert(metaphor.coverage_family_candidate==='metaphor_or_analogy','metaphor classification failed');assert(unknown.coverage_family_candidate==='unknown_pattern_hold_for_admission','unknown classification failed');[idiom,sarcasm,metaphor,unknown].forEach(row=>{assert(row.exact_meaning_claimed===false,'exact meaning was claimed');assert(row.dictionary_population_required===false,'dictionary population required');assert(row.truth_status==='not_adjudicated','truth adjudicated')});assert(validation().checks.idiom_sarcasm_metaphor_unknown_classified_without_exact_meaning===true,'sample classification validation failed')});add('unknown pattern hold and admission route stay visible',()=>{const unknown=records().find(r=>r.coverage_family==='unknown_pattern_hold_for_admission');assert(unknown,'unknown pattern record missing');assert(arr(unknown.unresolved_items).includes('unknown_specific_meaning_must_not_be_faked'),'unknown fake-meaning guard missing');assert(unknown.detail_learning_policy.admission_required_for_new_specific_meaning===true,'admission required flag missing');assert(validation().checks.unknown_pattern_hold_visible===true,'unknown hold validation failed')});add('local shape invariants and rollback discipline are preserved',()=>{records().forEach(r=>{assert(r.intention_type===1,r.coverage_id+' intention_type wrong');assert(r.local_concept_shape_l1===1,r.coverage_id+' L1 not 1');assert(r.force_kept_outside_shape===true,r.coverage_id+' force not outside shape');assert(r.force_intensity===0,r.coverage_id+' force intensity inflated');assert(r.rollback_available===true,r.coverage_id+' rollback unavailable');assert(r.rollback_snapshot,r.coverage_id+' rollback missing');assert(arr(r.revision_trail).length>=1,r.coverage_id+' revision trail missing');assert(arr(r.revision_trail).every(v=>v.silent_mutation===false),r.coverage_id+' silent mutation present')});assert(validation().checks.local_l1_preserved_for_all===true,'L1 check failed');assert(validation().checks.force_outside_shape_for_all===true,'force check failed');assert(validation().checks.rollback_available_for_all===true,'rollback check failed');assert(validation().checks.revision_trail_present_for_all===true,'revision trail check failed');assert(validation().checks.no_silent_mutation===true,'silent mutation check failed')});add('no truth promotion, no LLM, no lookup, candidate-only status, and belief movement are preserved',()=>{records().forEach(r=>{assert(r.truth_status==='not_adjudicated',r.coverage_id+' truth adjudicated');assert(r.final_authority===false,r.coverage_id+' final authority true');assert(r.llm_used===false,r.coverage_id+' LLM used');assert(r.external_lookup_performed===false,r.coverage_id+' external lookup performed');assert(r.media_lookup_performed===false,r.coverage_id+' media lookup performed');assert(r.promotion_status==='not_promoted',r.coverage_id+' promoted');assert(r.doctrine_status==='candidate_not_doctrine',r.coverage_id+' doctrine status unsafe');assert(r.belief_movement==='none',r.coverage_id+' belief movement not none')});assert(validation().checks.final_authority_false===true,'final authority check failed');assert(validation().checks.no_llm_used===true,'no LLM check failed');assert(validation().checks.no_external_or_media_lookup===true,'lookup check failed');assert(validation().checks.candidate_only_not_promoted===true,'candidate-only check failed');assert(validation().checks.belief_movement_none===true,'belief movement check failed');assert(arr(validation().errors).length===0,'validation errors present: '+validation().errors.join(','))});(async function run(){const results=[];for(const t of tests){try{await t.fn();results.push({name:t.name,passed:true})}catch(e){results.push({name:t.name,passed:false,error:e.message})}}const passed=results.filter(r=>r.passed).length;document.getElementById('summary').className=passed===tests.length?'ok':'bad';document.getElementById('summary').textContent=passed+'/'+tests.length+' passed';document.getElementById('out').textContent=JSON.stringify({packet_type:'42ndMind_coverage_expansion_library_test_report_v0_1',ok:passed===tests.length,source_relation_stress_ok:packet&&packet.source_relation_stress_ok,source_relation_stress_patch_version:packet&&packet.source_relation_stress_patch_version,source_relation_stress_records:packet&&packet.source_relation_stress_records,coverage_record_count:packet&&packet.coverage_record_count,coverage_family_count:packet&&packet.coverage_family_count,family_counts:packet&&packet.family_counts,records:records().map(r=>({coverage_id:r.coverage_id,coverage_family:r.coverage_family,language_phenomenon:r.language_phenomenon,local_concept_shape_l1:r.local_concept_shape_l1,dictionary_population_required:r.dictionary_population_required,exact_instance_population_required:r.exact_instance_population_required,coverage_status:r.coverage_status,truth_status:r.truth_status,promotion_status:r.promotion_status,belief_movement:r.belief_movement})),validation:validation(),results},null,2)})();</script></body></html>
