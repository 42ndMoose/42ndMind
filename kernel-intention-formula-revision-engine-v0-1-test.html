<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>42ndMind Intention Formula Revision Engine Test</title><style>body{margin:0;background:#0f1115;color:#eef2ff;font:14px ui-monospace,Menlo,Consolas,monospace}header{padding:16px;background:#11141b;border-bottom:1px solid #2a3040}main{padding:12px}section{background:#171a21;border:1px solid #2a3040;border-radius:10px;padding:12px}pre{white-space:pre-wrap;background:#0d1016;border:1px solid #2a3040;border-radius:10px;padding:10px;overflow:auto;max-height:760px}.ok{color:#9dffb4}.bad{color:#ff8b8b}a{color:#9db6ff}</style></head><body><header><h1>42ndMind Intention Formula Revision Engine Test</h1><div>Tests staged formula rewrites from contradiction/refinement pressure. No source mutation. No doctrine promotion.</div></header><main><section><h2 id="summary">Running...</h2><div><a href="intention-formula-revision.html?v=revision-1">formula revision page</a></div><pre id="out"></pre></section></main><script src="src/kernel-intention-discovery-v0-1.js?v=intent-1"></script><script src="src/kernel-intention-refinement-v0-1.js?v=refine-1"></script><script src="src/kernel-intention-necessity-test-v0-1.js?v=necessity-1"></script><script src="src/kernel-intention-neighbor-lattice-v0-1.js?v=lattice-3"></script><script src="src/kernel-intention-lattice-invariance-benchmark-v0-1.js?v=invariance-2"></script><script src="src/kernel-intention-formula-compiler-v0-1.js?v=formula-1"></script><script src="src/kernel-intention-concept-expansion-loop-v0-1.js?v=expansion-1"></script><script src="src/kernel-intention-contradiction-refinement-loop-v0-1.js?v=contradiction-1"></script><script src="src/kernel-intention-formula-revision-engine-v0-1.js?v=revision-1"></script><script>const tests=[];let packet=null;function add(n,f){tests.push({name:n,fn:f})}function assert(c,m){if(!c)throw new Error(m)}function arr(v){return Array.isArray(v)?v:[]}function byConcept(name){return arr(packet&&packet.revision_candidates).find(c=>c.concept===name)}add('modules load',()=>{assert(window.KernelIntentionFormulaRevisionEngineV01,'revision engine missing');assert(KernelIntentionFormulaRevisionEngineV01.VERSION==='0.1.0','version wrong');assert(typeof KernelIntentionFormulaRevisionEngineV01.runRevisionEngine==='function','runRevisionEngine missing')});add('doctrine keeps revisions staged only',()=>{const d=KernelIntentionFormulaRevisionEngineV01.doctrine();assert(d.rewrites_formulas_as_staged_candidates_not_doctrine===true,'staged rewrite doctrine missing');assert(d.no_silent_source_mutation===true,'source mutation guard missing');assert(d.source_formula_remains_intact===true,'source intact guard missing');assert(d.force_intensity_outside_shape==='F = M · i','force guard missing');assert(d.belief_movement==='none','belief movement wrong')});add('revision engine runs on expansion plus contradiction loop',()=>{packet=KernelIntentionFormulaRevisionEngineV01.runRevisionEngine();assert(packet.ok===true,'packet not ok: '+JSON.stringify(packet.validation));assert(packet.source_expansion_ok===true,'source expansion not ok');assert(packet.source_loop_ok===true,'source loop not ok');assert(packet.source_compiled_formula_count===11,'expected 11 source formulas');assert(packet.revision_candidate_count===11,'expected 11 revision candidates');assert(packet.guarded_revision_count>=6,'expected at least 6 guarded revisions');assert(packet.belief_movement==='none','packet moved belief')});add('all revisions preserve unit-total and force separation',()=>{arr(packet.revision_candidates).forEach(c=>{assert(c.source_l1_total===1,c.concept+' source l1 wrong');assert(c.revised_l1_total===1,c.concept+' revised l1 wrong');assert(c.staged_review_status==='staged_revised_candidate_not_doctrine',c.concept+' promoted too early');assert(c.action_status==='staged_candidate_revision_not_applied',c.concept+' revision applied too early');assert(c.promotion_status==='not_promoted',c.concept+' promotion unsafe');assert(c.belief_movement==='none',c.concept+' moved belief');const shape=new Set(arr(c.staged_shape_terms).map(t=>t.dimension));arr(c.staged_force_terms).forEach(f=>assert(!shape.has(f.dimension),c.concept+' force leaked into shape: '+f.dimension))})});add('revisions do not silently alter source shape or coefficients',()=>{arr(packet.revision_candidates).forEach(c=>{assert(c.revision_changes_source_coefficients===false,c.concept+' changed coefficients silently');assert(c.revision_changes_source_shape_terms===false,c.concept+' changed shape terms silently');assert(c.source_formula_snapshot&&arr(c.source_formula_snapshot.shape_terms).length===arr(c.staged_shape_terms).length,c.concept+' source/staged term count mismatch');assert(c.revised_symbolic_formula.includes('^r'),c.concept+' missing revised marker');assert(c.revised_symbolic_formula.includes('Σ|dimension_i| = 1'),c.concept+' missing unit-total')})});add('key concepts receive guarded rewrite pressure',()=>{['consent','coercion','request','threat','trust','betrayal','belief','doubt','fear','manipulation'].forEach(name=>{const c=byConcept(name);assert(c,'missing '+name);assert(arr(c.revision_guards).length>=1,name+' missing revision guards')})});add('guards remain candidate-only and traceable',()=>{arr(packet.revision_candidates).forEach(c=>{arr(c.revision_guards).forEach(g=>{assert(g.belief_movement==='none',c.concept+' guard moved belief');assert(g.guard_expression&&g.guard_expression.length>0,c.concept+' guard expression missing');assert(g.source_pair&&g.source_pair.length>0,c.concept+' guard source missing')})})});add('validation report is clean',()=>{assert(packet.validation&&packet.validation.ok===true,'validation not ok');assert(arr(packet.validation.errors).length===0,'validation has errors');packet.validation.validations.forEach(v=>{assert(v.ok===true,v.concept+' validation failed: '+v.errors.join(','));assert(v.source_l1_total===1,v.concept+' validation source l1 wrong');assert(v.revised_l1_total===1,v.concept+' validation revised l1 wrong');assert(v.belief_movement==='none',v.concept+' validation moved belief')})});(async function run(){const results=[];for(const t of tests){try{await t.fn();results.push({name:t.name,passed:true})}catch(e){results.push({name:t.name,passed:false,error:e.message})}}const passed=results.filter(r=>r.passed).length;document.getElementById('summary').className=passed===tests.length?'ok':'bad';document.getElementById('summary').textContent=passed+'/'+tests.length+' passed';document.getElementById('out').textContent=JSON.stringify({packet_type:'42ndMind_intention_formula_revision_engine_test_report_v0_1',ok:passed===tests.length,source_compiled_formula_count:packet&&packet.source_compiled_formula_count,revision_candidate_count:packet&&packet.revision_candidate_count,guarded_revision_count:packet&&packet.guarded_revision_count,candidates:packet&&packet.revision_candidates&&packet.revision_candidates.map(c=>({concept:c.concept,source_l1_total:c.source_l1_total,revised_l1_total:c.revised_l1_total,guard_count:c.revision_guards.length,action_status:c.action_status,promotion_status:c.promotion_status})),validation:packet&&packet.validation,results},null,2)})();</script></body></html>
