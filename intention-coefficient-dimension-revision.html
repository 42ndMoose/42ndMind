<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>42ndMind Coefficient/Dimension Revision</title><style>body{margin:0;background:#0f1115;color:#eef2ff;font:14px ui-monospace,Menlo,Consolas,monospace}header{padding:16px 18px;background:#11141b;border-bottom:1px solid #2a3040}main{padding:12px;display:grid;grid-template-columns:470px 1fr;gap:12px}section{background:#171a21;border:1px solid #2a3040;border-radius:10px;padding:12px}button{background:#25345c;color:#eef2ff;border:1px solid #3f5592;padding:8px 10px;border-radius:8px;cursor:pointer;margin:3px 3px 8px 0}pre{white-space:pre-wrap;background:#0d1016;border:1px solid #2a3040;border-radius:10px;padding:10px;overflow:auto;max-height:760px}.ok{color:#9dffb4}.bad{color:#ff8b8b}.muted{color:#8b93a7}a{color:#9db6ff}.card{background:#10131a;border:1px solid #2a3040;border-radius:10px;padding:10px;margin:10px 0}.rev{border-top:1px solid #252b3a;padding:7px 0}.pill{display:inline-block;border:1px solid #2a3040;border-radius:999px;padding:1px 7px;margin:2px}.safe{color:#9dffb4}.warn{color:#ffd28b}@media(max-width:900px){main{grid-template-columns:1fr}}</style></head><body><header><h1>42ndMind Coefficient/Dimension Revision</h1><div class="muted">Stages v0003 candidate formula revisions with split dimensions. Source formulas stay intact. Candidate only.</div></header><main><section><a href="index.html">main</a> · <a href="intention-dimension-splitting-v0-1-1.html?v=split-2">dimension splitting</a> · <a href="kernel-intention-coefficient-dimension-revision-engine-v0-1-test.html?v=codim-1">test</a><p>Decision: <b id="decisionMetric">not run</b></p><p>Staged revisions: <b id="revisionMetric">0</b></p><p>Source split candidates: <b id="splitMetric">0</b></p><button onclick="runRevisions()">Run revision engine</button><button onclick="showPacket()">Show packet</button><button onclick="showSummary()">Show summary</button><button onclick="copyOutput()">Copy output</button><div id="cards"></div></section><section><h2>Output</h2><pre id="out">No output yet.</pre></section></main><script src="src/kernel-intention-discovery-v0-1.js?v=intent-1"></script><script src="src/kernel-intention-refinement-v0-1.js?v=refine-1"></script><script src="src/kernel-intention-necessity-test-v0-1.js?v=necessity-1"></script><script src="src/kernel-intention-neighbor-lattice-v0-1.js?v=lattice-3"></script><script src="src/kernel-intention-lattice-invariance-benchmark-v0-1.js?v=invariance-2"></script><script src="src/kernel-intention-formula-compiler-v0-1.js?v=formula-1"></script><script src="src/kernel-intention-concept-expansion-loop-v0-1.js?v=expansion-2"></script><script src="src/kernel-intention-contradiction-refinement-loop-v0-1.js?v=contradiction-1"></script><script src="src/kernel-intention-formula-revision-engine-v0-1.js?v=revision-1"></script><script src="src/kernel-intention-canonical-formula-ledger-v0-1.js?v=ledger-1"></script><script src="src/kernel-intention-proof-output-v0-1.js?v=proof-1"></script><script src="src/kernel-intention-minimal-pair-library-v0-1.js?v=minpair-1"></script><script src="src/kernel-intention-dimension-splitting-v0-1.js?v=split-2"></script><script src="src/kernel-intention-coefficient-dimension-revision-engine-v0-1.js?v=codim-1"></script><script>let packet=null,last='';function esc(v){return String(v??'').replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]))}function arr(v){return Array.isArray(v)?v:[]}function setOut(v){last=typeof v==='string'?v:JSON.stringify(v,null,2);document.getElementById('out').textContent=last}function runRevisions(){const decisionEl=document.getElementById('decisionMetric');try{packet=KernelIntentionCoefficientDimensionRevisionEngineV01.runRevisionEngine();decisionEl.textContent=packet.ok?'COEFFICIENT_DIMENSION_REVISIONS_READY':'HELD_FOR_REVIEW';decisionEl.className=packet.ok?'ok':'bad';document.getElementById('revisionMetric').textContent=packet.staged_revision_count;document.getElementById('splitMetric').textContent=packet.source_split_candidate_count;renderCards();showSummary()}catch(e){decisionEl.textContent='ERROR';decisionEl.className='bad';setOut({ok:false,error:e.message,belief_movement:'none'})}}function renderCards(){document.getElementById('cards').innerHTML=arr(packet&&packet.staged_revisions).map(r=>`<div class="card"><h3>${esc(r.concept)} · ${esc(r.doctrine_status)}</h3><p><span class="pill safe">splits ${esc(r.applied_split_candidate_count)}</span><span class="pill safe">dims ${esc(r.source_dimension_count)}→${esc(r.revised_dimension_count)}</span><span class="pill safe">L1 ${esc(r.revised_l1_total)}</span><span class="pill safe">mass ${esc(r.mass_change)}</span><span class="pill safe">coef Δ ${esc(r.coefficient_delta_total)}</span></p><pre>${esc(r.revised_symbolic_formula)}</pre><div class="rev"><b>Rollback:</b> ${esc(r.rollback_available)} · <b>Action:</b> ${esc(r.action_status)} · <b>Promotion:</b> ${esc(r.promotion_status)}</div></div>`).join('')||'No staged revisions.'}function summary(){return{packet_type:'42ndMind_intention_coefficient_dimension_revision_summary_view_v0_1',ok:packet&&packet.ok,source_split_ok:packet&&packet.source_split_ok,source_split_candidate_count:packet&&packet.source_split_candidate_count,source_ledger_ok:packet&&packet.source_ledger_ok,source_ledger_record_count:packet&&packet.source_ledger_record_count,staged_revision_count:packet&&packet.staged_revision_count,staged_revisions:arr(packet&&packet.staged_revisions).map(r=>({concept:r.concept,revision_id:r.revision_id,applied_split_candidate_count:r.applied_split_candidate_count,source_dimension_count:r.source_dimension_count,revised_dimension_count:r.revised_dimension_count,source_l1_total:r.source_l1_total,revised_l1_total:r.revised_l1_total,mass_change:r.mass_change,coefficient_delta_total:r.coefficient_delta_total,force_terms_outside_shape:r.force_terms_outside_shape,promotion_status:r.promotion_status,belief_movement:r.belief_movement})),validation:packet&&packet.validation,belief_movement:'none'}}function showSummary(){if(!packet)return runRevisions();setOut(summary())}function showPacket(){if(!packet)return runRevisions();setOut(packet)}async function copyOutput(){try{await navigator.clipboard.writeText(last);document.getElementById('out').textContent='Copied.\n\n'+last}catch(e){}}runRevisions();</script></body></html>
