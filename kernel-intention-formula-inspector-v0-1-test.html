<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>42ndMind Formula Inspector Test</title><style>body{margin:0;background:#0f1115;color:#eef2ff;font:14px ui-monospace,Menlo,Consolas,monospace}header{padding:16px;background:#11141b;border-bottom:1px solid #2a3040}main{padding:12px}section{background:#171a21;border:1px solid #2a3040;border-radius:10px;padding:12px}pre{white-space:pre-wrap;background:#0d1016;border:1px solid #2a3040;border-radius:10px;padding:10px;overflow:auto;max-height:760px}.ok{color:#9dffb4}.bad{color:#ff8b8b}a{color:#9db6ff}</style></head><body><header><h1>42ndMind Formula Inspector Test</h1><div>Tests read-only formula inspection for current candidate algebraic memory. Candidate only.</div></header><main><section><h2 id="summary">Running...</h2><div><a href="intention-formula-inspector.html?v=inspect-1">formula inspector page</a></div><pre id="out"></pre></section></main><script src="src/kernel-intention-discovery-v0-1.js?v=intent-1"></script><script src="src/kernel-intention-refinement-v0-1.js?v=refine-1"></script><script src="src/kernel-intention-necessity-test-v0-1.js?v=necessity-1"></script><script src="src/kernel-intention-neighbor-lattice-v0-1.js?v=lattice-3"></script><script src="src/kernel-intention-lattice-invariance-benchmark-v0-1.js?v=invariance-2"></script><script src="src/kernel-intention-formula-compiler-v0-1.js?v=formula-1"></script><script src="src/kernel-intention-concept-expansion-loop-v0-1.js?v=expansion-2"></script><script src="src/kernel-intention-contradiction-refinement-loop-v0-1.js?v=contradiction-1"></script><script src="src/kernel-intention-formula-revision-engine-v0-1.js?v=revision-1"></script><script src="src/kernel-intention-canonical-formula-ledger-v0-1.js?v=ledger-1"></script><script src="src/kernel-intention-proof-output-v0-1.js?v=proof-1"></script><script src="src/kernel-intention-minimal-pair-library-v0-1.js?v=minpair-1"></script><script src="src/kernel-intention-dimension-splitting-v0-1.js?v=split-2"></script><script src="src/kernel-intention-coefficient-dimension-revision-engine-v0-1.js?v=codim-1"></script><script src="src/kernel-intention-canonical-formula-ledger-v0-1-1-patch.js?v=ledger-2"></script><script src="src/kernel-intention-formula-inspector-v0-1.js?v=inspect-1"></script><script>const tests=[];let packet=null;function add(n,f){tests.push({name:n,fn:f})}function assert(c,m){if(!c)throw new Error(m)}function arr(v){return Array.isArray(v)?v:[]}function inspections(){return arr(packet&&packet.inspections)}add('modules load and doctrine is read-only inspector',()=>{assert(window.KernelIntentionFormulaInspectorV01,'formula inspector missing');assert(KernelIntentionFormulaInspectorV01.VERSION==='0.1.0','version wrong');assert(typeof KernelIntentionFormulaInspectorV01.inspectAll==='function','inspectAll missing');assert(typeof KernelIntentionFormulaInspectorV01.inspectConcept==='function','inspectConcept missing');const d=KernelIntentionFormulaInspectorV01.doctrine();assert(d.inspector_is_read_only===true,'read-only doctrine missing');assert(d.exposes_formula_memory_without_promoting_it===true,'candidate exposure guard missing');assert(d.shows_all_versions_v0001_v0002_v0003===true,'version doctrine missing');assert(d.shows_shape_terms_and_force_terms_separately===true,'shape/force guard missing');assert(d.belief_movement==='none','belief movement wrong')});add('inspector runs from ledger v0.1.1 and proof output',()=>{packet=KernelIntentionFormulaInspectorV01.inspectAll();assert(packet.ok===true,'packet not ok: '+JSON.stringify(packet.validation));assert(packet.source_ledger_ok===true,'source ledger not ok');assert(packet.source_ledger_record_count===11,'expected 11 ledger records');assert(packet.source_proof_ok===true,'source proof not ok');assert(packet.source_proof_count===11,'expected 11 proof rows');assert(packet.belief_movement==='none','packet moved belief')});add('eleven concepts are inspectable',()=>{assert(packet.inspection_count===11,'expected 11 inspections');assert(inspections().length===11,'expected 11 inspection rows');assert(packet.validation.checks.eleven_inspections===true,'eleven inspections check failed')});add('each concept exposes three formula versions',()=>{inspections().forEach(i=>{assert(i.version_count>=3,i.concept+' version count < 3');assert(i.version_types.includes('compiled_formula'),i.concept+' missing compiled formula');assert(i.version_types.includes('staged_revision'),i.concept+' missing staged revision');assert(i.version_types.includes('coefficient_dimension_revision'),i.concept+' missing coefficient dimension revision')});assert(packet.validation.checks.all_have_three_versions===true,'three version check failed')});add('current candidate is v0003 with symbolic formula',()=>{inspections().forEach(i=>{assert(i.current_candidate_version.includes('v0003_coefficient_dimension_revision'),i.concept+' current candidate not v0003');assert(i.current_candidate&&i.current_candidate.symbolic_formula,i.concept+' missing current symbolic formula');assert(i.current_candidate.shape_term_count===10,i.concept+' current shape term count not 10')});assert(packet.validation.checks.current_candidate_is_v0003===true,'current candidate check failed')});add('L1 and force separation are visible and valid',()=>{inspections().forEach(i=>{assert(i.current_candidate.l1_total===1,i.concept+' current L1 wrong: '+i.current_candidate.l1_total);assert(i.current_candidate.force_terms_outside_shape===true,i.concept+' force leaked into shape');assert(i.current_candidate.force_equation&&i.current_candidate.force_equation.includes('F_'),i.concept+' missing force equation')});assert(packet.validation.checks.all_current_l1_totals_equal_1===true,'L1 check failed');assert(packet.validation.checks.all_force_terms_outside_shape===true,'force check failed')});add('proof references and rollback data are present',()=>{inspections().forEach(i=>{assert(i.proof_reference&&i.proof_reference.proof_id,i.concept+' missing proof reference');assert(i.rollback_available===true,i.concept+' rollback unavailable');assert(arr(i.rollback_targets).length>=2,i.concept+' rollback targets missing');assert(arr(i.revision_trail).length>=1,i.concept+' revision trail missing')});assert(packet.validation.checks.all_have_proof_reference===true,'proof reference check failed')});add('read-only candidate-only status and belief movement are preserved',()=>{inspections().forEach(i=>{assert(i.promotion_status==='not_promoted',i.concept+' promoted');assert(i.doctrine_status==='candidate_not_doctrine',i.concept+' doctrine status wrong');assert(i.belief_movement==='none',i.concept+' moved belief');arr(i.versions).forEach(v=>{assert(v.promotion_status==='not_promoted',i.concept+' '+v.version_id+' promoted');assert(v.doctrine_status==='candidate_not_doctrine',i.concept+' '+v.version_id+' doctrine status wrong')})});assert(packet.validation.checks.read_only_candidate_not_promoted===true,'candidate-only check failed');assert(packet.validation.checks.belief_movement_none===true,'belief movement check failed');assert(arr(packet.validation.errors).length===0,'validation errors present: '+packet.validation.errors.join(','))});(async function run(){const results=[];for(const t of tests){try{await t.fn();results.push({name:t.name,passed:true})}catch(e){results.push({name:t.name,passed:false,error:e.message})}}const passed=results.filter(r=>r.passed).length;document.getElementById('summary').className=passed===tests.length?'ok':'bad';document.getElementById('summary').textContent=passed+'/'+tests.length+' passed';document.getElementById('out').textContent=JSON.stringify({packet_type:'42ndMind_intention_formula_inspector_test_report_v0_1',ok:passed===tests.length,source_ledger_record_count:packet&&packet.source_ledger_record_count,source_proof_count:packet&&packet.source_proof_count,inspection_count:packet&&packet.inspection_count,inspections:inspections().map(i=>({concept:i.concept,current_candidate_version:i.current_candidate_version,version_count:i.version_count,version_types:i.version_types,current_l1_total:i.current_candidate&&i.current_candidate.l1_total,current_shape_term_count:i.current_candidate&&i.current_candidate.shape_term_count,force_terms_outside_shape:i.current_candidate&&i.current_candidate.force_terms_outside_shape,proof_reference:i.proof_reference&&i.proof_reference.proof_id,belief_movement:i.belief_movement})),validation:packet&&packet.validation,results},null,2)})();</script></body></html>
