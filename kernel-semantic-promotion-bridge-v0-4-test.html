<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>42ndMind Semantic Promotion Bridge v0.4 Test</title>
  <style>
    body { margin:0; font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; background:#0f1115; color:#eef2ff; }
    header { padding:16px 18px; border-bottom:1px solid #2a3040; background:#11141b; }
    main { padding:12px; }
    section { background:#171a21; border:1px solid #2a3040; border-radius:10px; padding:12px; }
    h1 { font:700 19px/1.2 system-ui,-apple-system,Segoe UI,sans-serif; margin:0 0 4px; }
    pre { white-space:pre-wrap; background:#0d1016; border:1px solid #2a3040; border-radius:10px; padding:10px; overflow:auto; max-height:760px; }
    .ok { color:#9dffb4; } .bad { color:#ff8b8b; } a { color:#9db6ff; }
  </style>
</head>
<body>
<header><h1>42ndMind Semantic Promotion Bridge v0.4 Test</h1><div>Tests stable semantic invariants through promotion pipeline and patch-plan generation without execution.</div></header>
<main><section><h2 id="summary">Running...</h2><div><a href="kernel-semantic-invariant-learner-v0-4-test.html">semantic learner test</a> · <a href="kernel-promotion-pipeline-v0-4-test.html">promotion test</a> · <a href="kernel-patch-candidate-v0-4-test.html">patch planner test</a></div><pre id="out"></pre></section></main>
<script src="src/kernel-epistemic-governor-v0-1.js?v=0.1.0"></script>
<script src="src/kernel-epistemic-governor-v0-1-1-patch.js?v=0.1.1"></script>
<script src="src/kernel-epistemic-governor-v0-1-2-patch.js?v=0.1.2"></script>
<script src="src/kernel-self-maintenance-v0-4.js?v=0.4.0"></script>
<script src="src/kernel-promotion-pipeline-v0-4.js?v=0.4.0"></script>
<script src="src/kernel-promotion-pipeline-v0-4-1-patch.js?v=0.4.1"></script>
<script src="src/kernel-patch-candidate-v0-4.js?v=0.4.0"></script>
<script src="src/kernel-semantic-invariant-learner-v0-4.js?v=0.4.0"></script>
<script src="src/kernel-semantic-promotion-bridge-v0-4.js?v=0.4.0"></script>
<script>
  const tests = [];
  const TEST_KEY = '42ndMind_semantic_promotion_bridge_v0_4_test';
  function add(name, fn) { tests.push({ name, fn }); }
  function assert(cond, msg) { if (!cond) throw new Error(msg); }
  function samplePacket(){ return KernelSemanticPromotionBridgeV04.sampleProposalPacket(); }

  add('module loads', () => {
    assert(window.KernelSemanticPromotionBridgeV04, 'KernelSemanticPromotionBridgeV04 missing');
    assert(KernelSemanticPromotionBridgeV04.VERSION === '0.4.0', 'wrong bridge version');
    assert(KernelSemanticPromotionBridgeV04.DECISIONS.PROMOTION_BRIDGE_READY === 'PROMOTION_BRIDGE_READY', 'decisions missing');
  });

  add('normalizes proposal with semantic metadata', () => {
    const p = KernelSemanticPromotionBridgeV04.normalizeProposal({ id:'p1', title:'t', target_layer:'semantic_invariant_adapter', proposed_change:'change' });
    assert(p.meta.semantic_promotion_bridge === true, 'semantic bridge meta missing');
    assert(p.meta.invariant_is_candidate_not_doctrine === true, 'candidate-not-doctrine meta missing');
    assert(p.meta.no_direct_self_patch === true, 'no direct patch meta missing');
    assert(p.tests_required.length > 0, 'default tests missing');
  });

  add('sample semantic proposal evaluates through promotion pipeline', () => {
    const report = KernelSemanticPromotionBridgeV04.evaluate(samplePacket());
    assert(report.decision === 'PROMOTION_BRIDGE_READY', 'bridge should be ready');
    assert(report.proposal_count === 1, 'proposal count wrong');
    assert(report.promotion_batch && report.promotion_batch.count === 1, 'promotion batch missing');
    assert(report.belief_movement === 'none', 'bridge moved belief');
  });

  add('semantic invariant adapter becomes patch candidate only', () => {
    const report = KernelSemanticPromotionBridgeV04.evaluate(samplePacket());
    assert(report.promotion_batch.reports[0].decision === 'PATCH_CANDIDATE_ONLY', 'semantic adapter should become patch candidate only');
    assert(report.promotion_batch.summary.patch_candidate_only === 1, 'patch candidate summary wrong');
    assert(report.promotion_effect.source_rewritten === false, 'source rewritten');
    assert(report.promotion_effect.runtime_enabled === false, 'runtime enabled');
  });

  add('bridge can generate patch plans without source writes', () => {
    const report = KernelSemanticPromotionBridgeV04.stableToPatchPlans(samplePacket());
    assert(report.packet_type === '42ndMind_semantic_promotion_bridge_patch_plan_report_v0_4', 'wrong patch plan report type');
    assert(report.patch_plan_count === 1, 'patch plan count wrong');
    assert(report.patch_plans_are_not_source_writes === true, 'patch plan write doctrine missing');
    assert(report.patch_plans[0].application_state.source_rewritten === false, 'patch plan rewrote source');
  });

  add('empty proposal packet holds safely', () => {
    const report = KernelSemanticPromotionBridgeV04.evaluate({ packet_type:'42ndMind_semantic_invariant_proposals_v0_4', proposals:[] });
    assert(report.decision === 'HOLD_NO_STABLE_INVARIANTS', 'empty packet should hold');
    assert(report.promotion_batch === null, 'empty packet should not evaluate batch');
  });

  add('bridge can pull stable proposals from learner ledger', () => {
    KernelSemanticInvariantLearnerV04.clear(TEST_KEY);
    KernelSemanticInvariantLearnerV04.record(KernelSemanticInvariantLearnerV04.sampleInput('closure'), { key:TEST_KEY, confirmed:true, min_observations:3 });
    KernelSemanticInvariantLearnerV04.record(KernelSemanticInvariantLearnerV04.sampleInput('closure'), { key:TEST_KEY, confirmed:true, min_observations:3 });
    KernelSemanticInvariantLearnerV04.record(KernelSemanticInvariantLearnerV04.sampleInput('closure'), { key:TEST_KEY, confirmed:true, min_observations:3 });
    const report = KernelSemanticPromotionBridgeV04.evaluate(TEST_KEY, { key:TEST_KEY });
    assert(report.decision === 'PROMOTION_BRIDGE_READY', 'ledger stable proposals should bridge ready');
    assert(report.proposal_count > 0, 'ledger proposal count missing');
  });

  add('doctrine preserves evaluation-only boundary', () => {
    const report = KernelSemanticPromotionBridgeV04.evaluate(samplePacket());
    assert(report.doctrine.semantic_invariant_promotion_is_evaluation_only === true, 'evaluation-only doctrine missing');
    assert(report.doctrine.stable_invariant_is_not_live_doctrine === true, 'not live doctrine missing');
    assert(report.doctrine.bridge_does_not_patch_source === true, 'source patch doctrine missing');
    assert(report.doctrine.bridge_does_not_move_belief === true, 'belief doctrine missing');
  });

  add('cleanup clears learner ledger', () => {
    const cleared = KernelSemanticInvariantLearnerV04.clear(TEST_KEY);
    assert(cleared.ok === true, 'clear failed');
    assert(KernelSemanticInvariantLearnerV04.load(TEST_KEY).observations.length === 0, 'ledger not cleared');
  });

  const results = tests.map(t => { try { t.fn(); return { name:t.name, passed:true }; } catch(e) { return { name:t.name, passed:false, error:e.message }; } });
  const passed = results.filter(r => r.passed).length;
  document.getElementById('summary').className = passed === results.length ? 'ok' : 'bad';
  document.getElementById('summary').textContent = `${passed}/${results.length} passed`;
  document.getElementById('out').textContent = JSON.stringify({ packet_type:'42ndMind_semantic_promotion_bridge_v0_4_test_report', results }, null, 2);
</script>
</body>
</html>
