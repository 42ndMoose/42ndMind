<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>42ndMind Maturity Classification Test v0.1.2</title>
  <style>
    body { margin:0; font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; background:#0f1115; color:#eef2ff; }
    header { padding:16px 18px; border-bottom:1px solid #2a3040; background:#11141b; }
    main { padding:12px; }
    section { background:#171a21; border:1px solid #2a3040; border-radius:10px; padding:12px; }
    h1 { font:700 19px/1.2 system-ui,-apple-system,Segoe UI,sans-serif; margin:0 0 4px; }
    pre { white-space:pre-wrap; background:#0d1016; border:1px solid #2a3040; border-radius:10px; padding:10px; overflow:auto; }
    .ok { color:#9dffb4; } .bad { color:#ff8b8b; }
  </style>
</head>
<body>
<header><h1>42ndMind Maturity Classification Test v0.1.2</h1><div>Checks exact classification after v0.1.2 patch.</div></header>
<main><section><h2 id="summary">Running...</h2><pre id="out"></pre></section></main>
<script src="src/maturity-objective-v0-1.js?v=0.1.0"></script>
<script src="src/maturity-objective-v0-1-1-patch.js?v=0.1.1"></script>
<script src="src/maturity-objective-v0-1-2-patch.js?v=0.1.2"></script>
<script>
  function gates(v) { return { counter_consideration:v, non_strawman:v, self_correction:v, contradiction_handling:v, reality_contact:v, non_self_sealing:v }; }
  const tests = [];
  function add(name, fn) { tests.push({ name, fn }); }
  function assert(cond, msg) { if (!cond) throw new Error(msg); }
  function base(extra = {}) {
    return Object.assign({ x:0, y:1, z:0, evidence_count:4, supporting_evidence_count:4, attacking_evidence_count:1, source_registry_summary:{ available:true, source_count:2, unresolved_source_questions:0 }, gates:gates(1) }, extra);
  }

  add('patch installed', () => {
    assert(window.MaturityObjectiveV012PatchStatus?.installed === true, 'v0.1.2 patch missing');
    assert(MaturityObjectiveV01.VERSION === '0.1.2-patch', 'wrong objective version');
  });
  add('partial non-self-sealing gate is gate_limited, not self_sealing_capped', () => {
    const g = gates(1); g.non_self_sealing = 0.5;
    const r = MaturityObjectiveV01.assess(base({ gates:g }));
    assert(r.caps.some(c => c.reason === 'partial_gate_non_self_sealing'), 'missing partial non-self-sealing cap');
    assert(!r.caps.some(c => c.reason === 'self_sealing_pressure'), 'unexpected actual self-sealing pressure');
    assert(r.classification === 'gate_limited', `wrong classification: ${r.classification}`);
  });
  add('actual self-sealing pressure remains self_sealing_capped', () => {
    const r = MaturityObjectiveV01.assess(base({ self_sealing_flags:1 }));
    assert(r.caps.some(c => c.reason === 'self_sealing_pressure'), 'missing self-sealing pressure');
    assert(r.classification === 'self_sealing_capped', `wrong classification: ${r.classification}`);
  });
  add('motive pressure remains motive_overclaim_capped', () => {
    const r = MaturityObjectiveV01.assess(base({ motive_overclaim_flags:1 }));
    assert(r.classification === 'motive_overclaim_capped', `wrong classification: ${r.classification}`);
  });
  add('unresolved contradiction remains unresolved_pressure_capped', () => {
    const r = MaturityObjectiveV01.assess(base({ unresolved_contradiction_count:1 }));
    assert(r.classification === 'unresolved_pressure_capped', `wrong classification: ${r.classification}`);
  });

  const results = tests.map(t => { try { t.fn(); return { name:t.name, passed:true }; } catch(e) { return { name:t.name, passed:false, error:e.message }; } });
  const passed = results.filter(r => r.passed).length;
  document.getElementById('summary').className = passed === results.length ? 'ok' : 'bad';
  document.getElementById('summary').textContent = `${passed}/${results.length} passed`;
  document.getElementById('out').textContent = JSON.stringify({ packet_type:'42ndMind_maturity_classification_test_report', test_version:'0.1.2', results }, null, 2);
</script>
</body>
</html>
