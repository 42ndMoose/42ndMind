<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>42ndMind Intention Formula Revision</title><style>body{margin:0;background:#0f1115;color:#eef2ff;font:14px ui-monospace,Menlo,Consolas,monospace}header{padding:16px 18px;background:#11141b;border-bottom:1px solid #2a3040}main{padding:12px;display:grid;grid-template-columns:470px 1fr;gap:12px}section{background:#171a21;border:1px solid #2a3040;border-radius:10px;padding:12px}button{background:#25345c;color:#eef2ff;border:1px solid #3f5592;padding:8px 10px;border-radius:8px;cursor:pointer;margin:3px 3px 8px 0}pre{white-space:pre-wrap;background:#0d1016;border:1px solid #2a3040;border-radius:10px;padding:10px;overflow:auto;max-height:760px}.ok{color:#9dffb4}.bad{color:#ff8b8b}.muted{color:#8b93a7}a{color:#9db6ff}.card{background:#10131a;border:1px solid #2a3040;border-radius:10px;padding:10px;margin:10px 0}.guard{border-top:1px solid #252b3a;padding:5px 0}.pill{display:inline-block;border:1px solid #2a3040;border-radius:999px;padding:1px 7px;margin:2px}.guarded{color:#ffd28b}.safe{color:#9dffb4}@media(max-width:900px){main{grid-template-columns:1fr}}</style></head><body><header><h1>42ndMind Intention Formula Revision</h1><div class="muted">Staged formula revision candidates from contradiction/refinement pressure. Source formulas are not mutated. Candidate only.</div></header><main><section><a href="index.html">main</a> · <a href="intention-contradiction-refinement.html?v=contradiction-1">pressure loop</a> · <a href="kernel-intention-formula-revision-engine-v0-1-test.html?v=revision-1">test</a><p>Decision: <b id="decisionMetric">not run</b></p><p>Candidates: <b id="candidateMetric">0</b></p><p>Guarded: <b id="guardedMetric">0</b></p><button onclick="runRevision()">Run revision engine</button><button onclick="showPacket()">Show packet</button><button onclick="showSummary()">Show summary</button><button onclick="copyOutput()">Copy output</button><div id="cards"></div></section><section><h2>Output</h2><pre id="out">No output yet.</pre></section></main><script src="src/kernel-intention-discovery-v0-1.js?v=intent-1"></script><script src="src/kernel-intention-refinement-v0-1.js?v=refine-1"></script><script src="src/kernel-intention-necessity-test-v0-1.js?v=necessity-1"></script><script src="src/kernel-intention-neighbor-lattice-v0-1.js?v=lattice-3"></script><script src="src/kernel-intention-lattice-invariance-benchmark-v0-1.js?v=invariance-2"></script><script src="src/kernel-intention-formula-compiler-v0-1.js?v=formula-1"></script><script src="src/kernel-intention-concept-expansion-loop-v0-1.js?v=expansion-1"></script><script src="src/kernel-intention-contradiction-refinement-loop-v0-1.js?v=contradiction-1"></script><script src="src/kernel-intention-formula-revision-engine-v0-1.js?v=revision-1"></script><script>let packet=null,last='';function esc(v){return String(v??'').replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]))}function setOut(v){last=typeof v==='string'?v:JSON.stringify(v,null,2);document.getElementById('out').textContent=last}function runRevision(){const decisionEl=document.getElementById('decisionMetric');try{packet=KernelIntentionFormulaRevisionEngineV01.runRevisionEngine();decisionEl.textContent=packet.ok?'STAGED_REVISIONS_READY':'HELD';decisionEl.className=packet.ok?'ok':'bad';document.getElementById('candidateMetric').textContent=packet.revision_candidate_count;document.getElementById('guardedMetric').textContent=packet.guarded_revision_count;renderCards();showSummary()}catch(e){decisionEl.textContent='ERROR';decisionEl.className='bad';setOut({ok:false,error:e.message,belief_movement:'none'})}}function renderCards(){document.getElementById('cards').innerHTML=(packet&&packet.revision_candidates||[]).map(c=>`<div class="card"><h3>${esc(c.concept)} · ${esc(c.staged_review_status)}</h3><p><span class="pill safe">L1 ${esc(c.revised_l1_total)}</span><span class="pill ${c.revision_adds_guards?'guarded':'safe'}">guards ${esc(c.revision_guards.length)}</span><span class="pill">${esc(c.action_status)}</span></p><pre>${esc(c.revised_symbolic_formula)}</pre>${c.revision_guards.map(g=>`<div class="guard"><b>${esc(g.guard_type)}</b><br>${esc(g.guard_expression)}<br><span class="muted">${esc(g.source_pair)} · ${esc(g.pressure_type)}</span></div>`).join('')}</div>`).join('')||'No staged revisions.'}function summary(){return{packet_type:'42ndMind_intention_formula_revision_summary_view_v0_1',ok:packet&&packet.ok,source_expansion_ok:packet&&packet.source_expansion_ok,source_loop_ok:packet&&packet.source_loop_ok,source_compiled_formula_count:packet&&packet.source_compiled_formula_count,revision_candidate_count:packet&&packet.revision_candidate_count,guarded_revision_count:packet&&packet.guarded_revision_count,candidates:(packet&&packet.revision_candidates||[]).map(c=>({concept:c.concept,source_l1_total:c.source_l1_total,revised_l1_total:c.revised_l1_total,guard_count:c.revision_guards.length,revision_adds_guards:c.revision_adds_guards,action_status:c.action_status,promotion_status:c.promotion_status,belief_movement:c.belief_movement})),validation:packet&&packet.validation,belief_movement:'none'}}function showSummary(){if(!packet)return runRevision();setOut(summary())}function showPacket(){if(!packet)return runRevision();setOut(packet)}async function copyOutput(){try{await navigator.clipboard.writeText(last);document.getElementById('out').textContent='Copied.\n\n'+last}catch(e){}}runRevision();</script></body></html>
