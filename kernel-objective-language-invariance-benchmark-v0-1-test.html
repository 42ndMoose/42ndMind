<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>42ndMind Objective Language Invariance Benchmark Test</title>
  <style>
    body{margin:0;font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:#0f1115;color:#eef2ff}
    header{padding:16px 18px;border-bottom:1px solid #2a3040;background:#11141b}
    main{padding:12px}section{background:#171a21;border:1px solid #2a3040;border-radius:10px;padding:12px}
    h1{font:700 19px/1.2 system-ui,-apple-system,Segoe UI,sans-serif;margin:0 0 4px}
    pre{white-space:pre-wrap;background:#0d1016;border:1px solid #2a3040;border-radius:10px;padding:10px;overflow:auto;max-height:760px}.ok{color:#9dffb4}.bad{color:#ff8b8b}a{color:#9db6ff}
  </style>
</head>
<body>
<header><h1>42ndMind Objective Language Invariance Benchmark Test</h1><div>Fixed pilot benchmark for paraphrase, translation-like invariance, role separation, force separation, and nested unit-total preservation.</div></header>
<main><section><h2 id="summary">Running...</h2><div><a href="objective-language-invariance-benchmark.html">benchmark page</a> · <a href="unit-total-nested-shape.html">unit-total page</a></div><pre id="out"></pre></section></main>
<script src="src/kernel-unit-total-nested-shape-v0-1.js?v=0.1.0"></script>
<script src="src/kernel-objective-language-shape-bridge-v0-1.js?v=0.1.0"></script>
<script src="src/kernel-objective-language-invariance-benchmark-v0-1.js?v=0.1.0"></script>
<script>
  const tests=[]; let packet=null;
  function add(name,fn){tests.push({name,fn});}
  function assert(cond,msg){if(!cond)throw new Error(msg);}
  function group(id){return packet.group_reports.find(g=>g.group_id===id);}

  add('modules load',()=>{
    assert(window.KernelUnitTotalNestedShapeV01,'unit-total kernel missing');
    assert(window.KernelObjectiveLanguageShapeBridgeV01,'shape bridge missing');
    assert(window.KernelObjectiveLanguageInvarianceBenchmarkV01,'benchmark missing');
    assert(KernelObjectiveLanguageInvarianceBenchmarkV01.VERSION==='0.1.0','benchmark version wrong');
  });

  add('doctrine preserves pilot status and no belief movement',()=>{
    const d=KernelObjectiveLanguageInvarianceBenchmarkV01.doctrine();
    assert(d.benchmark_is_pilot_validation_not_final_scientific_proof===true,'pilot status doctrine missing');
    assert(d.active_shape_l1_total==='sum_abs_dimensions_equals_1','active shape doctrine missing');
    assert(d.minimal_pairs_should_split_when_role_changes===true,'minimal pair doctrine missing');
    assert(d.force_intensity_remains_separate_from_shape===true,'force separation doctrine missing');
    assert(d.belief_movement==='none','belief movement doctrine wrong');
  });

  add('load and run benchmark succeeds',async()=>{
    packet=await KernelObjectiveLanguageInvarianceBenchmarkV01.loadAndRun();
    assert(packet.ok===true,'benchmark packet not ok');
    assert(packet.summary.group_count===5,'expected 5 benchmark groups');
    assert(packet.summary.passed_group_count===5,'expected all groups to pass');
    assert(packet.summary.pass_rate===1,'expected pass rate 1');
    assert(packet.belief_movement==='none','benchmark moved belief');
  });

  add('same-structure group preserves anonymous signature',()=>{
    const row=group('general_unresolved_invariance');
    assert(row&&row.passed===true,'same-structure group failed');
    assert(row.signature_count===1,'same-structure group should have one signature');
    assert(row.variant_count===4,'expected 4 variants');
  });

  add('status-negation minimal pairs split',()=>{
    const row=group('status_negation_minimal_pairs');
    assert(row&&row.passed===true,'status minimal-pair group failed');
    assert(row.signature_count===row.variant_count,'status minimal pairs should all split');
  });

  add('coordination/collusion minimal pairs split',()=>{
    const row=group('coordination_collusion_minimal_pairs');
    assert(row&&row.passed===true,'coordination/collusion group failed');
    assert(row.signature_count===row.variant_count,'coordination and collusion should split');
  });

  add('force changes without shape change',()=>{
    const row=group('force_shape_separation');
    assert(row&&row.passed===true,'force group failed');
    assert(row.signature_count===1,'force variants should keep same shape signature');
    assert(new Set(row.force_values.map(String)).size>1,'force values should differ');
  });

  add('nested unit-total preserves parent and child local ones',()=>{
    const row=group('nested_refinement_unit_total');
    assert(row&&row.passed===true,'nested group failed');
    assert(row.root_l1===1,'root L1 should be 1');
    assert(row.flattened_l1===1,'flattened L1 should be 1');
    assert(row.child_scopes.every(s=>s.local_l1===1),'all child scopes should have local L1 1');
  });

  add('scientific status is honest pilot validation',()=>{
    assert(packet.summary.scientific_status==='pilot_internal_validation_passed_not_final_scientific_proof','scientific status wording wrong');
    assert(packet.summary.benchmark_claim_supported===true,'benchmark claim not supported');
    assert(packet.doctrine.benchmark_is_pilot_validation_not_final_scientific_proof===true,'final-proof guard missing');
  });

  (async function run(){
    const results=[];
    for(const t of tests){try{await t.fn();results.push({name:t.name,passed:true});}catch(e){results.push({name:t.name,passed:false,error:e.message});}}
    const passed=results.filter(r=>r.passed).length;
    document.getElementById('summary').className=passed===results.length?'ok':'bad';
    document.getElementById('summary').textContent=`${passed}/${results.length} passed`;
    document.getElementById('out').textContent=JSON.stringify({
      packet_type:'42ndMind_objective_language_invariance_benchmark_v0_1_test_report',
      benchmark_summary:packet&&packet.summary,
      group_reports:packet&&packet.group_reports,
      results
    },null,2);
  })();
</script>
</body>
</html>
