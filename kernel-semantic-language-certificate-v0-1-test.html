<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>42ndMind Semantic Language Certificate v0.1 Test</title>
  <style>
    body { margin:0; font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; background:#0f1115; color:#eef2ff; }
    header { padding:16px 18px; border-bottom:1px solid #2a3040; background:#11141b; }
    main { padding:12px; }
    section { background:#171a21; border:1px solid #2a3040; border-radius:10px; padding:12px; }
    h1 { font:700 19px/1.2 system-ui,-apple-system,Segoe UI,sans-serif; margin:0 0 4px; }
    pre { white-space:pre-wrap; background:#0d1016; border:1px solid #2a3040; border-radius:10px; padding:10px; overflow:auto; max-height:760px; }
    .ok { color:#9dffb4; } .bad { color:#ff8b8b; } a { color:#9db6ff; }
  </style>
</head>
<body>
<header><h1>42ndMind Semantic Language Certificate v0.1 Test</h1><div>Tests the zero-gap semantic-language certificate baseline.</div></header>
<main><section><h2 id="summary">Running...</h2><div><a href="semantic-language-certificate.html">semantic language certificate</a> · <a href="semantic-language-distiller.html">language distiller</a> · <a href="semantic-corpus-combiner.html">corpus combiner</a></div><pre id="out"></pre></section></main>
<script src="src/kernel-semantic-corpus-v0-1.js?v=0.1.0"></script>
<script src="src/kernel-semantic-corpus-combiner-v0-1.js?v=0.1.0"></script>
<script src="src/kernel-semantic-language-distiller-v0-1.js?v=0.1.0"></script>
<script>
  const tests = [];
  let distillation = null;
  let report = null;
  let rules = null;
  let combinedPacket = null;
  function add(name, fn) { tests.push({ name, fn }); }
  function assert(cond, msg) { if (!cond) throw new Error(msg); }
  function asArray(value) { return Array.isArray(value) ? value : []; }
  const EXTENSIONS = [
    'data/semantic_seed_closure_contrast_v0_1.json',
    'data/semantic_seed_authority_evidence_contrast_v0_1.json',
    'data/semantic_seed_motive_agency_weakmap_contrast_v0_1.json',
    'data/semantic_seed_scope_qualification_contrast_v0_1.json',
    'data/semantic_seed_closure_source_gap_contrast_v0_1.json',
    'data/semantic_seed_unverified_contrast_v0_1.json'
  ];
  function makeCertificate() {
    const sources = asArray(combinedPacket.combined && combinedPacket.combined.source_packets);
    const checks = {
      combined_entry_count_69: report.corpus_entry_count === 69,
      source_packet_count_7: sources.length === 7,
      contrast_gaps_zero: report.contrast_missing_count === 0,
      overmatch_risks_zero: report.overmatch_risk_count === 0,
      stable_mappings_at_least_71: report.stable_mapping_count >= 71,
      candidate_rules_match_stable_mappings: rules.rule_count === report.stable_mapping_count,
      no_belief_movement: report.belief_movement === 'none' && rules.belief_movement === 'none' && combinedPacket.combined.belief_movement === 'none'
    };
    const ok = Object.values(checks).every(Boolean);
    return {
      packet_type: '42ndMind_semantic_language_certificate_v0_1',
      status: ok ? 'CLEAN_SEMANTIC_LANGUAGE_BASELINE' : 'REVIEW_REQUIRED',
      metrics: {
        entries: report.corpus_entry_count,
        source_packets: sources.length,
        operators: report.unique_operator_count,
        pressures: report.unique_pressure_count,
        families: report.operator_family_count,
        stable_mappings: report.stable_mapping_count,
        weak_mappings: report.weak_mapping_count,
        candidate_rules: rules.rule_count,
        contrast_gaps: report.contrast_missing_count,
        overmatch_risks: report.overmatch_risk_count
      },
      checks,
      source_packets: sources,
      belief_movement: 'none'
    };
  }
  let certificate = null;

  add('modules load', () => {
    assert(window.KernelSemanticCorpusV01, 'KernelSemanticCorpusV01 missing');
    assert(window.KernelSemanticCorpusCombinerV01, 'KernelSemanticCorpusCombinerV01 missing');
    assert(window.KernelSemanticLanguageDistillerV01, 'KernelSemanticLanguageDistillerV01 missing');
  });

  add('load combined and distill succeeds', async () => {
    distillation = await KernelSemanticLanguageDistillerV01.loadCombinedAndDistill({ extension_urls: EXTENSIONS, min_observations: 2 });
    report = distillation.compact_report;
    rules = distillation.candidate_rules;
    combinedPacket = distillation.combined_packet;
    assert(distillation.ok === true, 'distillation not ok');
    assert(combinedPacket.ok === true, 'combined packet not ok');
  });

  add('certificate builds clean baseline', () => {
    certificate = makeCertificate();
    assert(certificate.packet_type === '42ndMind_semantic_language_certificate_v0_1', 'wrong certificate type');
    assert(certificate.status === 'CLEAN_SEMANTIC_LANGUAGE_BASELINE', 'certificate should be clean');
  });

  add('baseline metrics match zero-gap state', () => {
    assert(certificate.metrics.entries === 69, 'expected 69 entries');
    assert(certificate.metrics.source_packets === 7, 'expected 7 source packets');
    assert(certificate.metrics.contrast_gaps === 0, 'expected zero contrast gaps');
    assert(certificate.metrics.overmatch_risks === 0, 'expected zero overmatch risks');
    assert(certificate.metrics.stable_mappings >= 71, 'expected at least 71 stable mappings');
  });

  add('candidate rules mirror stable mappings', () => {
    assert(certificate.metrics.candidate_rules === certificate.metrics.stable_mappings, 'candidate rules should mirror stable mappings');
    assert(rules.rule_count === report.stable_mapping_count, 'rules/report mismatch');
  });

  add('no belief movement across packets', () => {
    assert(distillation.belief_movement === 'none', 'distillation moved belief');
    assert(report.belief_movement === 'none', 'report moved belief');
    assert(rules.belief_movement === 'none', 'rules moved belief');
    assert(combinedPacket.combined.belief_movement === 'none', 'combined corpus moved belief');
    assert(certificate.belief_movement === 'none', 'certificate moved belief');
  });

  add('source extension lineage is complete', () => {
    const sources = certificate.source_packets;
    assert(sources.some(s => s.source_label === 'main' && s.entry_count >= 32), 'main missing');
    assert(sources.some(s => s.source_label === 'extension_1' && s.entry_count === 6), 'extension_1 missing');
    assert(sources.some(s => s.source_label === 'extension_2' && s.entry_count === 6), 'extension_2 missing');
    assert(sources.some(s => s.source_label === 'extension_3' && s.entry_count === 9), 'extension_3 missing');
    assert(sources.some(s => s.source_label === 'extension_4' && s.entry_count === 4), 'extension_4 missing');
    assert(sources.some(s => s.source_label === 'extension_5' && s.entry_count === 10), 'extension_5 missing');
    assert(sources.some(s => s.source_label === 'extension_6' && s.entry_count === 2), 'extension_6 missing');
  });

  (async function run(){
    const results = [];
    for (const t of tests) {
      try { await t.fn(); results.push({ name:t.name, passed:true }); }
      catch(e) { results.push({ name:t.name, passed:false, error:e.message }); }
    }
    const passed = results.filter(r => r.passed).length;
    document.getElementById('summary').className = passed === results.length ? 'ok' : 'bad';
    document.getElementById('summary').textContent = `${passed}/${results.length} passed`;
    document.getElementById('out').textContent = JSON.stringify({ packet_type:'42ndMind_semantic_language_certificate_v0_1_test_report', certificate, results }, null, 2);
  })();
</script>
</body>
</html>
