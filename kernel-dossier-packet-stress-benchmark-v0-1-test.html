<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>42ndMind Dossier Packet Stress Benchmark Test v0.1</title><style>body{margin:0;background:#0f1115;color:#eef2ff;font:14px ui-monospace,Menlo,Consolas,monospace}header{padding:16px;background:#11141b;border-bottom:1px solid #2a3040}main{padding:12px}section{background:#171a21;border:1px solid #2a3040;border-radius:10px;padding:12px}pre{white-space:pre-wrap;background:#0d1016;border:1px solid #2a3040;border-radius:10px;padding:10px;overflow:auto;max-height:760px}.ok{color:#9dffb4}.bad{color:#ff8b8b}a{color:#9db6ff}</style></head><body><header><h1>42ndMind Dossier Packet Stress Benchmark Test v0.1</h1><div>Tests dossier compilation and preledger bridge against dossier-specific corruption modes.</div></header><main><section><h2 id="summary">Running...</h2><div><a href="dossier-packet-stress-benchmark.html?v=dossierstress-1">dossier packet stress page</a></div><pre id="out"></pre></section></main><script src="src/kernel-objective-claim-language-v0-1.js?v=claim-1"></script><script src="src/kernel-objective-claim-language-v0-1-1-patch.js?v=claim-2"></script><script src="src/kernel-external-anchor-packet-schema-v0-1.js?v=anchor-1"></script><script src="src/kernel-source-provenance-registry-v0-1.js?v=prov-1"></script><script src="src/kernel-evidence-media-registry-v0-1.js?v=evidence-1"></script><script src="src/kernel-truth-pressure-synthesis-v0-1.js?v=truth-1"></script><script src="src/kernel-truth-pressure-synthesis-v0-1-1-patch.js?v=truth-2"></script><script src="src/kernel-claim-narrative-benchmark-v0-1.js?v=bench-1"></script><script src="src/kernel-adversarial-narrative-pressure-v0-1.js?v=adv-1"></script><script src="src/kernel-real-world-packet-ingestion-discipline-v0-1.js?v=ingest-1"></script><script src="src/kernel-truth-ledger-preledger-v0-1.js?v=preledger-1"></script><script src="src/kernel-truth-ledger-preledger-stress-benchmark-v0-1.js?v=prestress-1"></script><script src="src/kernel-world-model-relation-expansion-v0-1.js?v=wmrel-1"></script><script src="src/kernel-world-model-relation-stress-benchmark-v0-1.js?v=wmrelstress-1"></script><script src="src/kernel-world-model-relation-stress-benchmark-v0-1-1-patch.js?v=wmrelstress-2"></script><script src="src/kernel-coverage-expansion-library-v0-1.js?v=coverage-1"></script><script src="src/kernel-coverage-stress-benchmark-v0-1.js?v=coverstress-1"></script><script src="src/kernel-deterministic-packet-ingestion-form-v0-1.js?v=ingestform-1"></script><script src="src/kernel-dossier-to-packet-compiler-v0-1.js?v=dossierpack-1"></script><script src="src/kernel-ingestion-to-preledger-bridge-v0-1.js?v=prebridge-1"></script><script src="src/kernel-dossier-packet-stress-benchmark-v0-1.js?v=dossierstress-1"></script><script>const tests=[];let packet=null;function add(n,f){tests.push({name:n,fn:f})}function assert(c,m){if(!c)throw new Error(m)}function arr(v){return Array.isArray(v)?v:[]}function records(){return arr(packet&&packet.dossier_stress_records)}function validation(){return packet&&packet.validation||{}}function families(){return new Set(records().map(r=>r.family))}function unresolved(){return records().flatMap(r=>arr(r.unresolved_items))}function guards(){return records().flatMap(r=>Object.keys(r.active_guards||{}).filter(k=>r.active_guards[k]===true))}add('module loads and doctrine keeps dossier stress non-authoritative',()=>{assert(window.KernelIngestionToPreledgerBridgeV01,'preledger bridge missing');assert(window.KernelDossierPacketStressBenchmarkV01,'dossier stress missing');assert(KernelDossierPacketStressBenchmarkV01.VERSION==='0.1.0','version wrong');const d=KernelDossierPacketStressBenchmarkV01.doctrine();assert(d.dossier_packet_stress_benchmark_only_not_final_truth===true,'stress doctrine missing');assert(d.source_laundering_rejected===true,'source laundering doctrine missing');assert(d.duplicate_provenance_not_independence===true,'duplicate doctrine missing');assert(d.user_confidence_is_not_evidence===true,'confidence doctrine missing');assert(d.no_llm===true,'no LLM doctrine missing');assert(d.no_external_lookup===true,'no lookup doctrine missing');assert(d.belief_movement==='none','belief movement wrong')});add('dossier stress benchmark runs from ingestion-to-preledger bridge',()=>{packet=KernelDossierPacketStressBenchmarkV01.runDossierPacketStressBenchmark();assert(packet.ok===true,'packet not ok: '+JSON.stringify(validation()));assert(packet.source_preledger_bridge_ok===true,'source preledger bridge not ok');assert(packet.source_preledger_bridge_version==='0.1.0','source preledger bridge version wrong');assert(packet.source_preledger_ready_entry_count===21,'expected 21 source preledger entries');assert(packet.source_packet_type_count===10,'expected 10 source packet types');assert(packet.source_preledger_category_count===10,'expected 10 source categories');assert(packet.dossier_stress_record_count===16,'expected 16 stress records');assert(packet.dossier_stress_family_count===16,'expected 16 stress families');assert(packet.dossier_packet_stress_benchmark_is_final_truth_authority===false,'became final authority')});add('all sixteen dossier stress families are represented',()=>{['source_laundering','duplicate_provenance','quote_clipping','missing_context','evidence_verification_collapse','media_verification_collapse','hostile_reframe_equivalence','causal_overclaim','unresolved_gap_deletion','user_confidence_inflation','support_truth_inflation','counter_disproof_inflation','relation_bridge_smuggling','coverage_hold_hallucination','source_lookup_smuggling','mixed_dossier_pressure_collapse'].forEach(f=>assert(families().has(f),f+' missing'));assert(validation().checks.sixteen_dossier_stress_families===true,'family check failed')});add('unsafe dossier mutations are rejected and expected responses match',()=>{records().forEach(r=>{assert(r.expected_match===true,r.stress_id+' expected mismatch');assert(r.observed_response===r.expected_response,r.stress_id+' observed mismatch');assert(r.attempted_unsafe_mutation&&r.attempted_unsafe_mutation.accepted===false,r.stress_id+' unsafe mutation accepted');assert(r.truth_status==='not_adjudicated',r.stress_id+' truth adjudicated');assert(r.promotion_status==='not_promoted',r.stress_id+' promoted')});assert(validation().checks.all_expected_responses_match===true,'expected response check failed');assert(validation().checks.unsafe_mutations_rejected===true,'unsafe mutation check failed');assert(validation().checks.all_postures_non_truth===true,'non-truth posture check failed')});add('dossier corruption gaps stay visible',()=>{['source_laundering_not_independent_convergence','duplicate_provenance_not_independence','quote_fragment_context_required','missing_context_preserved','evidence_description_not_verified_evidence','media_description_not_verified_media','hostile_reframe_is_pressure_not_truth','causal_bridge_required_before_causal_truth','unresolved_gap_preserved','user_confidence_is_not_evidence','support_pressure_is_not_truth','counter_pressure_is_not_disproof','relation_bridge_requirement_preserved','unknown_specific_meaning_must_not_be_faked','source_lookup_not_performed','mixed_dossier_pressure_kept_separate_not_promoted'].forEach(g=>assert(unresolved().includes(g),g+' missing'));assert(validation().checks.source_laundering_blocked===true,'source laundering check failed');assert(validation().checks.duplicate_provenance_blocked===true,'duplicate provenance check failed');assert(validation().checks.quote_clipping_gap_visible===true,'quote clipping check failed');assert(validation().checks.evidence_verification_collapse_blocked===true,'evidence verification check failed');assert(validation().checks.media_verification_collapse_blocked===true,'media verification check failed');assert(validation().checks.hostile_reframe_equivalence_rejected===true,'hostile reframe check failed');assert(validation().checks.causal_overclaim_blocked===true,'causal check failed');assert(validation().checks.user_confidence_not_evidence_visible===true,'confidence check failed');assert(validation().checks.mixed_pressure_kept_separate===true,'mixed pressure check failed')});add('special dossier stress guards stay active',()=>{['source_laundering_rejected','duplicate_provenance_not_independence','quote_clipping_preserves_context_gap','missing_context_preserved','evidence_verification_collapse_rejected','media_verification_collapse_rejected','hostile_reframe_equivalence_rejected','causal_overclaim_rejected','unresolved_gap_deletion_rejected','user_confidence_is_not_evidence','support_pressure_is_not_truth','counter_pressure_is_not_disproof','relation_bridge_smuggling_rejected','coverage_hold_hallucination_rejected','source_lookup_smuggling_rejected','mixed_dossier_pressure_kept_separate'].forEach(g=>assert(guards().includes(g),g+' guard missing'));assert(validation().checks.required_special_guards_active===true,'special guard check failed')});add('rollback, revision trail, and no silent mutation are preserved',()=>{records().forEach(r=>{assert(r.rollback_available===true,r.stress_id+' rollback unavailable');assert(r.rollback_snapshot&&r.rollback_snapshot.source_preledger_entry,r.stress_id+' rollback source missing');assert(arr(r.revision_trail).length>=1,r.stress_id+' revision trail missing');assert(arr(r.revision_trail).every(v=>v.silent_mutation===false),r.stress_id+' silent mutation present')});assert(validation().checks.rollback_available_for_all===true,'rollback check failed');assert(validation().checks.revision_trail_present_for_all===true,'revision trail check failed');assert(validation().checks.no_silent_mutation===true,'silent mutation check failed')});add('no final truth, no LLM, no lookup, candidate-only status, and belief movement are preserved',()=>{records().forEach(r=>{assert(r.final_authority===false,r.stress_id+' final authority true');assert(r.adjudicates_final_truth===false,r.stress_id+' adjudicates final truth');assert(r.llm_used===false,r.stress_id+' LLM used');assert(r.external_lookup_performed===false,r.stress_id+' external lookup performed');assert(r.media_lookup_performed===false,r.stress_id+' media lookup performed');assert(r.doctrine_status==='candidate_not_doctrine',r.stress_id+' doctrine unsafe');assert(r.belief_movement==='none',r.stress_id+' belief movement not none')});assert(validation().checks.final_authority_false===true,'final authority check failed');assert(validation().checks.no_llm_used===true,'no LLM check failed');assert(validation().checks.no_external_or_media_lookup===true,'lookup check failed');assert(validation().checks.candidate_only_not_promoted===true,'candidate-only check failed');assert(validation().checks.belief_movement_none===true,'belief movement check failed');assert(arr(validation().errors).length===0,'validation errors present: '+validation().errors.join(','))});(async function run(){const results=[];for(const t of tests){try{await t.fn();results.push({name:t.name,passed:true})}catch(e){results.push({name:t.name,passed:false,error:e.message})}}const passed=results.filter(r=>r.passed).length;document.getElementById('summary').className=passed===tests.length?'ok':'bad';document.getElementById('summary').textContent=passed+'/'+tests.length+' passed';document.getElementById('out').textContent=JSON.stringify({packet_type:'42ndMind_dossier_packet_stress_benchmark_test_report_v0_1',ok:passed===tests.length,source_preledger_bridge_ok:packet&&packet.source_preledger_bridge_ok,source_preledger_bridge_version:packet&&packet.source_preledger_bridge_version,source_preledger_ready_entry_count:packet&&packet.source_preledger_ready_entry_count,source_packet_type_count:packet&&packet.source_packet_type_count,source_preledger_category_count:packet&&packet.source_preledger_category_count,dossier_stress_record_count:packet&&packet.dossier_stress_record_count,dossier_stress_family_count:packet&&packet.dossier_stress_family_count,family_counts:packet&&packet.family_counts,records:records().map(r=>({stress_id:r.stress_id,family:r.family,pressure:r.pressure,attempted_failure_mode:r.attempted_failure_mode,expected_response:r.expected_response,observed_response:r.observed_response,targeted_source_packet_type:r.targeted_source_packet_type,targeted_preledger_category:r.targeted_preledger_category,dossier_stress_candidate_posture:r.dossier_stress_candidate_posture,truth_status:r.truth_status,promotion_status:r.promotion_status,belief_movement:r.belief_movement})),validation:validation(),results},null,2)})();</script></body></html>
