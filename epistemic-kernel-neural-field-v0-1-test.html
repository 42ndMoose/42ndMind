<!doctype html><html><head><meta charset="utf-8"><title>Kernel Neural Field v0.1 Test</title><style>body{background:#0f1115;color:#eef2ff;font:14px monospace}pre{white-space:pre-wrap}.ok{color:#9f9}.bad{color:#f99}</style></head><body><h1 id="summary">Running...</h1><pre id="out"></pre>
<script src="src/epistemic-kernel-v0-2.js"></script><script src="src/epistemic-kernel-v0-2-patches.js"></script><script src="src/kernel-brain-v0-4.js"></script><script src="src/kernel-brain-epistemic-kernel-bridge-v0-1.js"></script><script src="src/epistemic-kernel-maturity-core-v0-1.js"></script><script src="src/epistemic-kernel-belief-memory-engine-v0-1.js"></script><script src="src/epistemic-kernel-belief-memory-engine-v0-1-1-patch.js"></script><script src="src/epistemic-kernel-attention-organism-v0-1.js"></script><script src="src/epistemic-kernel-unity-field-v0-1.js"></script><script src="src/epistemic-kernel-unity-field-v0-1-1-patch.js"></script><script src="src/epistemic-kernel-neural-field-v0-1.js"></script>
<script>
let k=new EpistemicKernel(), b=KernelBrainEpistemicKernelBridgeV01.bind(k).bound_brain;
function s(){return k.state.unifiedCore}function n(){return s().kernelNeuralFieldCore}function c(){return s().communicationCore}function m(){return s().maturityCore}function say(x){b.ingest(x,{kind:'neural_test'});b.refreshKernelNeuralField('manual');return c().current_message.message}function ok(x,e){if(!x)throw Error(e)}function arr(v){return Array.isArray(v)?v:[]}const tests=[];function add(name,fn){tests.push({name,fn})}function act(id){let r=arr(n().neurons).find(x=>x.neuron_id===id);return r?Number(r.activation||0):0}
add('neural field loads and patches',()=>{ok(window.EpistemicKernelNeuralFieldV01,'module missing');ok(EpistemicKernel.__kernelNeuralFieldPatchApplied,'kernel patch missing')});
add('language growth spreads to truth belief memory knowledge and communication',()=>{let msg=say('language should grow through calculus, subdivision of one, meanings, and formulas');ok(n().selected_motor_intention.intention_kind==='grow_language_and_apply_it','bad intention '+n().selected_motor_intention.intention_kind);ok(/truth, belief, memory, knowledge, and communication/i.test(msg),'bad msg '+msg);ok(act('language_math')>.35,'language low');ok(act('truth_tracking')>.18,'truth low');ok(act('belief_thought')>.12,'belief low');ok(act('memory_context')>.10,'memory low');ok(act('communication_motor')>.12,'communication low');ok(arr(n().learning_deltas).some(d=>d.target==='belief_thought'),'belief delta missing');ok(arr(n().learning_deltas).some(d=>d.target==='memory_context'),'memory delta missing');ok(arr(n().learning_deltas).some(d=>d.target==='communication_motor'),'communication delta missing')});
add('communication becomes motor expression',()=>{let msg=say('can you communicate what you know and what you want to learn?');ok(n().selected_motor_intention.intention_kind==='express_live_field','bad intention '+n().selected_motor_intention.intention_kind);ok(c().current_message.thought_kind==='neural_field_motor_expression','not neural speech');ok(/live field|want to learn|not call truth/i.test(msg),'bad msg '+msg)});
add('truth belief stays separated',()=>{let msg=say('belief, suspicion, speculation, fact, truth, and knowledge must not be confused');ok(n().selected_motor_intention.intention_kind==='separate_truth_belief_knowledge','bad intention '+n().selected_motor_intention.intention_kind);ok(/belief, suspicion, speculation, fact, knowledge, and truth|not collapse/i.test(msg),'bad msg '+msg)});
add('learning produces deltas not final truth',()=>{say('testing your reasoning? you can also learn from the side.');ok(arr(n().learning_deltas).length>0,'no learning deltas');ok(n().truth_status==='not_final','truth promoted');ok(n().promotion_status==='not_promoted_to_final_truth','promoted');ok(m().core_philosophy==='objective_peak_philosophical_maturity','maturity missing')});
(async()=>{let r=[];for(const t of tests){try{await t.fn();r.push({name:t.name,passed:true})}catch(e){r.push({name:t.name,passed:false,error:e.message})}}let p=r.filter(x=>x.passed).length;summary.textContent=p+'/'+tests.length+' passed';summary.className=p===tests.length?'ok':'bad';out.textContent=JSON.stringify({ok:p===tests.length,kernelNeuralFieldCore:n(),communicationCore:c(),results:r},null,2)})();
</script></body></html>
