<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>42ndMind Intention Formula Compiler</title><style>body{margin:0;background:#0f1115;color:#eef2ff;font:14px ui-monospace,Menlo,Consolas,monospace}header{padding:16px 18px;background:#11141b;border-bottom:1px solid #2a3040}main{padding:12px;display:grid;grid-template-columns:440px 1fr;gap:12px}section{background:#171a21;border:1px solid #2a3040;border-radius:10px;padding:12px}button{background:#25345c;color:#eef2ff;border:1px solid #3f5592;padding:8px 10px;border-radius:8px;cursor:pointer;margin:3px 3px 8px 0}pre{white-space:pre-wrap;background:#0d1016;border:1px solid #2a3040;border-radius:10px;padding:10px;overflow:auto;max-height:760px}.ok{color:#9dffb4}.bad{color:#ff8b8b}.muted{color:#8b93a7}a{color:#9db6ff}.card{background:#10131a;border:1px solid #2a3040;border-radius:10px;padding:10px;margin:10px 0}.term{display:grid;grid-template-columns:1fr auto auto;gap:10px;border-top:1px solid #252b3a;padding:4px 0}.pill{display:inline-block;border:1px solid #2a3040;border-radius:999px;padding:1px 7px;margin:2px}.core{color:#9dffb4}.boundary{color:#ffd28b}.derivative{color:#9db6ff}.force{color:#ffb86b}@media(max-width:900px){main{grid-template-columns:1fr}}</style></head><body><header><h1>42ndMind Intention Formula Compiler</h1><div class="muted">Compiled algebraic intention packets from discovery, refinement, necessity, lattice, and invariance outputs. Candidate only. No real-world intent attribution.</div></header><main><section><a href="index.html">main</a> · <a href="intention-lattice-invariance.html?v=invariance-2">invariance</a> · <a href="kernel-intention-formula-compiler-v0-1-test.html?v=formula-1">test</a><p>Decision: <b id="decisionMetric">not run</b></p><p>Formulas: <b id="formulaMetric">0</b></p><button onclick="runCompiler()">Run compiler</button><button onclick="showPacket()">Show packet</button><button onclick="showSummary()">Show summary</button><button onclick="copyOutput()">Copy output</button><div id="cards"></div></section><section><h2>Output</h2><pre id="out">No output yet.</pre></section></main><script src="src/kernel-intention-discovery-v0-1.js?v=intent-1"></script><script src="src/kernel-intention-refinement-v0-1.js?v=refine-1"></script><script src="src/kernel-intention-necessity-test-v0-1.js?v=necessity-1"></script><script src="src/kernel-intention-neighbor-lattice-v0-1.js?v=lattice-2"></script><script src="src/kernel-intention-lattice-invariance-benchmark-v0-1.js?v=invariance-2"></script><script src="src/kernel-intention-formula-compiler-v0-1.js?v=formula-1"></script><script>let packet=null,last='';function esc(v){return String(v??'').replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]))}function setOut(v){last=typeof v==='string'?v:JSON.stringify(v,null,2);document.getElementById('out').textContent=last}function termRows(label,terms,cls){return `<h4 class="${cls}">${esc(label)}</h4>`+(terms||[]).map(t=>`<div class="term"><span>${esc(t.dimension)}</span><span>${esc(t.role)}</span><b>${esc(Number(t.coefficient).toFixed?Number(t.coefficient).toFixed(6):t.coefficient)}</b></div>`).join('')}function forceRows(terms){return `<h4 class="force">force outside shape</h4>`+(terms||[]).map(t=>`<div class="term"><span>${esc(t.dimension)}</span><span>${esc(t.equation_role)}</span><b>M</b></div>`).join('')}function runCompiler(){const decisionEl=document.getElementById('decisionMetric');try{packet=KernelIntentionFormulaCompilerV01.runCompiler();decisionEl.textContent=packet.ok?'FORMULAS_READY':'HELD';decisionEl.className=packet.ok?'ok':'bad';document.getElementById('formulaMetric').textContent=packet.compiled_formula_count;renderCards();showSummary()}catch(e){decisionEl.textContent='ERROR';decisionEl.className='bad';setOut({ok:false,error:e.message,belief_movement:'none'})}}function renderCards(){document.getElementById('cards').innerHTML=(packet&&packet.compiled_formulas||[]).map(f=>`<div class="card"><h3>${esc(f.concept)} · ${esc(f.review_status)}</h3><pre>${esc(f.symbolic_formula)}</pre><p><span class="pill">neighbors ${esc(f.neighbor_transitions.length)}</span><span class="pill">invariance ${esc(f.invariance_status.passed_case_count)}/${esc(f.invariance_status.tested_case_count)}</span><span class="pill">force ${esc(f.invariance_status.force_invariance_ok)}</span></p>${termRows('core',f.core_terms,'core')}${termRows('boundary',f.boundary_terms,'boundary')}${termRows('derivative/expression',f.derivative_expression_terms,'derivative')}${forceRows(f.force_terms)}</div>`).join('')||'No formulas.'}function summary(){return{packet_type:'42ndMind_intention_formula_compiler_summary_view_v0_1',ok:packet&&packet.ok,compiled_formula_count:packet&&packet.compiled_formula_count,source_summary:packet&&packet.source_summary,formulas:(packet&&packet.compiled_formulas||[]).map(f=>({concept:f.concept,symbolic_formula:f.symbolic_formula,force_equation:f.force_equation,core_terms:f.core_terms,boundary_terms:f.boundary_terms,derivative_expression_terms:f.derivative_expression_terms,force_terms:f.force_terms,neighbor_transition_count:f.neighbor_transitions.length,invariance_status:f.invariance_status,review_status:f.review_status})),validation:packet&&packet.validation,belief_movement:'none'}}function showSummary(){if(!packet)return runCompiler();setOut(summary())}function showPacket(){if(!packet)return runCompiler();setOut(packet)}async function copyOutput(){try{await navigator.clipboard.writeText(last);document.getElementById('out').textContent='Copied.\n\n'+last}catch(e){}}runCompiler();</script></body></html>
