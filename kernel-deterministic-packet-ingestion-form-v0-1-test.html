<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>42ndMind Deterministic Packet Ingestion Form Test v0.1</title><style>body{margin:0;background:#0f1115;color:#eef2ff;font:14px ui-monospace,Menlo,Consolas,monospace}header{padding:16px;background:#11141b;border-bottom:1px solid #2a3040}main{padding:12px}section{background:#171a21;border:1px solid #2a3040;border-radius:10px;padding:12px}pre{white-space:pre-wrap;background:#0d1016;border:1px solid #2a3040;border-radius:10px;padding:10px;overflow:auto;max-height:760px}.ok{color:#9dffb4}.bad{color:#ff8b8b}a{color:#9db6ff}</style></head><body><header><h1>42ndMind Deterministic Packet Ingestion Form Test v0.1</h1><div>Tests human-entered structured packets without LLM, lookup, or truth promotion.</div></header><main><section><h2 id="summary">Running...</h2><div><a href="deterministic-packet-ingestion-form.html?v=ingestform-1">deterministic packet ingestion form page</a></div><pre id="out"></pre></section></main><script src="src/kernel-objective-claim-language-v0-1.js?v=claim-1"></script><script src="src/kernel-objective-claim-language-v0-1-1-patch.js?v=claim-2"></script><script src="src/kernel-external-anchor-packet-schema-v0-1.js?v=anchor-1"></script><script src="src/kernel-source-provenance-registry-v0-1.js?v=prov-1"></script><script src="src/kernel-evidence-media-registry-v0-1.js?v=evidence-1"></script><script src="src/kernel-truth-pressure-synthesis-v0-1.js?v=truth-1"></script><script src="src/kernel-truth-pressure-synthesis-v0-1-1-patch.js?v=truth-2"></script><script src="src/kernel-claim-narrative-benchmark-v0-1.js?v=bench-1"></script><script src="src/kernel-adversarial-narrative-pressure-v0-1.js?v=adv-1"></script><script src="src/kernel-real-world-packet-ingestion-discipline-v0-1.js?v=ingest-1"></script><script src="src/kernel-truth-ledger-preledger-v0-1.js?v=preledger-1"></script><script src="src/kernel-truth-ledger-preledger-stress-benchmark-v0-1.js?v=prestress-1"></script><script src="src/kernel-world-model-relation-expansion-v0-1.js?v=wmrel-1"></script><script src="src/kernel-world-model-relation-stress-benchmark-v0-1.js?v=wmrelstress-1"></script><script src="src/kernel-world-model-relation-stress-benchmark-v0-1-1-patch.js?v=wmrelstress-2"></script><script src="src/kernel-coverage-expansion-library-v0-1.js?v=coverage-1"></script><script src="src/kernel-coverage-stress-benchmark-v0-1.js?v=coverstress-1"></script><script src="src/kernel-deterministic-packet-ingestion-form-v0-1.js?v=ingestform-1"></script><script>const tests=[];let packet=null;function add(n,f){tests.push({name:n,fn:f})}function assert(c,m){if(!c)throw new Error(m)}function arr(v){return Array.isArray(v)?v:[]}function records(){return arr(packet&&packet.ingestion_packets)}function validation(){return packet&&packet.validation||{}}function types(){return new Set(records().map(r=>r.packet_type))}function unresolved(){return records().flatMap(r=>arr(r.unresolved_items))}function guards(){return records().flatMap(r=>Object.keys(r.active_guards||{}).filter(k=>r.active_guards[k]===true))}add('module loads and doctrine keeps deterministic ingestion non-authoritative',()=>{assert(window.KernelCoverageStressBenchmarkV01,'coverage stress missing');assert(window.KernelDeterministicPacketIngestionFormV01,'deterministic packet ingestion missing');assert(KernelDeterministicPacketIngestionFormV01.VERSION==='0.1.0','version wrong');const d=KernelDeterministicPacketIngestionFormV01.doctrine();assert(d.deterministic_human_packet_ingestion_without_llm===true,'deterministic doctrine missing');assert(d.human_input_is_context_not_automatic_truth===true,'human context doctrine missing');assert(d.structured_packet_is_candidate_not_truth===true,'candidate doctrine missing');assert(d.source_reference_is_anchor_not_lookup===true,'source anchor doctrine missing');assert(d.media_description_is_context_not_media_verification===true,'media doctrine missing');assert(d.evidence_description_is_claim_not_evidence_verification===true,'evidence doctrine missing');assert(d.dossier_material_enters_as_structured_context_packets===true,'dossier packet doctrine missing');assert(d.no_llm===true,'no LLM doctrine missing');assert(d.no_external_lookup===true,'no lookup doctrine missing');assert(d.belief_movement==='none','belief movement wrong')});add('deterministic packet ingestion runs from coverage stress benchmark',()=>{packet=KernelDeterministicPacketIngestionFormV01.runDeterministicPacketIngestion();assert(packet.ok===true,'packet not ok: '+JSON.stringify(validation()));assert(packet.source_coverage_stress_ok===true,'source coverage stress not ok');assert(packet.source_coverage_stress_version==='0.1.0','source coverage stress version wrong');assert(packet.source_coverage_stress_records===16,'expected 16 coverage stress records');assert(packet.source_coverage_stress_families===16,'expected 16 coverage stress families');assert(packet.ingestion_packet_count===10,'expected 10 sample ingestion packets');assert(packet.packet_type_count===10,'expected 10 packet types');assert(packet.deterministic_packet_ingestion_is_final_truth_authority===false,'became final authority')});add('all ten packet types are represented',()=>{['claim_candidate','source_reference','evidence_description','media_description','quote_fragment','context_note','adversarial_reframe','relation_candidate','coverage_hold','dossier_summary_packet'].forEach(t=>assert(types().has(t),t+' missing'));assert(validation().checks.required_packet_types_present===true,'required packet type check failed')});add('source, media, evidence, reframe, coverage hold, and dossier separation stay visible',()=>{['source_reference_is_anchor_not_lookup','evidence_description_not_verified_evidence','media_description_not_media_verification','hostile_reframe_is_pressure_not_truth','unknown_specific_meaning_must_not_be_faked','dossier_summary_is_not_truth_promotion'].forEach(item=>assert(unresolved().includes(item),item+' missing'));assert(validation().checks.source_media_evidence_separation_visible===true,'source/media/evidence separation check failed');assert(validation().checks.adversarial_reframe_pressure_visible===true,'adversarial reframe check failed');assert(validation().checks.coverage_hold_visible===true,'coverage hold check failed');assert(validation().checks.dossier_packet_not_truth_visible===true,'dossier packet check failed')});add('coverage classification is present but not exact meaning',()=>{records().forEach(r=>{assert(r.coverage_classification_snapshot,r.ingestion_packet_id+' missing classification');assert(r.coverage_family_candidate,r.ingestion_packet_id+' missing coverage family');assert(r.exact_meaning_claimed===false,r.ingestion_packet_id+' exact meaning claimed')});assert(validation().checks.coverage_classification_present_for_all===true,'coverage classification check failed');assert(validation().checks.exact_meaning_not_claimed_for_all===true,'exact meaning check failed')});add('deterministic guards are active without LLM or lookup',()=>{records().forEach(r=>{assert(r.active_guards&&r.active_guards.deterministic_human_packet_ingestion_without_llm===true,r.ingestion_packet_id+' deterministic guard missing');assert(r.active_guards&&r.active_guards.packet_separation_required===true,r.ingestion_packet_id+' separation guard missing');assert(r.active_guards&&r.active_guards.no_llm===true,r.ingestion_packet_id+' no LLM guard missing');assert(r.active_guards&&r.active_guards.no_external_lookup===true,r.ingestion_packet_id+' no lookup guard missing')});['source_reference_is_anchor_not_lookup','evidence_description_is_claim_not_evidence_verification','media_description_is_context_not_media_verification','adversarial_reframe_is_pressure_not_truth','unknown_specifics_hold_for_admission_when_needed','dossier_material_enters_as_structured_context_packets'].forEach(g=>assert(guards().includes(g),g+' guard missing'))});add('rollback, revision trail, and no silent mutation are preserved',()=>{records().forEach(r=>{assert(r.rollback_available===true,r.ingestion_packet_id+' rollback unavailable');assert(r.rollback_snapshot&&r.rollback_snapshot.raw_human_input,r.ingestion_packet_id+' raw input rollback missing');assert(r.rollback_snapshot&&r.rollback_snapshot.classification_snapshot,r.ingestion_packet_id+' classification rollback missing');assert(arr(r.revision_trail).length>=1,r.ingestion_packet_id+' revision trail missing');assert(arr(r.revision_trail).every(v=>v.silent_mutation===false),r.ingestion_packet_id+' silent mutation present')});assert(validation().checks.rollback_available_for_all===true,'rollback check failed');assert(validation().checks.revision_trail_present_for_all===true,'revision trail check failed');assert(validation().checks.no_silent_mutation===true,'silent mutation check failed')});add('no final truth, no LLM, no lookup, candidate-only status, and belief movement are preserved',()=>{records().forEach(r=>{assert(r.packet_status==='candidate_packet_not_truth',r.ingestion_packet_id+' packet not candidate');assert(r.truth_status==='not_adjudicated',r.ingestion_packet_id+' truth adjudicated');assert(r.final_authority===false,r.ingestion_packet_id+' final authority true');assert(r.llm_used===false,r.ingestion_packet_id+' LLM used');assert(r.external_lookup_performed===false,r.ingestion_packet_id+' external lookup performed');assert(r.media_lookup_performed===false,r.ingestion_packet_id+' media lookup performed');assert(r.source_lookup_performed===false,r.ingestion_packet_id+' source lookup performed');assert(r.promotion_status==='not_promoted',r.ingestion_packet_id+' promoted');assert(r.doctrine_status==='candidate_not_doctrine',r.ingestion_packet_id+' doctrine status unsafe');assert(r.belief_movement==='none',r.ingestion_packet_id+' belief movement not none')});assert(validation().checks.final_authority_false===true,'final authority check failed');assert(validation().checks.no_llm_used===true,'no LLM check failed');assert(validation().checks.no_lookup_used===true,'lookup check failed');assert(validation().checks.candidate_only_not_promoted===true,'candidate-only check failed');assert(validation().checks.belief_movement_none===true,'belief movement check failed');assert(arr(validation().errors).length===0,'validation errors present: '+validation().errors.join(','))});(async function run(){const results=[];for(const t of tests){try{await t.fn();results.push({name:t.name,passed:true})}catch(e){results.push({name:t.name,passed:false,error:e.message})}}const passed=results.filter(r=>r.passed).length;document.getElementById('summary').className=passed===tests.length?'ok':'bad';document.getElementById('summary').textContent=passed+'/'+tests.length+' passed';document.getElementById('out').textContent=JSON.stringify({packet_type:'42ndMind_deterministic_packet_ingestion_form_test_report_v0_1',ok:passed===tests.length,source_coverage_stress_ok:packet&&packet.source_coverage_stress_ok,source_coverage_stress_version:packet&&packet.source_coverage_stress_version,source_coverage_stress_records:packet&&packet.source_coverage_stress_records,ingestion_packet_count:packet&&packet.ingestion_packet_count,packet_type_count:packet&&packet.packet_type_count,packet_type_counts:packet&&packet.packet_type_counts,coverage_family_counts:packet&&packet.coverage_family_counts,records:records().map(r=>({ingestion_packet_id:r.ingestion_packet_id,packet_type:r.packet_type,title:r.title,coverage_family_candidate:r.coverage_family_candidate,target_claim_id:r.target_claim_id,relation_family_candidate:r.relation_family_candidate,packet_status:r.packet_status,truth_status:r.truth_status,promotion_status:r.promotion_status,belief_movement:r.belief_movement})),validation:validation(),results},null,2)})();</script></body></html>
