<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>42ndMind Source Provenance Registry Test v0.1</title><style>body{margin:0;background:#0f1115;color:#eef2ff;font:14px ui-monospace,Menlo,Consolas,monospace}header{padding:16px;background:#11141b;border-bottom:1px solid #2a3040}main{padding:12px}section{background:#171a21;border:1px solid #2a3040;border-radius:10px;padding:12px}pre{white-space:pre-wrap;background:#0d1016;border:1px solid #2a3040;border-radius:10px;padding:10px;overflow:auto;max-height:760px}.ok{color:#9dffb4}.bad{color:#ff8b8b}a{color:#9db6ff}</style></head><body><header><h1>42ndMind Source Provenance Registry Test v0.1</h1><div>Validates source modality, provenance posture, independence groups, duplicate provenance, and evidence-source links. No LLM. No lookup.</div></header><main><section><h2 id="summary">Running...</h2><div><a href="source-provenance-registry.html?v=prov-1">source provenance registry page</a></div><pre id="out"></pre></section></main><script src="src/kernel-external-anchor-packet-schema-v0-1.js?v=anchor-1"></script><script src="src/kernel-source-provenance-registry-v0-1.js?v=prov-1"></script><script>const tests=[];let packet=null;function add(n,f){tests.push({name:n,fn:f})}function assert(c,m){if(!c)throw new Error(m)}function arr(v){return Array.isArray(v)?v:[]}function records(){return arr(packet&&packet.source_records)}function links(){return arr(packet&&packet.evidence_source_links)}function validation(){return packet&&packet.validation||{}}function counts(){return packet&&packet.source_posture_counts||{}}add('module loads and doctrine tracks provenance without truth adjudication',()=>{assert(window.KernelExternalAnchorPacketSchemaV01,'anchor schema module missing');assert(window.KernelSourceProvenanceRegistryV01,'source provenance module missing');assert(KernelSourceProvenanceRegistryV01.VERSION==='0.1.0','version wrong');assert(typeof KernelSourceProvenanceRegistryV01.runRegistry==='function','runRegistry missing');const d=KernelSourceProvenanceRegistryV01.doctrine();assert(d.tracks_source_provenance_without_truth_adjudication===true,'provenance doctrine missing');assert(d.duplicate_provenance_is_not_independent_convergence===true,'duplicate rule missing');assert(d.independent_sources_require_distinct_independence_groups===true,'independence doctrine missing');assert(d.source_lookup_is_not_automatic===true,'lookup guard missing');assert(d.llm_is_not_required===true,'LLM guard missing');assert(d.belief_movement==='none','belief movement wrong')});add('registry runs from external anchor packet schema',()=>{packet=KernelSourceProvenanceRegistryV01.runRegistry();assert(packet.ok===true,'packet not ok: '+JSON.stringify(validation()));assert(packet.source_anchor_schema_ok===true,'anchor schema not ok');assert(packet.source_record_count===4,'expected 4 source records');assert(packet.evidence_source_link_count===5,'expected 5 evidence links');assert(packet.lookup_performed===false,'packet lookup performed');assert(packet.llm_used===false,'packet used LLM');assert(packet.adjudicates_truth===false,'packet adjudicated truth');assert(packet.belief_movement==='none','packet moved belief')});add('source modalities are distinguished',()=>{assert(counts().user_supplied_description>=1,'missing user supplied description modality');assert(counts().media_description>=1,'missing media description modality');assert(counts().documentary_description>=1,'missing documentary description modality');assert(validation().checks.distinguishes_source_modalities===true,'modality distinction check failed');records().forEach(r=>{assert(r.source_modality&&r.source_modality!=='unknown_source_modality',r.source_id+' unknown modality');assert(r.reliability_posture,r.source_id+' missing reliability posture')})});add('independence groups are tracked and duplicate provenance is checked',()=>{assert(packet.independence_summary.source_independence_group_count>=3,'expected at least 3 source groups');assert(packet.independence_summary.evidence_independence_group_count>=3,'expected at least 3 evidence groups');assert(packet.independence_summary.independent_convergence_possible_only_across_distinct_groups===true,'independent convergence guard missing');assert(Array.isArray(packet.duplicate_provenance),'duplicate provenance not array');assert(validation().checks.independence_groups_present===true,'independence group check failed');assert(validation().checks.duplicate_provenance_checked===true,'duplicate check missing');assert(validation().checks.duplicate_provenance_not_independent_convergence===true,'duplicate independence rule failed')});add('evidence-source links resolve and do not promote truth',()=>{links().forEach(l=>{assert(l.source_ref_resolves===true,l.link_id+' source ref unresolved');assert(l.link_status==='evidence_source_link_not_truth',l.link_id+' truth promotion risk');assert(l.media_lookup_performed===false,l.link_id+' media lookup performed');assert(l.belief_movement==='none',l.link_id+' moved belief')});assert(validation().checks.all_evidence_links_valid===true,'evidence links invalid');assert(validation().checks.no_truth_adjudication===true,'truth adjudication check failed')});add('source lookup, media lookup, and LLM use remain false',()=>{records().forEach(r=>{assert(r.lookup_performed===false,r.source_id+' lookup performed');assert(r.llm_used===false,r.source_id+' used LLM');assert(r.adjudicates_truth===false,r.source_id+' adjudicated truth')});assert(validation().checks.no_source_lookup===true,'source lookup check failed');assert(validation().checks.no_media_lookup===true,'media lookup check failed');assert(validation().checks.no_llm_used===true,'LLM check failed')});add('candidate-only status and belief movement are preserved',()=>{records().forEach(r=>{assert(r.promotion_status==='not_promoted',r.source_id+' promoted');assert(r.doctrine_status==='candidate_not_doctrine',r.source_id+' doctrine status wrong');assert(r.belief_movement==='none',r.source_id+' moved belief')});assert(validation().checks.candidate_only_not_promoted===true,'candidate-only check failed');assert(validation().checks.belief_movement_none===true,'belief movement check failed')});add('validation report is clean',()=>{assert(validation().ok===true,'validation not ok');assert(validation().checks.source_anchor_schema_ok===true,'anchor schema check failed');assert(validation().checks.four_source_records===true,'source record count failed');assert(validation().checks.five_evidence_source_links===true,'evidence link count failed');assert(validation().checks.all_source_records_valid===true,'source records invalid');assert(arr(validation().errors).length===0,'validation errors present: '+validation().errors.join(','))});(async function run(){const results=[];for(const t of tests){try{await t.fn();results.push({name:t.name,passed:true})}catch(e){results.push({name:t.name,passed:false,error:e.message})}}const passed=results.filter(r=>r.passed).length;document.getElementById('summary').className=passed===tests.length?'ok':'bad';document.getElementById('summary').textContent=passed+'/'+tests.length+' passed';document.getElementById('out').textContent=JSON.stringify({packet_type:'42ndMind_source_provenance_registry_test_report_v0_1',ok:passed===tests.length,source_anchor_schema_ok:packet&&packet.source_anchor_schema_ok,source_record_count:packet&&packet.source_record_count,evidence_source_link_count:packet&&packet.evidence_source_link_count,source_posture_counts:packet&&packet.source_posture_counts,duplicate_provenance_count:packet&&packet.duplicate_provenance_count,independence_summary:packet&&packet.independence_summary,validation:validation(),results},null,2)})();</script></body></html>
