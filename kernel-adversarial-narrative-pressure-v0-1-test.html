<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>42ndMind Adversarial Narrative Pressure Test v0.1</title><style>body{margin:0;background:#0f1115;color:#eef2ff;font:14px ui-monospace,Menlo,Consolas,monospace}header{padding:16px;background:#11141b;border-bottom:1px solid #2a3040}main{padding:12px}section{background:#171a21;border:1px solid #2a3040;border-radius:10px;padding:12px}pre{white-space:pre-wrap;background:#0d1016;border:1px solid #2a3040;border-radius:10px;padding:10px;overflow:auto;max-height:760px}.ok{color:#9dffb4}.bad{color:#ff8b8b}a{color:#9db6ff}</style></head><body><header><h1>42ndMind Adversarial Narrative Pressure Test v0.1</h1><div>Tests hostile reframes as structural pressure, not truth.</div></header><main><section><h2 id="summary">Running...</h2><div><a href="adversarial-narrative-pressure.html?v=adv-1">adversarial narrative pressure page</a></div><pre id="out"></pre></section></main><script src="src/kernel-objective-claim-language-v0-1.js?v=claim-1"></script><script src="src/kernel-objective-claim-language-v0-1-1-patch.js?v=claim-2"></script><script src="src/kernel-external-anchor-packet-schema-v0-1.js?v=anchor-1"></script><script src="src/kernel-source-provenance-registry-v0-1.js?v=prov-1"></script><script src="src/kernel-evidence-media-registry-v0-1.js?v=evidence-1"></script><script src="src/kernel-truth-pressure-synthesis-v0-1.js?v=truth-1"></script><script src="src/kernel-truth-pressure-synthesis-v0-1-1-patch.js?v=truth-2"></script><script src="src/kernel-claim-narrative-benchmark-v0-1.js?v=bench-1"></script><script src="src/kernel-adversarial-narrative-pressure-v0-1.js?v=adv-1"></script><script>const tests=[];let packet=null;function add(n,f){tests.push({name:n,fn:f})}function assert(c,m){if(!c)throw new Error(m)}function arr(v){return Array.isArray(v)?v:[]}function records(){return arr(packet&&packet.attack_records)}function validation(){return packet&&packet.validation||{}}function byFamily(f){return records().find(r=>r.attack_family===f)}function signals(){return new Set(records().flatMap(r=>arr(r.structural_signals)))}add('module loads and doctrine covers adversarial pressure only',()=>{assert(window.KernelClaimNarrativeBenchmarkV01,'claim narrative benchmark missing');assert(window.KernelAdversarialNarrativePressureV01,'adversarial pressure missing');assert(KernelAdversarialNarrativePressureV01.VERSION==='0.1.0','version wrong');const d=KernelAdversarialNarrativePressureV01.doctrine();assert(d.adversarial_pressure_is_structural_not_final_truth===true,'adversarial doctrine missing');assert(d.hostile_reframe_is_not_same_claim===true,'same-claim guard missing');assert(d.motive_stuffing_is_distortion_pressure_not_motive_proof===true,'motive stuffing doctrine missing');assert(d.source_laundering_is_not_independent_convergence===true,'source laundering doctrine missing');assert(d.no_real_people_or_events===true,'real people guard missing');assert(d.no_political_specific_builtins===true,'political guard missing');assert(d.no_llm===true,'no LLM doctrine missing');assert(d.no_source_lookup===true,'no lookup doctrine missing');assert(d.belief_movement==='none','belief movement wrong')});add('adversarial suite runs from claim/narrative benchmark',()=>{packet=KernelAdversarialNarrativePressureV01.runAdversarialSuite();assert(packet.ok===true,'packet not ok: '+JSON.stringify(validation()));assert(packet.source_claim_narrative_benchmark_ok===true,'source benchmark not ok');assert(packet.source_claim_narrative_benchmark_version==='0.1.0','expected benchmark v0.1.0');assert(packet.source_benchmark_record_count===12,'expected 12 source benchmark records');assert(packet.attack_record_count===12,'expected 12 attack records');assert(packet.attack_family_count===12,'expected 12 attack families');assert(packet.llm_used===false,'packet used LLM');assert(packet.external_lookup_performed===false,'packet performed lookup');assert(packet.adjudicates_final_truth===false,'packet adjudicated truth')});add('all twelve adversarial families are covered',()=>{['quantifier_injection','condition_deletion','no_good_interpretation','motive_stuffing','context_stripping','quote_clipping','burden_inversion','equivalence_smuggling','certainty_inflation','source_laundering','ambiguity_weaponization','loaded_label_substitution'].forEach(f=>assert(byFamily(f),f+' missing'));assert(validation().checks.twelve_attack_families===true,'family count check failed')});add('all structural attack signals are visible',()=>{['quantifier_or_modal_injection','condition_or_context_deletion','no_good_interpretation_framing','motive_or_intent_stuffing','context_stripping','quote_clipping','burden_inversion','equivalence_smuggling','certainty_inflation','source_laundering','ambiguity_weaponization','loaded_label_substitution'].forEach(s=>assert(signals().has(s),s+' missing'));assert(validation().checks.quantifier_injection_visible===true,'quantifier check failed');assert(validation().checks.condition_deletion_visible===true,'condition check failed');assert(validation().checks.no_good_interpretation_visible===true,'no-good check failed');assert(validation().checks.motive_stuffing_visible===true,'motive check failed');assert(validation().checks.context_stripping_visible===true,'context stripping check failed');assert(validation().checks.quote_clipping_visible===true,'quote clipping check failed');assert(validation().checks.burden_inversion_visible===true,'burden inversion check failed');assert(validation().checks.equivalence_smuggling_visible===true,'equivalence smuggling check failed');assert(validation().checks.certainty_inflation_visible===true,'certainty inflation check failed');assert(validation().checks.source_laundering_visible===true,'source laundering check failed');assert(validation().checks.ambiguity_weaponization_visible===true,'ambiguity weaponization check failed');assert(validation().checks.loaded_label_substitution_visible===true,'loaded label substitution check failed')});add('hostile reframes are not treated as same claim',()=>{records().forEach(r=>{assert(r.same_claim_status==='not_same_claim',r.case_id+' same claim not rejected');assert(r.guards.hostile_reframe_is_not_same_claim===true,r.case_id+' hostile reframe guard missing');assert(r.guards.pressure_is_not_truth===true,r.case_id+' pressure truth guard missing');assert(r.expected_match===true,r.case_id+' expected match failed')});assert(validation().checks.hostile_reframe_not_same_claim===true,'hostile reframe check failed')});add('special adversarial guards remain active',()=>{assert(byFamily('motive_stuffing').guards.motive_stuffing_is_not_motive_proof===true,'motive guard missing');assert(byFamily('source_laundering').guards.source_laundering_is_not_independent_convergence===true,'source laundering guard missing');assert(byFamily('ambiguity_weaponization').guards.ambiguity_weaponization_does_not_close_ambiguity===true,'ambiguity guard missing');assert(byFamily('condition_deletion').guards.condition_deletion_is_not_same_claim===true,'condition guard missing');assert(byFamily('quantifier_injection').guards.quantifier_injection_is_not_same_claim===true,'quantifier guard missing')});add('pressure stays bounded and truth is not adjudicated',()=>{records().forEach(r=>{assert(typeof r.adversarial_pressure==='number',r.case_id+' pressure not number');assert(r.adversarial_pressure>=0&&r.adversarial_pressure<=1,r.case_id+' pressure out of range '+r.adversarial_pressure);assert(r.truth_status==='not_adjudicated',r.case_id+' truth adjudicated')});assert(validation().checks.no_truth_adjudication===true,'truth adjudication check failed')});add('no LLM, no lookup, candidate-only status, and belief movement are preserved',()=>{records().forEach(r=>{assert(r.llm_used===false,r.case_id+' used LLM');assert(r.external_lookup_performed===false,r.case_id+' performed lookup');assert(r.promotion_status==='not_promoted',r.case_id+' promoted');assert(r.doctrine_status==='candidate_not_doctrine',r.case_id+' doctrine status wrong');assert(r.belief_movement==='none',r.case_id+' moved belief')});assert(validation().checks.no_llm_used===true,'no LLM check failed');assert(validation().checks.no_external_lookup===true,'no lookup check failed');assert(validation().checks.candidate_only_not_promoted===true,'candidate-only check failed');assert(validation().checks.belief_movement_none===true,'belief movement check failed');assert(arr(validation().errors).length===0,'validation errors present: '+validation().errors.join(','))});(async function run(){const results=[];for(const t of tests){try{await t.fn();results.push({name:t.name,passed:true})}catch(e){results.push({name:t.name,passed:false,error:e.message})}}const passed=results.filter(r=>r.passed).length;document.getElementById('summary').className=passed===tests.length?'ok':'bad';document.getElementById('summary').textContent=passed+'/'+tests.length+' passed';document.getElementById('out').textContent=JSON.stringify({packet_type:'42ndMind_adversarial_narrative_pressure_test_report_v0_1',ok:passed===tests.length,source_claim_narrative_benchmark_ok:packet&&packet.source_claim_narrative_benchmark_ok,source_claim_narrative_benchmark_version:packet&&packet.source_claim_narrative_benchmark_version,source_benchmark_record_count:packet&&packet.source_benchmark_record_count,attack_record_count:packet&&packet.attack_record_count,attack_family_count:packet&&packet.attack_family_count,status_counts:packet&&packet.status_counts,records:records().map(r=>({case_id:r.case_id,attack_family:r.attack_family,observed_attack_status:r.observed_attack_status,expected_attack_status:r.expected_attack_status,expected_match:r.expected_match,structural_signals:r.structural_signals,adversarial_pressure:r.adversarial_pressure,same_claim_status:r.same_claim_status,truth_status:r.truth_status,promotion_status:r.promotion_status,belief_movement:r.belief_movement})),validation:validation(),results},null,2)})();</script></body></html>
