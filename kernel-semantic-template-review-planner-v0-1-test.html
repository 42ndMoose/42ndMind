<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>42ndMind Semantic Template Review Planner v0.1 Test</title>
  <style>
    body { margin:0; font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; background:#0f1115; color:#eef2ff; }
    header { padding:16px 18px; border-bottom:1px solid #2a3040; background:#11141b; }
    main { padding:12px; }
    section { background:#171a21; border:1px solid #2a3040; border-radius:10px; padding:12px; }
    h1 { font:700 19px/1.2 system-ui,-apple-system,Segoe UI,sans-serif; margin:0 0 4px; }
    pre { white-space:pre-wrap; background:#0d1016; border:1px solid #2a3040; border-radius:10px; padding:10px; overflow:auto; max-height:760px; }
    .ok { color:#9dffb4; } .bad { color:#ff8b8b; } a { color:#9db6ff; }
  </style>
</head>
<body>
<header><h1>42ndMind Semantic Template Review Planner v0.1 Test</h1><div>Tests gated recursive review planning from vector-compressed semantic templates.</div></header>
<main><section><h2 id="summary">Running...</h2><div><a href="semantic-template-review-planner.html">semantic template review planner</a> · <a href="semantic-vector-compressor.html">vector compressor</a> · <a href="semantic-operator-workbench.html">operator workbench</a></div><pre id="out"></pre></section></main>
<script src="src/kernel-semantic-corpus-v0-1.js?v=0.1.0"></script>
<script src="src/kernel-semantic-corpus-combiner-v0-1.js?v=0.1.0"></script>
<script src="src/kernel-semantic-pressure-registry-v0-1.js?v=0.1.0"></script>
<script src="src/kernel-semantic-pressure-registry-v0-1-1-patch.js?v=0.1.1"></script>
<script src="src/kernel-semantic-vector-compressor-v0-1.js?v=0.1.0"></script>
<script src="src/kernel-semantic-template-review-planner-v0-1.js?v=0.1.0"></script>
<script>
  const tests = [];
  let runPacket = null;
  let plan = null;
  let vectorPacket = null;
  let space = null;
  function add(name, fn) { tests.push({ name, fn }); }
  function assert(cond, msg) { if (!cond) throw new Error(msg); }
  function asArray(value) { return Array.isArray(value) ? value : []; }
  const EXTENSIONS = [
    'data/semantic_seed_closure_contrast_v0_1.json',
    'data/semantic_seed_authority_evidence_contrast_v0_1.json',
    'data/semantic_seed_motive_agency_weakmap_contrast_v0_1.json',
    'data/semantic_seed_scope_qualification_contrast_v0_1.json',
    'data/semantic_seed_closure_source_gap_contrast_v0_1.json',
    'data/semantic_seed_unverified_contrast_v0_1.json',
    'data/semantic_seed_rhetoric_intent_pressure_v0_1.json'
  ];

  add('modules load', () => {
    assert(window.KernelSemanticCorpusV01, 'KernelSemanticCorpusV01 missing');
    assert(window.KernelSemanticCorpusCombinerV01, 'KernelSemanticCorpusCombinerV01 missing');
    assert(window.KernelSemanticPressureRegistryV01, 'KernelSemanticPressureRegistryV01 missing');
    assert(window.KernelSemanticVectorCompressorV01, 'KernelSemanticVectorCompressorV01 missing');
    assert(window.KernelSemanticTemplateReviewPlannerV01, 'KernelSemanticTemplateReviewPlannerV01 missing');
  });

  add('doctrine preserves gated recursion and no belief movement', () => {
    const d = KernelSemanticTemplateReviewPlannerV01.doctrine();
    assert(d.planner_ranks_templates_not_truth === true, 'rank doctrine missing');
    assert(d.planner_requires_contrast_examples_before_reuse === true, 'contrast doctrine missing');
    assert(d.planner_blocks_auto_expansion_without_tests === true, 'auto-expansion block missing');
    assert(d.planner_does_not_infer_final_intent === true, 'intent doctrine missing');
    assert(d.belief_movement === 'none', 'belief movement doctrine wrong');
  });

  add('load compress and plan succeeds', async () => {
    runPacket = await KernelSemanticTemplateReviewPlannerV01.loadCompressAndPlan({ extension_urls: EXTENSIONS, min_observations: 2, limit: 8 });
    plan = runPacket.plan;
    vectorPacket = runPacket.vector_packet;
    space = vectorPacket.vector_space;
    assert(runPacket.ok === true, 'planner run not ok');
    assert(vectorPacket.ok === true, 'vector packet not ok');
    assert(vectorPacket.pressure_ontology.validation.ok === true, 'pressure ontology not ok');
    assert(runPacket.belief_movement === 'none', 'run moved belief');
  });

  add('plan is built from current 79-vector template space', () => {
    assert(plan.vector_count === 79, 'expected 79 vectors');
    assert(plan.template_count === 12, 'expected 12 candidate templates');
    assert(plan.selected_template_count > 0, 'expected selected templates');
    assert(plan.selected_template_count <= 8, 'selected template limit ignored');
    assert(plan.belief_movement === 'none', 'plan moved belief');
  });

  add('selected templates are scored and sorted', () => {
    const templates = plan.selected_templates;
    assert(templates.length === plan.selected_template_count, 'template count mismatch');
    for (let i = 1; i < templates.length; i++) {
      assert(templates[i - 1].priority_score >= templates[i].priority_score, 'templates not sorted by priority');
    }
    templates.forEach(t => {
      assert(t.template_id, 'template_id missing');
      assert(t.pressure_signature, 'pressure_signature missing');
      assert(typeof t.priority_score === 'number', 'priority_score missing');
      assert(typeof t.risk_score === 'number', 'risk_score missing');
      assert(typeof t.safety_score === 'number', 'safety_score missing');
      assert(t.reuse_status === 'candidate_template_requires_review', 'reuse status wrong');
      assert(t.belief_movement === 'none', 'template moved belief');
    });
  });

  add('suggested sentences are generated for analyzer review', () => {
    assert(plan.suggested_sentence_count > 0, 'no suggested sentences');
    assert(asArray(plan.suggested_sentences).length === plan.suggested_sentence_count, 'sentence count mismatch');
    assert(plan.suggested_sentences.some(s => /evidence|record|claim|source|disputed|unverified|misleading|transcript|summary|official|expert|accusation|motive|proof/i.test(s)), 'suggested sentences look unrelated');
  });

  add('review modes preserve safety gates', () => {
    const modes = new Set(plan.selected_templates.map(t => t.review_mode));
    assert(modes.has('contrast_first_high_guard') || modes.has('bounded_reuse_with_contrasts') || modes.has('safe_template_reuse_review'), 'no known review modes');
    plan.selected_templates.forEach(t => {
      assert(asArray(t.review_steps).includes('Generate direct and contrast examples from the suggested sentences.'), 'missing direct/contrast review step');
      assert(asArray(t.review_steps).some(step => step.includes('Do not promote')), 'promotion guard missing');
      assert(asArray(t.required_checks).length > 0 || asArray(t.blocked_movements).length > 0, 'template should expose checks or blocks');
    });
  });

  add('high risk templates expose high risk pressures when present', () => {
    const highRisk = plan.selected_templates.filter(t => t.risk_score >= 18);
    assert(plan.high_risk_template_count === highRisk.length, 'high risk count mismatch');
    highRisk.forEach(t => assert(asArray(t.high_risk_pressures).length > 0, 'high risk template lacks high-risk pressure list'));
  });

  add('planner can score a manual template', () => {
    const fake = { template_id:'manual_test', pressure_signature:'absence_to_truth_pressure|closure_pressure|uncertainty_calibration_pressure', observation_count:2 };
    const scored = KernelSemanticTemplateReviewPlannerV01.scoreTemplate(fake, vectorPacket.pressure_ontology);
    assert(scored.risk_score > 0, 'manual risk score missing');
    assert(scored.review_mode === 'contrast_first_high_guard' || scored.review_mode === 'bounded_reuse_with_contrasts', 'manual review mode too weak');
    const sentences = KernelSemanticTemplateReviewPlannerV01.suggestedSentencesFor(fake, scored);
    assert(sentences.some(s => s.includes('lack of disproof') || s.includes('disproven')), 'manual absence-to-truth suggestion missing');
  });

  add('planner does not mutate vector space or ontology', () => {
    assert(space.vector_count === 79, 'vector count changed');
    assert(space.template_count === 12, 'template count changed');
    assert(vectorPacket.pressure_ontology.validation.missing_pressure_count === 0, 'ontology gap introduced');
    assert(space.belief_movement === 'none', 'space moved belief');
    assert(vectorPacket.belief_movement === 'none', 'vector packet moved belief');
  });

  (async function run(){
    const results = [];
    for (const t of tests) {
      try { await t.fn(); results.push({ name:t.name, passed:true }); }
      catch(e) { results.push({ name:t.name, passed:false, error:e.message }); }
    }
    const passed = results.filter(r => r.passed).length;
    document.getElementById('summary').className = passed === tests.length ? 'ok' : 'bad';
    document.getElementById('summary').textContent = `${passed}/${tests.length} passed`;
    document.getElementById('out').textContent = JSON.stringify({
      packet_type: '42ndMind_semantic_template_review_planner_v0_1_test_report',
      vector_count: plan && plan.vector_count,
      template_count: plan && plan.template_count,
      selected_template_count: plan && plan.selected_template_count,
      high_risk_template_count: plan && plan.high_risk_template_count,
      suggested_sentence_count: plan && plan.suggested_sentence_count,
      results
    }, null, 2);
  })();
</script>
</body>
</html>
