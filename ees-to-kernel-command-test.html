<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>42ndMind EES → Kernel Command Test</title>
  <style>
    body { margin:0; font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; background:#0f1115; color:#eef2ff; }
    header { padding:16px 18px; border-bottom:1px solid #2a3040; background:#11141b; }
    main { padding:12px; }
    section { background:#171a21; border:1px solid #2a3040; border-radius:10px; padding:12px; }
    h1 { font:700 19px/1.2 system-ui,-apple-system,Segoe UI,sans-serif; margin:0 0 4px; }
    pre { white-space:pre-wrap; background:#0d1016; border:1px solid #2a3040; border-radius:10px; padding:10px; overflow:auto; max-height:700px; }
    .ok { color:#9dffb4; } .bad { color:#ff8b8b; }
    a { color:#9db6ff; }
  </style>
</head>
<body>
<header><h1>42ndMind EES → Kernel Command Test</h1><div>Smoke tests for metadata-only EES registry to copyable kernel command compiler.</div></header>
<main><section><h2 id="summary">Running...</h2><div><a href="ees-to-kernel-command.html">compiler page</a> · <a href="llm-brain-v0-3.html">live brain</a></div><pre id="out"></pre></section></main>
<script src="src/ees-to-kernel-command-v0-1.js?v=0.1.0"></script>
<script>
  const tests = [];
  function add(name, fn) { tests.push({ name, fn }); }
  function assert(cond, msg) { if (!cond) throw new Error(msg); }

  add('module loads', () => {
    assert(window.EESToKernelCommandV01, 'EESToKernelCommandV01 missing');
    assert(EESToKernelCommandV01.VERSION === '0.1.0', 'wrong version');
    assert(EESToKernelCommandV01.DEFAULT_STORAGE_KEY === '42ndMind_entity_event_source_registry_v0_1', 'wrong storage key');
  });

  add('sample compiles one mechanism into one claim', () => {
    const report = EESToKernelCommandV01.compileMechanism(EESToKernelCommandV01.sampleRegistry());
    const packet = report.epistemic_kernel_command.commands[0].packet;
    assert(report.packet_type === '42ndMind_ees_to_kernel_command_report', 'wrong report type');
    assert(packet.claims.length === 1, 'wrong claim count');
    assert(packet.claims[0].text.includes('Canada’s industrial posture'), 'claim text not from mechanism label');
  });

  add('linked events become supporting evidence candidates', () => {
    const report = EESToKernelCommandV01.compileMechanism(EESToKernelCommandV01.sampleRegistry());
    const evidence = report.epistemic_kernel_command.commands[0].packet.evidence;
    const supports = evidence.filter(e => e.relation === 'supports');
    assert(supports.length === 3, 'linked events did not become 3 supporting evidence candidates');
    assert(supports.every(e => e.source === 'entity_event_source_registry'), 'support evidence source wrong');
  });

  add('overclaim flags become attacking evidence', () => {
    const report = EESToKernelCommandV01.compileMechanism(EESToKernelCommandV01.sampleRegistry());
    const attacks = report.epistemic_kernel_command.commands[0].packet.evidence.filter(e => e.relation === 'attacks');
    assert(attacks.length === 2, 'overclaim flags did not become attacks');
    assert(attacks.some(e => e.text.includes('Direct coordination is not established')), 'direct coordination counter missing');
    assert(attacks.some(e => e.text.includes('Motive or intent is not established')), 'motive counter missing');
  });

  add('unresolved questions become open questions', () => {
    const report = EESToKernelCommandV01.compileMechanism(EESToKernelCommandV01.sampleRegistry());
    const questions = report.epistemic_kernel_command.commands[0].packet.questions;
    assert(questions.length === 2, 'wrong question count');
    assert(questions[0].text.includes('Ottawa alignment'), 'first unresolved question missing');
  });

  add('source and review status are preserved as metadata', () => {
    const report = EESToKernelCommandV01.compileMechanism(EESToKernelCommandV01.sampleRegistry());
    const packet = report.epistemic_kernel_command.commands[0].packet;
    assert(packet.meta.support_status === 'unreviewed', 'support status missing from meta');
    assert(packet.meta.source_review_status_is_metadata_only === true, 'metadata-only source review flag missing');
    assert(packet.claims[0].links.source_review_status_is_metadata_only === true, 'claim metadata flag missing');
    assert(packet.evidence.every(e => e.links.source_review_status_is_metadata_only === true), 'evidence metadata flag missing');
  });

  add('compiler does not import automatically or move belief state', () => {
    const report = EESToKernelCommandV01.compileMechanism(EESToKernelCommandV01.sampleRegistry());
    assert(report.doctrine.no_automatic_import === true, 'automatic import not blocked');
    assert(report.doctrine.belief_movement === 'none', 'belief movement not none');
    assert(report.epistemic_kernel_command.requires_user_approval === true, 'command does not require approval');
    assert(report.epistemic_kernel_command.commands[0].op === 'import_packet', 'command shape wrong');
  });

  add('observations remain empty to avoid low-signal noise', () => {
    const report = EESToKernelCommandV01.compileMechanism(EESToKernelCommandV01.sampleRegistry());
    const packet = report.epistemic_kernel_command.commands[0].packet;
    assert(Array.isArray(packet.observations), 'observations missing');
    assert(packet.observations.length === 0, 'observations should be empty');
    assert(packet.meta.observations_omitted_to_avoid_low_signal_noise === true, 'observation guardrail missing');
  });

  add('saved wrapper extraction works', () => {
    const wrapper = { saved_at:'test', entityEventSourceRegistry:EESToKernelCommandV01.sampleRegistry(), meta:{ non_scoring:true } };
    const reg = EESToKernelCommandV01.extractRegistry(JSON.stringify(wrapper));
    assert(reg && reg.mechanisms && reg.mechanisms.length === 1, 'wrapper extraction failed');
  });

  add('gate events preserve reality contact and counter-consideration pressure', () => {
    const report = EESToKernelCommandV01.compileMechanism(EESToKernelCommandV01.sampleRegistry());
    const gates = report.epistemic_kernel_command.commands[0].packet.gate_events;
    assert(gates.some(g => g.gate === 'G5_reality_contact'), 'G5 reality contact event missing');
    assert(gates.some(g => g.gate === 'G1_counter_consideration'), 'G1 counter consideration event missing');
  });

  add('kernel command keeps provenance humility guardrails', () => {
    const report = EESToKernelCommandV01.compileMechanism(EESToKernelCommandV01.sampleRegistry());
    const meta = report.epistemic_kernel_command.commands[0].packet.meta;
    assert(meta.retrieval_is_not_verification === true, 'retrieval guardrail missing');
    assert(meta.provenance_is_not_proof === true, 'provenance guardrail missing');
    assert(meta.named_entity_is_not_guilt === true, 'entity guardrail missing');
    assert(meta.event_is_not_proof_of_motive === true, 'event motive guardrail missing');
    assert(meta.convergence_is_not_command_proof === true, 'convergence guardrail missing');
  });

  const results = tests.map(t => { try { t.fn(); return { name:t.name, passed:true }; } catch(e) { return { name:t.name, passed:false, error:e.message }; } });
  const passed = results.filter(r => r.passed).length;
  document.getElementById('summary').className = passed === results.length ? 'ok' : 'bad';
  document.getElementById('summary').textContent = `${passed}/${results.length} passed`;
  document.getElementById('out').textContent = JSON.stringify({ packet_type:'42ndMind_ees_to_kernel_command_test_report', results }, null, 2);
</script>
</body>
</html>
