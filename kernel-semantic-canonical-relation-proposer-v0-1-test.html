<script src="src/kernel-semantic-canonical-relation-proposer-v0-1.js?v=0.1.0"></script>
<script>
  const tests = [];
  let fullPacket = null;
  function add(name, fn) { tests.push({ name, fn }); }
  function assert(cond, msg) { if (!cond) throw new Error(msg); }

  const fixtureBasisReport = {
    packet_type: '42ndMind_semantic_canonical_vector_basis_report_v0_1_fixture',
    summary: { basis_dimension_count: 4, canonical_vector_count: 4 },
    canonical_vectors: [
      { law_id:'law_a', canonical_vector_id:'cv_a', source_operator_metadata:'operator_a', canonical_dimensions:['d1','d2'], canonical_signature:'d1|d2', local_pressure_metadata:['p1','p2'], belief_movement:'none' },
      { law_id:'law_b', canonical_vector_id:'cv_b', source_operator_metadata:'operator_b', canonical_dimensions:['d1','d2','d3'], canonical_signature:'d1|d2|d3', local_pressure_metadata:['p1','p2','p3'], belief_movement:'none' },
      { law_id:'law_c', canonical_vector_id:'cv_c', source_operator_metadata:'operator_c', canonical_dimensions:['d4'], canonical_signature:'d4', local_pressure_metadata:['p4'], belief_movement:'none' },
      { law_id:'law_d', canonical_vector_id:'cv_d', source_operator_metadata:'operator_d', canonical_dimensions:['d1','d2'], canonical_signature:'d1|d2', local_pressure_metadata:['p1','p2'], belief_movement:'none' }
    ],
    equivalence_classes: [
      { class_id:'E1', canonical_signature:'d1|d2', member_count:2, member_law_ids:['law_a','law_d'], member_vector_ids:['cv_a','cv_d'], status:'nontrivial_equivalence_class', belief_movement:'none' },
      { class_id:'E2', canonical_signature:'d1|d2|d3', member_count:1, member_law_ids:['law_b'], member_vector_ids:['cv_b'], status:'singleton_class', belief_movement:'none' },
      { class_id:'E3', canonical_signature:'d4', member_count:1, member_law_ids:['law_c'], member_vector_ids:['cv_c'], status:'singleton_class', belief_movement:'none' }
    ],
    relations: [
      { left_vector_id:'cv_a', right_vector_id:'cv_b', left_law_id:'law_a', right_law_id:'law_b', relation_type:'strict_subset', shared_dimensions:['d1','d2'], left_only_dimensions:[], right_only_dimensions:['d3'], jaccard_similarity:0.6667, contrast_like:false, candidate_invariant_relation:true, belief_movement:'none' },
      { left_vector_id:'cv_a', right_vector_id:'cv_c', left_law_id:'law_a', right_law_id:'law_c', relation_type:'orthogonal', shared_dimensions:[], left_only_dimensions:['d1','d2'], right_only_dimensions:['d4'], jaccard_similarity:0, contrast_like:false, candidate_invariant_relation:false, belief_movement:'none' },
      { left_vector_id:'cv_a', right_vector_id:'cv_d', left_law_id:'law_a', right_law_id:'law_d', relation_type:'equivalent', shared_dimensions:['d1','d2'], left_only_dimensions:[], right_only_dimensions:[], jaccard_similarity:1, contrast_like:false, candidate_invariant_relation:true, belief_movement:'none' }
    ],
    belief_movement:'none'
  };

  add('modules load', () => {
    assert(window.KernelSemanticCanonicalRelationProposerV01, 'canonical relation proposer missing');
    assert(window.KernelSemanticCanonicalVectorBasisV01, 'canonical vector basis missing');
    assert(KernelSemanticCanonicalRelationProposerV01.VERSION === '0.1.0', 'version wrong');
  });

  add('doctrine preserves no belief movement and label warning', () => {
    const d = KernelSemanticCanonicalRelationProposerV01.doctrine();
    assert(d.canonical_relation_candidates_are_not_doctrine === true, 'candidate doctrine missing');
    assert(d.relations_are_structural_under_anonymous_basis_not_label_truth === true, 'anonymous structure doctrine missing');
    assert(d.local_labels_are_explanatory_metadata_only === true, 'local labels doctrine missing');
    assert(d.relation_proposer_does_not_move_belief === true, 'movement doctrine missing');
    assert(d.belief_movement === 'none', 'belief movement wrong');
  });

  add('vectorById indexes vectors', () => {
    const map = KernelSemanticCanonicalRelationProposerV01.vectorById(fixtureBasisReport);
    assert(map.cv_a.source_operator_metadata === 'operator_a', 'cv_a missing');
    assert(map.cv_d.law_id === 'law_d', 'cv_d missing');
  });

  add('proposeEquivalenceClasses creates class candidate', () => {
    const candidates = KernelSemanticCanonicalRelationProposerV01.proposeEquivalenceClasses(fixtureBasisReport);
    assert(candidates.length === 1, 'expected one nontrivial equivalence candidate');
    assert(candidates[0].relation_kind === 'canonical_equivalence', 'wrong relation kind');
    assert(candidates[0].formal_statement.includes('operator_a'), 'formal statement missing member');
    assert(candidates[0].belief_movement === 'none', 'candidate moved belief');
  });

  add('proposeRelation handles subset relation', () => {
    const c = KernelSemanticCanonicalRelationProposerV01.proposeRelation(fixtureBasisReport.relations[0], fixtureBasisReport);
    assert(c.relation_kind === 'canonical_subset', 'subset relation kind wrong');
    assert(c.formal_statement.includes('⊂'), 'subset symbol missing');
    assert(c.review_requirement.includes('superset'), 'subset review text missing');
  });

  add('proposeRelation handles orthogonality', () => {
    const c = KernelSemanticCanonicalRelationProposerV01.proposeRelation(fixtureBasisReport.relations[1], fixtureBasisReport);
    assert(c.relation_kind === 'canonical_orthogonality', 'orthogonality kind wrong');
    assert(c.formal_statement.includes('⟂'), 'orthogonality symbol missing');
    assert(c.local_label_metadata.includes('p4'), 'local metadata missing');
  });

  add('proposeRelation handles equivalence pair', () => {
    const c = KernelSemanticCanonicalRelationProposerV01.proposeRelation(fixtureBasisReport.relations[2], fixtureBasisReport);
    assert(c.relation_kind === 'canonical_equivalence_pair', 'equivalence pair kind wrong');
    assert(c.formal_statement.includes('≡'), 'equivalence symbol missing');
  });

  add('proposeFromBasisReport summarizes candidates', () => {
    const report = KernelSemanticCanonicalRelationProposerV01.proposeFromBasisReport(fixtureBasisReport);
    assert(report.packet_type === '42ndMind_semantic_canonical_relation_candidate_report_v0_1', 'wrong packet type');
    assert(report.summary.candidate_count === 4, 'candidate count wrong');
    assert(report.summary.equivalence_class_candidate_count === 1, 'equivalence class count wrong');
    assert(report.summary.pair_relation_candidate_count === 3, 'pair relation count wrong');
    assert(report.summary.objective_language_claim === 'relation_candidates_under_anonymous_basis_not_final_math', 'objective claim wrong');
    assert(report.belief_movement === 'none', 'report moved belief');
  });

  add('module availability reports full path', () => {
    const a = KernelSemanticCanonicalRelationProposerV01.modulesAvailable();
    assert(a.canonical_basis === true, 'canonical basis unavailable');
  });

  add('loadCanonicalizeAndPropose runs current full path', async () => {
    fullPacket = await KernelSemanticCanonicalRelationProposerV01.loadCanonicalizeAndPropose({ min_template_observations:2, min_observations:2, limit:10, sentences_per_template:4, allowed_extra_pressures:0, min_strong_observations:4 });
    assert(fullPacket.ok === true, 'full relation packet not ok');
    assert(fullPacket.relation_report.summary.candidate_count >= 1, 'expected relation candidates');
    assert(fullPacket.relation_report.summary.basis_dimension_count >= 1, 'expected basis dimensions');
    assert(fullPacket.relation_report.summary.canonical_vector_count >= 1, 'expected canonical vectors');
    assert(fullPacket.relation_report.belief_movement === 'none', 'relation report moved belief');
    assert(fullPacket.belief_movement === 'none', 'full packet moved belief');
  });

  (async function run(){
    const results = [];
    for (const t of tests) {
      try { await t.fn(); results.push({ name:t.name, passed:true }); }
      catch(e) { results.push({ name:t.name, passed:false, error:e.message }); }
    }
    const passed = results.filter(r => r.passed).length;
    document.getElementById('summary').className = passed === tests.length ? 'ok' : 'bad';
    document.getElementById('summary').textContent = `${passed}/${tests.length} passed`;
    document.getElementById('out').textContent = JSON.stringify({
      packet_type:'42ndMind_semantic_canonical_relation_proposer_v0_1_test_report',
      full_relation_summary: fullPacket && fullPacket.summary,
      results
    }, null, 2);
  })();
</script>
