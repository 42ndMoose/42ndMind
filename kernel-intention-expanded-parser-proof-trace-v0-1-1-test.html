<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>42ndMind Expanded Parser Proof Trace Test</title><style>body{margin:0;background:#0f1115;color:#eef2ff;font:14px ui-monospace,Menlo,Consolas,monospace}header{padding:16px;background:#11141b;border-bottom:1px solid #2a3040}main{padding:12px}section{background:#171a21;border:1px solid #2a3040;border-radius:10px;padding:12px}pre{white-space:pre-wrap;background:#0d1016;border:1px solid #2a3040;border-radius:10px;padding:10px;overflow:auto;max-height:760px}.ok{color:#9dffb4}.bad{color:#ff8b8b}a{color:#9db6ff}</style></head><body><header><h1>42ndMind Expanded Parser Proof Trace Test</h1><div>Tests 27 expanded parser rows → accepted formula traces or holdout traces. Candidate only.</div></header><main><section><h2 id="summary">Running...</h2><div><a href="intention-expanded-parser-proof-trace.html?v=ptrace-2">expanded parser proof trace page</a></div><pre id="out"></pre></section></main><script src="src/kernel-intention-discovery-v0-1.js?v=intent-1"></script><script src="src/kernel-intention-refinement-v0-1.js?v=refine-1"></script><script src="src/kernel-intention-necessity-test-v0-1.js?v=necessity-1"></script><script src="src/kernel-intention-neighbor-lattice-v0-1.js?v=lattice-3"></script><script src="src/kernel-intention-lattice-invariance-benchmark-v0-1.js?v=invariance-2"></script><script src="src/kernel-intention-formula-compiler-v0-1.js?v=formula-1"></script><script src="src/kernel-intention-concept-expansion-loop-v0-1.js?v=expansion-2"></script><script src="src/kernel-intention-contradiction-refinement-loop-v0-1.js?v=contradiction-1"></script><script src="src/kernel-intention-formula-revision-engine-v0-1.js?v=revision-1"></script><script src="src/kernel-intention-canonical-formula-ledger-v0-1.js?v=ledger-1"></script><script src="src/kernel-intention-proof-output-v0-1.js?v=proof-1"></script><script src="src/kernel-intention-minimal-pair-library-v0-1.js?v=minpair-1"></script><script src="src/kernel-intention-dimension-splitting-v0-1.js?v=split-2"></script><script src="src/kernel-intention-coefficient-dimension-revision-engine-v0-1.js?v=codim-1"></script><script src="src/kernel-intention-canonical-formula-ledger-v0-1-1-patch.js?v=ledger-2"></script><script src="src/kernel-intention-arbitrary-language-parser-v0-1.js?v=parser-1"></script><script src="src/kernel-intention-arbitrary-language-parser-v0-1-1-patch.js?v=parser-3"></script><script src="src/kernel-intention-parser-proof-trace-v0-1.js?v=ptrace-1"></script><script src="src/kernel-intention-parser-proof-trace-v0-1-1-patch.js?v=ptrace-2"></script><script>const tests=[];let packet=null;function add(n,f){tests.push({name:n,fn:f})}function assert(c,m){if(!c)throw new Error(m)}function arr(v){return Array.isArray(v)?v:[]}function traces(){return arr(packet&&packet.traces)}function accepted(){return traces().filter(t=>t.trace_kind==='accepted_formula_trace')}function holdout(){return traces().filter(t=>t.trace_kind==='holdout_trace')}add('modules load and doctrine is expanded-trace only',()=>{assert(window.KernelIntentionParserProofTraceV011,'expanded trace patch missing');assert(KernelIntentionParserProofTraceV011.VERSION==='0.1.1','version wrong');assert(typeof KernelIntentionParserProofTraceV011.runExpandedTrace==='function','runExpandedTrace missing');const d=KernelIntentionParserProofTraceV011.doctrine();assert(d.expands_parser_proof_trace_to_twenty_seven_cases===true,'expanded trace doctrine missing');assert(d.accepted_cases_get_formula_traces===true,'accepted trace doctrine missing');assert(d.unmatched_cases_get_holdout_traces===true,'holdout trace doctrine missing');assert(d.holdout_trace_is_not_formula_acceptance===true,'holdout non-acceptance guard missing');assert(d.belief_movement==='none','belief movement wrong')});add('expanded trace runs from expanded parser, ledger, and proof output',()=>{packet=KernelIntentionParserProofTraceV011.runExpandedTrace();assert(packet.ok===true,'packet not ok: '+JSON.stringify(packet.validation));assert(packet.source_expanded_parser_ok===true,'source expanded parser not ok');assert(packet.source_expanded_parser_parse_count===27,'expected 27 parser rows');assert(packet.source_ledger_ok===true,'source ledger not ok');assert(packet.source_ledger_record_count===11,'expected 11 ledger records');assert(packet.source_proof_ok===true,'source proof not ok');assert(packet.source_proof_count===11,'expected 11 proof rows')});add('twenty-seven traces are produced with 25 accepted and 2 holdout traces',()=>{assert(packet.trace_count===27,'expected 27 traces');assert(accepted().length===25,'expected 25 accepted traces');assert(holdout().length===2,'expected 2 holdout traces');assert(packet.validation.checks.twenty_seven_traces===true,'27 traces check failed');assert(packet.validation.checks.twenty_five_accepted_formula_traces===true,'25 accepted check failed');assert(packet.validation.checks.two_holdout_traces===true,'2 holdout check failed')});add('accepted traces have v0003 formula snapshots and proof references',()=>{accepted().forEach(t=>{assert(t.candidate_version.includes('v0003_coefficient_dimension_revision'),t.trace_id+' not v0003');assert(t.formula_snapshot&&t.formula_snapshot.symbolic_formula,t.trace_id+' missing formula');assert(t.proof_reference&&t.proof_reference.proof_id,t.trace_id+' missing proof reference');assert(t.trace_text.includes('Matched dimensions:'),t.trace_id+' missing matched dimensions');assert(t.trace_text.includes('Unresolved dimensions:'),t.trace_id+' missing unresolved dimensions')});assert(packet.validation.checks.accepted_traces_have_v0003_formula===true,'accepted formula check failed');assert(packet.validation.checks.accepted_traces_have_proof_reference===true,'accepted proof check failed')});add('holdout traces have no formula acceptance',()=>{holdout().forEach(t=>{assert(t.parse_status==='unmatched',t.trace_id+' status not unmatched');assert(t.unmatched_holdout_applied===true,t.trace_id+' holdout not applied');assert(t.formula_snapshot===null,t.trace_id+' should not have formula snapshot');assert(t.proof_reference===null,t.trace_id+' should not have proof reference');assert(t.rejected_candidate&&t.rejected_candidate.length>0,t.trace_id+' missing rejected candidate');assert(t.trace_text.includes('no formula acceptance'),t.trace_id+' missing no acceptance statement')});assert(packet.validation.checks.holdout_traces_have_no_formula_acceptance===true,'holdout no-acceptance check failed')});add('ambiguity and unresolved dimensions remain visible',()=>{traces().forEach(t=>{assert(typeof t.ambiguity_score==='number',t.trace_id+' missing ambiguity score');assert(typeof t.unresolved_dimension_count==='number',t.trace_id+' missing unresolved dimension count')});assert(packet.validation.checks.ambiguity_visible===true,'ambiguity check failed');assert(packet.validation.checks.unresolved_dimensions_visible===true,'unresolved check failed')});add('accepted L1 totals and force separation are preserved',()=>{accepted().forEach(t=>{assert(t.observed_l1_total===1,t.trace_id+' l1 wrong: '+t.observed_l1_total);assert(t.force_terms_outside_shape===true,t.trace_id+' force leaked')});assert(packet.validation.checks.accepted_l1_totals_equal_1===true,'accepted l1 check failed');assert(packet.validation.checks.accepted_force_terms_outside_shape===true,'accepted force check failed')});add('candidate-only status and belief movement are preserved',()=>{traces().forEach(t=>{assert(t.promotion_status==='not_promoted',t.trace_id+' promoted');assert(t.doctrine_status==='candidate_not_doctrine',t.trace_id+' doctrine status wrong');assert(t.belief_movement==='none',t.trace_id+' moved belief')});assert(packet.validation.checks.candidate_only_not_promoted===true,'candidate-only check failed');assert(packet.validation.checks.belief_movement_none===true,'belief movement check failed');assert(arr(packet.validation.errors).length===0,'validation errors present: '+packet.validation.errors.join(','))});(async function run(){const results=[];for(const t of tests){try{await t.fn();results.push({name:t.name,passed:true})}catch(e){results.push({name:t.name,passed:false,error:e.message})}}const passed=results.filter(r=>r.passed).length;document.getElementById('summary').className=passed===tests.length?'ok':'bad';document.getElementById('summary').textContent=passed+'/'+tests.length+' passed';document.getElementById('out').textContent=JSON.stringify({packet_type:'42ndMind_intention_expanded_parser_proof_trace_test_report_v0_1_1',ok:passed===tests.length,source_expanded_parser_parse_count:packet&&packet.source_expanded_parser_parse_count,source_ledger_record_count:packet&&packet.source_ledger_record_count,source_proof_count:packet&&packet.source_proof_count,trace_count:packet&&packet.trace_count,accepted_trace_count:packet&&packet.accepted_trace_count,holdout_trace_count:packet&&packet.holdout_trace_count,holdout_traces:holdout().map(t=>({trace_id:t.trace_id,parse_id:t.parse_id,parse_status:t.parse_status,rejected_candidate:t.rejected_candidate,unmatched_holdout_applied:t.unmatched_holdout_applied,unmatched_holdout_reason:t.unmatched_holdout_reason,conclusion:t.conclusion,belief_movement:t.belief_movement})),validation:packet&&packet.validation,results},null,2)})();</script></body></html>
