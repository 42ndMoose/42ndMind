<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>42ndMind Intention Necessity Test</title><style>body{margin:0;background:#0f1115;color:#eef2ff;font:14px ui-monospace,Menlo,Consolas,monospace}header{padding:16px;background:#11141b;border-bottom:1px solid #2a3040}main{padding:12px}section{background:#171a21;border:1px solid #2a3040;border-radius:10px;padding:12px}pre{white-space:pre-wrap;background:#0d1016;border:1px solid #2a3040;border-radius:10px;padding:10px;overflow:auto;max-height:760px}.ok{color:#9dffb4}.bad{color:#ff8b8b}a{color:#9db6ff}</style></head><body><header><h1>42ndMind Intention Necessity Test</h1><div>Tests remove-one-dimension counterfactual pressure. Candidate only. No person/event attribution.</div></header><main><section><h2 id="summary">Running...</h2><div><a href="intention-necessity.html?v=necessity-1">intention necessity page</a></div><pre id="out"></pre></section></main><script src="src/kernel-intention-discovery-v0-1.js?v=intent-1"></script><script src="src/kernel-intention-refinement-v0-1.js?v=refine-1"></script><script src="src/kernel-intention-necessity-test-v0-1.js?v=necessity-1"></script><script>const tests=[];let packet=null;function add(n,f){tests.push({name:n,fn:f})}function assert(c,m){if(!c)throw new Error(m)}function arr(v){return Array.isArray(v)?v:[]}function byConcept(name){return arr(packet&&packet.candidates).find(c=>c.concept===name)}function dim(c,name){return arr(c&&c.dimension_tests).find(t=>t.dimension===name)}add('modules load',()=>{assert(window.KernelIntentionDiscoveryV01,'discovery missing');assert(window.KernelIntentionRefinementV01,'refinement missing');assert(window.KernelIntentionNecessityTestV01,'necessity missing');assert(KernelIntentionNecessityTestV01.VERSION==='0.1.0','version wrong');assert(typeof KernelIntentionNecessityTestV01.runNecessityTests==='function','runNecessityTests missing')});add('doctrine keeps necessity candidate-only',()=>{const d=KernelIntentionNecessityTestV01.doctrine();assert(d.tests_intention_concepts_not_claim_facts===true,'concept test doctrine missing');assert(d.no_real_world_intent_attribution===true,'attribution guard missing');assert(d.necessity_findings_are_candidate_not_doctrine===true,'candidate-only guard missing');assert(d.counterfactual_shapes_preserve_l1_total==='sum_abs_dimensions_equals_1','unit-total guard missing');assert(d.belief_movement==='none','belief movement wrong')});add('necessity tests run from refinement output',()=>{packet=KernelIntentionNecessityTestV01.runNecessityTests();assert(packet.ok===true,'packet not ok: '+JSON.stringify(packet.validation));assert(packet.source_refinement_ok===true,'source refinement not ok');assert(packet.necessity_candidate_count===3,'expected 3 candidates');assert(byConcept('desire'),'missing desire');assert(byConcept('lying'),'missing lying');assert(byConcept('promise'),'missing promise');assert(packet.belief_movement==='none','packet moved belief')});add('all counterfactual shapes preserve unit total',()=>{arr(packet.candidates).forEach(c=>{assert(c.necessity_review_status==='necessity_candidate_not_doctrine',c.concept+' promoted too early');assert(c.belief_movement==='none',c.concept+' moved belief');arr(c.dimension_tests).forEach(t=>{assert(t.doctrine_status==='candidate_necessity_finding_not_doctrine',c.concept+' finding promoted: '+t.dimension);assert(t.belief_movement==='none',c.concept+' test moved belief: '+t.dimension);const cf=t.counterfactual_shape_after_removal;if(!cf.empty_after_removal){assert(cf.l1_total===1,c.concept+' counterfactual l1 not 1 after removing '+t.dimension+': '+cf.l1_total);assert(t.unit_total_preserved_after_removal===true,c.concept+' unit flag false: '+t.dimension)}})})});add('desire necessity classes match first pass',()=>{const c=byConcept('desire');assert(dim(c,'recognized_gap_or_absence').necessity_class==='necessary_core','desire gap should be necessary core');assert(dim(c,'preferred_possible_state').necessity_class==='necessary_core','desire preferred state should be necessary core');assert(dim(c,'attainment_pull').neighbor_shift==='preference','desire without pull should shift to preference');assert(dim(c,'constraint_contact').necessity_class==='boundary_condition','desire constraint should be boundary');assert(dim(c,'action_or_attention_orientation').necessity_class==='derivative_expression','desire orientation should be derivative')});add('lying necessity classes match first pass',()=>{const c=byConcept('lying');assert(dim(c,'proposition_representation').removal_result==='concept_collapses','lying proposition removal should collapse');assert(dim(c,'belief_assertion_mismatch').neighbor_shift==='mistake','lying without mismatch should shift to mistake');assert(dim(c,'concealment_of_mismatch').neighbor_shift.includes('fiction'),'lying without concealment should shift to nonliteral neighbors');assert(dim(c,'advantage_avoidance_or_control_pressure').necessity_class==='derivative_expression','lying motive pressure should be derivative')});add('promise necessity classes match first pass',()=>{const c=byConcept('promise');assert(dim(c,'future_action_or_state_commitment').removal_result==='concept_collapses','promise future commitment removal should collapse');assert(dim(c,'speaker_ownership_of_commitment').neighbor_shift==='prediction_or_external_expectation','promise ownership removal should shift');assert(dim(c,'condition_or_scope_boundary').necessity_class==='boundary_condition','promise scope should be boundary');assert(dim(c,'breach_meaning_if_failed').necessity_class==='derivative_expression','promise breach should be derivative')});add('validation report is clean',()=>{assert(packet.validation&&packet.validation.ok===true,'validation not ok');packet.validation.validations.forEach(v=>{assert(v.ok===true,v.concept+' validation failed: '+v.errors.join(','));assert(v.dimension_test_count>=6,v.concept+' too few tests');assert(v.necessary_core_count>=4,v.concept+' too few necessary core dims');assert(v.belief_movement==='none',v.concept+' validation moved belief')})});(async function run(){const results=[];for(const t of tests){try{await t.fn();results.push({name:t.name,passed:true})}catch(e){results.push({name:t.name,passed:false,error:e.message})}}const passed=results.filter(r=>r.passed).length;document.getElementById('summary').className=passed===tests.length?'ok':'bad';document.getElementById('summary').textContent=passed+'/'+tests.length+' passed';document.getElementById('out').textContent=JSON.stringify({packet_type:'42ndMind_intention_necessity_test_report_v0_1',ok:passed===tests.length,candidate_count:packet&&packet.necessity_candidate_count,concepts:packet&&packet.candidates&&packet.candidates.map(c=>({concept:c.concept,necessary_core:c.necessary_core_dimensions,boundary:c.boundary_dimensions,derivative:c.derivative_expression_dimensions,summary:c.summary})),validation:packet&&packet.validation,results},null,2)})();</script></body></html>
