<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>42ndMind</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing:border-box; }
    html, body { margin:0; height:100%; }
    body { font-family:system-ui,-apple-system,Segoe UI,sans-serif; background:#070b10; color:#e8edf2; }
    main { height:100%; max-width:760px; margin:0 auto; display:flex; flex-direction:column; padding:12px; }
    #chat { flex:1; overflow:auto; display:flex; flex-direction:column; gap:10px; padding:6px 0 12px; }
    .msg { max-width:82%; padding:11px 13px; border-radius:18px; line-height:1.38; white-space:pre-wrap; word-break:break-word; }
    .me { align-self:flex-end; background:#d7e7ff; color:#07111f; border-bottom-right-radius:6px; }
    .brain { align-self:flex-start; background:#111821; color:#e8edf2; border:1px solid #26313d; border-bottom-left-radius:6px; }
    form { display:flex; gap:8px; padding-top:8px; }
    input { flex:1; border:1px solid #26313d; background:#0d141c; color:#e8edf2; border-radius:18px; padding:12px 14px; font-size:16px; outline:none; }
    input:focus { border-color:#58708d; }
    button { border:0; border-radius:18px; background:#d7e7ff; color:#07111f; font-weight:800; padding:0 17px; cursor:pointer; }
    #error { display:none; margin-bottom:8px; color:#ffb4b4; background:#260f12; border:1px solid #7c2d2d; border-radius:12px; padding:10px; font:12px ui-monospace,SFMono-Regular,Menlo,monospace; white-space:pre-wrap; }
  </style>
</head>
<body>
<main>
  <div id="error"></div>
  <section id="chat" aria-live="polite"></section>
  <form id="form">
    <input id="input" autocomplete="off" />
    <button>Send</button>
  </form>
</main>

<script src="src/infant-symbolic-kernel.js?v=20260524-8"></script>
<script src="src/infant-cycle-v0-1.js?v=20260524-8"></script>
<script src="src/infant-drive-v0-1.js?v=20260524-8"></script>
<script src="src/infant-drive-learning-v0-1.js?v=20260524-8"></script>
<script src="src/infant-organism-v0-1.js?v=20260524-8"></script>
<script src="src/infant-expression-field-v0-1.js?v=20260524-8"></script>
<script src="src/infant-expression-feedback-v0-1.js?v=20260524-8"></script>
<script src="src/infant-whole-loop-v0-1.js?v=20260524-8"></script>
<script src="src/infant-brain-v0-1.js?v=20260524-8"></script>
<script src="src/math-language-core-v0-1.js?v=20260524-8"></script>
<script src="src/brain-v0-3.js?v=20260524-8"></script>
<script>
(function(){
  const chat = document.getElementById('chat');
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const errorBox = document.getElementById('error');
  const K = window.FortySecondMindBrain;
  let state = null;

  function showError(err){
    errorBox.style.display = 'block';
    errorBox.textContent = String((err && err.stack) || err);
    console.error(err);
  }

  function add(kind, text){
    if(!text) return;
    const div = document.createElement('div');
    div.className = 'msg ' + kind;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function ready(){
    if(!K) throw new Error('Brain did not load.');
    ['birthBrain','respondBrain','speakBrain'].forEach(name => {
      if(typeof K[name] !== 'function') throw new Error('Missing brain function: ' + name);
    });
  }

  function boot(){
    ready();
    state = K.birthBrain();
  }

  form.addEventListener('submit', function(e){
    e.preventDefault();
    const text = input.value.trim();
    if(!text) return;
    input.value = '';
    try {
      errorBox.style.display = 'none';
      if(!state) state = K.birthBrain();
      add('me', text);
      add('brain', K.respondBrain(state, text, 12, 4));
    } catch(err) { showError(err); }
  });

  window.addEventListener('error', e => showError(e.error || e.message));
  window.addEventListener('unhandledrejection', e => showError(e.reason || e));

  try { boot(); }
  catch(err) { showError(err); }
})();
</script>
</body>
</html>
