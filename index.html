<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>42ndMind Active Body</title><style>:root{color-scheme:dark}body{margin:0;background:#0b0c10;color:#f4f6fb;font-family:system-ui,-apple-system,Segoe UI,sans-serif;line-height:1.5}main{width:min(1120px,calc(100% - 24px));margin:auto;padding:28px 0 64px}section{border:1px solid #303746;border-radius:22px;background:#151922;padding:22px;margin:16px 0}.top{background:#181c26}h1{font-size:clamp(2rem,7vw,4.6rem);line-height:.95;letter-spacing:-.06em;margin:0 0 12px}.muted{color:#aab2c2}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.box{border:1px solid #303746;border-radius:16px;background:rgba(0,0,0,.18);padding:14px;overflow:auto}.formula code{display:block;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#e2e8f0;margin:6px 0;font-size:1.05rem}.pills{display:flex;flex-wrap:wrap;gap:8px}.pill{border:1px solid #303746;border-radius:999px;padding:7px 10px;color:#aab2c2;font-size:.85rem}.pill strong{color:#f4f6fb}.ok strong,.oktxt{color:#b8f5ce}.bad strong,.badtxt{color:#ffb4b4}.warn strong,.warntxt{color:#ffe0a3}.word{font-size:clamp(2.4rem,8vw,5rem);font-weight:850;letter-spacing:-.06em;margin:10px 0;color:#e2e8f0}.node{border-left:1px solid #3a4254;margin-left:10px;padding:4px 0 4px 12px}.head{display:flex;gap:7px;flex-wrap:wrap;border:1px solid #303746;border-radius:12px;padding:7px;margin-bottom:5px}.id{font-weight:750}.meta{color:#aab2c2;font-size:.84rem}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}.card{border:1px solid #303746;border-radius:14px;padding:12px;background:rgba(255,255,255,.035)}pre{white-space:pre-wrap;word-break:break-word;color:#e2e8f0;font-size:.78rem}.tree,.json{max-height:70vh;min-height:280px}@media(max-width:820px){.grid{grid-template-columns:1fr}}</style><script src="src/recursive-unit-brain-core-v0-1.js"></script></head><body><main><div id="app"><section class="top"><h1>Loading current body.</h1><p class="muted">No prompt surface is present.</p></section></div></main><script>
const ART='artifacts/latest-recursive-unit-brain-projection-v0-1.json';
const esc=v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const kids=n=>n&&Array.isArray(n.children)?n.children:[];
const sw=v=>typeof v==='number'&&Number.isFinite(v)?v.toFixed(4).replace(/0+$/,'').replace(/\.$/,''):'-';
const title=v=>String(v||'body').replace(/[_-]+/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
function base(id,i){const w=String(id||`aspect_${i}`).split(/[^A-Za-z0-9]+/).filter(Boolean);return(w.slice(0,3).map(x=>x[0]).join('')||'A').toUpperCase()}
function symbols(root){const m=new Map(),u=new Map();m.set(root?.id||'root','B');function walk(n){kids(n).forEach((c,i)=>{const b=base(c.id,i),x=u.get(b)||0;u.set(b,x+1);m.set(c.id,x?`${b}${x+1}`:b);walk(c)})}walk(root);return m}
function formula(n,m){const s=m.get(n?.id)||'B',cs=kids(n);if(!cs.length)return[`${s}=1`,`${s}=unresolved local one`];const t=cs.map(c=>m.get(c.id)||base(c.id));return[`${s}=${t.join(' ⊕ ')}`,`|${s}|=1`,`${t.map(x=>`|${x}|`).join(' + ')}=1`,`${s}_current=${cs.map(c=>`${sw(c.w)}·${m.get(c.id)||base(c.id)}`).join(' + ')}`]}
function cls(ok){return ok===true?'oktxt':ok===false?'badtxt':'warntxt'}
function node(n,m){const cs=kids(n),local=typeof n.child_total==='number'?sw(n.child_total):'leaf',ok=n.ok===true?'ok':n.ok===false?'violation':'unknown';return`<div class="node"><div class="head"><span class="id">${esc(m.get(n.id)||base(n.id))} · ${esc(n.id)}</span><span class="meta">w=${sw(n.w)}</span><span class="meta">local=${esc(local)}</span><span class="meta ${cls(n.ok)}">${esc(ok)}${n.vague?' vague':''}</span></div>${cs.map(c=>node(c,m)).join('')}</div>`}
function pill(a,b,c){return`<span class="pill ${c}">${esc(a)} <strong>${esc(b)}</strong></span>`}
function expand(n,out=[]){if(!n)return out;if(kids(n).length)out.push(n);kids(n).forEach(c=>expand(c,out));return out}
function fallback(){const core=window.FortySecondMindRecursiveUnitBrainCore;if(!core?.liveProjection)throw new Error('recursive unit brain core did not load');return core.liveProjection({state:{body:'index_html_active_body',no_selective_focus:true},expression:{surface:'index.html'},coupling:{kernel:true,language:true,truth:true,memory:true,action:true}})}
async function load(){try{const r=await fetch(ART,{cache:'no-store'});if(!r.ok)throw new Error(`artifact ${r.status}`);return{packet:await r.json(),source:'artifact'}}catch(e){return{packet:fallback(),source:'browser fallback',note:String(e.message||e)}}}
function activeFocus(packet){const core=window.FortySecondMindRecursiveUnitBrainCore;const p=core?.focusExpression?core.focusExpression(packet,{id:'potato_symbolic_focus',token:'potato'}):(packet.focus_expression_demonstrations||[])[0];if(!p)return'<p class="muted">No active focus expression.</p>';const ok=p.ok===true,ob=p.obligation||{},trace=(p.trace||[]).join(' → ');return`<div class="word ${ok?'oktxt':'badtxt'}">${esc(ok?p.visible_expression:'')}</div><div class="pills">${pill('focus ok',ok,ok?'ok':'bad')}${pill('body valid',p.body_ok===true,p.body_ok===true?'ok':'bad')}${pill('token in body',ok,ok?'ok':'bad')}${pill('bypassed body','false',ok?'ok':'bad')}</div><pre>${esc(JSON.stringify({visible_expression:p.visible_expression,focus_path:p.focus_path,trace,obligation:ob,source:p.source},null,2))}</pre>`}
function render({packet,source,note}){const r=packet.root||{},m=symbols(r),as=kids(r),ex=expand(r).slice(0,18);const status=[pill('source',source,source==='artifact'?'ok':'warn'),pill('body',r.id||'missing',r.id?'ok':'bad'),pill('violations',packet.unit_violation_count??'unknown',packet.unit_violation_count===0?'ok':'bad'),pill('kernel',packet.kernel_error??'unknown',packet.kernel_error===0?'ok':'bad'),pill('nodes',packet.node_count??'unknown','ok')].join('');document.getElementById('app').innerHTML=`<section class="top"><p class="muted">42ndMind / active body / no prompt surface</p><h1>${esc(title(r.id))}</h1><p class="muted">${esc(source==='artifact'?'Displaying current repo body artifact.':'Artifact unavailable; displaying browser projection.')}${note?' '+esc(note):''}</p><div class="pills">${status}</div><div class="grid"><div class="box"><h2>Generated body law</h2><div class="formula">${formula(r,m).map(x=>`<code>${esc(x)}</code>`).join('')}</div></div><div class="box"><h2>Active focused expression</h2><p class="muted">Rendered automatically from the same active body. No button or prompt executes it.</p>${activeFocus(packet)}</div></div><div class="grid"><div class="box tree"><h2>Aspect body</h2>${r.id?node(r,m):'<p class="muted">No root body.</p>'}</div><div class="box json"><h2>Projection packet</h2><pre>${esc(JSON.stringify(packet,null,2))}</pre></div></div></section><section><h2>Immediate aspects generated from current body</h2><div class="cards">${as.length?as.map(a=>`<article class="card"><b>${esc(m.get(a.id)||base(a.id))} · ${esc(title(a.id))}</b><p class="muted">weight ${sw(a.w)}; local ${typeof a.child_total==='number'?sw(a.child_total):'leaf'}; ${kids(a).length} aspects; ${a.ok?'valid':'unresolved or invalid'}${a.vague?'; vague':''}.</p></article>`).join(''):'<article class="card muted">No immediate aspects.</article>'}</div></section><section><h2>Local one formulas generated from current body</h2><div class="cards">${ex.length?ex.map(n=>`<article class="card"><b>${esc(m.get(n.id)||base(n.id))} · ${esc(title(n.id))}</b><div class="formula">${formula(n,m).map(x=>`<code>${esc(x)}</code>`).join('')}</div></article>`).join(''):'<article class="card muted">No expandable local one.</article>'}</div></section>`}
load().then(render).catch(e=>{document.getElementById('app').innerHTML=`<section class="top"><h1>Active body failed.</h1><pre>${esc(e.stack||e)}</pre></section>`});
</script></body></html>
