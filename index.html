<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>42ndMind — Active Body</title>
<style>
:root{color-scheme:dark;--bg:#0b0c10;--panel:#151922;--line:#303746;--ink:#f4f6fb;--muted:#aab2c2;--accent:#e2e8f0;--ok:#b8f5ce;--warn:#ffe0a3;--bad:#ffb4b4}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 14% 0%,rgba(255,255,255,.08),transparent 30rem),var(--bg);color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.5}main{width:min(1180px,calc(100% - 28px));margin:0 auto;padding:32px 0 70px}section{border:1px solid var(--line);border-radius:26px;background:rgba(21,25,34,.86);box-shadow:0 24px 80px rgba(0,0,0,.32);padding:clamp(18px,4vw,32px);margin:18px 0}.top{background:rgba(244,246,251,.045);border-color:rgba(244,246,251,.16)}.eyebrow{color:var(--muted);font-size:.76rem;letter-spacing:.18em;text-transform:uppercase;margin-bottom:12px}h1{font-size:clamp(2rem,7vw,4.8rem);line-height:.94;letter-spacing:-.065em;margin:0 0 14px}h2{margin:0 0 10px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.box{border:1px solid var(--line);border-radius:18px;background:rgba(0,0,0,.16);padding:16px;overflow:auto}.formula code{display:block;color:var(--accent);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:clamp(1rem,2vw,1.32rem);white-space:nowrap;margin:8px 0}.pills{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}.pill{border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.04);padding:8px 11px;color:var(--muted);font-size:.86rem}.pill strong{color:var(--ink)}.ok strong,.oktxt{color:var(--ok)}.warn strong,.warntxt{color:var(--warn)}.bad strong,.badtxt{color:var(--bad)}.tree,.json{max-height:72vh;min-height:340px}.node{border-left:1px solid rgba(255,255,255,.14);margin-left:10px;padding:4px 0 4px 14px}.node:first-child{margin-left:0}.head{display:flex;flex-wrap:wrap;gap:8px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.035);padding:9px 10px;margin-bottom:6px}.id{font-weight:760}.meta{color:var(--muted);font-size:.84rem}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.card{border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.035);padding:16px}.sym{display:inline-grid;place-items:center;min-width:36px;height:36px;border:1px solid var(--line);border-radius:999px;padding:0 10px;margin-bottom:10px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:700}button{appearance:none;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.08);color:var(--ink);padding:10px 14px;font-weight:750;cursor:pointer}button:hover{background:rgba(255,255,255,.12)}.word{font-size:clamp(2.2rem,8vw,5rem);line-height:1;letter-spacing:-.06em;font-weight:850;margin:14px 0;color:var(--accent)}pre{white-space:pre-wrap;word-break:break-word;margin:0;color:var(--accent);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.78rem}@media(max-width:860px){main{width:min(100% - 22px,1180px)}.grid{grid-template-columns:1fr}section{border-radius:22px}}
</style>
<script src="src/recursive-unit-brain-core-v0-1.js"></script>
</head>
<body><main><div id="app"><section class="top"><div class="eyebrow">42ndMind / loading</div><h1>Loading current body.</h1><p class="muted">No prompt surface is present.</p></section></div></main>
<script>
const ARTIFACT='artifacts/latest-recursive-unit-brain-projection-v0-1.json';let ACTIVE_PACKET=null;
const esc=v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const kids=n=>n&&Array.isArray(n.children)?n.children:[];
const sw=v=>typeof v==='number'&&Number.isFinite(v)?v.toFixed(4).replace(/0+$/,'').replace(/\.$/,''):'—';
const title=v=>String(v||'body').replace(/[_-]+/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
function base(id,i){const w=String(id||`aspect_${i}`).split(/[^A-Za-z0-9]+/).filter(Boolean);return (w.slice(0,3).map(x=>x[0]).join('')||'A').toUpperCase()}
function symbols(root){const m=new Map(),u=new Map();m.set(root?.id||'root','B');function walk(n){kids(n).forEach((c,i)=>{const b=base(c.id,i),x=u.get(b)||0;u.set(b,x+1);m.set(c.id,x?`${b}${x+1}`:b);walk(c)})}walk(root);return m}
function formula(n,m){const s=m.get(n?.id)||'B',cs=kids(n);if(!cs.length)return [`${s} = 1`,`${s} = unresolved local one`];const t=cs.map(c=>m.get(c.id)||base(c.id));return [`${s} = ${t.join(' ⊕ ')}`,`|${s}| = 1`,`${t.map(x=>`|${x}|`).join(' + ')} = 1`,`${s}_current = ${cs.map(c=>`${sw(c.w)}·${m.get(c.id)||base(c.id)}`).join(' + ')}`]}
function cls(ok){return ok===true?'oktxt':ok===false?'badtxt':'warntxt'}
function node(n,m){const cs=kids(n),local=typeof n.child_total==='number'?sw(n.child_total):'leaf',ok=n.ok===true?'ok':n.ok===false?'violation':'unknown';return `<div class="node"><div class="head"><span class="id">${esc(m.get(n.id)||base(n.id))} · ${esc(n.id)}</span><span class="meta">w=${sw(n.w)}</span><span class="meta">local=${esc(local)}</span><span class="meta ${cls(n.ok)}">${esc(ok)}${n.vague?' vague':''}</span></div>${cs.map(c=>node(c,m)).join('')}</div>`}
function pill(a,b,c){return `<span class="pill ${c}">${esc(a)} <strong>${esc(b)}</strong></span>`}
function expand(n,out=[]){if(!n)return out;if(kids(n).length)out.push(n);kids(n).forEach(c=>expand(c,out));return out}
function fallback(){const core=window.FortySecondMindRecursiveUnitBrainCore;if(!core?.liveProjection)throw new Error('recursive unit brain core did not load');return core.liveProjection({state:{body:'index_html_active_body',no_selective_focus:true},expression:{surface:'index.html'},coupling:{kernel:true,language:true,truth:true,memory:true,action:true}})}
async function load(){try{const r=await fetch(ARTIFACT,{cache:'no-store'});if(!r.ok)throw new Error(`artifact ${r.status}`);return{packet:await r.json(),source:'artifact'}}catch(e){return{packet:fallback(),source:'browser-computed fallback',note:String(e.message||e)}}}
function focusProofBox(){return `<div class="box"><h2>Focused expression proof</h2><p class="muted">This uses the same active body. The button calls the body focus operation and displays a word only if the token exists inside the current body.</p><button type="button" onclick="applyPotatoFocus()">Apply focus: symbolic_token_potato</button><div id="focusResult" class="muted" style="margin-top:14px">No selective focus applied. The whole body remains visible.</div></div>`}
function renderFocus(packet){const ok=packet&&packet.ok===true;const obligations=packet&&packet.obligation?packet.obligation:{};const trace=(packet&&packet.trace||[]).join(' → ');return `<div class="word ${ok?'oktxt':'badtxt'}">${esc(ok?packet.visible_expression:'')}</div><div class="pills">${pill('focus ok',ok,'ok')} ${pill('body valid',packet&&packet.body_ok===true,packet&&packet.body_ok===true?'ok':'bad')} ${pill('token in body',obligations.token_must_exist_inside_current_body===true&&ok,ok?'ok':'bad')} ${pill('bypassed body','false',ok?'ok':'bad')}</div><div class="box" style="margin-top:12px"><pre>${esc(JSON.stringify({visible_expression:packet&&packet.visible_expression,focus_path:packet&&packet.focus_path,trace:trace,obligation:obligations,source:packet&&packet.source},null,2))}</pre></div>`}
function applyPotatoFocus(){const core=window.FortySecondMindRecursiveUnitBrainCore;const target=document.getElementById('focusResult');if(!target)return;if(!core?.focusExpression||!ACTIVE_PACKET){target.innerHTML='<span class="badtxt">focus operation unavailable</span>';return}const packet=core.focusExpression(ACTIVE_PACKET,{id:'potato_symbolic_focus',token:'potato'});target.innerHTML=renderFocus(packet)}
function render({packet,source,note}){ACTIVE_PACKET=packet;const r=packet.root||{},m=symbols(r),as=kids(r),ex=expand(r).slice(0,20);const status=[pill('source',source,source==='artifact'?'ok':'warn'),pill('body',r.id||'missing',r.id?'ok':'bad'),pill('violations',packet.unit_violation_count??'unknown',packet.unit_violation_count===0?'ok':'bad'),pill('kernel',packet.kernel_error??'unknown',packet.kernel_error===0?'ok':'bad'),pill('nodes',packet.node_count??'unknown','ok'),pill('depth',packet.max_depth??'unknown','ok')].join('');document.getElementById('app').innerHTML=`<section class="top"><div class="eyebrow">42ndMind / active body / no selective focus</div><h1>${esc(title(r.id))}</h1><p class="muted">${esc(source==='artifact'?'Displaying the current repo body artifact.':'Artifact unavailable; displaying a live browser projection from the recursive unit core.')}${note?' '+esc(note):''}</p><div class="pills">${status}</div><div class="grid" style="margin-top:18px"><div class="box"><h2>Generated body law</h2><div class="formula">${formula(r,m).map(x=>`<code>${esc(x)}</code>`).join('')}</div></div>${focusProofBox()}</div><div class="grid" style="margin-top:18px"><div class="box tree"><h2>Aspect body</h2>${r.id?node(r,m):'<p class="muted">No root body.</p>'}</div><div class="box json"><h2>Projection packet</h2><pre>${esc(JSON.stringify(packet,null,2))}</pre></div></div></section><section><h2>Immediate aspects generated from current body</h2><div class="cards">${as.length?as.map(a=>`<article class="card"><div class="sym">${esc(m.get(a.id)||base(a.id))}</div><h3>${esc(title(a.id))}</h3><p class="muted">weight ${sw(a.w)}; local ${typeof a.child_total==='number'?sw(a.child_total):'leaf'}; ${kids(a).length} aspects; ${a.ok?'valid':'unresolved or invalid'}${a.vague?'; vague':''}.</p></article>`).join(''):'<article class="card muted">No immediate aspects expanded.</article>'}</div></section><section><h2>Local one formulas generated from current body</h2><div class="cards">${ex.length?ex.map(n=>`<article class="card"><h3>${esc(m.get(n.id)||base(n.id))} · ${esc(title(n.id))}</h3><div class="formula">${formula(n,m).map(x=>`<code>${esc(x)}</code>`).join('')}</div></article>`).join(''):'<article class="card muted">No expandable local one.</article>'}</div></section>`}
load().then(render).catch(e=>{document.getElementById('app').innerHTML=`<section class="top"><div class="eyebrow">42ndMind / failed</div><h1>Active body failed.</h1><pre>${esc(e.stack||e)}</pre></section>`});
</script></body></html>
