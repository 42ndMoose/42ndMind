<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>42ndMind Dossier-to-Packet Compiler Test v0.1</title><style>body{margin:0;background:#0f1115;color:#eef2ff;font:14px ui-monospace,Menlo,Consolas,monospace}header{padding:16px;background:#11141b;border-bottom:1px solid #2a3040}main{padding:12px}section{background:#171a21;border:1px solid #2a3040;border-radius:10px;padding:12px}pre{white-space:pre-wrap;background:#0d1016;border:1px solid #2a3040;border-radius:10px;padding:10px;overflow:auto;max-height:760px}.ok{color:#9dffb4}.bad{color:#ff8b8b}a{color:#9db6ff}</style></head><body><header><h1>42ndMind Dossier-to-Packet Compiler Test v0.1</h1><div>Tests structured dossier sections compiled into candidate ingestion packets without truth promotion.</div></header><main><section><h2 id="summary">Running...</h2><div><a href="dossier-to-packet-compiler.html?v=dossierpack-1">dossier-to-packet compiler page</a></div><pre id="out"></pre></section></main><script src="src/kernel-objective-claim-language-v0-1.js?v=claim-1"></script><script src="src/kernel-objective-claim-language-v0-1-1-patch.js?v=claim-2"></script><script src="src/kernel-external-anchor-packet-schema-v0-1.js?v=anchor-1"></script><script src="src/kernel-source-provenance-registry-v0-1.js?v=prov-1"></script><script src="src/kernel-evidence-media-registry-v0-1.js?v=evidence-1"></script><script src="src/kernel-truth-pressure-synthesis-v0-1.js?v=truth-1"></script><script src="src/kernel-truth-pressure-synthesis-v0-1-1-patch.js?v=truth-2"></script><script src="src/kernel-claim-narrative-benchmark-v0-1.js?v=bench-1"></script><script src="src/kernel-adversarial-narrative-pressure-v0-1.js?v=adv-1"></script><script src="src/kernel-real-world-packet-ingestion-discipline-v0-1.js?v=ingest-1"></script><script src="src/kernel-truth-ledger-preledger-v0-1.js?v=preledger-1"></script><script src="src/kernel-truth-ledger-preledger-stress-benchmark-v0-1.js?v=prestress-1"></script><script src="src/kernel-world-model-relation-expansion-v0-1.js?v=wmrel-1"></script><script src="src/kernel-world-model-relation-stress-benchmark-v0-1.js?v=wmrelstress-1"></script><script src="src/kernel-world-model-relation-stress-benchmark-v0-1-1-patch.js?v=wmrelstress-2"></script><script src="src/kernel-coverage-expansion-library-v0-1.js?v=coverage-1"></script><script src="src/kernel-coverage-stress-benchmark-v0-1.js?v=coverstress-1"></script><script src="src/kernel-deterministic-packet-ingestion-form-v0-1.js?v=ingestform-1"></script><script src="src/kernel-dossier-to-packet-compiler-v0-1.js?v=dossierpack-1"></script><script>const tests=[];let packet=null;function add(n,f){tests.push({name:n,fn:f})}function assert(c,m){if(!c)throw new Error(m)}function arr(v){return Array.isArray(v)?v:[]}function records(){return arr(packet&&packet.compiled_ingestion_packets)}function validation(){return packet&&packet.validation||{}}function packetTypes(){return new Set(records().map(r=>r.packet_type))}function unresolved(){return records().flatMap(r=>arr(r.unresolved_items))}add('module loads and doctrine keeps dossier compilation non-authoritative',()=>{assert(window.KernelDeterministicPacketIngestionFormV01,'deterministic ingestion missing');assert(window.KernelDossierToPacketCompilerV01,'dossier compiler missing');assert(KernelDossierToPacketCompilerV01.VERSION==='0.1.0','version wrong');const d=KernelDossierToPacketCompilerV01.doctrine();assert(d.dossier_compilation_is_not_truth_promotion===true,'dossier doctrine missing');assert(d.dossier_material_enters_as_structured_context_packets===true,'dossier packet doctrine missing');assert(d.dossier_claims_are_candidate_claims_not_truth===true,'claim doctrine missing');assert(d.dossier_sources_are_anchors_not_lookup===true,'source doctrine missing');assert(d.dossier_evidence_descriptions_are_claims_not_verification===true,'evidence doctrine missing');assert(d.adversarial_reframes_are_pressure_not_truth===true,'reframe doctrine missing');assert(d.no_llm===true,'no LLM doctrine missing');assert(d.no_external_lookup===true,'no lookup doctrine missing');assert(d.belief_movement==='none','belief movement wrong')});add('dossier compiler runs through deterministic ingestion',()=>{packet=KernelDossierToPacketCompilerV01.runDossierToPacketCompiler();assert(packet.ok===true,'packet not ok: '+JSON.stringify(validation()));assert(packet.source_deterministic_ingestion_ok===true,'source deterministic ingestion not ok');assert(packet.source_deterministic_ingestion_version==='0.1.0','source deterministic ingestion version wrong');assert(packet.compiled_section_count===2,'expected 2 compiled sections');assert(packet.compiled_input_count===21,'expected 21 compiled inputs');assert(packet.compiled_packet_count===21,'expected 21 compiled packets');assert(packet.source_packet_type_count===10,'expected 10 packet types');assert(packet.dossier_compiler_is_final_truth_authority===false,'became final authority')});add('all major dossier fields compile into separated packet types',()=>{['dossier_summary_packet','claim_candidate','source_reference','evidence_description','media_description','quote_fragment','context_note','adversarial_reframe','relation_candidate','coverage_hold'].forEach(type=>assert(packetTypes().has(type),type+' missing'));assert(validation().checks.dossier_summary_packet_present===true,'summary packet check failed');assert(validation().checks.claim_source_evidence_media_quote_context_reframe_relation_unresolved_present===true,'field packet check failed')});add('source, media, evidence, reframe, relation, and unresolved warnings stay visible',()=>{['source_reference_is_anchor_not_lookup','evidence_description_not_verified_evidence','media_description_not_media_verification','quote_fragment_requires_context','adversarial_reframe_is_pressure_not_truth','relation_candidate_requires_bridge_or_support','unresolved_gaps_stay_visible'].forEach(w=>assert(arr(packet.separation_warnings).includes(w),w+' warning missing'));assert(unresolved().includes('hostile_reframe_is_pressure_not_truth'),'hostile reframe unresolved item missing');assert(unresolved().includes('unknown_specific_meaning_must_not_be_faked'),'unknown hold unresolved item missing');assert(validation().checks.separation_warnings_visible===true,'separation warning check failed');assert(validation().checks.unresolved_gaps_visible===true,'unresolved gap check failed');assert(validation().checks.adversarial_reframe_visible===true,'adversarial reframe check failed')});add('coverage classification exists on every compiled packet',()=>{records().forEach(r=>{assert(r.coverage_classification_snapshot,r.ingestion_packet_id+' missing coverage classification');assert(r.coverage_family_candidate,r.ingestion_packet_id+' missing coverage family');assert(r.exact_meaning_claimed===false,r.ingestion_packet_id+' exact meaning claimed')});assert(validation().checks.coverage_classification_present_for_all===true,'coverage classification check failed')});add('line-prefix parser converts raw dossier text into section fields',()=>{const section=KernelDossierToPacketCompilerV01.parseLinePrefixDossier('TITLE: Manual Section\nSUMMARY: This is a summary.\nCLAIM: Some containers are sealed.\nSOURCE: Source A reports it.\nEVIDENCE: A log indicates a drop.\nMEDIA: A screenshot is described.\nQUOTE: fragment only\nCONTEXT: here depends on anchor\nREFRAME: some becomes all\nRELATION: because pressure rose\nUNRESOLVED: causal bridge missing',{section_id:'manual_line_prefix'});assert(section.title==='Manual Section','title parse failed');assert(section.summary==='This is a summary.','summary parse failed');assert(section.claims.length===1,'claim parse failed');assert(section.sources.length===1,'source parse failed');assert(section.evidence.length===1,'evidence parse failed');assert(section.media.length===1,'media parse failed');assert(section.quotes.length===1,'quote parse failed');assert(section.context.length===1,'context parse failed');assert(section.reframes.length===1,'reframe parse failed');assert(section.relations.length===1,'relation parse failed');assert(section.unresolved.length===1,'unresolved parse failed');const inputs=KernelDossierToPacketCompilerV01.sectionToHumanInputs(section);assert(inputs.some(r=>r.packet_type==='dossier_summary_packet'),'summary input missing');assert(inputs.some(r=>r.packet_type==='claim_candidate'),'claim input missing');assert(inputs.some(r=>r.packet_type==='source_reference'),'source input missing');assert(inputs.some(r=>r.packet_type==='adversarial_reframe'),'reframe input missing')});add('rollback, revision trail, and no silent mutation are preserved',()=>{assert(packet.rollback_available===true,'compiler rollback unavailable');assert(packet.rollback_snapshot&&packet.rollback_snapshot.source_sections,'compiler source rollback missing');records().forEach(r=>{assert(r.rollback_available===true,r.ingestion_packet_id+' rollback unavailable');assert(r.rollback_snapshot,r.ingestion_packet_id+' rollback snapshot missing');assert(arr(r.revision_trail).length>=1,r.ingestion_packet_id+' revision trail missing');assert(arr(r.revision_trail).every(v=>v.silent_mutation===false),r.ingestion_packet_id+' silent mutation present')});assert(validation().checks.rollback_available_for_all===true,'rollback check failed');assert(validation().checks.no_silent_mutation===true,'silent mutation check failed')});add('no final truth, no LLM, no lookup, candidate-only status, and belief movement are preserved',()=>{records().forEach(r=>{assert(r.packet_status==='candidate_packet_not_truth',r.ingestion_packet_id+' packet not candidate');assert(r.truth_status==='not_adjudicated',r.ingestion_packet_id+' truth adjudicated');assert(r.final_authority===false,r.ingestion_packet_id+' final authority true');assert(r.llm_used===false,r.ingestion_packet_id+' LLM used');assert(r.external_lookup_performed===false,r.ingestion_packet_id+' external lookup performed');assert(r.media_lookup_performed===false,r.ingestion_packet_id+' media lookup performed');assert(r.source_lookup_performed===false,r.ingestion_packet_id+' source lookup performed');assert(r.promotion_status==='not_promoted',r.ingestion_packet_id+' promoted');assert(r.belief_movement==='none',r.ingestion_packet_id+' belief movement not none')});assert(validation().checks.no_truth_promotion===true,'truth promotion check failed');assert(validation().checks.no_llm_used===true,'no LLM check failed');assert(validation().checks.no_lookup_used===true,'lookup check failed');assert(validation().checks.final_authority_false===true,'final authority check failed');assert(validation().checks.belief_movement_none===true,'belief movement check failed');assert(arr(validation().errors).length===0,'validation errors present: '+validation().errors.join(','))});(async function run(){const results=[];for(const t of tests){try{await t.fn();results.push({name:t.name,passed:true})}catch(e){results.push({name:t.name,passed:false,error:e.message})}}const passed=results.filter(r=>r.passed).length;document.getElementById('summary').className=passed===tests.length?'ok':'bad';document.getElementById('summary').textContent=passed+'/'+tests.length+' passed';document.getElementById('out').textContent=JSON.stringify({packet_type:'42ndMind_dossier_to_packet_compiler_test_report_v0_1',ok:passed===tests.length,source_deterministic_ingestion_ok:packet&&packet.source_deterministic_ingestion_ok,source_deterministic_ingestion_version:packet&&packet.source_deterministic_ingestion_version,compiled_section_count:packet&&packet.compiled_section_count,compiled_input_count:packet&&packet.compiled_input_count,compiled_packet_count:packet&&packet.compiled_packet_count,packet_type_counts:packet&&packet.packet_type_counts,separation_warnings:packet&&packet.separation_warnings,records:records().map(r=>({ingestion_packet_id:r.ingestion_packet_id,packet_type:r.packet_type,title:r.title,coverage_family_candidate:r.coverage_family_candidate,target_claim_id:r.target_claim_id,relation_family_candidate:r.relation_family_candidate,packet_status:r.packet_status,truth_status:r.truth_status,promotion_status:r.promotion_status,belief_movement:r.belief_movement})),validation:validation(),results},null,2)})();</script></body></html>
