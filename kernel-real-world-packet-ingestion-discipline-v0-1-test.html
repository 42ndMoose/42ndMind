<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>42ndMind Real-World Packet Ingestion Discipline Test v0.1</title><style>body{margin:0;background:#0f1115;color:#eef2ff;font:14px ui-monospace,Menlo,Consolas,monospace}header{padding:16px;background:#11141b;border-bottom:1px solid #2a3040}main{padding:12px}section{background:#171a21;border:1px solid #2a3040;border-radius:10px;padding:12px}pre{white-space:pre-wrap;background:#0d1016;border:1px solid #2a3040;border-radius:10px;padding:10px;overflow:auto;max-height:760px}.ok{color:#9dffb4}.bad{color:#ff8b8b}a{color:#9db6ff}</style></head><body><header><h1>42ndMind Real-World Packet Ingestion Discipline Test v0.1</h1><div>Tests that user-described real-world material enters as context packets, not truth.</div></header><main><section><h2 id="summary">Running...</h2><div><a href="real-world-packet-ingestion-discipline.html?v=ingest-1">real-world packet ingestion page</a></div><pre id="out"></pre></section></main><script src="src/kernel-objective-claim-language-v0-1.js?v=claim-1"></script><script src="src/kernel-objective-claim-language-v0-1-1-patch.js?v=claim-2"></script><script src="src/kernel-external-anchor-packet-schema-v0-1.js?v=anchor-1"></script><script src="src/kernel-source-provenance-registry-v0-1.js?v=prov-1"></script><script src="src/kernel-evidence-media-registry-v0-1.js?v=evidence-1"></script><script src="src/kernel-truth-pressure-synthesis-v0-1.js?v=truth-1"></script><script src="src/kernel-truth-pressure-synthesis-v0-1-1-patch.js?v=truth-2"></script><script src="src/kernel-claim-narrative-benchmark-v0-1.js?v=bench-1"></script><script src="src/kernel-adversarial-narrative-pressure-v0-1.js?v=adv-1"></script><script src="src/kernel-real-world-packet-ingestion-discipline-v0-1.js?v=ingest-1"></script><script>const tests=[];let packet=null;function add(n,f){tests.push({name:n,fn:f})}function assert(c,m){if(!c)throw new Error(m)}function arr(v){return Array.isArray(v)?v:[]}function records(){return arr(packet&&packet.ingestion_records)}function validation(){return packet&&packet.validation||{}}function byType(t){return records().find(r=>r.material_type===t)}function warnings(){return new Set(records().flatMap(r=>arr(r.ingestion_warnings)))}function advHooks(){return new Set(records().flatMap(r=>arr(r.adversarial_pressure_hooks)))}function truthHooks(){return new Set(records().flatMap(r=>arr(r.truth_pressure_hooks)))}add('module loads and doctrine keeps real-world material as packet context',()=>{assert(window.KernelAdversarialNarrativePressureV01,'adversarial pressure missing');assert(window.KernelRealWorldPacketIngestionDisciplineV01,'ingestion discipline missing');assert(KernelRealWorldPacketIngestionDisciplineV01.VERSION==='0.1.0','version wrong');const d=KernelRealWorldPacketIngestionDisciplineV01.doctrine();assert(d.real_world_material_enters_as_packet_not_truth===true,'packet doctrine missing');assert(d.user_description_is_context_not_truth===true,'user context doctrine missing');assert(d.media_description_is_context_not_media_verification===true,'media doctrine missing');assert(d.raw_description_preserved_without_silent_mutation===true,'raw preservation doctrine missing');assert(d.adversarial_pressure_hooks_required===true,'adversarial hook doctrine missing');assert(d.truth_pressure_hooks_required===true,'truth hook doctrine missing');assert(d.no_llm===true,'no LLM doctrine missing');assert(d.no_source_lookup===true,'no source lookup doctrine missing');assert(d.no_media_lookup===true,'no media lookup doctrine missing');assert(d.belief_movement==='none','belief movement wrong')});add('ingestion discipline runs from adversarial narrative-pressure suite',()=>{packet=KernelRealWorldPacketIngestionDisciplineV01.runIngestionDiscipline();assert(packet.ok===true,'packet not ok: '+JSON.stringify(validation()));assert(packet.source_adversarial_suite_ok===true,'source adversarial suite not ok');assert(packet.source_adversarial_suite_version==='0.1.0','expected adversarial suite v0.1.0');assert(packet.source_attack_record_count===12,'expected 12 source attack records');assert(packet.ingestion_record_count===8,'expected 8 ingestion records');assert(packet.material_type_count===8,'expected 8 material types');assert(packet.llm_used===false,'packet used LLM');assert(packet.external_lookup_performed===false,'packet performed external lookup');assert(packet.media_lookup_performed===false,'packet performed media lookup');assert(packet.adjudicates_final_truth===false,'packet adjudicated truth')});add('all eight material types are represented',()=>{['video_user_description','screenshot_description','quote_or_transcript_fragment','article_summary','social_media_thread_description','document_record_description','direct_observation_report','hostile_reframe_report'].forEach(t=>assert(byType(t),t+' missing'));assert(validation().checks.eight_material_types===true,'material type check failed')});add('raw descriptions and packet components remain separated',()=>{records().forEach(r=>{assert(r.raw_packet&&r.raw_packet.user_supplied_description,r.material_id+' raw description missing');assert(r.separation.raw_description_preserved===true,r.material_id+' raw preservation missing');assert(r.separation.source_reference_separate===true,r.material_id+' source separation missing');assert(r.separation.media_description_separate===true,r.material_id+' media separation missing');assert(r.separation.evidence_claims_separate===true,r.material_id+' evidence separation missing');assert(r.separation.uncertainty_notes_separate===true,r.material_id+' uncertainty separation missing');assert(r.separation.truth_pressure_hooks_separate===true,r.material_id+' truth hooks separation missing');assert(r.separation.adversarial_pressure_hooks_separate===true,r.material_id+' adversarial hooks separation missing')});assert(validation().checks.raw_descriptions_preserved===true,'raw description check failed');assert(validation().checks.source_media_evidence_uncertainty_separated===true,'separation check failed')});add('warnings are visible for unverified media, source custody, duplicate risk, and hostile reframe risk',()=>{assert(warnings().has('user_description_context_not_truth'),'user context warning missing');assert(warnings().has('original_media_not_verified'),'media warning missing');assert(warnings().has('metadata_not_verified'),'metadata warning missing');assert(warnings().has('source_custody_not_verified'),'source custody warning missing');assert(warnings().has('duplicate_provenance_or_anonymous_source_risk'),'duplicate risk warning missing');assert(warnings().has('adversarial_reframe_risk_visible'),'adversarial risk warning missing');assert(validation().checks.warnings_present===true,'warnings check failed')});add('adversarial and truth-pressure hooks are visible',()=>{assert(advHooks().has('quote_clipping_or_context_stripping_check'),'quote/context hook missing');assert(advHooks().has('source_laundering_or_duplicate_provenance_check'),'source laundering hook missing');assert(advHooks().has('quantifier_or_scope_distortion_check'),'quantifier/scope hook missing');assert(truthHooks().has('causal_bridge_required'),'causal bridge hook missing');assert(truthHooks().has('contradiction_pressure_candidate'),'contradiction hook missing');assert(truthHooks().has('low_trust_source_posture'),'low trust hook missing');assert(validation().checks.adversarial_hooks_present===true,'adversarial hooks check failed');assert(validation().checks.truth_pressure_hooks_present===true,'truth hooks check failed')});add('context, media, and evidence are not promoted to truth',()=>{records().forEach(r=>{assert(r.context_status==='context_not_truth',r.material_id+' context became truth');assert(r.truth_status==='not_adjudicated',r.material_id+' truth adjudicated');assert(r.evidence_status==='evidence_claims_recorded_not_verified',r.material_id+' evidence verified silently');assert(r.media_status==='description_recorded_media_not_verified',r.material_id+' media verified silently');assert(r.source_status==='anchor_recorded_lookup_not_performed',r.material_id+' source lookup performed');assert(r.contradiction_resolution==='not_resolved',r.material_id+' contradiction resolved')});assert(validation().checks.no_truth_adjudication===true,'truth adjudication check failed')});add('no LLM, no lookup, candidate-only status, and belief movement are preserved',()=>{records().forEach(r=>{assert(r.llm_used===false,r.material_id+' used LLM');assert(r.external_lookup_performed===false,r.material_id+' performed external lookup');assert(r.media_lookup_performed===false,r.material_id+' performed media lookup');assert(r.promotion_status==='not_promoted',r.material_id+' promoted');assert(r.doctrine_status==='candidate_not_doctrine',r.material_id+' doctrine status wrong');assert(r.belief_movement==='none',r.material_id+' moved belief')});assert(validation().checks.no_llm_used===true,'no LLM check failed');assert(validation().checks.no_external_or_media_lookup===true,'lookup check failed');assert(validation().checks.candidate_only_not_promoted===true,'candidate-only check failed');assert(validation().checks.belief_movement_none===true,'belief movement check failed');assert(arr(validation().errors).length===0,'validation errors present: '+validation().errors.join(','))});(async function run(){const results=[];for(const t of tests){try{await t.fn();results.push({name:t.name,passed:true})}catch(e){results.push({name:t.name,passed:false,error:e.message})}}const passed=results.filter(r=>r.passed).length;document.getElementById('summary').className=passed===tests.length?'ok':'bad';document.getElementById('summary').textContent=passed+'/'+tests.length+' passed';document.getElementById('out').textContent=JSON.stringify({packet_type:'42ndMind_real_world_packet_ingestion_discipline_test_report_v0_1',ok:passed===tests.length,source_adversarial_suite_ok:packet&&packet.source_adversarial_suite_ok,source_adversarial_suite_version:packet&&packet.source_adversarial_suite_version,source_attack_record_count:packet&&packet.source_attack_record_count,ingestion_record_count:packet&&packet.ingestion_record_count,material_type_count:packet&&packet.material_type_count,status_counts:packet&&packet.status_counts,records:records().map(r=>({material_id:r.material_id,material_type:r.material_type,ingestion_status:r.ingestion_status,warning_count:r.ingestion_warnings.length,adversarial_pressure_hooks:r.adversarial_pressure_hooks,truth_pressure_hooks:r.truth_pressure_hooks,context_status:r.context_status,truth_status:r.truth_status,promotion_status:r.promotion_status,belief_movement:r.belief_movement})),validation:validation(),results},null,2)})();</script></body></html>
