<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>42ndMind Unified Runtime Receptor Registry Test v0.1</title><style>body{margin:0;background:#0f1115;color:#eef2ff;font:14px ui-monospace,Menlo,Consolas,monospace}header{padding:16px;background:#11141b;border-bottom:1px solid #2a3040}main{padding:12px}section{background:#171a21;border:1px solid #2a3040;border-radius:10px;padding:12px}pre{white-space:pre-wrap;background:#0d1016;border:1px solid #2a3040;border-radius:10px;padding:10px;overflow:auto;max-height:780px}.ok{color:#9dffb4}.bad{color:#ff8b8b}a{color:#9db6ff}</style></head><body><header><h1>42ndMind Unified Runtime Receptor Registry Test v0.1</h1><div>Tests that modules register as receptors/operators inside one runtime, not as side filters.</div></header><main><section><h2 id="summary">Running...</h2><div><a href="unified-runtime-receptor-registry.html?v=runtime-1">unified runtime receptor registry page</a></div><pre id="out"></pre></section></main><script src="src/kernel-objective-claim-language-v0-1.js?v=claim-1"></script><script src="src/kernel-objective-claim-language-v0-1-1-patch.js?v=claim-2"></script><script src="src/kernel-external-anchor-packet-schema-v0-1.js?v=anchor-1"></script><script src="src/kernel-source-provenance-registry-v0-1.js?v=prov-1"></script><script src="src/kernel-evidence-media-registry-v0-1.js?v=evidence-1"></script><script src="src/kernel-truth-pressure-synthesis-v0-1.js?v=truth-1"></script><script src="src/kernel-truth-pressure-synthesis-v0-1-1-patch.js?v=truth-2"></script><script src="src/kernel-claim-narrative-benchmark-v0-1.js?v=bench-1"></script><script src="src/kernel-adversarial-narrative-pressure-v0-1.js?v=adv-1"></script><script src="src/kernel-real-world-packet-ingestion-discipline-v0-1.js?v=ingest-1"></script><script src="src/kernel-truth-ledger-preledger-v0-1.js?v=preledger-1"></script><script src="src/kernel-truth-ledger-preledger-stress-benchmark-v0-1.js?v=prestress-1"></script><script src="src/kernel-world-model-relation-expansion-v0-1.js?v=wmrel-1"></script><script src="src/kernel-world-model-relation-stress-benchmark-v0-1.js?v=wmrelstress-1"></script><script src="src/kernel-world-model-relation-stress-benchmark-v0-1-1-patch.js?v=wmrelstress-2"></script><script src="src/kernel-coverage-expansion-library-v0-1.js?v=coverage-1"></script><script src="src/kernel-coverage-stress-benchmark-v0-1.js?v=coverstress-1"></script><script src="src/kernel-deterministic-packet-ingestion-form-v0-1.js?v=ingestform-1"></script><script src="src/kernel-dossier-to-packet-compiler-v0-1.js?v=dossierpack-1"></script><script src="src/kernel-ingestion-to-preledger-bridge-v0-1.js?v=prebridge-1"></script><script src="src/kernel-dossier-packet-stress-benchmark-v0-1.js?v=dossierstress-1"></script><script src="src/kernel-unified-runtime-receptor-registry-v0-1.js?v=runtime-1"></script><script>const tests=[];let packet=null;function add(n,f){tests.push({name:n,fn:f})}function assert(c,m){if(!c)throw new Error(m)}function arr(v){return Array.isArray(v)?v:[]}function events(){return arr(packet&&packet.runtime_events)}function receptors(){return arr(packet&&packet.receptors)}function validation(){return packet&&packet.validation||{}}function families(){return new Set(receptors().map(r=>r.receptor_family))}function activatedFamilies(){return new Set(events().flatMap(ev=>arr(ev.activated_receptors).map(r=>r.receptor_family)))}function unresolved(){return events().flatMap(ev=>arr(ev.unresolved_items))}add('module loads and doctrine says one brain, not side filters',()=>{assert(window.KernelDossierPacketStressBenchmarkV01,'dossier stress missing');assert(window.KernelUnifiedRuntimeReceptorRegistryV01,'unified runtime missing');assert(KernelUnifiedRuntimeReceptorRegistryV01.VERSION==='0.1.0','version wrong');const d=KernelUnifiedRuntimeReceptorRegistryV01.doctrine();assert(d.one_unified_language_grammar===true,'unified grammar doctrine missing');assert(d.brain_itself_is_one===true,'brain-one doctrine missing');assert(d.modules_are_receptors_inside_one===true,'receptors-inside-one doctrine missing');assert(d.modules_are_not_side_filters===true,'not-side-filter doctrine missing');assert(d.raw_intake_is_not_external_filter===true,'raw intake doctrine missing');assert(d.no_llm===true,'no LLM doctrine missing');assert(d.belief_movement==='none','belief movement wrong')});add('runtime registry runs from dossier packet stress benchmark',()=>{packet=KernelUnifiedRuntimeReceptorRegistryV01.runUnifiedRuntimeReceptorRegistry();assert(packet.ok===true,'packet not ok: '+JSON.stringify(validation()));assert(packet.source_dossier_stress_ok===true,'source dossier stress not ok');assert(packet.source_dossier_stress_version==='0.1.0','source dossier stress version wrong');assert(packet.source_dossier_stress_record_count===16,'expected 16 source dossier stress records');assert(packet.source_dossier_stress_family_count===16,'expected 16 source dossier stress families');assert(packet.runtime_is_one_brain===true,'runtime not marked one brain');assert(packet.modules_as_receptors_inside_one===true,'modules not inside one');assert(packet.modules_as_side_filters===false,'modules marked as side filters');assert(packet.unified_runtime_is_final_truth_authority===false,'became final authority')});add('fourteen receptor families are registered inside unified runtime',()=>{['coverage_receptor','claim_receptor','source_anchor_receptor','evidence_description_receptor','media_description_receptor','quote_context_receptor','adversarial_reframe_receptor','relation_receptor','truth_pressure_receptor','preledger_receptor','dossier_packet_receptor','unknown_or_typo_candidate_receptor','meaning_admission_receptor','rollback_receptor'].forEach(f=>assert(families().has(f),f+' missing'));assert(packet.receptor_count===14,'expected 14 receptors');assert(packet.receptor_family_count===14,'expected 14 receptor families');assert(validation().checks.fourteen_receptors_registered===true,'receptor count check failed');assert(validation().checks.all_required_receptor_families_registered===true,'required families check failed')});add('operators and runtime events are registered',()=>{assert(arr(packet.operators).length>=8,'operators missing');assert(events().length===3,'expected 3 runtime events');events().forEach(ev=>{assert(arr(ev.activated_receptors).length>=1,ev.runtime_event_id+' activated no receptors');assert(arr(ev.activated_operators).length>=8,ev.runtime_event_id+' activated operators missing');assert(ev.raw_input_snapshot&&ev.raw_input_snapshot.raw_snapshot_preserved===true,ev.runtime_event_id+' raw snapshot missing')});assert(validation().checks.operators_registered===true,'operators check failed');assert(validation().checks.runtime_events_present===true,'events check failed');assert(validation().checks.runtime_events_activate_receptors===true,'activation check failed')});add('receptor outputs live inside runtime, not loose connectors',()=>{events().forEach(ev=>{assert(ev.active_guards&&ev.active_guards.modules_are_receptors_inside_one===true,ev.runtime_event_id+' inside-one guard missing');assert(ev.active_guards&&ev.active_guards.modules_are_not_side_filters===true,ev.runtime_event_id+' side-filter guard missing');assert(ev.active_guards&&ev.active_guards.runtime_event_activates_receptors_not_connectors===true,ev.runtime_event_id+' connector guard missing');assert(arr(ev.candidate_interpretations).length>=1,ev.runtime_event_id+' interpretations missing')});assert(validation().checks.all_receptor_outputs_inside_runtime===true,'inside runtime check failed')});add('raw messy event routes to typo/unknown and meaning admission receptors',()=>{assert(activatedFamilies().has('unknown_or_typo_candidate_receptor'),'unknown/typo receptor not activated');assert(activatedFamilies().has('meaning_admission_receptor'),'meaning admission receptor not activated');assert(unresolved().includes('unknown_or_typo_repair_is_candidate_only'),'typo repair unresolved missing');assert(unresolved().includes('meaning_admission_required_no_silent_mutation'),'meaning admission unresolved missing');assert(validation().checks.raw_messy_event_routes_to_typo_and_admission===true,'raw messy routing check failed')});add('structured dossier event routes to dossier, preledger, and pressure receptors',()=>{assert(activatedFamilies().has('dossier_packet_receptor'),'dossier receptor not activated');assert(activatedFamilies().has('preledger_receptor'),'preledger receptor not activated');assert(activatedFamilies().has('truth_pressure_receptor'),'truth pressure receptor not activated');assert(unresolved().includes('preledger_ready_is_not_truth_promotion'),'preledger unresolved missing');assert(unresolved().includes('dossier_material_remains_context_not_truth'),'dossier unresolved missing');assert(unresolved().includes('coverage_class_is_not_exact_meaning'),'coverage unresolved missing');assert(validation().checks.structured_event_routes_to_dossier_preledger_pressure===true,'structured routing check failed');assert(validation().checks.unresolved_items_preserve_core_guards===true,'unresolved guard check failed')});add('no final truth, no LLM, no lookup, rollback, and belief movement are preserved',()=>{events().forEach(ev=>{assert(ev.runtime_event_status==='candidate_runtime_event_not_truth',ev.runtime_event_id+' event not candidate');assert(ev.truth_status==='not_adjudicated',ev.runtime_event_id+' truth adjudicated');assert(ev.final_authority===false,ev.runtime_event_id+' final authority true');assert(ev.llm_used===false,ev.runtime_event_id+' LLM used');assert(ev.external_lookup_performed===false,ev.runtime_event_id+' external lookup performed');assert(ev.media_lookup_performed===false,ev.runtime_event_id+' media lookup performed');assert(ev.rollback_available===true,ev.runtime_event_id+' rollback unavailable');assert(arr(ev.revision_trail).every(v=>v.silent_mutation===false),ev.runtime_event_id+' silent mutation present');assert(ev.promotion_status==='not_promoted',ev.runtime_event_id+' promoted');assert(ev.belief_movement==='none',ev.runtime_event_id+' belief movement not none')});assert(validation().checks.no_truth_promotion===true,'truth promotion check failed');assert(validation().checks.no_llm_used===true,'no LLM check failed');assert(validation().checks.no_lookup_used===true,'lookup check failed');assert(validation().checks.rollback_available_for_all===true,'rollback check failed');assert(validation().checks.no_silent_mutation===true,'silent mutation check failed');assert(validation().checks.final_authority_false===true,'final authority check failed');assert(validation().checks.belief_movement_none===true,'belief movement check failed');assert(arr(validation().errors).length===0,'validation errors present: '+validation().errors.join(','))});(async function run(){const results=[];for(const t of tests){try{await t.fn();results.push({name:t.name,passed:true})}catch(e){results.push({name:t.name,passed:false,error:e.message})}}const passed=results.filter(r=>r.passed).length;document.getElementById('summary').className=passed===tests.length?'ok':'bad';document.getElementById('summary').textContent=passed+'/'+tests.length+' passed';document.getElementById('out').textContent=JSON.stringify({packet_type:'42ndMind_unified_runtime_receptor_registry_test_report_v0_1',ok:passed===tests.length,source_dossier_stress_ok:packet&&packet.source_dossier_stress_ok,source_dossier_stress_version:packet&&packet.source_dossier_stress_version,source_dossier_stress_record_count:packet&&packet.source_dossier_stress_record_count,receptor_count:packet&&packet.receptor_count,receptor_family_count:packet&&packet.receptor_family_count,operator_count:packet&&packet.operator_count,runtime_event_count:packet&&packet.runtime_event_count,runtime_is_one_brain:packet&&packet.runtime_is_one_brain,modules_as_receptors_inside_one:packet&&packet.modules_as_receptors_inside_one,modules_as_side_filters:packet&&packet.modules_as_side_filters,runtime_events:events().map(ev=>({runtime_event_id:ev.runtime_event_id,input_event_type:ev.input_event_type,activated_receptor_count:ev.activated_receptor_count,activated_receptors:arr(ev.activated_receptors).map(r=>r.receptor_family),candidate_interpretations:arr(ev.candidate_interpretations).length,candidate_packets:arr(ev.candidate_packets).length,relation_candidates:arr(ev.relation_candidates).length,admission_candidates:arr(ev.admission_candidates).length,truth_status:ev.truth_status,promotion_status:ev.promotion_status,belief_movement:ev.belief_movement})),validation:validation(),results},null,2)})();</script></body></html>
