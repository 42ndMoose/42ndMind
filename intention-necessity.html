<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>42ndMind Intention Necessity</title><style>body{margin:0;background:#0f1115;color:#eef2ff;font:14px ui-monospace,Menlo,Consolas,monospace}header{padding:16px 18px;background:#11141b;border-bottom:1px solid #2a3040}main{padding:12px;display:grid;grid-template-columns:420px 1fr;gap:12px}section{background:#171a21;border:1px solid #2a3040;border-radius:10px;padding:12px}button{background:#25345c;color:#eef2ff;border:1px solid #3f5592;padding:8px 10px;border-radius:8px;cursor:pointer;margin:3px 3px 8px 0}pre{white-space:pre-wrap;background:#0d1016;border:1px solid #2a3040;border-radius:10px;padding:10px;overflow:auto;max-height:760px}.ok{color:#9dffb4}.bad{color:#ff8b8b}.muted{color:#8b93a7}a{color:#9db6ff}.card{background:#10131a;border:1px solid #2a3040;border-radius:10px;padding:10px;margin:10px 0}.test{border-top:1px solid #252b3a;padding:6px 0}.pill{display:inline-block;border:1px solid #2a3040;border-radius:999px;padding:1px 7px;margin:2px}.core{color:#9dffb4}.boundary{color:#ffd28b}.derivative{color:#9db6ff}.collapse{color:#ff8b8b}.shift{color:#ffb86b}@media(max-width:900px){main{grid-template-columns:1fr}}</style></head><body><header><h1>42ndMind Intention Necessity</h1><div class="muted">Remove-one-dimension counterfactual testing for refined intention concepts. Candidate only. No real-world intent attribution.</div></header><main><section><a href="index.html">main</a> · <a href="intention-refinement.html?v=refine-1">refinement</a> · <a href="kernel-intention-necessity-test-v0-1-test.html?v=necessity-1">test</a><p>Decision: <b id="decisionMetric">not run</b></p><p>Candidates: <b id="candidateCount">0</b></p><button onclick="runNecessity()">Run necessity tests</button><button onclick="showPacket()">Show packet</button><button onclick="showSummary()">Show summary</button><button onclick="copyOutput()">Copy output</button><div id="cards"></div></section><section><h2>Output</h2><pre id="out">No output yet.</pre></section></main><script src="src/kernel-intention-discovery-v0-1.js?v=intent-1"></script><script src="src/kernel-intention-refinement-v0-1.js?v=refine-1"></script><script src="src/kernel-intention-necessity-test-v0-1.js?v=necessity-1"></script><script>let packet=null,last='';function esc(v){return String(v??'').replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]))}function resultClass(r){if(r==='concept_collapses')return'collapse';if(String(r).includes('shift'))return'shift';return''}function classClass(c){if(c==='necessary_core')return'core';if(c==='boundary_condition')return'boundary';if(c==='derivative_expression')return'derivative';return''}function setOut(v){last=typeof v==='string'?v:JSON.stringify(v,null,2);document.getElementById('out').textContent=last}function runNecessity(){const decisionEl=document.getElementById('decisionMetric');const countEl=document.getElementById('candidateCount');try{packet=KernelIntentionNecessityTestV01.runNecessityTests();decisionEl.textContent=packet.ok?'NECESSITY_READY':'HELD';decisionEl.className=packet.ok?'ok':'bad';countEl.textContent=packet.necessity_candidate_count;renderCards();showSummary()}catch(e){decisionEl.textContent='ERROR';decisionEl.className='bad';setOut({ok:false,error:e.message,belief_movement:'none'})}}function renderCards(){document.getElementById('cards').innerHTML=(packet&&packet.candidates||[]).map(c=>`<div class="card"><h3>${esc(c.concept)} · ${esc(c.necessity_review_status)}</h3><p><span class="pill core">core ${c.necessary_core_dimensions.length}</span><span class="pill boundary">boundary ${c.boundary_dimensions.length}</span><span class="pill derivative">derivative ${c.derivative_expression_dimensions.length}</span></p>${c.dimension_tests.map(t=>`<div class="test"><b>${esc(t.dimension)}</b><br><span class="pill ${classClass(t.necessity_class)}">${esc(t.necessity_class)}</span><span class="pill ${resultClass(t.removal_result)}">${esc(t.removal_result)}</span><span class="pill">shift: ${esc(t.neighbor_shift)}</span><div class="muted">${esc(t.explanation)}</div><div class="muted">counterfactual L1: ${esc(t.counterfactual_shape_after_removal.l1_total)}</div></div>`).join('')}</div>`).join('')||'No necessity candidates.'}function summary(){return{packet_type:'42ndMind_intention_necessity_summary_view_v0_1',ok:packet&&packet.ok,candidate_count:packet&&packet.necessity_candidate_count,candidates:(packet&&packet.candidates||[]).map(c=>({concept:c.concept,necessary_core_dimensions:c.necessary_core_dimensions,boundary_dimensions:c.boundary_dimensions,derivative_expression_dimensions:c.derivative_expression_dimensions,unresolved_dimensions:c.unresolved_dimensions,summary:c.summary,tests:c.dimension_tests.map(t=>({dimension:t.dimension,necessity_class:t.necessity_class,removal_result:t.removal_result,neighbor_shift:t.neighbor_shift,counterfactual_l1:t.counterfactual_shape_after_removal.l1_total}))})),validation:packet&&packet.validation,belief_movement:'none'}}function showSummary(){if(!packet)return runNecessity();setOut(summary())}function showPacket(){if(!packet)return runNecessity();setOut(packet)}async function copyOutput(){try{await navigator.clipboard.writeText(last);document.getElementById('out').textContent='Copied.\n\n'+last}catch(e){}}runNecessity();</script></body></html>
