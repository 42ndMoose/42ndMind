<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>42ndMind Kernel-Owned Unified Core Test v0.4</title><style>body{margin:0;background:#0f1115;color:#eef2ff;font:14px ui-monospace,Menlo,Consolas,monospace}header{padding:16px;background:#11141b;border-bottom:1px solid #2a3040}main{padding:12px}section{background:#171a21;border:1px solid #2a3040;border-radius:10px;padding:12px}pre{white-space:pre-wrap;background:#0d1016;border:1px solid #2a3040;border-radius:10px;padding:10px;overflow:auto;max-height:780px}.ok{color:#9dffb4}.bad{color:#ff8b8b}a{color:#9db6ff}</style></head><body><header><h1>42ndMind Kernel-Owned Unified Core Test v0.4</h1><div>Tests the actual EpistemicKernel live-brain path. No connector registry. The kernel owns unifiedCore.</div></header><main><section><h2 id="summary">Running...</h2><div><a href="llm-brain-v0-3.html?v=core-1">live brain</a></div><pre id="out"></pre></section></main><script src="src/epistemic-kernel-v0-2.js?v=corebase-1"></script><script src="src/epistemic-kernel-v0-2-patches.js?v=core-1"></script><script>const tests=[];let kernel=null;let snap=null;function add(n,f){tests.push({name:n,fn:f})}function assert(c,m){if(!c)throw new Error(m)}function arr(v){return Array.isArray(v)?v:[]}function core(){return kernel&&kernel.state&&kernel.state.unifiedCore}function refresh(){kernel.recalculate();snap=kernel.snapshot();return snap}add('patch loads on actual EpistemicKernel prototype',()=>{assert(window.EpistemicKernel,'EpistemicKernel missing');assert(EpistemicKernel.__v02PatchesApplied===true,'v0.2 patch flag missing');assert(EpistemicKernel.__unifiedCorePatchApplied===true,'unified core patch flag missing');assert(EpistemicKernel.unifiedCorePatch&&EpistemicKernel.unifiedCorePatch.version==='0.4.0-first-pass','unified core patch metadata missing');assert(typeof EpistemicKernel.prototype.unifiedTick==='function','unifiedTick missing');assert(typeof EpistemicKernel.prototype.unifiedIngestRaw==='function','unifiedIngestRaw missing');assert(typeof EpistemicKernel.prototype.unifiedCoreSnapshot==='function','unifiedCoreSnapshot missing')});add('new kernel owns unifiedCore at construction',()=>{kernel=new EpistemicKernel();assert(core(),'state.unifiedCore missing');assert(core().version==='epistemic_unified_core_v0_4_first_pass','wrong unifiedCore version');assert(core().doctrine.brain_owns_unified_core===true,'brain ownership doctrine missing');assert(core().doctrine.modules_are_views_not_thought_sources===true,'modules-as-views doctrine missing');assert(core().doctrine.one_owned_state===true,'one-owned-state doctrine missing');assert(core().doctrine.unified_tick_loop===true,'tick-loop doctrine missing')});add('quickIngest writes raw event and owned claim nodes into unifiedCore',()=>{kernel.quickIngest('The source says the valve is open because pressure rose.',{mode:'auto'});refresh();assert(arr(core().runtimeEvents).some(e=>e.kind==='raw_ingest'),'raw_ingest event missing');assert(arr(core().runtimeEvents).some(e=>e.kind==='claim_node'),'claim_node event missing');assert(arr(core().claimNodes).length>=1,'claimNodes missing');assert(arr(core().meaningNodes).some(n=>n.label==='source'),'meaning node source missing');assert(Number(core().pressureState.source)>0,'source pressure missing');assert(Number(core().pressureState.causal)>0,'causal pressure missing')});add('addEvidence writes evidence node and support/counter edge into unifiedCore',()=>{const claim=kernel.state.claims[0];kernel.addEvidence({text:'Log record indicates the valve was checked.',relation:'supports',claimId:claim.id,strength:'moderate',confidence:0.8,source:'manual_test'});refresh();assert(arr(core().evidenceNodes).length>=1,'evidenceNodes missing');assert(arr(core().relationEdges).some(e=>e.relation_family==='supports'),'support relation edge missing');assert(arr(core().runtimeEvents).some(e=>e.kind==='evidence_node'),'evidence_node event missing');assert(Number(core().pressureState.evidence)>0,'evidence pressure missing')});add('low-signal/typo/unknown input stays in core and proposes admission candidates',()=>{kernel.quickIngest('teh zorp flindle opne',{mode:'auto'});refresh();assert(arr(core().runtimeEvents).some(e=>String(e.raw_text||'').includes('zorp')),'unknown raw event missing');assert(arr(core().meaningNodes).some(n=>n.kind==='unknown_meaning_candidate'),'unknown meaning node missing');assert(arr(core().meaningNodes).some(n=>n.kind==='typo_variant_candidate'),'typo variant node missing');assert(arr(core().admissionProposals).some(p=>p.proposal_family==='unknown_meaning_admission'),'unknown admission proposal missing');assert(arr(core().admissionProposals).some(p=>p.proposal_family==='typo_variant_subdivision'),'typo admission proposal missing');assert(arr(core().admissionProposals).every(p=>p.canonical_mutation_performed===false),'canonical mutation happened')});add('structured packet import writes through the same core state',()=>{kernel.importExtractionPacket({packet_type:'epistemic_extraction_packet',claims:[{client_id:'c1',text:'A claim depends on a source record.',scope:'claim',confidence:0.55}],evidence:[{text:'source_link: Source A reports the record.',relation:'supports',target_client_id:'c1',strength:'moderate',confidence:0.75}],principles:[],dependencies:[],questions:[],observations:[],gate_events:[]});refresh();assert(arr(core().runtimeEvents).some(e=>e.kind==='structured_packet_import'),'structured packet core event missing');assert(arr(core().claimNodes).some(n=>String(n.text||'').includes('depends on a source')),'structured claim node missing');assert(arr(core().evidenceNodes).some(n=>String(n.text||'').includes('source_link')),'structured evidence node missing')});add('snapshot exposes unifiedCore as owned kernel state, not external globals',()=>{const snapshot=kernel.snapshot();assert(snapshot.unifiedCore,'snapshot missing unifiedCore');assert(snapshot.unifiedCore.doctrine.brain_owns_unified_core===true,'snapshot ownership doctrine missing');assert(snapshot.unifiedCore.doctrine.modules_are_views_not_thought_sources===true,'snapshot modules-as-views doctrine missing');assert(snapshot.unifiedCore.last_tick_summary,'last tick summary missing');assert(snapshot.unifiedCore.graph&&arr(snapshot.unifiedCore.graph.nodes).some(n=>n.id==='unified_core_root'),'unified core graph missing root');assert(snapshot.unifiedCore.beliefCommitments.length===0,'belief commitments should remain empty before promotion criteria')});add('no final truth, no belief movement, and no silent canonical mutation are preserved',()=>{refresh();assert(core().doctrine.no_final_truth_promotion===true,'no final truth doctrine missing');assert(core().doctrine.belief_movement==='none','belief movement doctrine wrong');assert(arr(core().admissionProposals).every(p=>p.status==='candidate_admission_not_canonical'&&p.canonical_mutation_performed===false&&p.belief_movement==='none'),'unsafe admission proposal');assert(arr(core().runtimeEvents).every(e=>e.truth_status==='not_adjudicated'&&e.promotion_status==='not_promoted'&&e.belief_movement==='none'),'unsafe runtime event');assert(core().stats.belief_commitments===0,'belief commitments moved')});(async function run(){const results=[];for(const t of tests){try{await t.fn();results.push({name:t.name,passed:true})}catch(e){results.push({name:t.name,passed:false,error:e.message})}}const passed=results.filter(r=>r.passed).length;document.getElementById('summary').className=passed===tests.length?'ok':'bad';document.getElementById('summary').textContent=passed+'/'+tests.length+' passed';document.getElementById('out').textContent=JSON.stringify({packet_type:'42ndMind_kernel_owned_unified_core_v0_4_test_report',ok:passed===tests.length,patch_loaded:!!(window.EpistemicKernel&&EpistemicKernel.__unifiedCorePatchApplied),unified_core_version:core()&&core().version,stats:core()&&core().stats,pressureState:core()&&core().pressureState,doctrine:core()&&core().doctrine,admissionProposals:core()&&core().admissionProposals,runtimeEvents:core()&&arr(core().runtimeEvents).map(e=>({id:e.id,kind:e.kind,raw_text:e.raw_text,signals:e.signals,status:e.status,truth_status:e.truth_status,promotion_status:e.promotion_status,belief_movement:e.belief_movement})),results},null,2)})();</script></body></html>
