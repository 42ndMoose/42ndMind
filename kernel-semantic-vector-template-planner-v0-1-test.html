<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>42ndMind Semantic Vector Template Planner v0.1 Test</title><style>body{margin:0;font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:#0f1115;color:#eef2ff}header{padding:16px 18px;border-bottom:1px solid #2a3040;background:#11141b}main{padding:12px}section{background:#171a21;border:1px solid #2a3040;border-radius:10px;padding:12px}h1{font:700 19px/1.2 system-ui,-apple-system,Segoe UI,sans-serif;margin:0 0 4px}pre{white-space:pre-wrap;background:#0d1016;border:1px solid #2a3040;border-radius:10px;padding:10px;overflow:auto;max-height:760px}.ok{color:#9dffb4}.bad{color:#ff8b8b}a{color:#9db6ff}</style></head>
<body>
<header><h1>42ndMind Semantic Vector Template Planner v0.1 Test</h1><div>Smoke test for the 146-entry combined corpus.</div></header>
<main><section><h2 id="summary">Running...</h2><div><a href="semantic-vector-template-planner.html">semantic vector template planner</a></div><pre id="out"></pre></section></main>
<script src="src/kernel-semantic-corpus-v0-1.js?v=0.1.0"></script>
<script src="src/kernel-semantic-corpus-combiner-v0-1.js?v=unit-total-1"></script>
<script src="src/kernel-semantic-pressure-registry-v0-1.js?v=0.1.0"></script>
<script src="src/kernel-semantic-pressure-registry-v0-1-1-patch.js?v=status-neg-1"></script>
<script src="src/kernel-semantic-vector-compressor-v0-1.js?v=0.1.0"></script>
<script src="src/kernel-semantic-vector-template-planner-v0-1.js?v=0.1.0"></script>
<script src="src/kernel-semantic-vector-template-planner-v0-1-1-patch.js?v=0.1.1"></script>
<script src="src/kernel-semantic-vector-template-planner-v0-1-2-patch.js?v=0.1.2"></script>
<script src="src/kernel-semantic-vector-template-planner-v0-1-3-patch.js?v=status-neg-1"></script>
<script>
  const tests=[]; let packet=null;
  function add(name,fn){tests.push({name,fn});}
  function assert(cond,msg){if(!cond)throw new Error(msg);}
  add('modules load',()=>{assert(window.KernelSemanticCorpusV01,'corpus missing');assert(window.KernelSemanticCorpusCombinerV01,'combiner missing');assert(window.KernelSemanticPressureRegistryV01,'registry missing');assert(window.KernelSemanticVectorCompressorV01,'compressor missing');assert(window.KernelSemanticVectorTemplatePlannerV01,'planner missing');assert(KernelSemanticVectorTemplatePlannerV01.VERSION==='0.1.3','planner patch not loaded');});
  add('defaults include current unit-total packet',()=>{const urls=KernelSemanticCorpusCombinerV01.DEFAULT_EXTENSION_URLS;assert(urls.length===14,'expected 14 extension packets');assert(urls.includes('data/semantic_seed_uncertainty_status_negation_v0_1.json'),'status packet missing');assert(urls.includes('data/semantic_seed_unit_total_shape_bridge_v0_1.json'),'unit-total shape bridge packet missing');});
  add('doctrine preserves no belief movement',()=>{const d=KernelSemanticVectorTemplatePlannerV01.doctrine();assert(d.planner_does_not_patch_source===true,'no patch doctrine missing');assert(d.belief_movement==='none','belief movement doctrine wrong');});
  add('load combined compress and plan succeeds',async()=>{packet=await KernelSemanticVectorTemplatePlannerV01.loadCombinedCompressAndPlan({min_template_observations:2,min_observations:2,limit:10,sentences_per_template:4});assert(packet.ok===true,'planner packet not ok');assert(packet.compressed_packet.combined_packet.combined.entry_count===146,'expected 146 entries');assert(packet.compressed_packet.combined_packet.combined.source_packets.length===15,'expected 15 source packets');assert(packet.compressed_packet.vector_space.vector_count===146,'expected 146 vectors');assert(packet.compressed_packet.pressure_ontology.validation.missing_pressure_count===0,'expected zero ontology gaps');assert(packet.plan.vector_count===146,'plan vector count wrong');assert(packet.plan.selected_template_count===10,'expected 10 selected templates');assert(packet.plan.suggested_sentence_count>=1,'expected suggested sentences');assert(packet.plan.belief_movement==='none','plan moved belief');});
  add('planner output remains non-doctrinal',()=>{const summary=packet.summary;assert(summary.vectors===146,'summary vector count wrong');assert(summary.selected_templates===10,'summary selected count wrong');assert(summary.suggested_sentences===packet.plan.suggested_sentence_count,'summary sentence count mismatch');assert(summary.belief_movement==='none','summary moved belief');});
  (async function run(){const results=[];for(const t of tests){try{await t.fn();results.push({name:t.name,passed:true});}catch(e){results.push({name:t.name,passed:false,error:e.message});}}const passed=results.filter(r=>r.passed).length;document.getElementById('summary').className=passed===tests.length?'ok':'bad';document.getElementById('summary').textContent=`${passed}/${tests.length} passed`;document.getElementById('out').textContent=JSON.stringify({packet_type:'42ndMind_semantic_vector_template_planner_v0_1_test_report',vector_count:packet&&packet.plan?packet.plan.vector_count:0,selected_template_count:packet&&packet.plan?packet.plan.selected_template_count:0,suggested_sentence_count:packet&&packet.plan?packet.plan.suggested_sentence_count:0,results},null,2);})();
</script>
</body>
</html>
