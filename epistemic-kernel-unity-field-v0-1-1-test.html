<!doctype html><html><head><meta charset="utf-8"><title>Unity Field v0.1.1 Test</title><style>body{background:#0f1115;color:#eef2ff;font:14px monospace}pre{white-space:pre-wrap}.ok{color:#9f9}.bad{color:#f99}</style></head><body><h1 id="summary">Running...</h1><pre id="out"></pre>
<script src="src/epistemic-kernel-v0-2.js"></script><script src="src/epistemic-kernel-v0-2-patches.js"></script><script src="src/kernel-brain-v0-4.js"></script><script src="src/kernel-brain-epistemic-kernel-bridge-v0-1.js"></script><script src="src/epistemic-kernel-maturity-core-v0-1.js"></script><script src="src/epistemic-kernel-belief-memory-engine-v0-1.js"></script><script src="src/epistemic-kernel-belief-memory-engine-v0-1-1-patch.js"></script><script src="src/epistemic-kernel-attention-organism-v0-1.js"></script><script src="src/epistemic-kernel-unity-field-v0-1.js"></script><script src="src/epistemic-kernel-unity-field-v0-1-1-patch.js"></script>
<script>
let k=new EpistemicKernel(), b=KernelBrainEpistemicKernelBridgeV01.bind(k).bound_brain;
function s(){return k.state.unifiedCore}function u(){return s().kernelUnityFieldCore}function c(){return s().communicationCore}function m(){return s().maturityCore}function say(x){b.ingest(x,{kind:'unity_v011_test'});b.refreshKernelUnityField('manual');return c().current_message.message}
const tests=[];function add(n,f){tests.push({name:n,fn:f})}function ok(x,e){if(!x)throw Error(e)}
add('patch loaded',()=>{ok(window.EpistemicKernelUnityFieldV011Patch,'missing patch');ok(EpistemicKernel.__kernelUnityFieldV011PatchApplied,'kernel patch missing')});
add('language route wins over generic learning',()=>{let msg=say('language should grow through calculus, subdivision of one, meanings, and formulas');ok(u().selected_self_application.application_kind==='grow_language_by_subdivision','bad app '+u().selected_self_application.application_kind);ok(/truth-seeking|belief|memory|communication/i.test(msg),'bad msg '+msg)});
add('communication route wins over incidental learn wording',()=>{let msg=say('can you communicate what you know and what you want to learn?');ok(u().selected_self_application.application_kind==='express_current_self_state','bad app '+u().selected_self_application.application_kind);ok(/live field|communicate|truth/i.test(msg),'bad msg '+msg)});
add('reasoning side test still routes properly',()=>{let msg=say('testing your reasoning? you can also learn from the side.');ok(u().selected_self_application.application_kind==='use_input_as_reasoning_test_and_learning_signal','bad app '+u().selected_self_application.application_kind);ok(/reasoning test|side-learning|from the side/i.test(msg),'bad msg '+msg)});
add('no final truth promotion',()=>{ok(m().core_philosophy==='objective_peak_philosophical_maturity','maturity missing');ok(u().truth_status==='not_final','truth promoted');ok(u().promotion_status==='not_promoted_to_final_truth','promoted')});
(async()=>{let r=[];for(const t of tests){try{await t.fn();r.push({name:t.name,passed:true})}catch(e){r.push({name:t.name,passed:false,error:e.message})}}let p=r.filter(x=>x.passed).length;summary.textContent=p+'/'+tests.length+' passed';summary.className=p===tests.length?'ok':'bad';out.textContent=JSON.stringify({ok:p===tests.length,kernelUnityFieldCore:u(),communicationCore:c(),results:r},null,2)})();
</script></body></html>
