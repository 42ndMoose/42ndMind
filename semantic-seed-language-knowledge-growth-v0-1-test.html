<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>42ndMind Language Knowledge Growth Seed Test</title>
  <style>
    body{margin:0;font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:#0f1115;color:#eef2ff}
    header{padding:16px 18px;border-bottom:1px solid #2a3040;background:#11141b}
    main{padding:12px}section{background:#171a21;border:1px solid #2a3040;border-radius:10px;padding:12px}
    h1{font:700 19px/1.2 system-ui,-apple-system,Segoe UI,sans-serif;margin:0 0 4px}
    pre{white-space:pre-wrap;background:#0d1016;border:1px solid #2a3040;border-radius:10px;padding:10px;overflow:auto;max-height:760px}.ok{color:#9dffb4}.bad{color:#ff8b8b}a{color:#9db6ff}
  </style>
</head>
<body>
<header><h1>42ndMind Language Knowledge Growth Seed Test</h1><div>Validates the standalone language-growth seed packet before combiner integration.</div></header>
<main><section><h2 id="summary">Running...</h2><div><a href="objective-language-knowledge-growth.html">knowledge growth page</a></div><pre id="out"></pre></section></main>
<script>
  const tests=[]; let packet=null;
  function add(name,fn){tests.push({name,fn});}
  function assert(cond,msg){if(!cond)throw new Error(msg);}
  function asArray(v){return Array.isArray(v)?v:[];}
  function operators(){return packet.entries.flatMap(e=>asArray(e.semantic_operators).map(op=>op.operator));}
  function pressures(){return packet.entries.flatMap(e=>asArray(e.semantic_operators).flatMap(op=>asArray(op.pressure)));}

  add('load seed packet json',async()=>{
    const res=await fetch('data/semantic_seed_language_knowledge_growth_v0_1.json?v=0.1.0',{cache:'no-store'});
    assert(res.ok,'fetch failed '+res.status);
    packet=await res.json();
    assert(packet.packet_type==='42ndMind_semantic_seed_corpus_v0_1_extension','wrong packet type');
    assert(packet.packet_version==='0.1.0','wrong packet version');
  });

  add('doctrine preserves candidate growth and no belief movement',()=>{
    const d=packet.doctrine||{};
    assert(d.reviewed_seed_packet_is_training_pressure_not_doctrine===true,'training pressure doctrine missing');
    assert(d.language_growth_adds_candidate_anchors_not_truth===true,'candidate anchor doctrine missing');
    assert(d.exponential_growth_must_be_candidate_growth_not_belief_growth===true,'growth guard missing');
    assert(d.active_shape_l1_total==='sum_abs_dimensions_equals_1','unit-total doctrine missing');
    assert(d.language_anchor_repetition_is_not_truth===true,'anchor truth guard missing');
    assert(d.belief_movement==='none','doctrine moved belief');
    assert(packet.belief_movement==='none','packet moved belief');
  });

  add('entries are reviewed seed candidates',()=>{
    assert(packet.entries.length===16,'expected 16 seed entries');
    packet.entries.forEach(entry=>{
      assert(entry.id&&entry.text&&entry.language==='en','basic entry fields missing');
      assert(entry.operator_group==='language_knowledge_growth_candidate','wrong operator group');
      assert(entry.review_status==='reviewed_seed_candidate','wrong review status');
      assert(asArray(entry.surface_terms).length>=4,'surface terms too thin');
      assert(asArray(entry.semantic_operators).length>=1,'semantic operators missing');
      assert(asArray(entry.evidence_burden).length>=4,'evidence burden too thin');
      assert(entry.expected_kernel_response&&entry.expected_kernel_response.belief_movement==='none_from_language_anchor_alone','belief movement guard missing');
      assert(entry.workbench_metadata&&entry.workbench_metadata.requires_human_review===true,'human review guard missing');
    });
  });

  add('core pressure anchors are present',()=>{
    const ops=operators();
    ['language_anchor_pressure(unit_total_refinement_pressure)','language_anchor_pressure(general_unresolved_status_pressure)','language_anchor_pressure(claim_nonclosure_status_pressure)','language_anchor_pressure(negated_collusion_status_pressure)','language_anchor_pressure(direct_link_evidence_burden)','language_anchor_pressure(motive_agency_pressure)'].forEach(op=>assert(ops.includes(op),'missing '+op));
  });

  add('core operator anchors are present',()=>{
    const ops=operators();
    ['language_anchor_operator(unit_total_shape_projection)','language_anchor_operator(anonymous_shape_invariance)','language_anchor_operator(anonymous_shape_repetition)','language_anchor_operator(force_shape_separation)','language_anchor_operator(unresolved)','language_anchor_operator(not_settled)','language_anchor_operator(not_collusion)','language_anchor_operator(coordinated)','language_anchor_operator(collusion)'].forEach(op=>assert(ops.includes(op),'missing '+op));
  });

  add('pressures remain existing or deliberate review pressures',()=>{
    const ps=new Set(pressures());
    ['unit_total_refinement_pressure','general_unresolved_status_pressure','claim_nonclosure_status_pressure','negated_collusion_status_pressure','direct_link_evidence_burden','motive_agency_pressure','intent_attribution_pressure','evidence_access_burden','coordination_pressure','ambiguity_pressure'].forEach(p=>assert(ps.has(p),'missing pressure '+p));
  });

  add('packet is not yet marked integrated',()=>{
    assert(packet.source_review_summary.source_baseline==='146 entries / 15 source packets','source baseline mismatch');
    assert(packet.source_review_summary.import_status==='not_added_to_default_combiner_until_browser_tests_pass','packet should still be staged');
    assert(packet.source_review_summary.emitted_entry_count===16,'emitted count wrong');
  });

  add('entries preserve non-truth boundaries',()=>{
    const combined=packet.entries.map(e=>[e.text,e.candidate_intended_meaning,e.expected_kernel_response&&e.expected_kernel_response.source_trust_action].join(' ')).join(' ');
    assert(combined.includes('training pressure'),'training pressure guard missing');
    assert(combined.includes('not as truth'),'truth guard missing');
    assert(combined.includes('not belief movement')||combined.includes('belief movement'),'belief movement guard missing');
  });

  (async function run(){
    const results=[];
    for(const t of tests){try{await t.fn();results.push({name:t.name,passed:true});}catch(e){results.push({name:t.name,passed:false,error:e.message});}}
    const passed=results.filter(r=>r.passed).length;
    document.getElementById('summary').className=passed===tests.length?'ok':'bad';
    document.getElementById('summary').textContent=`${passed}/${tests.length} passed`;
    document.getElementById('out').textContent=JSON.stringify({packet_type:'42ndMind_semantic_seed_language_knowledge_growth_v0_1_test_report',entry_count:packet&&packet.entries&&packet.entries.length,operators:packet?operators():[],results},null,2);
  })();
</script>
</body>
</html>
