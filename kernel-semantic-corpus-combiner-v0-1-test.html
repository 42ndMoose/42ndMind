<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>42ndMind Semantic Corpus Combiner v0.1 Test</title>
  <style>
    body{margin:0;font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:#0f1115;color:#eef2ff}
    header{padding:16px 18px;border-bottom:1px solid #2a3040;background:#11141b}
    main{padding:12px}section{background:#171a21;border:1px solid #2a3040;border-radius:10px;padding:12px}
    h1{font:700 19px/1.2 system-ui,-apple-system,Segoe UI,sans-serif;margin:0 0 4px}
    pre{white-space:pre-wrap;background:#0d1016;border:1px solid #2a3040;border-radius:10px;padding:10px;overflow:auto;max-height:760px}.ok{color:#9dffb4}.bad{color:#ff8b8b}a{color:#9db6ff}
  </style>
</head>
<body>
<header><h1>42ndMind Semantic Corpus Combiner v0.1 Test</h1><div>Tests runtime combination of the 142-entry semantic corpus and modular extension batches.</div></header>
<main><section><h2 id="summary">Running...</h2><div><a href="semantic-corpus-combiner.html">semantic corpus combiner</a></div><pre id="out"></pre></section></main>
<script src="src/kernel-semantic-corpus-v0-1.js?v=0.1.0"></script>
<script src="src/kernel-semantic-invariant-learner-v0-4.js?v=0.4.0"></script>
<script src="src/kernel-semantic-corpus-to-invariants-v0-1.js?v=0.1.0"></script>
<script src="src/kernel-semantic-corpus-combiner-v0-1.js?v=status-neg-1"></script>
<script>
  const tests=[]; let packet=null;
  function add(name,fn){tests.push({name,fn});}
  function assert(cond,msg){if(!cond)throw new Error(msg);}
  function asArray(v){return Array.isArray(v)?v:[];}
  function sourceByLabel(label){return asArray(packet&&packet.combined&&packet.combined.source_packets).find(s=>s.source_label===label);}
  function opCount(summary,op){return summary.operators&&summary.operators[op]||0;}
  function groupCount(summary,group){return summary.groups&&summary.groups[group]||0;}

  add('modules load',()=>{
    assert(window.KernelSemanticCorpusV01,'KernelSemanticCorpusV01 missing');
    assert(window.KernelSemanticCorpusCombinerV01,'KernelSemanticCorpusCombinerV01 missing');
    assert(window.KernelSemanticCorpusToInvariantsV01,'KernelSemanticCorpusToInvariantsV01 missing');
    assert(window.KernelSemanticInvariantLearnerV04,'KernelSemanticInvariantLearnerV04 missing');
  });

  add('doctrine preserves no belief movement',()=>{
    const d=KernelSemanticCorpusCombinerV01.doctrine();
    assert(d.combiner_builds_runtime_working_corpus_not_truth===true,'runtime corpus doctrine missing');
    assert(d.duplicate_ids_are_skipped_not_overwritten===true,'duplicate doctrine missing');
    assert(d.combiner_does_not_patch_source===true,'no patch doctrine missing');
    assert(d.belief_movement==='none','belief movement doctrine wrong');
  });

  add('default extension list is current',()=>{
    const urls=KernelSemanticCorpusCombinerV01.DEFAULT_EXTENSION_URLS;
    assert(urls.length===13,'expected thirteen default extension URLs');
    assert(urls.includes('data/semantic_seed_basis_refinement_v0_1.json'),'basis-refinement extension missing');
    assert(urls.includes('data/semantic_seed_uncertainty_status_negation_v0_1.json'),'status-negation extension missing');
  });

  add('loadAndCombine succeeds at 142-entry baseline',async()=>{
    packet=await KernelSemanticCorpusCombinerV01.loadAndCombine();
    assert(packet.ok===true,'combined packet not ok');
    assert(packet.decision==='COMBINED_CORPUS_READY','wrong decision');
    assert(packet.combined.entry_count===142,'expected 142 combined entries');
    assert(packet.combined.duplicate_entries.length===0,'expected zero duplicate entries');
    assert(packet.combined.source_packets.length===14,'expected main plus thirteen extension sources');
    assert(packet.combined.belief_movement==='none','combined corpus moved belief');
  });

  add('combined corpus validates',()=>{
    const report=KernelSemanticCorpusCombinerV01.validateCombined(packet.combined);
    assert(report.ok===true,'validation failed: '+JSON.stringify(report.validation.errors));
    assert(report.combined_entry_count===142,'combined count mismatch');
  });

  add('source packet metadata preserves final packet counts',()=>{
    assert(sourceByLabel('main')&&sourceByLabel('main').entry_count===32,'main source missing or wrong count');
    assert(sourceByLabel('extension_12')&&sourceByLabel('extension_12').entry_count===12,'basis-refinement source missing');
    assert(sourceByLabel('extension_13')&&sourceByLabel('extension_13').entry_count===7,'status-negation source missing');
  });

  add('status-negation and unit-total entries are present',()=>{
    const status=packet.combined.entries.find(e=>e.id==='status_negation_not_collusion_public_coordination_005');
    const unit=packet.combined.entries.find(e=>e.id==='status_negation_nested_unit_total_007');
    assert(status&&status.combiner_metadata.source_label==='extension_13','status-negation entry metadata missing');
    assert(status.semantic_operators.some(op=>op.operator==='not_collusion(actors)'),'not_collusion operator missing');
    assert(unit&&unit.combiner_metadata.source_label==='extension_13','unit-total entry metadata missing');
    assert(unit.semantic_operators.some(op=>op.operator==='unit_total_refinement(shape)'),'unit_total_refinement operator missing');
  });

  add('summary includes new status-negation groups and operators',()=>{
    const summary=KernelSemanticCorpusCombinerV01.summarizeCombined(packet.combined);
    assert(groupCount(summary,'basis_refinement_uncertainty_status_negation')>=1,'status-negation group missing');
    assert(groupCount(summary,'basis_refinement_unit_total_structure')>=1,'unit-total group missing');
    ['unresolved','not_settled','not_collusion','unit_total_refinement','expert','settled','collusion','coordinated'].forEach(op=>assert(opCount(summary,op)>=1,'missing operator '+op));
    assert(summary.belief_movement==='none','summary moved belief');
  });

  add('stale explicit extension lists are completed from defaults',async()=>{
    const stale=KernelSemanticCorpusCombinerV01.DEFAULT_EXTENSION_URLS.slice(0,12);
    const stalePacket=await KernelSemanticCorpusCombinerV01.loadAndCombine({extension_urls:stale});
    assert(stalePacket.combined.entry_count===142,'stale explicit list should still load current defaults');
    assert(stalePacket.combined.source_packets.length===14,'stale explicit list should still include all sources');
  });

  add('observation batch exports combined corpus',()=>{
    const batch=KernelSemanticCorpusCombinerV01.toObservationBatch(packet.combined);
    assert(batch.packet_type==='42ndMind_semantic_observation_batch_v0_4','wrong batch type');
    assert(batch.count>packet.combined.entry_count,'batch too small');
    assert(batch.combined_by===KernelSemanticCorpusCombinerV01.PACKET_TYPE,'combiner metadata missing from batch');
    assert(batch.belief_movement==='none','batch moved belief');
  });

  (async function run(){
    const results=[];
    for(const t of tests){try{await t.fn();results.push({name:t.name,passed:true});}catch(e){results.push({name:t.name,passed:false,error:e.message});}}
    const passed=results.filter(r=>r.passed).length;
    document.getElementById('summary').className=passed===results.length?'ok':'bad';
    document.getElementById('summary').textContent=`${passed}/${results.length} passed`;
    document.getElementById('out').textContent=JSON.stringify({packet_type:'42ndMind_semantic_corpus_combiner_v0_1_test_report',combined_entry_count:packet&&packet.combined?packet.combined.entry_count:0,source_packet_count:packet&&packet.combined?packet.combined.source_packets.length:0,duplicate_count:packet&&packet.combined?packet.combined.duplicate_entries.length:0,results},null,2);
  })();
</script>
</body>
</html>
