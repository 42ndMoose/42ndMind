<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>42ndMind Semantic Seed Extension v0.1 Test</title>
  <style>
    body { margin:0; font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; background:#0f1115; color:#eef2ff; }
    header { padding:16px 18px; border-bottom:1px solid #2a3040; background:#11141b; }
    main { padding:12px; }
    section { background:#171a21; border:1px solid #2a3040; border-radius:10px; padding:12px; }
    h1 { font:700 19px/1.2 system-ui,-apple-system,Segoe UI,sans-serif; margin:0 0 4px; }
    pre { white-space:pre-wrap; background:#0d1016; border:1px solid #2a3040; border-radius:10px; padding:10px; overflow:auto; max-height:760px; }
    .ok { color:#9dffb4; } .bad { color:#ff8b8b; } a { color:#9db6ff; }
  </style>
</head>
<body>
<header><h1>42ndMind Semantic Seed Extension v0.1 Test</h1><div>Validates extension seed batches such as the closure contrast batch before merging or using them as corpus extensions.</div></header>
<main><section><h2 id="summary">Running...</h2><div><a href="semantic-operator-workbench.html">semantic operator workbench</a> · <a href="kernel-semantic-corpus-v0-1-test.html">semantic corpus test</a> · <a href="kernel-semantic-corpus-to-invariants-v0-1-test.html">corpus bridge test</a></div><pre id="out"></pre></section></main>
<script src="src/kernel-semantic-corpus-v0-1.js?v=0.1.0"></script>
<script src="src/kernel-semantic-invariant-learner-v0-4.js?v=0.4.0"></script>
<script src="src/kernel-semantic-corpus-to-invariants-v0-1.js?v=0.1.0"></script>
<script>
  const tests = [];
  const EXT_URL = 'data/semantic_seed_closure_contrast_v0_1.json';
  const TEST_KEY = '42ndMind_semantic_seed_extension_v0_1_test';
  let ext = null;
  function add(name, fn) { tests.push({ name, fn }); }
  function assert(cond, msg) { if (!cond) throw new Error(msg); }
  async function loadExt(){ const res = await fetch(EXT_URL + '?v=0.1.0'); if(!res.ok) throw new Error('extension_fetch_failed_' + res.status); ext = await res.json(); }

  add('modules load', () => {
    assert(window.KernelSemanticCorpusV01, 'KernelSemanticCorpusV01 missing');
    assert(window.KernelSemanticCorpusToInvariantsV01, 'KernelSemanticCorpusToInvariantsV01 missing');
    assert(window.KernelSemanticInvariantLearnerV04, 'KernelSemanticInvariantLearnerV04 missing');
  });

  add('extension loads', () => {
    assert(ext && Array.isArray(ext.entries), 'extension entries missing');
    assert(ext.entries.length === 6, 'closure contrast extension should contain 6 entries');
    assert(ext.belief_movement === 'none', 'extension moved belief');
  });

  add('extension validates as corpus-shaped seed entries', () => {
    const report = KernelSemanticCorpusV01.validateCorpus(ext);
    assert(report.ok === true, 'extension did not validate: ' + JSON.stringify(report.errors));
    assert(report.valid_entry_count === 6, 'valid entry count mismatch');
  });

  add('extension contains closure contrast operators', () => {
    const summary = KernelSemanticCorpusV01.summarize(ext);
    ['debunked','challenged','lacks_evidence','false','rated','reviewer','transcript','contradicted_by'].forEach(name => assert(summary.operators[name] >= 1, 'missing operator ' + name));
  });

  add('extension preserves contrast distinctions', () => {
    const byText = Object.fromEntries(ext.entries.map(e => [e.text, e]));
    assert(byText['The claim was challenged.'].candidate_intended_meaning.includes('not refutation or falsity'), 'challenged meaning too broad');
    assert(byText['The claim lacks evidence.'].candidate_intended_meaning.includes('not automatically'), 'lacks evidence meaning too broad');
    assert(byText['The claim was contradicted by the transcript.'].semantic_operators.length === 2, 'redundant contradiction was not suppressed');
  });

  add('extension bridge builds learner packet', () => {
    const packet = KernelSemanticCorpusToInvariantsV01.buildPacket(ext);
    assert(packet.ok === true, 'bridge packet not ok');
    assert(packet.semantic_observation_batch.count > 6, 'observation batch too small');
    assert(packet.belief_movement === 'none', 'bridge moved belief');
  });

  add('extension records into invariant learner as pressure only', () => {
    KernelSemanticInvariantLearnerV04.clear(TEST_KEY);
    const result = KernelSemanticCorpusToInvariantsV01.recordIntoLearner(ext, { key: TEST_KEY, min_observations: 1 });
    assert(result.ok === true, 'recordIntoLearner failed');
    assert(result.enriched_invariants.length > 0, 'no enriched invariants');
    assert(result.belief_movement === 'none', 'record moved belief');
  });

  add('cleanup clears learner test ledger', () => {
    const cleared = KernelSemanticInvariantLearnerV04.clear(TEST_KEY);
    assert(cleared.ok === true, 'clear failed');
    assert(KernelSemanticInvariantLearnerV04.load(TEST_KEY).observations.length === 0, 'ledger not cleared');
  });

  (async function run(){
    const results = [];
    try { await loadExt(); } catch(e) { results.push({ name:'load extension before tests', passed:false, error:e.message }); }
    for (const t of tests) {
      try { await t.fn(); results.push({ name:t.name, passed:true }); }
      catch(e) { results.push({ name:t.name, passed:false, error:e.message }); }
    }
    const passed = results.filter(r => r.passed).length;
    document.getElementById('summary').className = passed === results.length ? 'ok' : 'bad';
    document.getElementById('summary').textContent = `${passed}/${results.length} passed`;
    document.getElementById('out').textContent = JSON.stringify({ packet_type:'42ndMind_semantic_seed_extension_v0_1_test_report', extension_entry_count: ext && ext.entries ? ext.entries.length : 0, results }, null, 2);
  })();
</script>
</body>
</html>
