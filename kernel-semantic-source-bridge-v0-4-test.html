<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>42ndMind Semantic Source Bridge v0.4 Test</title>
  <style>
    body { margin:0; font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; background:#0f1115; color:#eef2ff; }
    header { padding:16px 18px; border-bottom:1px solid #2a3040; background:#11141b; }
    main { padding:12px; }
    section { background:#171a21; border:1px solid #2a3040; border-radius:10px; padding:12px; }
    h1 { font:700 19px/1.2 system-ui,-apple-system,Segoe UI,sans-serif; margin:0 0 4px; }
    pre { white-space:pre-wrap; background:#0d1016; border:1px solid #2a3040; border-radius:10px; padding:10px; overflow:auto; max-height:760px; }
    .ok { color:#9dffb4; } .bad { color:#ff8b8b; } a { color:#9db6ff; }
  </style>
</head>
<body>
<header><h1>42ndMind Semantic Source Bridge v0.4 Test</h1><div>Tests semantic patch plans becoming source patch bridge packets without source writes.</div></header>
<main><section><h2 id="summary">Running...</h2><div><a href="kernel-semantic-promotion-bridge-v0-4-test.html">semantic promotion test</a> · <a href="kernel-source-patch-bridge-v0-4-test.html">source patch bridge test</a></div><pre id="out"></pre></section></main>
<script src="src/kernel-epistemic-governor-v0-1.js?v=0.1.0"></script>
<script src="src/kernel-epistemic-governor-v0-1-1-patch.js?v=0.1.1"></script>
<script src="src/kernel-epistemic-governor-v0-1-2-patch.js?v=0.1.2"></script>
<script src="src/kernel-self-maintenance-v0-4.js?v=0.4.0"></script>
<script src="src/kernel-promotion-pipeline-v0-4.js?v=0.4.0"></script>
<script src="src/kernel-promotion-pipeline-v0-4-1-patch.js?v=0.4.1"></script>
<script src="src/kernel-patch-candidate-v0-4.js?v=0.4.0"></script>
<script src="src/kernel-patch-candidate-v0-4-1-semantic-target-patch.js?v=0.4.1"></script>
<script src="src/kernel-semantic-invariant-learner-v0-4.js?v=0.4.0"></script>
<script src="src/kernel-semantic-promotion-bridge-v0-4.js?v=0.4.0"></script>
<script src="src/kernel-source-patch-bridge-v0-4.js?v=0.4.0"></script>
<script src="src/kernel-semantic-source-bridge-v0-4.js?v=0.4.0"></script>
<script>
  const tests = [];
  function add(name, fn) { tests.push({ name, fn }); }
  function assert(cond, msg) { if (!cond) throw new Error(msg); }
  function sample(){ return KernelSemanticSourceBridgeV04.sampleInput(); }
  function build(opts){ return KernelSemanticSourceBridgeV04.build(sample(), opts || {}); }

  add('module loads', () => {
    assert(window.KernelSemanticSourceBridgeV04, 'KernelSemanticSourceBridgeV04 missing');
    assert(KernelSemanticSourceBridgeV04.VERSION === '0.4.0', 'wrong semantic source bridge version');
    assert(KernelSemanticSourceBridgeV04.DECISIONS.SOURCE_PACKETS_READY === 'SOURCE_PACKETS_READY', 'decisions missing');
  });

  add('semantic proposal becomes source patch bridge packet', () => {
    const report = build({ sandbox_report:KernelSourcePatchBridgeV04.sampleSandbox('passed') });
    assert(report.decision === 'SOURCE_PACKETS_READY', 'source bridge should be ready');
    assert(report.patch_plan_count === 1, 'patch plan count wrong');
    assert(report.source_packet_count === 1, 'source packet count wrong');
    assert(report.source_packets[0].packet_type === '42ndMind_source_patch_bridge_packet_v0_4', 'source patch packet missing');
  });

  add('source packet is GitHub-safe and external-write only', () => {
    const report = build({ sandbox_report:KernelSourcePatchBridgeV04.sampleSandbox('passed') });
    const packet = report.source_packets[0];
    assert(packet.decision === 'PATCH_PACKET_READY', 'source patch packet should be ready');
    assert(packet.external_write_protocol.external_tool_required === true, 'external tool requirement missing');
    assert(packet.external_write_protocol.browser_kernel_writes_source === false, 'browser should not write source');
    assert(packet.application_state.source_written === false, 'source written by packet');
    assert(packet.file_operations.length > 0, 'file operations missing');
  });

  add('source packet includes semantic target files', () => {
    const report = build({ sandbox_report:KernelSourcePatchBridgeV04.sampleSandbox('passed') });
    const files = report.source_packets[0].target_files || [];
    assert(files.includes('src/kernel-semantic-invariant-learner-v0-4.js'), 'semantic learner target missing');
    assert(files.includes('src/kernel-semantic-promotion-bridge-v0-4.js'), 'semantic promotion bridge target missing');
    assert(files.includes('src/kernel-lexical-uncertainty-v0-4-1-patch.js'), 'lexical patch target missing');
  });

  add('SHA-required mode holds when SHA map is missing', () => {
    const report = build({ sandbox_report:KernelSourcePatchBridgeV04.sampleSandbox('passed'), require_sha:true });
    assert(report.decision === 'SOURCE_PACKETS_READY', 'batch still built');
    assert(report.source_packets[0].decision === 'HOLD_NOT_READY', 'missing SHA should hold source packet');
    assert(report.source_packets[0].issues.some(i => i.code === 'sha_missing'), 'sha_missing issue missing');
  });

  add('SHA-required mode becomes ready with SHA map', () => {
    const pre = build({ sandbox_report:KernelSourcePatchBridgeV04.sampleSandbox('passed') });
    const sha_map = {};
    pre.source_packets[0].target_files.forEach((path, i) => { sha_map[path] = 'sha_' + i; });
    const report = build({ sandbox_report:KernelSourcePatchBridgeV04.sampleSandbox('passed'), require_sha:true, sha_map });
    assert(report.source_packets[0].decision === 'PATCH_PACKET_READY', 'supplied SHA map should make packet ready');
    assert(report.source_packets[0].file_operations.every(op => op.current_sha_available === true), 'SHA availability missing');
  });

  add('sandbox failure blocks source packet', () => {
    const report = build({ sandbox_report:KernelSourcePatchBridgeV04.sampleSandbox('failed') });
    assert(report.source_packets[0].decision === 'BLOCKED', 'failed sandbox should block source packet');
    assert(report.source_packets[0].issues.some(i => i.code === 'sandbox_comparison_failed'), 'sandbox failure issue missing');
    assert(report.summary.blocked === 1, 'blocked summary wrong');
  });

  add('empty proposal packet holds safely', () => {
    const report = KernelSemanticSourceBridgeV04.build({ packet_type:'42ndMind_semantic_invariant_proposals_v0_4', proposals:[] });
    assert(report.decision === 'HOLD_NO_PATCH_PLANS', 'empty proposal should hold');
    assert(report.source_packet_count === 0, 'empty proposal should not create source packets');
  });

  add('application state remains non-applied', () => {
    const report = build({ sandbox_report:KernelSourcePatchBridgeV04.sampleSandbox('passed') });
    assert(report.application_state.source_written === false, 'source written');
    assert(report.application_state.commit_created === false, 'commit created');
    assert(report.application_state.fetch_back_verified === false, 'fetch-back falsely verified');
    assert(report.application_state.tests_run === false, 'tests falsely run');
    assert(report.belief_movement === 'none', 'bridge moved belief');
  });

  add('doctrine preserves planner-only boundary', () => {
    const report = build({ sandbox_report:KernelSourcePatchBridgeV04.sampleSandbox('passed') });
    assert(report.doctrine.semantic_source_bridge_is_planner_only === true, 'planner-only doctrine missing');
    assert(report.doctrine.source_packets_are_not_source_writes === true, 'source packet doctrine missing');
    assert(report.doctrine.external_sha_write_fetch_back_required === true, 'SHA/fetch-back doctrine missing');
    assert(report.doctrine.browser_kernel_never_writes_source_directly === true, 'browser source doctrine missing');
  });

  const results = tests.map(t => { try { t.fn(); return { name:t.name, passed:true }; } catch(e) { return { name:t.name, passed:false, error:e.message }; } });
  const passed = results.filter(r => r.passed).length;
  document.getElementById('summary').className = passed === results.length ? 'ok' : 'bad';
  document.getElementById('summary').textContent = `${passed}/${results.length} passed`;
  document.getElementById('out').textContent = JSON.stringify({ packet_type:'42ndMind_semantic_source_bridge_v0_4_test_report', results }, null, 2);
</script>
</body>
</html>
