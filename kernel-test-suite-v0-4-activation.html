<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>42ndMind v0.4 Activation Add-on Suite</title><style>body{margin:0;font:14px/1.45 ui-monospace,Menlo,Consolas,monospace;background:#0f1115;color:#eef2ff}header{padding:16px 18px;border-bottom:1px solid #2a3040;background:#11141b}main{padding:12px}section{background:#171a21;border:1px solid #2a3040;border-radius:10px;padding:12px}h1{font:700 19px/1.2 system-ui;margin:0 0 4px}pre{white-space:pre-wrap;background:#0d1016;border:1px solid #2a3040;border-radius:10px;padding:10px;overflow:auto;max-height:760px}.ok{color:#9dffb4}.bad{color:#ff8b8b}a{color:#9db6ff}</style></head><body><header><h1>42ndMind v0.4 Activation Add-on Suite</h1><div>Checks patch planner → runtime candidate staging → supplied test packet activation. No source writes, no behavior execution, no v0.3 mutation.</div></header><main><section><h2 id="summary">Running...</h2><div><a href="kernel-test-suite-v0-4.html">main suite</a> · <a href="kernel-runtime-activation-v0-4-test.html">activation test</a> · <a href="kernel-runtime-candidate-review.html">review page</a></div><pre id="out"></pre></section></main><script src="src/kernel-epistemic-governor-v0-1.js?v=0.1.0"></script><script src="src/kernel-epistemic-governor-v0-1-1-patch.js?v=0.1.1"></script><script src="src/kernel-epistemic-governor-v0-1-2-patch.js?v=0.1.2"></script><script src="src/kernel-self-maintenance-v0-4.js?v=0.4.0"></script><script src="src/kernel-promotion-pipeline-v0-4.js?v=0.4.0"></script><script src="src/kernel-promotion-pipeline-v0-4-1-patch.js?v=0.4.1"></script><script src="src/kernel-patch-candidate-v0-4.js?v=0.4.0"></script><script src="src/kernel-runtime-candidates-v0-4.js?v=0.4.0"></script><script src="src/kernel-runtime-activation-v0-4.js?v=0.4.0"></script><script>const tests=[];const KEY='42ndMind_activation_addon_suite_test';function add(n,f){tests.push({name:n,fn:f})}function assert(c,m){if(!c)throw new Error(m)}function passPackets(){return[KernelRuntimeActivationV04.sampleLocalPassPacket(),KernelRuntimeActivationV04.sampleIntegratedPassPacket()]}function stage(){KernelRuntimeCandidatesV04.clear(KEY);const plan=KernelPatchCandidateV04.createPlan(KernelPatchCandidateV04.sampleInput('runtime'));const r=KernelRuntimeCandidatesV04.stage(plan,{key:KEY,explicit_stage:true});if(!r.ok)throw new Error('stage failed');return r.candidate}add('activation stack modules load',()=>{assert(KernelPatchCandidateV04.VERSION==='0.4.0','patch planner missing');assert(KernelRuntimeCandidatesV04.VERSION==='0.4.0','runtime candidates missing');assert(KernelRuntimeActivationV04.VERSION==='0.4.0','activation missing')});add('runtime plan stages disabled',()=>{const c=stage();assert(c.status==='STAGED_DISABLED','not staged disabled');assert(c.enabled===false,'staged candidate enabled');assert(c.runtime_effect.behavior_executed===false,'staging executed behavior')});add('activation rejects missing tests',()=>{const c=stage();const e=KernelRuntimeActivationV04.evaluate(c.id,{key:KEY,manual_reviewed:true});assert(e.decision==='HOLD_TESTS_MISSING','missing tests should hold')});add('activation rejects failed tests',()=>{const c=stage();const e=KernelRuntimeActivationV04.evaluate(c.id,{key:KEY,test_packets:[KernelRuntimeActivationV04.sampleFailPacket(),KernelRuntimeActivationV04.sampleIntegratedPassPacket()],manual_reviewed:true});assert(e.decision==='HOLD_TESTS_FAILED','failed tests should hold')});add('activation requires manual review',()=>{const c=stage();const e=KernelRuntimeActivationV04.evaluate(c.id,{key:KEY,test_packets:passPackets()});assert(e.decision==='HOLD_TESTS_MISSING','manual review should be required');assert(e.issues.some(i=>i.code==='manual_review_required'),'manual review issue missing')});add('passing packets activate metadata only',()=>{const c=stage();const r=KernelRuntimeActivationV04.activate(c.id,{key:KEY,test_packets:passPackets(),manual_reviewed:true});assert(r.ok===true,'activation failed');assert(r.enable_result.candidate.status==='ENABLED_METADATA_ONLY','not metadata enabled');assert(r.doctrine.behavior_executed===false,'behavior executed');assert(r.doctrine.source_rewritten===false,'source rewritten');assert(r.doctrine.import_executed===false,'import executed')});add('cleanup',()=>{KernelRuntimeCandidatesV04.clear(KEY);assert(KernelRuntimeCandidatesV04.load(KEY).length===0,'queue not cleared')});const results=tests.map(t=>{try{t.fn();return{name:t.name,passed:true}}catch(e){return{name:t.name,passed:false,error:e.message}}});const passed=results.filter(r=>r.passed).length;document.getElementById('summary').className=passed===results.length?'ok':'bad';document.getElementById('summary').textContent=`${passed}/${results.length} passed`;document.getElementById('out').textContent=JSON.stringify({packet_type:'42ndMind_v0_4_activation_addon_suite_report',results,doctrine:{no_source_write:true,no_behavior_execution:true,v0_3_untouched:true}},null,2);</script></body></html>
