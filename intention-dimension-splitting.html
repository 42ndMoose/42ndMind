<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>42ndMind Intention Dimension Splitting</title><style>body{margin:0;background:#0f1115;color:#eef2ff;font:14px ui-monospace,Menlo,Consolas,monospace}header{padding:16px 18px;background:#11141b;border-bottom:1px solid #2a3040}main{padding:12px;display:grid;grid-template-columns:470px 1fr;gap:12px}section{background:#171a21;border:1px solid #2a3040;border-radius:10px;padding:12px}button{background:#25345c;color:#eef2ff;border:1px solid #3f5592;padding:8px 10px;border-radius:8px;cursor:pointer;margin:3px 3px 8px 0}pre{white-space:pre-wrap;background:#0d1016;border:1px solid #2a3040;border-radius:10px;padding:10px;overflow:auto;max-height:760px}.ok{color:#9dffb4}.bad{color:#ff8b8b}.muted{color:#8b93a7}a{color:#9db6ff}.card{background:#10131a;border:1px solid #2a3040;border-radius:10px;padding:10px;margin:10px 0}.split{border-top:1px solid #252b3a;padding:7px 0}.pill{display:inline-block;border:1px solid #2a3040;border-radius:999px;padding:1px 7px;margin:2px}.safe{color:#9dffb4}.warn{color:#ffd28b}@media(max-width:900px){main{grid-template-columns:1fr}}</style></head><body><header><h1>42ndMind Intention Dimension Splitting</h1><div class="muted">Candidate dimension subdivision from minimal-pair pressure. Source formulas stay intact. No mass inflation.</div></header><main><section><a href="index.html">main</a> · <a href="intention-minimal-pair-library.html?v=minpair-1">minimal pairs</a> · <a href="kernel-intention-dimension-splitting-v0-1-test.html?v=split-1">test</a><p>Decision: <b id="decisionMetric">not run</b></p><p>Concepts: <b id="conceptMetric">0</b></p><p>Split candidates: <b id="splitMetric">0</b></p><button onclick="runSplitting()">Run dimension splitting</button><button onclick="showPacket()">Show packet</button><button onclick="showSummary()">Show summary</button><button onclick="copyOutput()">Copy output</button><div id="cards"></div></section><section><h2>Output</h2><pre id="out">No output yet.</pre></section></main><script src="src/kernel-intention-discovery-v0-1.js?v=intent-1"></script><script src="src/kernel-intention-refinement-v0-1.js?v=refine-1"></script><script src="src/kernel-intention-necessity-test-v0-1.js?v=necessity-1"></script><script src="src/kernel-intention-neighbor-lattice-v0-1.js?v=lattice-3"></script><script src="src/kernel-intention-lattice-invariance-benchmark-v0-1.js?v=invariance-2"></script><script src="src/kernel-intention-formula-compiler-v0-1.js?v=formula-1"></script><script src="src/kernel-intention-concept-expansion-loop-v0-1.js?v=expansion-2"></script><script src="src/kernel-intention-contradiction-refinement-loop-v0-1.js?v=contradiction-1"></script><script src="src/kernel-intention-formula-revision-engine-v0-1.js?v=revision-1"></script><script src="src/kernel-intention-canonical-formula-ledger-v0-1.js?v=ledger-1"></script><script src="src/kernel-intention-proof-output-v0-1.js?v=proof-1"></script><script src="src/kernel-intention-minimal-pair-library-v0-1.js?v=minpair-1"></script><script src="src/kernel-intention-dimension-splitting-v0-1.js?v=split-1"></script><script>let packet=null,last='';function esc(v){return String(v??'').replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]))}function arr(v){return Array.isArray(v)?v:[]}function setOut(v){last=typeof v==='string'?v:JSON.stringify(v,null,2);document.getElementById('out').textContent=last}function runSplitting(){const decisionEl=document.getElementById('decisionMetric');try{packet=KernelIntentionDimensionSplittingV01.runDimensionSplitting();decisionEl.textContent=packet.ok?'DIMENSION_SPLIT_CANDIDATES_READY':'HELD_FOR_REVIEW';decisionEl.className=packet.ok?'ok':'bad';document.getElementById('conceptMetric').textContent=packet.concept_count;document.getElementById('splitMetric').textContent=packet.split_candidate_count;renderCards();showSummary()}catch(e){decisionEl.textContent='ERROR';decisionEl.className='bad';setOut({ok:false,error:e.message,belief_movement:'none'})}}function renderCards(){document.getElementById('cards').innerHTML=arr(packet&&packet.concept_groups).map(g=>`<div class="card"><h3>${esc(g.concept)}</h3><p><span class="pill safe">splits ${esc(g.split_candidate_count)}</span><span class="pill safe">pressure pairs ${esc(g.pressure_pair_count)}</span><span class="pill safe">L1 ${esc(g.all_revised_l1_totals_equal_1)}</span><span class="pill safe">force ${esc(g.force_terms_outside_shape)}</span></p>${arr(g.candidates).map(c=>`<div class="split"><b>${esc(c.parent_dimension)}</b> <span class="pill warn">${esc(c.parent_role)}</span><br><span class="muted">${esc(c.split_reason)}</span><br><span class="pill safe">${esc(c.child_terms.map(t=>t.dimension).join(' + '))}</span><br><span class="pill safe">source L1 ${esc(c.source_l1_total)}</span><span class="pill safe">revised L1 ${esc(c.revised_l1_total)}</span><span class="pill safe">mass change ${esc(c.mass_change)}</span></div>`).join('')}</div>`).join('')||'No split candidates.'}function summary(){return{packet_type:'42ndMind_intention_dimension_splitting_summary_view_v0_1',ok:packet&&packet.ok,source_minimal_pair_ok:packet&&packet.source_minimal_pair_ok,source_minimal_pair_count:packet&&packet.source_minimal_pair_count,source_ledger_ok:packet&&packet.source_ledger_ok,source_ledger_record_count:packet&&packet.source_ledger_record_count,concept_count:packet&&packet.concept_count,split_candidate_count:packet&&packet.split_candidate_count,concept_groups:arr(packet&&packet.concept_groups).map(g=>({concept:g.concept,split_candidate_count:g.split_candidate_count,pressure_pair_count:g.pressure_pair_count,all_revised_l1_totals_equal_1:g.all_revised_l1_totals_equal_1,force_terms_outside_shape:g.force_terms_outside_shape,belief_movement:g.belief_movement})),validation:packet&&packet.validation,belief_movement:'none'}}function showSummary(){if(!packet)return runSplitting();setOut(summary())}function showPacket(){if(!packet)return runSplitting();setOut(packet)}async function copyOutput(){try{await navigator.clipboard.writeText(last);document.getElementById('out').textContent='Copied.\n\n'+last}catch(e){}}runSplitting();</script></body></html>
