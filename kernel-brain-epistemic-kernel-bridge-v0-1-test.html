<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>42ndMind KernelBrain/EpistemicKernel Bridge Test v0.1</title><style>body{margin:0;background:#0f1115;color:#eef2ff;font:14px ui-monospace,Menlo,Consolas,monospace}header{padding:16px;background:#11141b;border-bottom:1px solid #2a3040}main{padding:12px}section{background:#171a21;border:1px solid #2a3040;border-radius:10px;padding:12px}pre{white-space:pre-wrap;background:#0d1016;border:1px solid #2a3040;border-radius:10px;padding:10px;overflow:auto;max-height:780px}.ok{color:#9dffb4}.bad{color:#ff8b8b}a{color:#9db6ff}</style></head><body><header><h1>42ndMind KernelBrainV04 / EpistemicKernel Bridge Test v0.1</h1><div>Tests shared state by reference. No duplicated consciousness.</div></header><main><section><h2 id="summary">Running...</h2><pre id="out"></pre></section></main><script src="src/epistemic-kernel-v0-2.js?v=corebase-1"></script><script src="src/epistemic-kernel-v0-2-patches.js?v=coremig-1"></script><script src="src/kernel-brain-v0-4.js?v=brain-2"></script><script src="src/kernel-brain-epistemic-kernel-bridge-v0-1.js?v=bridge-1"></script><script>const tests=[];let kernel=null;let binding=null;let boundBrain=null;function add(n,f){tests.push({name:n,fn:f})}function assert(c,m){if(!c)throw new Error(m)}function arr(v){return Array.isArray(v)?v:[]}function shared(){return kernel&&kernel.state&&kernel.state.unifiedCore}function events(){return arr(shared()&&shared().runtimeEvents)}function admissions(){return arr(shared()&&shared().admissionProposals)}add('bridge module loads with KernelBrain and EpistemicKernel',()=>{assert(window.EpistemicKernel,'EpistemicKernel missing');assert(window.KernelBrainV04,'KernelBrainV04 missing');assert(window.KernelBrainEpistemicKernelBridgeV01,'bridge missing');assert(KernelBrainEpistemicKernelBridgeV01.VERSION==='0.1.0','bridge version wrong');assert(KernelBrainV04.VERSION==='0.4.2','KernelBrain version wrong')});add('bind creates one shared state by reference',()=>{kernel=new EpistemicKernel();binding=KernelBrainEpistemicKernelBridgeV01.bind(kernel);boundBrain=binding.bound_brain;assert(binding.ok===true,'binding not ok');assert(boundBrain.state===kernel.state.unifiedCore,'boundBrain state is not the exact unifiedCore reference');assert(binding.kernel_brain_state_is_epistemic_unified_core===true,'binding report says not shared');assert(kernel.state.kernelBrainV04Bridge.one_backing_state===true,'kernel bridge state missing one backing state');assert(shared().bridge.binding_mode==='shared_reference_not_copy','binding mode wrong');assert(shared().bridge.duplicate_consciousness===false,'duplicate consciousness not false')});add('KernelBrain bound ingest writes into EpistemicKernel unifiedCore',()=>{const before=events().length;const e=boundBrain.ingest('teh source says the valve isnt opne because pressure rose and I am sure it proves the claim',{kind:'bound_brain_ingest'});assert(events().length>before,'event count did not increase');assert(events().some(x=>x.id===e.id),'bound brain event not in unifiedCore');assert(shared().meaningNodes.some(n=>n.kind==='typo_variant_candidate'),'typo meaning missing');assert(Number(shared().pressureState.source)>0,'source pressure missing');assert(admissions().some(a=>a.proposal_family==='typo_variant_subdivision'),'typo admission missing')});add('EpistemicKernel ingest writes into same backing state',()=>{const before=events().length;kernel.ingest('A screenshot shows a warning but media is not verified.',{kind:'epistemic_kernel_ingest'});assert(events().length>before,'kernel ingest did not write into shared state');assert(events().some(e=>e.kind==='epistemic_kernel_ingest'),'kernel ingest event missing');assert(events().some(e=>arr(e.candidate_packets).some(p=>p.type==='media_description')),'media packet missing');assert(boundBrain.state===shared(),'bound state reference changed')});add('KernelBrain process uses the same shared state',()=>{const before=events().length;const report=boundBrain.process('A source reports a record, but the quote fragment lacks context.');assert(events().length>before,'process did not write event');assert(report.internal_brain_state_summary&&report.internal_brain_state_summary.owned_state===true,'owned state summary missing');assert(report.belief_movement==='none','belief movement changed');assert(events().some(e=>arr(e.unresolved_items).includes('quote_fragment_context_required')),'quote context gap missing')});add('validation confirms no duplicated consciousness',()=>{const validation=KernelBrainEpistemicKernelBridgeV01.validateBinding(kernel,boundBrain);assert(validation.ok===true,'validation failed: '+validation.errors.join(','));assert(validation.checks.same_state_reference===true,'same reference check failed');assert(validation.checks.one_backing_state===true,'one backing state check failed');assert(validation.checks.duplicate_consciousness_false===true,'duplicate consciousness check failed')});add('admissions remain candidate-only with no canonical mutation',()=>{assert(admissions().length>=3,'admissions missing');admissions().forEach(a=>{assert(a.status==='candidate_admission_not_canonical',a.id+' not candidate');assert(a.canonical_mutation_performed===false,a.id+' canonical mutation');assert(a.belief_movement==='none',a.id+' belief moved')})});add('no final truth or belief movement across shared bridge state',()=>{assert(arr(shared().beliefCommitments).length===0,'belief commitments present');events().forEach(e=>{assert(e.truth_status==='not_adjudicated',e.id+' truth adjudicated');assert(e.promotion_status==='not_promoted',e.id+' promoted');assert(e.belief_movement==='none',e.id+' belief moved')});assert(boundBrain.state===kernel.state.unifiedCore,'state reference changed at end')});(async function run(){const results=[];for(const t of tests){try{await t.fn();results.push({name:t.name,passed:true})}catch(e){results.push({name:t.name,passed:false,error:e.message})}}const passed=results.filter(r=>r.passed).length;document.getElementById('summary').className=passed===tests.length?'ok':'bad';document.getElementById('summary').textContent=passed+'/'+tests.length+' passed';document.getElementById('out').textContent=JSON.stringify({packet_type:'42ndMind_kernel_brain_epistemic_kernel_bridge_v0_1_test_report',ok:passed===tests.length,bridge_version:window.KernelBrainEpistemicKernelBridgeV01&&KernelBrainEpistemicKernelBridgeV01.VERSION,binding:binding&&{ok:binding.ok,binding_mode:binding.binding_mode,one_backing_state:binding.one_backing_state,duplicate_consciousness:binding.duplicate_consciousness,kernel_brain_state_is_epistemic_unified_core:binding.kernel_brain_state_is_epistemic_unified_core},shared_state_summary:shared()&&{state_type:shared().state_type,bridge:shared().bridge,stats:shared().stats,pressureState:shared().pressureState,admissions:shared().admissionProposals.length,beliefs:shared().beliefCommitments.length},runtimeEvents:events().map(e=>({id:e.id,kind:e.kind,packets:arr(e.candidate_packets).map(p=>p.type),unresolved_items:e.unresolved_items,truth_status:e.truth_status,promotion_status:e.promotion_status,belief_movement:e.belief_movement})),admissionProposals:admissions(),results},null,2)})();</script></body></html>
