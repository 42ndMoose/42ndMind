<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>42ndMind Maturity Hard Fusion Test v0.1.2</title>
  <style>
    body { margin:0; font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; background:#0f1115; color:#eef2ff; }
    header { padding:16px 18px; border-bottom:1px solid #2a3040; background:#11141b; }
    main { padding:12px; }
    section { background:#171a21; border:1px solid #2a3040; border-radius:10px; padding:12px; margin-bottom:12px; }
    h1 { font:700 19px/1.2 system-ui,-apple-system,Segoe UI,sans-serif; margin:0 0 4px; }
    pre { white-space:pre-wrap; background:#0d1016; border:1px solid #2a3040; border-radius:10px; padding:10px; overflow:auto; max-height:680px; }
    .ok { color:#9dffb4; } .bad { color:#ff8b8b; }
  </style>
</head>
<body>
<header>
  <h1>42ndMind Maturity Hard Fusion Test v0.1.2</h1>
  <div>Loads objective v0.1.1 patch before hard fusion. Clean peak should now be reachable only when source-visible and well-evidenced.</div>
</header>
<main><section><h2 id="summary">Running...</h2><pre id="out"></pre></section></main>
<script src="src/maturity-objective-v0-1.js?v=0.1.0"></script>
<script src="src/maturity-objective-v0-1-1-patch.js?v=0.1.1"></script>
<script src="src/maturity-fusion-v0-1.js?v=0.1.0"></script>
<script src="src/maturity-hard-fusion-v0-1.js?v=0.1.0"></script>
<script>
  const SOURCE_KEY = '42ndMind_source_registry_v0_1';
  function gate(score) { return { score, status: score > 0 ? 'positive' : score < 0 ? 'negative' : 'dormant' }; }
  function gateStates(score) {
    return {
      G1_counter_consideration: gate(score),
      G2_non_strawman: gate(score),
      G3_self_correction: gate(score),
      G4_contradiction_handling: gate(score),
      G5_reality_contact: gate(score),
      G6_non_self_sealing: gate(score)
    };
  }
  function evidenceStrong() {
    return [
      { id:'e1', relation:'supports' },
      { id:'e2', relation:'supports' },
      { id:'e3', relation:'supports' },
      { id:'e4', relation:'supports' },
      { id:'e5', relation:'attacks' }
    ];
  }
  function state(point, opts = {}) {
    return {
      octahedron: { point: { ...point }, debug: {} },
      gateStates: opts.gateStates || gateStates(opts.gateScore ?? 1),
      evidence: opts.hasOwnProperty('evidence') ? opts.evidence : evidenceStrong(),
      contradictions: opts.contradictions || [],
      questions: opts.questions || [],
      beliefGraph: { nodes: [{ id:'root_worldview', octahedron:{ point:{ ...point }, debug:{} } }], links: [] },
      eventLog: []
    };
  }
  function l1(p) { return Math.abs(p.x) + Math.abs(p.y) + Math.abs(p.z); }
  function setSourceRegistry(count = 3, unresolved = 0) {
    localStorage.setItem(SOURCE_KEY, JSON.stringify({
      saved_at:new Date().toISOString(),
      sourceRegistry:{ counts:{ sources:count, unresolved_source_questions:unresolved }, sources:[] },
      meta:{ non_scoring:true, metadata_only:true, scoring_allowed:false }
    }));
  }
  function clearSourceRegistry() { localStorage.removeItem(SOURCE_KEY); }
  const tests = [];
  function add(name, fn) { tests.push({ name, fn }); }
  function assert(cond, msg) { if (!cond) throw new Error(msg); }

  add('objective patch installed', () => {
    assert(window.MaturityObjectiveV011PatchStatus?.installed === true, 'objective v0.1.1 patch missing');
    assert(MaturityObjectiveV01.VERSION === '0.1.1-patch', 'objective patch version missing');
  });

  add('module exists', () => {
    assert(window.MaturityHardFusionV01, 'MaturityHardFusionV01 missing');
    assert(MaturityHardFusionV01.VERSION === '0.1.0', 'wrong hard fusion version');
  });

  add('null origin is preserved', () => {
    setSourceRegistry();
    const s = state({ x:0, y:0, z:0 });
    const r = MaturityHardFusionV01.applyToState(s);
    assert(r.applied === false, 'null origin should not be capped');
    assert(s.octahedron.point.x === 0 && s.octahedron.point.y === 0 && s.octahedron.point.z === 0, 'null origin moved');
  });

  add('active surface is preserved when cap applies', () => {
    setSourceRegistry();
    const s = state({ x:-0.2, y:0.8, z:0 }, { evidence:[] });
    const r = MaturityHardFusionV01.applyToState(s);
    assert(r.applied === true, 'cap should apply with no evidence');
    assert(Math.abs(l1(s.octahedron.point) - 1) < 0.001, 'surface not preserved');
    assert(s.octahedron.point.y <= 0.35 + 0.001, 'y not capped');
  });

  add('lateral sign is preserved when cap applies', () => {
    setSourceRegistry();
    const s = state({ x:-0.4, y:0.6, z:0 }, { evidence:[] });
    MaturityHardFusionV01.applyToState(s);
    assert(s.octahedron.point.x < 0, 'x sign not preserved');
    assert(Math.abs(l1(s.octahedron.point) - 1) < 0.001, 'surface not preserved');
  });

  add('unresolved contradiction caps y', () => {
    setSourceRegistry();
    const s = state({ x:-0.2, y:0.8, z:0 }, { contradictions:[{ id:'c1', status:'active', reason:'timeline contradiction' }] });
    const r = MaturityHardFusionV01.applyToState(s);
    assert(r.applied === true, 'contradiction cap should apply');
    assert(r.detail.cap_reasons.includes('unresolved_contradiction_pressure'), 'missing contradiction cap reason');
  });

  add('unresolved source questions cap y', () => {
    setSourceRegistry(3, 2);
    const s = state({ x:-0.2, y:0.8, z:0 });
    const r = MaturityHardFusionV01.applyToState(s);
    assert(r.applied === true, 'source-question cap should apply');
    assert(r.detail.cap_reasons.includes('unresolved_source_questions_visible'), 'missing source-question cap reason');
  });

  add('self-sealing caps harder', () => {
    setSourceRegistry();
    const gs = gateStates(1);
    gs.G6_non_self_sealing = gate(-1);
    const s = state({ x:-0.2, y:0.8, z:0 }, { gateStates: gs });
    const r = MaturityHardFusionV01.applyToState(s);
    assert(r.applied === true, 'self-sealing cap should apply');
    assert(r.detail.maturity_classification === 'self_sealing_capped', 'wrong classification');
    assert(s.octahedron.point.y <= 0.45 + 0.001, 'self-sealing cap too high');
  });

  add('clean active candidate is not capped', () => {
    setSourceRegistry(3, 0);
    const s = state({ x:0, y:1, z:0 }, { evidence:evidenceStrong(), gateStates:gateStates(1), contradictions:[], questions:[] });
    const r = MaturityHardFusionV01.applyToState(s);
    assert(r.assessment.v011_patch.applied === true, 'objective clean-peak patch did not apply');
    assert(r.applied === false, 'well-evidenced source-visible clean peak should not be capped');
    assert(s.octahedron.point.y === 1, 'clean y changed');
  });

  add('no source visibility caps clean-looking peak', () => {
    clearSourceRegistry();
    const s = state({ x:0, y:1, z:0 }, { evidence:evidenceStrong(), gateStates:gateStates(1), contradictions:[], questions:[] });
    const r = MaturityHardFusionV01.applyToState(s);
    assert(r.applied === true, 'no-source peak should be capped');
    assert(r.detail.cap_reasons.includes('no_source_registry_or_source_review_visibility'), 'missing no-source cap reason');
  });

  add('root graph node is updated when capped', () => {
    setSourceRegistry();
    const s = state({ x:-0.2, y:0.8, z:0 }, { evidence:[] });
    MaturityHardFusionV01.applyToState(s);
    const root = s.beliefGraph.nodes.find(n => n.id === 'root_worldview');
    assert(root.octahedron.point.y === s.octahedron.point.y, 'root node did not update');
  });

  const results = tests.map(t => {
    try { t.fn(); return { name:t.name, passed:true }; }
    catch (e) { return { name:t.name, passed:false, error:e.message }; }
  });
  clearSourceRegistry();
  const passed = results.filter(r => r.passed).length;
  document.getElementById('summary').className = passed === results.length ? 'ok' : 'bad';
  document.getElementById('summary').textContent = `${passed}/${results.length} passed`;
  document.getElementById('out').textContent = JSON.stringify({ packet_type:'42ndMind_maturity_hard_fusion_test_report', test_version:'0.1.2', results }, null, 2);
</script>
</body>
</html>
