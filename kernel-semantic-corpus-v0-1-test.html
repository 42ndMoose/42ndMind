<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>42ndMind Semantic Corpus v0.1 Test</title>
  <style>
    body { margin:0; font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; background:#0f1115; color:#eef2ff; }
    header { padding:16px 18px; border-bottom:1px solid #2a3040; background:#11141b; }
    main { padding:12px; }
    section { background:#171a21; border:1px solid #2a3040; border-radius:10px; padding:12px; }
    h1 { font:700 19px/1.2 system-ui,-apple-system,Segoe UI,sans-serif; margin:0 0 4px; }
    pre { white-space:pre-wrap; background:#0d1016; border:1px solid #2a3040; border-radius:10px; padding:10px; overflow:auto; max-height:760px; }
    .ok { color:#9dffb4; } .bad { color:#ff8b8b; } a { color:#9db6ff; }
  </style>
</head>
<body>
<header><h1>42ndMind Semantic Corpus v0.1 Test</h1><div>Tests seed corpus schema, operator groups, observation-batch export, and bridge compatibility with the semantic invariant learner.</div></header>
<main><section><h2 id="summary">Running...</h2><div><a href="semantic-corpus-builder.html">semantic corpus builder</a> · <a href="kernel-semantic-invariant-review.html">semantic invariant review</a></div><pre id="out"></pre></section></main>
<script src="src/kernel-semantic-corpus-v0-1.js?v=0.1.0"></script>
<script src="src/kernel-semantic-invariant-learner-v0-4.js?v=0.4.0"></script>
<script>
  const tests = [];
  const TEST_KEY = '42ndMind_semantic_corpus_v0_1_test_invariants';
  let seedCorpus = null;
  function add(name, fn) { tests.push({ name, fn }); }
  function assert(cond, msg) { if (!cond) throw new Error(msg); }
  async function loadSeedForTest(){
    try { seedCorpus = await KernelSemanticCorpusV01.loadSeed(); }
    catch(e) { seedCorpus = { packet_type:'42ndMind_semantic_seed_corpus_v0_1', packet_version:'0.1.0', seed_load_error:e.message, entries:[KernelSemanticCorpusV01.sampleEntry('closure'), KernelSemanticCorpusV01.sampleEntry('authority')] }; }
  }

  add('module loads', () => {
    assert(window.KernelSemanticCorpusV01, 'KernelSemanticCorpusV01 missing');
    assert(KernelSemanticCorpusV01.VERSION === '0.1.0', 'wrong semantic corpus version');
    assert(KernelSemanticCorpusV01.PACKET_TYPE === '42ndMind_semantic_seed_corpus_v0_1', 'wrong packet type');
  });

  add('doctrine preserves no belief movement', () => {
    const d = KernelSemanticCorpusV01.doctrine();
    assert(d.corpus_entries_are_training_pressure_not_truth === true, 'training-pressure doctrine missing');
    assert(d.corpus_does_not_move_belief === true, 'no-belief doctrine missing');
    assert(d.corpus_does_not_patch_source === true, 'no-patch doctrine missing');
    assert(d.belief_movement === 'none', 'belief movement doctrine wrong');
  });

  add('sample entry validates', () => {
    const report = KernelSemanticCorpusV01.validateEntry(KernelSemanticCorpusV01.sampleEntry('closure'));
    assert(report.ok === true, 'sample entry should validate');
    assert(report.belief_movement === 'none', 'validation moved belief');
  });

  add('invalid entry is rejected', () => {
    const report = KernelSemanticCorpusV01.validateEntry({ id:'bad entry', text:'' });
    assert(report.ok === false, 'invalid entry should fail');
    assert(report.errors.length > 0, 'invalid entry should produce errors');
  });

  add('seed corpus loads with at least thirty entries on GitHub Pages', () => {
    if (seedCorpus.seed_load_error) return;
    assert(seedCorpus && Array.isArray(seedCorpus.entries), 'seed corpus missing entries');
    assert(seedCorpus.entries.length >= 30, 'seed corpus should contain at least 30 entries');
  });

  add('seed corpus validates cleanly', () => {
    const report = KernelSemanticCorpusV01.validateCorpus(seedCorpus);
    assert(report.ok === true, 'seed corpus did not validate: ' + JSON.stringify(report.errors));
    assert(report.entry_count === seedCorpus.entries.length, 'entry count mismatch');
    assert(report.valid_entry_count === seedCorpus.entries.length, 'valid count mismatch');
  });

  add('seed corpus includes all first operator groups when loaded', () => {
    if (seedCorpus.seed_load_error) return;
    const summary = KernelSemanticCorpusV01.summarize(seedCorpus);
    ['closure_dismissal','authority_transfer','reference_ambiguity','motive_agency','source_trust','evidence_contact','uncertainty_calibration','moral_risk_framing'].forEach(group => assert(summary.groups[group] >= 1, 'missing group ' + group));
  });

  add('closure/dismissal operators are present', () => {
    const summary = KernelSemanticCorpusV01.summarize(seedCorpus);
    assert(summary.operators.debunked >= 1 || summary.operators.disproven >= 1, 'closure operators missing');
    assert(summary.pressures.closure_pressure >= 1, 'closure pressure missing');
    assert(summary.pressures.dismissal_pressure >= 1, 'dismissal pressure missing');
  });

  add('authority-transfer operators are present', () => {
    const summary = KernelSemanticCorpusV01.summarize(seedCorpus);
    assert(summary.operators.certified >= 1 || summary.operators.expert >= 1, 'authority operators missing');
    assert(summary.pressures.authority_transfer_pressure >= 1, 'authority pressure missing');
    assert(summary.pressures.trust_inflation_pressure >= 1, 'trust inflation pressure missing');
  });

  add('reference ambiguity operators are present when loaded', () => {
    if (seedCorpus.seed_load_error) return;
    const summary = KernelSemanticCorpusV01.summarize(seedCorpus);
    assert(summary.operators.they >= 1 || summary.operators.this >= 1, 'reference operators missing');
    assert(summary.pressures.ambiguity_pressure >= 1, 'ambiguity pressure missing');
  });

  add('motive and agency operators are present when loaded', () => {
    if (seedCorpus.seed_load_error) return;
    const summary = KernelSemanticCorpusV01.summarize(seedCorpus);
    assert(summary.operators.coordinated >= 1 || summary.operators.agenda >= 1 || summary.operators.collusion >= 1, 'motive operators missing');
    assert(summary.pressures.motive_agency_pressure >= 1, 'motive pressure missing');
  });

  add('evidence-contact operators are present when loaded', () => {
    if (seedCorpus.seed_load_error) return;
    const summary = KernelSemanticCorpusV01.summarize(seedCorpus);
    assert(summary.operators.primary_document >= 1 || summary.operators.raw_data >= 1 || summary.operators.transcript >= 1, 'evidence operators missing');
    assert(summary.pressures.evidence_contact_pressure >= 1, 'evidence contact pressure missing');
  });

  add('expected responses preserve non-final movement', () => {
    const bad = seedCorpus.entries.filter(e => !/none|no_final|candidate|hold|bounded/i.test(String(e.expected_kernel_response && e.expected_kernel_response.belief_movement || '')));
    assert(bad.length === 0, 'entries with overstrong expected belief movement: ' + bad.map(e => e.id).join(','));
  });

  add('entriesByGroup returns closure rows', () => {
    const rows = KernelSemanticCorpusV01.entriesByGroup(seedCorpus, 'closure_dismissal');
    assert(rows.length >= 1, 'closure group missing');
    assert(rows.every(r => r.operator_group === 'closure_dismissal'), 'wrong group returned');
  });

  add('observation batch exports semantic learner-compatible packet', () => {
    const batch = KernelSemanticCorpusV01.toSemanticObservationBatch(seedCorpus);
    assert(batch.packet_type === '42ndMind_semantic_observation_batch_v0_4', 'wrong observation packet type');
    assert(batch.count > seedCorpus.entries.length, 'observation count should exceed entry count');
    assert(batch.term_observations.some(o => o.pressure === 'closure_pressure'), 'batch missing closure pressure');
    assert(batch.term_observations.some(o => o.legitimacy_condition), 'batch missing legitimacy condition');
    assert(batch.belief_movement === 'none', 'batch moved belief');
  });

  add('semantic invariant learner can record corpus observation batch', () => {
    KernelSemanticInvariantLearnerV04.clear(TEST_KEY);
    const batch = KernelSemanticCorpusV01.toSemanticObservationBatch(seedCorpus, { context_prefix:'semantic_corpus_test', outcome:'seed_labeled_pressure', confirmed:true });
    const result = KernelSemanticInvariantLearnerV04.record(batch, { key:TEST_KEY, min_observations:2 });
    assert(result.ok === true, 'semantic learner refused corpus batch');
    assert(result.recorded_count === batch.count, 'recorded count mismatch');
    assert(result.ledger.invariants.length > 0, 'no invariants learned from corpus');
    assert(result.belief_movement === 'none', 'recording moved belief');
  });

  add('stable proposals can be produced from repeated corpus operators', () => {
    const proposals = KernelSemanticInvariantLearnerV04.proposeStable(TEST_KEY);
    assert(proposals.count > 0, 'no stable proposals from corpus batch');
    assert(proposals.proposals.every(p => p.promotion_state.implemented === false), 'proposal should not be implemented');
    assert(proposals.belief_movement === 'none', 'proposal moved belief');
  });

  add('cleanup clears learner test ledger', () => {
    const cleared = KernelSemanticInvariantLearnerV04.clear(TEST_KEY);
    assert(cleared.ok === true, 'clear failed');
    assert(KernelSemanticInvariantLearnerV04.load(TEST_KEY).observations.length === 0, 'test ledger not cleared');
  });

  (async function run(){
    await loadSeedForTest();
    const results = [];
    for (const t of tests) {
      try { await t.fn(); results.push({ name:t.name, passed:true }); }
      catch(e) { results.push({ name:t.name, passed:false, error:e.message }); }
    }
    const passed = results.filter(r => r.passed).length;
    document.getElementById('summary').className = passed === results.length ? 'ok' : 'bad';
    document.getElementById('summary').textContent = `${passed}/${results.length} passed`;
    document.getElementById('out').textContent = JSON.stringify({ packet_type:'42ndMind_semantic_corpus_v0_1_test_report', seed_entry_count: seedCorpus && seedCorpus.entries ? seedCorpus.entries.length : 0, seed_load_error: seedCorpus && seedCorpus.seed_load_error || null, results }, null, 2);
  })();
</script>
</body>
</html>
