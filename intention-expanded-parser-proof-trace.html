<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>42ndMind Expanded Parser Proof Trace</title><style>body{margin:0;background:#0f1115;color:#eef2ff;font:14px ui-monospace,Menlo,Consolas,monospace}header{padding:16px 18px;background:#11141b;border-bottom:1px solid #2a3040}main{padding:12px;display:grid;grid-template-columns:470px 1fr;gap:12px}section{background:#171a21;border:1px solid #2a3040;border-radius:10px;padding:12px}button{background:#25345c;color:#eef2ff;border:1px solid #3f5592;padding:8px 10px;border-radius:8px;cursor:pointer;margin:3px 3px 8px 0}pre{white-space:pre-wrap;background:#0d1016;border:1px solid #2a3040;border-radius:10px;padding:10px;overflow:auto;max-height:760px}.ok{color:#9dffb4}.bad{color:#ff8b8b}.muted{color:#8b93a7}a{color:#9db6ff}.card{background:#10131a;border:1px solid #2a3040;border-radius:10px;padding:10px;margin:10px 0}.trace{border-top:1px solid #252b3a;padding:7px 0}.pill{display:inline-block;border:1px solid #2a3040;border-radius:999px;padding:1px 7px;margin:2px}.safe{color:#9dffb4}.warn{color:#ffd28b}@media(max-width:900px){main{grid-template-columns:1fr}}</style></head><body><header><h1>42ndMind Expanded Parser Proof Trace</h1><div class="muted">27 expanded parser rows become accepted formula traces or holdout traces. Candidate only.</div></header><main><section><a href="index.html">main</a> · <a href="intention-language-to-formula-expanded-benchmark-v0-1-2.html?v=parser-3">expanded benchmark v0.1.2</a> · <a href="kernel-intention-expanded-parser-proof-trace-v0-1-1-test.html?v=ptrace-2">test</a><p>Decision: <b id="decisionMetric">not run</b></p><p>Traces: <b id="traceMetric">0</b></p><p>Accepted traces: <b id="acceptedMetric">0</b></p><p>Holdout traces: <b id="holdoutMetric">0</b></p><button onclick="runTrace()">Run expanded traces</button><button onclick="showPacket()">Show packet</button><button onclick="showSummary()">Show summary</button><button onclick="copyOutput()">Copy output</button><div id="cards"></div></section><section><h2>Output</h2><pre id="out">No output yet.</pre></section></main><script src="src/kernel-intention-discovery-v0-1.js?v=intent-1"></script><script src="src/kernel-intention-refinement-v0-1.js?v=refine-1"></script><script src="src/kernel-intention-necessity-test-v0-1.js?v=necessity-1"></script><script src="src/kernel-intention-neighbor-lattice-v0-1.js?v=lattice-3"></script><script src="src/kernel-intention-lattice-invariance-benchmark-v0-1.js?v=invariance-2"></script><script src="src/kernel-intention-formula-compiler-v0-1.js?v=formula-1"></script><script src="src/kernel-intention-concept-expansion-loop-v0-1.js?v=expansion-2"></script><script src="src/kernel-intention-contradiction-refinement-loop-v0-1.js?v=contradiction-1"></script><script src="src/kernel-intention-formula-revision-engine-v0-1.js?v=revision-1"></script><script src="src/kernel-intention-canonical-formula-ledger-v0-1.js?v=ledger-1"></script><script src="src/kernel-intention-proof-output-v0-1.js?v=proof-1"></script><script src="src/kernel-intention-minimal-pair-library-v0-1.js?v=minpair-1"></script><script src="src/kernel-intention-dimension-splitting-v0-1.js?v=split-2"></script><script src="src/kernel-intention-coefficient-dimension-revision-engine-v0-1.js?v=codim-1"></script><script src="src/kernel-intention-canonical-formula-ledger-v0-1-1-patch.js?v=ledger-2"></script><script src="src/kernel-intention-arbitrary-language-parser-v0-1.js?v=parser-1"></script><script src="src/kernel-intention-arbitrary-language-parser-v0-1-1-patch.js?v=parser-3"></script><script src="src/kernel-intention-parser-proof-trace-v0-1.js?v=ptrace-1"></script><script src="src/kernel-intention-parser-proof-trace-v0-1-1-patch.js?v=ptrace-2"></script><script>let packet=null,last='';function esc(v){return String(v??'').replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]))}function arr(v){return Array.isArray(v)?v:[]}function setOut(v){last=typeof v==='string'?v:JSON.stringify(v,null,2);document.getElementById('out').textContent=last}function setMetrics(){const decisionEl=document.getElementById('decisionMetric');decisionEl.textContent=packet&&packet.ok?'EXPANDED_PARSER_PROOF_TRACE_READY':'HELD_FOR_REVIEW';decisionEl.className=packet&&packet.ok?'ok':'bad';document.getElementById('traceMetric').textContent=packet&&packet.trace_count||0;document.getElementById('acceptedMetric').textContent=packet&&packet.accepted_trace_count||0;document.getElementById('holdoutMetric').textContent=packet&&packet.holdout_trace_count||0}function runTrace(){try{packet=KernelIntentionParserProofTraceV011.runExpandedTrace();setMetrics();renderCards();showSummary()}catch(e){document.getElementById('decisionMetric').textContent='ERROR';document.getElementById('decisionMetric').className='bad';setOut({ok:false,error:e.message,belief_movement:'none'})}}function renderCards(){document.getElementById('cards').innerHTML=arr(packet&&packet.traces).map(t=>`<div class="card"><h3>${esc(t.trace_id)} · ${esc(t.trace_kind)}</h3><p><span class="pill ${t.trace_kind==='holdout_trace'?'warn':'safe'}">kind ${esc(t.trace_kind)}</span><span class="pill safe">status ${esc(t.parse_status)}</span><span class="pill safe">ambiguity ${esc(t.ambiguity_score)}</span><span class="pill safe">unresolved ${esc(t.unresolved_dimension_count)}</span></p><div class="muted">${esc(t.input_text)}</div><div class="trace"><b>Top:</b> ${esc(t.top_concept)}<br><b>Candidate:</b> ${esc(t.candidate_version||t.rejected_candidate_version||'none')}<br><b>Rejected:</b> ${esc(t.rejected_candidate||'none')}<br><b>Holdout:</b> ${esc(t.unmatched_holdout_applied||false)} ${esc(t.unmatched_holdout_reason||'')}<br><b>Proof:</b> ${esc(t.proof_reference&&t.proof_reference.proof_id||'none')}</div><pre>${esc(t.trace_text)}</pre></div>`).join('')||'No traces.'}function summary(){return{packet_type:'42ndMind_intention_expanded_parser_proof_trace_summary_view_v0_1_1',ok:packet&&packet.ok,source_expanded_parser_ok:packet&&packet.source_expanded_parser_ok,source_expanded_parser_parse_count:packet&&packet.source_expanded_parser_parse_count,source_ledger_ok:packet&&packet.source_ledger_ok,source_ledger_record_count:packet&&packet.source_ledger_record_count,source_proof_ok:packet&&packet.source_proof_ok,source_proof_count:packet&&packet.source_proof_count,trace_count:packet&&packet.trace_count,accepted_trace_count:packet&&packet.accepted_trace_count,holdout_trace_count:packet&&packet.holdout_trace_count,holdout_traces:arr(packet&&packet.traces).filter(t=>t.trace_kind==='holdout_trace').map(t=>({trace_id:t.trace_id,parse_id:t.parse_id,parse_status:t.parse_status,rejected_candidate:t.rejected_candidate,unmatched_holdout_applied:t.unmatched_holdout_applied,unmatched_holdout_reason:t.unmatched_holdout_reason,conclusion:t.conclusion,belief_movement:t.belief_movement})),validation:packet&&packet.validation,belief_movement:'none'}}function showSummary(){if(!packet)return runTrace();setOut(summary())}function showPacket(){if(!packet)return runTrace();setOut(packet)}async function copyOutput(){try{await navigator.clipboard.writeText(last);document.getElementById('out').textContent='Copied.\n\n'+last}catch(e){}}runTrace();</script></body></html>
