l.textContent=packet&&packet.ok?'OCTAHEDRON_LANGUAGE_ALIGNMENT_READY':'HELD_FOR_REVIEW';decisionEl.className=packet&&packet.ok?'ok':'bad';document.getElementById('formulaMetric').textContent=packet&&packet.source_inspection_count||0;document.getElementById('stateMetric').textContent=arr(packet&&packet.state_validations).length}function runAlignment(){try{packet=EpistemicOctahedronLanguageAlignmentV01.runAlignment();setMetrics();renderCards();showSummary()}catch(e){document.getElementById('decisionMetric').textContent='ERROR';document.getElementById('decisionMetric').className='bad';setOut({ok:false,error:e.message,belief_movement:'none'})}}function renderCards(){document.getElementById('cards').innerHTML=`<div class="card"><h3>Axis semantics</h3><pre>${esc(JSON.stringify(packet&&packet.axis_semantics,null,2))}</pre></div>`+arr(packet&&packet.state_validations).map(s=>`<div class="card"><h3>${esc(s.label||s.state_id)}</h3><p><span class="pill ${s.ok?'safe':'bad'}">ok ${esc(s.ok)}</span><span class="pill warn">L1 ${esc(s.l1_total)}</span><span class="pill safe">zone ${esc(s.zone)}</span></p><div class="state"><b>Point:</b> ${esc(JSON.stringify(s.point))}<br><b>Expected:</b> ${esc(s.expected_zone)}<br><b>Semantics:</b> ${esc(s.semantics)}</div></div>`).join('')}function summary(){return{packet_type:'42ndMind_epistemic_octahedron_language_alignment_summary_view_v0_1',ok:packet&&packet.ok,source_formula_inspector_ok:packet&&packet.source_formula_inspector_ok,source_inspection_count:packet&&packet.source_inspection_count,state_validations:arr(packet&&packet.state_validations).map(s=>({state_id:s.state_id,point:s.point,l1_total:s.l1_total,zone:s.zone,expected_zone:s.expected_zone,ok:s.ok})),kernel_compatibility:packet&&packet.kernel_compatibility,validation:packet&&packet.validation,belief_movement:'none'}}function showSummary(){if(!packet)return runAlignment();setOut(summary())}function showPacket(){if(!packet)return runAlignment();setOut(packet)}async function copyOutput(){try{await navigator.clipboard.writeText(last);document.getElementById('out').textContent='Copied.\n\n'+last}catch(e){}}runAlignment();</script></body></html>
