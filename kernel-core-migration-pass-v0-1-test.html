<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>42ndMind Core Migration Pass Test v0.1</title><style>body{margin:0;background:#0f1115;color:#eef2ff;font:14px ui-monospace,Menlo,Consolas,monospace}header{padding:16px;background:#11141b;border-bottom:1px solid #2a3040}main{padding:12px}section{background:#171a21;border:1px solid #2a3040;border-radius:10px;padding:12px}pre{white-space:pre-wrap;background:#0d1016;border:1px solid #2a3040;border-radius:10px;padding:10px;overflow:auto;max-height:780px}.ok{color:#9dffb4}.bad{color:#ff8b8b}a{color:#9db6ff}</style></head><body><header><h1>42ndMind Core Migration Pass Test v0.1</h1><div>Tests actual EpistemicKernel-owned methods, not standalone connectors.</div></header><main><section><h2 id="summary">Running...</h2><div><a href="llm-brain-v0-3.html?v=coremig-1">live brain</a></div><pre id="out"></pre></section></main><script src="src/epistemic-kernel-v0-2.js?v=corebase-1"></script><script src="src/epistemic-kernel-v0-2-patches.js?v=coremig-1"></script><script>const tests=[];let kernel=null;function add(n,f){tests.push({name:n,fn:f})}function assert(c,m){if(!c)throw new Error(m)}function arr(v){return Array.isArray(v)?v:[]}function core(){return kernel&&kernel.state&&kernel.state.unifiedCore}function refresh(){kernel.recalculate();return kernel.snapshot()}function events(){return arr(core()&&core().runtimeEvents)}function admissions(){return arr(core()&&core().admissionProposals)}function interpretations(){return arr(core()&&core().interpretations)}add('core migration patch loads on actual EpistemicKernel',()=>{assert(window.EpistemicKernel,'EpistemicKernel missing');assert(EpistemicKernel.__coreMigrationPassApplied===true,'core migration flag missing');assert(EpistemicKernel.__unifiedCorePatchApplied===true,'unified core flag missing');assert(EpistemicKernel.unifiedCorePatch&&EpistemicKernel.unifiedCorePatch.version==='0.4.1-core-migration-pass-1','patch version wrong');['ingest','interpret','relate','applyPressure','proposeAdmissions','unifiedTick','unifiedCoreSnapshot'].forEach(m=>assert(typeof EpistemicKernel.prototype[m]==='function',m+' missing'))});add('new kernel owns unifiedCore and doctrine says modules are views',()=>{kernel=new EpistemicKernel();assert(core(),'unifiedCore missing');assert(core().version==='epistemic_unified_core_v0_4_migration_pass_1','wrong core version');assert(core().doctrine.brain_owns_unified_core===true,'brain ownership doctrine missing');assert(core().doctrine.modules_are_views_not_thought_sources===true,'modules-as-views doctrine missing');assert(core().doctrine.meaning_claim_relation_pressure_admission_live_inside_kernel===true,'inside-kernel doctrine missing')});add('kernel.ingest runs interpret, relate, pressure, and admission inside unifiedCore',()=>{const e=kernel.ingest('teh source says the valve isnt opne because pressure rose, and I am sure it proves the claim',{source:'test_ingest'});refresh();assert(e&&e.kind==='core_ingest','ingest event wrong');assert(events().some(x=>x.id===e.id),'ingest event not in core');assert(interpretations().length>=3,'interpretations missing');assert(arr(e.candidate_packets).some(p=>p.type==='claim_candidate'),'claim packet missing');assert(arr(e.candidate_packets).some(p=>p.type==='source_reference'),'source packet missing');assert(arr(e.candidate_relation_edges).some(r=>r.relation_family==='source_reports'),'source relation missing');assert(arr(e.candidate_relation_edges).some(r=>r.relation_family==='causes_or_contributes_to'),'causal relation missing');assert(Number(core().pressureState.source)>0,'source pressure missing');assert(Number(core().pressureState.causal)>0,'causal pressure missing');assert(Number(core().pressureState.belief)>0,'belief pressure missing');assert(admissions().some(p=>p.proposal_family==='typo_variant_subdivision'),'typo admission missing');assert(admissions().some(p=>p.proposal_family==='claim_scope_subdivision'),'claim admission missing')});add('quickIngest uses the same core-owned path before old claim creation',()=>{kernel.quickIngest('A screenshot shows a warning, but the media is not verified.',{mode:'auto'});refresh();assert(events().some(e=>e.kind==='quick_ingest_raw'),'quick_ingest_raw event missing');assert(events().some(e=>arr(e.candidate_packets).some(p=>p.type==='media_description')),'media candidate packet missing');assert(events().some(e=>arr(e.unresolved_items).includes('media_description_not_verified_media')),'media unresolved guard missing');assert(Number(core().pressureState.media)>0,'media pressure missing')});add('addClaim and addEvidence write claim/evidence nodes and relation edges into same core',()=>{const c=kernel.addClaim({text:'A source record supports the safety claim.',scope:'claim',confidence:0.55,source:'test'});const ev=kernel.addEvidence({text:'Record log indicates the source was checked.',relation:'supports',claimId:c.id,strength:'moderate',confidence:0.7,source:'test'});refresh();assert(arr(core().claimNodes).some(n=>n.source_claim_id===c.id),'core claim node missing');assert(arr(core().evidenceNodes).some(n=>n.source_evidence_id===ev.id),'core evidence node missing');assert(arr(core().relationEdges).some(r=>r.from==='core_'+ev.id&&r.to==='core_'+c.id&&r.relation_family==='supports'),'support edge missing')});add('structured packet import writes through the same core',()=>{kernel.importExtractionPacket({packet_type:'epistemic_extraction_packet',claims:[{client_id:'c1',text:'The packet claim depends on a source anchor.',scope:'claim',confidence:0.5}],evidence:[{text:'source_link: Source A reports the packet record.',relation:'supports',target_client_id:'c1',strength:'moderate',confidence:0.7}],principles:[],dependencies:[],questions:[],observations:[],gate_events:[]});refresh();assert(events().some(e=>e.kind==='structured_packet_import'),'structured import event missing');assert(arr(core().claimNodes).some(n=>String(n.text||'').includes('packet claim')),'structured claim missing');assert(arr(core().evidenceNodes).some(n=>String(n.text||'').includes('source_link')),'structured evidence missing')});add('core graph and snapshot expose one owned organism state',()=>{const snap=kernel.snapshot();assert(snap.unifiedCore,'snapshot missing unifiedCore');assert(snap.unifiedCore.graph&&arr(snap.unifiedCore.graph.nodes).some(n=>n.id==='unified_core_root'),'graph root missing');assert(arr(snap.unifiedCore.graph.links).some(l=>l.from==='unified_core_root'),'owned graph links missing');assert(snap.unifiedCore.last_tick_summary&&snap.unifiedCore.last_tick_summary.doctrine.modules_are_views_not_thought_sources===true,'tick summary doctrine missing')});add('no standalone module decides truth/belief/canonical admission in this path',()=>{refresh();assert(admissions().length>=3,'admissions missing');assert(admissions().every(p=>p.status==='candidate_admission_not_canonical'&&p.canonical_mutation_performed===false&&p.belief_movement==='none'),'unsafe admission');assert(events().every(e=>e.truth_status==='not_adjudicated'&&e.promotion_status==='not_promoted'&&e.belief_movement==='none'),'unsafe event');assert(core().stats.belief_commitments===0,'belief commitment moved');assert(core().doctrine.no_final_truth_promotion===true,'truth promotion doctrine missing')});(async function run(){const results=[];for(const t of tests){try{await t.fn();results.push({name:t.name,passed:true})}catch(e){results.push({name:t.name,passed:false,error:e.message})}}const passed=results.filter(r=>r.passed).length;document.getElementById('summary').className=passed===tests.length?'ok':'bad';document.getElementById('summary').textContent=passed+'/'+tests.length+' passed';document.getElementById('out').textContent=JSON.stringify({packet_type:'42ndMind_core_migration_pass_v0_1_test_report',ok:passed===tests.length,patch_loaded:!!(window.EpistemicKernel&&EpistemicKernel.__coreMigrationPassApplied),unified_core_version:core()&&core().version,stats:core()&&core().stats,pressureState:core()&&core().pressureState,doctrine:core()&&core().doctrine,admissionProposals:core()&&core().admissionProposals,runtimeEvents:core()&&arr(core().runtimeEvents).map(e=>({id:e.id,kind:e.kind,raw_text:e.raw_text,signals:e.signals,packets:arr(e.candidate_packets).map(p=>p.type),relations:arr(e.candidate_relation_edges).map(r=>r.relation_family),unresolved_items:e.unresolved_items,truth_status:e.truth_status,promotion_status:e.promotion_status,belief_movement:e.belief_movement})),results},null,2)})();</script></body></html>
