<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>42ndMind Parser Proof Trace Test</title><style>body{margin:0;background:#0f1115;color:#eef2ff;font:14px ui-monospace,Menlo,Consolas,monospace}header{padding:16px;background:#11141b;border-bottom:1px solid #2a3040}main{padding:12px}section{background:#171a21;border:1px solid #2a3040;border-radius:10px;padding:12px}pre{white-space:pre-wrap;background:#0d1016;border:1px solid #2a3040;border-radius:10px;padding:10px;overflow:auto;max-height:760px}.ok{color:#9dffb4}.bad{color:#ff8b8b}a{color:#9db6ff}</style></head><body><header><h1>42ndMind Parser Proof Trace Test</h1><div>Tests parser result → readable proof-style formula translation trace. Candidate only.</div></header><main><section><h2 id="summary">Running...</h2><div><a href="intention-parser-proof-trace.html?v=ptrace-1">parser proof trace page</a></div><pre id="out"></pre></section></main><script src="src/kernel-intention-discovery-v0-1.js?v=intent-1"></script><script src="src/kernel-intention-refinement-v0-1.js?v=refine-1"></script><script src="src/kernel-intention-necessity-test-v0-1.js?v=necessity-1"></script><script src="src/kernel-intention-neighbor-lattice-v0-1.js?v=lattice-3"></script><script src="src/kernel-intention-lattice-invariance-benchmark-v0-1.js?v=invariance-2"></script><script src="src/kernel-intention-formula-compiler-v0-1.js?v=formula-1"></script><script src="src/kernel-intention-concept-expansion-loop-v0-1.js?v=expansion-2"></script><script src="src/kernel-intention-contradiction-refinement-loop-v0-1.js?v=contradiction-1"></script><script src="src/kernel-intention-formula-revision-engine-v0-1.js?v=revision-1"></script><script src="src/kernel-intention-canonical-formula-ledger-v0-1.js?v=ledger-1"></script><script src="src/kernel-intention-proof-output-v0-1.js?v=proof-1"></script><script src="src/kernel-intention-minimal-pair-library-v0-1.js?v=minpair-1"></script><script src="src/kernel-intention-dimension-splitting-v0-1.js?v=split-2"></script><script src="src/kernel-intention-coefficient-dimension-revision-engine-v0-1.js?v=codim-1"></script><script src="src/kernel-intention-canonical-formula-ledger-v0-1-1-patch.js?v=ledger-2"></script><script src="src/kernel-intention-arbitrary-language-parser-v0-1.js?v=parser-1"></script><script src="src/kernel-intention-parser-proof-trace-v0-1.js?v=ptrace-1"></script><script>const tests=[];let packet=null;function add(n,f){tests.push({name:n,fn:f})}function assert(c,m){if(!c)throw new Error(m)}function arr(v){return Array.isArray(v)?v:[]}function traces(){return arr(packet&&packet.traces)}add('modules load and doctrine is trace-only',()=>{assert(window.KernelIntentionParserProofTraceV01,'parser proof trace missing');assert(KernelIntentionParserProofTraceV01.VERSION==='0.1.0','version wrong');assert(typeof KernelIntentionParserProofTraceV01.runTrace==='function','runTrace missing');const d=KernelIntentionParserProofTraceV01.doctrine();assert(d.converts_parse_results_to_proof_traces===true,'trace doctrine missing');assert(d.trace_is_explanation_not_attribution===true,'attribution guard missing');assert(d.trace_is_candidate_not_doctrine===true,'candidate guard missing');assert(d.ambiguity_must_remain_visible===true,'ambiguity guard missing');assert(d.unresolved_dimensions_must_remain_visible===true,'unresolved guard missing');assert(d.belief_movement==='none','belief movement wrong')});add('trace runs from parser, ledger, and proof output',()=>{packet=KernelIntentionParserProofTraceV01.runTrace();assert(packet.ok===true,'packet not ok: '+JSON.stringify(packet.validation));assert(packet.source_parser_ok===true,'source parser not ok');assert(packet.source_parser_parse_count===12,'expected 12 parser rows');assert(packet.source_ledger_ok===true,'source ledger not ok');assert(packet.source_ledger_record_count===11,'expected 11 ledger records');assert(packet.source_proof_ok===true,'source proof not ok');assert(packet.source_proof_count===11,'expected 11 proofs')});add('twelve traces are produced',()=>{assert(packet.trace_count===12,'expected 12 traces');assert(traces().length===12,'expected 12 trace rows');assert(packet.validation.checks.twelve_traces===true,'twelve traces check failed')});add('every trace has v0003 formula snapshot and proof reference',()=>{traces().forEach(t=>{assert(t.candidate_version.includes('v0003_coefficient_dimension_revision'),t.trace_id+' not v0003');assert(t.formula_snapshot&&t.formula_snapshot.symbolic_formula,t.trace_id+' missing formula snapshot');assert(t.proof_reference&&t.proof_reference.proof_id,t.trace_id+' missing proof reference');assert(arr(t.proof_excerpt).length>0,t.trace_id+' missing proof excerpt')});assert(packet.validation.checks.every_trace_has_formula_snapshot===true,'formula snapshot check failed');assert(packet.validation.checks.every_trace_has_proof_reference===true,'proof reference check failed')});add('trace text exposes aliases, matched dimensions, unresolved dimensions, and ambiguity',()=>{traces().forEach(t=>{assert(t.trace_text.includes('Alias hits:'),t.trace_id+' missing alias line');assert(t.trace_text.includes('Matched dimensions:'),t.trace_id+' missing matched dimensions line');assert(t.trace_text.includes('Unresolved dimensions:'),t.trace_id+' missing unresolved dimensions line');assert(t.trace_text.includes('Ambiguity score:'),t.trace_id+' missing ambiguity line');assert(typeof t.ambiguity_score==='number',t.trace_id+' missing ambiguity score');assert(typeof t.unresolved_dimension_count==='number',t.trace_id+' missing unresolved count')});assert(packet.validation.checks.ambiguity_visible===true,'ambiguity check failed');assert(packet.validation.checks.unresolved_dimensions_visible===true,'unresolved check failed')});add('all L1 totals equal 1 and force remains outside shape',()=>{traces().forEach(t=>{assert(t.observed_l1_total===1,t.trace_id+' l1 wrong: '+t.observed_l1_total);assert(t.force_terms_outside_shape===true,t.trace_id+' force leaked')});assert(packet.validation.checks.all_l1_totals_equal_1===true,'l1 check failed');assert(packet.validation.checks.force_terms_outside_shape===true,'force check failed')});add('candidate-only status and belief movement are preserved',()=>{traces().forEach(t=>{assert(t.promotion_status==='not_promoted',t.trace_id+' promoted');assert(t.doctrine_status==='candidate_not_doctrine',t.trace_id+' doctrine status wrong');assert(t.belief_movement==='none',t.trace_id+' moved belief')});assert(packet.validation.checks.candidate_only_not_promoted===true,'candidate-only check failed');assert(packet.validation.checks.belief_movement_none===true,'belief movement check failed')});add('validation report is clean',()=>{assert(packet.validation&&packet.validation.ok===true,'validation not ok');assert(arr(packet.validation.errors).length===0,'validation errors present: '+packet.validation.errors.join(','));arr(packet.validation.trace_validations).forEach(v=>{assert(v.ok===true,v.trace_id+' validation failed: '+v.errors.join(','));assert(v.candidate_version.includes('v0003'),v.trace_id+' validation not v0003');assert(v.observed_l1_total===1,v.trace_id+' validation l1 wrong');assert(v.force_terms_outside_shape===true,v.trace_id+' validation force wrong');assert(v.belief_movement==='none',v.trace_id+' validation moved belief')})});(async function run(){const results=[];for(const t of tests){try{await t.fn();results.push({name:t.name,passed:true})}catch(e){results.push({name:t.name,passed:false,error:e.message})}}const passed=results.filter(r=>r.passed).length;document.getElementById('summary').className=passed===tests.length?'ok':'bad';document.getElementById('summary').textContent=passed+'/'+tests.length+' passed';document.getElementById('out').textContent=JSON.stringify({packet_type:'42ndMind_intention_parser_proof_trace_test_report_v0_1',ok:passed===tests.length,source_parser_parse_count:packet&&packet.source_parser_parse_count,source_ledger_record_count:packet&&packet.source_ledger_record_count,source_proof_count:packet&&packet.source_proof_count,trace_count:packet&&packet.trace_count,traces:traces().map(t=>({trace_id:t.trace_id,parse_status:t.parse_status,top_concept:t.top_concept,candidate_version:t.candidate_version,ambiguity_score:t.ambiguity_score,unresolved_dimension_count:t.unresolved_dimension_count,observed_l1_total:t.observed_l1_total,force_terms_outside_shape:t.force_terms_outside_shape,promotion_status:t.promotion_status,belief_movement:t.belief_movement})),validation:packet&&packet.validation,results},null,2)})();</script></body></html>
