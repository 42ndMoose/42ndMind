<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>42ndMind Shape Observation Review Test</title>
  <style>
    body{margin:0;font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:#0f1115;color:#eef2ff}
    header{padding:16px 18px;border-bottom:1px solid #2a3040;background:#11141b}
    main{padding:12px}section{background:#171a21;border:1px solid #2a3040;border-radius:10px;padding:12px}
    h1{font:700 19px/1.2 system-ui,-apple-system,Segoe UI,sans-serif;margin:0 0 4px}
    pre{white-space:pre-wrap;background:#0d1016;border:1px solid #2a3040;border-radius:10px;padding:10px;overflow:auto;max-height:760px}.ok{color:#9dffb4}.bad{color:#ff8b8b}a{color:#9db6ff}
  </style>
</head>
<body>
<header><h1>42ndMind Shape Observation Review Test</h1><div>Tests the review gate before unit-total shape observations become seed pressure.</div></header>
<main><section><h2 id="summary">Running...</h2><div><a href="objective-language-shape-observation-review.html">shape observation review page</a> · <a href="objective-language-shape-bridge.html">shape bridge page</a></div><pre id="out"></pre></section></main>
<script src="src/kernel-semantic-corpus-v0-1.js?v=0.1.0"></script>
<script src="src/kernel-semantic-corpus-combiner-v0-1.js?v=unit-total-1"></script>
<script src="src/kernel-semantic-pressure-registry-v0-1.js?v=0.1.0"></script>
<script src="src/kernel-semantic-pressure-registry-v0-1-1-patch.js?v=status-neg-1"></script>
<script src="src/kernel-semantic-vector-compressor-v0-1.js?v=0.1.0"></script>
<script src="src/kernel-unit-total-nested-shape-v0-1.js?v=0.1.0"></script>
<script src="src/kernel-objective-language-shape-bridge-v0-1.js?v=0.1.0"></script>
<script src="src/kernel-objective-language-shape-observation-review-v0-1.js?v=0.1.0"></script>
<script>
  const tests=[]; let packet=null, review=null, seed=null;
  function add(name,fn){tests.push({name,fn});}
  function assert(cond,msg){if(!cond)throw new Error(msg);}
  function asArray(v){return Array.isArray(v)?v:[];}

  add('modules load',()=>{
    assert(window.KernelObjectiveLanguageShapeBridgeV01,'shape bridge missing');
    assert(window.KernelObjectiveLanguageShapeObservationReviewV01,'shape review missing');
    assert(KernelObjectiveLanguageShapeObservationReviewV01.VERSION==='0.1.0','review version wrong');
  });

  add('doctrine preserves review gate and no belief movement',()=>{
    const d=KernelObjectiveLanguageShapeObservationReviewV01.doctrine();
    assert(d.shape_observations_are_review_inputs_not_doctrine===true,'review input doctrine missing');
    assert(d.repeated_anonymous_shapes_are_structure_candidates_not_truth===true,'structure candidate doctrine missing');
    assert(d.reviewed_seed_packet_is_training_pressure_not_doctrine===true,'seed pressure doctrine missing');
    assert(d.do_not_import_seed_packet_without_browser_tests===true,'review gate import guard doctrine missing');
    assert(d.belief_movement==='none','belief movement wrong');
  });

  add('load bridge review and draft seed succeeds',async()=>{
    packet=await KernelObjectiveLanguageShapeObservationReviewV01.loadBridgeReviewAndDraftSeed({basis:'pressure',min_observations:2,min_repetition:2,max_entries:12});
    review=packet.review_report;
    seed=packet.seed_packet_draft;
    assert(packet.ok===true,'review packet not ok');
    assert(packet.bridge_packet.ok===true,'bridge packet not ok');
    assert(packet.bridge_packet.bridge_report.projected_count===146,'expected 146 projections');
    assert(review.source_observation_count===146,'expected 146 source observations');
    assert(review.accepted_candidate_count>=1,'expected accepted repeated structure candidates');
    assert(seed.entries.length>=1,'expected draft seed entries');
    assert(packet.belief_movement==='none','packet moved belief');
  });

  add('review candidates require repeated valid unit-total structure',()=>{
    const first=review.accepted_candidates[0];
    assert(first.review_status==='reviewed_repeated_structure_candidate','wrong candidate status');
    assert(first.repeated_observation_count>=2,'candidate not repeated');
    assert(first.checks.repeated_enough===true,'repeat check failed');
    assert(first.checks.root_l1_equals_one===true,'root L1 check failed');
    assert(first.checks.flattened_l1_equals_one===true,'flattened L1 check failed');
    assert(first.checks.labels_metadata_only===true,'label metadata check failed');
    assert(first.belief_movement==='none','candidate moved belief');
  });

  add('seed packet draft is training pressure only',()=>{
    assert(seed.packet_type==='42ndMind_semantic_seed_corpus_v0_1_extension','wrong seed packet type');
    assert(seed.doctrine.reviewed_seed_packet_is_training_pressure_not_doctrine===true,'training pressure doctrine missing');
    assert(seed.source_review_summary.import_status==='not_added_to_default_combiner_until_browser_tests_pass','review-gate draft import guard missing');
    assert(seed.entries.every(e=>e.review_status==='reviewed_seed_candidate'),'seed entries not reviewed candidates');
    assert(seed.entries.every(e=>e.expected_kernel_response&&e.expected_kernel_response.belief_movement==='none_from_shape_structure_alone'),'seed movement guard missing');
    assert(seed.belief_movement==='none','seed packet moved belief');
  });

  add('seed entries expose unit-total operators',()=>{
    const ops=seed.entries.flatMap(e=>asArray(e.semantic_operators).map(op=>op.operator));
    assert(ops.includes('unit_total_shape_projection(semantic_vector)'),'unit_total_shape_projection operator missing');
    assert(ops.includes('anonymous_shape_repetition(shape_signature)'),'anonymous_shape_repetition operator missing');
    seed.entries.forEach(entry=>{
      const pressures=entry.semantic_operators.flatMap(op=>asArray(op.pressure));
      assert(pressures.includes('unit_total_refinement_pressure'),'unit_total_refinement_pressure missing');
    });
  });

  add('grouping by anonymous signature works',()=>{
    const groups=KernelObjectiveLanguageShapeObservationReviewV01.groupBySignature(packet.bridge_packet);
    assert(groups.length===review.anonymous_signature_count,'group count mismatch');
    assert(groups.some(g=>g.observations.length>=2),'expected repeated group');
  });

  add('held synthetic one-off candidate does not pass',()=>{
    const held=KernelObjectiveLanguageShapeObservationReviewV01.reviewGroup({signature:'synthetic_one_off',observations:[{anonymous_shape_signature:'synthetic_one_off',root_l1:1,flattened_l1:1,leaf_dimension_count:1,basis:'pressure'}],projections:[]},{min_repetition:2});
    assert(held.review_status==='hold_for_more_evidence','one-off should be held');
    assert(held.checks.repeated_enough===false,'one-off repeat check should fail');
  });

  (async function run(){
    const results=[];
    for(const t of tests){try{await t.fn();results.push({name:t.name,passed:true});}catch(e){results.push({name:t.name,passed:false,error:e.message});}}
    const passed=results.filter(r=>r.passed).length;
    document.getElementById('summary').className=passed===tests.length?'ok':'bad';
    document.getElementById('summary').textContent=`${passed}/${tests.length} passed`;
    document.getElementById('out').textContent=JSON.stringify({
      packet_type:'42ndMind_shape_observation_review_v0_1_test_report',
      source_observation_count:review&&review.source_observation_count,
      anonymous_signature_count:review&&review.anonymous_signature_count,
      accepted_candidate_count:review&&review.accepted_candidate_count,
      draft_seed_entry_count:seed&&seed.entries&&seed.entries.length,
      results
    },null,2);
  })();
</script>
</body>
</html>
