<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>42ndMind Intention Discovery</title><style>body{margin:0;background:#0f1115;color:#eef2ff;font:14px ui-monospace,Menlo,Consolas,monospace}header{padding:16px 18px;background:#11141b;border-bottom:1px solid #2a3040}main{padding:12px;display:grid;grid-template-columns:380px 1fr;gap:12px}section{background:#171a21;border:1px solid #2a3040;border-radius:10px;padding:12px}button{background:#25345c;color:#eef2ff;border:1px solid #3f5592;padding:8px 10px;border-radius:8px;cursor:pointer;margin:3px 3px 8px 0}pre{white-space:pre-wrap;background:#0d1016;border:1px solid #2a3040;border-radius:10px;padding:10px;overflow:auto;max-height:760px}.ok{color:#9dffb4}.bad{color:#ff8b8b}.muted{color:#8b93a7}a{color:#9db6ff}.card{background:#10131a;border:1px solid #2a3040;border-radius:10px;padding:10px;margin:10px 0}.dim{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #252b3a;padding:3px 0}.dim:last-child{border-bottom:0}@media(max-width:900px){main{grid-template-columns:1fr}}</style></head><body><header><h1>42ndMind Intention Discovery</h1><div class="muted">Discovers candidate mathematical intention concept-shapes. Not doctrine. No real-world intent attribution.</div></header><main><section><a href="index.html">main</a> · <a href="kernel-intention-discovery-v0-1-test.html?v=intent-2">test</a><p>Decision: <b id="decisionMetric">not run</b></p><p>Concepts: <b id="conceptCount">0</b></p><button onclick="runDiscovery()">Run discovery</button><button onclick="showPacket()">Show packet</button><button onclick="showSummary()">Show summary</button><button onclick="copyOutput()">Copy output</button><div id="cards"></div></section><section><h2>Output</h2><pre id="out">No output yet.</pre></section></main><script src="src/kernel-intention-discovery-v0-1.js?v=intent-1"></script><script>let packet=null,last='';function esc(v){return String(v??'').replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]))}function setOut(v){last=typeof v==='string'?v:JSON.stringify(v,null,2);document.getElementById('out').textContent=last}function runDiscovery(){const decisionEl=document.getElementById('decisionMetric');const countEl=document.getElementById('conceptCount');try{packet=KernelIntentionDiscoveryV01.runDiscovery();decisionEl.textContent=packet.ok?'DISCOVERY_READY':'HELD';decisionEl.className=packet.ok?'ok':'bad';countEl.textContent=packet.candidate_count;renderCards();showSummary()}catch(e){decisionEl.textContent='ERROR';decisionEl.className='bad';setOut({ok:false,error:e.message,belief_movement:'none'})}}function renderCards(){document.getElementById('cards').innerHTML=(packet&&packet.candidates||[]).map(c=>`<div class="card"><h3>${esc(c.concept)} · ${esc(c.review_status)}</h3><p class="muted">${esc(c.question)}</p><pre>${esc(c.symbolic_formula)}</pre>${Object.entries(c.normalized_shape.shape).map(([k,v])=>`<div class="dim"><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join('')}<p>force: ${esc(c.force_dimensions.map(x=>x.name).join(', '))}</p><p>contrasts: ${esc(c.contrast_concepts.join(', '))}</p></div>`).join('')||'No concepts.'}function summary(){return{packet_type:'42ndMind_intention_discovery_summary_view_v0_1',ok:packet&&packet.ok,concept_count:packet&&packet.candidate_count,concepts:(packet&&packet.candidates||[]).map(c=>({concept:c.concept,l1_total:c.normalized_shape.l1_total,shape:c.normalized_shape.shape,force_dimensions:c.force_dimensions.map(x=>x.name),contrast_count:c.contrast_concepts.length,minimal_pair_count:c.minimal_pairs.length,review_status:c.review_status,symbolic_formula:c.symbolic_formula})),validation:packet&&packet.validation,belief_movement:'none'}}function showSummary(){if(!packet)return runDiscovery();setOut(summary())}function showPacket(){if(!packet)return runDiscovery();setOut(packet)}async function copyOutput(){try{await navigator.clipboard.writeText(last);document.getElementById('out').textContent='Copied.\n\n'+last}catch(e){}}runDiscovery();</script></body></html>
