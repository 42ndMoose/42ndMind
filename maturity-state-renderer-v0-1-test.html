<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>42ndMind Maturity State Renderer Test v0.1</title><style>body{margin:0;background:#0f1115;color:#eef2ff;font:14px ui-monospace,Menlo,Consolas,monospace}header{padding:16px;background:#11141b;border-bottom:1px solid #2a3040}main{padding:12px}section{background:#171a21;border:1px solid #2a3040;border-radius:10px;padding:12px}pre{white-space:pre-wrap;background:#0d1016;border:1px solid #2a3040;border-radius:10px;padding:10px;overflow:auto;max-height:780px}.ok{color:#9dffb4}.bad{color:#ff8b8b}a{color:#9db6ff}</style></head><body><header><h1>42ndMind Maturity State Renderer Test v0.1</h1><div>Tests deterministic readable rendering over owned shared kernel state.</div></header><main><section><h2 id="summary">Running...</h2><pre id="out"></pre></section></main><script src="src/epistemic-kernel-v0-2.js?v=corebase-1"></script><script src="src/epistemic-kernel-v0-2-patches.js?v=coremig-1"></script><script src="src/kernel-brain-v0-4.js?v=brain-2"></script><script src="src/kernel-brain-epistemic-kernel-bridge-v0-1.js?v=bridge-2"></script><script src="src/epistemic-kernel-maturity-core-v0-1.js?v=maturity-2"></script><script src="src/maturity-state-renderer-v0-1.js?v=renderer-1"></script><script>const tests=[];let kernel=null,binding=null,boundBrain=null,event=null,report=null;function add(n,f){tests.push({name:n,fn:f})}function assert(c,m){if(!c)throw new Error(m)}function arr(v){return Array.isArray(v)?v:[]}function shared(){return kernel&&kernel.state&&kernel.state.unifiedCore}add('renderer and live maturity stack load',()=>{assert(window.MaturityStateRendererV01,'renderer missing');assert(MaturityStateRendererV01.VERSION==='0.1.0','renderer version wrong');assert(window.EpistemicKernelObjectiveMaturityCoreV01,'maturity core missing');assert(window.KernelBrainEpistemicKernelBridgeV01,'bridge missing')});add('renderer reads shared state after raw ingest',()=>{kernel=new EpistemicKernel();binding=KernelBrainEpistemicKernelBridgeV01.bind(kernel);boundBrain=binding.bound_brain;event=boundBrain.ingest('The source says the claim is definitely proven, but the screenshot is not verified and context is unresolved.',{kind:'renderer_test'});boundBrain.refreshObjectiveMaturityCore('renderer_test_refresh');report=MaturityStateRendererV01.render(shared(),{event});assert(report.ok===true,'renderer report not ok');assert(report.renderer_only===true,'renderer_only missing');assert(report.thought_source==='owned_shared_kernel_state','wrong thought source')});add('renderer explains event packets and relation families',()=>{assert(report.event_summary.candidate_packets.includes('claim_candidate'),'claim candidate missing');assert(report.event_summary.candidate_packets.includes('source_reference'),'source reference missing');assert(report.event_summary.candidate_packets.includes('media_description'),'media description missing');assert(report.event_summary.relation_families.includes('source_reports'),'source relation missing');assert(report.readable_markdown.includes('possible claim candidate'),'claim explanation missing');assert(report.readable_markdown.includes('media-like wording'),'media explanation missing')});add('renderer exposes peak identity conditions',()=>{assert(report.identity_summary.wants_peak===true,'wants peak false');assert(report.identity_summary.aims_at_peak===true,'aims peak false');assert(report.identity_summary.stays_at_peak===true,'stays peak false');assert(report.identity_summary.all_identity_conditions_met===true,'identity conditions not all met');assert(report.identity_summary.conditions.length>=8,'conditions too few');assert(report.readable_markdown.includes('PASS: core philosophy'),'identity condition prose missing')});add('renderer explains pressure and maturity response',()=>{assert(report.pressure_read.some(line=>line.includes('belief')),'belief pressure explanation missing');assert(report.pressure_read.some(line=>line.includes('source')),'source pressure explanation missing');assert(report.maturity_summary.peak_alignment_score<1,'alignment did not show pressure');assert(report.maturity_summary.recovery_to_peak_required===true,'recovery not required');assert(report.readable_markdown.includes('Recovery action: separate_confidence_from_truth'),'recovery prose missing')});add('renderer does not promote truth or move belief',()=>{assert(report.final_authority===false,'final authority true');assert(report.truth_status==='not_adjudicated','truth adjudicated');assert(report.promotion_status==='not_promoted','promoted');assert(report.belief_movement==='none','belief moved');assert(shared().beliefCommitments.length===0,'belief commitments present')});add('renderer can explain hostile reframe pressure',()=>{const e2=boundBrain.ingest('Someone says limited voting depends on a condition, but the hostile reframe turns it into all women should never vote.',{kind:'renderer_reframe'});boundBrain.refreshObjectiveMaturityCore('renderer_reframe_refresh');const r2=MaturityStateRendererV01.render(shared(),{event:e2});assert(r2.readable_markdown.includes('adversarial reframe pressure')||r2.readable_markdown.includes('scope-changing pressure'),'reframe explanation missing');assert(r2.maturity_summary.recovery_actions.includes('preserve_scope_and_refuse_hostile_reframe_equivalence'),'reframe recovery action missing')});add('renderer output is JSON-safe and markdown readable',()=>{const json=JSON.stringify(report);assert(json.includes('42ndMind_maturity_state_renderer_v0_1_report'),'packet type missing');assert(report.readable_markdown.split('\n').length>15,'markdown too short');assert(report.readable_markdown.includes('This renderer does not make truth claims'),'discipline prose missing')});(async function run(){const results=[];for(const t of tests){try{await t.fn();results.push({name:t.name,passed:true})}catch(e){results.push({name:t.name,passed:false,error:e.message})}}const passed=results.filter(r=>r.passed).length;document.getElementById('summary').className=passed===tests.length?'ok':'bad';document.getElementById('summary').textContent=passed+'/'+tests.length+' passed';document.getElementById('out').textContent=JSON.stringify({packet_type:'42ndMind_maturity_state_renderer_v0_1_test_report',ok:passed===tests.length,renderer_version:window.MaturityStateRendererV01&&MaturityStateRendererV01.VERSION,report,results},null,2)})();</script></body></html>
