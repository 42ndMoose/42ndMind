<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>42ndMind Objective Claim Trace Test v0.1</title><style>body{margin:0;background:#0f1115;color:#eef2ff;font:14px ui-monospace,Menlo,Consolas,monospace}header{padding:16px;background:#11141b;border-bottom:1px solid #2a3040}main{padding:12px}section{background:#171a21;border:1px solid #2a3040;border-radius:10px;padding:12px}pre{white-space:pre-wrap;background:#0d1016;border:1px solid #2a3040;border-radius:10px;padding:10px;overflow:auto;max-height:760px}.ok{color:#9dffb4}.bad{color:#ff8b8b}a{color:#9db6ff}</style></head><body><header><h1>42ndMind Objective Claim Trace Test v0.1</h1><div>Proof-style traces for deterministic objective claim-language outputs. No LLM. No source lookup.</div></header><main><section><h2 id="summary">Running...</h2><div><a href="objective-claim-trace.html?v=ctrace-1">objective claim trace page</a></div><pre id="out"></pre></section></main><script src="src/kernel-objective-claim-language-v0-1.js?v=claim-1"></script><script src="src/kernel-objective-claim-language-v0-1-1-patch.js?v=claim-2"></script><script src="src/kernel-objective-claim-trace-v0-1.js?v=ctrace-1"></script><script>const tests=[];let packet=null;function add(n,f){tests.push({name:n,fn:f})}function assert(c,m){if(!c)throw new Error(m)}function arr(v){return Array.isArray(v)?v:[]}function traces(){return arr(packet&&packet.traces)}function kinds(){return traces().map(t=>t.trace_kind)}function byKind(k){return traces().filter(t=>t.trace_kind===k)}function byClaim(id){return traces().find(t=>t.claim_id===id)}add('modules load and doctrine is claim-trace only',()=>{assert(window.KernelObjectiveClaimLanguageV011,'claim-language v0.1.1 missing');assert(window.KernelObjectiveClaimTraceV01,'claim trace module missing');assert(KernelObjectiveClaimTraceV01.VERSION==='0.1.0','trace version wrong');assert(typeof KernelObjectiveClaimTraceV01.runClaimTrace==='function','runClaimTrace missing');const d=KernelObjectiveClaimTraceV01.doctrine();assert(d.traces_claim_language_outputs_as_proof_style_records===true,'trace doctrine missing');assert(d.user_supplied_context_is_not_auto_truth===true,'auto-truth guard missing');assert(d.contradiction_detection_is_not_contradiction_resolution===true,'contradiction guard missing');assert(d.narrative_pressure_is_not_hidden_motive_proof===true,'narrative guard missing');assert(d.no_llm===true,'no LLM doctrine missing');assert(d.no_source_lookup===true,'no lookup doctrine missing');assert(d.belief_movement==='none','belief movement wrong')});add('claim trace runs from patched claim-language v0.1.1',()=>{packet=KernelObjectiveClaimTraceV01.runClaimTrace();assert(packet.ok===true,'packet not ok: '+JSON.stringify(packet.validation));assert(packet.source_claim_language_ok===true,'source claim language not ok');assert(packet.source_claim_language_version==='0.1.1','source version not v0.1.1: '+packet.source_claim_language_version);assert(packet.source_claim_count===8,'expected 8 source claims');assert(packet.trace_count===8,'expected 8 traces');assert(packet.llm_used===false,'packet used LLM');assert(packet.external_lookup_performed===false,'packet performed lookup');assert(packet.belief_movement==='none','packet moved belief')});add('all eight trace kinds are present',()=>{['evidence_supported_trace','unsupported_unresolved_trace','contradiction_pressure_trace','narrative_overclaim_trace','propaganda_pressure_trace','corroboration_trace','causal_overclaim_trace','ambiguous_unresolved_trace'].forEach(k=>assert(kinds().includes(k),'missing '+k));assert(packet.validation.checks.eight_claim_traces===true,'eight trace check failed');assert(packet.validation.checks.evidence_supported_trace_present===true,'evidence trace check failed');assert(packet.validation.checks.unsupported_unresolved_trace_present===true,'unsupported trace check failed');assert(packet.validation.checks.contradiction_pressure_trace_present===true,'contradiction trace check failed');assert(packet.validation.checks.narrative_overclaim_trace_present===true,'narrative trace check failed');assert(packet.validation.checks.propaganda_pressure_trace_present===true,'propaganda trace check failed');assert(packet.validation.checks.corroboration_trace_present===true,'corroboration trace check failed');assert(packet.validation.checks.causal_overclaim_trace_present===true,'causal trace check failed');assert(packet.validation.checks.ambiguous_unresolved_trace_present===true,'ambiguity trace check failed')});add('trace text explains scores, dependencies, and candidate conclusion',()=>{traces().forEach(t=>{assert(t.trace_text&&t.trace_text.length>80,t.trace_id+' trace too short');['Claim kind:','Truth-status candidate:','Support score:','Counter score:','Contradiction rule:','Narrative rule:','Dependencies:','Conclusion:','Belief movement: none'].forEach(marker=>assert(t.trace_text.includes(marker),t.trace_id+' missing '+marker));assert(t.dependency_count>=1,t.trace_id+' missing dependencies')});assert(packet.validation.checks.all_trace_text_present===true,'trace text check failed')});add('special pressure traces include their specific rule lines',()=>{assert(byKind('causal_overclaim_trace')[0].trace_text.includes('Causal rule:'),'causal rule missing');assert(byKind('narrative_overclaim_trace')[0].trace_text.includes('Motive rule:'),'motive rule missing');assert(byKind('propaganda_pressure_trace')[0].trace_text.includes('Propaganda rule:'),'propaganda rule missing');assert(byKind('ambiguous_unresolved_trace')[0].trace_text.includes('Ambiguity rule:'),'ambiguity rule missing');const motive=byClaim('claim_motive_overclaim_001');assert(motive.claim_kind==='motive_attribution_claim','motive claim kind not patched');assert(arr(motive.dependencies).some(d=>d.dependency_type==='motive_evidence_required'),'motive dependency missing')});add('user context is not auto-truth and contradiction is not resolved',()=>{traces().forEach(t=>{assert(t.user_context_not_auto_truth===true,t.trace_id+' auto-truth risk');assert(t.contradiction_not_resolved===true,t.trace_id+' contradiction resolved');assert(t.hidden_motive_not_decided===true,t.trace_id+' hidden motive decided')});assert(packet.validation.checks.user_context_not_auto_truth===true,'auto-truth check failed');assert(packet.validation.checks.contradiction_detection_not_resolution===true,'contradiction no-resolution check failed');assert(packet.validation.checks.narrative_pressure_not_motive_proof===true,'narrative no-motive-proof check failed')});add('no LLM, no source lookup, and candidate-only status are preserved',()=>{traces().forEach(t=>{assert(t.llm_used===false,t.trace_id+' used LLM');assert(t.external_lookup_performed===false,t.trace_id+' performed lookup');assert(t.promotion_status==='not_promoted',t.trace_id+' promoted');assert(t.doctrine_status==='candidate_not_doctrine',t.trace_id+' doctrine status wrong');assert(t.belief_movement==='none',t.trace_id+' moved belief')});assert(packet.validation.checks.no_llm_used===true,'no LLM check failed');assert(packet.validation.checks.no_external_lookup===true,'no lookup check failed');assert(packet.validation.checks.candidate_only_not_promoted===true,'candidate-only check failed')});add('validation report is clean',()=>{assert(packet.validation&&packet.validation.ok===true,'validation not ok');assert(packet.validation.checks.all_expected_statuses_preserved===true,'expected status preservation failed');assert(packet.validation.checks.belief_movement_none===true,'belief movement check failed');assert(arr(packet.validation.errors).length===0,'validation errors present: '+packet.validation.errors.join(','))});(async function run(){const results=[];for(const t of tests){try{await t.fn();results.push({name:t.name,passed:true})}catch(e){results.push({name:t.name,passed:false,error:e.message})}}const passed=results.filter(r=>r.passed).length;document.getElementById('summary').className=passed===tests.length?'ok':'bad';document.getElementById('summary').textContent=passed+'/'+tests.length+' passed';document.getElementById('out').textContent=JSON.stringify({packet_type:'42ndMind_objective_claim_trace_test_report_v0_1',ok:passed===tests.length,source_claim_language_version:packet&&packet.source_claim_language_version,source_claim_count:packet&&packet.source_claim_count,trace_count:packet&&packet.trace_count,traces:traces().map(t=>({trace_id:t.trace_id,claim_id:t.claim_id,trace_kind:t.trace_kind,claim_kind:t.claim_kind,truth_status_candidate:t.truth_status_candidate,dependency_count:t.dependency_count,user_context_not_auto_truth:t.user_context_not_auto_truth,contradiction_not_resolved:t.contradiction_not_resolved,hidden_motive_not_decided:t.hidden_motive_not_decided,llm_used:t.llm_used,external_lookup_performed:t.external_lookup_performed,belief_movement:t.belief_movement})),validation:packet&&packet.validation,results},null,2)})();</script></body></html>
