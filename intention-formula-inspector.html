<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>42ndMind Intention Formula Inspector</title><style>body{margin:0;background:#0f1115;color:#eef2ff;font:14px ui-monospace,Menlo,Consolas,monospace}header{padding:16px 18px;background:#11141b;border-bottom:1px solid #2a3040}main{padding:12px;display:grid;grid-template-columns:470px 1fr;gap:12px}section{background:#171a21;border:1px solid #2a3040;border-radius:10px;padding:12px}select,button{background:#25345c;color:#eef2ff;border:1px solid #3f5592;padding:8px 10px;border-radius:8px;cursor:pointer;margin:3px 3px 8px 0}select{width:100%;box-sizing:border-box}pre{white-space:pre-wrap;background:#0d1016;border:1px solid #2a3040;border-radius:10px;padding:10px;overflow:auto;max-height:760px}.ok{color:#9dffb4}.bad{color:#ff8b8b}.muted{color:#8b93a7}a{color:#9db6ff}.card{background:#10131a;border:1px solid #2a3040;border-radius:10px;padding:10px;margin:10px 0}.version{border-top:1px solid #252b3a;padding:7px 0}.pill{display:inline-block;border:1px solid #2a3040;border-radius:999px;padding:1px 7px;margin:2px}.safe{color:#9dffb4}.warn{color:#ffd28b}@media(max-width:900px){main{grid-template-columns:1fr}}</style></head><body><header><h1>42ndMind Intention Formula Inspector</h1><div class="muted">Read-only view of current candidate mathematical formula memory for each intention concept.</div></header><main><section><a href="index.html">main</a> · <a href="intention-canonical-formula-ledger-v0-1-1.html?v=ledger-2">ledger v0.1.1</a> · <a href="kernel-intention-formula-inspector-v0-1-test.html?v=inspect-1">test</a><p>Decision: <b id="decisionMetric">not run</b></p><p>Concepts: <b id="conceptMetric">0</b></p><p>Selected: <b id="selectedMetric">none</b></p><label for="conceptSelect">Concept</label><select id="conceptSelect" onchange="inspectSelected()"></select><button onclick="inspectAll()">Inspect all</button><button onclick="inspectSelected()">Inspect selected</button><button onclick="showPacket()">Show packet</button><button onclick="showSummary()">Show summary</button><button onclick="copyOutput()">Copy output</button><div id="cards"></div></section><section><h2>Output</h2><pre id="out">No output yet.</pre></section></main><script src="src/kernel-intention-discovery-v0-1.js?v=intent-1"></script><script src="src/kernel-intention-refinement-v0-1.js?v=refine-1"></script><script src="src/kernel-intention-necessity-test-v0-1.js?v=necessity-1"></script><script src="src/kernel-intention-neighbor-lattice-v0-1.js?v=lattice-3"></script><script src="src/kernel-intention-lattice-invariance-benchmark-v0-1.js?v=invariance-2"></script><script src="src/kernel-intention-formula-compiler-v0-1.js?v=formula-1"></script><script src="src/kernel-intention-concept-expansion-loop-v0-1.js?v=expansion-2"></script><script src="src/kernel-intention-contradiction-refinement-loop-v0-1.js?v=contradiction-1"></script><script src="src/kernel-intention-formula-revision-engine-v0-1.js?v=revision-1"></script><script src="src/kernel-intention-canonical-formula-ledger-v0-1.js?v=ledger-1"></script><script src="src/kernel-intention-proof-output-v0-1.js?v=proof-1"></script><script src="src/kernel-intention-minimal-pair-library-v0-1.js?v=minpair-1"></script><script src="src/kernel-intention-dimension-splitting-v0-1.js?v=split-2"></script><script src="src/kernel-intention-coefficient-dimension-revision-engine-v0-1.js?v=codim-1"></script><script src="src/kernel-intention-canonical-formula-ledger-v0-1-1-patch.js?v=ledger-2"></script><script src="src/kernel-intention-formula-inspector-v0-1.js?v=inspect-1"></script><script>let packet=null,current=null,last='';function esc(v){return String(v??'').replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]))}function arr(v){return Array.isArray(v)?v:[]}function setOut(v){last=typeof v==='string'?v:JSON.stringify(v,null,2);document.getElementById('out').textContent=last}function setMetrics(ok,count,selected){const decisionEl=document.getElementById('decisionMetric');decisionEl.textContent=ok?'FORMULA_INSPECTOR_READY':'HELD_FOR_REVIEW';decisionEl.className=ok?'ok':'bad';document.getElementById('conceptMetric').textContent=count||0;document.getElementById('selectedMetric').textContent=selected||'none'}function initSelect(){const concepts=['consent','threat','request','refusal','trust','betrayal','doubt','belief','fear','coercion','manipulation'];document.getElementById('conceptSelect').innerHTML=concepts.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('')}function inspectAll(){try{packet=KernelIntentionFormulaInspectorV01.inspectAll();current=null;setMetrics(packet.ok,packet.inspection_count,'all');renderAll();showSummary()}catch(e){setMetrics(false,0,'error');setOut({ok:false,error:e.message,belief_movement:'none'})}}function inspectSelected(){const concept=document.getElementById('conceptSelect').value;try{current=KernelIntentionFormulaInspectorV01.inspectConcept(concept);packet=null;setMetrics(current.ok,1,current.concept);renderInspection(current);showSelectedSummary()}catch(e){setMetrics(false,0,'error');setOut({ok:false,error:e.message,belief_movement:'none'})}}function renderAll(){document.getElementById('cards').innerHTML=arr(packet&&packet.inspections).map(i=>cardHtml(i,false)).join('')||'No inspections.'}function renderInspection(i){document.getElementById('cards').innerHTML=cardHtml(i,true)}function versionHtml(v){return`<div class="version"><b>${esc(v.version_id)}</b><br><span class="pill ${v.is_current_candidate?'warn':'safe'}">${esc(v.source_type)}</span><span class="pill safe">L1 ${esc(v.l1_total)}</span><span class="pill safe">force outside ${esc(v.force_terms_outside_shape)}</span><span class="pill">shape terms ${esc(v.shape_term_count)}</span><span class="pill">force terms ${esc(v.force_term_count)}</span><pre>${esc(v.symbolic_formula)}</pre>${v.is_current_candidate?`<pre>${esc(JSON.stringify({shape_terms:v.shape_terms,force_terms:v.force_terms,force_equation:v.force_equation},null,2))}</pre>`:''}</div>`}function cardHtml(i,full){return`<div class="card"><h3>${esc(i.concept)} · ${esc(i.doctrine_status)}</h3><p><span class="pill warn">current ${esc(i.current_candidate_version)}</span><span class="pill safe">versions ${esc(i.version_count)}</span><span class="pill safe">proof ${esc(i.proof_reference&&i.proof_reference.proof_id)}</span><span class="pill safe">rollback ${esc(i.rollback_available)}</span></p>${arr(i.versions).map(versionHtml).join('')}${full&&i.proof_reference?`<h4>Proof lines</h4><pre>${esc(arr(i.proof_reference.proof_lines).join('\n'))}</pre>`:''}</div>`}function summary(){return{packet_type:'42ndMind_intention_formula_inspector_summary_view_v0_1',ok:packet&&packet.ok,source_ledger_ok:packet&&packet.source_ledger_ok,source_ledger_record_count:packet&&packet.source_ledger_record_count,source_proof_ok:packet&&packet.source_proof_ok,source_proof_count:packet&&packet.source_proof_count,inspection_count:packet&&packet.inspection_count,inspections:arr(packet&&packet.inspections).map(i=>({concept:i.concept,current_candidate_version:i.current_candidate_version,version_count:i.version_count,version_types:i.version_types,current_symbolic_formula:i.current_candidate&&i.current_candidate.symbolic_formula,current_l1_total:i.current_candidate&&i.current_candidate.l1_total,current_shape_term_count:i.current_candidate&&i.current_candidate.shape_term_count,force_terms_outside_shape:i.current_candidate&&i.current_candidate.force_terms_outside_shape,proof_reference:i.proof_reference&&i.proof_reference.proof_id,belief_movement:i.belief_movement})),validation:packet&&packet.validation,belief_movement:'none'}}function selectedSummary(){return{packet_type:'42ndMind_intention_formula_inspection_selected_view_v0_1',ok:current&&current.ok,concept:current&&current.concept,current_candidate_version:current&&current.current_candidate_version,current_symbolic_formula:current&&current.current_candidate&&current.current_candidate.symbolic_formula,current_shape_terms:current&&current.current_candidate&&current.current_candidate.shape_terms,current_force_terms:current&&current.current_candidate&&current.current_candidate.force_terms,current_force_equation:current&&current.current_candidate&&current.current_candidate.force_equation,versions:current&&current.versions,proof_reference:current&&current.proof_reference,validation:current&&current.validation,belief_movement:'none'}}function showSummary(){if(!packet)return inspectAll();setOut(summary())}function showSelectedSummary(){if(!current)return inspectSelected();setOut(selectedSummary())}function showPacket(){if(packet)return setOut(packet);if(current)return setOut(current);inspectAll()}async function copyOutput(){try{await navigator.clipboard.writeText(last);document.getElementById('out').textContent='Copied.\n\n'+last}catch(e){}}initSelect();inspectSelected();</script></body></html>
