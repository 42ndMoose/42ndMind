<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>42ndMind Intention Discovery Test</title><style>body{margin:0;background:#0f1115;color:#eef2ff;font:14px ui-monospace,Menlo,Consolas,monospace}header{padding:16px;background:#11141b;border-bottom:1px solid #2a3040}main{padding:12px}section{background:#171a21;border:1px solid #2a3040;border-radius:10px;padding:12px}pre{white-space:pre-wrap;background:#0d1016;border:1px solid #2a3040;border-radius:10px;padding:10px;overflow:auto;max-height:760px}.ok{color:#9dffb4}.bad{color:#ff8b8b}a{color:#9db6ff}</style></head><body><header><h1>42ndMind Intention Discovery Test</h1><div>Tests candidate intention concept-shapes. No claim intent attribution. No belief movement.</div></header><main><section><h2 id="summary">Running...</h2><div><a href="intention-discovery.html?v=intent-1">intention discovery page</a></div><pre id="out"></pre></section></main><script src="src/kernel-intention-discovery-v0-1.js?v=intent-1"></script><script>const tests=[];let packet=null;function add(n,f){tests.push({name:n,fn:f})}function assert(c,m){if(!c)throw new Error(m)}function arr(v){return Array.isArray(v)?v:[]}function byConcept(name){return arr(packet&&packet.candidates).find(c=>c.concept===name)}function shapeSum(c){return Object.values(c.normalized_shape.shape||{}).reduce((s,v)=>s+Math.abs(Number(v)||0),0)}add('module loads',()=>{assert(window.KernelIntentionDiscoveryV01,'module missing');assert(KernelIntentionDiscoveryV01.VERSION==='0.1.0','version wrong');assert(typeof KernelIntentionDiscoveryV01.runDiscovery==='function','runDiscovery missing')});add('doctrine prevents claim attribution and belief movement',()=>{const d=KernelIntentionDiscoveryV01.doctrine();assert(d.discovers_intention_concepts_not_claim_facts===true,'concept doctrine missing');assert(d.no_real_world_intent_attribution===true,'real-world attribution guard missing');assert(d.no_person_event_or_narrative_belief_ledger===true,'ledger guard missing');assert(d.intention_type_scope_total===1,'scope total doctrine wrong');assert(d.force_intensity_remains_separate_from_shape===true,'force separation doctrine missing');assert(d.belief_movement==='none','belief movement doctrine wrong')});add('discovery runs for seed concepts',()=>{packet=KernelIntentionDiscoveryV01.runDiscovery();assert(packet.ok===true,'packet not ok: '+JSON.stringify(packet.validation));assert(packet.candidate_count===3,'expected 3 candidates');assert(byConcept('desire'),'missing desire');assert(byConcept('lying'),'missing lying');assert(byConcept('promise'),'missing promise');assert(packet.belief_movement==='none','packet moved belief')});add('each concept is unit-total and candidate-only',()=>{arr(packet.candidates).forEach(c=>{assert(c.scope_total===1,c.concept+' scope_total wrong');assert(Math.abs(1-shapeSum(c))<0.00001,c.concept+' shape does not sum to 1');assert(c.normalized_shape.l1_total===1,c.concept+' l1_total wrong');assert(c.review_status==='candidate_discovered_not_doctrine',c.concept+' promoted too early');assert(c.belief_movement==='none',c.concept+' moved belief');assert(c.symbolic_formula.includes('Σ|dimension_i| = 1'),c.concept+' missing unit-total formula')})});add('force is separate from shape',()=>{arr(packet.candidates).forEach(c=>{const force=new Set(arr(c.force_dimensions).map(x=>(x.name||x).toLowerCase()));Object.keys(c.normalized_shape.shape).forEach(dim=>assert(!force.has(dim.toLowerCase()),c.concept+' force leaked into shape: '+dim));assert(arr(c.force_dimensions).length>=1,c.concept+' missing force dimension')})});add('contrast and minimal-pair pressure exists',()=>{arr(packet.candidates).forEach(c=>{assert(arr(c.contrast_concepts).length>=3,c.concept+' insufficient contrasts');assert(arr(c.minimal_pairs).length>=3,c.concept+' insufficient minimal pairs');assert(arr(c.exclusion_frames).length>=1,c.concept+' missing exclusion frames')})});add('lying formula is concept-level not case-level',()=>{const c=byConcept('lying');assert(c,'missing lying');const names=Object.keys(c.normalized_shape.shape);['proposition_representation','communicative_assertion_act','belief_assertion_mismatch','audience_belief_update_target','concealment_of_mismatch'].forEach(dim=>assert(names.includes(dim),'lying missing '+dim));assert(c.contrast_concepts.includes('mistake'),'lying missing mistake contrast');assert(c.contrast_concepts.includes('fiction'),'lying missing fiction contrast');assert(c.exclusion_frames.includes('valid nonliteral frame'),'lying missing nonliteral exclusion');});add('validation report is clean',()=>{assert(packet.validation&&packet.validation.ok===true,'validation not ok');assert(packet.validation.candidate_count===3,'validation count wrong');packet.validation.validations.forEach(v=>{assert(v.ok===true,v.concept+' validation failed');assert(v.l1_total===1,v.concept+' validation l1 wrong');assert(v.shape_dimension_count>=5,v.concept+' too few shape dimensions');assert(v.force_dimension_count>=1,v.concept+' no force dimension')})});(async function run(){const results=[];for(const t of tests){try{await t.fn();results.push({name:t.name,passed:true})}catch(e){results.push({name:t.name,passed:false,error:e.message})}}const passed=results.filter(r=>r.passed).length;summary.className=passed===tests.length?'ok':'bad';summary.textContent=passed+'/'+tests.length+' passed';out.textContent=JSON.stringify({packet_type:'42ndMind_intention_discovery_test_report_v0_1',ok:passed===tests.length,candidate_count:packet&&packet.candidate_count,concepts:packet&&packet.candidates&&packet.candidates.map(c=>({concept:c.concept,l1:c.normalized_shape.l1_total,shape:c.normalized_shape.shape,force_dimensions:c.force_dimensions,review_status:c.review_status})),validation:packet&&packet.validation,results},null,2)})();</script></body></html>
