<head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>42ndMind Semantic Vector Compressor v0.1 Test</title><style>body{margin:0;font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:#0f1115;color:#eef2ff}header{padding:16px 18px;border-bottom:1px solid #2a3040;background:#11141b}main{padding:12px}section{background:#171a21;border:1px solid #2a3040;border-radius:10px;padding:12px}h1{font:700 19px/1.2 system-ui,-apple-system,Segoe UI,sans-serif;margin:0 0 4px}pre{white-space:pre-wrap;background:#0d1016;border:1px solid #2a3040;border-radius:10px;padding:10px;overflow:auto;max-height:760px}.ok{color:#9dffb4}.bad{color:#ff8b8b}a{color:#9db6ff}</style></head>
<body>
<header><h1>42ndMind Semantic Vector Compressor v0.1 Test</h1><div>Tests compression of the 146-entry semantic corpus into operator/pressure/ontology vectors and reusable candidate templates.</div></header>
<main><section><h2 id="summary">Running...</h2><div><a href="semantic-vector-compressor.html">semantic vector compressor</a> · <a href="semantic-pressure-registry.html">pressure registry</a></div><pre id="out"></pre></section></main>
<script src="src/kernel-semantic-corpus-v0-1.js?v=0.1.0"></script>
<script src="src/kernel-semantic-corpus-combiner-v0-1.js?v=unit-total-1"></script>
<script src="src/kernel-semantic-pressure-registry-v0-1.js?v=0.1.0"></script>
<script src="src/kernel-semantic-pressure-registry-v0-1-1-patch.js?v=status-neg-1"></script>
<script src="src/kernel-semantic-vector-compressor-v0-1.js?v=0.1.0"></script>
<script>
  const tests=[]; let packet=null, space=null, summary=null;
  function add(name,fn){tests.push({name,fn});} function assert(cond,msg){if(!cond)throw new Error(msg);} function asArray(v){return Array.isArray(v)?v:[];}
  function pressureLabelSet(){const labels=new Set();asArray(space&&space.vectors).forEach(v=>asArray(v.pressures).forEach(p=>labels.add(p)));Object.keys(space&&space.pressure_index||{}).forEach(p=>labels.add(p));Object.keys(space&&space.pressure_dimension_index||{}).forEach(p=>labels.add(p));return labels;}
  add('modules load',()=>{assert(window.KernelSemanticCorpusV01,'KernelSemanticCorpusV01 missing');assert(window.KernelSemanticCorpusCombinerV01,'KernelSemanticCorpusCombinerV01 missing');assert(window.KernelSemanticPressureRegistryV01,'KernelSemanticPressureRegistryV01 missing');assert(window.KernelSemanticVectorCompressorV01,'KernelSemanticVectorCompressorV01 missing');});
  add('doctrine preserves no belief movement',()=>{const d=KernelSemanticVectorCompressorV01.doctrine();assert(d.vector_compression_is_diagnostic_not_truth===true,'diagnostic doctrine missing');assert(d.recursive_growth_must_be_gated_by_tests_and_review===true,'gated recursion doctrine missing');assert(d.vector_compressor_does_not_infer_final_intent===true,'intent doctrine missing');assert(d.vector_compressor_does_not_patch_source===true,'source doctrine missing');assert(d.belief_movement==='none','belief movement doctrine wrong');});
  add('combiner defaults include all current extension packets',()=>{const urls=KernelSemanticCorpusCombinerV01.DEFAULT_EXTENSION_URLS;assert(urls.length===14,'expected fourteen default extension packets');assert(urls.includes('data/semantic_seed_basis_refinement_v0_1.json'),'basis-refinement packet missing');assert(urls.includes('data/semantic_seed_uncertainty_status_negation_v0_1.json'),'status-negation packet missing');assert(urls.includes('data/semantic_seed_unit_total_shape_bridge_v0_1.json'),'unit-total shape bridge packet missing');});
  add('load combined and compress succeeds',async()=>{packet=await KernelSemanticVectorCompressorV01.loadCombinedAndCompress({min_observations:2});space=packet.vector_space;summary=packet.summary;assert(packet.ok===true,'compression packet not ok');assert(packet.combined_packet.ok===true,'combined packet not ok');assert(packet.combined_packet.combined.entry_count===146,'expected 146 combined entries');assert(packet.combined_packet.combined.source_packets.length===15,'expected main plus fourteen extension sources');assert(packet.combined_packet.combined.duplicate_entries.length===0,'expected zero duplicate skips');assert(packet.pressure_ontology.validation.ok===true,'pressure ontology not ok');assert(packet.pressure_ontology.validation.missing_pressure_count===0,'expected zero ontology gaps');assert(packet.belief_movement==='none','packet moved belief');});
  add('vector space covers current corpus',()=>{assert(space.corpus_entry_count===146,'expected 146 corpus entries');assert(space.vector_count===146,'expected 146 vectors');assert(space.pressure_dimension_count>=60,'expected at least 60 pressure dimensions');assert(space.operator_dimension_count>=109,'expected at least 109 operator dimensions');assert(space.pressure_family_dimension_count>=10,'expected multiple pressure families');assert(space.ontology_summary.missing_pressure_count===0,'expected zero pressure ontology gaps');});
  add('new pressure dimensions are present',()=>{const labels=pressureLabelSet();['general_unresolved_status_pressure','claim_nonclosure_status_pressure','negated_collusion_status_pressure','unit_total_refinement_pressure'].forEach(p=>assert(labels.has(p),'missing pressure '+p));});
  add('unit-total shape bridge operators are present',()=>{const ops=new Set(space.vectors.flatMap(v=>asArray(v.operator_names)));['unit_total_shape_projection','anonymous_shape_invariance','anonymous_shape_repetition','force_shape_separation'].forEach(op=>assert(ops.has(op),'missing operator '+op));});
  add('candidate templates are generated and non-doctrinal',()=>{assert(space.template_count>=22,'expected candidate templates');const template=space.templates[0];assert(template.observation_count>=2,'template observation count too low');assert(template.centroid_vector&&Object.keys(template.centroid_vector).length>0,'template centroid missing');assert(template.reuse_status==='candidate_template_requires_review','template review status wrong');assert(template.belief_movement==='none','template moved belief');});
  add('summary exposes compressed semantic dimensions',()=>{assert(summary.packet_type==='42ndMind_semantic_vector_space_summary_v0_1','wrong summary packet');assert(summary.corpus_entry_count===146,'summary entry count wrong');assert(summary.vector_count===146,'summary vector count wrong');assert(summary.pressure_dimension_count>=60,'summary pressure dimension count too low');assert(summary.template_count>=22,'summary template count too low');assert(asArray(summary.top_pressure_families).length>0,'top pressure families missing');assert(summary.belief_movement==='none','summary moved belief');});
  add('nearest vector similarity works',()=>{const target=space.vectors.find(v=>v.pressures.includes('general_unresolved_status_pressure'))||space.vectors[0];const nearest=KernelSemanticVectorCompressorV01.nearestVectors(target,space.vectors,{top_n:3});assert(nearest.length===3,'expected 3 nearest vectors');assert(nearest[0].score>=nearest[1].score,'nearest scores not sorted');assert(nearest[0].entry_id===target.entry_id,'target should be nearest to itself');});
  add('review targets are gated and non-doctrinal',()=>{const targets=packet.review_targets;assert(targets.packet_type==='42ndMind_semantic_vector_review_targets_v0_1','wrong targets packet');assert(targets.target_count>0,'expected review targets');assert(targets.targets.every(t=>t.belief_movement==='none'),'target moved belief');assert(targets.targets.every(t=>t.evidence_needed.includes('Do not promote without test pass.')),'gating text missing');assert(targets.belief_movement==='none','targets packet moved belief');});
  add('aggregate vector keeps belief movement at none',()=>{assert(space.aggregate_vector.belief_movement==='none','aggregate moved belief');assert(space.doctrine.vector_compression_is_diagnostic_not_truth===true,'space doctrine missing');assert(space.belief_movement==='none','space moved belief');});
  (async function run(){const results=[];for(const t of tests){try{await t.fn();results.push({name:t.name,passed:true});}catch(e){results.push({name:t.name,passed:false,error:e.message});}}const passed=results.filter(r=>r.passed).length;document.getElementById('summary').className=passed===tests.length?'ok':'bad';document.getElementById('summary').textContent=`${passed}/${tests.length} passed`;document.getElementById('out').textContent=JSON.stringify({packet_type:'42ndMind_semantic_vector_compressor_v0_1_test_report',corpus_entry_count:space&&space.corpus_entry_count,vector_count:space&&space.vector_count,operator_dimension_count:space&&space.operator_dimension_count,pressure_dimension_count:space&&space.pressure_dimension_count,template_count:space&&space.template_count,results},null,2);})();
</script>
</body>
</html>
