<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>42ndMind Language-to-Formula Benchmark Test</title><style>body{margin:0;background:#0f1115;color:#eef2ff;font:14px ui-monospace,Menlo,Consolas,monospace}header{padding:16px;background:#11141b;border-bottom:1px solid #2a3040}main{padding:12px}section{background:#171a21;border:1px solid #2a3040;border-radius:10px;padding:12px}pre{white-space:pre-wrap;background:#0d1016;border:1px solid #2a3040;border-radius:10px;padding:10px;overflow:auto;max-height:760px}.ok{color:#9dffb4}.bad{color:#ff8b8b}a{color:#9db6ff}</style></head><body><header><h1>42ndMind Language-to-Formula Benchmark Test</h1><div>Tests neutral input → parser candidate → v0003 formula → proof trace → invariant checks. Candidate only.</div></header><main><section><h2 id="summary">Running...</h2><div><a href="intention-language-to-formula-benchmark.html?v=l2f-1">language-to-formula benchmark page</a></div><pre id="out"></pre></section></main><script src="src/kernel-intention-discovery-v0-1.js?v=intent-1"></script><script src="src/kernel-intention-refinement-v0-1.js?v=refine-1"></script><script src="src/kernel-intention-necessity-test-v0-1.js?v=necessity-1"></script><script src="src/kernel-intention-neighbor-lattice-v0-1.js?v=lattice-3"></script><script src="src/kernel-intention-lattice-invariance-benchmark-v0-1.js?v=invariance-2"></script><script src="src/kernel-intention-formula-compiler-v0-1.js?v=formula-1"></script><script src="src/kernel-intention-concept-expansion-loop-v0-1.js?v=expansion-2"></script><script src="src/kernel-intention-contradiction-refinement-loop-v0-1.js?v=contradiction-1"></script><script src="src/kernel-intention-formula-revision-engine-v0-1.js?v=revision-1"></script><script src="src/kernel-intention-canonical-formula-ledger-v0-1.js?v=ledger-1"></script><script src="src/kernel-intention-proof-output-v0-1.js?v=proof-1"></script><script src="src/kernel-intention-minimal-pair-library-v0-1.js?v=minpair-1"></script><script src="src/kernel-intention-dimension-splitting-v0-1.js?v=split-2"></script><script src="src/kernel-intention-coefficient-dimension-revision-engine-v0-1.js?v=codim-1"></script><script src="src/kernel-intention-canonical-formula-ledger-v0-1-1-patch.js?v=ledger-2"></script><script src="src/kernel-intention-arbitrary-language-parser-v0-1.js?v=parser-1"></script><script src="src/kernel-intention-parser-proof-trace-v0-1.js?v=ptrace-1"></script><script src="src/kernel-intention-language-to-formula-benchmark-v0-1.js?v=l2f-1"></script><script>const tests=[];let packet=null;function add(n,f){tests.push({name:n,fn:f})}function assert(c,m){if(!c)throw new Error(m)}function arr(v){return Array.isArray(v)?v:[]}function cases(){return arr(packet&&packet.case_results)}add('modules load and doctrine is benchmark-only',()=>{assert(window.KernelIntentionLanguageToFormulaBenchmarkV01,'language-to-formula benchmark missing');assert(KernelIntentionLanguageToFormulaBenchmarkV01.VERSION==='0.1.0','version wrong');assert(typeof KernelIntentionLanguageToFormulaBenchmarkV01.runBenchmark==='function','runBenchmark missing');const d=KernelIntentionLanguageToFormulaBenchmarkV01.doctrine();assert(d.benchmarks_full_language_to_formula_chain===true,'full-chain doctrine missing');assert(d.input_to_candidate_concept_to_v0003_formula_to_proof_trace===true,'chain doctrine missing');assert(d.benchmark_is_invariant_check_not_doctrine===true,'doctrine guard missing');assert(d.ambiguity_must_remain_visible===true,'ambiguity guard missing');assert(d.unresolved_dimensions_must_remain_visible===true,'unresolved guard missing');assert(d.belief_movement==='none','belief movement wrong')});add('benchmark runs from ledger, proof, parser, and trace',()=>{packet=KernelIntentionLanguageToFormulaBenchmarkV01.runBenchmark();assert(packet.ok===true,'packet not ok: '+JSON.stringify(packet.validation));assert(packet.source_ledger_ok===true,'source ledger not ok');assert(packet.source_ledger_record_count===11,'expected 11 ledger records');assert(packet.source_proof_ok===true,'source proof not ok');assert(packet.source_proof_count===11,'expected 11 proofs');assert(packet.source_parser_ok===true,'source parser not ok');assert(packet.source_parser_parse_count===12,'expected 12 parses');assert(packet.source_trace_ok===true,'source trace not ok');assert(packet.source_trace_count===12,'expected 12 traces')});add('twelve cases, eleven labelled matches, and one ambiguity case are present',()=>{assert(packet.case_count===12,'expected 12 cases');assert(packet.labelled_case_count===11,'expected 11 labelled cases');assert(packet.labelled_case_pass_count===11,'expected 11 labelled passes');assert(packet.ambiguity_case_count===1,'expected 1 ambiguity case');assert(cases().length===12,'expected 12 case rows');assert(packet.validation.checks.twelve_cases===true,'twelve cases check failed');assert(packet.validation.checks.eleven_labelled_cases_match===true,'labelled match check failed');assert(packet.validation.checks.ambiguity_case_visible===true,'ambiguity case check failed')});add('each case completes input to candidate to v0003 formula to proof trace',()=>{cases().forEach(c=>{assert(c.ok===true,c.case_id+' failed: '+arr(c.errors).join(','));assert(c.parser_top_concept&&c.parser_top_concept.length>0,c.case_id+' missing parser concept');assert(c.trace_top_concept&&c.trace_top_concept.length>0,c.case_id+' missing trace concept');assert(c.candidate_version.includes('v0003_coefficient_dimension_revision'),c.case_id+' candidate not v0003');assert(c.formula_present===true,c.case_id+' missing formula');assert(c.proof_reference_present===true,c.case_id+' missing proof reference')});assert(packet.validation.checks.all_cases_have_v0003_formula===true,'v0003 formula check failed');assert(packet.validation.checks.all_cases_have_proof_reference===true,'proof reference check failed')});add('ambiguity and unresolved dimensions remain visible',()=>{cases().forEach(c=>{assert(typeof c.ambiguity_score==='number',c.case_id+' missing ambiguity score');assert(typeof c.unresolved_dimension_count==='number',c.case_id+' missing unresolved dimension count')});assert(packet.validation.checks.unresolved_dimensions_visible===true,'unresolved dimensions check failed')});add('L1 totals equal 1 and force remains outside shape',()=>{cases().forEach(c=>{assert(c.observed_l1_total===1,c.case_id+' l1 wrong: '+c.observed_l1_total);assert(c.force_terms_outside_shape===true,c.case_id+' force leaked')});assert(packet.validation.checks.all_l1_totals_equal_1===true,'l1 check failed');assert(packet.validation.checks.force_terms_outside_shape===true,'force check failed')});add('candidate-only status and belief movement are preserved',()=>{cases().forEach(c=>{assert(c.promotion_status==='not_promoted',c.case_id+' promoted');assert(c.doctrine_status==='candidate_not_doctrine',c.case_id+' doctrine status wrong');assert(c.belief_movement==='none',c.case_id+' moved belief')});assert(packet.validation.checks.candidate_only_not_promoted===true,'candidate-only check failed');assert(packet.validation.checks.belief_movement_none===true,'belief movement check failed')});add('validation report is clean',()=>{assert(packet.validation&&packet.validation.ok===true,'validation not ok');assert(arr(packet.validation.errors).length===0,'validation errors present: '+packet.validation.errors.join(','));assert(packet.belief_movement==='none','packet moved belief')});(async function run(){const results=[];for(const t of tests){try{await t.fn();results.push({name:t.name,passed:true})}catch(e){results.push({name:t.name,passed:false,error:e.message})}}const passed=results.filter(r=>r.passed).length;document.getElementById('summary').className=passed===tests.length?'ok':'bad';document.getElementById('summary').textContent=passed+'/'+tests.length+' passed';document.getElementById('out').textContent=JSON.stringify({packet_type:'42ndMind_intention_language_to_formula_benchmark_test_report_v0_1',ok:passed===tests.length,source_ledger_record_count:packet&&packet.source_ledger_record_count,source_proof_count:packet&&packet.source_proof_count,source_parser_parse_count:packet&&packet.source_parser_parse_count,source_trace_count:packet&&packet.source_trace_count,case_count:packet&&packet.case_count,labelled_case_count:packet&&packet.labelled_case_count,labelled_case_pass_count:packet&&packet.labelled_case_pass_count,ambiguity_case_count:packet&&packet.ambiguity_case_count,case_results:cases().map(c=>({case_id:c.case_id,expected_concept:c.expected_concept,parser_status:c.parser_status,parser_top_concept:c.parser_top_concept,trace_top_concept:c.trace_top_concept,candidate_version:c.candidate_version,ambiguity_score:c.ambiguity_score,unresolved_dimension_count:c.unresolved_dimension_count,observed_l1_total:c.observed_l1_total,force_terms_outside_shape:c.force_terms_outside_shape,promotion_status:c.promotion_status,belief_movement:c.belief_movement})),validation:packet&&packet.validation,results},null,2)})();</script></body></html>
