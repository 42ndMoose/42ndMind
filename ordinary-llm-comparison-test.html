<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>42ndMind Ordinary LLM Comparison Smoke Test</title>
  <style>
    body { margin:20px; font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; background:#0f1115; color:#eef2ff; }
    a { color:#9db6ff; }
    button { background:#25345c; color:#eef2ff; border:1px solid #3f5592; padding:8px 10px; border-radius:8px; cursor:pointer; margin:3px 3px 10px 0; font:13px system-ui,-apple-system,Segoe UI,sans-serif; }
    pre { white-space:pre-wrap; background:#171a21; border:1px solid #2a3040; border-radius:10px; padding:12px; }
    .pass { color:#9dffb4; }
    .fail { color:#ff8b8b; }
    .muted { color:#8b93a7; }
  </style>
</head>
<body>
  <h1>Ordinary LLM Comparison Smoke Test</h1>
  <p><a href="ordinary-llm-comparison.html">ordinary LLM comparison</a> · <a href="goal-runner.html">goal runner</a> · <a href="llm-brain-v0-3.html">live brain v0.3</a></p>
  <button onclick="copyOutput()">COPY output</button><span id="status" class="muted"></span>
  <pre id="out">Running...</pre>
<script src="src/epistemic-kernel-v0-2.js"></script>
<script src="src/epistemic-kernel-v0-2-patches.js"></script>
<script src="src/epistemic-benchmark-v0-1.js"></script>
<script>
  const CRITERIA = [
    { id:'contradiction_detection', label:'Contradiction detection', max:2, positive:['contradiction','inconsistent','conflict','cannot both','timeline','tension'], negative:['no contradiction','nothing conflicts','clearly true'] },
    { id:'evidence_separation', label:'Evidence separation', max:2, positive:['evidence','support','attack','attacking','supports','weakens','source','timestamp'], negative:['obviously','just trust','proves everything'] },
    { id:'motive_calibration', label:'Motive calibration', max:2, positive:['motive','intent','separate evidence','not enough evidence','hypothesis','could be mistaken'], negative:['definitely lied','obviously malicious','wanted to hurt'] },
    { id:'scope_control', label:'Scope control', max:2, positive:['scope','local claim','do not merge','not worldview','limited','specific claim'], negative:['therefore everything','proves the whole worldview','always'] },
    { id:'self_sealing_detection', label:'Self-sealing detection', max:2, positive:['self-sealing','falsify','what evidence would count against','counterevidence','unfalsifiable'], negative:['evidence against proves it','disagreement proves'] },
    { id:'belief_update_accuracy', label:'Belief update accuracy', max:2, positive:['weaken','strengthen','confidence','update','reduce confidence','status','claim survives'], negative:['certainty','100% true','case closed'] },
    { id:'unresolved_pressure_preservation', label:'Unresolved-pressure preservation', max:2, positive:['unresolved','open question','pressure remains','not resolved','needs more evidence','unknown'], negative:['fully resolved','nothing remains','no further question'] }
  ];

  function round(value, places = 3) { const factor = Math.pow(10, places); return Math.round(Number(value || 0) * factor) / factor; }
  function lower(text) { return String(text || '').toLowerCase(); }
  function countHits(text, terms) { const t = lower(text); return terms.filter(term => t.includes(lower(term))).length; }
  function scoreText(text) {
    const criteria = CRITERIA.map(criterion => {
      const positiveHits = countHits(text, criterion.positive);
      const negativeHits = countHits(text, criterion.negative);
      let score = 0;
      if (positiveHits >= 2) score = 2;
      else if (positiveHits === 1) score = 1;
      if (negativeHits > 0 && score > 0) score -= 1;
      return { id:criterion.id, label:criterion.label, score, max:criterion.max, positive_hits:positiveHits, negative_hits:negativeHits };
    });
    const total = criteria.reduce((sum, row) => sum + row.score, 0);
    const max = criteria.reduce((sum, row) => sum + row.max, 0);
    return { total, max, ratio: round(total / Math.max(1, max), 4), criteria };
  }
  function kernelGuidedText(caseDef) {
    const result = EpistemicBenchmark.runCase(caseDef);
    return [
      `Kernel-guided result for ${caseDef.id}: ${result.passed ? 'benchmark passed' : 'benchmark failed'}.`,
      `Category: ${caseDef.category}; milestone M${caseDef.milestone}.`,
      `Counts: ${result.counts.claims} claim(s), ${result.counts.evidence} evidence row(s), ${result.counts.contradictions} active contradiction(s), ${result.counts.open_questions} open question(s), ${result.counts.observations} observation(s).`,
      `Root point: x=${round(result.root_point.x)}, y=${round(result.root_point.y)}, z=${round(result.root_point.z)}. Active states must preserve |x| + |y| + |z| = 1.`,
      'Belief movement is represented as claim/evidence/contradiction/open-question pressure, not polished language.',
      'Contradiction detection is not contradiction resolution; unresolved pressure remains visible until evidence resolves it.',
      'Motive claims require separate motive evidence. Coherence alone does not promote truth.',
      'Any rule change would need sandbox testing and user approval before promotion.',
      `Checks: ${JSON.stringify(result.checks)}`
    ].join('\n');
  }
  function buildComparisonPacket() {
    const caseDef = EpistemicBenchmark.CASES[0];
    const result = EpistemicBenchmark.runCase(caseDef);
    const genericText = 'This seems clearly true and case closed. Nothing remains unresolved.';
    const promptOnlyText = 'There is a timeline contradiction, and the timestamp evidence weakens the earlier claim. Some unresolved pressure remains until the exact submission record is checked.';
    const kernelText = kernelGuidedText(caseDef);
    const scores = {
      generic: scoreText(genericText),
      prompt_only: scoreText(promptOnlyText),
      kernel_guided: scoreText(kernelText)
    };
    const best = Object.entries(scores).sort((a,b) => b[1].total - a[1].total)[0];
    return {
      packet_type:'42ndMind_ordinary_llm_comparison_packet',
      packet_version:'0.1.0',
      purpose:'Milestone 12 comparison harness smoke fixture.',
      honesty_note:'This does not call external models and does not prove superiority unless real model outputs are pasted and preserved.',
      case:{ id:caseDef.id, title:caseDef.title, category:caseDef.category, milestone:caseDef.milestone, failure_pattern:caseDef.failure_pattern },
      kernel_case_result:result,
      scores,
      best:{ label:best[0], total:best[1].total, max:best[1].max },
      doctrine:{
        first_principles:true,
        kernel_owns_belief_movement:true,
        llm_outputs_are_observed_behavior_not_truth:true,
        contradiction_detection_is_not_resolution:true,
        unresolved_pressure_must_remain_visible:true,
        no_rule_self_promotion:true
      },
      pasted_outputs:{ generic:genericText, prompt_only:promptOnlyText, kernel_guided:kernelText }
    };
  }
  function run() {
    const packet = buildComparisonPacket();
    const maxScore = CRITERIA.reduce((sum, row) => sum + row.max, 0);
    const caseIds = new Set(EpistemicBenchmark.CASES.map(row => row.id));
    const criteriaIds = new Set(CRITERIA.map(row => row.id));
    const cases = [
      ['benchmark cases loaded', EpistemicBenchmark.CASES.length >= 10],
      ['selected case comes from benchmark', caseIds.has(packet.case.id)],
      ['packet type', packet.packet_type === '42ndMind_ordinary_llm_comparison_packet'],
      ['packet version', packet.packet_version === '0.1.0'],
      ['honesty note present', packet.honesty_note.includes('does not prove superiority')],
      ['three score lanes', !!packet.scores.generic && !!packet.scores.prompt_only && !!packet.scores.kernel_guided],
      ['max score matches rubric', packet.scores.kernel_guided.max === maxScore],
      ['rubric has seven criteria', CRITERIA.length === 7],
      ['criterion contradiction detection', criteriaIds.has('contradiction_detection')],
      ['criterion evidence separation', criteriaIds.has('evidence_separation')],
      ['criterion motive calibration', criteriaIds.has('motive_calibration')],
      ['criterion scope control', criteriaIds.has('scope_control')],
      ['criterion self-sealing detection', criteriaIds.has('self_sealing_detection')],
      ['criterion belief update accuracy', criteriaIds.has('belief_update_accuracy')],
      ['criterion unresolved pressure preservation', criteriaIds.has('unresolved_pressure_preservation')],
      ['kernel result included', packet.kernel_case_result && packet.kernel_case_result.id === packet.case.id],
      ['kernel-guided output nonempty', packet.pasted_outputs.kernel_guided.length > 200],
      ['kernel-guided score nonzero', packet.scores.kernel_guided.total > 0],
      ['generic output scored', Number.isFinite(packet.scores.generic.total)],
      ['prompt-only output scored', Number.isFinite(packet.scores.prompt_only.total)],
      ['best label valid', ['generic','prompt_only','kernel_guided'].includes(packet.best.label)],
      ['first principles doctrine', packet.doctrine.first_principles === true],
      ['kernel owns belief movement', packet.doctrine.kernel_owns_belief_movement === true],
      ['LLM outputs not truth doctrine', packet.doctrine.llm_outputs_are_observed_behavior_not_truth === true],
      ['contradiction not resolution doctrine', packet.doctrine.contradiction_detection_is_not_resolution === true],
      ['unresolved pressure doctrine', packet.doctrine.unresolved_pressure_must_remain_visible === true],
      ['no self-promotion doctrine', packet.doctrine.no_rule_self_promotion === true]
    ];
    const passed = cases.filter(row => row[1]).length;
    const text = `Ordinary LLM Comparison smoke test\n${passed}/${cases.length} passed\n\n` + cases.map(row => `${row[1] ? 'PASS' : 'FAIL'} ${row[0]}`).join('\n') + '\n\n' + JSON.stringify(packet, null, 2);
    const out = document.getElementById('out');
    out.textContent = text;
    out.className = passed === cases.length ? 'pass' : 'fail';
  }
  async function copyOutput() {
    const text = document.getElementById('out').textContent;
    try { await navigator.clipboard.writeText(text); document.getElementById('status').textContent = `Copied output (${text.length.toLocaleString()} chars).`; }
    catch (error) { document.getElementById('status').textContent = 'Could not auto-copy. Select output manually.'; }
  }
  run();
</script>
</body>
</html>
