<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Auto Growth Report Test</title><style>body{margin:0;background:#0f1115;color:#eef2ff;font:14px ui-monospace,Menlo,Consolas,monospace}header{padding:16px;background:#11141b;border-bottom:1px solid #2a3040}main{padding:12px}pre{white-space:pre-wrap;background:#0d1016;border:1px solid #2a3040;border-radius:10px;padding:10px;overflow:auto}.ok{color:#9dffb4}.bad{color:#ff8b8b}</style></head><body><header><h1>Auto Growth Report Test</h1></header><main><h2 id="summary">Running...</h2><pre id="out"></pre></main><script src="src/kernel-semantic-corpus-v0-1.js?v=0.1.0"></script><script src="src/kernel-semantic-corpus-combiner-v0-1.js?v=auto-growth-16"></script><script src="src/kernel-semantic-pressure-registry-v0-1.js?v=0.1.0"></script><script src="src/kernel-semantic-pressure-registry-v0-1-1-patch.js?v=coordination-1"></script><script src="src/kernel-semantic-vector-compressor-v0-1.js?v=0.1.0"></script><script src="src/kernel-unit-total-nested-shape-v0-1.js?v=0.1.0"></script><script src="src/kernel-objective-language-shape-bridge-v0-1.js?v=0.1.0"></script><script src="src/kernel-objective-language-invariance-benchmark-v0-1.js?v=0.1.0"></script><script src="src/kernel-objective-language-knowledge-growth-v0-1.js?v=0.1.0"></script><script src="src/kernel-auto-growth-controller-v0-1.js?v=preflight-1"></script><script src="src/kernel-auto-growth-report-v0-1.js?v=0.1.0"></script><script>const tests=[];let packet=null;function add(n,f){tests.push({name:n,fn:f})}function assert(c,m){if(!c)throw new Error(m)}function arr(v){return Array.isArray(v)?v:[]}function gate(name){return arr(packet&&packet.gates).find(g=>g.name===name)}function nonemptyStrings(v){return arr(v).length>0&&arr(v).every(x=>typeof x==='string'&&x.trim().length>0)}add('modules load',()=>{assert(window.KernelSemanticCorpusV01,'corpus validator missing');assert(window.KernelAutoGrowthControllerV01,'controller missing');assert(window.KernelAutoGrowthReportV01,'report missing');assert(typeof KernelAutoGrowthControllerV01.validateSeedPacketPreflight==='function','preflight function missing')});add('report doctrine is safe',()=>{const d=KernelAutoGrowthReportV01.doctrine();assert(d.report_only===true,'report guard missing');assert(d.does_not_write_repo===true,'write guard missing');assert(d.belief_movement==='none','belief movement wrong')});add('report runs',async()=>{packet=await KernelAutoGrowthReportV01.run({max_entries:16});assert(packet.ok===true,'report not ok');assert(packet.decision==='AUTO_STAGE','expected AUTO_STAGE');assert(packet.current_baseline==='178 entries / 17 source packets','current baseline wrong');assert(packet.proposed_next_baseline==='194 entries / 18 source packets','next baseline wrong')});add('report carries staged packet text',()=>{assert(packet.staged_seed_json&&packet.staged_seed_json.includes('entries'),'staged text missing');assert(packet.staged_seed_packet.entries.length===16,'expected 16 entries')});add('report summarizes gates including corpus validator preflight',()=>{assert(arr(packet.gates).length>=8,'gates missing');assert(packet.gates.every(g=>g.status==='pass'),'not all gates passed');const preflight=gate('candidate_corpus_validator_preflight');assert(preflight,'preflight gate missing');assert(preflight.detail&&preflight.detail.ok===true,'preflight detail not ok');assert(preflight.detail.valid_entry_count===16,'preflight valid count wrong')});add('report summarizes operators and pressures',()=>{assert(nonemptyStrings(packet.operators_in_seed),'operators missing');assert(nonemptyStrings(packet.pressures_in_seed),'pressures missing')});(async function run(){const results=[];for(const t of tests){try{await t.fn();results.push({name:t.name,passed:true})}catch(e){results.push({name:t.name,passed:false,error:e.message})}}const passed=results.filter(r=>r.passed).length;summary.className=passed===tests.length?'ok':'bad';summary.textContent=passed+'/'+tests.length+' passed';out.textContent=JSON.stringify({packet_type:'42ndMind_auto_growth_report_v0_1_test_report',decision:packet&&packet.decision,current_baseline:packet&&packet.current_baseline,next_baseline:packet&&packet.proposed_next_baseline,entry_count:packet&&packet.proposed_entry_count,operator_count:packet&&packet.operators_in_seed&&packet.operators_in_seed.length,pressure_count:packet&&packet.pressures_in_seed&&packet.pressures_in_seed.length,gates:packet&&packet.gates,results},null,2)})();</script></body></html>
