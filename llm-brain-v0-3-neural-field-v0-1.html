<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>42ndMind Neural Field v0.1</title><style>body{margin:0;background:#0f1115;color:#eef2ff;font:14px monospace}header,main{padding:12px}section{background:#171a21;border:1px solid #2a3040;border-radius:10px;padding:10px;margin:10px 0}textarea{width:100%;height:150px;background:#0f1218;color:#eef2ff;border:1px solid #2a3040;border-radius:8px;padding:8px}button{background:#25345c;color:#eef2ff;border:1px solid #3f5592;border-radius:8px;padding:8px;margin:3px}.good{background:#1f4a31}.thought{font-size:15px;line-height:1.45;background:#101827;border:1px solid #4d6fac;border-radius:10px;padding:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}pre{white-space:pre-wrap;max-height:520px;overflow:auto;background:#0d1016;border:1px solid #2a3040;border-radius:8px;padding:8px}.pill{display:inline-block;border:1px solid #2a3040;border-radius:999px;padding:2px 8px;margin:2px}.bar{height:8px;background:#2b3550;border-radius:999px;overflow:hidden;margin:4px 0}.fill{height:8px;background:#7fa3ff}.muted{color:#8b93a7}@media(max-width:900px){.grid{grid-template-columns:1fr}}</style></head><body><header><h1>42ndMind Neural Field v0.1</h1><div class="muted">Functional neurons, synaptic spread, motor speech, and learning deltas. This is the first neuron-style layer, not a chatbot connector.</div></header><main><section><h2>Unified input</h2><textarea id="inputBox">language should grow through calculus, subdivision of one, meanings, and formulas</textarea><br><button class="good" onclick="sendInput()">SEND / INGEST</button><button onclick="loadLanguage()">language growth</button><button onclick="loadCommunicate()">communicate</button><button onclick="loadTruth()">truth/belief</button><button onclick="loadReasoning()">reasoning side</button><button onclick="resetState()">RESET</button><div id="status" class="muted"></div></section><section><h2>Kernel says</h2><div id="thought" class="thought"></div></section><div class="grid"><section><h2>Active neurons</h2><div id="neurons"></div></section><section><h2>Motor intention</h2><div id="motor"></div><h2>Learning deltas</h2><div id="deltas"></div></section></div><section><h2>Neural packet</h2><pre id="packet"></pre></section><section><h2>Communication packet</h2><pre id="comm"></pre></section></main>

<script>
const KEY='kernel_neural_field_v0_1_state';let saved=null;try{saved=localStorage.getItem(KEY)?JSON.parse(localStorage.getItem(KEY)):null}catch(e){}let k=new EpistemicKernel(saved),binding=null,b=null;function $(x){return document.getElementById(x)}function arr(v){return Array.isArray(v)?v:[]}function shared(){return k.state&&k.state.unifiedCore?k.state.unifiedCore:k.state}function n(){return shared().kernelNeuralFieldCore||{}}function c(){return shared().communicationCore||{}}function esc(s){return String(s??'').replace(/[&<>]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[x]))}function bind(){if(!b){binding=KernelBrainEpistemicKernelBridgeV01.bind(k);b=binding.bound_brain}b.refreshObjectiveMaturityCore&&b.refreshObjectiveMaturityCore('neural_bind');b.refreshKernelUnityField&&b.refreshKernelUnityField('neural_bind');b.refreshKernelNeuralField&&b.refreshKernelNeuralField('neural_bind')}function save(){try{localStorage.setItem(KEY,JSON.stringify(k.snapshot()))}catch(e){}}function sendInput(){bind();let raw=$('inputBox').value||'';if(!raw.trim())return;b.ingest(raw,{kind:'neural_live'});b.refreshKernelNeuralField('neural_live');save();render();$('status').textContent='Intention: '+((n().selected_motor_intention&&n().selected_motor_intention.intention_kind)||'none')}function resetState(){localStorage.removeItem(KEY);k=new EpistemicKernel(null);binding=null;b=null;bind();save();render()}function loadLanguage(){$('inputBox').value='language should grow through calculus, subdivision of one, meanings, and formulas'}function loadCommunicate(){$('inputBox').value='can you communicate what you know and what you want to learn?'}function loadTruth(){$('inputBox').value='belief, suspicion, speculation, fact, truth, and knowledge must not be confused'}function loadReasoning(){$('inputBox').value='testing your reasoning? you can also learn from the side.'}function renderNeurons(){let html=arr(n().neurons).slice(0,11).map(x=>'<div><span class="pill">'+esc(x.neuron_id)+'</span>'+x.activation+'<div class="bar"><div class="fill" style="width:'+Math.round(Number(x.activation||0)*100)+'%"></div></div><span class="muted">'+esc(x.description)+'</span></div>').join('');$('neurons').innerHTML=html||'<span class="muted">none</span>'}function renderMotor(){let m=n().selected_motor_intention||{};$('motor').innerHTML='<div><b>'+esc(m.intention_kind||'none')+'</b></div><div>'+esc(m.desire||'')+'</div>'+arr(m.top_neurons).map(x=>'<span class="pill">'+esc(x.neuron_id)+': '+x.activation+'</span>').join('')}function renderDeltas(){let html=arr(n().learning_deltas).slice(0,12).map(d=>'<div><span class="pill">'+esc(d.target)+' '+d.delta+'</span><br><span class="muted">'+esc(d.reason)+'</span></div>').join('');$('deltas').innerHTML=html||'<span class="muted">none</span>'}function render(){bind();let msg=c().current_message||{};$('thought').innerHTML='<b>'+esc(msg.thought_kind||'no thought')+'</b><br>'+esc(msg.message||'No current message.');renderNeurons();renderMotor();renderDeltas();$('packet').textContent=JSON.stringify(n(),null,2);$('comm').textContent=JSON.stringify(c(),null,2)}bind();render();
</script></body></html>
