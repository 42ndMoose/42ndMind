<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>42ndMind Intention Formula Compiler Test</title><style>body{margin:0;background:#0f1115;color:#eef2ff;font:14px ui-monospace,Menlo,Consolas,monospace}header{padding:16px;background:#11141b;border-bottom:1px solid #2a3040}main{padding:12px}section{background:#171a21;border:1px solid #2a3040;border-radius:10px;padding:12px}pre{white-space:pre-wrap;background:#0d1016;border:1px solid #2a3040;border-radius:10px;padding:10px;overflow:auto;max-height:760px}.ok{color:#9dffb4}.bad{color:#ff8b8b}a{color:#9db6ff}</style></head><body><header><h1>42ndMind Intention Formula Compiler Test</h1><div>Tests compiled algebraic intention packets. Candidate only. No real-world intent attribution.</div></header><main><section><h2 id="summary">Running...</h2><div><a href="intention-formula-compiler.html?v=formula-1">formula compiler page</a></div><pre id="out"></pre></section></main><script src="src/kernel-intention-discovery-v0-1.js?v=intent-1"></script><script src="src/kernel-intention-refinement-v0-1.js?v=refine-1"></script><script src="src/kernel-intention-necessity-test-v0-1.js?v=necessity-1"></script><script src="src/kernel-intention-neighbor-lattice-v0-1.js?v=lattice-2"></script><script src="src/kernel-intention-lattice-invariance-benchmark-v0-1.js?v=invariance-2"></script><script src="src/kernel-intention-formula-compiler-v0-1.js?v=formula-1"></script><script>const tests=[];let packet=null;function add(n,f){tests.push({name:n,fn:f})}function assert(c,m){if(!c)throw new Error(m)}function arr(v){return Array.isArray(v)?v:[]}function byConcept(name){return arr(packet&&packet.compiled_formulas).find(f=>f.concept===name)}function l1(formula){return Number(arr(formula&&formula.shape_terms).reduce((s,t)=>s+Math.abs(Number(t.coefficient)||0),0).toFixed(6))}add('modules load',()=>{assert(window.KernelIntentionDiscoveryV01,'discovery missing');assert(window.KernelIntentionRefinementV01,'refinement missing');assert(window.KernelIntentionNecessityTestV01,'necessity missing');assert(window.KernelIntentionNeighborLatticeV01,'lattice missing');assert(window.KernelIntentionLatticeInvarianceBenchmarkV01,'invariance missing');assert(window.KernelIntentionFormulaCompilerV01,'compiler missing');assert(KernelIntentionFormulaCompilerV01.VERSION==='0.1.0','version wrong');assert(typeof KernelIntentionFormulaCompilerV01.runCompiler==='function','runCompiler missing')});add('doctrine keeps formulas candidate-only',()=>{const d=KernelIntentionFormulaCompilerV01.doctrine();assert(d.compiles_intention_formulas_not_claim_facts===true,'compiler doctrine missing');assert(d.no_real_world_intent_attribution===true,'attribution guard missing');assert(d.compiled_formulas_are_candidate_not_doctrine===true,'candidate-only guard missing');assert(d.force_intensity_outside_shape==='F = M · i','force equation doctrine missing');assert(d.belief_movement==='none','belief movement wrong')});add('compiler runs full stack',()=>{packet=KernelIntentionFormulaCompilerV01.runCompiler();assert(packet.ok===true,'packet not ok: '+JSON.stringify(packet.validation));assert(packet.source_summary.discovery_ok===true,'discovery not ok');assert(packet.source_summary.refinement_ok===true,'refinement not ok');assert(packet.source_summary.necessity_ok===true,'necessity not ok');assert(packet.source_summary.lattice_ok===true,'lattice not ok');assert(packet.source_summary.invariance_ok===true,'invariance not ok');assert(packet.compiled_formula_count===3,'expected 3 formulas');assert(byConcept('desire'),'missing desire');assert(byConcept('lying'),'missing lying');assert(byConcept('promise'),'missing promise');assert(packet.belief_movement==='none','packet moved belief')});add('compiled formulas preserve unit-total shape',()=>{arr(packet.compiled_formulas).forEach(f=>{assert(f.scope_total===1,f.concept+' scope not 1');assert(l1(f)===1,f.concept+' l1 not 1: '+l1(f));assert(f.symbolic_formula.includes('Σ|dimension_i| = 1'),f.concept+' missing unit-total symbol');assert(f.symbolic_formula.includes('F_'+f.concept),f.concept+' missing force equation');assert(f.review_status==='compiled_candidate_not_doctrine',f.concept+' promoted too early');assert(f.belief_movement==='none',f.concept+' moved belief')})});add('force terms stay outside shape',()=>{arr(packet.compiled_formulas).forEach(f=>{const shapeNames=new Set(arr(f.shape_terms).map(t=>t.dimension));arr(f.force_terms).forEach(force=>{assert(!shapeNames.has(force.dimension),f.concept+' force leaked into shape: '+force.dimension);assert(force.role==='force_intensity_outside_shape',f.concept+' force role wrong')});assert(arr(f.force_terms).length>=1,f.concept+' missing force terms')})});add('expected concept formulas compile',()=>{const lying=byConcept('lying');const desire=byConcept('desire');const promise=byConcept('promise');assert(arr(lying.core_terms).some(t=>t.dimension==='belief_assertion_mismatch'),'lying missing belief mismatch core');assert(arr(lying.core_terms).some(t=>t.dimension==='concealment_of_mismatch'),'lying missing concealment core');assert(arr(desire.core_terms).some(t=>t.dimension==='attainment_pull'),'desire missing attainment pull core');assert(arr(promise.core_terms).some(t=>t.dimension==='normative_obligation_creation'),'promise missing obligation core');assert(arr(promise.boundary_terms).some(t=>t.dimension==='condition_or_scope_boundary'),'promise missing scope boundary')});add('neighbor transitions and invariance status compile',()=>{arr(packet.compiled_formulas).forEach(f=>{assert(arr(f.neighbor_transitions).length>=1,f.concept+' missing neighbor transitions');assert(f.invariance_status&&typeof f.invariance_status.force_invariance_ok==='boolean',f.concept+' missing invariance status');assert(f.invariance_status.force_invariance_ok===true,f.concept+' force invariance not ok');assert(f.invariance_status.all_tested_cases_passed===true,f.concept+' tested cases not all passed');arr(f.neighbor_transitions).forEach(e=>{assert(e.candidate_status==='candidate_lattice_edge_not_doctrine',f.concept+' edge promoted');assert(e.belief_movement==='none',f.concept+' edge moved belief')})})});add('validation report is clean',()=>{assert(packet.validation&&packet.validation.ok===true,'validation not ok');assert(arr(packet.validation.errors).length===0,'validation has errors');packet.validation.validations.forEach(v=>{assert(v.ok===true,v.concept+' validation failed: '+v.errors.join(','));assert(v.shape_l1_total===1,v.concept+' validation l1 wrong');assert(v.force_term_count>=1,v.concept+' validation missing force term');assert(v.neighbor_transition_count>=1,v.concept+' validation missing transitions');assert(v.belief_movement==='none',v.concept+' validation moved belief')})});(async function run(){const results=[];for(const t of tests){try{await t.fn();results.push({name:t.name,passed:true})}catch(e){results.push({name:t.name,passed:false,error:e.message})}}const passed=results.filter(r=>r.passed).length;document.getElementById('summary').className=passed===tests.length?'ok':'bad';document.getElementById('summary').textContent=passed+'/'+tests.length+' passed';document.getElementById('out').textContent=JSON.stringify({packet_type:'42ndMind_intention_formula_compiler_test_report_v0_1',ok:passed===tests.length,compiled_formula_count:packet&&packet.compiled_formula_count,formulas:packet&&packet.compiled_formulas&&packet.compiled_formulas.map(f=>({concept:f.concept,l1:l1(f),symbolic_formula:f.symbolic_formula,force_equation:f.force_equation,force_terms:f.force_terms,neighbor_transition_count:f.neighbor_transitions.length,invariance_status:f.invariance_status,review_status:f.review_status})),validation:packet&&packet.validation,results},null,2)})();</script></body></html>
