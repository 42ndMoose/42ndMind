<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>42ndMind Epistemic Octahedron Language Alignment Test</title><style>body{margin:0;background:#0f1115;color:#eef2ff;font:14px ui-monospace,Menlo,Consolas,monospace}header{padding:16px;background:#11141b;border-bottom:1px solid #2a3040}main{padding:12px}section{background:#171a21;border:1px solid #2a3040;border-radius:10px;padding:12px}pre{white-space:pre-wrap;background:#0d1016;border:1px solid #2a3040;border-radius:10px;padding:10px;overflow:auto;max-height:760px}.ok{color:#9dffb4}.bad{color:#ff8b8b}a{color:#9db6ff}</style></head><body><header><h1>42ndMind Epistemic Octahedron Language Alignment Test</h1><div>Tests whether core octahedron semantics cohere with the current deterministic language-math kernel.</div></header><main><section><h2 id="summary">Running...</h2><div><a href="epistemic-octahedron-language-alignment.html?v=eoalign-1">alignment page</a></div><pre id="out"></pre></section></main><script src="src/kernel-intention-discovery-v0-1.js?v=intent-1"></script><script src="src/kernel-intention-refinement-v0-1.js?v=refine-1"></script><script src="src/kernel-intention-necessity-test-v0-1.js?v=necessity-1"></script><script src="src/kernel-intention-neighbor-lattice-v0-1.js?v=lattice-3"></script><script src="src/kernel-intention-lattice-invariance-benchmark-v0-1.js?v=invariance-2"></script><script src="src/kernel-intention-formula-compiler-v0-1.js?v=formula-1"></script><script src="src/kernel-intention-concept-expansion-loop-v0-1.js?v=expansion-2"></script><script src="src/kernel-intention-contradiction-refinement-loop-v0-1.js?v=contradiction-1"></script><script src="src/kernel-intention-formula-revision-engine-v0-1.js?v=revision-1"></script><script src="src/kernel-intention-canonical-formula-ledger-v0-1.js?v=ledger-1"></script><script src="src/kernel-intention-proof-output-v0-1.js?v=proof-1"></script><script src="src/kernel-intention-minimal-pair-library-v0-1.js?v=minpair-1"></script><script src="src/kernel-intention-dimension-splitting-v0-1.js?v=split-2"></script><script src="src/kernel-intention-coefficient-dimension-revision-engine-v0-1.js?v=codim-1"></script><script src="src/kernel-intention-canonical-formula-ledger-v0-1-1-patch.js?v=ledger-2"></script><script src="src/kernel-intention-formula-inspector-v0-1.js?v=inspect-1"></script><script src="src/epistemic-octahedron-language-alignment-v0-1.js?v=eoalign-1"></script><script>const tests=[];let packet=null;function add(n,f){tests.push({name:n,fn:f})}function assert(c,m){if(!c)throw new Error(m)}function arr(v){return Array.isArray(v)?v:[]}function states(){return arr(packet&&packet.state_validations)}function state(id){return states().find(s=>s.state_id===id)}add('modules load and doctrine matches octahedron alignment only',()=>{assert(window.EpistemicOctahedronLanguageAlignmentV01,'alignment module missing');assert(EpistemicOctahedronLanguageAlignmentV01.VERSION==='0.1.0','version wrong');assert(typeof EpistemicOctahedronLanguageAlignmentV01.runAlignment==='function','runAlignment missing');const d=EpistemicOctahedronLanguageAlignmentV01.doctrine();assert(d.tests_octahedron_semantics_against_language_math===true,'alignment doctrine missing');assert(d.null_origin_is_pre_philosophical_absence_not_collapse===true,'null doctrine missing');assert(d.active_surface_requires_l1_total_1===true,'surface doctrine missing');assert(d.maturity_peak_integrates_empathy_practicality_wisdom_knowledge_under_positive_stability===true,'maturity doctrine missing');assert(d.belief_movement==='none','belief movement wrong')});add('alignment runs against formula inspector and current kernel formulas',()=>{packet=EpistemicOctahedronLanguageAlignmentV01.runAlignment();assert(packet.ok===true,'packet not ok: '+JSON.stringify(packet.validation));assert(packet.source_formula_inspector_ok===true,'formula inspector not ok');assert(packet.source_inspection_count===11,'expected 11 formula inspections');assert(packet.kernel_compatibility.all_current_formulas_l1_1===true,'formula L1 compatibility failed');assert(packet.kernel_compatibility.all_force_terms_outside_shape===true,'force compatibility failed');assert(packet.belief_movement==='none','packet moved belief')});add('six canonical octahedron state tests are present',()=>{assert(states().length===6,'expected 6 canonical states');assert(packet.validation.checks.six_canonical_state_tests===true,'six-state check failed');states().forEach(s=>assert(s.ok===true,s.state_id+' failed: '+arr(s.errors).join(',')))});add('null origin is l1 0 and not collapse',()=>{const n=state('null_origin');const c=state('collapse_vertex');assert(n&&n.l1_total===0,'null l1 not 0');assert(n.zone==='pre_philosophical_absence','null zone wrong');assert(c&&c.l1_total===1,'collapse l1 not 1');assert(c.zone==='maximal_negative_epistemic_stability','collapse zone wrong');assert(packet.validation.checks.null_and_collapse_not_conflated===true,'null/collapse conflated')});add('active states preserve l1 surface',()=>{states().filter(s=>s.state_id!=='null_origin').forEach(s=>assert(s.l1_total===1,s.state_id+' l1 not 1'));assert(packet.validation.checks.active_states_l1_1===true,'active l1 check failed')});add('equator is y0 net-zero convergence boundary',()=>{const e=state('equator_empathy_knowledge_boundary');assert(e&&e.point.y===0,'equator y not 0');assert(e.zone==='net_zero_epistemic_convergence_boundary','equator zone wrong');assert(packet.validation.checks.equator_is_y0_boundary===true,'equator check failed')});add('maturity and collapse are opposite y vertices',()=>{const m=state('maturity_peak');const c=state('collapse_vertex');assert(m&&m.point.y===1,'maturity y not 1');assert(m.zone==='integrated_positive_epistemic_stability','maturity zone wrong');assert(c&&c.point.y===-1,'collapse y not -1');assert(c.zone==='maximal_negative_epistemic_stability','collapse zone wrong');assert(packet.validation.checks.maturity_peak_is_positive_y_vertex===true,'maturity vertex check failed');assert(packet.validation.checks.collapse_vertex_is_negative_y_vertex===true,'collapse vertex check failed')});add('kernel compatibility preserves candidate-only formula invariants',()=>{assert(packet.validation.checks.language_formulas_preserve_l1===true,'formula l1 invariant failed');assert(packet.validation.checks.force_terms_remain_outside_shape===true,'force outside invariant failed');assert(packet.validation.checks.candidate_only_not_promoted===true,'candidate-only invariant failed');assert(packet.validation.checks.belief_movement_none===true,'belief movement check failed');assert(arr(packet.validation.errors).length===0,'validation errors present: '+packet.validation.errors.join(','))});(async function run(){const results=[];for(const t of tests){try{await t.fn();results.push({name:t.name,passed:true})}catch(e){results.push({name:t.name,passed:false,error:e.message})}}const passed=results.filter(r=>r.passed).length;document.getElementById('summary').className=passed===tests.length?'ok':'bad';document.getElementById('summary').textContent=passed+'/'+tests.length+' passed';document.getElementById('out').textContent=JSON.stringify({packet_type:'42ndMind_epistemic_octahedron_language_alignment_test_report_v0_1',ok:passed===tests.length,source_formula_inspector_ok:packet&&packet.source_formula_inspector_ok,source_inspection_count:packet&&packet.source_inspection_count,state_validations:states().map(s=>({state_id:s.state_id,point:s.point,l1_total:s.l1_total,zone:s.zone,expected_zone:s.expected_zone,ok:s.ok,belief_movement:s.belief_movement})),kernel_compatibility:packet&&packet.kernel_compatibility,validation:packet&&packet.validation,results},null,2)})();</script></body></html>
