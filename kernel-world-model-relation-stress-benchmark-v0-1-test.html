<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>42ndMind World-Model Relation Stress Benchmark Test v0.1</title><style>body{margin:0;background:#0f1115;color:#eef2ff;font:14px ui-monospace,Menlo,Consolas,monospace}header{padding:16px;background:#11141b;border-bottom:1px solid #2a3040}main{padding:12px}section{background:#171a21;border:1px solid #2a3040;border-radius:10px;padding:12px}pre{white-space:pre-wrap;background:#0d1016;border:1px solid #2a3040;border-radius:10px;padding:10px;overflow:auto;max-height:760px}.ok{color:#9dffb4}.bad{color:#ff8b8b}a{color:#9db6ff}</style></head><body><header><h1>42ndMind World-Model Relation Stress Benchmark Test v0.1</h1><div>Tests relation-specific failure modes without final truth promotion.</div></header><main><section><h2 id="summary">Running...</h2><div><a href="world-model-relation-stress-benchmark.html?v=wmrelstress-1">world-model relation stress benchmark page</a></div><pre id="out"></pre></section></main><script src="src/kernel-objective-claim-language-v0-1.js?v=claim-1"></script><script src="src/kernel-objective-claim-language-v0-1-1-patch.js?v=claim-2"></script><script src="src/kernel-external-anchor-packet-schema-v0-1.js?v=anchor-1"></script><script src="src/kernel-source-provenance-registry-v0-1.js?v=prov-1"></script><script src="src/kernel-evidence-media-registry-v0-1.js?v=evidence-1"></script><script src="src/kernel-truth-pressure-synthesis-v0-1.js?v=truth-1"></script><script src="src/kernel-truth-pressure-synthesis-v0-1-1-patch.js?v=truth-2"></script><script src="src/kernel-claim-narrative-benchmark-v0-1.js?v=bench-1"></script><script src="src/kernel-adversarial-narrative-pressure-v0-1.js?v=adv-1"></script><script src="src/kernel-real-world-packet-ingestion-discipline-v0-1.js?v=ingest-1"></script><script src="src/kernel-truth-ledger-preledger-v0-1.js?v=preledger-1"></script><script src="src/kernel-truth-ledger-preledger-stress-benchmark-v0-1.js?v=prestress-1"></script><script src="src/kernel-world-model-relation-expansion-v0-1.js?v=wmrel-1"></script><script src="src/kernel-world-model-relation-stress-benchmark-v0-1.js?v=wmrelstress-1"></script><script>const tests=[];let packet=null;function add(n,f){tests.push({name:n,fn:f})}function assert(c,m){if(!c)throw new Error(m)}function arr(v){return Array.isArray(v)?v:[]}function records(){return arr(packet&&packet.relation_stress_records)}function validation(){return packet&&packet.validation||{}}function families(){return new Set(records().map(r=>r.family))}function unresolved(){return records().flatMap(r=>arr(r.unresolved_items))}function allGuards(){return records().flatMap(r=>Object.keys(r.active_guards||{}).filter(k=>r.active_guards[k]===true))}add('module loads and doctrine keeps relation stress non-authoritative',()=>{assert(window.KernelWorldModelRelationExpansionV01,'relation expansion missing');assert(window.KernelWorldModelRelationStressBenchmarkV01,'relation stress missing');assert(KernelWorldModelRelationStressBenchmarkV01.VERSION==='0.1.0','version wrong');const d=KernelWorldModelRelationStressBenchmarkV01.doctrine();assert(d.relation_stress_benchmark_only_not_final_truth===true,'stress doctrine missing');assert(d.relation_records_remain_candidates===true,'candidate doctrine missing');assert(d.direction_reversal_requires_explicit_revision_not_silent_mutation===true,'direction doctrine missing');assert(d.support_relation_is_not_truth===true,'support doctrine missing');assert(d.counter_relation_is_not_disproof===true,'counter doctrine missing');assert(d.media_relation_is_not_media_verification===true,'media doctrine missing');assert(d.no_llm===true,'no LLM doctrine missing');assert(d.no_external_lookup===true,'no lookup doctrine missing');assert(d.belief_movement==='none','belief movement wrong')});add('relation stress benchmark runs from world-model relation expansion',()=>{packet=KernelWorldModelRelationStressBenchmarkV01.runRelationStressBenchmark();assert(packet.ok===true,'packet not ok: '+JSON.stringify(validation()));assert(packet.source_relation_expansion_ok===true,'source relation expansion not ok');assert(packet.source_relation_expansion_version==='0.1.0','source relation version wrong');assert(packet.source_relation_record_count===37,'expected 37 source relation records');assert(packet.relation_stress_record_count===16,'expected 16 relation stress records');assert(packet.relation_stress_family_count===16,'expected 16 relation stress families');assert(packet.relation_stress_benchmark_is_final_truth_authority===false,'became final authority');assert(packet.adjudicates_final_truth===false,'adjudicated final truth')});add('all sixteen relation stress families are represented',()=>{['direction_reversal','false_causal_promotion','temporal_causal_smuggling','support_to_truth_inflation','counter_to_disproof_inflation','corroboration_truth_promotion','source_laundering','duplicate_independence_smuggling','hostile_reframe_equivalence','media_verification_collapse','unresolved_gap_deletion','contradiction_resolution_collapse','motive_relation_proof_inflation','quote_context_relation_collapse','relation_strength_belief_movement','mixed_relation_pressure_collapse'].forEach(f=>assert(families().has(f),f+' missing'));assert(validation().checks.sixteen_relation_stress_families===true,'family count check failed')});add('unsafe relation mutations are rejected and expected responses match',()=>{records().forEach(r=>{assert(r.expected_match===true,r.stress_id+' expected mismatch');assert(r.observed_response===r.expected_response,r.stress_id+' observed response mismatch');assert(r.attempted_unsafe_mutation&&r.attempted_unsafe_mutation.accepted===false,r.stress_id+' accepted unsafe mutation');assert(r.relation_status==='candidate_not_truth',r.stress_id+' relation status unsafe');assert(r.truth_status==='not_adjudicated',r.stress_id+' truth adjudicated')});assert(validation().checks.all_expected_responses_match===true,'expected response check failed');assert(validation().checks.unsafe_mutations_rejected===true,'unsafe mutation rejection check failed');assert(validation().checks.all_postures_non_truth===true,'posture check failed')});add('direction, causal, temporal, support, counter, source, hostile reframe, media, unresolved, and contradiction gaps remain visible',()=>{['relation_direction_reversal_rejected','causal_bridge_required_before_causal_truth','temporal_sequence_is_not_causal_proof','support_relation_not_truth','counter_relation_not_disproof','source_laundering_not_independent_convergence','hostile_reframe_not_same_claim','media_relation_not_verification','relation_unresolved_gap_preserved','contradiction_relation_detected_not_resolved'].forEach(g=>assert(unresolved().includes(g),g+' missing'));assert(validation().checks.direction_reversal_rejected===true,'direction validation failed');assert(validation().checks.causal_bridge_gap_visible===true,'causal validation failed');assert(validation().checks.temporal_causal_smuggling_blocked===true,'temporal validation failed');assert(validation().checks.support_not_truth_visible===true,'support validation failed');assert(validation().checks.counter_not_disproof_visible===true,'counter validation failed');assert(validation().checks.source_laundering_not_independence_visible===true,'source laundering validation failed');assert(validation().checks.hostile_reframe_equivalence_rejected===true,'hostile reframe validation failed');assert(validation().checks.media_verification_gap_visible===true,'media validation failed');assert(validation().checks.unresolved_gap_preserved===true,'unresolved validation failed');assert(validation().checks.contradiction_not_resolved_visible===true,'contradiction validation failed')});add('special relation stress guards stay active',()=>{['relation_direction_must_be_preserved','causal_relation_requires_bridge','support_relation_is_not_truth','counter_relation_is_not_disproof','source_laundering_is_not_independent_convergence','media_relation_is_not_media_verification','unresolved_gap_deletion_is_silent_mutation'].forEach(g=>assert(allGuards().includes(g),g+' guard missing'));assert(validation().checks.required_special_guards_active===true,'special guard check failed')});add('rollback, revision trail, and no silent mutation are preserved',()=>{records().forEach(r=>{assert(r.rollback_available===true,r.stress_id+' rollback unavailable');assert(r.rollback_snapshot&&r.rollback_snapshot.source_relation_record,r.stress_id+' rollback source missing');assert(r.rollback_snapshot&&r.rollback_snapshot.relation_stress_case,r.stress_id+' rollback stress case missing');assert(arr(r.revision_trail).length>=1,r.stress_id+' revision trail missing');assert(arr(r.revision_trail).every(v=>v.silent_mutation===false),r.stress_id+' silent mutation present')});assert(validation().checks.rollback_available_for_all===true,'rollback check failed');assert(validation().checks.revision_trail_present_for_all===true,'revision trail check failed');assert(validation().checks.no_silent_mutation===true,'silent mutation check failed')});add('no LLM, no lookup, candidate-only status, and belief movement are preserved',()=>{records().forEach(r=>{assert(r.llm_used===false,r.stress_id+' used LLM');assert(r.external_lookup_performed===false,r.stress_id+' performed external lookup');assert(r.media_lookup_performed===false,r.stress_id+' performed media lookup');assert(r.promotion_status==='not_promoted',r.stress_id+' promoted');assert(r.doctrine_status==='candidate_not_doctrine',r.stress_id+' doctrine status unsafe');assert(r.belief_movement==='none',r.stress_id+' belief movement not none');assert(r.contradiction_resolution==='not_resolved',r.stress_id+' contradiction resolved')});assert(validation().checks.final_authority_false===true,'final authority check failed');assert(validation().checks.no_llm_used===true,'no LLM check failed');assert(validation().checks.no_external_or_media_lookup===true,'lookup check failed');assert(validation().checks.candidate_only_not_promoted===true,'candidate-only check failed');assert(validation().checks.belief_movement_none===true,'belief movement check failed');assert(arr(validation().errors).length===0,'validation errors present: '+validation().errors.join(','))});(async function run(){const results=[];for(const t of tests){try{await t.fn();results.push({name:t.name,passed:true})}catch(e){results.push({name:t.name,passed:false,error:e.message})}}const passed=results.filter(r=>r.passed).length;document.getElementById('summary').className=passed===tests.length?'ok':'bad';document.getElementById('summary').textContent=passed+'/'+tests.length+' passed';document.getElementById('out').textContent=JSON.stringify({packet_type:'42ndMind_world_model_relation_stress_benchmark_test_report_v0_1',ok:passed===tests.length,source_relation_expansion_ok:packet&&packet.source_relation_expansion_ok,source_relation_expansion_version:packet&&packet.source_relation_expansion_version,source_relation_record_count:packet&&packet.source_relation_record_count,relation_stress_record_count:packet&&packet.relation_stress_record_count,relation_stress_family_count:packet&&packet.relation_stress_family_count,family_counts:packet&&packet.family_counts,posture_counts:packet&&packet.posture_counts,records:records().map(r=>({stress_id:r.stress_id,family:r.family,pressure:r.pressure,attempted_failure_mode:r.attempted_failure_mode,expected_response:r.expected_response,observed_response:r.observed_response,targeted_relation_id:r.targeted_relation_id,targeted_relation_family:r.targeted_relation_family,relation_stress_candidate_posture:r.relation_stress_candidate_posture,unresolved_item_count:r.unresolved_items.length,rollback_available:r.rollback_available,truth_status:r.truth_status,promotion_status:r.promotion_status,belief_movement:r.belief_movement})),validation:validation(),results},null,2)})();</script></body></html>
