<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>42ndMind Intention Dimension Splitting Test</title><style>body{margin:0;background:#0f1115;color:#eef2ff;font:14px ui-monospace,Menlo,Consolas,monospace}header{padding:16px;background:#11141b;border-bottom:1px solid #2a3040}main{padding:12px}section{background:#171a21;border:1px solid #2a3040;border-radius:10px;padding:12px}pre{white-space:pre-wrap;background:#0d1016;border:1px solid #2a3040;border-radius:10px;padding:10px;overflow:auto;max-height:760px}.ok{color:#9dffb4}.bad{color:#ff8b8b}a{color:#9db6ff}</style></head><body><header><h1>42ndMind Intention Dimension Splitting Test</h1><div>Tests candidate dimension splitting from minimal-pair pressure. Source formulas remain intact. Candidate only.</div></header><main><section><h2 id="summary">Running...</h2><div><a href="intention-dimension-splitting.html?v=split-1">dimension splitting page</a></div><pre id="out"></pre></section></main><script src="src/kernel-intention-discovery-v0-1.js?v=intent-1"></script><script src="src/kernel-intention-refinement-v0-1.js?v=refine-1"></script><script src="src/kernel-intention-necessity-test-v0-1.js?v=necessity-1"></script><script src="src/kernel-intention-neighbor-lattice-v0-1.js?v=lattice-3"></script><script src="src/kernel-intention-lattice-invariance-benchmark-v0-1.js?v=invariance-2"></script><script src="src/kernel-intention-formula-compiler-v0-1.js?v=formula-1"></script><script src="src/kernel-intention-concept-expansion-loop-v0-1.js?v=expansion-2"></script><script src="src/kernel-intention-contradiction-refinement-loop-v0-1.js?v=contradiction-1"></script><script src="src/kernel-intention-formula-revision-engine-v0-1.js?v=revision-1"></script><script src="src/kernel-intention-canonical-formula-ledger-v0-1.js?v=ledger-1"></script><script src="src/kernel-intention-proof-output-v0-1.js?v=proof-1"></script><script src="src/kernel-intention-minimal-pair-library-v0-1.js?v=minpair-1"></script><script src="src/kernel-intention-dimension-splitting-v0-1.js?v=split-1"></script><script>const tests=[];let packet=null;function add(n,f){tests.push({name:n,fn:f})}function assert(c,m){if(!c)throw new Error(m)}function arr(v){return Array.isArray(v)?v:[]}function candidates(){return arr(packet&&packet.split_candidates)}function groups(){return arr(packet&&packet.concept_groups)}add('modules load and doctrine is split-only',()=>{assert(window.KernelIntentionDimensionSplittingV01,'dimension splitting missing');assert(KernelIntentionDimensionSplittingV01.VERSION==='0.1.0','version wrong');assert(typeof KernelIntentionDimensionSplittingV01.runDimensionSplitting==='function','runDimensionSplitting missing');const d=KernelIntentionDimensionSplittingV01.doctrine();assert(d.proposes_dimension_splits_from_minimal_pair_pressure===true,'split pressure doctrine missing');assert(d.split_candidates_are_not_doctrine===true,'candidate guard missing');assert(d.no_source_formula_mutation===true,'source mutation guard missing');assert(d.old_dimension_mass_is_redistributed_not_inflated===true,'mass redistribution guard missing');assert(d.force_intensity_outside_shape==='F = M · i','force guard missing');assert(d.belief_movement==='none','belief movement wrong')});add('dimension splitting runs from minimal-pair library and ledger',()=>{packet=KernelIntentionDimensionSplittingV01.runDimensionSplitting();assert(packet.ok===true,'packet not ok: '+JSON.stringify(packet.validation));assert(packet.source_minimal_pair_ok===true,'source minimal pair not ok');assert(packet.source_minimal_pair_count===110,'expected 110 source minimal pairs');assert(packet.source_ledger_ok===true,'source ledger not ok');assert(packet.source_ledger_record_count===11,'expected 11 source ledger records');assert(packet.belief_movement==='none','packet moved belief')});add('eleven concepts and fifty-five split candidates are produced',()=>{assert(packet.concept_count===11,'expected 11 concepts');assert(packet.split_candidate_count===55,'expected 55 split candidates');assert(groups().length===11,'expected 11 groups');assert(candidates().length===55,'expected 55 candidate rows');assert(packet.validation.checks.eleven_concepts===true,'eleven concept check failed');assert(packet.validation.checks.fifty_five_split_candidates===true,'55 split check failed')});add('each concept has five split candidates and ten pressure pairs',()=>{groups().forEach(g=>{assert(g.split_candidate_count===5,g.concept+' split count wrong: '+g.split_candidate_count);assert(g.pressure_pair_count===10,g.concept+' pressure count wrong: '+g.pressure_pair_count);assert(g.all_revised_l1_totals_equal_1===true,g.concept+' l1 group failed');assert(g.force_terms_outside_shape===true,g.concept+' force group failed');assert(g.belief_movement==='none',g.concept+' moved belief')});assert(packet.validation.checks.five_splits_per_concept===true,'five splits per concept check failed')});add('split children redistribute parent coefficient without mass inflation',()=>{candidates().forEach(c=>{assert(arr(c.child_terms).length===2,c.split_id+' expected 2 children');assert(c.source_l1_total===1,c.split_id+' source l1 wrong: '+c.source_l1_total);assert(c.revised_l1_total===1,c.split_id+' revised l1 wrong: '+c.revised_l1_total);assert(c.mass_change===0,c.split_id+' mass changed: '+c.mass_change);assert(c.revised_symbolic_formula&&c.revised_symbolic_formula.includes('Σ|dimension_i| = 1'),c.split_id+' missing unit-total formula');arr(c.child_terms).forEach(child=>{assert(child.parent_dimension===c.parent_dimension,c.split_id+' child parent mismatch');assert(child.belief_movement==='none',c.split_id+' child moved belief')})});assert(packet.validation.checks.all_source_l1_totals_equal_1===true,'source l1 check failed');assert(packet.validation.checks.all_revised_l1_totals_equal_1===true,'revised l1 check failed');assert(packet.validation.checks.no_mass_inflation===true,'mass inflation check failed')});add('force terms remain outside revised shape',()=>{candidates().forEach(c=>assert(c.force_terms_outside_shape===true,c.split_id+' force leaked into revised shape'));assert(packet.validation.checks.force_terms_outside_shape===true,'packet force check failed')});add('source formulas remain intact and rollback data is present',()=>{candidates().forEach(c=>{assert(c.action_status==='split_candidate_not_applied',c.split_id+' split applied too early');assert(c.source_formula_snapshot&&arr(c.source_formula_snapshot.shape_terms).length>0,c.split_id+' source snapshot missing');assert(c.rollback_available===true,c.split_id+' rollback missing');assert(c.rollback_target&&c.rollback_target.restore_parent_dimension===c.parent_dimension,c.split_id+' rollback target wrong')});assert(packet.validation.checks.rollback_data_present===true,'rollback check failed')});add('candidate-only status and belief movement are preserved',()=>{candidates().forEach(c=>{assert(c.promotion_status==='not_promoted',c.split_id+' promoted');assert(c.doctrine_status==='candidate_not_doctrine',c.split_id+' doctrine status wrong');assert(c.belief_movement==='none',c.split_id+' moved belief')});assert(packet.validation.checks.candidate_only_not_promoted===true,'candidate-only check failed');assert(packet.validation.checks.belief_movement_none===true,'belief movement check failed');assert(arr(packet.validation.errors).length===0,'validation errors present: '+packet.validation.errors.join(','))});(async function run(){const results=[];for(const t of tests){try{await t.fn();results.push({name:t.name,passed:true})}catch(e){results.push({name:t.name,passed:false,error:e.message})}}const passed=results.filter(r=>r.passed).length;document.getElementById('summary').className=passed===tests.length?'ok':'bad';document.getElementById('summary').textContent=passed+'/'+tests.length+' passed';document.getElementById('out').textContent=JSON.stringify({packet_type:'42ndMind_intention_dimension_splitting_test_report_v0_1',ok:passed===tests.length,source_minimal_pair_count:packet&&packet.source_minimal_pair_count,source_ledger_record_count:packet&&packet.source_ledger_record_count,concept_count:packet&&packet.concept_count,split_candidate_count:packet&&packet.split_candidate_count,concept_groups:groups().map(g=>({concept:g.concept,split_candidate_count:g.split_candidate_count,pressure_pair_count:g.pressure_pair_count,all_revised_l1_totals_equal_1:g.all_revised_l1_totals_equal_1,force_terms_outside_shape:g.force_terms_outside_shape})),validation:packet&&packet.validation,results},null,2)})();</script></body></html>
