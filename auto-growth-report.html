<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Auto Growth Report</title><style>body{margin:0;background:#0f1115;color:#eef2ff;font:14px ui-monospace,Menlo,Consolas,monospace}header{padding:16px;background:#11141b;border-bottom:1px solid #2a3040}main{padding:12px;display:grid;grid-template-columns:360px 1fr;gap:12px}section{background:#171a21;border:1px solid #2a3040;border-radius:10px;padding:12px}button{background:#25345c;color:#eef2ff;border:1px solid #3f5592;padding:8px 10px;border-radius:8px;margin:3px;cursor:pointer}pre{white-space:pre-wrap;background:#0d1016;border:1px solid #2a3040;border-radius:10px;padding:10px;overflow:auto;max-height:760px}.ok{color:#9dffb4}.bad{color:#ff8b8b}a{color:#9db6ff}@media(max-width:900px){main{grid-template-columns:1fr}}</style></head><body><header><h1>Auto Growth Report</h1><div>Copyable staged report from the auto-growth controller. Report only. No repo write.</div></header><main><section><a href="index.html">main</a> · <a href="kernel-auto-growth-report-v0-1-test.html?v=0.1.0">test</a> · <a href="auto-growth-controller.html">controller</a><p>Decision: <b id="decision">not run</b></p><p>Current: <b id="current">none</b></p><p>Next: <b id="next">none</b></p><p>Entries: <b id="entries">0</b></p><button onclick="runReport()">Run report</button><button onclick="showSummary()">Summary</button><button onclick="showSeed()">Seed JSON</button><button onclick="showMarkdown()">Markdown</button><button onclick="copyOutput()">Copy output</button></section><section><h2>Output</h2><pre id="out">No output yet.</pre></section></main><script src="src/kernel-semantic-corpus-v0-1.js?v=0.1.0"></script><script src="src/kernel-semantic-corpus-combiner-v0-1.js?v=language-growth-1"></script><script src="src/kernel-semantic-pressure-registry-v0-1.js?v=0.1.0"></script><script src="src/kernel-semantic-pressure-registry-v0-1-1-patch.js?v=coordination-1"></script><script src="src/kernel-semantic-vector-compressor-v0-1.js?v=0.1.0"></script><script src="src/kernel-unit-total-nested-shape-v0-1.js?v=0.1.0"></script><script src="src/kernel-objective-language-shape-bridge-v0-1.js?v=0.1.0"></script><script src="src/kernel-objective-language-invariance-benchmark-v0-1.js?v=0.1.0"></script><script src="src/kernel-objective-language-knowledge-growth-v0-1.js?v=0.1.0"></script><script src="src/kernel-auto-growth-controller-v0-1.js?v=0.1.0"></script><script src="src/kernel-auto-growth-report-v0-1.js?v=0.1.0"></script><script>let packet=null,last='';function setOut(x){last=typeof x==='string'?x:JSON.stringify(x,null,2);out.textContent=last;update()}function update(){decision.textContent=packet&&packet.decision||'not run';decision.className=packet&&packet.ok?'ok':'bad';current.textContent=packet&&packet.current_baseline||'none';next.textContent=packet&&packet.proposed_next_baseline||'none';entries.textContent=packet&&packet.proposed_entry_count||0}async function runReport(){try{packet=await KernelAutoGrowthReportV01.run({max_entries:16});setOut(packet)}catch(e){setOut({ok:false,error:e.message,belief_movement:'none'})}}function showSummary(){if(!packet)return runReport();setOut({decision:packet.decision,current_baseline:packet.current_baseline,proposed_next_baseline:packet.proposed_next_baseline,entry_count:packet.proposed_entry_count,gates:packet.gates,belief_movement:'none'})}function showSeed(){if(!packet)return runReport();setOut(packet.staged_seed_json)}function showMarkdown(){if(!packet)return runReport();setOut(packet.markdown_report)}async function copyOutput(){try{await navigator.clipboard.writeText(last);out.textContent='Copied.\n\n'+last}catch(e){}}runReport();</script></body></html>
