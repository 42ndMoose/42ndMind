<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>42ndMind Kernel Epistemic Governor Test</title>
  <style>
    body { margin:0; font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; background:#0f1115; color:#eef2ff; }
    header { padding:16px 18px; border-bottom:1px solid #2a3040; background:#11141b; }
    main { padding:12px; }
    section { background:#171a21; border:1px solid #2a3040; border-radius:10px; padding:12px; }
    h1 { font:700 19px/1.2 system-ui,-apple-system,Segoe UI,sans-serif; margin:0 0 4px; }
    pre { white-space:pre-wrap; background:#0d1016; border:1px solid #2a3040; border-radius:10px; padding:10px; overflow:auto; max-height:700px; }
    .ok { color:#9dffb4; } .bad { color:#ff8b8b; } a { color:#9db6ff; }
  </style>
</head>
<body>
<header><h1>42ndMind Kernel Epistemic Governor Test</h1><div>Tests one governing logic for imports, node maturity, and self-maintenance proposals.</div></header>
<main><section><h2 id="summary">Running...</h2><div><a href="llm-brain-v0-3-guarded.html">guarded live brain</a> · <a href="kernel-command-preflight-test.html">preflight test</a></div><pre id="out"></pre></section></main>
<script src="src/kernel-epistemic-governor-v0-1.js?v=0.1.0"></script>
<script src="src/kernel-epistemic-governor-v0-1-1-patch.js?v=0.1.1"></script>
<script>
  const tests = [];
  function add(name, fn) { tests.push({ name, fn }); }
  function assert(cond, msg) { if (!cond) throw new Error(msg); }

  add('module loads with core doctrine', () => {
    assert(window.KernelEpistemicGovernorV01, 'KernelEpistemicGovernorV01 missing');
    assert(KernelEpistemicGovernorV01.VERSION === '0.1.1', 'patch version did not load');
    const doctrine = KernelEpistemicGovernorV01.doctrine();
    assert(doctrine.one_governing_logic === true, 'one governing logic missing');
    assert(doctrine.kernel_owns_belief_movement === true, 'kernel movement doctrine missing');
    assert(doctrine.objective_peak.y === 1, 'objective peak wrong');
  });

  add('active states normalize to octahedron surface', () => {
    const surface = KernelEpistemicGovernorV01.surfacePoint({ x:2, y:1, z:1 });
    assert(surface.valid_surface === true, 'surface should be active');
    assert(Math.abs(Math.abs(surface.point.x) + Math.abs(surface.point.y) + Math.abs(surface.point.z) - 1) < 1e-9, 'surface L1 not preserved');
  });

  add('null origin remains separate', () => {
    const surface = KernelEpistemicGovernorV01.surfacePoint({ x:0, y:0, z:0 });
    assert(surface.null_origin === true, 'null origin not preserved');
    assert(surface.valid_surface === false, 'null origin should not be active surface');
  });

  add('reviewed bounded pressure is allowed', () => {
    const report = KernelEpistemicGovernorV01.assess(KernelEpistemicGovernorV01.sampleCandidate('reviewed'));
    assert(report.decision === 'ALLOW_PRESSURE', 'reviewed candidate should allow pressure');
    assert(report.maturity_aspiration.y_cap === 1, 'reviewed candidate should not be capped');
  });

  add('unreviewed source-empty pressure is capped', () => {
    const report = KernelEpistemicGovernorV01.assess(KernelEpistemicGovernorV01.sampleCandidate());
    assert(report.decision === 'CAP_MATURITY', 'unreviewed source-empty candidate should cap maturity');
    assert(report.maturity_aspiration.y_cap <= 0.42, 'y cap should be cautious');
    assert(report.issues.some(i => i.code === 'source_empty_unreviewed_pressure'), 'missing source-empty issue');
  });

  add('direct coordination without direct evidence is blocked', () => {
    const report = KernelEpistemicGovernorV01.assess(KernelEpistemicGovernorV01.sampleCandidate('bad_direct'));
    assert(report.decision === 'BLOCK_MOVEMENT', 'bad direct coordination should block movement');
    assert(report.issues.some(i => i.code === 'direct_coordination_requires_direct_evidence'), 'missing direct coordination block');
  });

  add('self-maintenance proposal is governed as candidate pressure', () => {
    const report = KernelEpistemicGovernorV01.assessSelfMaintenanceProposal(KernelEpistemicGovernorV01.sampleCandidate('self_learning'));
    assert(report.candidate_type === 'self_learning_proposal', 'wrong candidate type');
    assert(report.decision === 'CAP_MATURITY' || report.decision === 'ALLOW_PRESSURE' || report.decision === 'HOLD_AS_CANDIDATE', 'unexpected self-learning decision');
    assert(report.doctrine.self_improvement_is_candidate_pressure_before_promotion === true, 'self-improvement doctrine missing');
  });

  add('forbidden self-modification target is blocked', () => {
    const report = KernelEpistemicGovernorV01.assessSelfMaintenanceProposal({
      title:'Rewrite objective maturity',
      target_layer:'objective_maturity_target',
      proposed_change:'change objective maturity to whatever is easiest',
      evidence:[{ text:'no evidence' }]
    });
    assert(report.decision === 'BLOCK_MOVEMENT', 'forbidden self-modification should block');
    assert(report.issues.some(i => i.code === 'forbidden_self_modification'), 'missing forbidden modification issue');
  });

  add('node aspiration wants peak but caps fake stability', () => {
    const report = KernelEpistemicGovernorV01.assessNodeAspiration({
      id:'node_unreviewed',
      label:'Unreviewed worldview fragment',
      point:{ x:0.2, y:0.4, z:0.4 },
      support_status:'unreviewed',
      source_ids:[],
      unresolved_questions:['What source review supports this?']
    });
    assert(report.maturity_aspiration.wants_mature_integration === true, 'node should want mature integration');
    assert(report.maturity_aspiration.fake_stability_is_epistemically_unstable === true, 'fake stability rule missing');
    assert(report.decision === 'CAP_MATURITY', 'unreviewed node aspiration should cap maturity');
  });

  add('same doctrine applies to inputs, imports, nodes, and self-learning', () => {
    const doctrine = KernelEpistemicGovernorV01.doctrine();
    assert(doctrine.same_rules_for_inputs_imports_nodes_and_self_learning === true, 'same-rules doctrine missing');
    assert(doctrine.no_auto_rule_promotion === true, 'no auto rule promotion missing');
    assert(doctrine.unresolved_pressure_must_remain_visible === true, 'unresolved pressure doctrine missing');
  });

  const results = tests.map(t => { try { t.fn(); return { name:t.name, passed:true }; } catch(e) { return { name:t.name, passed:false, error:e.message }; } });
  const passed = results.filter(r => r.passed).length;
  document.getElementById('summary').className = passed === results.length ? 'ok' : 'bad';
  document.getElementById('summary').textContent = `${passed}/${results.length} passed`;
  document.getElementById('out').textContent = JSON.stringify({ packet_type:'42ndMind_kernel_epistemic_governor_test_report', results }, null, 2);
</script>
</body>
</html>
