<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>42ndMind Raw Messy Language Intake Receptor Test v0.1</title><style>body{margin:0;background:#0f1115;color:#eef2ff;font:14px ui-monospace,Menlo,Consolas,monospace}header{padding:16px;background:#11141b;border-bottom:1px solid #2a3040}main{padding:12px}section{background:#171a21;border:1px solid #2a3040;border-radius:10px;padding:12px}pre{white-space:pre-wrap;background:#0d1016;border:1px solid #2a3040;border-radius:10px;padding:10px;overflow:auto;max-height:780px}.ok{color:#9dffb4}.bad{color:#ff8b8b}a{color:#9db6ff}</style></head><body><header><h1>42ndMind Raw Messy Language Intake Receptor Test v0.1</h1><div>Tests arbitrary messy text entering the unified runtime as candidate interpretations, not an external filter.</div></header><main><section><h2 id="summary">Running...</h2><div><a href="raw-messy-language-intake-receptor.html?v=rawintake-1">raw messy language intake receptor page</a></div><pre id="out"></pre></section></main><script src="src/kernel-objective-claim-language-v0-1.js?v=claim-1"></script><script src="src/kernel-objective-claim-language-v0-1-1-patch.js?v=claim-2"></script><script src="src/kernel-external-anchor-packet-schema-v0-1.js?v=anchor-1"></script><script src="src/kernel-source-provenance-registry-v0-1.js?v=prov-1"></script><script src="src/kernel-evidence-media-registry-v0-1.js?v=evidence-1"></script><script src="src/kernel-truth-pressure-synthesis-v0-1.js?v=truth-1"></script><script src="src/kernel-truth-pressure-synthesis-v0-1-1-patch.js?v=truth-2"></script><script src="src/kernel-claim-narrative-benchmark-v0-1.js?v=bench-1"></script><script src="src/kernel-adversarial-narrative-pressure-v0-1.js?v=adv-1"></script><script src="src/kernel-real-world-packet-ingestion-discipline-v0-1.js?v=ingest-1"></script><script src="src/kernel-truth-ledger-preledger-v0-1.js?v=preledger-1"></script><script src="src/kernel-truth-ledger-preledger-stress-benchmark-v0-1.js?v=prestress-1"></script><script src="src/kernel-world-model-relation-expansion-v0-1.js?v=wmrel-1"></script><script src="src/kernel-world-model-relation-stress-benchmark-v0-1.js?v=wmrelstress-1"></script><script src="src/kernel-world-model-relation-stress-benchmark-v0-1-1-patch.js?v=wmrelstress-2"></script><script src="src/kernel-coverage-expansion-library-v0-1.js?v=coverage-1"></script><script src="src/kernel-coverage-stress-benchmark-v0-1.js?v=coverstress-1"></script><script src="src/kernel-deterministic-packet-ingestion-form-v0-1.js?v=ingestform-1"></script><script src="src/kernel-dossier-to-packet-compiler-v0-1.js?v=dossierpack-1"></script><script src="src/kernel-ingestion-to-preledger-bridge-v0-1.js?v=prebridge-1"></script><script src="src/kernel-dossier-packet-stress-benchmark-v0-1.js?v=dossierstress-1"></script><script src="src/kernel-unified-runtime-receptor-registry-v0-1.js?v=runtime-1"></script><script src="src/kernel-raw-messy-language-intake-receptor-v0-1.js?v=rawintake-1"></script><script>const tests=[];let packet=null;function add(n,f){tests.push({name:n,fn:f})}function assert(c,m){if(!c)throw new Error(m)}function arr(v){return Array.isArray(v)?v:[]}function records(){return arr(packet&&packet.raw_intake_records)}function validation(){return packet&&packet.validation||{}}function unresolved(){return records().flatMap(r=>arr(r.unresolved_items))}function allPackets(){return records().flatMap(r=>arr(r.candidate_packets))}function allRelations(){return records().flatMap(r=>arr(r.relation_candidates))}add('module loads and doctrine makes raw intake a receptor inside one runtime',()=>{assert(window.KernelUnifiedRuntimeReceptorRegistryV01,'unified runtime missing');assert(window.KernelRawMessyLanguageIntakeReceptorV01,'raw intake missing');assert(KernelRawMessyLanguageIntakeReceptorV01.VERSION==='0.1.0','version wrong');const d=KernelRawMessyLanguageIntakeReceptorV01.doctrine();assert(d.raw_messy_language_enters_unified_runtime===true,'raw enters runtime doctrine missing');assert(d.raw_intake_is_receptor_inside_one===true,'inside-one doctrine missing');assert(d.raw_intake_is_not_external_filter===true,'not external filter doctrine missing');assert(d.typo_repair_is_candidate_not_certainty===true,'typo doctrine missing');assert(d.epistemic_octahedron_maturity_guard_active===true,'EO maturity guard missing');assert(d.no_llm===true,'no LLM doctrine missing');assert(d.belief_movement==='none','belief movement wrong')});add('raw messy intake runs from unified runtime receptor registry',()=>{packet=KernelRawMessyLanguageIntakeReceptorV01.runRawMessyLanguageIntake();assert(packet.ok===true,'packet not ok: '+JSON.stringify(validation()));assert(packet.source_unified_runtime_ok===true,'source runtime not ok');assert(packet.source_unified_runtime_version==='0.1.0','source runtime version wrong');assert(packet.source_receptor_count===14,'expected 14 source receptors');assert(packet.source_runtime_is_one_brain===true,'source runtime is not one brain');assert(packet.source_modules_as_side_filters===false,'source modules are side filters');assert(packet.raw_intake_record_count===5,'expected 5 raw intake records');assert(packet.raw_messy_intake_is_final_truth_authority===false,'became final authority')});add('typo and unknown meaning hypotheses are visible but not certain',()=>{assert(packet.typo_variant_hypothesis_count>=1,'typo hypothesis count missing');assert(packet.unknown_or_new_meaning_hypothesis_count>=1,'unknown hypothesis count missing');records().forEach(r=>{arr(r.typo_variant_hypotheses).forEach(h=>{assert(h.certainty==='candidate_not_certain',h.hypothesis_id+' typo certain');assert(h.exact_meaning_claimed===false,h.hypothesis_id+' exact meaning claimed')});arr(r.unknown_or_new_meaning_hypotheses).forEach(h=>{assert(h.action==='hold_for_context_or_meaning_admission',h.hypothesis_id+' not held for admission');assert(h.exact_meaning_claimed===false,h.hypothesis_id+' exact meaning claimed')})});assert(unresolved().includes('typo_repair_is_candidate_not_certainty'),'typo unresolved missing');assert(unresolved().includes('unknown_meaning_requires_admission_no_fake_meaning'),'unknown unresolved missing');assert(validation().checks.typo_variant_hypotheses_visible===true,'typo check failed');assert(validation().checks.unknown_or_admission_visible===true,'unknown/admission check failed')});add('raw intake creates candidate interpretations, packets, relations, and admission candidates',()=>{assert(packet.candidate_interpretation_count>=5,'candidate interpretations missing');assert(packet.candidate_packet_count>=7,'candidate packets missing');assert(packet.relation_candidate_count>=4,'relation candidates missing');assert(packet.admission_candidate_count>=1,'admission candidates missing');records().forEach(r=>{assert(arr(r.candidate_interpretations).length>=1,r.raw_intake_record_id+' no interpretations')});assert(allPackets().some(p=>p.packet_type==='claim_candidate'),'claim candidate packet missing');assert(allPackets().some(p=>p.packet_type==='source_reference'),'source reference packet missing');assert(allPackets().some(p=>p.packet_type==='evidence_description'),'evidence packet missing');assert(allPackets().some(p=>p.packet_type==='media_description'),'media packet missing');assert(allPackets().some(p=>p.packet_type==='quote_fragment'),'quote packet missing');assert(allPackets().some(p=>p.packet_type==='adversarial_reframe'),'reframe packet missing');assert(allPackets().some(p=>p.packet_type==='relation_candidate'),'relation packet missing');assert(allRelations().some(r=>r.relation_family==='causes_or_contributes_to'),'causal relation candidate missing');assert(validation().checks.claim_source_evidence_media_quote_reframe_relation_candidates_visible===true,'candidate packet visibility failed')});add('belief pressure, source/evidence/media/reframe/causal gaps stay visible',()=>{['belief_statement_is_pressure_not_truth','source_reference_is_anchor_not_lookup','evidence_description_not_verified_evidence','media_description_not_verified_media','hostile_reframe_is_pressure_not_same_claim','causal_bridge_required_before_causal_truth'].forEach(item=>assert(unresolved().includes(item),item+' missing'));assert(validation().checks.belief_pressure_not_truth_visible===true,'belief pressure check failed');assert(validation().checks.source_evidence_media_reframe_causal_guards_visible===true,'source/evidence/media/reframe/causal check failed')});add('Epistemic Octahedron maturity guard stays active on all raw records',()=>{records().forEach(r=>{assert(r.active_guards&&r.active_guards.epistemic_octahedron_maturity_guard_active===true,r.raw_intake_record_id+' EO guard missing');assert(r.active_guards&&r.active_guards.maturity_is_integration_not_confidence===true,r.raw_intake_record_id+' maturity guard missing');assert(r.active_guards&&r.active_guards.objective_maturity_refuses_premature_certainty===true,r.raw_intake_record_id+' premature certainty guard missing')});assert(validation().checks.eo_maturity_guard_active_for_all===true,'EO maturity guard check failed')});add('raw intake remains inside runtime, not external filter',()=>{records().forEach(r=>{assert(r.runtime_receptor_status==='raw_messy_intake_receptor_inside_unified_runtime',r.raw_intake_record_id+' not inside runtime');assert(r.active_guards&&r.active_guards.raw_intake_is_receptor_inside_one===true,r.raw_intake_record_id+' inside-one guard missing');assert(r.active_guards&&r.active_guards.raw_intake_is_not_external_filter===true,r.raw_intake_record_id+' external-filter guard missing')});assert(validation().checks.raw_intake_inside_runtime===true,'inside runtime check failed');assert(validation().checks.source_runtime_is_one_brain===true,'source runtime one-brain check failed')});add('no final truth, no LLM, no lookup, rollback, and belief movement are preserved',()=>{records().forEach(r=>{assert(r.record_status==='candidate_raw_intake_not_truth',r.raw_intake_record_id+' record not candidate');assert(r.truth_status==='not_adjudicated',r.raw_intake_record_id+' truth adjudicated');assert(r.final_authority===false,r.raw_intake_record_id+' final authority true');assert(r.llm_used===false,r.raw_intake_record_id+' LLM used');assert(r.external_lookup_performed===false,r.raw_intake_record_id+' external lookup performed');assert(r.media_lookup_performed===false,r.raw_intake_record_id+' media lookup performed');assert(r.rollback_available===true,r.raw_intake_record_id+' rollback unavailable');assert(arr(r.revision_trail).every(v=>v.silent_mutation===false),r.raw_intake_record_id+' silent mutation present');assert(r.promotion_status==='not_promoted',r.raw_intake_record_id+' promoted');assert(r.belief_movement==='none',r.raw_intake_record_id+' belief movement not none')});assert(validation().checks.no_truth_promotion===true,'truth promotion check failed');assert(validation().checks.no_llm_used===true,'no LLM check failed');assert(validation().checks.no_lookup_used===true,'lookup check failed');assert(validation().checks.rollback_available_for_all===true,'rollback check failed');assert(validation().checks.no_silent_mutation===true,'silent mutation check failed');assert(validation().checks.final_authority_false===true,'final authority check failed');assert(validation().checks.belief_movement_none===true,'belief movement check failed');assert(arr(validation().errors).length===0,'validation errors present: '+validation().errors.join(','))});(async function run(){const results=[];for(const t of tests){try{await t.fn();results.push({name:t.name,passed:true})}catch(e){results.push({name:t.name,passed:false,error:e.message})}}const passed=results.filter(r=>r.passed).length;document.getElementById('summary').className=passed===tests.length?'ok':'bad';document.getElementById('summary').textContent=passed+'/'+tests.length+' passed';document.getElementById('out').textContent=JSON.stringify({packet_type:'42ndMind_raw_messy_language_intake_receptor_test_report_v0_1',ok:passed===tests.length,source_unified_runtime_ok:packet&&packet.source_unified_runtime_ok,source_unified_runtime_version:packet&&packet.source_unified_runtime_version,source_receptor_count:packet&&packet.source_receptor_count,source_runtime_is_one_brain:packet&&packet.source_runtime_is_one_brain,source_modules_as_side_filters:packet&&packet.source_modules_as_side_filters,raw_intake_record_count:packet&&packet.raw_intake_record_count,candidate_interpretation_count:packet&&packet.candidate_interpretation_count,candidate_packet_count:packet&&packet.candidate_packet_count,relation_candidate_count:packet&&packet.relation_candidate_count,typo_variant_hypothesis_count:packet&&packet.typo_variant_hypothesis_count,unknown_or_new_meaning_hypothesis_count:packet&&packet.unknown_or_new_meaning_hypothesis_count,admission_candidate_count:packet&&packet.admission_candidate_count,records:records().map(r=>({raw_intake_record_id:r.raw_intake_record_id,input_event_type:r.input_event_type,token_count:r.token_count,signals:r.signal_snapshot,candidate_interpretations:arr(r.candidate_interpretations).length,candidate_packets:arr(r.candidate_packets).map(p=>p.packet_type),relation_candidates:arr(r.relation_candidates).map(x=>x.relation_family),typo_variant_hypotheses:arr(r.typo_variant_hypotheses).length,unknown_or_new_meaning_hypotheses:arr(r.unknown_or_new_meaning_hypotheses).length,admission_candidates:arr(r.admission_candidates).length,truth_status:r.truth_status,promotion_status:r.promotion_status,belief_movement:r.belief_movement})),validation:validation(),results},null,2)})();</script></body></html>
