<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>42ndMind Maturity Objective Benchmark</title>
  <style>
    body { margin:0; font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; background:#0f1115; color:#eef2ff; }
    header { padding:16px 18px; border-bottom:1px solid #2a3040; background:#11141b; }
    main { padding:12px; }
    section { background:#171a21; border:1px solid #2a3040; border-radius:10px; padding:12px; margin-bottom:12px; }
    h1 { font:700 19px/1.2 system-ui,-apple-system,Segoe UI,sans-serif; margin:0 0 4px; }
    h2 { font:700 14px/1.2 system-ui,-apple-system,Segoe UI,sans-serif; margin:0 0 8px; color:#dfe6ff; }
    pre { white-space:pre-wrap; background:#0d1016; border:1px solid #2a3040; border-radius:10px; padding:10px; overflow:auto; max-height:640px; }
    .ok { color:#9dffb4; }
    .bad { color:#ff8b8b; }
  </style>
</head>
<body>
<header>
  <h1>42ndMind Maturity Objective Benchmark</h1>
  <div>Validation cases for maturity caps before movement fusion.</div>
</header>
<main>
  <section><h2 id="summary">Running...</h2><pre id="out"></pre></section>
</main>
<script src="src/maturity-objective-v0-1.js?v=0.1.0"></script>
<script>
  function gates(v) {
    return {
      counter_consideration:v,
      non_strawman:v,
      self_correction:v,
      contradiction_handling:v,
      reality_contact:v,
      non_self_sealing:v
    };
  }

  const cases = [
    {
      name:'null origin stays pre-active',
      input:{ x:0, y:0, z:0 },
      expect:r => r.classification === 'null_origin_not_maturity' && r.lanes.capped_maturity_score === 0
    },
    {
      name:'clean active peak candidate can pass',
      input:{ x:0, y:1, z:0, evidence_count:4, supporting_evidence_count:4, attacking_evidence_count:1, source_registry_summary:{ available:true, source_count:3, unresolved_source_questions:0 }, gates:gates(1) },
      expect:r => r.classification === 'near_objective_maturity_candidate' && r.caps.length === 0
    },
    {
      name:'no evidence blocks peak',
      input:{ x:0, y:1, z:0, source_registry_summary:{ available:true, source_count:1, unresolved_source_questions:0 }, gates:gates(1) },
      expect:r => r.caps.some(c => c.reason === 'no_evidence_grounding') && r.lanes.capped_maturity_score <= 0.35
    },
    {
      name:'no source visibility blocks full maturity',
      input:{ x:0, y:1, z:0, evidence_count:4, supporting_evidence_count:4, attacking_evidence_count:1, gates:gates(1) },
      expect:r => r.caps.some(c => c.reason === 'no_source_registry_or_source_review_visibility') && r.lanes.capped_maturity_score <= 0.55
    },
    {
      name:'unresolved contradiction caps y pressure',
      input:{ x:0, y:1, z:0, evidence_count:4, supporting_evidence_count:4, attacking_evidence_count:1, unresolved_contradiction_count:1, source_registry_summary:{ available:true, source_count:2, unresolved_source_questions:0 }, gates:gates(1) },
      expect:r => r.classification === 'unresolved_pressure_capped' && r.caps.some(c => c.reason === 'unresolved_contradiction_pressure')
    },
    {
      name:'unresolved source questions remain visible',
      input:{ x:0, y:1, z:0, evidence_count:4, supporting_evidence_count:4, attacking_evidence_count:1, source_registry_summary:{ available:true, source_count:2, unresolved_source_questions:2 }, gates:gates(1) },
      expect:r => r.classification === 'unresolved_pressure_capped' && r.caps.some(c => c.reason === 'unresolved_source_questions_visible')
    },
    {
      name:'self-sealing caps harder than ordinary unresolved pressure',
      input:{ x:0, y:1, z:0, evidence_count:4, supporting_evidence_count:4, attacking_evidence_count:1, self_sealing_flags:1, source_registry_summary:{ available:true, source_count:2, unresolved_source_questions:0 }, gates:gates(1) },
      expect:r => r.classification === 'self_sealing_capped' && r.lanes.capped_maturity_score <= 0.45
    },
    {
      name:'motive overclaim is capped separately',
      input:{ x:0, y:1, z:0, evidence_count:4, supporting_evidence_count:4, attacking_evidence_count:1, motive_overclaim_flags:1, source_registry_summary:{ available:true, source_count:2, unresolved_source_questions:0 }, gates:gates(1) },
      expect:r => r.classification === 'motive_overclaim_capped' && r.lanes.capped_maturity_score <= 0.62
    },
    {
      name:'partial gates prevent peak',
      input:{ x:0, y:1, z:0, evidence_count:4, supporting_evidence_count:4, attacking_evidence_count:1, source_registry_summary:{ available:true, source_count:2, unresolved_source_questions:0 }, gates:gates(0.5) },
      expect:r => r.caps.some(c => c.reason.startsWith('partial_gate_')) && r.lanes.capped_maturity_score <= 0.82
    },
    {
      name:'invalid surface is rejected',
      input:{ x:0.2, y:0.2, z:0.2, evidence_count:4, supporting_evidence_count:4, attacking_evidence_count:1, source_registry_summary:{ available:true, source_count:2, unresolved_source_questions:0 }, gates:gates(1) },
      expect:r => r.classification === 'invalid_active_surface'
    }
  ];

  const results = cases.map(c => {
    const assessment = MaturityObjectiveV01.assess(c.input);
    let passed = false;
    let error = '';
    try { passed = Boolean(c.expect(assessment)); }
    catch (e) { error = e.message; }
    return {
      name:c.name,
      passed,
      classification:assessment.classification,
      capped_maturity_score:assessment.lanes.capped_maturity_score,
      caps:assessment.caps.map(x => x.reason),
      error
    };
  });

  const passed = results.filter(r => r.passed).length;
  document.getElementById('summary').className = passed === results.length ? 'ok' : 'bad';
  document.getElementById('summary').textContent = `${passed}/${results.length} passed`;
  document.getElementById('out').textContent = JSON.stringify({ packet_type:'42ndMind_maturity_objective_benchmark_report', cases:results }, null, 2);
</script>
</body>
</html>
