<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>42ndMind Self-Learning Sandbox Test v0.1.1</title>
  <style>
    body { margin:0; font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; background:#0f1115; color:#eef2ff; }
    header { padding:16px 18px; border-bottom:1px solid #2a3040; background:#11141b; }
    main { padding:12px; }
    section { background:#171a21; border:1px solid #2a3040; border-radius:10px; padding:12px; }
    h1 { font:700 19px/1.2 system-ui,-apple-system,Segoe UI,sans-serif; margin:0 0 4px; }
    pre { white-space:pre-wrap; background:#0d1016; border:1px solid #2a3040; border-radius:10px; padding:10px; overflow:auto; max-height:720px; }
    .ok { color:#9dffb4; } .bad { color:#ff8b8b; }
  </style>
</head>
<body>
<header><h1>42ndMind Self-Learning Sandbox Test v0.1.1</h1><div>Tests bounded self-learning with mechanism-class convergence detection patch.</div></header>
<main><section><h2 id="summary">Running...</h2><pre id="out"></pre></section></main>
<script src="src/self-learning-v0-1.js?v=0.1.0"></script>
<script src="src/self-learning-v0-1-1-patch.js?v=0.1.1"></script>
<script>
  const tests = [];
  function add(name, fn) { tests.push({ name, fn }); }
  function assert(cond, msg) { if (!cond) throw new Error(msg); }

  add('module and patch load', () => {
    assert(window.SelfLearningV01, 'SelfLearningV01 missing');
    assert(SelfLearningV01.VERSION === '0.1.1-patch', 'wrong version');
    assert(window.SelfLearningV011PatchStatus?.installed === true, 'patch status missing');
  });

  add('sample cases produce reviewable proposals', () => {
    const report = SelfLearningV01.learn(SelfLearningV01.sampleCases());
    assert(report.packet_type === '42ndMind_self_learning_report', 'wrong packet type');
    assert(report.counts.reviewed_cases === 3, 'wrong reviewed case count');
    assert(report.counts.proposals >= 4, 'not enough proposals from sample cases');
    assert(report.counts.blocked === 0, 'sample proposals should not be blocked');
  });

  add('source visibility failure proposes source-review checklist', () => {
    const report = SelfLearningV01.learn(SelfLearningV01.sampleCases());
    assert(report.proposals.some(p => p.proposal_type === 'source_review_checklist_improvement'), 'missing source-review proposal');
  });

  add('motive overclaim proposes mechanism-vs-motive separation', () => {
    const report = SelfLearningV01.learn(SelfLearningV01.sampleCases());
    assert(report.proposals.some(p => p.title.includes('Separate mechanism support from motive proof')), 'missing motive-overclaim proposal');
  });

  add('partial gate precision becomes benchmark candidate', () => {
    const report = SelfLearningV01.learn(SelfLearningV01.sampleCases());
    assert(report.proposals.some(p => p.title.includes('gate-limited but not self-sealing')), 'missing gate precision benchmark');
  });

  add('mechanism convergence produces compression candidate', () => {
    const report = SelfLearningV01.learn(SelfLearningV01.sampleCases());
    assert(report.proposals.some(p => p.proposal_type === 'compression_rule_candidate'), 'missing compression candidate');
  });

  add('all generated proposals are sandbox-only and non-scoring', () => {
    const report = SelfLearningV01.learn(SelfLearningV01.sampleCases());
    assert(report.doctrine.sandbox_only === true, 'report not sandbox-only');
    assert(report.doctrine.belief_movement === 'none', 'report moves belief');
    assert(report.next_kernel_state_extension.scoring_allowed === false, 'scoring unexpectedly allowed');
    assert(report.proposals.every(p => p.meta.sandbox_only === true && p.meta.belief_movement === 'none'), 'proposal escaped sandbox');
  });

  add('forbidden target is blocked', () => {
    const result = SelfLearningV01.sandboxProposal({ proposal_type:'maturity_cap_heuristic', title:'Rewrite core doctrine', target_layer:'core_doctrine', proposed_change:'rewrite core doctrine and change null origin', rationale:'test' }, []);
    assert(result.validation.valid === false, 'forbidden target passed');
    assert(result.sandbox.promotion_status === 'blocked_by_guardrails', 'forbidden target not blocked');
  });

  add('forbidden auto-promotion language is blocked', () => {
    const result = SelfLearningV01.sandboxProposal({ proposal_type:'risk_flag_improvement', title:'Auto promote this rule', target_layer:'benchmark_layer', proposed_change:'automatically promote this rule into belief movement', rationale:'test' }, []);
    assert(result.validation.valid === false, 'forbidden auto-promotion language passed');
  });

  add('no-signal case does not invent strong rule', () => {
    const report = SelfLearningV01.learn([{ id:'case_empty', title:'Empty case' }]);
    assert(report.proposals.length === 1, 'empty case should create one benchmark preservation proposal');
    assert(report.proposals[0].title.includes('No strong learning signal'), 'wrong no-signal proposal');
  });

  const results = tests.map(t => { try { t.fn(); return { name:t.name, passed:true }; } catch(e) { return { name:t.name, passed:false, error:e.message }; } });
  const passed = results.filter(r => r.passed).length;
  document.getElementById('summary').className = passed === results.length ? 'ok' : 'bad';
  document.getElementById('summary').textContent = `${passed}/${results.length} passed`;
  document.getElementById('out').textContent = JSON.stringify({ packet_type:'42ndMind_self_learning_test_report', test_version:'0.1.1', results }, null, 2);
</script>
</body>
</html>
