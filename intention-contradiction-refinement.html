<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>42ndMind Intention Contradiction/Refinement</title><style>body{margin:0;background:#0f1115;color:#eef2ff;font:14px ui-monospace,Menlo,Consolas,monospace}header{padding:16px 18px;background:#11141b;border-bottom:1px solid #2a3040}main{padding:12px;display:grid;grid-template-columns:460px 1fr;gap:12px}section{background:#171a21;border:1px solid #2a3040;border-radius:10px;padding:12px}button{background:#25345c;color:#eef2ff;border:1px solid #3f5592;padding:8px 10px;border-radius:8px;cursor:pointer;margin:3px 3px 8px 0}pre{white-space:pre-wrap;background:#0d1016;border:1px solid #2a3040;border-radius:10px;padding:10px;overflow:auto;max-height:760px}.ok{color:#9dffb4}.bad{color:#ff8b8b}.muted{color:#8b93a7}a{color:#9db6ff}.card{background:#10131a;border:1px solid #2a3040;border-radius:10px;padding:10px;margin:10px 0}.check{border-top:1px solid #252b3a;padding:5px 0}.pill{display:inline-block;border:1px solid #2a3040;border-radius:999px;padding:1px 7px;margin:2px}.pressure{color:#ffd28b}.pass{color:#9dffb4}@media(max-width:900px){main{grid-template-columns:1fr}}</style></head><body><header><h1>42ndMind Intention Contradiction/Refinement</h1><div class="muted">Cross-concept contradiction pressure over compiled formulas. Suggestions only. No automatic rewrite. No doctrine promotion.</div></header><main><section><a href="index.html">main</a> · <a href="intention-concept-expansion.html?v=expansion-2">expansion</a> · <a href="kernel-intention-contradiction-refinement-loop-v0-1-test.html?v=contradiction-1">test</a><p>Decision: <b id="decisionMetric">not run</b></p><p>Pairs: <b id="pairMetric">0</b></p><p>Actions: <b id="actionMetric">0</b></p><button onclick="runLoop()">Run loop</button><button onclick="showPacket()">Show packet</button><button onclick="showSummary()">Show summary</button><button onclick="copyOutput()">Copy output</button><div id="cards"></div></section><section><h2>Output</h2><pre id="out">No output yet.</pre></section></main><script src="src/kernel-intention-discovery-v0-1.js?v=intent-1"></script><script src="src/kernel-intention-refinement-v0-1.js?v=refine-1"></script><script src="src/kernel-intention-necessity-test-v0-1.js?v=necessity-1"></script><script src="src/kernel-intention-neighbor-lattice-v0-1.js?v=lattice-3"></script><script src="src/kernel-intention-lattice-invariance-benchmark-v0-1.js?v=invariance-2"></script><script src="src/kernel-intention-formula-compiler-v0-1.js?v=formula-1"></script><script src="src/kernel-intention-concept-expansion-loop-v0-1.js?v=expansion-1"></script><script src="src/kernel-intention-contradiction-refinement-loop-v0-1.js?v=contradiction-1"></script><script>let packet=null,last='';function esc(v){return String(v??'').replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]))}function setOut(v){last=typeof v==='string'?v:JSON.stringify(v,null,2);document.getElementById('out').textContent=last}function runLoop(){const decisionEl=document.getElementById('decisionMetric');try{packet=KernelIntentionContradictionRefinementLoopV01.runLoop();decisionEl.textContent=packet.ok?'REFINEMENT_PRESSURE_READY':'HELD';decisionEl.className=packet.ok?'ok':'bad';document.getElementById('pairMetric').textContent=packet.pair_analysis_count;document.getElementById('actionMetric').textContent=packet.proposed_refinement_actions.length;renderCards();showSummary()}catch(e){decisionEl.textContent='ERROR';decisionEl.className='bad';setOut({ok:false,error:e.message,belief_movement:'none'})}}function renderCards(){document.getElementById('cards').innerHTML=(packet&&packet.pair_analyses||[]).map(p=>`<div class="card"><h3>${esc(p.id)}</h3><p><span class="pill pressure">${esc(p.pressure_type)}</span><span class="pill">${esc(p.contradiction_status)}</span><span class="pill">${esc(p.action_status)}</span></p>${p.relation_checks.map(r=>`<div class="check"><b>${esc(r.from)}</b> - ${esc(r.removed_dimension)} → <b>${esc(r.to)}</b> <span class="pill ${r.relation_exists?'pass':'bad'}">${esc(r.relation_exists)}</span></div>`).join('')}<p class="muted">${esc(p.refinement_action)}</p></div>`).join('')||'No pair analyses.'}function summary(){return{packet_type:'42ndMind_intention_contradiction_refinement_summary_view_v0_1',ok:packet&&packet.ok,compiled_formula_count:packet&&packet.compiled_formula_count,pair_analysis_count:packet&&packet.pair_analysis_count,pair_analyses:packet&&packet.pair_analyses,duplicate_dimension_pressure:packet&&packet.duplicate_dimension_pressure,proposed_refinement_action_count:packet&&packet.proposed_refinement_actions.length,proposed_refinement_actions:packet&&packet.proposed_refinement_actions,validation:packet&&packet.validation,belief_movement:'none'}}function showSummary(){if(!packet)return runLoop();setOut(summary())}function showPacket(){if(!packet)return runLoop();setOut(packet)}async function copyOutput(){try{await navigator.clipboard.writeText(last);document.getElementById('out').textContent='Copied.\n\n'+last}catch(e){}}runLoop();</script></body></html>
