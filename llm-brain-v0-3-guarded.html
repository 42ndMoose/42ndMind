<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>42ndMind Live Brain v0.3 Guarded</title>
  <style>
    html,body { margin:0; height:100%; background:#0f1115; color:#eef2ff; font:13px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
    header { padding:10px 12px; border-bottom:1px solid #2a3040; background:#11141b; display:flex; align-items:center; gap:12px; }
    b { font-family:system-ui,-apple-system,Segoe UI,sans-serif; }
    .muted { color:#8b93a7; }
    .ok { color:#9dffb4; } .warn { color:#ffd28b; } .bad { color:#ff8b8b; }
    a { color:#9db6ff; }
    iframe { width:100%; height:calc(100% - 43px); border:0; display:block; }
  </style>
</head>
<body>
<header>
  <b>42ndMind Guarded Live Brain</b>
  <span id="guardStatus" class="muted">Loading preflight guard...</span>
  <a href="llm-brain-v0-3.html">unguarded live brain</a>
  <a href="kernel-command-preflight-test.html">preflight test</a>
</header>
<iframe id="brainFrame" src="llm-brain-v0-3.html?v=preflight_guarded_0_1_1"></iframe>
<script src="src/kernel-command-preflight-v0-1.js?v=0.1.0"></script>
<script src="src/kernel-command-preflight-v0-1-1-patch.js?v=0.1.1"></script>
<script>
  const frame = document.getElementById('brainFrame');
  const statusEl = document.getElementById('guardStatus');
  function setStatus(text, cls){ statusEl.textContent = text; statusEl.className = cls || 'muted'; }
  function installGuard(){
    try {
      const w = frame.contentWindow;
      if (!w || !w.document || !w.runCommands) { setStatus('Live brain loaded, but runCommands was not found.', 'bad'); return; }
      w.KernelCommandPreflightV01 = window.KernelCommandPreflightV01;
      const originalRunCommands = w.runCommands;
      w.runCommands = function guardedRunCommands(){
        const input = w.document.getElementById('commandInput');
        const commandStatus = w.document.getElementById('commandStatus');
        if (!input) return originalRunCommands.apply(w, arguments);
        const report = w.KernelCommandPreflightV01.analyze(input.value);
        w.localStorage.setItem('42ndMind_last_kernel_command_preflight_report', JSON.stringify(report));
        if (report.decision === 'BLOCK_IMPORT') {
          if (commandStatus) commandStatus.textContent = `Preflight blocked import: ${report.counts.block} block issue(s), ${report.counts.caution} caution issue(s).`;
          return report;
        }
        if (report.sanitized_command) input.value = JSON.stringify(report.sanitized_command, null, 2);
        const result = originalRunCommands.apply(w, arguments);
        if (commandStatus) commandStatus.textContent += ` Preflight: ${report.decision}.`;
        return result;
      };
      setStatus('Preflight guard installed. IMPORT / RUN now blocks poisonous packets and sanitizes allowed packets.', 'ok');
    } catch (error) {
      setStatus('Preflight guard install failed: ' + error.message, 'bad');
    }
  }
  frame.addEventListener('load', () => setTimeout(installGuard, 150));
</script>
</body>
</html>
