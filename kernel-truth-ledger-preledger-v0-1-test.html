<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>42ndMind Truth Ledger Preledger Test v0.1</title><style>body{margin:0;background:#0f1115;color:#eef2ff;font:14px ui-monospace,Menlo,Consolas,monospace}header{padding:16px;background:#11141b;border-bottom:1px solid #2a3040}main{padding:12px}section{background:#171a21;border:1px solid #2a3040;border-radius:10px;padding:12px}pre{white-space:pre-wrap;background:#0d1016;border:1px solid #2a3040;border-radius:10px;padding:10px;overflow:auto;max-height:760px}.ok{color:#9dffb4}.bad{color:#ff8b8b}a{color:#9db6ff}</style></head><body><header><h1>42ndMind Truth Ledger Preledger Test v0.1</h1><div>Tests candidate preledger entries without final truth promotion.</div></header><main><section><h2 id="summary">Running...</h2><div><a href="truth-ledger-preledger.html?v=preledger-1">truth ledger preledger page</a></div><pre id="out"></pre></section></main><script src="src/kernel-objective-claim-language-v0-1.js?v=claim-1"></script><script src="src/kernel-objective-claim-language-v0-1-1-patch.js?v=claim-2"></script><script src="src/kernel-external-anchor-packet-schema-v0-1.js?v=anchor-1"></script><script src="src/kernel-source-provenance-registry-v0-1.js?v=prov-1"></script><script src="src/kernel-evidence-media-registry-v0-1.js?v=evidence-1"></script><script src="src/kernel-truth-pressure-synthesis-v0-1.js?v=truth-1"></script><script src="src/kernel-truth-pressure-synthesis-v0-1-1-patch.js?v=truth-2"></script><script src="src/kernel-claim-narrative-benchmark-v0-1.js?v=bench-1"></script><script src="src/kernel-adversarial-narrative-pressure-v0-1.js?v=adv-1"></script><script src="src/kernel-real-world-packet-ingestion-discipline-v0-1.js?v=ingest-1"></script><script src="src/kernel-truth-ledger-preledger-v0-1.js?v=preledger-1"></script><script>const tests=[];let packet=null;function add(n,f){tests.push({name:n,fn:f})}function assert(c,m){if(!c)throw new Error(m)}function arr(v){return Array.isArray(v)?v:[]}function entries(){return arr(packet&&packet.preledger_entries)}function validation(){return packet&&packet.validation||{}}function postures(){return new Set(entries().map(e=>e.candidate_truth_posture))}function allUnresolved(){return entries().flatMap(e=>arr(e.unresolved_items))}add('module loads and doctrine makes preledger non-authoritative',()=>{assert(window.KernelRealWorldPacketIngestionDisciplineV01,'ingestion discipline missing');assert(window.KernelTruthPressureSynthesisV01,'truth pressure missing');assert(window.KernelTruthLedgerPreledgerV01,'preledger missing');assert(KernelTruthLedgerPreledgerV01.VERSION==='0.1.0','version wrong');const d=KernelTruthLedgerPreledgerV01.doctrine();assert(d.preledger_collects_candidate_entries_not_truth===true,'preledger doctrine missing');assert(d.ingestion_packets_are_context_not_truth===true,'ingestion context doctrine missing');assert(d.truth_pressure_is_pressure_not_final_truth===true,'truth pressure doctrine missing');assert(d.rollback_required_for_every_entry===true,'rollback doctrine missing');assert(d.version_trail_required_for_every_entry===true,'version trail doctrine missing');assert(d.no_truth_promotion===true,'no promotion doctrine missing');assert(d.no_llm===true,'no LLM doctrine missing');assert(d.no_source_lookup===true,'no source lookup doctrine missing');assert(d.no_media_lookup===true,'no media lookup doctrine missing');assert(d.belief_movement==='none','belief movement wrong')});add('preledger runs from ingestion discipline and truth-pressure synthesis',()=>{packet=KernelTruthLedgerPreledgerV01.runPreledger();assert(packet.ok===true,'packet not ok: '+JSON.stringify(validation()));assert(packet.source_ingestion_ok===true,'source ingestion not ok');assert(packet.source_ingestion_version==='0.1.0','expected ingestion v0.1.0');assert(packet.source_ingestion_record_count===8,'expected 8 ingestion records');assert(packet.source_truth_pressure_ok===true,'source truth pressure not ok');assert(packet.source_truth_pressure_version==='0.1.1','expected truth pressure v0.1.1');assert(packet.source_truth_pressure_record_count===8,'expected 8 truth pressure records');assert(packet.preledger_entry_count===8,'expected 8 preledger entries');assert(packet.preledger_is_final_truth_authority===false,'preledger became final authority');assert(packet.adjudicates_final_truth===false,'adjudicated final truth')});add('all entries link ingestion snapshots and truth-pressure records',()=>{entries().forEach(e=>{assert(e.ingestion_snapshot&&e.ingestion_snapshot.raw_packet,e.material_id+' ingestion snapshot missing');assert(e.linked_truth_pressure&&e.linked_truth_pressure.linked_status_candidate,e.material_id+' truth pressure missing');assert(e.linked_truth_pressure.truth_promotion===false,e.material_id+' truth pressure promoted');assert(e.current_candidate_version===e.version_id,e.material_id+' candidate version mismatch')});assert(validation().checks.entries_link_ingestion_snapshots===true,'ingestion link check failed');assert(validation().checks.entries_link_truth_pressure===true,'truth pressure link check failed')});add('candidate postures remain non-truth and multiple postures are visible',()=>{entries().forEach(e=>{assert(e.candidate_truth_posture.includes('not_truth')||e.candidate_truth_posture.includes('not_resolved'),e.material_id+' unsafe posture '+e.candidate_truth_posture);assert(e.truth_status==='not_adjudicated',e.material_id+' truth adjudicated');assert(e.ledger_status==='candidate_preledger_not_truth',e.material_id+' unsafe ledger status')});assert(postures().size>=4,'expected at least 4 posture types');assert(validation().checks.candidate_postures_not_truth===true,'candidate posture check failed');assert(validation().checks.multiple_postures_visible===true,'multiple posture check failed')});add('unresolved gaps, uncertainty, and warnings remain visible',()=>{entries().forEach(e=>assert(arr(e.unresolved_items).length>0,e.material_id+' unresolved items missing'));assert(allUnresolved().some(x=>String(x).includes('warning:')),'warning unresolved items missing');assert(allUnresolved().some(x=>String(x).includes('uncertainty:')),'uncertainty unresolved items missing');assert(allUnresolved().includes('media_not_verified'),'media unresolved missing');assert(allUnresolved().includes('evidence_claims_not_verified'),'evidence unresolved missing');assert(validation().checks.unresolved_items_visible===true,'unresolved check failed');assert(validation().checks.source_uncertainty_visible===true,'source uncertainty check failed');assert(validation().checks.media_uncertainty_visible===true,'media uncertainty check failed');assert(validation().checks.evidence_uncertainty_visible===true,'evidence uncertainty check failed');assert(validation().checks.adversarial_warning_visible===true,'adversarial warning check failed');assert(validation().checks.contradiction_or_gap_visible===true,'contradiction/gap check failed')});add('rollback, version trail, and no silent mutation are preserved',()=>{entries().forEach(e=>{assert(e.rollback_available===true,e.material_id+' rollback unavailable');assert(e.rollback_snapshot&&e.rollback_snapshot.source_ingestion_record,e.material_id+' rollback ingestion missing');assert(e.rollback_snapshot&&e.rollback_snapshot.linked_truth_pressure_record,e.material_id+' rollback truth pressure missing');assert(arr(e.revision_trail).length>=1,e.material_id+' revision trail missing');assert(arr(e.revision_trail).every(v=>v.silent_mutation===false),e.material_id+' silent mutation present')});assert(validation().checks.rollback_available_for_all===true,'rollback check failed');assert(validation().checks.revision_trail_present_for_all===true,'revision trail check failed');assert(validation().checks.no_silent_mutation===true,'silent mutation check failed')});add('separation guards prevent final ledger behavior',()=>{entries().forEach(e=>{const g=e.separation_guards||{};assert(g.support_is_not_truth===true,e.material_id+' support guard missing');assert(g.counterevidence_is_not_disproof_by_itself===true,e.material_id+' counter guard missing');assert(g.contradiction_detection_is_not_resolution===true,e.material_id+' contradiction guard missing');assert(g.truth_pressure_is_not_final_truth===true,e.material_id+' truth pressure guard missing');assert(g.user_context_is_not_truth===true,e.material_id+' user context guard missing');assert(g.media_description_is_not_media_verification===true,e.material_id+' media guard missing');assert(g.evidence_claims_are_not_evidence_verification===true,e.material_id+' evidence guard missing');assert(g.preledger_is_not_final_ledger===true,e.material_id+' preledger guard missing')});assert(validation().checks.preledger_not_final_ledger===true,'preledger final ledger check failed');assert(validation().checks.truth_status_not_adjudicated===true,'truth status check failed')});add('no LLM, no lookup, candidate-only status, and belief movement are preserved',()=>{entries().forEach(e=>{assert(e.llm_used===false,e.material_id+' used LLM');assert(e.external_lookup_performed===false,e.material_id+' performed external lookup');assert(e.media_lookup_performed===false,e.material_id+' performed media lookup');assert(e.promotion_status==='not_promoted',e.material_id+' promoted');assert(e.doctrine_status==='candidate_not_doctrine',e.material_id+' doctrine status wrong');assert(e.belief_movement==='none',e.material_id+' moved belief');assert(e.contradiction_resolution==='not_resolved',e.material_id+' contradiction resolved')});assert(validation().checks.no_llm_used===true,'no LLM check failed');assert(validation().checks.no_external_or_media_lookup===true,'lookup check failed');assert(validation().checks.candidate_only_not_promoted===true,'candidate-only check failed');assert(validation().checks.belief_movement_none===true,'belief movement check failed');assert(arr(validation().errors).length===0,'validation errors present: '+validation().errors.join(','))});(async function run(){const results=[];for(const t of tests){try{await t.fn();results.push({name:t.name,passed:true})}catch(e){results.push({name:t.name,passed:false,error:e.message})}}const passed=results.filter(r=>r.passed).length;document.getElementById('summary').className=passed===tests.length?'ok':'bad';document.getElementById('summary').textContent=passed+'/'+tests.length+' passed';document.getElementById('out').textContent=JSON.stringify({packet_type:'42ndMind_truth_ledger_preledger_test_report_v0_1',ok:passed===tests.length,source_ingestion_ok:packet&&packet.source_ingestion_ok,source_ingestion_version:packet&&packet.source_ingestion_version,source_ingestion_record_count:packet&&packet.source_ingestion_record_count,source_truth_pressure_ok:packet&&packet.source_truth_pressure_ok,source_truth_pressure_version:packet&&packet.source_truth_pressure_version,source_truth_pressure_record_count:packet&&packet.source_truth_pressure_record_count,preledger_entry_count:packet&&packet.preledger_entry_count,posture_counts:packet&&packet.posture_counts,entries:entries().map(e=>({preledger_entry_id:e.preledger_entry_id,material_id:e.material_id,material_type:e.material_type,candidate_truth_posture:e.candidate_truth_posture,linked_status_candidate:e.linked_truth_pressure&&e.linked_truth_pressure.linked_status_candidate,unresolved_item_count:e.unresolved_items.length,rollback_available:e.rollback_available,truth_status:e.truth_status,ledger_status:e.ledger_status,promotion_status:e.promotion_status,belief_movement:e.belief_movement})),validation:validation(),results},null,2)})();</script></body></html>
