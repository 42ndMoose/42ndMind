<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>42ndMind Language-to-Formula Benchmark</title><style>body{margin:0;background:#0f1115;color:#eef2ff;font:14px ui-monospace,Menlo,Consolas,monospace}header{padding:16px 18px;background:#11141b;border-bottom:1px solid #2a3040}main{padding:12px;display:grid;grid-template-columns:470px 1fr;gap:12px}section{background:#171a21;border:1px solid #2a3040;border-radius:10px;padding:12px}button{background:#25345c;color:#eef2ff;border:1px solid #3f5592;padding:8px 10px;border-radius:8px;cursor:pointer;margin:3px 3px 8px 0}pre{white-space:pre-wrap;background:#0d1016;border:1px solid #2a3040;border-radius:10px;padding:10px;overflow:auto;max-height:760px}.ok{color:#9dffb4}.bad{color:#ff8b8b}.muted{color:#8b93a7}a{color:#9db6ff}.card{background:#10131a;border:1px solid #2a3040;border-radius:10px;padding:10px;margin:10px 0}.case{border-top:1px solid #252b3a;padding:7px 0}.pill{display:inline-block;border:1px solid #2a3040;border-radius:999px;padding:1px 7px;margin:2px}.safe{color:#9dffb4}.warn{color:#ffd28b}@media(max-width:900px){main{grid-template-columns:1fr}}</style></head><body><header><h1>42ndMind Language-to-Formula Benchmark</h1><div class="muted">End-to-end benchmark: neutral input → parser candidate → v0003 formula → proof trace → invariant checks. Candidate only.</div></header><main><section><a href="index.html">main</a> · <a href="intention-parser-proof-trace.html?v=ptrace-1">parser proof trace</a> · <a href="kernel-intention-language-to-formula-benchmark-v0-1-test.html?v=l2f-1">test</a><p>Decision: <b id="decisionMetric">not run</b></p><p>Cases: <b id="caseMetric">0</b></p><p>Labelled pass: <b id="labelMetric">0</b></p><p>Ambiguity cases: <b id="ambiguityMetric">0</b></p><button onclick="runBenchmark()">Run benchmark</button><button onclick="showPacket()">Show packet</button><button onclick="showSummary()">Show summary</button><button onclick="copyOutput()">Copy output</button><div id="cards"></div></section><section><h2>Output</h2><pre id="out">No output yet.</pre></section></main><script src="src/kernel-intention-discovery-v0-1.js?v=intent-1"></script><script src="src/kernel-intention-refinement-v0-1.js?v=refine-1"></script><script src="src/kernel-intention-necessity-test-v0-1.js?v=necessity-1"></script><script src="src/kernel-intention-neighbor-lattice-v0-1.js?v=lattice-3"></script><script src="src/kernel-intention-lattice-invariance-benchmark-v0-1.js?v=invariance-2"></script><script src="src/kernel-intention-formula-compiler-v0-1.js?v=formula-1"></script><script src="src/kernel-intention-concept-expansion-loop-v0-1.js?v=expansion-2"></script><script src="src/kernel-intention-contradiction-refinement-loop-v0-1.js?v=contradiction-1"></script><script src="src/kernel-intention-formula-revision-engine-v0-1.js?v=revision-1"></script><script src="src/kernel-intention-canonical-formula-ledger-v0-1.js?v=ledger-1"></script><script src="src/kernel-intention-proof-output-v0-1.js?v=proof-1"></script><script src="src/kernel-intention-minimal-pair-library-v0-1.js?v=minpair-1"></script><script src="src/kernel-intention-dimension-splitting-v0-1.js?v=split-2"></script><script src="src/kernel-intention-coefficient-dimension-revision-engine-v0-1.js?v=codim-1"></script><script src="src/kernel-intention-canonical-formula-ledger-v0-1-1-patch.js?v=ledger-2"></script><script src="src/kernel-intention-arbitrary-language-parser-v0-1.js?v=parser-1"></script><script src="src/kernel-intention-parser-proof-trace-v0-1.js?v=ptrace-1"></script><script src="src/kernel-intention-language-to-formula-benchmark-v0-1.js?v=l2f-1"></script><script>let packet=null,last='';function esc(v){return String(v??'').replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]))}function arr(v){return Array.isArray(v)?v:[]}function setOut(v){last=typeof v==='string'?v:JSON.stringify(v,null,2);document.getElementById('out').textContent=last}function setMetrics(){const decisionEl=document.getElementById('decisionMetric');decisionEl.textContent=packet&&packet.ok?'LANGUAGE_TO_FORMULA_BENCHMARK_READY':'HELD_FOR_REVIEW';decisionEl.className=packet&&packet.ok?'ok':'bad';document.getElementById('caseMetric').textContent=packet&&packet.case_count||0;document.getElementById('labelMetric').textContent=(packet&&packet.labelled_case_pass_count||0)+'/'+(packet&&packet.labelled_case_count||0);document.getElementById('ambiguityMetric').textContent=packet&&packet.ambiguity_case_count||0}function runBenchmark(){try{packet=KernelIntentionLanguageToFormulaBenchmarkV01.runBenchmark();setMetrics();renderCards();showSummary()}catch(e){document.getElementById('decisionMetric').textContent='ERROR';document.getElementById('decisionMetric').className='bad';setOut({ok:false,error:e.message,belief_movement:'none'})}}function renderCards(){document.getElementById('cards').innerHTML=arr(packet&&packet.case_results).map(c=>`<div class="card"><h3>${esc(c.case_id)} · ${esc(c.parser_status)}</h3><p><span class="pill ${c.ok?'safe':'bad'}">ok ${esc(c.ok)}</span><span class="pill warn">expected ${esc(c.expected_concept)}</span><span class="pill safe">parser ${esc(c.parser_top_concept)}</span><span class="pill safe">trace ${esc(c.trace_top_concept)}</span></p><div class="muted">${esc(c.input_text)}</div><div class="case"><b>Candidate version:</b> ${esc(c.candidate_version)}<br><b>Proof:</b> ${esc(c.proof_reference)}<br><b>Formula:</b> ${esc(c.formula_excerpt)}<br><span class="pill safe">ambiguity ${esc(c.ambiguity_score)}</span><span class="pill safe">unresolved ${esc(c.unresolved_dimension_count)}</span><span class="pill safe">L1 ${esc(c.observed_l1_total)}</span><span class="pill safe">force ${esc(c.force_terms_outside_shape)}</span></div></div>`).join('')||'No case results.'}function summary(){return{packet_type:'42ndMind_intention_language_to_formula_benchmark_summary_view_v0_1',ok:packet&&packet.ok,source_ledger_ok:packet&&packet.source_ledger_ok,source_ledger_record_count:packet&&packet.source_ledger_record_count,source_proof_ok:packet&&packet.source_proof_ok,source_proof_count:packet&&packet.source_proof_count,source_parser_ok:packet&&packet.source_parser_ok,source_parser_parse_count:packet&&packet.source_parser_parse_count,source_trace_ok:packet&&packet.source_trace_count,case_count:packet&&packet.case_count,labelled_case_count:packet&&packet.labelled_case_count,labelled_case_pass_count:packet&&packet.labelled_case_pass_count,ambiguity_case_count:packet&&packet.ambiguity_case_count,case_results:arr(packet&&packet.case_results).map(c=>({case_id:c.case_id,expected_concept:c.expected_concept,parser_status:c.parser_status,parser_top_concept:c.parser_top_concept,trace_top_concept:c.trace_top_concept,candidate_version:c.candidate_version,proof_reference_present:c.proof_reference_present,ambiguity_score:c.ambiguity_score,unresolved_dimension_count:c.unresolved_dimension_count,observed_l1_total:c.observed_l1_total,force_terms_outside_shape:c.force_terms_outside_shape,promotion_status:c.promotion_status,belief_movement:c.belief_movement,ok:c.ok,errors:c.errors})),validation:packet&&packet.validation,belief_movement:'none'}}function showSummary(){if(!packet)return runBenchmark();setOut(summary())}function showPacket(){if(!packet)return runBenchmark();setOut(packet)}async function copyOutput(){try{await navigator.clipboard.writeText(last);document.getElementById('out').textContent='Copied.\n\n'+last}catch(e){}}runBenchmark();</script></body></html>
