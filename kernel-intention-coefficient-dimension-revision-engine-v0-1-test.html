<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>42ndMind Coefficient/Dimension Revision Engine Test</title><style>body{margin:0;background:#0f1115;color:#eef2ff;font:14px ui-monospace,Menlo,Consolas,monospace}header{padding:16px;background:#11141b;border-bottom:1px solid #2a3040}main{padding:12px}section{background:#171a21;border:1px solid #2a3040;border-radius:10px;padding:12px}pre{white-space:pre-wrap;background:#0d1016;border:1px solid #2a3040;border-radius:10px;padding:10px;overflow:auto;max-height:760px}.ok{color:#9dffb4}.bad{color:#ff8b8b}a{color:#9db6ff}</style></head><body><header><h1>42ndMind Coefficient/Dimension Revision Engine Test</h1><div>Tests staged v0003 split-dimension formula revisions. Source formulas remain intact. Candidate only.</div></header><main><section><h2 id="summary">Running...</h2><div><a href="intention-coefficient-dimension-revision.html?v=codim-1">coefficient/dimension revision page</a></div><pre id="out"></pre></section></main><script src="src/kernel-intention-discovery-v0-1.js?v=intent-1"></script><script src="src/kernel-intention-refinement-v0-1.js?v=refine-1"></script><script src="src/kernel-intention-necessity-test-v0-1.js?v=necessity-1"></script><script src="src/kernel-intention-neighbor-lattice-v0-1.js?v=lattice-3"></script><script src="src/kernel-intention-lattice-invariance-benchmark-v0-1.js?v=invariance-2"></script><script src="src/kernel-intention-formula-compiler-v0-1.js?v=formula-1"></script><script src="src/kernel-intention-concept-expansion-loop-v0-1.js?v=expansion-2"></script><script src="src/kernel-intention-contradiction-refinement-loop-v0-1.js?v=contradiction-1"></script><script src="src/kernel-intention-formula-revision-engine-v0-1.js?v=revision-1"></script><script src="src/kernel-intention-canonical-formula-ledger-v0-1.js?v=ledger-1"></script><script src="src/kernel-intention-proof-output-v0-1.js?v=proof-1"></script><script src="src/kernel-intention-minimal-pair-library-v0-1.js?v=minpair-1"></script><script src="src/kernel-intention-dimension-splitting-v0-1.js?v=split-2"></script><script src="src/kernel-intention-coefficient-dimension-revision-engine-v0-1.js?v=codim-1"></script><script>const tests=[];let packet=null;function add(n,f){tests.push({name:n,fn:f})}function assert(c,m){if(!c)throw new Error(m)}function arr(v){return Array.isArray(v)?v:[]}function revisions(){return arr(packet&&packet.staged_revisions)}add('modules load and doctrine is coefficient-dimension revision only',()=>{assert(window.KernelIntentionCoefficientDimensionRevisionEngineV01,'coefficient/dimension revision engine missing');assert(KernelIntentionCoefficientDimensionRevisionEngineV01.VERSION==='0.1.0','version wrong');assert(typeof KernelIntentionCoefficientDimensionRevisionEngineV01.runRevisionEngine==='function','runRevisionEngine missing');const d=KernelIntentionCoefficientDimensionRevisionEngineV01.doctrine();assert(d.stages_split_dimension_formula_revisions===true,'staging doctrine missing');assert(d.revisions_are_candidate_versions_not_doctrine===true,'candidate guard missing');assert(d.source_formula_snapshots_preserved===true,'snapshot guard missing');assert(d.no_source_formula_mutation===true,'source mutation guard missing');assert(d.old_dimension_mass_is_redistributed_not_inflated===true,'mass redistribution guard missing');assert(d.force_intensity_outside_shape==='F = M · i','force guard missing');assert(d.belief_movement==='none','belief movement wrong')});add('revision engine runs from split candidates and ledger',()=>{packet=KernelIntentionCoefficientDimensionRevisionEngineV01.runRevisionEngine();assert(packet.ok===true,'packet not ok: '+JSON.stringify(packet.validation));assert(packet.source_split_ok===true,'source split not ok');assert(packet.source_split_candidate_count===55,'expected 55 source split candidates');assert(packet.source_ledger_ok===true,'source ledger not ok');assert(packet.source_ledger_record_count===11,'expected 11 ledger records');assert(packet.belief_movement==='none','packet moved belief')});add('eleven staged revisions are produced',()=>{assert(packet.staged_revision_count===11,'expected 11 staged revisions');assert(revisions().length===11,'expected 11 revision rows');assert(packet.validation.checks.eleven_staged_revisions===true,'eleven revisions check failed')});add('each revision applies five splits and expands five dimensions to ten',()=>{revisions().forEach(r=>{assert(r.applied_split_candidate_count===5,r.concept+' split count wrong');assert(r.source_dimension_count===5,r.concept+' source dimension count wrong');assert(r.revised_dimension_count===10,r.concept+' revised dimension count wrong');assert(r.dimension_count_delta===5,r.concept+' dimension delta wrong');assert(arr(r.applied_split_candidate_ids).length===5,r.concept+' split id count wrong')});assert(packet.validation.checks.five_splits_per_revision===true,'five splits per revision check failed');assert(packet.validation.checks.dimensions_expand_5_to_10===true,'dimension expansion check failed')});add('L1 and coefficient mass are preserved',()=>{revisions().forEach(r=>{assert(r.source_l1_total===1,r.concept+' source l1 wrong: '+r.source_l1_total);assert(r.revised_l1_total===1,r.concept+' revised l1 wrong: '+r.revised_l1_total);assert(r.mass_change===0,r.concept+' mass changed: '+r.mass_change);assert(r.coefficient_delta_total===0,r.concept+' coefficient delta total changed: '+r.coefficient_delta_total);arr(r.coefficient_deltas).forEach(d=>assert(d.coefficient_delta===0,r.concept+' '+d.parent_dimension+' delta changed'))});assert(packet.validation.checks.all_l1_totals_equal_1===true,'l1 check failed');assert(packet.validation.checks.no_mass_inflation===true,'mass inflation check failed');assert(packet.validation.checks.coefficient_delta_total_zero===true,'coefficient delta check failed')});add('force terms remain outside revised shape',()=>{revisions().forEach(r=>{assert(r.force_terms_outside_shape===true,r.concept+' force leaked into revised shape');assert(r.force_equation&&r.force_equation.includes('F_')&&r.force_equation.includes('M_'),r.concept+' force equation missing')});assert(packet.validation.checks.force_terms_outside_shape===true,'force separation check failed')});add('source snapshots, guards, trails, and rollback are present',()=>{revisions().forEach(r=>{assert(r.source_formula_snapshot&&arr(r.source_formula_snapshot.shape_terms).length===5,r.concept+' source snapshot missing');assert(r.source_formula_mutated===false,r.concept+' source formula mutated');assert(arr(r.guards).length>=5,r.concept+' split guards missing');assert(arr(r.revision_trail).length>=2,r.concept+' revision trail missing');assert(r.rollback_available===true,r.concept+' rollback missing');assert(r.rollback_target&&arr(r.rollback_target.restore_shape_terms).length===5,r.concept+' rollback target wrong');assert(r.action_status==='staged_revision_not_applied',r.concept+' revision applied too early')});assert(packet.validation.checks.rollback_data_present===true,'rollback check failed')});add('candidate-only status and belief movement are preserved',()=>{revisions().forEach(r=>{assert(r.promotion_status==='not_promoted',r.concept+' promoted');assert(r.doctrine_status==='candidate_not_doctrine',r.concept+' doctrine status wrong');assert(r.belief_movement==='none',r.concept+' moved belief')});assert(packet.validation.checks.candidate_only_not_promoted===true,'candidate-only check failed');assert(packet.validation.checks.belief_movement_none===true,'belief movement check failed');assert(arr(packet.validation.errors).length===0,'validation errors present: '+packet.validation.errors.join(','))});(async function run(){const results=[];for(const t of tests){try{await t.fn();results.push({name:t.name,passed:true})}catch(e){results.push({name:t.name,passed:false,error:e.message})}}const passed=results.filter(r=>r.passed).length;document.getElementById('summary').className=passed===tests.length?'ok':'bad';document.getElementById('summary').textContent=passed+'/'+tests.length+' passed';document.getElementById('out').textContent=JSON.stringify({packet_type:'42ndMind_intention_coefficient_dimension_revision_test_report_v0_1',ok:passed===tests.length,source_split_candidate_count:packet&&packet.source_split_candidate_count,source_ledger_record_count:packet&&packet.source_ledger_record_count,staged_revision_count:packet&&packet.staged_revision_count,staged_revisions:revisions().map(r=>({concept:r.concept,revision_id:r.revision_id,applied_split_candidate_count:r.applied_split_candidate_count,source_dimension_count:r.source_dimension_count,revised_dimension_count:r.revised_dimension_count,source_l1_total:r.source_l1_total,revised_l1_total:r.revised_l1_total,mass_change:r.mass_change,coefficient_delta_total:r.coefficient_delta_total,force_terms_outside_shape:r.force_terms_outside_shape,promotion_status:r.promotion_status,belief_movement:r.belief_movement})),validation:packet&&packet.validation,results},null,2)})();</script></body></html>
