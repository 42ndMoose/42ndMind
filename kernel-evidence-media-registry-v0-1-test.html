<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>42ndMind Evidence Media Registry Test v0.1</title><style>body{margin:0;background:#0f1115;color:#eef2ff;font:14px ui-monospace,Menlo,Consolas,monospace}header{padding:16px;background:#11141b;border-bottom:1px solid #2a3040}main{padding:12px}section{background:#171a21;border:1px solid #2a3040;border-radius:10px;padding:12px}pre{white-space:pre-wrap;background:#0d1016;border:1px solid #2a3040;border-radius:10px;padding:10px;overflow:auto;max-height:760px}.ok{color:#9dffb4}.bad{color:#ff8b8b}a{color:#9db6ff}</style></head><body><header><h1>42ndMind Evidence Media Registry Test v0.1</h1><div>Validates evidence/media modality, source linkage, direction, independence, and contradiction pressure. No LLM. No lookup.</div></header><main><section><h2 id="summary">Running...</h2><div><a href="evidence-media-registry.html?v=evidence-1">evidence media registry page</a></div><pre id="out"></pre></section></main><script src="src/kernel-external-anchor-packet-schema-v0-1.js?v=anchor-1"></script><script src="src/kernel-source-provenance-registry-v0-1.js?v=prov-1"></script><script src="src/kernel-evidence-media-registry-v0-1.js?v=evidence-1"></script><script>const tests=[];let packet=null;function add(n,f){tests.push({name:n,fn:f})}function assert(c,m){if(!c)throw new Error(m)}function arr(v){return Array.isArray(v)?v:[]}function records(){return arr(packet&&packet.evidence_records)}function validation(){return packet&&packet.validation||{}}function postureCounts(){return packet&&packet.evidence_posture_counts||{}}function directionCounts(){return packet&&packet.evidence_direction_counts||{}}function byEvidence(id){return records().find(r=>r.evidence_id===id)}add('module loads and doctrine tracks evidence without truth promotion',()=>{assert(window.KernelExternalAnchorPacketSchemaV01,'anchor schema missing');assert(window.KernelSourceProvenanceRegistryV01,'source provenance missing');assert(window.KernelEvidenceMediaRegistryV01,'evidence registry missing');assert(KernelEvidenceMediaRegistryV01.VERSION==='0.1.0','version wrong');assert(typeof KernelEvidenceMediaRegistryV01.runRegistry==='function','runRegistry missing');const d=KernelEvidenceMediaRegistryV01.doctrine();assert(d.tracks_evidence_media_without_truth_promotion===true,'evidence doctrine missing');assert(d.support_and_counterevidence_direction_are_separate_from_truth===true,'direction doctrine missing');assert(d.contradiction_contribution_is_pressure_not_resolution===true,'contradiction doctrine missing');assert(d.media_lookup_is_not_automatic===true,'media lookup guard missing');assert(d.source_lookup_is_not_automatic===true,'source lookup guard missing');assert(d.llm_is_not_required===true,'LLM guard missing');assert(d.belief_movement==='none','belief movement wrong')});add('registry runs from anchor schema and source provenance registry',()=>{packet=KernelEvidenceMediaRegistryV01.runRegistry();assert(packet.ok===true,'packet not ok: '+JSON.stringify(validation()));assert(packet.source_anchor_schema_ok===true,'anchor schema not ok');assert(packet.source_provenance_registry_ok===true,'source provenance not ok');assert(packet.evidence_record_count===5,'expected 5 evidence records');assert(packet.lookup_performed===false,'packet lookup performed');assert(packet.llm_used===false,'packet used LLM');assert(packet.adjudicates_truth===false,'packet adjudicated truth');assert(packet.belief_movement==='none','packet moved belief')});add('evidence modalities and directions are visible',()=>{assert(postureCounts().media_description_evidence>=1,'missing media evidence');assert(postureCounts().documentary_description_evidence>=1,'missing documentary evidence');assert((postureCounts().user_description_evidence||0)+(postureCounts().direct_description_evidence||0)>=1,'missing user/direct evidence');assert(directionCounts().support>=1,'support direction missing');records().forEach(r=>{assert(r.evidence_modality&&r.evidence_modality!=='unknown_evidence_modality',r.evidence_id+' unknown modality');assert(r.evidence_direction,r.evidence_id+' missing direction');assert(r.weight_posture,r.evidence_id+' missing weight posture')});assert(validation().checks.evidence_modalities_distinguished===true,'modality check failed');assert(validation().checks.support_direction_visible===true,'support direction check failed')});add('source links resolve and lookup remains false',()=>{records().forEach(r=>{assert(r.source_ref_resolves===true,r.evidence_id+' source ref unresolved');assert(r.source_ref,r.evidence_id+' missing source ref');assert(r.source_modality,r.evidence_id+' missing source modality');assert(r.media_lookup_performed===false,r.evidence_id+' media lookup performed');assert(r.source_lookup_performed===false,r.evidence_id+' source lookup performed')});assert(validation().checks.source_links_resolve===true,'source link check failed');assert(validation().checks.no_media_lookup===true,'media lookup check failed');assert(validation().checks.no_source_lookup===true,'source lookup check failed')});add('independence groups and claim evidence summaries are present',()=>{assert(packet.independence_summary.evidence_independence_group_count>=3,'expected at least 3 evidence groups');assert(packet.independence_summary.independent_convergence_possible_only_across_distinct_groups===true,'independence guard missing');assert(arr(packet.claim_evidence_summaries).length>=1,'claim evidence summaries missing');const cost=packet.claim_evidence_summaries.find(r=>r.claim_id==='claim_cost_change');assert(cost,'cost claim summary missing');assert(cost.support_count>=2,'cost claim should have at least two support records');assert(cost.independent_group_count>=2,'cost claim should have at least two independence groups');assert(validation().checks.independence_groups_tracked===true,'independence check failed');assert(validation().checks.claim_evidence_summary_present===true,'claim summary check failed')});add('contradiction pressure remains pressure, not resolution',()=>{assert(packet.contradiction_summary,'contradiction summary missing');assert(packet.contradiction_summary.contradiction_status!=='resolved','contradiction was resolved');records().forEach(r=>assert(r.contradiction_status!=='resolved',r.evidence_id+' contradiction resolved'));assert(validation().checks.contradiction_pressure_visible_not_resolved===true,'contradiction pressure check failed')});add('no LLM, no truth promotion, candidate-only status, and belief movement are preserved',()=>{records().forEach(r=>{assert(r.evidence_status==='candidate_context_not_truth',r.evidence_id+' promoted evidence to truth');assert(r.promotion_status==='not_promoted',r.evidence_id+' promoted');assert(r.doctrine_status==='candidate_not_doctrine',r.evidence_id+' doctrine status wrong');assert(r.belief_movement==='none',r.evidence_id+' moved belief')});assert(packet.llm_used===false,'packet used LLM');assert(validation().checks.no_llm_used===true,'no LLM check failed');assert(validation().checks.no_truth_promotion===true,'truth promotion check failed');assert(validation().checks.candidate_only_not_promoted===true,'candidate-only check failed');assert(validation().checks.belief_movement_none===true,'belief movement check failed')});add('validation report is clean',()=>{assert(validation().ok===true,'validation not ok');assert(validation().checks.five_evidence_records===true,'record count check failed');assert(validation().checks.all_evidence_records_valid===true,'record validation failed');assert(arr(validation().errors).length===0,'validation errors present: '+validation().errors.join(','))});(async function run(){const results=[];for(const t of tests){try{await t.fn();results.push({name:t.name,passed:true})}catch(e){results.push({name:t.name,passed:false,error:e.message})}}const passed=results.filter(r=>r.passed).length;document.getElementById('summary').className=passed===tests.length?'ok':'bad';document.getElementById('summary').textContent=passed+'/'+tests.length+' passed';document.getElementById('out').textContent=JSON.stringify({packet_type:'42ndMind_evidence_media_registry_test_report_v0_1',ok:passed===tests.length,source_anchor_schema_ok:packet&&packet.source_anchor_schema_ok,source_provenance_registry_ok:packet&&packet.source_provenance_registry_ok,evidence_record_count:packet&&packet.evidence_record_count,evidence_posture_counts:packet&&packet.evidence_posture_counts,evidence_direction_counts:packet&&packet.evidence_direction_counts,contradiction_summary:packet&&packet.contradiction_summary,independence_summary:packet&&packet.independence_summary,claim_evidence_summaries:packet&&packet.claim_evidence_summaries,validation:validation(),results},null,2)})();</script></body></html>
