<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>42ndMind World-Model Relation Expansion Test v0.1</title><style>body{margin:0;background:#0f1115;color:#eef2ff;font:14px ui-monospace,Menlo,Consolas,monospace}header{padding:16px;background:#11141b;border-bottom:1px solid #2a3040}main{padding:12px}section{background:#171a21;border:1px solid #2a3040;border-radius:10px;padding:12px}pre{white-space:pre-wrap;background:#0d1016;border:1px solid #2a3040;border-radius:10px;padding:10px;overflow:auto;max-height:760px}.ok{color:#9dffb4}.bad{color:#ff8b8b}a{color:#9db6ff}</style></head><body><header><h1>42ndMind World-Model Relation Expansion Test v0.1</h1><div>Tests candidate relation records between claims, packets, sources, media, narrative pressure, adversarial pressure, and uncertainty.</div></header><main><section><h2 id="summary">Running...</h2><div><a href="world-model-relation-expansion.html?v=wmrel-1">world-model relation expansion page</a></div><pre id="out"></pre></section></main><script src="src/kernel-objective-claim-language-v0-1.js?v=claim-1"></script><script src="src/kernel-objective-claim-language-v0-1-1-patch.js?v=claim-2"></script><script src="src/kernel-external-anchor-packet-schema-v0-1.js?v=anchor-1"></script><script src="src/kernel-source-provenance-registry-v0-1.js?v=prov-1"></script><script src="src/kernel-evidence-media-registry-v0-1.js?v=evidence-1"></script><script src="src/kernel-truth-pressure-synthesis-v0-1.js?v=truth-1"></script><script src="src/kernel-truth-pressure-synthesis-v0-1-1-patch.js?v=truth-2"></script><script src="src/kernel-claim-narrative-benchmark-v0-1.js?v=bench-1"></script><script src="src/kernel-adversarial-narrative-pressure-v0-1.js?v=adv-1"></script><script src="src/kernel-real-world-packet-ingestion-discipline-v0-1.js?v=ingest-1"></script><script src="src/kernel-truth-ledger-preledger-v0-1.js?v=preledger-1"></script><script src="src/kernel-truth-ledger-preledger-stress-benchmark-v0-1.js?v=prestress-1"></script><script src="src/kernel-world-model-relation-expansion-v0-1.js?v=wmrel-1"></script><script>const tests=[];let packet=null;function add(n,f){tests.push({name:n,fn:f})}function assert(c,m){if(!c)throw new Error(m)}function arr(v){return Array.isArray(v)?v:[]}function records(){return arr(packet&&packet.relation_records)}function validation(){return packet&&packet.validation||{}}function families(){return new Set(records().map(r=>r.relation_family))}function groups(){return new Set(records().map(r=>r.relation_group))}function unresolved(){return records().flatMap(r=>arr(r.unresolved_items))}add('module loads and doctrine is relation-only, not final truth',()=>{assert(window.KernelTruthLedgerPreledgerStressBenchmarkV01,'source stress benchmark missing');assert(window.KernelWorldModelRelationExpansionV01,'world-model relation expansion missing');assert(KernelWorldModelRelationExpansionV01.VERSION==='0.1.0','version wrong');const d=KernelWorldModelRelationExpansionV01.doctrine();assert(d.relation_expansion_only_not_final_truth===true,'relation-only doctrine missing');assert(d.world_model_relations_are_candidate_pressure===true,'candidate pressure doctrine missing');assert(d.relation_direction_must_be_explicit===true,'direction doctrine missing');assert(d.no_llm===true,'no LLM doctrine missing');assert(d.no_external_lookup===true,'no lookup doctrine missing');assert(d.belief_movement==='none','belief movement wrong')});add('relation expansion runs from preledger stress benchmark',()=>{packet=KernelWorldModelRelationExpansionV01.runWorldModelRelationExpansion();assert(packet.ok===true,'packet not ok: '+JSON.stringify(validation()));assert(packet.source_stress_ok===true,'source stress not ok');assert(packet.source_stress_version==='0.1.0','source stress version wrong');assert(packet.source_stress_record_count===16,'expected 16 stress records');assert(packet.relation_record_count>=24,'expected at least 24 relation records');assert(packet.relation_family_count>=12,'expected at least 12 relation families');assert(packet.world_model_relation_expansion_is_final_truth_authority===false,'became final authority');assert(packet.adjudicates_final_truth===false,'adjudicated final truth')});add('causal, temporal, evidential, contradiction, source, media, narrative, adversarial, and uncertainty groups are represented',()=>{['causal','temporal','evidential','contradiction','source','media','narrative','adversarial','uncertainty'].forEach(g=>assert(groups().has(g),g+' group missing'));assert(validation().checks.relation_groups_cover_core_world_model===true,'core group check failed')});add('required relation families are represented',()=>{['causes_or_contributes_to','temporally_precedes','temporally_follows','supports','counters','contradicts','depends_on','requires_evidence_for','source_reports','source_duplicates','source_independent_of','media_describes','media_unverified_for','contextualizes','narrows_scope','broadens_scope','injects_quantifier','removes_condition','clips_quote','strips_context','stuffs_motive','launders_source','weaponizes_ambiguity','leaves_unresolved'].forEach(f=>assert(families().has(f),f+' missing'));assert(validation().checks.required_relation_families_present===true,'required family check failed')});add('relation direction is explicit and not silently reversed',()=>{records().forEach(r=>{assert(['source_to_target','target_to_source','bidirectional_candidate'].includes(r.relation_direction),r.relation_id+' bad direction');assert(r.active_guards&&r.active_guards.relation_direction_explicit===true,r.relation_id+' direction guard missing');assert(r.active_guards&&r.active_guards.no_direction_reversal_without_recorded_revision===true,r.relation_id+' direction reversal guard missing')});assert(records().some(r=>r.relation_direction==='target_to_source'),'target_to_source temporal relation missing');assert(validation().checks.direction_explicit_for_all===true,'direction validation failed');assert(validation().checks.no_silent_direction_reversal===true,'direction reversal validation failed')});add('relation strength remains candidate pressure, not truth',()=>{records().forEach(r=>{assert(r.relation_status==='candidate_not_truth',r.relation_id+' relation status unsafe');assert(r.truth_status==='not_adjudicated',r.relation_id+' truth adjudicated');assert(r.relation_strength_candidate>=0&&r.relation_strength_candidate<=1,r.relation_id+' strength out of range');assert(r.pressure_components&&r.pressure_components.relation_strength_candidate===r.relation_strength_candidate,r.relation_id+' pressure mismatch')});assert(validation().checks.strength_candidate_not_truth===true,'strength candidate check failed');assert(validation().checks.final_authority_false===true,'final authority check failed')});add('unresolved items and guards remain visible',()=>{assert(unresolved().includes('adversarial_relation_pressure_not_truth'),'adversarial unresolved missing');assert(unresolved().includes('causal_bridge_required_before_causal_truth'),'causal bridge unresolved missing');assert(unresolved().includes('media_relation_not_verification'),'media unresolved missing');assert(unresolved().includes('source_relation_not_lookup'),'source lookup unresolved missing');assert(unresolved().includes('contradiction_relation_detected_not_resolved'),'contradiction unresolved missing');assert(validation().checks.unresolved_items_visible_for_all===true,'unresolved items check failed');assert(validation().checks.guards_visible_for_all===true,'guards visible check failed')});add('rollback, revision trail, no silent mutation, no LLM, no lookup, candidate-only, and belief movement are preserved',()=>{records().forEach(r=>{assert(r.rollback_available===true,r.relation_id+' rollback unavailable');assert(r.rollback_snapshot&&r.rollback_snapshot.source_stress_record,r.relation_id+' rollback source missing');assert(arr(r.revision_trail).length>=1,r.relation_id+' revision trail missing');assert(arr(r.revision_trail).every(v=>v.silent_mutation===false),r.relation_id+' silent mutation present');assert(r.llm_used===false,r.relation_id+' LLM used');assert(r.external_lookup_performed===false,r.relation_id+' external lookup performed');assert(r.media_lookup_performed===false,r.relation_id+' media lookup performed');assert(r.promotion_status==='not_promoted',r.relation_id+' promoted');assert(r.doctrine_status==='candidate_not_doctrine',r.relation_id+' doctrine status unsafe');assert(r.belief_movement==='none',r.relation_id+' belief movement not none')});assert(validation().checks.rollback_available_for_all===true,'rollback check failed');assert(validation().checks.revision_trail_present_for_all===true,'revision trail check failed');assert(validation().checks.no_silent_mutation===true,'silent mutation check failed');assert(validation().checks.no_llm_used===true,'no LLM check failed');assert(validation().checks.no_external_or_media_lookup===true,'lookup check failed');assert(validation().checks.candidate_only_not_promoted===true,'candidate-only check failed');assert(validation().checks.belief_movement_none===true,'belief movement check failed');assert(arr(validation().errors).length===0,'validation errors present: '+validation().errors.join(','))});(async function run(){const results=[];for(const t of tests){try{await t.fn();results.push({name:t.name,passed:true})}catch(e){results.push({name:t.name,passed:false,error:e.message})}}const passed=results.filter(r=>r.passed).length;document.getElementById('summary').className=passed===tests.length?'ok':'bad';document.getElementById('summary').textContent=passed+'/'+tests.length+' passed';document.getElementById('out').textContent=JSON.stringify({packet_type:'42ndMind_world_model_relation_expansion_test_report_v0_1',ok:passed===tests.length,source_stress_ok:packet&&packet.source_stress_ok,source_stress_version:packet&&packet.source_stress_version,source_stress_record_count:packet&&packet.source_stress_record_count,relation_record_count:packet&&packet.relation_record_count,relation_family_count:packet&&packet.relation_family_count,relation_group_count:packet&&packet.relation_group_count,relation_family_counts:packet&&packet.relation_family_counts,relation_group_counts:packet&&packet.relation_group_counts,records:records().map(r=>({relation_id:r.relation_id,relation_family:r.relation_family,relation_group:r.relation_group,relation_direction:r.relation_direction,relation_strength_candidate:r.relation_strength_candidate,relation_status:r.relation_status,source_node_id:r.source_node_id,target_node_id:r.target_node_id,unresolved_item_count:r.unresolved_items.length,rollback_available:r.rollback_available,truth_status:r.truth_status,promotion_status:r.promotion_status,belief_movement:r.belief_movement})),validation:validation(),results},null,2)})();</script></body></html>
