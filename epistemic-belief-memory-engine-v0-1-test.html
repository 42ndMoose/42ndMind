<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>42ndMind Belief-Memory Engine Test v0.1</title><style>body{margin:0;background:#0f1115;color:#eef2ff;font:14px ui-monospace,Menlo,Consolas,monospace}header{padding:16px;background:#11141b;border-bottom:1px solid #2a3040}main{padding:12px}section{background:#171a21;border:1px solid #2a3040;border-radius:10px;padding:12px}pre{white-space:pre-wrap;background:#0d1016;border:1px solid #2a3040;border-radius:10px;padding:10px;overflow:auto;max-height:820px}.ok{color:#9dffb4}.bad{color:#ff8b8b}a{color:#9db6ff}</style></head><body><header><h1>42ndMind Belief-Memory Engine Test v0.1</h1><div>Tests core-readable memory, source trust, provisional belief, self-challenge, and non-final truth discipline.</div></header><main><section><h2 id="summary">Running...</h2><pre id="out"></pre></section></main><script src="src/epistemic-kernel-v0-2.js?v=corebase-1"></script><script src="src/epistemic-kernel-v0-2-patches.js?v=coremig-1"></script><script src="src/kernel-brain-v0-4.js?v=brain-2"></script><script src="src/kernel-brain-epistemic-kernel-bridge-v0-1.js?v=bridge-2"></script><script src="src/epistemic-kernel-maturity-core-v0-1.js?v=maturity-2"></script><script src="src/epistemic-kernel-active-curiosity-v0-1.js?v=curiosity-2"></script><script src="src/epistemic-kernel-learning-drive-v0-1.js?v=learn-1"></script><script src="src/epistemic-kernel-belief-memory-engine-v0-1.js?v=belief-1"></script><script>const tests=[];let kernel=null,binding=null,boundBrain=null,event1=null,event2=null;const philosophy=`race jokes should not be mistaken for racist jokes, and the boundary between the two won't always be obvious. but speaking about it will always be better than silencing it for the sake of malicious governance or overly and unnecessarily dodging sensitivity, as it prevents humanity from improving as a collective conscience. stereotyping comes from pattern recognition which is natural and is applied to any aspects rather than exclusively for race. stereotyping comes either from lack of internal reform, whether it's a specific culture in a neighborhood, or a group of delinquents in the classroom. or it comes from misconceptions where the environment should have the wisdom gained from good-faith, high-trust, collective conscience to be able to handle the misconception accordingly, without the need of any government policy to do so.`;function add(n,f){tests.push({name:n,fn:f})}function assert(c,m){if(!c)throw new Error(m)}function arr(v){return Array.isArray(v)?v:[]}function shared(){return kernel&&kernel.state&&kernel.state.unifiedCore}function core(){return shared()&&shared().beliefMemoryCore}function mat(){return shared()&&shared().maturityCore}function has(rows,fn){return arr(rows).some(fn)}function noFinalRows(rows){return arr(rows).every(r=>r.truth_status==='not_final'&&r.promotion_status==='not_promoted_to_final_truth'&&r.belief_movement==='provisional_only')}add('module loads and patches EpistemicKernel, KernelBrain, and bridge',()=>{assert(window.EpistemicKernelBeliefMemoryEngineV01,'belief memory engine missing');assert(EpistemicKernelBeliefMemoryEngineV01.VERSION==='0.1.0','version mismatch');assert(EpistemicKernel.__beliefMemoryPatchApplied===true,'EpistemicKernel patch missing');assert(KernelBrainV04.__beliefMemoryPatchApplied===true,'KernelBrain patch missing');assert(KernelBrainEpistemicKernelBridgeV01.__beliefMemoryPatchApplied===true,'Bridge patch missing')});add('binding creates beliefMemoryCore inside shared owned state',()=>{kernel=new EpistemicKernel();binding=KernelBrainEpistemicKernelBridgeV01.bind(kernel);boundBrain=binding.bound_brain;assert(boundBrain.state===shared(),'bound brain does not share unified state');assert(core(),'beliefMemoryCore missing');assert(core().doctrine.belief_memory_engine_lives_inside_owned_state===true,'owned-state doctrine missing');assert(core().doctrine.memory_is_core_readable_drawer_not_connector===true,'memory drawer doctrine missing');assert(typeof boundBrain.refreshBeliefMemory==='function','boundBrain refreshBeliefMemory missing')});add('raw philosophy produces inferred principles and boundaries without manual labels',()=>{event1=boundBrain.ingest(philosophy,{kind:'belief_memory_philosophy_test'});boundBrain.refreshBeliefMemory('test_after_ingest');assert(has(core().inferred_principles,p=>/Race jokes and racist jokes are not identical categories/.test(p.statement)),'race/racist principle missing');assert(has(core().inferred_boundaries,b=>/intent, context, hostility, dehumanization, trust, correction/.test(b.statement)),'inferred boundary missing');assert(has(core().inferred_conditions,c=>c.condition==='intent'),'intent condition missing');assert(has(core().inferred_conditions,c=>c.condition==='dehumanization'),'dehumanization condition missing');assert(has(core().inferred_conditions,c=>c.condition==='false_hostile_overgeneralization'),'false hostile overgeneralization condition missing')});add('user trust profile is created or updated',()=>{assert(core().user_trust_profile,'user trust profile missing');assert(core().user_trust_profile.source_id==='direct_user','wrong source id');assert(core().user_trust_profile.observed_inputs>=1,'observed input not counted');assert(core().user_trust_profile.trust_score_candidate>0.55,'trust candidate did not rise from clear input');assert(has(core().source_trust_profiles,p=>p.source_id==='direct_user'),'source trust profile not listed')});add('learned context can become provisional belief, not final truth',()=>{assert(has(core().memory_items,m=>m.memory_kind==='raw_user_statement'),'raw memory missing');assert(has(core().memory_items,m=>m.memory_kind==='provisional_user_belief'),'provisional belief memory missing');assert(has(core().provisional_beliefs,b=>b.belief_stage==='provisional_belief'),'provisional belief missing');assert(has(core().provisional_beliefs,b=>b.confidence_separation==='belief_about_user_worldview_not_objective_truth_about_world'),'confidence separation missing');assert(core().truth_status==='not_final','core truth status wrong');assert(core().promotion_status==='not_promoted_to_final_truth','core promotion status wrong');assert(core().belief_movement==='provisional_only','core belief movement wrong')});add('provisional belief has confidence, source trust, challenges, and truth requirements',()=>{const belief=core().provisional_beliefs.find(b=>/stereotyping is a natural pattern-recognition process/.test(b.statement));assert(belief,'target belief missing');assert(belief.belief_confidence>0.7,'belief confidence too low');assert(belief.source_id==='direct_user','belief source missing');assert(belief.source_trust_score_candidate>0.55,'source trust missing');assert(arr(belief.open_truth_requirements).includes('causal_bridge'),'belief open causal bridge missing');assert(has(core().belief_challenges,c=>/false positives and unfair generalizations/.test(c.challenge)),'challenge missing');assert(has(core().open_truth_requirements,r=>r.requirement_kind==='exception_conditions'),'exception requirement missing');assert(has(core().open_truth_requirements,r=>r.requirement_kind==='causal_bridge'),'causal bridge requirement missing')});add('kernel asks fewer but better questions based on missing truth conditions',()=>{const questions=arr(core().active_questions).map(q=>q.question_text);assert(questions.length>0&&questions.length<=4,'wrong question count');assert(questions.some(q=>/personal worldview fragment/.test(q))||questions.some(q=>/fail in a real case/.test(q)),'useful follow-up missing');assert(!questions.some(q=>/^What is the boundary\?/i.test(q)),'bad boundary question present');assert(!questions.some(q=>/^What is this text supposed to be/i.test(q)),'bad manual-label question present');assert(!questions.some(q=>/Is this your principle, a boundary,/.test(q)),'bad principle/boundary label question present')});add('memory items are reusable in future input',()=>{event2=boundBrain.ingest('For future speech and humor questions, remember the same race joke boundary: context, intent, trust, hostility, dehumanization, and correction matter.',{kind:'belief_memory_reuse_test'});boundBrain.refreshBeliefMemory('test_memory_reuse');assert(arr(core().memory_items).length>=4,'memory did not persist');assert(has(core().memory_reuse_hits,r=>arr(r.memory_hits).length>0),'memory reuse hit missing');assert(has(core().memory_reuse_hits,r=>JSON.stringify(r.memory_hits).includes('race jokes')||JSON.stringify(r.memory_hits).includes('race joke')),'race-joke memory not reused')});add('no final truth promotion occurs anywhere in belief-memory core',()=>{assert(core().truth_status==='not_final','core truth promoted');assert(core().promotion_status==='not_promoted_to_final_truth','core final promoted');assert(core().belief_movement==='provisional_only','core movement not provisional');['memory_items','inferred_principles','inferred_boundaries','inferred_causal_claims','inferred_worldview_fragments','provisional_beliefs','belief_challenges','open_truth_requirements','active_questions'].forEach(k=>assert(noFinalRows(core()[k]),k+' has final truth movement'));assert(arr(shared().beliefCommitments).length===0,'beliefCommitments should remain empty')});add('objective maturity remains identity center',()=>{assert(mat(),'maturity core missing');assert(mat().core_philosophy==='objective_peak_philosophical_maturity','maturity core philosophy wrong');assert(mat().identity_lock==='self_continuity_not_external_guardrail','maturity identity lock missing');assert(mat().wants_peak===true&&mat().aims_at_peak===true&&mat().stays_at_peak===true,'peak identity flags wrong');assert(mat().self_position&&mat().self_position.y===1,'self position not peak')});(async function run(){const results=[];for(const t of tests){try{await t.fn();results.push({name:t.name,passed:true})}catch(e){results.push({name:t.name,passed:false,error:e.message})}}const passed=results.filter(r=>r.passed).length;document.getElementById('summary').className=passed===tests.length?'ok':'bad';document.getElementById('summary').textContent=passed+'/'+tests.length+' passed';document.getElementById('out').textContent=JSON.stringify({packet_type:'42ndMind_belief_memory_engine_v0_1_test_report',ok:passed===tests.length,belief_memory_loaded:!!window.EpistemicKernelBeliefMemoryEngineV01,shared_state_summary:shared()&&{state_type:shared().state_type,stats:shared().stats,events:arr(shared().runtimeEvents).length,beliefs:arr(shared().beliefCommitments).length},beliefMemoryCore:core(),maturityCore:mat(),results},null,2)})();</script></body></html>
