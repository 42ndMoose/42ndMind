<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>42ndMind Objective Language Goal v0.1 Test</title>
  <style>
    body { margin:0; font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; background:#0f1115; color:#eef2ff; }
    header { padding:16px 18px; border-bottom:1px solid #2a3040; background:#11141b; }
    main { padding:12px; }
    section { background:#171a21; border:1px solid #2a3040; border-radius:10px; padding:12px; }
    h1 { font:700 19px/1.2 system-ui,-apple-system,Segoe UI,sans-serif; margin:0 0 4px; }
    pre { white-space:pre-wrap; background:#0d1016; border:1px solid #2a3040; border-radius:10px; padding:10px; overflow:auto; max-height:760px; }
    .ok { color:#9dffb4; } .bad { color:#ff8b8b; } a { color:#9db6ff; }
  </style>
</head>
<body>
<header><h1>42ndMind Objective Language Goal v0.1 Test</h1><div>Tests the kernel goal layer for truth-seeking plus objective-language discovery. This is a goal/constraint module, not doctrine promotion.</div></header>
<main><section><h2 id="summary">Running...</h2><div><a href="objective-language-goal.html">objective language goal</a> · <a href="semantic-law-invariance-tester.html">law invariance tester</a></div><pre id="out"></pre></section></main>
<script src="src/kernel-objective-language-goal-v0-1.js?v=0.1.0"></script>
<script>
  const tests = [];
  function add(name, fn) { tests.push({ name, fn }); }
  function assert(cond, msg) { if (!cond) throw new Error(msg); }

  add('module loads', () => {
    assert(window.KernelObjectiveLanguageGoalV01, 'KernelObjectiveLanguageGoalV01 missing');
    assert(KernelObjectiveLanguageGoalV01.VERSION === '0.1.0', 'version wrong');
  });

  add('doctrine preserves no belief movement', () => {
    const d = KernelObjectiveLanguageGoalV01.doctrine();
    assert(d.kernel_goal_is_truth_seeking_plus_objective_language_discovery === true, 'goal doctrine missing');
    assert(d.objective_language_is_canonical_structure_not_english_labels === true, 'canonical structure doctrine missing');
    assert(d.correct_discoverers_should_converge_up_to_isomorphism === true, 'isomorphism doctrine missing');
    assert(d.active_intention_shapes_are_l1_normalized === true, 'intention normalization doctrine missing');
    assert(d.declared_intention_is_not_automatically_validated_intention === true, 'declared intention separation missing');
    assert(d.belief_movement === 'none', 'belief movement wrong');
  });

  add('objectiveLanguageGoal exposes correct target', () => {
    const goal = KernelObjectiveLanguageGoalV01.objectiveLanguageGoal();
    assert(goal.packet_type === '42ndMind_objective_language_goal_v0_1', 'wrong packet type');
    assert(goal.thesis.includes('truth'), 'thesis should mention truth');
    assert(goal.target_definition.includes('not a preferred notation'), 'notation warning missing');
    assert(goal.convergence_condition.includes('isomorphic'), 'isomorphism condition missing');
    assert(goal.canonical_pipeline.includes('isomorphism class'), 'pipeline missing isomorphism class');
    assert(goal.formal_candidate_shape.semantic_law === 'L := (O, v, B, C, tau)', 'formal shape wrong');
    assert(goal.belief_movement === 'none', 'goal moved belief');
  });

  add('intention hypothesis separates normalized shape from force', () => {
    const goal = KernelObjectiveLanguageGoalV01.objectiveLanguageGoal();
    const h = goal.intention_hypothesis;
    assert(h.normalized_shape.includes('||i||_1 = 1'), 'normalized intention shape missing');
    assert(h.separate_force.includes('F = M'), 'force equation missing');
    assert(h.warning.includes('Declared intention'), 'declared intention warning missing');
  });

  add('normalizeIntentionVector creates L1-normalized shape', () => {
    const packet = KernelObjectiveLanguageGoalV01.normalizeIntentionVector([
      { id:'attachment', value:25, role:'bonding_pressure' },
      { id:'attraction', value:20, role:'approach_pressure' },
      { id:'care', value:20, role:'protective_pressure' },
      { id:'future', value:20, role:'future_projection' },
      { id:'identity', value:15, role:'self_model_binding' }
    ], { intensity_scalar: 2 });
    assert(packet.packet_type === '42ndMind_normalized_intention_vector_v0_1', 'wrong normalized packet');
    assert(packet.components.length === 5, 'component count wrong');
    assert(packet.l1_norm === 1, 'L1 norm should equal 1');
    assert(packet.active_shape_total === 1, 'active shape total should equal 1');
    assert(packet.behavioral_force_vector.reduce((s, v) => s + Math.abs(v), 0).toFixed(8) === '2.00000000', 'force vector should scale by intensity');
    assert(packet.warning.includes('does not validate'), 'validation warning missing');
    assert(packet.belief_movement === 'none', 'intention packet moved belief');
  });

  add('zero intention vector stays zero without fake certainty', () => {
    const packet = KernelObjectiveLanguageGoalV01.normalizeIntentionVector([{ id:'x', value:0 }, { id:'y', value:0 }]);
    assert(packet.l1_norm === 0, 'zero vector norm should stay 0');
    assert(packet.components.every(c => c.normalized_value === 0), 'zero vector should not fake normalize');
  });

  add('isomorphism criteria reject label finalism', () => {
    const criteria = KernelObjectiveLanguageGoalV01.isomorphicGoalCriteria();
    assert(criteria.criteria.some(c => c.includes('Strip local language labels')), 'strip language criterion missing');
    assert(criteria.criteria.some(c => c.includes('Do not treat matching labels')), 'label warning missing');
    assert(criteria.belief_movement === 'none', 'criteria moved belief');
  });

  add('goal alignment check accepts aligned packets', () => {
    const packet = { belief_movement:'none', contrast_boundaries:[], objective_language_claim:'candidate_fragments_detected_not_final_math' };
    const check = KernelObjectiveLanguageGoalV01.goalAlignmentCheck(packet);
    assert(check.ok === true, 'aligned packet should pass');
    assert(check.recommendation === 'aligned_with_objective_language_discovery_goal', 'aligned recommendation wrong');
  });

  add('goal alignment check flags final-notation drift', () => {
    const packet = { belief_movement:'none', final_notation:true, promote_doctrine:true, objective_language_claim:'final_math' };
    const check = KernelObjectiveLanguageGoalV01.goalAlignmentCheck(packet);
    assert(check.ok === false, 'drift packet should fail');
    assert(check.flags.avoids_label_finalism === false, 'label finalism flag wrong');
    assert(check.flags.avoids_doctrine_promotion === false, 'doctrine promotion flag wrong');
    assert(check.recommendation === 'review_for_goal_drift', 'drift recommendation wrong');
  });

  (async function run(){
    const results = [];
    for (const t of tests) {
      try { await t.fn(); results.push({ name:t.name, passed:true }); }
      catch(e) { results.push({ name:t.name, passed:false, error:e.message }); }
    }
    const passed = results.filter(r => r.passed).length;
    document.getElementById('summary').className = passed === results.length ? 'ok' : 'bad';
    document.getElementById('summary').textContent = `${passed}/${results.length} passed`;
    document.getElementById('out').textContent = JSON.stringify({
      packet_type:'42ndMind_objective_language_goal_v0_1_test_report',
      results
    }, null, 2);
  })();
</script>
</body>
</html>
