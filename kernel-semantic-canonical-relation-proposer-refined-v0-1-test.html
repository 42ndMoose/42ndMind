<script>
  const tests=[]; let packet=null;
  function add(name,fn){tests.push({name,fn});} function assert(cond,msg){if(!cond)throw new Error(msg);} function asArray(v){return Array.isArray(v)?v:[];}
  add('modules load',()=>{assert(window.KernelSemanticCanonicalRelationProposerRefinedV01,'refined proposer missing');assert(KernelSemanticCanonicalRelationProposerRefinedV01.VERSION==='0.1.0','version wrong');assert(KernelSemanticLawCandidateExtractorV01.VERSION==='0.1.1','law extractor patch not loaded');});
  add('doctrine preserves objective-language candidate status',()=>{const d=KernelSemanticCanonicalRelationProposerRefinedV01.doctrine();assert(d.refined_relations_use_basis_refinement_law_candidates===true,'refined law doctrine missing');assert(d.relation_graph_is_objective_language_candidate_not_final_math===true,'objective candidate doctrine missing');assert(d.active_shape_l1_total==='sum_abs_dimensions_equals_1','unit-total rule missing');assert(d.belief_movement==='none','belief movement wrong');});
  add('load refined relation proposal succeeds',async()=>{packet=await KernelSemanticCanonicalRelationProposerRefinedV01.loadRefinedCanonicalizeAndPropose({min_template_observations:2,min_observations:2,limit:10,sentences_per_template:4,allowed_extra_pressures:0,min_strong_observations:4});assert(packet.ok===true,'refined relation packet not ok');assert(packet.summary.basis_refinement_law_count===12,'expected 12 basis-refinement laws');assert(packet.summary.suppressed_collapsed_law_count===4,'expected 4 suppressed collapsed laws');assert(packet.summary.split_checks_passed===true,'split checks failed');assert(packet.belief_movement==='none','packet moved belief');});
  add('bad equivalences stay split',()=>{const checks=packet.split_checks;const expert=checks.find(c=>c.pair==='expert/settled');const collusion=checks.find(c=>c.pair==='collusion/coordinated');assert(expert && expert.split===true,'expert/settled not split');assert(collusion && collusion.split===true,'collusion/coordinated not split');assert(expert.collapsed===false,'expert/settled collapsed');assert(collusion.collapsed===false,'collusion/coordinated collapsed');});
  add('relation graph is populated and non-doctrinal',()=>{const g=packet.relation_graph;assert(g.node_count===packet.summary.canonical_vector_count,'node count mismatch');assert(g.edge_count===packet.summary.relation_candidate_count,'edge count mismatch');assert(g.nodes.every(n=>n.belief_movement==='none'),'node moved belief');assert(g.edges.every(e=>e.belief_movement==='none'),'edge moved belief');assert(g.belief_movement==='none','graph moved belief');});
  add('remaining equivalences are surfaced as review targets',()=>{assert(packet.summary.remaining_equivalence_target_count>=1,'expected remaining equivalence targets');assert(asArray(packet.remaining_equivalence_targets).every(t=>t.review_requirement.includes('Review whether')),'review requirement missing');assert(asArray(packet.remaining_equivalence_targets).every(t=>t.belief_movement==='none'),'remaining target moved belief');});
  add('summary exposes refined relation counts',()=>{assert(packet.summary.basis_dimension_count===19,'basis dimension count wrong');assert(packet.summary.canonical_vector_count===16,'canonical vector count wrong');assert(packet.summary.law_candidate_count===16,'law candidate count wrong');assert(packet.summary.relation_candidate_count>=1,'relation candidates missing');assert(packet.summary.objective_language_claim==='refined_relation_candidates_under_anonymous_basis_not_final_math','objective claim wrong');});
  (async function run(){const results=[];for(const t of tests){try{await t.fn();results.push({name:t.name,passed:true});}catch(e){results.push({name:t.name,passed:false,error:e.message});}}const passed=results.filter(r=>r.passed).length;document.getElementById('summary').className=passed===results.length?'ok':'bad';document.getElementById('summary').textContent=`${passed}/${results.length} passed`;document.getElementById('out').textContent=JSON.stringify({packet_type:'42ndMind_refined_canonical_relation_proposer_v0_1_test_report',summary:packet&&packet.summary,split_checks:packet&&packet.split_checks,remaining_equivalence_targets:packet&&packet.remaining_equivalence_targets,results},null,2);})();
</script>
