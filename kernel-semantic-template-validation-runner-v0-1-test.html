<script src="src/kernel-semantic-template-validation-runner-v0-1.js?v=0.1.0"></script>
<script>
  const tests = [];
  let fullPacket = null;
  function add(name, fn) { tests.push({ name, fn }); }
  function assert(cond, msg) { if (!cond) throw new Error(msg); }

  const syntheticPlan = {
    packet_type: '42ndMind_semantic_vector_template_plan_v0_1_test_fixture',
    packet_version: '0.0.0-test',
    vector_count: 2,
    template_count: 2,
    selected_template_count: 2,
    suggested_sentence_count: 2,
    selected_templates: [
      {
        template_id: 'fixture_accusation_risk',
        template_group: 'accusation_risk_direct_evidence_gap',
        pressure_signature: 'accusation_pressure|direct_link_evidence_burden|evidence_gap_pressure|reputational_risk_pressure',
        operator_names: ['reckless_accusation'],
        observation_count: 4,
        priority: 100,
        high_risk_pressures: ['direct_link_evidence_burden'],
        safety_rule: 'direct_evidence_required',
        suggested_sentences: ['The post makes a serious accusation without showing a direct evidence link.']
      },
      {
        template_id: 'fixture_unmatched',
        template_group: 'manual_review_required',
        pressure_signature: 'imaginary_pressure',
        operator_names: ['imaginary_operator'],
        observation_count: 2,
        priority: 1,
        high_risk_pressures: [],
        safety_rule: 'manual_review_required',
        suggested_sentences: ['Completely unmatched validation fixture sentence.']
      }
    ]
  };

  add('modules load', () => {
    assert(window.KernelSemanticOperatorGrammarV01, 'KernelSemanticOperatorGrammarV01 missing');
    assert(window.KernelSemanticOperatorWorkbenchV01, 'KernelSemanticOperatorWorkbenchV01 missing');
    assert(window.KernelSemanticVectorTemplatePlannerV01, 'KernelSemanticVectorTemplatePlannerV01 missing');
    assert(window.KernelSemanticTemplateValidationRunnerV01, 'KernelSemanticTemplateValidationRunnerV01 missing');
    assert(KernelSemanticTemplateValidationRunnerV01.VERSION === '0.1.0', 'runner version wrong');
  });

  add('doctrine preserves no belief movement', () => {
    const d = KernelSemanticTemplateValidationRunnerV01.doctrine();
    assert(d.validation_runner_checks_templates_against_workbench_not_truth === true, 'validation doctrine missing');
    assert(d.runner_does_not_promote_seed_entries === true, 'promotion doctrine missing');
    assert(d.runner_does_not_patch_source === true, 'source doctrine missing');
    assert(d.belief_movement === 'none', 'belief movement doctrine wrong');
  });

  add('module availability is reported', () => {
    const a = KernelSemanticTemplateValidationRunnerV01.modulesAvailable();
    assert(a.planner === true, 'planner unavailable');
    assert(a.workbench === true, 'workbench unavailable');
    assert(a.draft_entries === true, 'draft_entries unavailable');
  });

  add('pressure signature parsing works', () => {
    const parts = KernelSemanticTemplateValidationRunnerV01.pressureParts('b_pressure|a_pressure + c_pressure');
    assert(parts.length === 3, 'wrong pressure count');
    assert(parts[0] === 'a_pressure', 'pressure parts not sorted');
    assert(parts.includes('b_pressure') && parts.includes('c_pressure'), 'pressure missing');
  });

  add('casesFromPlan extracts and deduplicates suggested sentences', () => {
    const cases = KernelSemanticTemplateValidationRunnerV01.casesFromPlan(syntheticPlan);
    assert(cases.length === 2, 'expected two validation cases');
    assert(cases[0].expected_template_group === 'accusation_risk_direct_evidence_gap', 'template group missing');
    assert(cases[0].expected_pressures.includes('accusation_pressure'), 'expected pressure missing');
  });

  add('validateCase accepts known accusation-risk sentence', () => {
    const c = KernelSemanticTemplateValidationRunnerV01.casesFromPlan(syntheticPlan)[0];
    const row = KernelSemanticTemplateValidationRunnerV01.validateCase(c);
    assert(row.match_count >= 1, 'known sentence did not match workbench');
    assert(row.actual_operator_names.includes('reckless_accusation'), 'reckless_accusation not matched');
    assert(row.comparison.missing_pressures.length === 0, 'expected pressures missing');
    assert(['accept', 'accept_with_review'].includes(row.recommendation), 'known sentence should be accepted or accepted with review');
    assert(row.belief_movement === 'none', 'row moved belief');
  });

  add('validateCase rejects unmatched sentence', () => {
    const c = KernelSemanticTemplateValidationRunnerV01.casesFromPlan(syntheticPlan)[1];
    const row = KernelSemanticTemplateValidationRunnerV01.validateCase(c);
    assert(row.match_count === 0, 'fixture should not match');
    assert(row.recommendation === 'reject', 'unmatched sentence should reject');
    assert(row.comparison.undermatch_flags.includes('no_workbench_match'), 'no-match flag missing');
  });

  add('validatePlan summarizes mixed results', () => {
    const validation = KernelSemanticTemplateValidationRunnerV01.validatePlan(syntheticPlan);
    assert(validation.validation_case_count === 2, 'case count wrong');
    assert(validation.summary.sentence_count === 2, 'summary count wrong');
    assert(validation.summary.reject_count === 1, 'expected one reject');
    assert(validation.summary.accepted_or_reviewable_count >= 1, 'expected at least one accepted/reviewable');
    assert(validation.belief_movement === 'none', 'validation moved belief');
  });

  add('draftAccepted produces draft packet without doctrine promotion', () => {
    const validation = KernelSemanticTemplateValidationRunnerV01.validatePlan(syntheticPlan);
    const draft = KernelSemanticTemplateValidationRunnerV01.draftAccepted(validation, { include_accept_with_review:true });
    assert(draft.packet_type === '42ndMind_semantic_template_validation_draft_candidates_v0_1', 'wrong draft packet');
    assert(draft.source_sentence_count >= 1, 'expected accepted source sentences');
    assert(draft.entry_count >= 1, 'expected draft entries');
    assert(draft.belief_movement === 'none', 'draft moved belief');
  });

  add('loadPlanAndValidate runs current 123-entry planner path', async () => {
    fullPacket = await KernelSemanticTemplateValidationRunnerV01.loadPlanAndValidate({ min_template_observations:2, min_observations:2, limit:10, sentences_per_template:4, allowed_extra_pressures:0 });
    assert(fullPacket.ok === true, 'full validation packet not ok');
    assert(fullPacket.planner_packet.plan.vector_count === 123, 'expected 123 planner vectors');
    assert(fullPacket.validation.validation_case_count === fullPacket.planner_packet.plan.suggested_sentence_count, 'validation case count mismatch');
    assert(fullPacket.validation.summary.sentence_count >= 31, 'expected current suggested sentence count');
    assert(fullPacket.validation.summary.no_match_count >= 0, 'summary no-match count missing');
    assert(fullPacket.belief_movement === 'none', 'full packet moved belief');
  });

  (async function run(){
    const results = [];
    for (const t of tests) {
      try { await t.fn(); results.push({ name:t.name, passed:true }); }
      catch(e) { results.push({ name:t.name, passed:false, error:e.message }); }
    }
    const passed = results.filter(r => r.passed).length;
    document.getElementById('summary').className = passed === tests.length ? 'ok' : 'bad';
    document.getElementById('summary').textContent = `${passed}/${tests.length} passed`;
    document.getElementById('out').textContent = JSON.stringify({
      packet_type:'42ndMind_semantic_template_validation_runner_v0_1_test_report',
      full_validation_summary: fullPacket && fullPacket.summary,
      results
    }, null, 2);
  })();
</script>
