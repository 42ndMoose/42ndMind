<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>42ndMind Intention Neighbor Lattice</title><style>body{margin:0;background:#0f1115;color:#eef2ff;font:14px ui-monospace,Menlo,Consolas,monospace}header{padding:16px 18px;background:#11141b;border-bottom:1px solid #2a3040}main{padding:12px;display:grid;grid-template-columns:420px 1fr;gap:12px}section{background:#171a21;border:1px solid #2a3040;border-radius:10px;padding:12px}button{background:#25345c;color:#eef2ff;border:1px solid #3f5592;padding:8px 10px;border-radius:8px;cursor:pointer;margin:3px 3px 8px 0}pre{white-space:pre-wrap;background:#0d1016;border:1px solid #2a3040;border-radius:10px;padding:10px;overflow:auto;max-height:760px}.ok{color:#9dffb4}.bad{color:#ff8b8b}.muted{color:#8b93a7}a{color:#9db6ff}.card{background:#10131a;border:1px solid #2a3040;border-radius:10px;padding:10px;margin:10px 0}.edge{border-top:1px solid #252b3a;padding:6px 0}.pill{display:inline-block;border:1px solid #2a3040;border-radius:999px;padding:1px 7px;margin:2px}.collapse{color:#ff8b8b}.shift{color:#ffb86b}.boundary{color:#ffd28b}.expression{color:#9db6ff}@media(max-width:900px){main{grid-template-columns:1fr}}</style></head><body><header><h1>42ndMind Intention Neighbor Lattice</h1><div class="muted">Directed candidate map of intention concept shifts under removed dimensions. Not doctrine. No real-world intent attribution.</div></header><main><section><a href="index.html">main</a> · <a href="intention-necessity.html?v=necessity-1">necessity</a> · <a href="kernel-intention-neighbor-lattice-v0-1-test.html?v=lattice-1">test</a><p>Decision: <b id="decisionMetric">not run</b></p><p>Nodes: <b id="nodeCount">0</b></p><p>Edges: <b id="edgeCount">0</b></p><button onclick="runLattice()">Run lattice</button><button onclick="showPacket()">Show packet</button><button onclick="showSummary()">Show summary</button><button onclick="copyOutput()">Copy output</button><div id="cards"></div></section><section><h2>Output</h2><pre id="out">No output yet.</pre></section></main><script src="src/kernel-intention-discovery-v0-1.js?v=intent-1"></script><script src="src/kernel-intention-refinement-v0-1.js?v=refine-1"></script><script src="src/kernel-intention-necessity-test-v0-1.js?v=necessity-1"></script><script src="src/kernel-intention-neighbor-lattice-v0-1.js?v=lattice-1"></script><script>let packet=null,last='';function esc(v){return String(v??'').replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]))}function edgeClass(t){if(t==='collapse_edge')return'collapse';if(t==='neighbor_shift_edge'||t==='ambiguous_shift_or_collapse_edge')return'shift';if(t==='boundary_weaken_edge')return'boundary';if(t==='expression_weaken_edge')return'expression';return''}function setOut(v){last=typeof v==='string'?v:JSON.stringify(v,null,2);document.getElementById('out').textContent=last}function runLattice(){const decisionEl=document.getElementById('decisionMetric');try{packet=KernelIntentionNeighborLatticeV01.runLattice();decisionEl.textContent=packet.ok?'LATTICE_READY':'HELD';decisionEl.className=packet.ok?'ok':'bad';document.getElementById('nodeCount').textContent=packet.summary.node_count;document.getElementById('edgeCount').textContent=packet.summary.edge_count;renderCards();showSummary()}catch(e){decisionEl.textContent='ERROR';decisionEl.className='bad';setOut({ok:false,error:e.message,belief_movement:'none'})}}function renderCards(){const sourceNodes=(packet&&packet.nodes||[]).filter(n=>n.node_type==='source_intention_concept');document.getElementById('cards').innerHTML=sourceNodes.map(n=>{const edges=(packet.edges||[]).filter(e=>e.from===n.id);return `<div class="card"><h3>${esc(n.label)}</h3><p><span class="pill">outgoing ${edges.length}</span><span class="pill">core ${esc(n.metadata.necessary_core_count)}</span></p>${edges.map(e=>`<div class="edge"><b>${esc(e.removed_dimension)}</b> → <b>${esc(e.to)}</b><br><span class="pill ${edgeClass(e.edge_type)}">${esc(e.edge_type)}</span><span class="pill">weight ${esc(e.structural_pressure_weight)}</span><span class="pill">L1 ${esc(e.counterfactual_l1_total)}</span><div class="muted">${esc(e.explanation)}</div></div>`).join('')}</div>`}).join('')||'No source nodes.'}function summary(){return{packet_type:'42ndMind_intention_neighbor_lattice_summary_view_v0_1',ok:packet&&packet.ok,summary:packet&&packet.summary,source_nodes:(packet&&packet.nodes||[]).filter(n=>n.node_type==='source_intention_concept'),neighbor_nodes:(packet&&packet.nodes||[]).filter(n=>n.node_type!=='source_intention_concept'),edges:(packet&&packet.edges||[]).map(e=>({from:e.from,to:e.to,removed_dimension:e.removed_dimension,edge_type:e.edge_type,weight:e.structural_pressure_weight,candidate_status:e.candidate_status,counterfactual_l1_total:e.counterfactual_l1_total})),validation:packet&&packet.validation,belief_movement:'none'}}function showSummary(){if(!packet)return runLattice();setOut(summary())}function showPacket(){if(!packet)return runLattice();setOut(packet)}async function copyOutput(){try{await navigator.clipboard.writeText(last);document.getElementById('out').textContent='Copied.\n\n'+last}catch(e){}}runLattice();</script></body></html>
