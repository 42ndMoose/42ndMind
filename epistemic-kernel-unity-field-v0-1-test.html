<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kernel Unity Field v0.1 Test</title><style>body{background:#0f1115;color:#eef2ff;font:14px monospace;margin:0}main{padding:12px}pre{white-space:pre-wrap;background:#111722;border:1px solid #30384a;border-radius:8px;padding:10px}.ok{color:#9dffb4}.bad{color:#ff8b8b}</style></head><body><main><h1 id="summary">Running...</h1><pre id="out"></pre></main>
<script src="src/epistemic-kernel-v0-2.js?v=corebase-1"></script><script src="src/epistemic-kernel-v0-2-patches.js?v=coremig-1"></script><script src="src/kernel-brain-v0-4.js?v=brain-2"></script><script src="src/kernel-brain-epistemic-kernel-bridge-v0-1.js?v=bridge-2"></script><script src="src/epistemic-kernel-maturity-core-v0-1.js?v=maturity-2"></script><script src="src/epistemic-kernel-belief-memory-engine-v0-1.js?v=belief-1"></script><script src="src/epistemic-kernel-belief-memory-engine-v0-1-1-patch.js?v=belief-3"></script><script src="src/epistemic-kernel-attention-organism-v0-1.js?v=ao-1"></script><script src="src/epistemic-kernel-unity-field-v0-1.js?v=unity-1"></script>
<script>
const tests=[];let kernel,binding,brain;function add(n,f){tests.push({name:n,fn:f})}function assert(c,m){if(!c)throw new Error(m)}function arr(v){return Array.isArray(v)?v:[]}function shared(){return kernel.state.unifiedCore}function u(){return shared().kernelUnityFieldCore}function c(){return shared().communicationCore}function m(){return shared().maturityCore}function say(x){brain.ingest(x,{kind:'unity_smoke'});brain.refreshKernelUnityField&&brain.refreshKernelUnityField('manual');return c().current_message&&c().current_message.message||''}function sum(){return Number(arr(u().self_field).reduce((s,r)=>s+Number(r.normalized_weight||0),0).toFixed(6))}
add('loads and patches',()=>{assert(window.EpistemicKernelUnityFieldV01,'module missing');assert(EpistemicKernel.__kernelUnityFieldPatchApplied===true,'kernel patch missing');assert(KernelBrainV04.__kernelUnityFieldPatchApplied===true,'brain patch missing')});
add('binds into one shared state',()=>{kernel=new EpistemicKernel();binding=KernelBrainEpistemicKernelBridgeV01.bind(kernel);brain=binding.bound_brain;assert(brain.state===shared(),'state not shared');assert(u().doctrine.kernel_self_is_one===true,'unity doctrine missing')});
add('self field is one total',()=>{say('hello');assert(sum()===1,'sum '+sum());['core_philosophy','self_improving_logic','truth_tracking','belief_thought_field','language_math_creation','knowledge','memory_belief_context','communication'].forEach(a=>assert(arr(u().self_field).some(r=>r.aspect===a),'missing '+a))});
add('unity input selects unity integration',()=>{const msg=say('kernel is one field: core philosophy, self improvement, truth, language math, knowledge, memory, and communication');assert(u().selected_self_application.application_kind==='integrate_self_unity_model','bad app '+u().selected_self_application.application_kind);assert(/one field|same total|separate boxes/i.test(msg),'bad msg '+msg)});
add('reasoning test becomes learning signal',()=>{const msg=say('testing your reasoning? you can also learn from the side.');assert(u().selected_self_application.application_kind==='use_input_as_reasoning_test_and_learning_signal','bad app');assert(/testing my reasoning|learning signal|from the side/i.test(msg),'bad msg '+msg);assert(!/I do not understand the target clearly/.test(msg),'old program msg leaked')});
add('language growth applies across the self field',()=>{const msg=say('language should grow through calculus, subdivision of one, meanings, and formulas');assert(u().selected_self_application.application_kind==='grow_language_by_subdivision','bad app');assert(/truth-seeking|belief|memory|communication/i.test(msg),'bad msg '+msg)});
add('truth/belief wording routes to truth pressure',()=>{const msg=say('belief, speculation, fact, truth, and knowledge must not be confused');assert(u().selected_self_application.application_kind==='route_to_truth_and_belief_pressure','bad app');assert(/belief|suspect|verification/i.test(msg),'bad msg '+msg)});
add('communication is unity expression',()=>{const msg=say('can you communicate what you know and what you want to learn?');assert(c().current_message.thought_kind==='unity_field_self_expression','not unity speech');assert(/one live state|want to learn|truth/i.test(msg),'bad msg '+msg)});
add('maturity preserved and no final truth',()=>{assert(m().core_philosophy==='objective_peak_philosophical_maturity','maturity missing');assert(u().truth_status==='not_final','truth promoted');assert(u().promotion_status==='not_promoted_to_final_truth','promoted')});
(async()=>{const results=[];for(const t of tests){try{await t.fn();results.push({name:t.name,passed:true})}catch(e){results.push({name:t.name,passed:false,error:e.message})}}const passed=results.filter(r=>r.passed).length;summary.className=passed===tests.length?'ok':'bad';summary.textContent=passed+'/'+tests.length+' passed';out.textContent=JSON.stringify({packet_type:'42ndMind_kernel_unity_field_v0_1_test_report',ok:passed===tests.length,kernelUnityFieldCore:u(),communicationCore:c(),maturityCore:m(),results},null,2)})();
</script></body></html>
