<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>42ndMind Active Curiosity Test v0.1</title><style>body{margin:0;background:#0f1115;color:#eef2ff;font:14px ui-monospace,Menlo,Consolas,monospace}header{padding:16px;background:#11141b;border-bottom:1px solid #2a3040}main{padding:12px}section{background:#171a21;border:1px solid #2a3040;border-radius:10px;padding:12px}pre{white-space:pre-wrap;background:#0d1016;border:1px solid #2a3040;border-radius:10px;padding:10px;overflow:auto;max-height:780px}.ok{color:#9dffb4}.bad{color:#ff8b8b}a{color:#9db6ff}</style></head><body><header><h1>42ndMind Active Curiosity Test v0.1</h1><div>Tests current curiosity from active owned logic: span targeting, referent question, and answer binding.</div></header><main><section><h2 id="summary">Running...</h2><pre id="out"></pre></section></main><script src="src/epistemic-kernel-v0-2.js?v=corebase-1"></script><script src="src/epistemic-kernel-v0-2-patches.js?v=coremig-1"></script><script src="src/kernel-brain-v0-4.js?v=brain-2"></script><script src="src/kernel-brain-epistemic-kernel-bridge-v0-1.js?v=bridge-2"></script><script src="src/epistemic-kernel-maturity-core-v0-1.js?v=maturity-2"></script><script src="src/epistemic-kernel-active-curiosity-v0-1.js?v=curiosity-1"></script><script>const tests=[];let kernel=null,binding=null,boundBrain=null,event=null,answer=null;function add(n,f){tests.push({name:n,fn:f})}function assert(c,m){if(!c)throw new Error(m)}function arr(v){return Array.isArray(v)?v:[]}function shared(){return kernel&&kernel.state&&kernel.state.unifiedCore}function curio(){return shared()&&shared().curiosityCore}add('active curiosity patch loads on kernel, brain, and bridge',()=>{assert(window.EpistemicKernelActiveCuriosityV01,'active curiosity missing');assert(EpistemicKernelActiveCuriosityV01.VERSION==='0.1.0','curiosity version wrong');assert(EpistemicKernel.__activeCuriosityPatchApplied===true,'EpistemicKernel curiosity patch missing');assert(KernelBrainV04.__activeCuriosityPatchApplied===true,'KernelBrain curiosity patch missing');assert(KernelBrainEpistemicKernelBridgeV01.__activeCuriosityPatchApplied===true,'Bridge curiosity patch missing')});add('binding creates curiosity core inside shared state',()=>{kernel=new EpistemicKernel();binding=KernelBrainEpistemicKernelBridgeV01.bind(kernel);boundBrain=binding.bound_brain;assert(boundBrain.state===shared(),'bound brain is not same shared state');assert(curio(),'curiosityCore missing');assert(curio().doctrine.active_curiosity_lives_inside_owned_state===true,'curiosity doctrine missing');assert(typeof boundBrain.refreshActiveCuriosity==='function','boundBrain refreshActiveCuriosity missing');assert(typeof boundBrain.answerActiveCuriosity==='function','boundBrain answerActiveCuriosity missing')});add('raw ambiguous philosophy text creates current curiosity from active logic',()=>{event=boundBrain.ingest('Race jokes should not be mistaken for racist jokes.',{kind:'curiosity_philosophy_test'});boundBrain.refreshActiveCuriosity('after_philosophy_ingest');assert(curio().active===true,'curiosity not active');assert(curio().current_question,'current question missing');assert(curio().focus_span&&curio().focus_span.includes('Race jokes'),'focus span wrong');assert(arr(curio().referent_candidates).length>=1,'referent candidates missing');assert(arr(curio().referent_candidates)[0].candidate_types.includes('humor_boundary_candidate'),'humor boundary candidate missing');assert(arr(curio().referent_candidates)[0].candidate_types.includes('distinction_candidate'),'distinction candidate missing');assert(curio().current_question.includes('distinction')||curio().current_question.includes('What distinction'),'question did not target distinction')});add('curiosity question points to span and expected answer shape',()=>{const q=curio().active_questions[0];assert(q,'active question missing');assert(q.target_span.includes('Race jokes'),'question target span wrong');assert(q.expected_answer_shape==='meaning_distinction_or_boundary','expected answer shape wrong');assert(arr(q.examples).includes('my principle')||arr(q.examples).includes('humor vs hostility'),'examples missing')});add('answer me binds referent as direct user speaker/context candidate',()=>{answer=boundBrain.answerActiveCuriosity('me',{source:'test_user_answer'});assert(answer.status==='context_answer_candidate_not_truth','answer status wrong');assert(answer.normalized_answer.answer_kind==='direct_user_speaker','answer kind wrong');assert(answer.normalized_answer.bound_value==='user_directly_owns_statement','bound value wrong');assert(arr(curio().bound_referents).some(b=>b.answer_kind==='direct_user_speaker'),'bound referent missing');assert(arr(curio().active_questions).some(q=>q.answered===true),'question not marked answered')});add('answer does not promote truth or move belief',()=>{assert(answer.truth_status==='not_adjudicated','answer truth adjudicated');assert(answer.promotion_status==='not_promoted','answer promoted');assert(answer.belief_movement==='none','answer belief moved');assert(arr(shared().beliefCommitments).length===0,'belief commitments present');arr(shared().runtimeEvents).forEach(e=>assert(e.belief_movement==='none',e.id+' belief moved'))});add('new input can create a new current curiosity',()=>{boundBrain.ingest('I believe people should be free to joke, but context matters and direct hostility should be separated from humor.',{kind:'curiosity_principle_test'});boundBrain.refreshActiveCuriosity('after_principle_ingest');assert(curio().active===true,'new curiosity not active');assert(curio().current_question,'new question missing');assert(arr(curio().referent_candidates).some(c=>c.candidate_types.includes('self_report_candidate')||c.candidate_types.includes('normative_principle_candidate')),'principle/self-report candidate missing')});add('curiosity remains renderer/view-safe and candidate-only',()=>{assert(curio().truth_status==='not_adjudicated','curiosity truth adjudicated');assert(curio().promotion_status==='not_promoted','curiosity promoted');assert(curio().belief_movement==='none','curiosity belief moved');assert(curio().doctrine.user_answers_are_context_not_automatic_truth===true,'answer context doctrine missing');assert(curio().doctrine.curiosity_comes_from_active_logic_not_ui===true,'active logic doctrine missing')});(async function run(){const results=[];for(const t of tests){try{await t.fn();results.push({name:t.name,passed:true})}catch(e){results.push({name:t.name,passed:false,error:e.message})}}const passed=results.filter(r=>r.passed).length;document.getElementById('summary').className=passed===tests.length?'ok':'bad';document.getElementById('summary').textContent=passed+'/'+tests.length+' passed';document.getElementById('out').textContent=JSON.stringify({packet_type:'42ndMind_active_curiosity_v0_1_test_report',ok:passed===tests.length,curiosity_patch_loaded:!!window.EpistemicKernelActiveCuriosityV01,shared_state_summary:shared()&&{state_type:shared().state_type,stats:shared().stats,events:arr(shared().runtimeEvents).length,beliefs:arr(shared().beliefCommitments).length},curiosityCore:curio(),answer,results},null,2)})();</script></body></html>
