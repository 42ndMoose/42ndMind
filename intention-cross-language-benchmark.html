<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>42ndMind Intention Cross-Language Benchmark</title><style>body{margin:0;background:#0f1115;color:#eef2ff;font:14px ui-monospace,Menlo,Consolas,monospace}header{padding:16px 18px;background:#11141b;border-bottom:1px solid #2a3040}main{padding:12px;display:grid;grid-template-columns:470px 1fr;gap:12px}section{background:#171a21;border:1px solid #2a3040;border-radius:10px;padding:12px}button{background:#25345c;color:#eef2ff;border:1px solid #3f5592;padding:8px 10px;border-radius:8px;cursor:pointer;margin:3px 3px 8px 0}pre{white-space:pre-wrap;background:#0d1016;border:1px solid #2a3040;border-radius:10px;padding:10px;overflow:auto;max-height:760px}.ok{color:#9dffb4}.bad{color:#ff8b8b}.muted{color:#8b93a7}a{color:#9db6ff}.card{background:#10131a;border:1px solid #2a3040;border-radius:10px;padding:10px;margin:10px 0}.case{border-top:1px solid #252b3a;padding:7px 0}.pill{display:inline-block;border:1px solid #2a3040;border-radius:999px;padding:1px 7px;margin:2px}.safe{color:#9dffb4}.warn{color:#ffd28b}@media(max-width:900px){main{grid-template-columns:1fr}}</style></head><body><header><h1>42ndMind Intention Cross-Language Benchmark</h1><div class="muted">Deterministic cross-language invariance test over the canonical formula ledger. Candidate only. Not an arbitrary parser.</div></header><main><section><a href="index.html">main</a> · <a href="intention-canonical-formula-ledger.html?v=ledger-1">formula ledger</a> · <a href="kernel-intention-cross-language-benchmark-v0-1-test.html?v=xlang-1">test</a><p>Decision: <b id="decisionMetric">not run</b></p><p>Languages: <b id="languageMetric">0</b></p><p>Cases: <b id="caseMetric">0</b></p><p>Passed: <b id="passedMetric">0</b></p><button onclick="runBenchmark()">Run benchmark</button><button onclick="showPacket()">Show packet</button><button onclick="showSummary()">Show summary</button><button onclick="copyOutput()">Copy output</button><div id="cards"></div></section><section><h2>Output</h2><pre id="out">No output yet.</pre></section></main><script src="src/kernel-intention-discovery-v0-1.js?v=intent-1"></script><script src="src/kernel-intention-refinement-v0-1.js?v=refine-1"></script><script src="src/kernel-intention-necessity-test-v0-1.js?v=necessity-1"></script><script src="src/kernel-intention-neighbor-lattice-v0-1.js?v=lattice-3"></script><script src="src/kernel-intention-lattice-invariance-benchmark-v0-1.js?v=invariance-2"></script><script src="src/kernel-intention-formula-compiler-v0-1.js?v=formula-1"></script><script src="src/kernel-intention-concept-expansion-loop-v0-1.js?v=expansion-2"></script><script src="src/kernel-intention-contradiction-refinement-loop-v0-1.js?v=contradiction-1"></script><script src="src/kernel-intention-formula-revision-engine-v0-1.js?v=revision-1"></script><script src="src/kernel-intention-canonical-formula-ledger-v0-1.js?v=ledger-1"></script><script src="src/kernel-intention-cross-language-benchmark-v0-1.js?v=xlang-1"></script><script>let packet=null,last='';function esc(v){return String(v??'').replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]))}function arr(v){return Array.isArray(v)?v:[]}function setOut(v){last=typeof v==='string'?v:JSON.stringify(v,null,2);document.getElementById('out').textContent=last}function runBenchmark(){const decisionEl=document.getElementById('decisionMetric');try{packet=KernelIntentionCrossLanguageBenchmarkV01.runBenchmark();decisionEl.textContent=packet.ok?'CROSS_LANGUAGE_STRUCTURE_HELD':'HELD_FOR_REVIEW';decisionEl.className=packet.ok?'ok':'bad';document.getElementById('languageMetric').textContent=packet.language_count;document.getElementById('caseMetric').textContent=packet.case_count;document.getElementById('passedMetric').textContent=packet.passed_case_count;renderCards();showSummary()}catch(e){decisionEl.textContent='ERROR';decisionEl.className='bad';setOut({ok:false,error:e.message,belief_movement:'none'})}}function renderCards(){const byLang={};arr(packet&&packet.case_results).forEach(row=>{(byLang[row.language]||(byLang[row.language]=[])).push(row)});document.getElementById('cards').innerHTML=arr(packet&&packet.language_summary).map(summary=>{const rows=byLang[summary.language]||[];return`<div class="card"><h3>${esc(summary.language_name)} · ${esc(summary.language)}</h3><p><span class="pill ${summary.ok?'safe':'bad'}">${esc(summary.passed_case_count)}/${esc(summary.case_count)} passed</span><span class="pill safe">belief ${esc(summary.belief_movement)}</span></p>${rows.map(row=>`<div class="case"><b>${esc(row.surface_concept)}</b> <span class="pill safe">${esc(row.observed_concept)}</span><br><span class="muted">${esc(row.surface_frame)}</span><br><span class="pill safe">L1 ${esc(row.observed_l1_total)}</span><span class="pill safe">force outside ${esc(row.force_terms_outside_shape)}</span><span class="pill">${esc(row.observed_version_id)}</span></div>`).join('')}</div>`}).join('')||'No benchmark cases.'}function summary(){return{packet_type:'42ndMind_intention_cross_language_benchmark_summary_view_v0_1',ok:packet&&packet.ok,source_ledger_ok:packet&&packet.source_ledger_ok,language_count:packet&&packet.language_count,concept_count:packet&&packet.concept_count,case_count:packet&&packet.case_count,passed_case_count:packet&&packet.passed_case_count,language_summary:packet&&packet.language_summary,validation:packet&&packet.validation,belief_movement:'none'}}function showSummary(){if(!packet)return runBenchmark();setOut(summary())}function showPacket(){if(!packet)return runBenchmark();setOut(packet)}async function copyOutput(){try{await navigator.clipboard.writeText(last);document.getElementById('out').textContent='Copied.\n\n'+last}catch(e){}}runBenchmark();</script></body></html>
