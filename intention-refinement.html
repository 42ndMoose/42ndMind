<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>42ndMind Intention Refinement</title><style>body{margin:0;background:#0f1115;color:#eef2ff;font:14px ui-monospace,Menlo,Consolas,monospace}header{padding:16px 18px;background:#11141b;border-bottom:1px solid #2a3040}main{padding:12px;display:grid;grid-template-columns:400px 1fr;gap:12px}section{background:#171a21;border:1px solid #2a3040;border-radius:10px;padding:12px}button{background:#25345c;color:#eef2ff;border:1px solid #3f5592;padding:8px 10px;border-radius:8px;cursor:pointer;margin:3px 3px 8px 0}pre{white-space:pre-wrap;background:#0d1016;border:1px solid #2a3040;border-radius:10px;padding:10px;overflow:auto;max-height:760px}.ok{color:#9dffb4}.bad{color:#ff8b8b}.muted{color:#8b93a7}a{color:#9db6ff}.card{background:#10131a;border:1px solid #2a3040;border-radius:10px;padding:10px;margin:10px 0}.dim{display:grid;grid-template-columns:1fr auto auto;gap:10px;border-bottom:1px solid #252b3a;padding:4px 0}.dim:last-child{border-bottom:0}.role{border:1px solid #2a3040;border-radius:999px;padding:1px 7px;color:#d6ddf5}.core{color:#9dffb4}.boundary{color:#ffd28b}.expression{color:#9db6ff}.unresolved{color:#ffb86b}@media(max-width:900px){main{grid-template-columns:1fr}}</style></head><body><header><h1>42ndMind Intention Refinement</h1><div class="muted">Contrast-pressure refinement of candidate intention equations. Candidate only. No person/event attribution.</div></header><main><section><a href="index.html">main</a> · <a href="intention-discovery.html?v=intent-2">discovery</a> · <a href="kernel-intention-refinement-v0-1-test.html?v=refine-1">test</a><p>Decision: <b id="decisionMetric">not run</b></p><p>Refinements: <b id="refinementCount">0</b></p><button onclick="runRefinement()">Run refinement</button><button onclick="showPacket()">Show packet</button><button onclick="showSummary()">Show summary</button><button onclick="copyOutput()">Copy output</button><div id="cards"></div></section><section><h2>Output</h2><pre id="out">No output yet.</pre></section></main><script src="src/kernel-intention-discovery-v0-1.js?v=intent-1"></script><script src="src/kernel-intention-refinement-v0-1.js?v=refine-1"></script><script>let packet=null,last='';function esc(v){return String(v??'').replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]))}function roleClass(role){if(role==='core_shape')return'core';if(role==='boundary_shape')return'boundary';if(role==='expression_or_derivative_shape')return'expression';return'unresolved'}function setOut(v){last=typeof v==='string'?v:JSON.stringify(v,null,2);document.getElementById('out').textContent=last}function runRefinement(){const decisionEl=document.getElementById('decisionMetric');const countEl=document.getElementById('refinementCount');try{packet=KernelIntentionRefinementV01.runRefinement();decisionEl.textContent=packet.ok?'REFINEMENT_READY':'HELD';decisionEl.className=packet.ok?'ok':'bad';countEl.textContent=packet.refinement_count;renderCards();showSummary()}catch(e){decisionEl.textContent='ERROR';decisionEl.className='bad';setOut({ok:false,error:e.message,belief_movement:'none'})}}function renderCards(){document.getElementById('cards').innerHTML=(packet&&packet.refinements||[]).map(r=>`<div class="card"><h3>${esc(r.concept)} · ${esc(r.refined_review_status)}</h3><pre>${esc(r.symbolic_formula)}</pre>${r.dimension_classifications.map(x=>`<div class="dim"><span>${esc(x.dimension)}</span><span class="role ${roleClass(x.refined_role)}">${esc(x.refined_role)}</span><b>${esc(r.refined_shape.shape[x.dimension]??'excluded')}</b></div>`).join('')}<p>contrast findings: ${esc(r.contrast_findings.length)}</p><p class="muted">${esc(r.refinement_notes.join(' '))}</p></div>`).join('')||'No refinements.'}function summary(){return{packet_type:'42ndMind_intention_refinement_summary_view_v0_1',ok:packet&&packet.ok,refinement_count:packet&&packet.refinement_count,refinements:(packet&&packet.refinements||[]).map(r=>({concept:r.concept,l1_total:r.refined_shape.l1_total,shape:r.refined_shape.shape,roles:r.dimension_classifications.map(x=>({dimension:x.dimension,role:x.refined_role})),contrast_findings:r.contrast_findings.length,review_status:r.refined_review_status,symbolic_formula:r.symbolic_formula})),validation:packet&&packet.validation,belief_movement:'none'}}function showSummary(){if(!packet)return runRefinement();setOut(summary())}function showPacket(){if(!packet)return runRefinement();setOut(packet)}async function copyOutput(){try{await navigator.clipboard.writeText(last);document.getElementById('out').textContent='Copied.\n\n'+last}catch(e){}}runRefinement();</script></body></html>
