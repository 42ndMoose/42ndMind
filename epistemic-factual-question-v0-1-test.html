<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>42ndMind Factual Claim + Question Appetite Test v0.1</title><style>body{margin:0;background:#0f1115;color:#eef2ff;font:14px ui-monospace,Menlo,Consolas,monospace}header{padding:16px;background:#11141b;border-bottom:1px solid #2a3040}main{padding:12px}section{background:#171a21;border:1px solid #2a3040;border-radius:10px;padding:12px}pre{white-space:pre-wrap;background:#0d1016;border:1px solid #2a3040;border-radius:10px;padding:10px;overflow:auto;max-height:900px}.ok{color:#9dffb4}.bad{color:#ff8b8b}</style></head><body><header><h1>42ndMind Factual Claim + Question Appetite Test v0.1</h1><div>Tests factual-claim intake and learning-priority questions as owned-state pressure, not connectors or bottleneck rules.</div></header><main><section><h2 id="summary">Running...</h2><pre id="out"></pre></section></main><script src="src/kernel-intention-discovery-v0-1.js?v=intent-1"></script><script src="src/kernel-intention-refinement-v0-1.js?v=refine-1"></script><script src="src/kernel-intention-necessity-test-v0-1.js?v=necessity-1"></script><script src="src/kernel-intention-neighbor-lattice-v0-1.js?v=lattice-3"></script><script src="src/kernel-intention-lattice-invariance-benchmark-v0-1.js?v=invariance-2"></script><script src="src/kernel-intention-formula-compiler-v0-1.js?v=formula-1"></script><script src="src/kernel-intention-concept-expansion-loop-v0-1.js?v=expansion-2"></script><script src="src/kernel-intention-contradiction-refinement-loop-v0-1.js?v=contradiction-1"></script><script src="src/kernel-intention-formula-revision-engine-v0-1.js?v=revision-1"></script><script src="src/kernel-intention-canonical-formula-ledger-v0-1.js?v=ledger-1"></script><script src="src/kernel-intention-proof-output-v0-1.js?v=proof-1"></script><script src="src/kernel-intention-minimal-pair-library-v0-1.js?v=minpair-1"></script><script src="src/kernel-intention-dimension-splitting-v0-1.js?v=split-2"></script><script src="src/kernel-intention-coefficient-dimension-revision-engine-v0-1.js?v=codim-1"></script><script src="src/kernel-intention-canonical-formula-ledger-v0-1-1-patch.js?v=ledger-2"></script><script src="src/kernel-intention-formula-inspector-v0-1.js?v=inspect-1"></script><script src="src/kernel-concept-admission-registry-v0-1.js?v=admit-1"></script><script src="src/kernel-intention-formula-inspector-v0-1-1-patch.js?v=inspect-2"></script><script src="src/kernel-intention-arbitrary-language-parser-v0-1.js?v=parser-1"></script><script src="src/kernel-intention-arbitrary-language-parser-v0-1-1-patch.js?v=parser-3"></script><script src="src/kernel-objective-claim-language-v0-1.js?v=claim-1"></script><script src="src/kernel-objective-claim-language-v0-1-1-patch.js?v=claim-2"></script><script src="src/epistemic-kernel-v0-2.js?v=corebase-1"></script><script src="src/epistemic-kernel-v0-2-patches.js?v=coremig-1"></script><script src="src/kernel-brain-v0-4.js?v=brain-2"></script><script src="src/kernel-brain-epistemic-kernel-bridge-v0-1.js?v=bridge-2"></script><script src="src/epistemic-kernel-maturity-core-v0-1.js?v=maturity-2"></script><script src="src/epistemic-kernel-active-curiosity-v0-1.js?v=curiosity-2"></script><script src="src/epistemic-kernel-learning-drive-v0-1.js?v=learn-1"></script><script src="src/epistemic-kernel-belief-memory-engine-v0-1.js?v=belief-1"></script><script src="src/epistemic-kernel-belief-memory-engine-v0-1-1-patch.js?v=belief-3"></script><script src="src/epistemic-kernel-language-math-core-v0-1.js?v=langmath-1"></script><script src="src/epistemic-kernel-language-math-core-v0-1-1-patch.js?v=langmath-2"></script><script src="src/epistemic-kernel-factual-claim-intake-v0-1.js?v=fact-1"></script><script src="src/epistemic-kernel-question-appetite-v0-1.js?v=qapp-1"></script><script>const tests=[];let kernel=null,binding=null,boundBrain=null;function add(n,f){tests.push({name:n,fn:f})}function assert(c,m){if(!c)throw new Error(m)}function arr(v){return Array.isArray(v)?v:[]}function shared(){return kernel&&kernel.state&&kernel.state.unifiedCore}function lm(){return shared()&&shared().languageMathCore}function comm(){return shared()&&shared().communicationCore}function learn(){return shared()&&shared().learningDrive}function curio(){return shared()&&shared().curiosityCore}function bm(){return shared()&&shared().beliefMemoryCore}function mat(){return shared()&&shared().maturityCore}function has(rows,fn){return arr(rows).some(fn)}add('factual claim and question appetite modules load and patch live brain surfaces',()=>{assert(window.EpistemicKernelFactualClaimIntakeV01,'factual claim intake missing');assert(window.EpistemicKernelQuestionAppetiteV01,'question appetite missing');assert(EpistemicKernel.__factualClaimIntakePatchApplied===true,'kernel factual patch missing');assert(EpistemicKernel.__questionAppetitePatchApplied===true,'kernel question patch missing');assert(KernelBrainV04.__factualClaimIntakePatchApplied===true,'brain factual patch missing');assert(KernelBrainV04.__questionAppetitePatchApplied===true,'brain question patch missing');assert(KernelBrainEpistemicKernelBridgeV01.__factualClaimIntakePatchApplied===true,'bridge factual patch missing');assert(KernelBrainEpistemicKernelBridgeV01.__questionAppetitePatchApplied===true,'bridge question patch missing')});add('binding keeps all additions inside one shared unifiedCore state',()=>{kernel=new EpistemicKernel();binding=KernelBrainEpistemicKernelBridgeV01.bind(kernel);boundBrain=binding.bound_brain;assert(boundBrain.state===shared(),'bound brain does not share unified state');assert(lm(),'languageMathCore missing');assert(comm(),'communicationCore missing');assert(learn(),'learningDrive missing');assert(curio(),'curiosityCore missing');assert(lm().doctrine.factual_claim_intake_lives_inside_owned_state===true,'factual doctrine missing');assert(learn().doctrine.question_appetite_lives_inside_owned_state===true,'question appetite doctrine missing')});add('Trump president input becomes structured external-world factual candidate',()=>{boundBrain.ingest('trump is the 47th president of the united states of america',{kind:'external_fact_test'});boundBrain.refreshLanguageMathCore('after_trump_fact');assert(has(lm().factual_claim_candidates,f=>f.subject==='trump'&&f.relation==='is_47th_president_of'&&f.object==='united_states_of_america'),'structured Trump fact missing');const fact=lm().factual_claim_candidates.find(f=>f.subject==='trump'&&f.relation==='is_47th_president_of');assert(fact.claim_scope==='external_world','claim scope wrong');assert(fact.truth_status==='unverified_external_claim_candidate','truth status wrong');assert(fact.promotion_status==='not_promoted_to_final_truth','fact promoted');assert(fact.verification_need>=0.8,'verification need too low')});add('fact creates entity relation, truth pressure, and belief-memory provisional fact candidate',()=>{assert(has(lm().entity_relation_candidates,r=>r.relation_formula==='trump -> is_47th_president_of -> united_states_of_america'),'entity relation missing');assert(has(lm().truth_relevance_pressure,p=>p.target_relation_formula==='trump -> is_47th_president_of -> united_states_of_america'&&p.status==='open_verification_pressure'),'truth pressure missing');assert(has(bm().provisional_fact_candidates,f=>f.relation_formula==='trump -> is_47th_president_of -> united_states_of_america'),'belief memory provisional fact missing')});add('communication acknowledges factual candidate without final truth use',()=>{assert(comm().current_message,'communication message missing');assert(comm().current_message.thought_kind==='factual_claim_candidate_acknowledgement','wrong fact communication kind');assert(/external factual claim candidate/.test(comm().current_message.message),'fact acknowledgement missing');assert(/verification is required/.test(comm().current_message.message),'verification discipline missing')});add('learning offer creates question appetite pressure and asks useful source-role question',()=>{boundBrain.ingest('you can ask me anything. i can give you answers for you to understand everything better, one small info at a time.',{kind:'learning_offer_test'});boundBrain.refreshLanguageMathCore('after_learning_offer');assert(has(learn().question_appetite,a=>a.status==='question_selected_from_need_pressure'),'question appetite did not select question');assert(has(learn().learning_priority_questions,q=>q.question_kind==='source_role_learning_priority_question'),'source role learning question missing');const q=learn().learning_priority_questions.find(q=>q.question_kind==='source_role_learning_priority_question');assert(/What should I call you/.test(q.question_text),'identity/source role question wrong');assert(/facts, meanings, or your worldview/.test(q.question_text),'learning scope question wrong');assert(q.blocks_continuation===false,'question became bottleneck')});add('question comes from pressure needs, not always-ask hard rule',()=>{const q=learn().learning_priority_questions.find(q=>q.question_kind==='source_role_learning_priority_question');assert(q.source_needs.some(n=>n.need_kind==='learning_opportunity_need'&&n.pressure>=0.85),'learning opportunity pressure missing');assert(q.source_needs.some(n=>n.need_kind==='source_role_need'&&n.pressure>=0.7),'source role pressure missing');assert(learn().doctrine.no_always_ask_identity_rule===true,'no hard identity rule doctrine missing');assert(learn().doctrine.not_a_strict_bottleneck_rule===true,'no bottleneck doctrine missing')});add('communication projects learning priority question when its pressure is highest',()=>{assert(comm().current_message.thought_kind==='learning_priority_question','learning priority question not projected');assert(/What should I call you/.test(comm().current_message.message),'communication did not ask learning priority question');assert(comm().selected_pressure&&comm().selected_pressure.candidate_kind==='learning_priority_question','selected pressure not recorded')});add('direct self-state question still works after fact/question patches',()=>{boundBrain.ingest('are you curious? can you answer me?',{kind:'self_state_after_fact_qapp'});boundBrain.refreshLanguageMathCore('after_self_state_after_fact_qapp');assert(has(lm().intent_inference,i=>i.raw_text==='are you curious? can you answer me?'&&i.requested_state_targets.includes('curiosity_state')),'self-state intent missing after patches');assert(comm().current_message.thought_kind==='direct_self_state_answer','self-state answer broken after patches')});add('no final truth promotion and maturity identity preserved',()=>{assert(lm().truth_status==='not_final','languageMathCore truth promoted');assert(lm().promotion_status==='not_promoted_to_final_truth','languageMathCore promoted');['factual_claim_candidates','entity_relation_candidates','truth_relevance_pressure'].forEach(k=>arr(lm()[k]).forEach(row=>{assert(row.promotion_status==='not_promoted_to_final_truth',k+' promoted');assert(row.belief_movement==='provisional_only',k+' wrong belief movement')}));arr(learn().question_appetite).forEach(row=>{assert(row.truth_status==='not_final','question appetite truth promoted');assert(row.promotion_status==='not_promoted_to_final_truth','question appetite promoted')});assert(mat().core_philosophy==='objective_peak_philosophical_maturity','maturity identity missing');assert(mat().wants_peak===true&&mat().aims_at_peak===true&&mat().stays_at_peak===true,'peak identity flags wrong')});(async function run(){const results=[];for(const t of tests){try{await t.fn();results.push({name:t.name,passed:true})}catch(e){results.push({name:t.name,passed:false,error:e.message})}}const passed=results.filter(r=>r.passed).length;document.getElementById('summary').className=passed===tests.length?'ok':'bad';document.getElementById('summary').textContent=passed+'/'+tests.length+' passed';document.getElementById('out').textContent=JSON.stringify({packet_type:'42ndMind_factual_question_v0_1_test_report',ok:passed===tests.length,factual_loaded:!!window.EpistemicKernelFactualClaimIntakeV01,question_appetite_loaded:!!window.EpistemicKernelQuestionAppetiteV01,languageMathCore:lm(),communicationCore:comm(),learningDrive:learn(),curiosityCore:curio(),beliefMemoryCore:bm(),maturityCore:mat(),results},null,2)})();</script></body></html>
