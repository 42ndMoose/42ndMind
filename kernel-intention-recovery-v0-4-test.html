<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>42ndMind Intention Recovery v0.4 Test</title>
  <style>
    body { margin:0; font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; background:#0f1115; color:#eef2ff; }
    header { padding:16px 18px; border-bottom:1px solid #2a3040; background:#11141b; }
    main { padding:12px; }
    section { background:#171a21; border:1px solid #2a3040; border-radius:10px; padding:12px; }
    h1 { font:700 19px/1.2 system-ui,-apple-system,Segoe UI,sans-serif; margin:0 0 4px; }
    pre { white-space:pre-wrap; background:#0d1016; border:1px solid #2a3040; border-radius:10px; padding:10px; overflow:auto; max-height:760px; }
    .ok { color:#9dffb4; } .bad { color:#ff8b8b; } a { color:#9db6ff; }
  </style>
</head>
<body>
<header><h1>42ndMind Intention Recovery v0.4 Test</h1><div>Tests recovery of intended meaning from sloppy wording without converting guessed intent into belief.</div></header>
<main><section><h2 id="summary">Running...</h2><div><a href="llm-brain-v0-4.html">v0.4 preview console</a> · <a href="kernel-sensemaking-test.html">sensemaking test</a></div><pre id="out"></pre></section></main>
<script src="src/kernel-epistemic-governor-v0-1.js?v=0.1.0"></script>
<script src="src/kernel-epistemic-governor-v0-1-1-patch.js?v=0.1.1"></script>
<script src="src/kernel-epistemic-governor-v0-1-2-patch.js?v=0.1.2"></script>
<script src="src/kernel-intention-recovery-v0-4.js?v=0.4.0"></script>
<script>
  const tests = [];
  function add(name, fn) { tests.push({ name, fn }); }
  function assert(cond, msg) { if (!cond) throw new Error(msg); }
  function cats(report) { return report.interpretations.map(i => i.category); }

  add('module loads', () => {
    assert(window.KernelIntentionRecoveryV04, 'KernelIntentionRecoveryV04 missing');
    assert(KernelIntentionRecoveryV04.VERSION === '0.4.0', 'wrong version');
  });

  add('sloppy wording creates multiple candidate interpretations', () => {
    const report = KernelIntentionRecoveryV04.analyze(KernelIntentionRecoveryV04.sampleInput('sloppy'));
    assert(report.decision === 'MULTIPLE_PLAUSIBLE', 'sloppy input should preserve multiple plausible meanings');
    assert(cats(report).includes('likely_intended_claim'), 'likely intended claim missing');
    assert(cats(report).includes('charitable_reconstruction'), 'charitable reconstruction missing');
    assert(cats(report).includes('ambiguous_intent'), 'ambiguous intent missing');
    assert(report.governor_candidate, 'sloppy recovered meaning should become governor candidate pressure');
  });

  add('sloppy recovery remains candidate pressure, not final belief', () => {
    const report = KernelIntentionRecoveryV04.analyze(KernelIntentionRecoveryV04.sampleInput('sloppy'));
    assert(report.interpretations.every(i => i.not_final_belief === true), 'interpretation became final belief');
    assert(report.doctrine.recovered_meaning_is_candidate_pressure === true, 'candidate pressure doctrine missing');
    assert(report.governor_report, 'governor report missing');
  });

  add('motive language without evidence is high-risk', () => {
    const report = KernelIntentionRecoveryV04.analyze(KernelIntentionRecoveryV04.sampleInput('motive'));
    assert(report.decision === 'HIGH_RISK_INTENT', 'motive overclaim should be high-risk');
    assert(cats(report).includes('motive_overclaim_risk'), 'motive overclaim category missing');
    assert(report.governor_candidate.attacks.includes('motive_or_intent_not_established'), 'motive attack missing');
  });

  add('motive overclaim produces safer observable reconstruction', () => {
    const report = KernelIntentionRecoveryV04.analyze(KernelIntentionRecoveryV04.sampleInput('motive'));
    assert(cats(report).includes('charitable_reconstruction'), 'observable reconstruction missing');
    assert(report.interpretations.some(i => i.risks.includes('motive_removed_for_safety')), 'motive-removal safety risk missing');
  });

  add('self-sealing input is high-risk and governor-blocked', () => {
    const report = KernelIntentionRecoveryV04.analyze(KernelIntentionRecoveryV04.sampleInput('self_sealing'));
    assert(report.decision === 'HIGH_RISK_INTENT', 'self-sealing should be high-risk');
    assert(cats(report).includes('hostile_or_self_sealing_pressure'), 'self-sealing category missing');
    assert(report.governor_report && report.governor_report.decision === 'BLOCK_MOVEMENT', 'governor should block self-sealing recovered pressure');
  });

  add('question asks clarification and creates no governor candidate', () => {
    const report = KernelIntentionRecoveryV04.analyze(KernelIntentionRecoveryV04.sampleInput('question'));
    assert(report.decision === 'CLARIFY', 'question should clarify');
    assert(cats(report).includes('clarification_needed'), 'clarification category missing');
    assert(report.governor_candidate === null, 'clarification should not become governor candidate');
  });

  add('source-backed claim becomes literal claim candidate', () => {
    const report = KernelIntentionRecoveryV04.analyze(KernelIntentionRecoveryV04.sampleInput('source_claim'));
    assert(report.decision === 'RECOVERED_CANDIDATE', 'source claim should be recovered candidate');
    assert(cats(report).includes('literal_claim'), 'literal claim category missing');
    assert(report.selected_interpretation.evidence.includes('reality_contact_language_detected'), 'reality contact evidence missing');
    assert(report.governor_candidate, 'literal claim should become governor candidate');
  });

  add('plain bounded claim becomes literal claim candidate', () => {
    const report = KernelIntentionRecoveryV04.analyze(KernelIntentionRecoveryV04.sampleInput('plain'));
    assert(report.decision === 'RECOVERED_CANDIDATE', 'plain claim should be recovered candidate');
    assert(report.selected_interpretation.category === 'literal_claim', 'plain claim should be literal claim');
  });

  add('empty input asks clarification', () => {
    const report = KernelIntentionRecoveryV04.analyze('');
    assert(report.decision === 'CLARIFY', 'empty input should clarify');
    assert(report.selected_interpretation.category === 'clarification_needed', 'empty category wrong');
  });

  add('doctrine preserves uncertainty and governor ownership', () => {
    const report = KernelIntentionRecoveryV04.analyze(KernelIntentionRecoveryV04.sampleInput('sloppy'));
    assert(report.doctrine.true_understanding_beats_shallow_literalism === true, 'understanding doctrine missing');
    assert(report.doctrine.intent_recovery_is_not_mind_reading === true, 'mind-reading doctrine missing');
    assert(report.doctrine.preserve_live_alternatives_until_evidence_narrows_them === true, 'live alternatives doctrine missing');
    assert(report.doctrine.governor_owns_belief_movement === true, 'governor doctrine missing');
  });

  const results = tests.map(t => { try { t.fn(); return { name:t.name, passed:true }; } catch(e) { return { name:t.name, passed:false, error:e.message }; } });
  const passed = results.filter(r => r.passed).length;
  document.getElementById('summary').className = passed === results.length ? 'ok' : 'bad';
  document.getElementById('summary').textContent = `${passed}/${results.length} passed`;
  document.getElementById('out').textContent = JSON.stringify({ packet_type:'42ndMind_intention_recovery_v0_4_test_report', results }, null, 2);
</script>
</body>
</html>
