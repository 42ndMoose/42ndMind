<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>42ndMind Intention Refinement Test</title><style>body{margin:0;background:#0f1115;color:#eef2ff;font:14px ui-monospace,Menlo,Consolas,monospace}header{padding:16px;background:#11141b;border-bottom:1px solid #2a3040}main{padding:12px}section{background:#171a21;border:1px solid #2a3040;border-radius:10px;padding:12px}pre{white-space:pre-wrap;background:#0d1016;border:1px solid #2a3040;border-radius:10px;padding:10px;overflow:auto;max-height:760px}.ok{color:#9dffb4}.bad{color:#ff8b8b}a{color:#9db6ff}</style></head><body><header><h1>42ndMind Intention Refinement Test</h1><div>Tests deterministic contrast-pressure refinement of candidate intention formulas. No doctrine promotion. No real-world intent attribution.</div></header><main><section><h2 id="summary">Running...</h2><div><a href="intention-refinement.html?v=refine-1">intention refinement page</a></div><pre id="out"></pre></section></main><script src="src/kernel-intention-discovery-v0-1.js?v=intent-1"></script><script src="src/kernel-intention-refinement-v0-1.js?v=refine-1"></script><script>const tests=[];let packet=null;function add(n,f){tests.push({name:n,fn:f})}function assert(c,m){if(!c)throw new Error(m)}function arr(v){return Array.isArray(v)?v:[]}function byConcept(name){return arr(packet&&packet.refinements).find(r=>r.concept===name)}function roles(r,role){return arr(r&&r.dimension_classifications).filter(x=>x.refined_role===role).map(x=>x.dimension)}function l1(r){return Number(r&&r.refined_shape&&r.refined_shape.l1_total||0)}add('modules load',()=>{assert(window.KernelIntentionDiscoveryV01,'discovery module missing');assert(window.KernelIntentionRefinementV01,'refinement module missing');assert(KernelIntentionRefinementV01.VERSION==='0.1.0','version wrong');assert(typeof KernelIntentionRefinementV01.runRefinement==='function','runRefinement missing')});add('doctrine keeps refinement candidate-only',()=>{const d=KernelIntentionRefinementV01.doctrine();assert(d.refines_intention_concepts_not_claim_facts===true,'concept refinement doctrine missing');assert(d.no_real_world_intent_attribution===true,'intent attribution guard missing');assert(d.formulas_remain_candidate_not_doctrine===true,'candidate-only guard missing');assert(d.force_intensity_remains_separate_from_shape===true,'force separation guard missing');assert(d.belief_movement==='none','belief movement wrong')});add('refinement runs from discovery output',()=>{packet=KernelIntentionRefinementV01.runRefinement();assert(packet.ok===true,'packet not ok: '+JSON.stringify(packet.validation));assert(packet.source_discovery_ok===true,'source discovery not ok');assert(packet.refinement_count===3,'expected 3 refinements');assert(byConcept('desire'),'missing desire refinement');assert(byConcept('lying'),'missing lying refinement');assert(byConcept('promise'),'missing promise refinement');assert(packet.belief_movement==='none','packet moved belief')});add('all refined formulas remain unit-total',()=>{arr(packet.refinements).forEach(r=>{assert(r.ok===true,r.concept+' not ok');assert(r.refined_review_status==='refined_candidate_not_doctrine',r.concept+' promoted too early');assert(l1(r)===1,r.concept+' l1 not 1');assert(r.symbolic_formula.includes('Σ|dimension_i| = 1'),r.concept+' formula missing unit total');assert(r.symbolic_formula.includes('force = M · i'),r.concept+' formula missing force separation');assert(r.belief_movement==='none',r.concept+' moved belief')})});add('desire separates core, boundary, expression, and force',()=>{const r=byConcept('desire');assert(roles(r,'core_shape').length===4,'desire core count wrong');assert(roles(r,'boundary_shape').includes('constraint_contact'),'desire missing boundary constraint');assert(roles(r,'expression_or_derivative_shape').includes('action_or_attention_orientation'),'desire missing expression orientation');assert(!Object.keys(r.refined_shape.shape).includes('intensity'),'desire leaked intensity into shape')});add('lying keeps motive as expression not essence',()=>{const r=byConcept('lying');assert(roles(r,'core_shape').length===5,'lying core count wrong');assert(roles(r,'core_shape').includes('belief_assertion_mismatch'),'lying missing belief mismatch core');assert(roles(r,'core_shape').includes('concealment_of_mismatch'),'lying missing concealment core');assert(roles(r,'expression_or_derivative_shape').includes('advantage_avoidance_or_control_pressure'),'lying motive should be expression/function pressure');assert(!Object.keys(r.refined_shape.shape).includes('severity_or_harm'),'lying leaked severity into shape')});add('promise separates obligation essence from breach derivative',()=>{const r=byConcept('promise');assert(roles(r,'core_shape').length===4,'promise core count wrong');assert(roles(r,'core_shape').includes('normative_obligation_creation'),'promise missing obligation core');assert(roles(r,'boundary_shape').includes('condition_or_scope_boundary'),'promise missing scope boundary');assert(roles(r,'expression_or_derivative_shape').includes('breach_meaning_if_failed'),'promise breach should be derivative');assert(!Object.keys(r.refined_shape.shape).includes('trust_stakes'),'promise leaked trust stakes into shape')});add('validation report is clean',()=>{assert(packet.validation&&packet.validation.ok===true,'validation not ok');packet.validation.validations.forEach(v=>{assert(v.ok===true,v.concept+' validation failed: '+v.errors.join(','));assert(v.l1_total===1,v.concept+' validation l1 wrong');assert(v.core_count>=4,v.concept+' too few core dimensions');assert(v.belief_movement==='none',v.concept+' validation moved belief')})});(async function run(){const results=[];for(const t of tests){try{await t.fn();results.push({name:t.name,passed:true})}catch(e){results.push({name:t.name,passed:false,error:e.message})}}const passed=results.filter(r=>r.passed).length;document.getElementById('summary').className=passed===tests.length?'ok':'bad';document.getElementById('summary').textContent=passed+'/'+tests.length+' passed';document.getElementById('out').textContent=JSON.stringify({packet_type:'42ndMind_intention_refinement_test_report_v0_1',ok:passed===tests.length,refinement_count:packet&&packet.refinement_count,concepts:packet&&packet.refinements&&packet.refinements.map(r=>({concept:r.concept,l1:r.refined_shape.l1_total,shape:r.refined_shape.shape,roles:r.dimension_classifications.map(x=>({dimension:x.dimension,role:x.refined_role})),review_status:r.refined_review_status})),validation:packet&&packet.validation,results},null,2)})();</script></body></html>
