<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>42ndMind Ingestion-to-Preledger Bridge Test v0.1</title><style>body{margin:0;background:#0f1115;color:#eef2ff;font:14px ui-monospace,Menlo,Consolas,monospace}header{padding:16px;background:#11141b;border-bottom:1px solid #2a3040}main{padding:12px}section{background:#171a21;border:1px solid #2a3040;border-radius:10px;padding:12px}pre{white-space:pre-wrap;background:#0d1016;border:1px solid #2a3040;border-radius:10px;padding:10px;overflow:auto;max-height:760px}.ok{color:#9dffb4}.bad{color:#ff8b8b}a{color:#9db6ff}</style></head><body><header><h1>42ndMind Ingestion-to-Preledger Bridge Test v0.1</h1><div>Tests compiled dossier packets converted into preledger-ready candidate entries without truth promotion.</div></header><main><section><h2 id="summary">Running...</h2><div><a href="ingestion-to-preledger-bridge.html?v=prebridge-1">ingestion-to-preledger bridge page</a></div><pre id="out"></pre></section></main><script src="src/kernel-objective-claim-language-v0-1.js?v=claim-1"></script><script src="src/kernel-objective-claim-language-v0-1-1-patch.js?v=claim-2"></script><script src="src/kernel-external-anchor-packet-schema-v0-1.js?v=anchor-1"></script><script src="src/kernel-source-provenance-registry-v0-1.js?v=prov-1"></script><script src="src/kernel-evidence-media-registry-v0-1.js?v=evidence-1"></script><script src="src/kernel-truth-pressure-synthesis-v0-1.js?v=truth-1"></script><script src="src/kernel-truth-pressure-synthesis-v0-1-1-patch.js?v=truth-2"></script><script src="src/kernel-claim-narrative-benchmark-v0-1.js?v=bench-1"></script><script src="src/kernel-adversarial-narrative-pressure-v0-1.js?v=adv-1"></script><script src="src/kernel-real-world-packet-ingestion-discipline-v0-1.js?v=ingest-1"></script><script src="src/kernel-truth-ledger-preledger-v0-1.js?v=preledger-1"></script><script src="src/kernel-truth-ledger-preledger-stress-benchmark-v0-1.js?v=prestress-1"></script><script src="src/kernel-world-model-relation-expansion-v0-1.js?v=wmrel-1"></script><script src="src/kernel-world-model-relation-stress-benchmark-v0-1.js?v=wmrelstress-1"></script><script src="src/kernel-world-model-relation-stress-benchmark-v0-1-1-patch.js?v=wmrelstress-2"></script><script src="src/kernel-coverage-expansion-library-v0-1.js?v=coverage-1"></script><script src="src/kernel-coverage-stress-benchmark-v0-1.js?v=coverstress-1"></script><script src="src/kernel-deterministic-packet-ingestion-form-v0-1.js?v=ingestform-1"></script><script src="src/kernel-dossier-to-packet-compiler-v0-1.js?v=dossierpack-1"></script><script src="src/kernel-ingestion-to-preledger-bridge-v0-1.js?v=prebridge-1"></script><script>const tests=[];let packet=null;function add(n,f){tests.push({name:n,fn:f})}function assert(c,m){if(!c)throw new Error(m)}function arr(v){return Array.isArray(v)?v:[]}function entries(){return arr(packet&&packet.preledger_ready_entries)}function validation(){return packet&&packet.validation||{}}function types(){return new Set(entries().map(r=>r.source_packet_type))}function categories(){return new Set(entries().map(r=>r.preledger_category))}function unresolved(){return entries().flatMap(r=>arr(r.unresolved_items))}function guards(){return entries().flatMap(r=>Object.keys(r.separation_guards||{}).filter(k=>r.separation_guards[k]===true))}add('module loads and doctrine keeps bridge non-authoritative',()=>{assert(window.KernelDossierToPacketCompilerV01,'dossier compiler missing');assert(window.KernelIngestionToPreledgerBridgeV01,'preledger bridge missing');assert(KernelIngestionToPreledgerBridgeV01.VERSION==='0.1.0','version wrong');const d=KernelIngestionToPreledgerBridgeV01.doctrine();assert(d.ingestion_to_preledger_bridge_only===true,'bridge doctrine missing');assert(d.preledger_ready_is_not_truth_promotion===true,'preledger not truth doctrine missing');assert(d.compiled_ingestion_packets_become_candidate_preledger_entries===true,'candidate entry doctrine missing');assert(d.dossier_material_remains_context_not_truth===true,'dossier context doctrine missing');assert(d.support_pressure_is_not_truth===true,'support doctrine missing');assert(d.counter_pressure_is_not_disproof===true,'counter doctrine missing');assert(d.no_llm===true,'no LLM doctrine missing');assert(d.no_external_lookup===true,'no lookup doctrine missing');assert(d.belief_movement==='none','belief movement wrong')});add('bridge runs from dossier-to-packet compiler',()=>{packet=KernelIngestionToPreledgerBridgeV01.runIngestionToPreledgerBridge();assert(packet.ok===true,'packet not ok: '+JSON.stringify(validation()));assert(packet.source_dossier_compiler_ok===true,'source dossier compiler not ok');assert(packet.source_dossier_compiler_version==='0.1.0','source dossier compiler version wrong');assert(packet.source_compiled_section_count===2,'expected 2 source sections');assert(packet.source_compiled_packet_count===21,'expected 21 source compiled packets');assert(packet.preledger_ready_entry_count===21,'expected 21 preledger entries');assert(packet.source_packet_type_count===10,'expected 10 source packet types');assert(packet.preledger_category_count===10,'expected 10 preledger categories');assert(packet.ingestion_to_preledger_bridge_is_final_truth_authority===false,'became final authority')});add('all ten packet types and preledger categories are represented',()=>{['claim_candidate','source_reference','evidence_description','media_description','quote_fragment','context_note','adversarial_reframe','relation_candidate','coverage_hold','dossier_summary_packet'].forEach(type=>assert(types().has(type),type+' missing'));['claim_candidate_entry','source_anchor_entry','evidence_description_entry','media_description_entry','quote_fragment_entry','context_note_entry','adversarial_pressure_entry','relation_candidate_entry','unresolved_coverage_hold_entry','dossier_summary_entry'].forEach(cat=>assert(categories().has(cat),cat+' missing'));assert(validation().checks.packet_types_10===true,'packet types check failed');assert(validation().checks.preledger_categories_10===true,'category check failed')});add('source, evidence, media, quote, reframe, relation, and coverage guards stay visible',()=>{['source_reference_is_anchor_not_lookup','evidence_description_is_claim_not_verification','media_description_is_context_not_verification','quote_fragment_requires_context','adversarial_reframe_is_pressure_not_truth','relation_candidate_is_not_relation_truth','coverage_hold_preserves_unknown_or_unresolved_gap'].forEach(g=>assert(guards().includes(g),g+' guard missing'));assert(unresolved().includes('evidence_description_not_verified_evidence'),'evidence unresolved missing');assert(unresolved().includes('media_description_not_verified_media'),'media unresolved missing');assert(unresolved().includes('adversarial_reframe_pressure_not_truth'),'reframe unresolved missing');assert(validation().checks.source_evidence_media_quote_reframe_relation_coverage_guards_visible===true,'guard visibility check failed');assert(validation().checks.unresolved_items_visible===true,'unresolved check failed')});add('pressure components and promotion requirements are present without promotion',()=>{entries().forEach(r=>{assert(r.pressure_components,r.preledger_entry_id+' pressure missing');assert(arr(r.required_for_truth_promotion).length>=1,r.preledger_entry_id+' promotion requirements missing');assert(r.required_for_truth_promotion.includes('explicit_promotion_layer_required'),r.preledger_entry_id+' explicit promotion requirement missing')});assert(validation().checks.pressure_components_present_for_all===true,'pressure components check failed');assert(validation().checks.required_promotion_items_present_for_all===true,'promotion requirements check failed');assert(validation().checks.support_not_truth_guard_visible===true,'support guard check failed');assert(validation().checks.counter_not_disproof_guard_visible===true,'counter guard check failed')});add('all entries remain candidate preledger, not truth ledger',()=>{entries().forEach(r=>{assert(r.preledger_ready_status==='candidate_preledger_entry_not_truth',r.preledger_entry_id+' ready status unsafe');assert(r.ledger_status==='candidate_preledger_not_truth',r.preledger_entry_id+' ledger status unsafe');assert(r.truth_status==='not_adjudicated',r.preledger_entry_id+' truth adjudicated');assert(r.adjudicates_final_truth===false,r.preledger_entry_id+' adjudicates final truth');assert(r.promotion_status==='not_promoted',r.preledger_entry_id+' promoted')});assert(validation().checks.all_entries_candidate_preledger_not_truth===true,'candidate preledger check failed');assert(validation().checks.no_truth_promotion===true,'truth promotion check failed')});add('rollback, revision trail, and no silent mutation are preserved',()=>{assert(packet.rollback_available===true,'bridge rollback unavailable');assert(packet.rollback_snapshot&&packet.rollback_snapshot.source_dossier_compiler_packet,'bridge source rollback missing');entries().forEach(r=>{assert(r.rollback_available===true,r.preledger_entry_id+' rollback unavailable');assert(r.rollback_snapshot&&r.rollback_snapshot.source_ingestion_packet,r.preledger_entry_id+' rollback source missing');assert(arr(r.revision_trail).length>=1,r.preledger_entry_id+' revision trail missing');assert(arr(r.revision_trail).every(v=>v.silent_mutation===false),r.preledger_entry_id+' silent mutation present')});assert(validation().checks.rollback_available_for_all===true,'rollback check failed');assert(validation().checks.no_silent_mutation===true,'silent mutation check failed')});add('no final truth, no LLM, no lookup, and belief movement are preserved',()=>{entries().forEach(r=>{assert(r.final_authority===false,r.preledger_entry_id+' final authority true');assert(r.llm_used===false,r.preledger_entry_id+' LLM used');assert(r.external_lookup_performed===false,r.preledger_entry_id+' external lookup performed');assert(r.media_lookup_performed===false,r.preledger_entry_id+' media lookup performed');assert(r.source_lookup_performed===false,r.preledger_entry_id+' source lookup performed');assert(r.doctrine_status==='candidate_not_doctrine',r.preledger_entry_id+' doctrine status unsafe');assert(r.belief_movement==='none',r.preledger_entry_id+' belief movement not none')});assert(validation().checks.no_llm_used===true,'no LLM check failed');assert(validation().checks.no_lookup_used===true,'lookup check failed');assert(validation().checks.final_authority_false===true,'final authority check failed');assert(validation().checks.belief_movement_none===true,'belief movement check failed');assert(arr(validation().errors).length===0,'validation errors present: '+validation().errors.join(','))});(async function run(){const results=[];for(const t of tests){try{await t.fn();results.push({name:t.name,passed:true})}catch(e){results.push({name:t.name,passed:false,error:e.message})}}const passed=results.filter(r=>r.passed).length;document.getElementById('summary').className=passed===tests.length?'ok':'bad';document.getElementById('summary').textContent=passed+'/'+tests.length+' passed';document.getElementById('out').textContent=JSON.stringify({packet_type:'42ndMind_ingestion_to_preledger_bridge_test_report_v0_1',ok:passed===tests.length,source_dossier_compiler_ok:packet&&packet.source_dossier_compiler_ok,source_dossier_compiler_version:packet&&packet.source_dossier_compiler_version,source_compiled_section_count:packet&&packet.source_compiled_section_count,source_compiled_packet_count:packet&&packet.source_compiled_packet_count,preledger_ready_entry_count:packet&&packet.preledger_ready_entry_count,source_packet_type_count:packet&&packet.source_packet_type_count,preledger_category_count:packet&&packet.preledger_category_count,source_packet_type_counts:packet&&packet.source_packet_type_counts,preledger_category_counts:packet&&packet.preledger_category_counts,entries:entries().map(r=>({preledger_entry_id:r.preledger_entry_id,source_packet_type:r.source_packet_type,preledger_category:r.preledger_category,target_claim_id:r.target_claim_id,relation_family_candidate:r.relation_family_candidate,preledger_ready_status:r.preledger_ready_status,ledger_status:r.ledger_status,truth_status:r.truth_status,promotion_status:r.promotion_status,belief_movement:r.belief_movement})),validation:validation(),results},null,2)})();</script></body></html>
