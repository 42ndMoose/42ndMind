<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>42ndMind Arbitrary-Language Parser Test</title><style>body{margin:0;background:#0f1115;color:#eef2ff;font:14px ui-monospace,Menlo,Consolas,monospace}header{padding:16px;background:#11141b;border-bottom:1px solid #2a3040}main{padding:12px}section{background:#171a21;border:1px solid #2a3040;border-radius:10px;padding:12px}pre{white-space:pre-wrap;background:#0d1016;border:1px solid #2a3040;border-radius:10px;padding:10px;overflow:auto;max-height:760px}.ok{color:#9dffb4}.bad{color:#ff8b8b}a{color:#9db6ff}</style></head><body><header><h1>42ndMind Arbitrary-Language Parser Test</h1><div>Tests neutral text → candidate formula match against canonical ledger v0.1.1. Candidate only.</div></header><main><section><h2 id="summary">Running...</h2><div><a href="intention-arbitrary-language-parser.html?v=parser-1">parser page</a></div><pre id="out"></pre></section></main><script src="src/kernel-intention-discovery-v0-1.js?v=intent-1"></script><script src="src/kernel-intention-refinement-v0-1.js?v=refine-1"></script><script src="src/kernel-intention-necessity-test-v0-1.js?v=necessity-1"></script><script src="src/kernel-intention-neighbor-lattice-v0-1.js?v=lattice-3"></script><script src="src/kernel-intention-lattice-invariance-benchmark-v0-1.js?v=invariance-2"></script><script src="src/kernel-intention-formula-compiler-v0-1.js?v=formula-1"></script><script src="src/kernel-intention-concept-expansion-loop-v0-1.js?v=expansion-2"></script><script src="src/kernel-intention-contradiction-refinement-loop-v0-1.js?v=contradiction-1"></script><script src="src/kernel-intention-formula-revision-engine-v0-1.js?v=revision-1"></script><script src="src/kernel-intention-canonical-formula-ledger-v0-1.js?v=ledger-1"></script><script src="src/kernel-intention-proof-output-v0-1.js?v=proof-1"></script><script src="src/kernel-intention-minimal-pair-library-v0-1.js?v=minpair-1"></script><script src="src/kernel-intention-dimension-splitting-v0-1.js?v=split-2"></script><script src="src/kernel-intention-coefficient-dimension-revision-engine-v0-1.js?v=codim-1"></script><script src="src/kernel-intention-canonical-formula-ledger-v0-1-1-patch.js?v=ledger-2"></script><script src="src/kernel-intention-arbitrary-language-parser-v0-1.js?v=parser-1"></script><script>const tests=[];let packet=null;function add(n,f){tests.push({name:n,fn:f})}function assert(c,m){if(!c)throw new Error(m)}function arr(v){return Array.isArray(v)?v:[]}function parses(){return arr(packet&&packet.parses)}add('modules load and doctrine is parser-only',()=>{assert(window.KernelIntentionArbitraryLanguageParserV01,'parser missing');assert(KernelIntentionArbitraryLanguageParserV01.VERSION==='0.1.0','version wrong');assert(typeof KernelIntentionArbitraryLanguageParserV01.runParser==='function','runParser missing');const d=KernelIntentionArbitraryLanguageParserV01.doctrine();assert(d.parses_text_into_candidate_formula_matches===true,'parser doctrine missing');assert(d.parser_is_deterministic_v0_1_not_semantic_oracle===true,'deterministic guard missing');assert(d.no_real_world_intent_attribution===true,'attribution guard missing');assert(d.ambiguity_must_remain_visible===true,'ambiguity guard missing');assert(d.unresolved_dimensions_must_remain_visible===true,'unresolved guard missing');assert(d.belief_movement==='none','belief movement wrong')});add('parser runs from canonical ledger v0.1.1 and proof output',()=>{packet=KernelIntentionArbitraryLanguageParserV01.runParser();assert(packet.ok===true,'packet not ok: '+JSON.stringify(packet.validation));assert(packet.source_ledger_ok===true,'source ledger not ok');assert(packet.source_ledger_record_count===11,'expected 11 ledger records');assert(packet.source_proof_ok===true,'source proof not ok');assert(packet.source_proof_count===11,'expected 11 proofs');assert(packet.belief_movement==='none','packet moved belief')});add('twelve parse cases are produced',()=>{assert(packet.parse_count===12,'expected 12 parses');assert(parses().length===12,'expected 12 parse rows');assert(packet.validation.checks.twelve_parse_cases===true,'twelve parse check failed')});add('expected neutral samples map to their target concepts',()=>{const expected=parses().filter(p=>p.expected_concept&&p.expected_concept!=='ambiguous');assert(expected.length===11,'expected 11 labeled samples');expected.forEach(p=>{assert(p.expected_match===true,p.parse_id+' expected '+p.expected_concept+' got '+(p.top_candidate&&p.top_candidate.concept));assert(p.top_candidate&&p.top_candidate.normalized_score>0,p.parse_id+' score not positive')});assert(packet.validation.checks.expected_samples_matched===true,'expected sample check failed')});add('ambiguity and unresolved dimensions remain visible',()=>{assert(packet.validation.checks.ambiguity_visible===true,'ambiguity not visible');assert(packet.validation.checks.unresolved_dimensions_visible===true,'unresolved dimensions check failed');parses().forEach(p=>{assert(typeof p.ambiguity_score==='number',p.parse_id+' missing ambiguity score');assert(p.top_candidate&&typeof p.top_candidate.unresolved_dimension_count==='number',p.parse_id+' missing unresolved dimension count');assert(arr(p.candidates).length>0,p.parse_id+' missing candidate list')})});add('top candidate uses v0003 ledger memory and has proof reference',()=>{parses().forEach(p=>{assert(p.top_candidate&&p.top_candidate.candidate_version.includes('v0003_coefficient_dimension_revision'),p.parse_id+' top candidate not v0003');assert(p.top_candidate.proof_reference&&p.top_candidate.proof_reference.proof_id,p.parse_id+' missing proof reference')})});add('L1, force separation, and candidate-only status are preserved',()=>{parses().forEach(p=>{assert(p.top_candidate.observed_l1_total===1,p.parse_id+' top l1 wrong');assert(p.top_candidate.force_terms_outside_shape===true,p.parse_id+' force leaked');assert(p.top_candidate.promotion_status==='not_promoted',p.parse_id+' promoted');assert(p.top_candidate.doctrine_status==='candidate_not_doctrine',p.parse_id+' doctrine status wrong')});assert(packet.validation.checks.force_terms_outside_shape===true,'force check failed');assert(packet.validation.checks.candidate_only_not_promoted===true,'candidate-only check failed')});add('belief movement and validation are clean',()=>{parses().forEach(p=>assert(p.belief_movement==='none',p.parse_id+' moved belief'));assert(packet.validation.checks.belief_movement_none===true,'belief movement check failed');assert(arr(packet.validation.errors).length===0,'validation errors present: '+packet.validation.errors.join(','))});(async function run(){const results=[];for(const t of tests){try{await t.fn();results.push({name:t.name,passed:true})}catch(e){results.push({name:t.name,passed:false,error:e.message})}}const passed=results.filter(r=>r.passed).length;document.getElementById('summary').className=passed===tests.length?'ok':'bad';document.getElementById('summary').textContent=passed+'/'+tests.length+' passed';document.getElementById('out').textContent=JSON.stringify({packet_type:'42ndMind_intention_arbitrary_language_parser_test_report_v0_1',ok:passed===tests.length,source_ledger_record_count:packet&&packet.source_ledger_record_count,source_proof_count:packet&&packet.source_proof_count,parse_count:packet&&packet.parse_count,parses:parses().map(p=>({parse_id:p.parse_id,parse_status:p.parse_status,expected_concept:p.expected_concept,top_concept:p.top_candidate&&p.top_candidate.concept,top_version:p.top_candidate&&p.top_candidate.candidate_version,normalized_score:p.top_candidate&&p.top_candidate.normalized_score,ambiguity_score:p.ambiguity_score,unresolved_dimension_count:p.top_candidate&&p.top_candidate.unresolved_dimension_count,belief_movement:p.belief_movement})),validation:packet&&packet.validation,results},null,2)})();</script></body></html>
