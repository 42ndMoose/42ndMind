<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>42ndMind Runtime Candidates v0.4 Test</title>
  <style>
    body { margin:0; font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; background:#0f1115; color:#eef2ff; }
    header { padding:16px 18px; border-bottom:1px solid #2a3040; background:#11141b; }
    main { padding:12px; }
    section { background:#171a21; border:1px solid #2a3040; border-radius:10px; padding:12px; }
    h1 { font:700 19px/1.2 system-ui,-apple-system,Segoe UI,sans-serif; margin:0 0 4px; }
    pre { white-space:pre-wrap; background:#0d1016; border:1px solid #2a3040; border-radius:10px; padding:10px; overflow:auto; max-height:760px; }
    .ok { color:#9dffb4; } .bad { color:#ff8b8b; } a { color:#9db6ff; }
  </style>
</head>
<body>
<header><h1>42ndMind Runtime Candidates v0.4 Test</h1><div>Tests disabled runtime candidate staging and metadata-only enablement.</div></header>
<main><section><h2 id="summary">Running...</h2><div><a href="kernel-patch-candidate-v0-4-test.html">patch candidate test</a> · <a href="kernel-test-suite-v0-4.html">integrated suite</a></div><pre id="out"></pre></section></main>
<script src="src/kernel-epistemic-governor-v0-1.js?v=0.1.0"></script>
<script src="src/kernel-epistemic-governor-v0-1-1-patch.js?v=0.1.1"></script>
<script src="src/kernel-epistemic-governor-v0-1-2-patch.js?v=0.1.2"></script>
<script src="src/kernel-self-maintenance-v0-4.js?v=0.4.0"></script>
<script src="src/kernel-promotion-pipeline-v0-4.js?v=0.4.0"></script>
<script src="src/kernel-promotion-pipeline-v0-4-1-patch.js?v=0.4.1"></script>
<script src="src/kernel-patch-candidate-v0-4.js?v=0.4.0"></script>
<script src="src/kernel-runtime-candidates-v0-4.js?v=0.4.0"></script>
<script>
  const tests = [];
  const TEST_KEY = '42ndMind_runtime_candidates_v0_4_test';
  function add(name, fn) { tests.push({ name, fn }); }
  function assert(cond, msg) { if (!cond) throw new Error(msg); }
  function runtimePlan() { return KernelRuntimeCandidatesV04.samplePlan('runtime'); }

  add('module loads', () => {
    assert(window.KernelRuntimeCandidatesV04, 'KernelRuntimeCandidatesV04 missing');
    assert(KernelRuntimeCandidatesV04.VERSION === '0.4.0', 'wrong runtime candidate version');
    assert(KernelRuntimeCandidatesV04.DEFAULT_KEY === '42ndMind_runtime_candidates_v0_4', 'wrong default key');
  });

  add('clear starts empty', () => {
    KernelRuntimeCandidatesV04.clear(TEST_KEY);
    assert(KernelRuntimeCandidatesV04.load(TEST_KEY).length === 0, 'queue should start empty');
  });

  add('stage requires runtime-ready plan', () => {
    const patchPlan = KernelPatchCandidateV04.createPlan(KernelPatchCandidateV04.sampleInput('patch'));
    const result = KernelRuntimeCandidatesV04.stage(patchPlan, { key:TEST_KEY, explicit_stage:true });
    assert(result.ok === false, 'patch plan should not stage as runtime candidate');
    assert(result.reason === 'plan_not_runtime_ready', 'wrong non-runtime plan reason');
  });

  add('stage requires explicit stage flag', () => {
    const result = KernelRuntimeCandidatesV04.stage(runtimePlan(), { key:TEST_KEY });
    assert(result.ok === false, 'stage should require explicit flag');
    assert(result.reason === 'explicit_stage_required', 'wrong explicit stage reason');
    assert(KernelRuntimeCandidatesV04.load(TEST_KEY).length === 0, 'queue changed without explicit stage');
  });

  add('explicit stage stores disabled candidate', () => {
    const result = KernelRuntimeCandidatesV04.stage(runtimePlan(), { key:TEST_KEY, explicit_stage:true });
    assert(result.ok === true, 'explicit stage failed');
    assert(result.candidate.status === 'STAGED_DISABLED', 'candidate should stage disabled');
    assert(result.candidate.enabled === false, 'candidate should not be enabled');
    assert(result.candidate.runtime_effect.behavior_executed === false, 'behavior executed during staging');
    assert(KernelRuntimeCandidatesV04.load(TEST_KEY).length === 1, 'queue should contain one candidate');
  });

  add('enable requires explicit enable', () => {
    const candidate = KernelRuntimeCandidatesV04.load(TEST_KEY)[0];
    const result = KernelRuntimeCandidatesV04.enable(candidate.id, { key:TEST_KEY, tests_passed:true, integrated_suite_passed:true, manual_reviewed:true });
    assert(result.ok === false, 'enable should require explicit flag');
    assert(result.reason === 'explicit_enable_required', 'wrong explicit enable reason');
  });

  add('enable requires local tests passed', () => {
    const candidate = KernelRuntimeCandidatesV04.load(TEST_KEY)[0];
    const result = KernelRuntimeCandidatesV04.enable(candidate.id, { key:TEST_KEY, explicit_enable:true, integrated_suite_passed:true, manual_reviewed:true });
    assert(result.ok === false, 'enable should require local tests');
    assert(result.reason === 'tests_passed_required', 'wrong tests required reason');
  });

  add('enable requires integrated suite passed', () => {
    const candidate = KernelRuntimeCandidatesV04.load(TEST_KEY)[0];
    const result = KernelRuntimeCandidatesV04.enable(candidate.id, { key:TEST_KEY, explicit_enable:true, tests_passed:true, manual_reviewed:true });
    assert(result.ok === false, 'enable should require integrated suite');
    assert(result.reason === 'integrated_suite_passed_required', 'wrong suite required reason');
  });

  add('enable requires manual review', () => {
    const candidate = KernelRuntimeCandidatesV04.load(TEST_KEY)[0];
    const result = KernelRuntimeCandidatesV04.enable(candidate.id, { key:TEST_KEY, explicit_enable:true, tests_passed:true, integrated_suite_passed:true });
    assert(result.ok === false, 'enable should require manual review');
    assert(result.reason === 'manual_review_required', 'wrong manual review reason');
  });

  add('full enable is metadata only', () => {
    const candidate = KernelRuntimeCandidatesV04.load(TEST_KEY)[0];
    const result = KernelRuntimeCandidatesV04.enable(candidate.id, { key:TEST_KEY, explicit_enable:true, tests_passed:true, integrated_suite_passed:true, manual_reviewed:true });
    assert(result.ok === true, 'full enable failed');
    assert(result.candidate.status === 'ENABLED_METADATA_ONLY', 'wrong enabled status');
    assert(result.candidate.enabled === true, 'candidate metadata enabled flag missing');
    assert(result.candidate.activation_record.metadata_only === true, 'metadata-only activation missing');
    assert(result.candidate.activation_record.behavior_executed === false, 'behavior executed on enable');
    assert(result.candidate.runtime_effect.source_rewritten === false, 'source rewritten on enable');
    assert(result.candidate.runtime_effect.import_executed === false, 'import executed on enable');
    assert(result.candidate.runtime_effect.v0_3_touched === false, 'v0.3 touched on enable');
  });

  add('export queue summarizes enabled metadata-only candidate', () => {
    const exported = KernelRuntimeCandidatesV04.exportQueue(TEST_KEY);
    assert(exported.packet_type === '42ndMind_runtime_candidates_export_v0_4', 'wrong export type');
    assert(exported.summary.enabled_metadata_only === 1, 'enabled summary wrong');
    assert(exported.doctrine.enabled_metadata_is_not_behavior_execution === true, 'metadata doctrine missing');
  });

  add('disable turns candidate off without executing behavior', () => {
    const candidate = KernelRuntimeCandidatesV04.load(TEST_KEY)[0];
    const result = KernelRuntimeCandidatesV04.disable(candidate.id, { key:TEST_KEY, reason:'test_disable' });
    assert(result.ok === true, 'disable failed');
    assert(result.candidate.status === 'DISABLED', 'wrong disabled status');
    assert(result.candidate.enabled === false, 'candidate should be disabled');
    assert(result.candidate.runtime_effect.behavior_executed === false, 'behavior executed on disable');
  });

  add('reject turns candidate rejected without executing behavior', () => {
    const staged = KernelRuntimeCandidatesV04.stage(runtimePlan(), { key:TEST_KEY, explicit_stage:true });
    const result = KernelRuntimeCandidatesV04.reject(staged.candidate.id, { key:TEST_KEY, reason:'test_reject' });
    assert(result.ok === true, 'reject failed');
    assert(result.candidate.status === 'REJECTED', 'wrong rejected status');
    assert(result.candidate.enabled === false, 'rejected candidate should not be enabled');
    assert(result.candidate.runtime_effect.behavior_executed === false, 'behavior executed on reject');
  });

  add('candidate not found paths fail safely', () => {
    assert(KernelRuntimeCandidatesV04.enable('missing', { key:TEST_KEY, explicit_enable:true, tests_passed:true, integrated_suite_passed:true, manual_reviewed:true }).reason === 'candidate_not_found', 'missing enable reason wrong');
    assert(KernelRuntimeCandidatesV04.disable('missing', { key:TEST_KEY }).reason === 'candidate_not_found', 'missing disable reason wrong');
    assert(KernelRuntimeCandidatesV04.reject('missing', { key:TEST_KEY }).reason === 'candidate_not_found', 'missing reject reason wrong');
  });

  add('cleanup clears queue', () => {
    const cleared = KernelRuntimeCandidatesV04.clear(TEST_KEY);
    assert(cleared.ok === true, 'clear failed');
    assert(KernelRuntimeCandidatesV04.load(TEST_KEY).length === 0, 'queue not cleared');
  });

  const results = tests.map(t => { try { t.fn(); return { name:t.name, passed:true }; } catch(e) { return { name:t.name, passed:false, error:e.message }; } });
  const passed = results.filter(r => r.passed).length;
  document.getElementById('summary').className = passed === results.length ? 'ok' : 'bad';
  document.getElementById('summary').textContent = `${passed}/${results.length} passed`;
  document.getElementById('out').textContent = JSON.stringify({ packet_type:'42ndMind_runtime_candidates_v0_4_test_report', results }, null, 2);
</script>
</body>
</html>
