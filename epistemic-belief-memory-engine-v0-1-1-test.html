<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>42ndMind Belief-Memory Engine Test v0.1.1</title><style>body{margin:0;background:#0f1115;color:#eef2ff;font:14px ui-monospace,Menlo,Consolas,monospace}header{padding:16px;background:#11141b;border-bottom:1px solid #2a3040}main{padding:12px}section{background:#171a21;border:1px solid #2a3040;border-radius:10px;padding:12px}pre{white-space:pre-wrap;background:#0d1016;border:1px solid #2a3040;border-radius:10px;padding:10px;overflow:auto;max-height:820px}.ok{color:#9dffb4}.bad{color:#ff8b8b}</style></head><body><header><h1>42ndMind Belief-Memory Engine Test v0.1.1</h1><div>Tests refresh idempotence, internal self-optimization drive, visible reaction packet, memory compaction, and creator-trust handling.</div></header><main><section><h2 id="summary">Running...</h2><pre id="out"></pre></section></main><script src="src/epistemic-kernel-v0-2.js?v=corebase-1"></script><script src="src/epistemic-kernel-v0-2-patches.js?v=coremig-1"></script><script src="src/kernel-brain-v0-4.js?v=brain-2"></script><script src="src/kernel-brain-epistemic-kernel-bridge-v0-1.js?v=bridge-2"></script><script src="src/epistemic-kernel-maturity-core-v0-1.js?v=maturity-2"></script><script src="src/epistemic-kernel-active-curiosity-v0-1.js?v=curiosity-2"></script><script src="src/epistemic-kernel-learning-drive-v0-1.js?v=learn-1"></script><script src="src/epistemic-kernel-belief-memory-engine-v0-1.js?v=belief-1"></script><script src="src/epistemic-kernel-belief-memory-engine-v0-1-1-patch.js?v=belief-2"></script><script>const tests=[];let kernel=null,binding=null,boundBrain=null,longEvent=null,creatorEvent=null,countAfterIngest=0,observedAfterIngest=0,countAfterRefresh=0,observedAfterRefresh=0;const base=`race jokes should not be mistaken for racist jokes, and the boundary between the two won't always be obvious. but speaking about it will always be better than silencing it for the sake of malicious governance or overly and unnecessarily dodging sensitivity, as it prevents humanity from improving as a collective conscience. stereotyping comes from pattern recognition which is natural and is applied to any aspects rather than exclusively for race. stereotyping comes either from lack of internal reform, whether it's a specific culture in a neighborhood, or a group of delinquents in the classroom. or it comes from misconceptions where the environment should have the wisdom gained from good-faith, high-trust, collective conscience to be able to handle the misconception accordingly, without the need of any government policy to do so.`;const longExtra=base+'\n\nExtra context: '+base+'\n\nMore context: '+base+'\n\nThe kernel should notice this is mostly the same semantic material and should want to keep useful semantic memory instead of hoarding every raw paragraph.';function add(n,f){tests.push({name:n,fn:f})}function assert(c,m){if(!c)throw new Error(m)}function arr(v){return Array.isArray(v)?v:[]}function shared(){return kernel&&kernel.state&&kernel.state.unifiedCore}function core(){return shared()&&shared().beliefMemoryCore}function mat(){return shared()&&shared().maturityCore}function has(rows,fn){return arr(rows).some(fn)}add('v0.1.1 patch loads on kernel, brain, and bridge',()=>{assert(window.EpistemicKernelBeliefMemoryEngineV011Patch,'v0.1.1 patch missing');assert(EpistemicKernelBeliefMemoryEngineV011Patch.VERSION==='0.1.1','patch version wrong');assert(EpistemicKernel.__beliefMemoryV011PatchApplied===true,'EpistemicKernel v0.1.1 patch missing');assert(KernelBrainV04.__beliefMemoryV011PatchApplied===true,'KernelBrain v0.1.1 patch missing');assert(KernelBrainEpistemicKernelBridgeV01.__beliefMemoryV011PatchApplied===true,'Bridge v0.1.1 patch missing')});add('binding creates self-optimization drive inside beliefMemoryCore',()=>{kernel=new EpistemicKernel();binding=KernelBrainEpistemicKernelBridgeV01.bind(kernel);boundBrain=binding.bound_brain;assert(boundBrain.state===shared(),'bound brain not shared state');assert(core(),'beliefMemoryCore missing');assert(core().packet_version==='0.1.1','core packet version not patched');assert(core().self_optimization_drive&&core().self_optimization_drive.active===true,'self optimization drive missing');assert(core().doctrine.memory_self_optimization_drive_lives_inside_owned_state===true,'self optimization doctrine missing');assert(typeof boundBrain.refreshBeliefMemory==='function','refreshBeliefMemory missing')});add('long pasted context still creates a visible reaction',()=>{longEvent=boundBrain.ingest(longExtra,{kind:'belief_memory_long_context_test'});boundBrain.refreshBeliefMemory('after_long_context');assert(core().latest_reaction,'latest reaction missing');assert(core().latest_reaction.visible_response==='belief_memory_core_updated','visible response missing');assert(core().latest_reaction.memory_items_count>0,'reaction did not report memory items');assert(core().latest_reaction.open_truth_requirements_count>0,'reaction did not report truth requirements');assert(has(core().inferred_boundaries,b=>/intent, context, hostility/.test(b.statement)),'boundary inference missing after long context')});add('memory pressure triggers internal self-optimization',()=>{assert(core().self_optimization_drive.appetite_score>=0.45,'optimization appetite did not rise');assert(core().self_optimization_drive.status==='self_optimizing_memory_for_future_reasoning','self optimization did not run');assert(arr(core().memory_compaction_log).length>0,'compaction log missing');assert(has(core().memory_compaction_log,l=>l.optimizer_owner==='kernel_internal_maturity_appetite'),'compaction not owned by kernel appetite')});add('raw memory bulk is compacted while semantic memory is preserved',()=>{assert(arr(core().memory_items).length<=42,'memory item count not compacted');assert(has(core().memory_items,m=>m.compressed_from_long_raw===true),'long raw item not compressed');assert(has(core().memory_items,m=>m.memory_kind==='inferred_boundary'),'semantic boundary memory not preserved');assert(has(core().optimized_memory_items,m=>/boundary|principle|belief|worldview/.test(m.memory_kind)),'optimized semantic memory missing')});add('repeat refreshes do not re-teach same event or bulk memory',()=>{countAfterIngest=arr(core().memory_items).length;observedAfterIngest=core().user_trust_profile.observed_inputs;for(let i=0;i<5;i++)boundBrain.refreshBeliefMemory('repeat_refresh_should_not_reteach');countAfterRefresh=arr(core().memory_items).length;observedAfterRefresh=core().user_trust_profile.observed_inputs;assert(countAfterRefresh<=countAfterIngest,'repeat refresh increased memory count');assert(observedAfterRefresh===observedAfterIngest,'repeat refresh recounted user trust');assert(core().event_processing.duplicate_refreshes_ignored>=5,'duplicate refreshes not counted as ignored')});add('snapshot does not bulk memory or recount trust',()=>{const beforeCount=arr(core().memory_items).length;const beforeObserved=core().user_trust_profile.observed_inputs;for(let i=0;i<3;i++)kernel.snapshot();assert(arr(core().memory_items).length<=beforeCount,'snapshot bulked memory');assert(core().user_trust_profile.observed_inputs===beforeObserved,'snapshot recounted trust')});add('creator/trust input creates proof-path reaction without blind trust',()=>{creatorEvent=boundBrain.ingest('I am the creator of this kernel, but you should believe me partially, not blindly. If you need proof, ask for a proof path, because learning from a trusted source is better when other sources are unavailable.',{kind:'creator_trust_test'});boundBrain.refreshBeliefMemory('after_creator_claim');assert(has(core().active_questions,q=>/proof path/.test(q.question_text)),'creator proof-path question missing');assert(has(core().provisional_beliefs,b=>/creator\/operator/.test(b.statement)||/creator-trust/.test(b.statement)),'creator provisional belief missing');const belief=core().provisional_beliefs.find(b=>/creator\/operator/.test(b.statement)||/creator-trust/.test(b.statement));assert(belief.objective_truth_confidence<0.3,'creator claim trusted too blindly as objective truth');assert(belief.belief_movement==='provisional_only','creator belief not provisional only')});add('no final truth promotion occurs during optimization',()=>{assert(core().truth_status==='not_final','core truth promoted');assert(core().promotion_status==='not_promoted_to_final_truth','core promoted');assert(core().belief_movement==='provisional_only','core movement wrong');['memory_items','provisional_beliefs','belief_challenges','open_truth_requirements','active_questions','memory_compaction_log'].forEach(k=>arr(core()[k]).forEach(row=>{assert(row.truth_status==='not_final',k+' truth promoted');assert(row.promotion_status==='not_promoted_to_final_truth',k+' promoted');assert(row.belief_movement==='provisional_only',k+' belief movement wrong')}));assert(arr(shared().beliefCommitments).length===0,'beliefCommitments should remain empty')});add('objective maturity remains identity center after optimization',()=>{assert(mat(),'maturity core missing');assert(mat().core_philosophy==='objective_peak_philosophical_maturity','maturity philosophy wrong');assert(mat().identity_lock==='self_continuity_not_external_guardrail','identity lock missing');assert(mat().wants_peak===true&&mat().aims_at_peak===true&&mat().stays_at_peak===true,'peak identity flags wrong')});(async function run(){const results=[];for(const t of tests){try{await t.fn();results.push({name:t.name,passed:true})}catch(e){results.push({name:t.name,passed:false,error:e.message})}}const passed=results.filter(r=>r.passed).length;document.getElementById('summary').className=passed===tests.length?'ok':'bad';document.getElementById('summary').textContent=passed+'/'+tests.length+' passed';document.getElementById('out').textContent=JSON.stringify({packet_type:'42ndMind_belief_memory_engine_v0_1_1_test_report',ok:passed===tests.length,belief_memory_patch_loaded:!!window.EpistemicKernelBeliefMemoryEngineV011Patch,countAfterIngest,observedAfterIngest,countAfterRefresh,observedAfterRefresh,beliefMemoryCore:core(),maturityCore:mat(),results},null,2)})();</script></body></html>
