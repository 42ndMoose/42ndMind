<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>42ndMind Language-Math Core Test v0.1</title><style>body{margin:0;background:#0f1115;color:#eef2ff;font:14px ui-monospace,Menlo,Consolas,monospace}header{padding:16px;background:#11141b;border-bottom:1px solid #2a3040}main{padding:12px}section{background:#171a21;border:1px solid #2a3040;border-radius:10px;padding:12px}pre{white-space:pre-wrap;background:#0d1016;border:1px solid #2a3040;border-radius:10px;padding:10px;overflow:auto;max-height:820px}.ok{color:#9dffb4}.bad{color:#ff8b8b}</style></head><body><header><h1>42ndMind Language-Math Core Test v0.1</h1><div>Tests owned-state integration of the existing objective language-math kernel with communication attention.</div></header><main><section><h2 id="summary">Running...</h2><pre id="out"></pre></section></main><script src="src/kernel-intention-discovery-v0-1.js?v=intent-1"></script><script src="src/kernel-intention-refinement-v0-1.js?v=refine-1"></script><script src="src/kernel-intention-necessity-test-v0-1.js?v=necessity-1"></script><script src="src/kernel-intention-neighbor-lattice-v0-1.js?v=lattice-3"></script><script src="src/kernel-intention-lattice-invariance-benchmark-v0-1.js?v=invariance-2"></script><script src="src/kernel-intention-formula-compiler-v0-1.js?v=formula-1"></script><script src="src/kernel-intention-concept-expansion-loop-v0-1.js?v=expansion-2"></script><script src="src/kernel-intention-contradiction-refinement-loop-v0-1.js?v=contradiction-1"></script><script src="src/kernel-intention-formula-revision-engine-v0-1.js?v=revision-1"></script><script src="src/kernel-intention-canonical-formula-ledger-v0-1.js?v=ledger-1"></script><script src="src/kernel-intention-proof-output-v0-1.js?v=proof-1"></script><script src="src/kernel-intention-minimal-pair-library-v0-1.js?v=minpair-1"></script><script src="src/kernel-intention-dimension-splitting-v0-1.js?v=split-2"></script><script src="src/kernel-intention-coefficient-dimension-revision-engine-v0-1.js?v=codim-1"></script><script src="src/kernel-intention-canonical-formula-ledger-v0-1-1-patch.js?v=ledger-2"></script><script src="src/kernel-intention-formula-inspector-v0-1.js?v=inspect-1"></script><script src="src/kernel-concept-admission-registry-v0-1.js?v=admit-1"></script><script src="src/kernel-intention-formula-inspector-v0-1-1-patch.js?v=inspect-2"></script><script src="src/kernel-intention-arbitrary-language-parser-v0-1.js?v=parser-1"></script><script src="src/kernel-intention-arbitrary-language-parser-v0-1-1-patch.js?v=parser-3"></script><script src="src/kernel-objective-claim-language-v0-1.js?v=claim-1"></script><script src="src/kernel-objective-claim-language-v0-1-1-patch.js?v=claim-2"></script><script src="src/epistemic-kernel-v0-2.js?v=corebase-1"></script><script src="src/epistemic-kernel-v0-2-patches.js?v=coremig-1"></script><script src="src/kernel-brain-v0-4.js?v=brain-2"></script><script src="src/kernel-brain-epistemic-kernel-bridge-v0-1.js?v=bridge-2"></script><script src="src/epistemic-kernel-maturity-core-v0-1.js?v=maturity-2"></script><script src="src/epistemic-kernel-active-curiosity-v0-1.js?v=curiosity-2"></script><script src="src/epistemic-kernel-learning-drive-v0-1.js?v=learn-1"></script><script src="src/epistemic-kernel-belief-memory-engine-v0-1.js?v=belief-1"></script><script src="src/epistemic-kernel-belief-memory-engine-v0-1-1-patch.js?v=belief-3"></script><script src="src/epistemic-kernel-language-math-core-v0-1.js?v=langmath-1"></script><script>const tests=[];let kernel=null,binding=null,boundBrain=null;function add(n,f){tests.push({name:n,fn:f})}function assert(c,m){if(!c)throw new Error(m)}function arr(v){return Array.isArray(v)?v:[]}function shared(){return kernel&&kernel.state&&kernel.state.unifiedCore}function lm(){return shared()&&shared().languageMathCore}function comm(){return shared()&&shared().communicationCore}function mat(){return shared()&&shared().maturityCore}function has(rows,fn){return arr(rows).some(fn)}add('module loads and patches kernel, brain, and bridge',()=>{assert(window.EpistemicKernelLanguageMathCoreV01,'language math core missing');assert(EpistemicKernelLanguageMathCoreV01.VERSION==='0.1.0','version mismatch');assert(EpistemicKernel.__languageMathCorePatchApplied===true,'EpistemicKernel patch missing');assert(KernelBrainV04.__languageMathCorePatchApplied===true,'KernelBrain patch missing');assert(KernelBrainEpistemicKernelBridgeV01.__languageMathCorePatchApplied===true,'bridge patch missing')});add('binding creates languageMathCore and communicationCore inside shared state',()=>{kernel=new EpistemicKernel();binding=KernelBrainEpistemicKernelBridgeV01.bind(kernel);boundBrain=binding.bound_brain;assert(boundBrain.state===shared(),'bound brain does not share unified state');assert(lm(),'languageMathCore missing');assert(comm(),'communicationCore missing');assert(lm().doctrine.language_math_core_lives_inside_owned_state===true,'owned-state doctrine missing');assert(comm().doctrine.communication_projects_live_state_pressure===true,'communication doctrine missing')});add('existing objective language-math dependencies and formula memory are visible',()=>{boundBrain.refreshLanguageMathCore('test_dependency_refresh');const d=lm().dependency_status;assert(d.unified_formula_inspector===true,'unified formula inspector unavailable');assert(d.arbitrary_language_parser===true,'arbitrary language parser unavailable');assert(d.concept_admission_registry===true,'concept admission registry unavailable');assert(lm().formula_memory_summary.available===true,'formula memory unavailable');assert(lm().formula_memory_summary.canonical_count===11,'canonical count wrong');assert(lm().formula_memory_summary.admitted_count===6,'admitted count wrong');assert(lm().formula_memory_summary.total_formula_record_count===17,'total formula count wrong')});add('semantic remapping claim is detected as relation formula',()=>{boundBrain.ingest('chicken means stretch',{kind:'semantic_remap_test'});boundBrain.refreshLanguageMathCore('after_semantic_remap');assert(has(lm().semantic_relation_claims,r=>r.source_term==='chicken'&&r.target_meaning==='stretch'),'chicken->stretch relation missing');const rel=lm().semantic_relation_claims.find(r=>r.source_term==='chicken'&&r.target_meaning==='stretch');assert(rel.relation_formula==='chicken -> stretch','relation formula wrong');assert(rel.accepted_as_general_meaning===false,'bad meaning accepted as general');assert(rel.allowed_as_private_or_local_definition_candidate===true,'private/local candidate not allowed')});add('semantic inconsistency creates scoped trust hold, not total user distrust',()=>{const rel=lm().semantic_relation_claims.find(r=>r.source_term==='chicken'&&r.target_meaning==='stretch');assert(rel.conflict_score>=0.75,'conflict score too low');assert(has(lm().semantic_conflicts,r=>r.relation_id===rel.relation_id),'semantic conflict missing');assert(has(lm().scoped_trust_adjustments,a=>a.scope==='semantic_definition_claims'&&a.scoped_only===true),'scoped trust adjustment missing');assert(lm().scoped_trust_adjustments.find(a=>a.scope==='semantic_definition_claims').total_user_trust_reduction===false,'trust reduction was total instead of scoped')});add('communicationCore projects one live thought challenging the claim',()=>{assert(lm().live_thought,'live thought missing');assert(comm().current_message,'communication current message missing');assert(comm().current_message.thought_kind==='semantic_conflict_question','wrong communication kind');assert(/cannot accept/.test(comm().current_message.message),'challenge message missing');assert(/scope or reason/.test(comm().current_message.message),'scope/reason question missing')});add('reply can be carried as benefit-of-doubt back-of-head context',()=>{boundBrain.ingest('I was testing whether you would blindly accept semantic remapping.',{kind:'benefit_of_doubt_reply'});boundBrain.refreshLanguageMathCore('after_benefit_reply');assert(has(lm().benefit_of_doubt_context,c=>/testing/.test(c.statement)),'benefit-of-doubt context missing');assert(has(lm().back_of_head_context,c=>c.use_policy==='may_inform_next_interpretation_without_truth_promotion'),'back-of-head context missing');assert(comm().current_message.thought_kind==='benefit_of_doubt_acknowledgement','benefit acknowledgement missing')});add('ordinary language still routes through parser toward candidate formula concepts',()=>{boundBrain.ingest('A person clearly agrees after understanding the scope and can still say no.',{kind:'formula_parse_test'});boundBrain.refreshLanguageMathCore('after_formula_parse');assert(has(lm().parser_results,p=>p.top_candidate&&p.top_candidate.concept==='consent'),'consent parser result missing');assert(comm().current_message.thought_kind==='formula_parse_statement','formula parse communication missing')});add('candidate admission requests do not silently mutate canonical meaning',()=>{assert(has(lm().candidate_admission_requests,r=>r.source_term==='chicken'&&r.target_meaning==='stretch'),'candidate admission request missing');const req=lm().candidate_admission_requests.find(r=>r.source_term==='chicken'&&r.target_meaning==='stretch');assert(req.admission_status==='held_for_scope_or_reason','bad admission status');assert(req.rollback_required===true,'rollback required missing');assert(req.promotion_status==='not_promoted_to_final_truth','admission promoted unexpectedly')});add('no final truth promotion and maturity identity preserved',()=>{assert(lm().truth_status==='not_final','language math core truth promoted');assert(lm().promotion_status==='not_promoted_to_final_truth','language math core promoted');assert(lm().belief_movement==='provisional_only','language math belief movement wrong');['semantic_relation_claims','semantic_conflicts','scoped_trust_adjustments','benefit_of_doubt_context','back_of_head_context','candidate_admission_requests','communication_pressure'].forEach(k=>arr(lm()[k]).forEach(row=>{assert(row.truth_status==='not_final',k+' truth promoted');assert(row.promotion_status==='not_promoted_to_final_truth',k+' promoted');assert(row.belief_movement==='provisional_only',k+' belief movement wrong')}));assert(mat().core_philosophy==='objective_peak_philosophical_maturity','maturity identity missing');assert(mat().wants_peak===true&&mat().aims_at_peak===true&&mat().stays_at_peak===true,'peak identity flags wrong')});(async function run(){const results=[];for(const t of tests){try{await t.fn();results.push({name:t.name,passed:true})}catch(e){results.push({name:t.name,passed:false,error:e.message})}}const passed=results.filter(r=>r.passed).length;document.getElementById('summary').className=passed===tests.length?'ok':'bad';document.getElementById('summary').textContent=passed+'/'+tests.length+' passed';document.getElementById('out').textContent=JSON.stringify({packet_type:'42ndMind_language_math_core_v0_1_test_report',ok:passed===tests.length,language_math_loaded:!!window.EpistemicKernelLanguageMathCoreV01,languageMathCore:lm(),communicationCore:comm(),maturityCore:mat(),results},null,2)})();</script></body></html>
