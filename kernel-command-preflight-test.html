<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>42ndMind Kernel Command Preflight Test</title>
  <style>
    body { margin:0; font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; background:#0f1115; color:#eef2ff; }
    header { padding:16px 18px; border-bottom:1px solid #2a3040; background:#11141b; }
    main { padding:12px; }
    section { background:#171a21; border:1px solid #2a3040; border-radius:10px; padding:12px; }
    h1 { font:700 19px/1.2 system-ui,-apple-system,Segoe UI,sans-serif; margin:0 0 4px; }
    pre { white-space:pre-wrap; background:#0d1016; border:1px solid #2a3040; border-radius:10px; padding:10px; overflow:auto; max-height:700px; }
    .ok { color:#9dffb4; } .bad { color:#ff8b8b; } a { color:#9db6ff; }
  </style>
</head>
<body>
<header><h1>42ndMind Kernel Command Preflight Test</h1><div>Deterministic import-boundary tests using the unified governor.</div></header>
<main><section><h2 id="summary">Running...</h2><div><a href="kernel-command-preflight.html">preflight page</a> · <a href="llm-brain-v0-3.html">live brain</a></div><pre id="out"></pre></section></main>
<script src="src/kernel-epistemic-governor-v0-1.js?v=0.1.0"></script>
<script src="src/kernel-epistemic-governor-v0-1-1-patch.js?v=0.1.1"></script>
<script src="src/kernel-epistemic-governor-v0-1-2-patch.js?v=0.1.2"></script>
<script src="src/kernel-command-preflight-v0-1.js?v=0.1.0"></script>
<script src="src/kernel-command-preflight-v0-1-1-patch.js?v=0.1.1"></script>
<script src="src/kernel-command-preflight-v0-1-2-governor-patch.js?v=0.1.2"></script>
<script src="src/kernel-command-preflight-v0-1-3-governor-evidence-patch.js?v=0.1.3"></script>
<script>
  const tests = [];
  function add(name, fn) { tests.push({ name, fn }); }
  function assert(cond, msg) { if (!cond) throw new Error(msg); }

  function reviewedCommand() {
    return {
      command_type:'epistemic_kernel_command',
      requires_user_approval:true,
      commands:[{
        op:'import_packet',
        packet:{
          packet_type:'epistemic_extraction_packet',
          packet_version:'reviewed_sample_v0_1',
          source:'reviewed_sample',
          claims:[{ client_id:'reviewed_claim_1', text:'Reviewed source evidence supports this bounded claim.', subject:'sample', object:'bounded_claim', scope:'claim', confidence:0.7, status:'active', links:{ source_ids:['source_reviewed_1'], support_status:'evidence_backed', source_review_status_is_metadata_only:true } }],
          evidence:[{ text:'Reviewed source row supports the bounded claim.', relation:'supports', target:'reviewed_claim_1', strength:'moderate', confidence:0.7, source:'reviewed_sample', links:{ source_ids:['source_reviewed_1'], support_status:'evidence_backed', source_review_status_is_metadata_only:true } }],
          principles:[], dependencies:[], observations:[], questions:[{ text:'What would weaken this bounded claim?', links:{ client_id:'reviewed_claim_1' } }], gate_events:[],
          meta:{ source_ids:['source_reviewed_1'], support_status:'evidence_backed', retrieval_is_not_verification:true, provenance_is_not_proof:true, no_automatic_import:true, no_belief_movement_until_user_import:true }
        }
      }]
    };
  }

  add('module and governor patches load', () => {
    assert(window.KernelCommandPreflightV01, 'KernelCommandPreflightV01 missing');
    assert(window.KernelEpistemicGovernorV01, 'KernelEpistemicGovernorV01 missing');
    assert(KernelCommandPreflightV01.VERSION === '0.1.3-governor-evidence-patch', 'preflight governor patch version did not load');
    assert(KernelEpistemicGovernorV01.VERSION === '0.1.2', 'governor version did not load');
  });

  add('reviewed bounded command is safe', () => {
    const report = KernelCommandPreflightV01.analyze(reviewedCommand());
    assert(report.decision === 'SAFE_TO_IMPORT', 'reviewed command should be safe');
    assert(report.import_allowed === true, 'reviewed command should be allowed');
    assert(report.governor_bridge && report.governor_bridge.available === true, 'governor bridge missing');
  });

  add('source-empty unreviewed sample imports only with caution', () => {
    const report = KernelCommandPreflightV01.analyze(KernelCommandPreflightV01.sampleSafeCautionCommand());
    assert(report.decision === 'IMPORT_WITH_CAUTION', 'source-empty unreviewed sample should import with caution');
    assert(report.issues.some(i => i.code === 'source_empty_unreviewed_import' || i.code === 'governor_capped_maturity'), 'missing source-empty/governor caution');
  });

  add('blocked sample blocks import', () => {
    const report = KernelCommandPreflightV01.analyze(KernelCommandPreflightV01.sampleBlockedCommand());
    assert(report.decision === 'BLOCK_IMPORT', 'blocked sample should block import');
    assert(report.import_allowed === false, 'blocked sample should not be allowed');
  });

  add('direct coordination without source is blocked', () => {
    const report = KernelCommandPreflightV01.analyze(KernelCommandPreflightV01.sampleBlockedCommand());
    assert(report.issues.some(i => i.code === 'direct_coordination_without_direct_source' || i.code === 'governor_blocked_movement'), 'direct coordination block missing');
  });

  add('rule promotion op is blocked', () => {
    const report = KernelCommandPreflightV01.analyze(KernelCommandPreflightV01.sampleBlockedCommand());
    assert(report.issues.some(i => i.code === 'blocked_op'), 'blocked op missing');
  });

  add('provenance humility cannot be disabled', () => {
    const report = KernelCommandPreflightV01.analyze(KernelCommandPreflightV01.sampleBlockedCommand());
    assert(report.issues.some(i => i.code === 'provenance_humility_disabled'), 'provenance humility block missing');
  });

  add('overconfident unreviewed claim is blocked', () => {
    const report = KernelCommandPreflightV01.analyze(KernelCommandPreflightV01.sampleBlockedCommand());
    assert(report.issues.some(i => i.code === 'overconfident_unreviewed_claim'), 'overconfident unreviewed claim block missing');
  });

  add('allowed commands are sanitized before import', () => {
    const report = KernelCommandPreflightV01.analyze(KernelCommandPreflightV01.sampleSafeCautionCommand());
    const packet = report.sanitized_command.commands[0].packet;
    assert(packet.meta.preflight_sanitized === true, 'preflight sanitized flag missing');
    assert(report.sanitized_command.requires_user_approval === true, 'approval not forced true');
    assert(report.sanitized_command.preflight.governor_version === '0.1.2', 'governor version missing from sanitized command');
  });

  add('sanitizer caps source-empty overconfidence when still allowed', () => {
    const cmd = KernelCommandPreflightV01.sampleSafeCautionCommand();
    cmd.commands[0].packet.claims[0].confidence = 0.6;
    const report = KernelCommandPreflightV01.analyze(cmd);
    assert(report.decision === 'IMPORT_WITH_CAUTION', 'overconfident but non-blocking command should import with caution');
    assert(report.sanitized_command.commands[0].packet.claims[0].confidence <= 0.42, 'confidence was not capped');
  });

  add('parse failure blocks import', () => {
    const report = KernelCommandPreflightV01.analyze('{ bad json');
    assert(report.decision === 'BLOCK_IMPORT', 'parse failure should block');
    assert(report.issues.some(i => i.code === 'parse_failed'), 'parse_failed issue missing');
  });

  add('doctrine states first-principles boundary', () => {
    const report = KernelCommandPreflightV01.analyze(reviewedCommand());
    assert(report.doctrine.deterministic_boundary === true, 'deterministic boundary missing');
    assert(report.doctrine.first_principles_before_belief_movement === true, 'first-principles doctrine missing');
    assert(report.doctrine.unresolved_pressure_must_remain_visible === true, 'unresolved pressure doctrine missing');
    assert(report.governor_bridge.doctrine.preflight_is_adapter_not_brain === true, 'preflight adapter doctrine missing');
  });

  add('support evidence counter cap is not treated as independent node failure', () => {
    const report = KernelCommandPreflightV01.analyze(reviewedCommand());
    assert(report.governor_bridge.evidence_counter_cap_handling && report.governor_bridge.evidence_counter_cap_handling.applied === true, 'evidence counter-cap handling missing');
    assert(report.decision === 'SAFE_TO_IMPORT', 'reviewed command should remain safe after evidence handling');
  });

  const results = tests.map(t => { try { t.fn(); return { name:t.name, passed:true }; } catch(e) { return { name:t.name, passed:false, error:e.message }; } });
  const passed = results.filter(r => r.passed).length;
  document.getElementById('summary').className = passed === results.length ? 'ok' : 'bad';
  document.getElementById('summary').textContent = `${passed}/${results.length} passed`;
  document.getElementById('out').textContent = JSON.stringify({ packet_type:'42ndMind_kernel_command_preflight_test_report', results }, null, 2);
</script>
</body>
</html>
