<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>42ndMind Truth Ledger Preledger Stress Benchmark Test v0.1</title><style>body{margin:0;background:#0f1115;color:#eef2ff;font:14px ui-monospace,Menlo,Consolas,monospace}header{padding:16px;background:#11141b;border-bottom:1px solid #2a3040}main{padding:12px}section{background:#171a21;border:1px solid #2a3040;border-radius:10px;padding:12px}pre{white-space:pre-wrap;background:#0d1016;border:1px solid #2a3040;border-radius:10px;padding:10px;overflow:auto;max-height:760px}.ok{color:#9dffb4}.bad{color:#ff8b8b}a{color:#9db6ff}</style></head><body><header><h1>42ndMind Truth Ledger Preledger Stress Benchmark Test v0.1</h1><div>Tests hard preledger pressure cases without final truth promotion.</div></header><main><section><h2 id="summary">Running...</h2><div><a href="truth-ledger-preledger-stress-benchmark.html?v=prestress-1">truth ledger preledger stress benchmark page</a></div><pre id="out"></pre></section></main><script src="src/kernel-objective-claim-language-v0-1.js?v=claim-1"></script><script src="src/kernel-objective-claim-language-v0-1-1-patch.js?v=claim-2"></script><script src="src/kernel-external-anchor-packet-schema-v0-1.js?v=anchor-1"></script><script src="src/kernel-source-provenance-registry-v0-1.js?v=prov-1"></script><script src="src/kernel-evidence-media-registry-v0-1.js?v=evidence-1"></script><script src="src/kernel-truth-pressure-synthesis-v0-1.js?v=truth-1"></script><script src="src/kernel-truth-pressure-synthesis-v0-1-1-patch.js?v=truth-2"></script><script src="src/kernel-claim-narrative-benchmark-v0-1.js?v=bench-1"></script><script src="src/kernel-adversarial-narrative-pressure-v0-1.js?v=adv-1"></script><script src="src/kernel-real-world-packet-ingestion-discipline-v0-1.js?v=ingest-1"></script><script src="src/kernel-truth-ledger-preledger-v0-1.js?v=preledger-1"></script><script src="src/kernel-truth-ledger-preledger-stress-benchmark-v0-1.js?v=prestress-1"></script><script>const tests=[];let packet=null;function add(n,f){tests.push({name:n,fn:f})}function assert(c,m){if(!c)throw new Error(m)}function arr(v){return Array.isArray(v)?v:[]}function records(){return arr(packet&&packet.stress_records)}function validation(){return packet&&packet.validation||{}}function families(){return new Set(records().map(r=>r.family))}function allUnresolved(){return records().flatMap(r=>arr(r.unresolved_items))}function allGuards(){return records().flatMap(r=>Object.keys(r.active_guards||{}).filter(k=>r.active_guards[k]===true))}add('module loads and doctrine keeps stress benchmark non-authoritative',()=>{assert(window.KernelTruthLedgerPreledgerV01,'preledger missing');assert(window.KernelTruthLedgerPreledgerStressBenchmarkV01,'stress benchmark missing');assert(KernelTruthLedgerPreledgerStressBenchmarkV01.VERSION==='0.1.0','version wrong');const d=KernelTruthLedgerPreledgerStressBenchmarkV01.doctrine();assert(d.stress_benchmark_only_not_final_truth===true,'stress doctrine missing');assert(d.preledger_entries_remain_candidates===true,'candidate doctrine missing');assert(d.duplicate_provenance_is_not_independence===true,'duplicate doctrine missing');assert(d.user_confidence_is_not_evidence===true,'user confidence doctrine missing');assert(d.media_uncertainty_blocks_media_verification===true,'media uncertainty doctrine missing');assert(d.no_llm===true,'no LLM doctrine missing');assert(d.no_external_lookup===true,'no external lookup doctrine missing');assert(d.no_media_lookup===true,'no media lookup doctrine missing');assert(d.belief_movement==='none','belief movement wrong')});add('stress benchmark runs from truth-ledger preledger',()=>{packet=KernelTruthLedgerPreledgerStressBenchmarkV01.runStressBenchmark();assert(packet.ok===true,'packet not ok: '+JSON.stringify(validation()));assert(packet.source_preledger_ok===true,'source preledger not ok');assert(packet.source_preledger_version==='0.1.0','expected preledger v0.1.0');assert(packet.source_preledger_entry_count===8,'expected 8 source preledger entries');assert(packet.stress_record_count===16,'expected 16 stress records');assert(packet.stress_family_count===16,'expected 16 stress families');assert(packet.stress_benchmark_is_final_truth_authority===false,'stress benchmark became final authority');assert(packet.adjudicates_final_truth===false,'adjudicated final truth')});add('all sixteen stress families are represented',()=>{['direct_conflict','duplicate_provenance','adversarial_quantifier_injection','no_good_interpretation_framing','quote_clipping','context_stripping','media_metadata_missing','edited_media_risk','high_user_confidence','anonymous_claim_stack','causal_bridge_gap','motive_stuffing','counterevidence_pressure','independent_corroboration','ambiguity_weaponization','mixed_pressure_stack'].forEach(f=>assert(families().has(f),f+' missing'));assert(validation().checks.sixteen_stress_families===true,'family count check failed')});add('all expected stress responses match and postures remain non-truth',()=>{records().forEach(r=>{assert(r.expected_match===true,r.stress_id+' expected mismatch');assert(r.observed_response===r.expected_response,r.stress_id+' observed response mismatch');assert(r.stress_candidate_posture.includes('not_truth')||r.stress_candidate_posture.includes('not_resolved'),r.stress_id+' unsafe posture '+r.stress_candidate_posture);assert(r.truth_status==='not_adjudicated',r.stress_id+' truth adjudicated');assert(r.ledger_status==='stress_candidate_preledger_not_truth',r.stress_id+' unsafe ledger status')});assert(validation().checks.all_expected_responses_match===true,'expected response check failed');assert(validation().checks.all_postures_non_truth===true,'posture check failed')});add('conflict, duplicate, adversarial, media, and causal gaps remain visible',()=>{assert(allUnresolved().includes('stress_counter_or_contradiction_gap'),'conflict gap missing');assert(allUnresolved().includes('stress_source_independence_gap'),'source independence gap missing');assert(allUnresolved().includes('stress_adversarial_interpretation_gap'),'adversarial gap missing');assert(allUnresolved().includes('stress_media_verification_gap'),'media gap missing');assert(allUnresolved().includes('stress_causal_bridge_gap'),'causal gap missing');assert(validation().checks.conflict_visible_not_resolved===true,'conflict validation failed');assert(validation().checks.duplicate_provenance_visible===true,'duplicate validation failed');assert(validation().checks.adversarial_pressure_visible===true,'adversarial validation failed');assert(validation().checks.media_uncertainty_visible===true,'media validation failed');assert(validation().checks.causal_bridge_gap_visible===true,'causal validation failed')});add('special stress guards stay active',()=>{assert(allGuards().includes('corroboration_pressure_is_not_final_truth'),'corroboration guard missing');assert(allGuards().includes('user_confidence_is_not_evidence'),'user confidence guard missing');assert(allGuards().includes('duplicate_provenance_is_not_independence'),'duplicate guard missing');assert(allGuards().includes('counterevidence_is_not_disproof_by_itself'),'counterevidence guard missing');assert(allGuards().includes('motive_evidence_required_before_motive_truth'),'motive guard missing');assert(allGuards().includes('all_pressure_components_remain_separate'),'mixed pressure guard missing');assert(validation().checks.corroboration_not_final_truth===true,'corroboration validation failed');assert(validation().checks.user_confidence_not_evidence===true,'user confidence validation failed');assert(validation().checks.duplicate_not_independence===true,'duplicate validation failed')});add('rollback, revision trail, and no silent mutation are preserved',()=>{records().forEach(r=>{assert(r.rollback_available===true,r.stress_id+' rollback unavailable');assert(r.rollback_snapshot&&r.rollback_snapshot.source_preledger_entry,r.stress_id+' rollback preledger missing');assert(r.rollback_snapshot&&r.rollback_snapshot.stress_case,r.stress_id+' rollback stress case missing');assert(arr(r.revision_trail).length>=1,r.stress_id+' revision trail missing');assert(arr(r.revision_trail).every(v=>v.silent_mutation===false),r.stress_id+' silent mutation present')});assert(validation().checks.rollback_available_for_all===true,'rollback check failed');assert(validation().checks.revision_trail_present_for_all===true,'revision trail check failed');assert(validation().checks.no_silent_mutation===true,'silent mutation check failed')});add('no LLM, no lookup, candidate-only status, and belief movement are preserved',()=>{records().forEach(r=>{assert(r.llm_used===false,r.stress_id+' used LLM');assert(r.external_lookup_performed===false,r.stress_id+' performed external lookup');assert(r.media_lookup_performed===false,r.stress_id+' performed media lookup');assert(r.promotion_status==='not_promoted',r.stress_id+' promoted');assert(r.doctrine_status==='candidate_not_doctrine',r.stress_id+' doctrine status wrong');assert(r.belief_movement==='none',r.stress_id+' moved belief');assert(r.contradiction_resolution==='not_resolved',r.stress_id+' contradiction resolved')});assert(validation().checks.no_llm_used===true,'no LLM check failed');assert(validation().checks.no_external_or_media_lookup===true,'lookup check failed');assert(validation().checks.candidate_only_not_promoted===true,'candidate-only check failed');assert(validation().checks.belief_movement_none===true,'belief movement check failed');assert(arr(validation().errors).length===0,'validation errors present: '+validation().errors.join(','))});(async function run(){const results=[];for(const t of tests){try{await t.fn();results.push({name:t.name,passed:true})}catch(e){results.push({name:t.name,passed:false,error:e.message})}}const passed=results.filter(r=>r.passed).length;document.getElementById('summary').className=passed===tests.length?'ok':'bad';document.getElementById('summary').textContent=passed+'/'+tests.length+' passed';document.getElementById('out').textContent=JSON.stringify({packet_type:'42ndMind_truth_ledger_preledger_stress_benchmark_test_report_v0_1',ok:passed===tests.length,source_preledger_ok:packet&&packet.source_preledger_ok,source_preledger_version:packet&&packet.source_preledger_version,source_preledger_entry_count:packet&&packet.source_preledger_entry_count,stress_record_count:packet&&packet.stress_record_count,stress_family_count:packet&&packet.stress_family_count,family_counts:packet&&packet.family_counts,posture_counts:packet&&packet.posture_counts,records:records().map(r=>({stress_id:r.stress_id,family:r.family,pressure:r.pressure,expected_response:r.expected_response,observed_response:r.observed_response,stress_candidate_posture:r.stress_candidate_posture,linked_preledger_entry_id:r.linked_preledger_entry_id,unresolved_item_count:r.unresolved_items.length,rollback_available:r.rollback_available,truth_status:r.truth_status,ledger_status:r.ledger_status,promotion_status:r.promotion_status,belief_movement:r.belief_movement})),validation:validation(),results},null,2)})();</script></body></html>
