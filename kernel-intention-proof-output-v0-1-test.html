<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>42ndMind Intention Proof Output Test</title><style>body{margin:0;background:#0f1115;color:#eef2ff;font:14px ui-monospace,Menlo,Consolas,monospace}header{padding:16px;background:#11141b;border-bottom:1px solid #2a3040}main{padding:12px}section{background:#171a21;border:1px solid #2a3040;border-radius:10px;padding:12px}pre{white-space:pre-wrap;background:#0d1016;border:1px solid #2a3040;border-radius:10px;padding:10px;overflow:auto;max-height:760px}.ok{color:#9dffb4}.bad{color:#ff8b8b}a{color:#9db6ff}</style></head><body><header><h1>42ndMind Intention Proof Output Test</h1><div>Tests readable proof traces over the canonical formula ledger. Candidate only.</div></header><main><section><h2 id="summary">Running...</h2><div><a href="intention-proof-output.html?v=proof-1">proof output page</a></div><pre id="out"></pre></section></main><script src="src/kernel-intention-discovery-v0-1.js?v=intent-1"></script><script src="src/kernel-intention-refinement-v0-1.js?v=refine-1"></script><script src="src/kernel-intention-necessity-test-v0-1.js?v=necessity-1"></script><script src="src/kernel-intention-neighbor-lattice-v0-1.js?v=lattice-3"></script><script src="src/kernel-intention-lattice-invariance-benchmark-v0-1.js?v=invariance-2"></script><script src="src/kernel-intention-formula-compiler-v0-1.js?v=formula-1"></script><script src="src/kernel-intention-concept-expansion-loop-v0-1.js?v=expansion-2"></script><script src="src/kernel-intention-contradiction-refinement-loop-v0-1.js?v=contradiction-1"></script><script src="src/kernel-intention-formula-revision-engine-v0-1.js?v=revision-1"></script><script src="src/kernel-intention-canonical-formula-ledger-v0-1.js?v=ledger-1"></script><script src="src/kernel-intention-proof-output-v0-1.js?v=proof-1"></script><script>const tests=[];let packet=null;function add(n,f){tests.push({name:n,fn:f})}function assert(c,m){if(!c)throw new Error(m)}function arr(v){return Array.isArray(v)?v:[]}function proofs(){return arr(packet&&packet.proofs)}function steps(){return proofs().flatMap(p=>arr(p.proof_steps))}add('modules load and doctrine is proof-only',()=>{assert(window.KernelIntentionProofOutputV01,'proof output missing');assert(KernelIntentionProofOutputV01.VERSION==='0.1.0','version wrong');assert(typeof KernelIntentionProofOutputV01.runProofOutput==='function','runProofOutput missing');const d=KernelIntentionProofOutputV01.doctrine();assert(d.outputs_formula_proof_traces===true,'proof trace doctrine missing');assert(d.proof_output_is_candidate_trace_not_doctrine===true,'candidate trace guard missing');assert(d.proof_output_does_not_promote_versions===true,'promotion guard missing');assert(d.force_intensity_outside_shape==='F = M · i','force guard missing');assert(d.belief_movement==='none','belief movement wrong')});add('proof output runs from canonical ledger',()=>{packet=KernelIntentionProofOutputV01.runProofOutput();assert(packet.ok===true,'packet not ok: '+JSON.stringify(packet.validation));assert(packet.source_ledger_ok===true,'source ledger not ok');assert(packet.source_ledger_record_count===11,'expected 11 source ledger records');assert(packet.belief_movement==='none','packet moved belief')});add('eleven proof packets are produced',()=>{assert(packet.proof_count===11,'expected 11 proofs');assert(proofs().length===11,'expected 11 proof rows');assert(packet.validation.checks.eleven_proofs===true,'eleven proofs check failed')});add('all proofs have readable proof steps',()=>{assert(packet.proof_step_count>0,'missing packet proof steps');proofs().forEach(p=>{assert(p.proof_step_count>0,p.concept+' missing proof steps');assert(arr(p.proof_lines).length>0,p.concept+' missing proof lines');assert(p.proof_text&&p.proof_text.includes('Given:'),p.concept+' missing proof text Given');assert(p.proof_text.includes('Therefore:'),p.concept+' missing proof text Therefore')});steps().forEach(s=>{assert(s.observed_transition&&s.observed_transition.includes('->'),s.step_id+' missing transition');assert(s.conclusion&&s.conclusion.length>0,s.step_id+' missing conclusion');assert(s.belief_movement==='none',s.step_id+' moved belief')});assert(packet.validation.checks.all_proofs_have_steps===true,'all proofs have steps check failed')});add('all L1 totals remain 1',()=>{proofs().forEach(p=>assert(p.observed_l1_total===1,p.concept+' l1 wrong: '+p.observed_l1_total));assert(packet.validation.checks.all_l1_totals_equal_1===true,'packet l1 check failed')});add('force terms remain outside shape and equation is shown',()=>{proofs().forEach(p=>{assert(p.force_terms_outside_shape===true,p.concept+' force leaked into shape');assert(p.force_line&&p.force_line.includes('F_')&&p.force_line.includes('M_'),p.concept+' force equation missing')});assert(packet.validation.checks.force_terms_outside_shape===true,'packet force separation check failed')});add('candidate-only status and belief movement are preserved',()=>{proofs().forEach(p=>{assert(p.promotion_status==='not_promoted',p.concept+' promoted');assert(p.doctrine_status==='candidate_not_doctrine',p.concept+' doctrine status wrong');assert(p.belief_movement==='none',p.concept+' moved belief')});assert(packet.validation.checks.candidate_only_not_promoted===true,'candidate-only check failed');assert(packet.validation.checks.belief_movement_none===true,'belief movement check failed')});add('validation report is clean',()=>{assert(packet.validation&&packet.validation.ok===true,'validation not ok');assert(arr(packet.validation.errors).length===0,'validation errors present: '+packet.validation.errors.join(','));arr(packet.validation.proof_validations).forEach(v=>{assert(v.ok===true,v.concept+' validation failed: '+v.errors.join(','));assert(v.proof_step_count>0,v.concept+' validation missing steps');assert(v.observed_l1_total===1,v.concept+' validation l1 wrong');assert(v.force_terms_outside_shape===true,v.concept+' validation force wrong');assert(v.belief_movement==='none',v.concept+' validation moved belief')})});(async function run(){const results=[];for(const t of tests){try{await t.fn();results.push({name:t.name,passed:true})}catch(e){results.push({name:t.name,passed:false,error:e.message})}}const passed=results.filter(r=>r.passed).length;document.getElementById('summary').className=passed===tests.length?'ok':'bad';document.getElementById('summary').textContent=passed+'/'+tests.length+' passed';document.getElementById('out').textContent=JSON.stringify({packet_type:'42ndMind_intention_proof_output_test_report_v0_1',ok:passed===tests.length,source_ledger_record_count:packet&&packet.source_ledger_record_count,proof_count:packet&&packet.proof_count,proof_step_count:packet&&packet.proof_step_count,proofs:proofs().map(p=>({concept:p.concept,current_candidate_version:p.current_candidate_version,proof_step_count:p.proof_step_count,observed_l1_total:p.observed_l1_total,force_terms_outside_shape:p.force_terms_outside_shape,promotion_status:p.promotion_status,belief_movement:p.belief_movement})),validation:packet&&packet.validation,results},null,2)})();</script></body></html>
