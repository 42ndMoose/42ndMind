ess-benchmark-v0-1.js?v=prestress-1"></script><script src="src/kernel-world-model-relation-expansion-v0-1.js?v=wmrel-1"></script><script src="src/kernel-world-model-relation-stress-benchmark-v0-1.js?v=wmrelstress-1"></script><script src="src/kernel-world-model-relation-stress-benchmark-v0-1-1-patch.js?v=wmrelstress-2"></script><script src="src/kernel-coverage-expansion-library-v0-1.js?v=coverage-1"></script><script src="src/kernel-coverage-stress-benchmark-v0-1.js?v=coverstress-1"></script><script src="src/kernel-deterministic-packet-ingestion-form-v0-1.js?v=ingestform-1"></script><script src="src/kernel-dossier-to-packet-compiler-v0-1.js?v=dossierpack-1"></script><script src="src/kernel-ingestion-to-preledger-bridge-v0-1.js?v=prebridge-1"></script><script src="src/kernel-dossier-packet-stress-benchmark-v0-1.js?v=dossierstress-1"></script><script src="src/kernel-unified-runtime-receptor-registry-v0-1.js?v=runtime-1"></script><script src="src/kernel-raw-messy-language-intake-receptor-v0-1.js?v=rawintake-1"></script><script src="src/kernel-meaning-admission-self-expansion-loop-v0-1.js?v=selfexpand-1"></script><script>const tests=[];let packet=null;function add(n,f){tests.push({name:n,fn:f})}function assert(c,m){if(!c)throw new Error(m)}function arr(v){return Array.isArray(v)?v:[]}function proposals(){return arr(packet&&packet.expansion_proposals)}function validation(){return packet&&packet.validation||{}}function families(){return new Set(proposals().map(p=>p.proposal_family))}function unresolved(){return proposals().flatMap(p=>arr(p.unresolved_items))}function produced(){return proposals().flatMap(p=>arr(p.produced_subdivision_candidates))}add('module loads and doctrine keeps self-expansion candidate-only',()=>{assert(window.KernelRawMessyLanguageIntakeReceptorV01,'raw intake missing');assert(window.KernelMeaningAdmissionSelfExpansionLoopV01,'self-expansion missing');assert(KernelMeaningAdmissionSelfExpansionLoopV01.VERSION==='0.1.0','version wrong');const d=KernelMeaningAdmissionSelfExpansionLoopV01.doctrine();assert(d.meaning_admission_loop_is_candidate_self_expansion===true,'candidate self-expansion doctrine missing');assert(d.self_expansion_is_not_silent_self_rewrite===true,'no silent rewrite doctrine missing');assert(d.growth_means_subdivision_not_mass_inflation===true,'growth doctrine missing');assert(d.no_canonical_mutation===true,'canonical mutation doctrine missing');assert(d.epistemic_octahedron_maturity_guard_active===true,'EO maturity doctrine missing');assert(d.no_llm===true,'no LLM doctrine missing');assert(d.belief_movement==='none','belief movement wrong')});add('self-expansion loop runs from raw messy language intake',()=>{packet=KernelMeaningAdmissionSelfExpansionLoopV01.runMeaningAdmissionSelfExpansionLoop();assert(packet.ok===true,'packet not ok: '+JSON.stringify(validation()));assert(packet.source_raw_intake_ok===true,'source raw intake not ok');assert(packet.source_raw_intake_version==='0.1.0','source raw intake version wrong');assert(packet.source_raw_intake_record_count===5,'expected 5 source raw records');assert(packet.expansion_proposal_count===8,'expected 8 proposals');assert(packet.expansion_proposal_family_count===8,'expected 8 proposal families');assert(packet.canonical_mutation_performed===false,'canonical mutation performed');assert(packet.meaning_admission_loop_is_final_truth_authority===false,'became final authority')});add('all eight proposal families are represented',()=>{['typo_variant_subdivision','unknown_term_admission','idiom_metaphor_subdivision','belief_pressure_subdivision','source_evidence_media_separation','quote_reframe_scope_subdivision','causal_bridge_relation_subdivision','claim_scope_subdivision'].forEach(f=>assert(families().has(f),f+' missing'));assert(validation().checks.eight_expansion_proposals===true,'proposal count check failed');assert(validation().checks.all_required_proposal_families_present===true,'family check failed')});add('growth is subdivision, not mass inflation or canonical mutation',()=>{proposals().forEach(p=>{assert(p.proposal_status==='candidate_self_expansion_not_canonical',p.expansion_proposal_id+' proposal status wrong');assert(p.admission_status==='candidate_not_doctrine',p.expansion_proposal_id+' admission status wrong');assert(p.canonical_mutation_performed===false,p.expansion_proposal_id+' canonical mutation');assert(p.growth_mode==='subdivision_not_mass_inflation',p.expansion_proposal_id+' growth mode wrong');assert(p.exact_meaning_claimed===false,p.expansion_proposal_id+' exact meaning claimed');assert(arr(p.produced_subdivision_candidates).length>=1,p.expansion_proposal_id+' no subdivision candidates')});assert(produced().includes('orthographic_variant_candidate'),'orthographic subdivision missing');assert(produced().includes('bridge_requirement_candidate'),'bridge subdivision missing');assert(validation().checks.all_proposals_candidate_not_canonical===true,'candidate not canonical check failed');assert(validation().checks.growth_is_subdivision_not_mass_inflation===true,'growth check failed');assert(validation().checks.no_canonical_mutation===true,'canonical mutation check failed')});add('typo, unknown, idiom, belief, source/media/reframe/causal gaps remain visible',()=>{['typo_repair_is_candidate_not_certainty','unknown_meaning_requires_admission_no_fake_meaning','idiom_or_metaphor_requires_context','belief_statement_is_pressure_not_truth','source_reference_is_anchor_not_lookup','evidence_media_description_is_not_verification','hostile_reframe_is_pressure_not_same_claim','causal_bridge_required_before_causal_truth'].forEach(g=>assert(unresolved().includes(g),g+' missing'));assert(validation().checks.typo_unknown_idiom_admission_visible===true,'typo/unknown/idiom check failed');assert(validation().checks.belief_source_media_reframe_causal_gaps_visible===true,'gap visibility check failed')});add('admission requirements and maturity guards stay active',()=>{proposals().forEach(p=>{assert(arr(p.required_before_admission).includes('explicit_admission_review_required'),p.expansion_proposal_id+' admission review missing');assert(arr(p.required_before_admission).includes('no_silent_canonical_mutation'),p.expansion_proposal_id+' no silent mutation req missing');assert(p.active_guards&&p.active_guards.epistemic_octahedron_maturity_guard_active===true,p.expansion_proposal_id+' EO guard missing');assert(p.active_guards&&p.active_guards.maturity_is_integration_not_confidence===true,p.expansion_proposal_id+' maturity guard missing')});assert(validation().checks.admission_requirements_visible_for_all===true,'admission requirements check failed');assert(validation().checks.eo_maturity_guard_active_for_all===true,'EO maturity check failed')});add('rollback, revision trail, and no silent mutation are preserved',()=>{assert(packet.rollback_available===true,'packet rollback unavailable');assert(packet.rollback_snapshot&&packet.rollback_snapshot.source_raw_intake_summary,'packet rollback source missing');proposals().forEach(p=>{assert(p.rollback_available===true,p.expansion_proposal_id+' rollback unavailable');assert(p.rollback_snapshot,p.expansion_proposal_id+' rollback snapshot missing');assert(arr(p.revision_trail).length>=1,p.expansion_proposal_id+' revision trail missing');assert(arr(p.revision_trail).every(v=>v.silent_mutation===false&&v.canonical_mutation_performed===false),p.expansion_proposal_id+' mutation present')});assert(validation().checks.rollback_available_for_all===true,'rollback check failed');assert(validation().checks.no_silent_mutation===true,'silent mutation check failed')});add('no final truth, no LLM, no lookup, and belief movement are preserved',()=>{proposals().forEach(p=>{assert(p.truth_status==='not_adjudicated',p.expansion_proposal_id+' truth adjudicated');assert(p.final_authority===false,p.expansion_proposal_id+' final authority true');assert(p.adjudicates_final_truth===false,p.expansion_proposal_id+' adjudicates final truth');assert(p.llm_used===false,p.expansion_proposal_id+' LLM used');assert(p.external_lookup_performed===false,p.expansion_proposal_id+' external lookup performed');assert(p.media_lookup_performed===false,p.expansion_proposal_id+' media lookup performed');assert(p.promotion_status==='not_promoted',p.expansion_proposal_id+' promoted');assert(p.doctrine_status==='candidate_not_doctrine',p.expansion_proposal_id+' doctrine unsafe');assert(p.belief_movement==='none',p.expansion_proposal_id+' belief movement not none')});assert(validation().checks.no_truth_promotion===true,'truth promotion check failed');assert(validation().checks.no_llm_used===true,'no LLM check failed');assert(validation().checks.no_lookup_used===true,'lookup check failed');assert(validation().checks.final_authority_false===true,'final authority check failed');assert(validation().checks.belief_movement_none===true,'belief movement check failed');assert(arr(validation().errors).length===0,'validation errors present: '+validation().errors.join(','))});(async function run(){const results=[];for(const t of tests){try{await t.fn();results.push({name:t.name,passed:true})}catch(e){results.push({name:t.name,passed:false,error:e.message})}}const passed=results.filter(r=>r.passed).length;document.getElementById('summary').className=passed===tests.length?'ok':'bad';document.getElementById('summary').textContent=passed+'/'+tests.length+' passed';document.getElementById('out').textContent=JSON.stringify({packet_type:'42ndMind_meaning_admission_self_expansion_loop_test_report_v0_1',ok:passed===tests.length,source_raw_intake_ok:packet&&packet.source_raw_intake_ok,source_raw_intake_version:packet&&packet.source_raw_intake_version,source_raw_intake_record_count:packet&&packet.source_raw_intake_record_count,source_candidate_interpretation_count:packet&&packet.source_candidate_interpretation_count,source_candidate_packet_count:packet&&packet.source_candidate_packet_count,source_relation_candidate_count:packet&&packet.source_relation_candidate_count,source_typo_variant_hypothesis_count:packet&&packet.source_typo_variant_hypothesis_count,source_unknown_or_new_meaning_hypothesis_count:packet&&packet.source_unknown_or_new_meaning_hypothesis_count,expansion_proposal_count:packet&&packet.expansion_proposal_count,expansion_proposal_family_count:packet&&packet.expansion_proposal_family_count,proposal_family_counts:packet&&packet.proposal_family_counts,canonical_mutation_performed:packet&&packet.canonical_mutation_performed,proposals:proposals().map(p=>({expansion_proposal_id:p.expansion_proposal_id,proposal_family:p.proposal_family,produced_subdivision_candidates:p.produced_subdivision_candidates,admission_status:p.admission_status,proposal_status:p.proposal_status,canonical_mutation_performed:p.canonical_mutation_performed,growth_mode:p.growth_mode,truth_status:p.truth_status,promotion_status:p.promotion_status,belief_movement:p.belief_movement})),validation:validation(),results},null,2)})();</script></body></html>
