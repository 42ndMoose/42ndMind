<script src="src/kernel-semantic-law-invariance-tester-v0-1.js?v=0.1.0"></script>
<script>
  const tests = [];
  let fullPacket = null;
  function add(name, fn) { tests.push({ name, fn }); }
  function assert(cond, msg) { if (!cond) throw new Error(msg); }

  const strongLaw = {
    id:'law_reckless_accusation_fixture',
    primary_operator:'reckless_accusation',
    equation:'reckless_accusation := { accusation_pressure, direct_link_evidence_burden, evidence_gap_pressure, reputational_risk_pressure } -> evidence_burden -> blocked_belief_movement_until_legitimate',
    pressures:['accusation_pressure','direct_link_evidence_burden','evidence_gap_pressure','reputational_risk_pressure'],
    pressure_vector_l1_norm:4,
    observation_count:4,
    evidence_burden:['Identify direct evidence.'],
    legitimacy_guards:['Require direct evidence link.'],
    contrast_classes:['supported_accusation(claim)','false_accusation(claim)'],
    falsification_tests:['Find counterexample.','Find contrast collapse.','Run workbench validation.'],
    blocked_movement:'belief_movement_blocked_until_legitimacy_conditions_are_satisfied',
    allowed_movement:'none_from_language_alone',
    belief_movement:'none'
  };

  const weakLaw = {
    id:'law_weak_fixture',
    primary_operator:'weak_operator',
    equation:'weak_operator := { one_pressure } -> evidence_burden -> blocked_belief_movement_until_legitimate',
    pressures:['one_pressure'],
    pressure_vector_l1_norm:1,
    observation_count:1,
    evidence_burden:[],
    legitimacy_guards:[],
    contrast_classes:[],
    falsification_tests:[],
    blocked_movement:'belief_movement_blocked_until_legitimacy_conditions_are_satisfied',
    allowed_movement:'none_from_language_alone',
    belief_movement:'none'
  };

  add('modules load', () => {
    assert(window.KernelSemanticLawInvarianceTesterV01, 'law invariance tester missing');
    assert(window.KernelSemanticLawCandidateExtractorV01, 'law extractor missing');
    assert(KernelSemanticLawInvarianceTesterV01.VERSION === '0.1.0', 'tester version wrong');
  });

  add('doctrine preserves no belief movement', () => {
    const d = KernelSemanticLawInvarianceTesterV01.doctrine();
    assert(d.invariance_tests_grade_formal_readiness_not_truth === true, 'invariance doctrine missing');
    assert(d.objective_language_requires_repeatability_contrast_and_legitimacy_guards === true, 'objective-language doctrine missing');
    assert(d.tester_does_not_patch_source === true, 'patch doctrine missing');
    assert(d.belief_movement === 'none', 'belief movement doctrine wrong');
  });

  add('module availability reports law extractor', () => {
    const a = KernelSemanticLawInvarianceTesterV01.modulesAvailable();
    assert(a.law_extractor === true, 'law extractor unavailable');
  });

  add('movement and pressure-vector invariants work', () => {
    assert(KernelSemanticLawInvarianceTesterV01.movementInvariant(strongLaw) === true, 'movement invariant should pass');
    assert(KernelSemanticLawInvarianceTesterV01.pressureVectorTotal(strongLaw) === true, 'pressure vector total should pass');
    assert(KernelSemanticLawInvarianceTesterV01.pressureVectorTotal(Object.assign({}, strongLaw, { pressure_vector_l1_norm:3 })) === false, 'bad pressure norm should fail');
  });

  add('strong law grades as strong invariant candidate', () => {
    const scored = KernelSemanticLawInvarianceTesterV01.scoreLaw(strongLaw, { min_strong_observations:4 });
    assert(scored.readiness === 'strong_invariant_candidate', 'strong law readiness wrong: ' + scored.readiness);
    assert(scored.objective_language_status === 'candidate_objective_language_fragment', 'objective status wrong');
    assert(scored.missing_requirements.length === 0, 'strong law should have no missing requirements');
    assert(scored.belief_movement === 'none', 'scored law moved belief');
  });

  add('weak law does not grade as strong', () => {
    const scored = KernelSemanticLawInvarianceTesterV01.scoreLaw(weakLaw, { min_strong_observations:4 });
    assert(scored.readiness !== 'strong_invariant_candidate', 'weak law should not be strong');
    assert(scored.missing_requirements.includes('repeatability'), 'weak law should miss repeatability');
    assert(scored.objective_language_status === 'not_yet_objective_language', 'weak objective status wrong');
  });

  add('testLawReport ranks candidates and summarizes fragments', () => {
    const report = KernelSemanticLawInvarianceTesterV01.testLawReport({ packet_type:'fixture_law_report', law_candidates:[weakLaw, strongLaw], contrast_boundaries:[{}], summary:{ contrast_boundary_count:1, accepted_rows:4, contested_rows:1 } }, { min_strong_observations:4 });
    assert(report.packet_type === '42ndMind_semantic_law_invariance_report_v0_1', 'wrong report packet');
    assert(report.summary.law_candidate_count === 2, 'candidate count wrong');
    assert(report.summary.strong_invariant_candidate_count === 1, 'strong count wrong');
    assert(report.summary.objective_language_fragment_count === 1, 'fragment count wrong');
    assert(report.ranked_invariance_tests[0].readiness === 'strong_invariant_candidate', 'ranking wrong');
    assert(report.belief_movement === 'none', 'report moved belief');
  });

  add('loadExtractAndTest runs current full path', async () => {
    fullPacket = await KernelSemanticLawInvarianceTesterV01.loadExtractAndTest({ min_template_observations:2, min_observations:2, limit:10, sentences_per_template:4, allowed_extra_pressures:0, min_strong_observations:4 });
    assert(fullPacket.ok === true, 'full invariance packet not ok');
    assert(fullPacket.invariance_report.summary.law_candidate_count >= 1, 'expected law candidates');
    assert(fullPacket.invariance_report.ranked_invariance_tests.length === fullPacket.invariance_report.summary.law_candidate_count, 'ranked count mismatch');
    assert(fullPacket.belief_movement === 'none', 'full packet moved belief');
  });

  (async function run(){
    const results = [];
    for (const t of tests) {
      try { await t.fn(); results.push({ name:t.name, passed:true }); }
      catch(e) { results.push({ name:t.name, passed:false, error:e.message }); }
    }
    const passed = results.filter(r => r.passed).length;
    document.getElementById('summary').className = passed === results.length ? 'ok' : 'bad';
    document.getElementById('summary').textContent = `${passed}/${results.length} passed`;
    document.getElementById('out').textContent = JSON.stringify({
      packet_type:'42ndMind_semantic_law_invariance_tester_v0_1_test_report',
      full_invariance_summary: fullPacket && fullPacket.summary,
      results
    }, null, 2);
  })();
</script>
