<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>42ndMind Intention Lattice Invariance</title><style>body{margin:0;background:#0f1115;color:#eef2ff;font:14px ui-monospace,Menlo,Consolas,monospace}header{padding:16px 18px;background:#11141b;border-bottom:1px solid #2a3040}main{padding:12px;display:grid;grid-template-columns:420px 1fr;gap:12px}section{background:#171a21;border:1px solid #2a3040;border-radius:10px;padding:12px}button{background:#25345c;color:#eef2ff;border:1px solid #3f5592;padding:8px 10px;border-radius:8px;cursor:pointer;margin:3px 3px 8px 0}pre{white-space:pre-wrap;background:#0d1016;border:1px solid #2a3040;border-radius:10px;padding:10px;overflow:auto;max-height:760px}.ok{color:#9dffb4}.bad{color:#ff8b8b}.muted{color:#8b93a7}a{color:#9db6ff}.card{background:#10131a;border:1px solid #2a3040;border-radius:10px;padding:10px;margin:10px 0}.case{border-top:1px solid #252b3a;padding:7px 0}.pill{display:inline-block;border:1px solid #2a3040;border-radius:999px;padding:1px 7px;margin:2px}.pass{color:#9dffb4}.fail{color:#ff8b8b}@media(max-width:900px){main{grid-template-columns:1fr}}</style></head><body><header><h1>42ndMind Intention Lattice Invariance</h1><div class="muted">Tests whether candidate intention-neighbor relations survive paraphrase, translation-like labels, role renaming, and force changes.</div></header><main><section><a href="index.html">main</a> · <a href="intention-neighbor-lattice.html?v=lattice-2">lattice</a> · <a href="kernel-intention-lattice-invariance-benchmark-v0-1-test.html?v=invariance-2">test</a><p>Decision: <b id="decisionMetric">not run</b></p><p>Cases: <b id="caseMetric">0</b></p><p>Passed: <b id="passedMetric">0</b></p><button onclick="runBenchmark()">Run benchmark</button><button onclick="showPacket()">Show packet</button><button onclick="showSummary()">Show summary</button><button onclick="copyOutput()">Copy output</button><div id="cards"></div></section><section><h2>Output</h2><pre id="out">No output yet.</pre></section></main><script src="src/kernel-intention-discovery-v0-1.js?v=intent-1"></script><script src="src/kernel-intention-refinement-v0-1.js?v=refine-1"></script><script src="src/kernel-intention-necessity-test-v0-1.js?v=necessity-1"></script><script src="src/kernel-intention-neighbor-lattice-v0-1.js?v=lattice-2"></script><script src="src/kernel-intention-lattice-invariance-benchmark-v0-1.js?v=invariance-2"></script><script>let packet=null,last='';function esc(v){return String(v??'').replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]))}function setOut(v){last=typeof v==='string'?v:JSON.stringify(v,null,2);document.getElementById('out').textContent=last}function runBenchmark(){const decisionEl=document.getElementById('decisionMetric');try{packet=KernelIntentionLatticeInvarianceBenchmarkV01.runBenchmark();decisionEl.textContent=packet.ok?'INVARIANCE_READY':'HELD';decisionEl.className=packet.ok?'ok':'bad';document.getElementById('caseMetric').textContent=packet.case_count;document.getElementById('passedMetric').textContent=packet.passed_case_count;renderCards();showSummary()}catch(e){decisionEl.textContent='ERROR';decisionEl.className='bad';setOut({ok:false,error:e.message,belief_movement:'none'})}}function renderCards(){document.getElementById('cards').innerHTML=`<div class="card"><h3>Force invariance</h3><p><span class="pill ${packet.force_invariance.ok?'pass':'fail'}">${packet.force_invariance.ok?'pass':'fail'}</span><span class="pill">M: ${packet.force_invariance.tested_force_scalars.join(', ')}</span></p><p class="muted">Force scalar changes intensity only; lattice identity should remain unchanged.</p></div>`+(packet.case_results||[]).map(r=>`<div class="card"><h3>${esc(r.id)}</h3><p><span class="pill ${r.ok?'pass':'fail'}">${r.ok?'pass':'fail'}</span><span class="pill">${esc(r.case_type)}</span></p><div class="case"><b>alias</b><br>${esc(r.concept_alias)} · ${esc(r.dimension_alias)} · ${esc(r.neighbor_alias)}</div><div class="case"><b>canonical</b><br>${esc(r.canonical.concept)} - ${esc(r.canonical.dimension)} -> ${esc(r.canonical.neighbor)}</div><p class="muted">relation exists: ${esc(r.relation_exists)}</p></div>`).join('')}function summary(){return{packet_type:'42ndMind_intention_lattice_invariance_summary_view_v0_1',ok:packet&&packet.ok,case_count:packet&&packet.case_count,passed_case_count:packet&&packet.passed_case_count,force_invariance:packet&&packet.force_invariance,case_results:packet&&packet.case_results,validation:packet&&packet.validation,belief_movement:'none'}}function showSummary(){if(!packet)return runBenchmark();setOut(summary())}function showPacket(){if(!packet)return runBenchmark();setOut(packet)}async function copyOutput(){try{await navigator.clipboard.writeText(last);document.getElementById('out').textContent='Copied.\n\n'+last}catch(e){}}runBenchmark();</script></body></html>
