<script>
  const tests = [];
  let packet = null;
  function add(name, fn){ tests.push({ name, fn }); }
  function assert(cond, msg){ if(!cond) throw new Error(msg); }
  function asArray(v){ return Array.isArray(v) ? v : []; }
  function vectorsByOperator(report, name){ return asArray(report && report.canonical_vectors).filter(v => v.source_operator_metadata === name); }
  function classOperators(report, cls){
    const map = {};
    asArray(report && report.canonical_vectors).forEach(v => { map[v.canonical_vector_id] = v.source_operator_metadata; });
    return asArray(cls && cls.member_vector_ids).map(id => map[id]).filter(Boolean);
  }
  function hasEquivalenceClassContaining(report, a, b){
    return asArray(report && report.equivalence_classes).some(cls => {
      const ops = classOperators(report, cls);
      return ops.includes(a) && ops.includes(b);
    });
  }
  add('modules load refined law extractor patch', () => {
    assert(window.KernelSemanticLawCandidateExtractorV01, 'law extractor missing');
    assert(window.KernelSemanticLawInvarianceTesterV01, 'law invariance tester missing');
    assert(window.KernelSemanticCanonicalVectorBasisV01, 'canonical vector basis missing');
    assert(KernelSemanticLawCandidateExtractorV01.VERSION === '0.1.1', 'law extractor patch not loaded');
  });
  add('load extract and canonicalize succeeds', async () => {
    packet = await KernelSemanticCanonicalVectorBasisV01.loadExtractAndCanonicalize({ min_template_observations:2, min_observations:2, limit:10, sentences_per_template:4, allowed_extra_pressures:0, min_strong_observations:4 });
    assert(packet.ok === true, 'canonical packet not ok');
    assert(packet.basis_report.belief_movement === 'none', 'basis report moved belief');
    assert(packet.belief_movement === 'none', 'packet moved belief');
  });
  add('basis refinement laws are imported', () => {
    const s = packet.basis_report.source_law_summary || {};
    assert(s.basis_refinement_entry_count === 12, 'expected 12 basis-refinement entries');
    assert(s.basis_refinement_law_count >= 8, 'expected basis-refinement laws');
    assert(s.suppressed_collapsed_law_count >= 4, 'expected old collapsed laws to be suppressed');
    assert(packet.basis_report.summary.law_candidate_count > 8, 'law candidate count did not grow');
  });
  add('expert and settled are no longer equivalent', () => {
    const report = packet.basis_report;
    const expert = vectorsByOperator(report, 'expert');
    const settled = vectorsByOperator(report, 'settled');
    assert(expert.length >= 1, 'expert vector missing');
    assert(settled.length >= 1, 'settled vector missing');
    assert(!hasEquivalenceClassContaining(report, 'expert', 'settled'), 'expert and settled still share an equivalence class');
    assert(expert.some(v => !settled.some(s => s.canonical_signature === v.canonical_signature)), 'expert signatures still fully collapse into settled');
  });
  add('collusion and coordinated are no longer equivalent', () => {
    const report = packet.basis_report;
    const collusion = vectorsByOperator(report, 'collusion');
    const coordinated = vectorsByOperator(report, 'coordinated');
    assert(collusion.length >= 1, 'collusion vector missing');
    assert(coordinated.length >= 1, 'coordinated vector missing');
    assert(!hasEquivalenceClassContaining(report, 'collusion', 'coordinated'), 'collusion and coordinated still share an equivalence class');
    assert(collusion.some(v => asArray(v.local_pressure_metadata).includes('covert_agreement_pressure')), 'collusion lacks covert_agreement_pressure metadata');
  });
  add('unit-total doctrine and no belief movement preserved', () => {
    assert(packet.basis_report.doctrine.basis_extractor_does_not_move_belief === true, 'basis no-movement doctrine missing');
    assert(packet.invariance_packet.law_packet.law_report.doctrine.basis_refinement_seeds_can_generate_reviewable_law_candidates === true, 'law patch doctrine missing');
    assert(packet.summary.belief_movement === 'none', 'summary moved belief');
  });
  (async function run(){
    const results = [];
    for (const t of tests) {
      try { await t.fn(); results.push({ name:t.name, passed:true }); }
      catch(e) { results.push({ name:t.name, passed:false, error:e.message }); }
    }
    const passed = results.filter(r => r.passed).length;
    document.getElementById('summary').className = passed === results.length ? 'ok' : 'bad';
    document.getElementById('summary').textContent = `${passed}/${results.length} passed`;
    const report = packet && packet.basis_report;
    document.getElementById('out').textContent = JSON.stringify({
      packet_type:'42ndMind_semantic_canonical_vector_basis_refined_v0_1_test_report',
      basis_summary: report && report.summary,
      law_summary: report && report.source_law_summary,
      equivalence_classes: report && report.equivalence_classes,
      results
    }, null, 2);
  })();
