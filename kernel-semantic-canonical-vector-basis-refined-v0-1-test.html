<script>
  const tests=[]; let packet=null;
  function add(name,fn){tests.push({name,fn});} function assert(cond,msg){if(!cond)throw new Error(msg);} function asArray(v){return Array.isArray(v)?v:[];}
  function vectorsByOperator(report,name){return asArray(report&&report.canonical_vectors).filter(v=>v.source_operator_metadata===name);}
  function classOperators(report,cls){const map={};asArray(report&&report.canonical_vectors).forEach(v=>{map[v.canonical_vector_id]=v.source_operator_metadata;});return asArray(cls&&cls.member_vector_ids).map(id=>map[id]).filter(Boolean);}
  function hasEquivalenceClassContaining(report,a,b){return asArray(report&&report.equivalence_classes).some(cls=>{const ops=classOperators(report,cls);return ops.includes(a)&&ops.includes(b);});}
  function assertSplit(report,a,b){assert(vectorsByOperator(report,a).length>=1,a+' vector missing');assert(vectorsByOperator(report,b).length>=1,b+' vector missing');assert(!hasEquivalenceClassContaining(report,a,b),a+'/'+b+' still share an equivalence class');}
  function operatorSet(report){return new Set(asArray(report&&report.canonical_vectors).map(v=>v.source_operator_metadata));}
  add('modules load refined law extractor patch',()=>{assert(window.KernelSemanticLawCandidateExtractorV01,'law extractor missing');assert(window.KernelSemanticLawInvarianceTesterV01,'law invariance tester missing');assert(window.KernelSemanticCanonicalVectorBasisV01,'canonical vector basis missing');assert(KernelSemanticLawCandidateExtractorV01.VERSION==='0.1.1','law extractor patch not loaded');});
  add('load extract and canonicalize succeeds',async()=>{packet=await KernelSemanticCanonicalVectorBasisV01.loadExtractAndCanonicalize({min_template_observations:2,min_observations:2,limit:10,sentences_per_template:4,allowed_extra_pressures:0,min_strong_observations:4});assert(packet.ok===true,'canonical packet not ok');assert(packet.basis_report.belief_movement==='none','basis report moved belief');assert(packet.belief_movement==='none','packet moved belief');});
  add('basis refinement laws are imported and collapsed laws suppressed',()=>{const s=packet.basis_report.source_law_summary||{};assert(s.basis_refinement_entry_count>=23,'expected at least 23 basis-refinement entries');assert(s.basis_refinement_law_count>=20,'expected status and unit-total refined basis laws');assert(s.raw_basis_refinement_law_count>=23,'expected raw refined laws');assert(s.suppressed_collapsed_law_count>=7,'expected old collapsed laws to be suppressed');assert(s.suppressed_collapsed_basis_law_count>=3,'expected collapsed status-role basis laws to be suppressed');assert(packet.basis_report.summary.law_candidate_count>=23,'law candidate count did not grow');});
  add('source-status and coordination splits remain split',()=>{const report=packet.basis_report;assertSplit(report,'expert','settled');assertSplit(report,'collusion','coordinated');});
  add('status-negation splits are now split',()=>{const report=packet.basis_report;assertSplit(report,'unresolved','not_settled');assertSplit(report,'unresolved','not_collusion');assertSplit(report,'not_settled','not_collusion');});
  add('unit-total shape bridge operators are present in canonical basis',()=>{const ops=operatorSet(packet.basis_report);['unit_total_shape_projection','anonymous_shape_invariance','anonymous_shape_repetition','force_shape_separation'].forEach(op=>assert(ops.has(op),'missing canonical operator '+op));});
  add('new status pressures are visible as metadata',()=>{const report=packet.basis_report;assert(vectorsByOperator(report,'unresolved').some(v=>asArray(v.local_pressure_metadata).includes('general_unresolved_status_pressure')),'unresolved lacks general status pressure');assert(vectorsByOperator(report,'not_settled').some(v=>asArray(v.local_pressure_metadata).includes('claim_nonclosure_status_pressure')),'not_settled lacks claim nonclosure pressure');assert(vectorsByOperator(report,'not_collusion').some(v=>asArray(v.local_pressure_metadata).includes('negated_collusion_status_pressure')),'not_collusion lacks negated collusion pressure');});
  add('unit-total doctrine and no belief movement preserved',()=>{assert(packet.basis_report.doctrine.basis_extractor_does_not_move_belief===true,'basis no-movement doctrine missing');assert(packet.invariance_packet.law_packet.law_report.doctrine.basis_refinement_seeds_can_generate_reviewable_law_candidates===true,'law patch doctrine missing');assert(packet.summary.belief_movement==='none','summary moved belief');});
  (async function run(){const results=[];for(const t of tests){try{await t.fn();results.push({name:t.name,passed:true});}catch(e){results.push({name:t.name,passed:false,error:e.message});}}const passed=results.filter(r=>r.passed).length;document.getElementById('summary').className=passed===results.length?'ok':'bad';document.getElementById('summary').textContent=`${passed}/${results.length} passed`;const report=packet&&packet.basis_report;document.getElementById('out').textContent=JSON.stringify({packet_type:'42ndMind_semantic_canonical_vector_basis_refined_v0_1_test_report',basis_summary:report&&report.summary,law_summary:report&&report.source_law_summary,equivalence_classes:report&&report.equivalence_classes,results},null,2);})();
