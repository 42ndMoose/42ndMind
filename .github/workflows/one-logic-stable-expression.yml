name: 42ndMind One Logic Stable Expression

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/live-self-dynamics-core-v0-1.js'
      - 'src/recursive-unit-brain-core-v0-1.js'
      - 'src/objective-reality-contact-gate-v0-1.js'
      - 'src/proof-obligation-engine-v0-1.js'
      - 'tests/live-self-dynamics-core-v0-1-test.js'
      - 'tests/recursive-unit-brain-core-v0-1-test.js'
      - 'tests/objective-reality-contact-gate-v0-1-test.js'
      - 'tests/proof-obligation-engine-v0-1-test.js'
      - 'scripts/run-diagnostic-probe-v0-1.js'
      - 'scripts/run-one-logic-stable-expression-v0-1.js'
      - 'scripts/run-one-logic-source-promotion-gate-v0-1.js'
      - 'scripts/verify-stable-expression-freshness-v0-1.js'
      - 'scripts/apply-live-self-pressure-differentiation-v0-1.js'
      - 'scripts/apply-live-self-reality-gate-v0-1.js'
      - '.github/workflows/one-logic-stable-expression.yml'

concurrency:
  group: 42ndmind-one-logic-stable-expression
  cancel-in-progress: false

jobs:
  one-logic-stable-expression:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare artifacts directory
        run: mkdir -p artifacts

      - name: Apply causal pressure differentiation
        run: node scripts/apply-live-self-pressure-differentiation-v0-1.js

      - name: Apply objective reality gate
        run: node scripts/apply-live-self-reality-gate-v0-1.js

      - name: Run proof obligation engine proof
        run: node tests/proof-obligation-engine-v0-1-test.js

      - name: Run recursive unit brain math proof
        run: node tests/recursive-unit-brain-core-v0-1-test.js

      - name: Run adversarial reality contact proof
        run: node tests/objective-reality-contact-gate-v0-1-test.js

      - name: Run live self dynamics proof
        run: node tests/live-self-dynamics-core-v0-1-test.js

      - name: Run stable expression and publish reusable state
        run: node scripts/run-one-logic-stable-expression-v0-1.js > artifacts/one-logic-stable-expression-console-v0-1.txt 2>&1

      - name: Run source promotion gate
        run: |
          set +e
          node scripts/run-one-logic-source-promotion-gate-v0-1.js > artifacts/one-logic-source-promotion-console-v0-1.txt 2>&1
          status=$?
          cat artifacts/one-logic-source-promotion-console-v0-1.txt
          exit $status

      - name: Verify current-body stable expression artifacts
        run: node scripts/verify-stable-expression-freshness-v0-1.js

      - name: Run diagnostic probe
        run: node scripts/run-diagnostic-probe-v0-1.js > artifacts/diagnostic-probe-console-v0-1.txt 2>&1

      - name: Publish stable expression artifacts
        run: |
          set -euo pipefail
          branch="${GITHUB_REF_NAME:-main}"
          git config user.name "42ndMind Bot"
          git config user.email "actions@github.com"
          git status --short
          git pull --rebase --autostash origin "$branch"
          git add src/live-self-dynamics-core-v0-1.js src/recursive-unit-brain-core-v0-1.js src/objective-reality-contact-gate-v0-1.js src/proof-obligation-engine-v0-1.js tests/live-self-dynamics-core-v0-1-test.js tests/recursive-unit-brain-core-v0-1-test.js tests/objective-reality-contact-gate-v0-1-test.js tests/proof-obligation-engine-v0-1-test.js scripts/apply-live-self-pressure-differentiation-v0-1.js scripts/apply-live-self-reality-gate-v0-1.js scripts/run-one-logic-stable-expression-v0-1.js scripts/run-one-logic-source-promotion-gate-v0-1.js scripts/verify-stable-expression-freshness-v0-1.js artifacts/latest-one-logic-stable-state-v0-1.json artifacts/latest-one-logic-stable-expression-v0-1.json artifacts/latest-one-logic-stable-expression-summary-v0-1.json artifacts/latest-recursive-unit-brain-projection-v0-1.json artifacts/latest-one-logic-source-promotion-proposal-v0-1.json artifacts/stable-expression-freshness-check-v0-1.json artifacts/one-logic-stable-expression-console-v0-1.txt artifacts/one-logic-source-promotion-console-v0-1.txt artifacts/diagnostic-probe-summary-v0-1.json artifacts/diagnostic-probe-console-v0-1.txt
          if git diff --cached --quiet; then
            echo "No stable-expression artifact changes to publish."
            exit 0
          fi
          git commit -m "Update obligation-gated one logic [skip ci]"
          for attempt in 1 2 3; do
            if git push origin "HEAD:$branch"; then
              echo "Published stable-expression artifacts on attempt $attempt."
              exit 0
            fi
            echo "Artifact push failed on attempt $attempt; rebasing and retrying."
            git pull --rebase --autostash origin "$branch"
            sleep 5
          done
          echo "Artifact push failed after retries."
          exit 1

      - name: Upload stable expression artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-logic-stable-expression-v0-1
          path: |
            artifacts/latest-one-logic-stable-state-v0-1.json
            artifacts/latest-one-logic-stable-expression-v0-1.json
            artifacts/latest-one-logic-stable-expression-summary-v0-1.json
            artifacts/latest-recursive-unit-brain-projection-v0-1.json
            artifacts/latest-one-logic-source-promotion-proposal-v0-1.json
            artifacts/stable-expression-freshness-check-v0-1.json
            artifacts/one-logic-stable-expression-console-v0-1.txt
            artifacts/one-logic-source-promotion-console-v0-1.txt
            artifacts/diagnostic-probe-summary-v0-1.json
            artifacts/diagnostic-probe-console-v0-1.txt
