name: 42ndMind Self-Edit Loop

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/self-edit-loop.yml'

jobs:
  self-edit-loop:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply closure frontier synthesis
        run: node scripts/apply-closure-frontier-synthesis-v0-1.js

      - name: Apply broader closure synthesis
        run: node scripts/apply-broader-closure-synthesis-v0-1.js

      - name: Apply operator anatomy synthesis
        run: node scripts/apply-operator-anatomy-synthesis-v0-1.js

      - name: Apply proof operator synthesis
        run: node scripts/apply-proof-operator-synthesis-v0-1.js

      - name: Apply parser-aware synthesis
        run: node scripts/apply-parser-aware-synthesis-v0-1.js

      - name: Apply parser-aware synthesis v0.2
        run: node scripts/apply-parser-aware-synthesis-v0-2.js

      - name: Apply report consistency gate
        run: node scripts/apply-report-consistency-gate-v0-1.js

      - name: Apply epistemic octahedron core gate
        run: node scripts/apply-epistemic-octahedron-core-gate-v0-1.js

      - name: Apply epistemic state field
        run: node scripts/apply-epistemic-state-field-v0-1.js

      - name: Apply epistemic transition field runner
        run: node scripts/apply-epistemic-transition-field-runner-v0-1.js

      - name: Apply math AST parser bridge
        run: node scripts/apply-math-ast-parser-bridge-v0-1.js

      - name: Apply math AST anatomy bridge
        run: node scripts/apply-math-ast-anatomy-bridge-v0-1.js

      - name: Apply proof operator anatomy
        run: node scripts/apply-proof-operator-anatomy-v0-1.js

      - name: Apply operator anatomy frontier
        run: node scripts/apply-operator-anatomy-frontier-v0-1.js

      - name: Apply accepted closure frontier parser candidate
        run: node scripts/apply-accepted-closure-frontier-parser-candidate-v0-1.js

      - name: Apply self-edit parser export fallback
        run: node scripts/apply-self-edit-parser-export-fallback-v0-1.js

      - name: Run core tests and capture status
        run: |
          set +e
          mkdir -p artifacts
          : > artifacts/core-test-log-v0-1.txt
          status=0
          for test in \
            tests/math-ast-core-v0-1-test.js \
            tests/math-ast-bridge-v0-1-test.js \
            tests/proof-calculus-core-v0-1-test.js \
            tests/math-closure-engine-v0-1-test.js \
            tests/math-language-completion-v0-1-test.js \
            tests/math-language-kernel-v0-1-test.js \
            tests/completion-scopes-v0-1-test.js \
            tests/completion-edge-scopes-v0-1-test.js \
            tests/completion-frontier-scopes-v0-1-test.js \
            tests/compiler-to-kernel-v0-1-test.js \
            tests/raw-to-kernel-v0-1-test.js \
            tests/claim-memory-v0-1-test.js \
            tests/stance-ambiguity-v0-1-test.js \
            tests/formal-math-v0-1-test.js \
            tests/discovery-core-v0-1-test.js \
            tests/source-sandbox-v0-1-test.js \
            tests/mathematical-patch-proposer-v0-1-test.js \
            tests/operator-synthesis-core-v0-1-test.js \
            tests/self-edit-loop-v0-1-test.js \
            tests/self-edit-parser-export-fallback-v0-1-test.cjs \
            tests/intention-algebra-v0-1-test.js \
            tests/language-parser-v0-1-test.js \
            tests/nested-relation-core-v0-1-test.js \
            tests/language-v0-1-conformance-test.js \
            tests/truth-accounting-core-v0-1-test.js
          do
            echo "## $test" | tee -a artifacts/core-test-log-v0-1.txt
            node "$test" >> artifacts/core-test-log-v0-1.txt 2>&1
            code=$?
            echo "exit_code=$code" | tee -a artifacts/core-test-log-v0-1.txt
            if [ "$code" -ne 0 ]; then status=$code; fi
          done
          printf '{\n  "core_tests_exit_code": %s,\n  "ok": %s\n}\n' "$status" "$([ "$status" -eq 0 ] && echo true || echo false)" > artifacts/core-test-status-v0-1.json
          echo "CORE_TEST_STATUS=$status" >> "$GITHUB_ENV"

      - name: Run whole-language self-edit loop and capture status
        run: |
          set +e
          node scripts/run-self-edit-loop-v0-1.js > artifacts/self-edit-loop-console-v0-1.txt 2>&1
          code=$?
          printf '{\n  "self_edit_exit_code": %s,\n  "ok": %s\n}\n' "$code" "$([ "$code" -eq 0 ] && echo true || echo false)" > artifacts/self-edit-loop-status-v0-1.json
          echo "SELF_EDIT_STATUS=$code" >> "$GITHUB_ENV"

      - name: Promote safe reactive candidate
        run: node scripts/promote-safe-reactive-candidate-v0-1.js

      - name: Rerun self-edit loop after promotion
        run: |
          set +e
          node scripts/run-self-edit-loop-v0-1.js > artifacts/self-edit-loop-console-post-promotion-v0-1.txt 2>&1
          code=$?
          printf '{\n  "self_edit_post_promotion_exit_code": %s,\n  "ok": %s\n}\n' "$code" "$([ "$code" -eq 0 ] && echo true || echo false)" > artifacts/self-edit-loop-post-promotion-status-v0-1.json
          echo "SELF_EDIT_POST_PROMOTION_STATUS=$code" >> "$GITHUB_ENV"

      - name: Run growth probe and capture status
        run: |
          set +e
          node scripts/run-growth-probe-v0-1.js > artifacts/growth-probe-console-v0-1.txt 2>&1
          code=$?
          printf '{\n  "growth_probe_exit_code": %s,\n  "ok": %s\n}\n' "$code" "$([ "$code" -eq 0 ] && echo true || echo false)" > artifacts/growth-probe-status-v0-1.json
          echo "GROWTH_PROBE_STATUS=$code" >> "$GITHUB_ENV"

      - name: Run diagnostic probe and capture status
        run: |
          set +e
          node scripts/run-diagnostic-probe-v0-1.js > artifacts/diagnostic-probe-console-v0-1.txt 2>&1
          code=$?
          printf '{\n  "diagnostic_probe_exit_code": %s,\n  "ok": %s\n}\n' "$code" "$([ "$code" -eq 0 ] && echo true || echo false)" > artifacts/diagnostic-probe-status-v0-1.json
          echo "DIAGNOSTIC_PROBE_STATUS=$code" >> "$GITHUB_ENV"

      - name: Ensure report placeholders exist
        run: |
          mkdir -p artifacts
          for file in self-edit-loop-report-v0-1.json self-edit-loop-summary-v0-1.json reactive-self-edit-report-v0-1.json reactive-self-edit-summary-v0-1.json growth-probe-report-v0-1.json growth-probe-summary-v0-1.json diagnostic-probe-report-v0-1.json diagnostic-probe-summary-v0-1.json reactive-promotion-status-v0-1.json self-edit-loop-post-promotion-status-v0-1.json
          do
            if [ ! -f "artifacts/$file" ]; then
              printf '{\n  "missing": true,\n  "file": "%s"\n}\n' "$file" > "artifacts/$file"
            fi
          done

      - name: Print self-edit summary
        run: |
          echo "## 42ndMind Core Test Status" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat artifacts/core-test-status-v0-1.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "## 42ndMind Self-Edit Loop Summary" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat artifacts/self-edit-loop-summary-v0-1.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "## 42ndMind Reactive Self-Edit Summary" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat artifacts/reactive-self-edit-summary-v0-1.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "## 42ndMind Reactive Promotion Status" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat artifacts/reactive-promotion-status-v0-1.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "## 42ndMind Growth Probe Summary" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat artifacts/growth-probe-summary-v0-1.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "## 42ndMind Diagnostic Probe Summary" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat artifacts/diagnostic-probe-summary-v0-1.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Publish latest report into repository
        run: |
          mkdir -p artifacts
          git config user.name "42ndMind Bot"
          git config user.email "actions@github.com"
          git add scripts/run-self-edit-loop-v0-1.js scripts/apply-self-edit-parser-export-fallback-v0-1.js src/self-edit-loop-v0-1.js src/language-parser-v0-1.js src/operator-anatomy-v0-1.js src/epistemic-octahedron-core-v0-1.js src/math-ast-core-v0-1.js src/proof-calculus-core-v0-1.js src/math-closure-engine-v0-1.js tests/math-ast-core-v0-1-test.js tests/math-ast-bridge-v0-1-test.js tests/proof-calculus-core-v0-1-test.js tests/math-closure-engine-v0-1-test.js tests/math-language-completion-v0-1-test.js tests/self-edit-parser-export-fallback-v0-1-test.cjs
          git diff --cached --quiet || git commit -m "Wire proof and closure spine [skip ci]"
          cp artifacts/core-test-status-v0-1.json artifacts/latest-core-test-status-v0-1.json
          cp artifacts/core-test-log-v0-1.txt artifacts/latest-core-test-log-v0-1.txt
          cp artifacts/self-edit-loop-status-v0-1.json artifacts/latest-self-edit-loop-status-v0-1.json
          cp artifacts/self-edit-loop-post-promotion-status-v0-1.json artifacts/latest-self-edit-loop-post-promotion-status-v0-1.json
          cp artifacts/reactive-promotion-status-v0-1.json artifacts/latest-reactive-promotion-status-v0-1.json
          cp artifacts/growth-probe-status-v0-1.json artifacts/latest-growth-probe-status-v0-1.json
          cp artifacts/diagnostic-probe-status-v0-1.json artifacts/latest-diagnostic-probe-status-v0-1.json
          cp artifacts/self-edit-loop-report-v0-1.json artifacts/latest-self-edit-loop-report-v0-1.json
          cp artifacts/self-edit-loop-summary-v0-1.json artifacts/latest-self-edit-loop-summary-v0-1.json
          cp artifacts/reactive-self-edit-report-v0-1.json artifacts/latest-reactive-self-edit-report-v0-1.json
          cp artifacts/reactive-self-edit-summary-v0-1.json artifacts/latest-reactive-self-edit-summary-v0-1.json
          cp artifacts/growth-probe-report-v0-1.json artifacts/latest-growth-probe-report-v0-1.json
          cp artifacts/growth-probe-summary-v0-1.json artifacts/latest-growth-probe-summary-v0-1.json
          cp artifacts/diagnostic-probe-report-v0-1.json artifacts/latest-diagnostic-probe-report-v0-1.json
          cp artifacts/diagnostic-probe-summary-v0-1.json artifacts/latest-diagnostic-probe-summary-v0-1.json
          [ -f artifacts/diagnostic-kernel-logic-v0-1.json ] && cp artifacts/diagnostic-kernel-logic-v0-1.json artifacts/latest-diagnostic-kernel-logic-v0-1.json || true
          git add artifacts/latest-*.json artifacts/latest-core-test-log-v0-1.txt
          git diff --cached --quiet || git commit -m "Update latest self-edit diagnostics [skip ci]"
          git pull --rebase || true
          git push

      - name: Upload self-edit reports
        uses: actions/upload-artifact@v4
        with:
          name: self-edit-loop-reports-v0-1
          path: |
            artifacts/*-v0-1.json
            artifacts/*-v0-1.txt

      - name: Fail if captured status failed
        run: |
          status=0
          [ "${CORE_TEST_STATUS:-0}" -eq 0 ] || status=${CORE_TEST_STATUS}
          [ "${SELF_EDIT_STATUS:-0}" -eq 0 ] || status=${SELF_EDIT_STATUS}
          [ "${SELF_EDIT_POST_PROMOTION_STATUS:-0}" -eq 0 ] || status=${SELF_EDIT_POST_PROMOTION_STATUS}
          [ "${GROWTH_PROBE_STATUS:-0}" -eq 0 ] || status=${GROWTH_PROBE_STATUS}
          [ "${DIAGNOSTIC_PROBE_STATUS:-0}" -eq 0 ] || status=${DIAGNOSTIC_PROBE_STATUS}
          exit "$status"
