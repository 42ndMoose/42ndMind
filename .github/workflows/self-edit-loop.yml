name: 42ndMind Self-Edit Loop

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/self-edit-loop.yml'

jobs:
  self-edit-loop:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply raw compiler parser patch
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = 'src/language-parser-v0-1.js';
          let s = fs.readFileSync(path, 'utf8');
          if (!s.includes('function compileRaw(source, options)')) {
            const insertAfter = "  function splitTopLevel(text, separator) {\n    const parts = [];\n    let current = '';\n    let depth = 0;\n    for (let i = 0; i < text.length; i += 1) {\n      const ch = text[i];\n      if (ch === '[' || ch === '{') depth += 1;\n      if (ch === ']' || ch === '}') depth -= 1;\n      if (ch === separator && depth === 0) {\n        if (current.trim()) parts.push(current.trim());\n        current = '';\n      } else {\n        current += ch;\n      }\n    }\n    if (current.trim()) parts.push(current.trim());\n    return parts;\n  }\n";
            const rawBlock = String.raw`
  function safeSymbol(value, fallback) {
    const clean = String(value == null ? '' : value).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40);
    return clean || fallback || 'x';
  }

  function countMap(values) {
    const out = {};
    A(values).forEach(value => { const key = String(value); out[key] = (out[key] || 0) + 1; });
    return out;
  }

  function topCountRows(prefix, values, limit) {
    const counts = countMap(values);
    return Object.keys(counts).sort((a, b) => counts[b] - counts[a] || a.localeCompare(b)).slice(0, limit || 12).map(key => ({ σ: prefix + safeSymbol(key), w: counts[key] }));
  }

  function rawTokens(text) {
    return String(text == null ? '' : text).toLowerCase().match(/[a-z0-9]+/g) || [];
  }

  function rawBigrams(tokens) {
    const out = [];
    for (let i = 0; i < tokens.length - 1; i += 1) out.push(tokens[i] + '-' + tokens[i + 1]);
    return out;
  }

  function rawIntentRows(text, tokens) {
    const lower = String(text || '').toLowerCase();
    const rows = [];
    if (/[?]/.test(text)) rows.push({ σ: 'intent:question', w: 1 });
    if (/\b(please|can|could|would|make|do|show|give|check|fix|finish)\b/.test(lower)) rows.push({ σ: 'intent:request', w: 1 });
    if (/\b(is|are|was|were|does|did|because|therefore|so|means|implies)\b/.test(lower)) rows.push({ σ: 'intent:claim', w: 1 });
    if (/!/.test(text)) rows.push({ σ: 'intent:emphasis', w: 0.5 });
    if (!rows.length && A(tokens).length) rows.push({ σ: 'intent:statement', w: 1 });
    return rows;
  }

  function compileRaw(source, options) {
    const opts = Object.assign({ maxTokens: 12, maxRelations: 12 }, options || {});
    const text = String(source == null ? '' : source).trim();
    const tokens = rawTokens(text);
    if (!text || !tokens.length) throw new Error('Raw input has no tokenizable content');
    const bigrams = rawBigrams(tokens);
    const τ = normalize(topCountRows('tok:', tokens, opts.maxTokens), EMPTY.τ);
    const ρ = normalize(bigrams.length ? topCountRows('rel:', bigrams, opts.maxRelations) : [{ σ: 'rel:single-token', w: 1 }], EMPTY.ρ);
    const μ = normalize(τ.map(row => ({ σ: 'mean:' + row.σ.slice(4), w: row.w })).concat(ρ.slice(0, 4).map(row => ({ σ: 'mean:' + row.σ.slice(4), w: row.w * 0.5 }))), EMPTY.μ);
    const ε = normalize([{ σ: 'raw:tokenized', w: tokens.length }, { σ: 'raw:relations', w: Math.max(1, bigrams.length) }, { σ: 'raw:unverified-semantics', w: 1 }], EMPTY.ε);
    const λ = normalize([{ σ: 'lex:tokens', w: τ.length }, { σ: 'lex:relations', w: ρ.length }, { σ: 'lex:meaning-candidates', w: μ.length }, { σ: 'lex:evidence', w: ε.length }], EMPTY.λ);
    const ι = normalize(rawIntentRows(text, tokens), EMPTY.ι);
    const κ = normalize([{ σ: 'constraint:deterministic-raw-compiler', w: 1 }, { σ: 'constraint:no-llm-semantics', w: 1 }, { σ: 'constraint:unit-total-output', w: 1 }], EMPTY.κ);
    const Ω = normalize([{ σ: 'τ:tokens', w: 0.20 }, { σ: 'ρ:relations', w: 0.16 }, { σ: 'μ:meaning-candidates', w: 0.18 }, { σ: 'ε:raw-evidence', w: 0.14 }, { σ: 'λ:lexical-shape', w: 0.12 }, { σ: 'ι:intent-shape', w: 0.10 }, { σ: 'κ:compiler-constraints', w: 0.10 }], EMPTY.Ω);
    return { φ: 'Ω', v: VERSION, mode: 'raw_compiled', fields: { τ, ρ, μ, ε, λ, ι, κ, Ω }, raw: { length: text.length, tokens: tokens.length, relations: bigrams.length }, u: unitReport({ τ, ρ, μ, ε, λ, ι, κ, Ω }), Ξ: '' };
  }

  function rawToSymbolic(source, options) {
    return serialize(compileRaw(source, options));
  }
`;
            s = s.replace(insertAfter, insertAfter + rawBlock);
          }
          if (!s.includes('function rawToKernelFields(input, options)')) {
            s = s.replace(
              "  function toKernelCompletion(input, kernel, options) {\n    if (!kernel || typeof kernel.complete !== 'function') throw new Error('Kernel with complete(...) is required');\n    const opts = options || {};\n    const seed = opts.whole === true ? [toKernelSeed(input, opts.parse)] : toKernelFields(input, opts.parse);\n    return kernel.complete(seed, opts.complete || {});\n  }\n",
              "  function toKernelCompletion(input, kernel, options) {\n    if (!kernel || typeof kernel.complete !== 'function') throw new Error('Kernel with complete(...) is required');\n    const opts = options || {};\n    const seed = opts.whole === true ? [toKernelSeed(input, opts.parse)] : toKernelFields(input, opts.parse);\n    return kernel.complete(seed, opts.complete || {});\n  }\n\n  function rawToKernelFields(input, options) {\n    return toKernelFields(compileRaw(input, options));\n  }\n\n  function rawToKernelSeed(input, options) {\n    return toKernelSeed(compileRaw(input, options));\n  }\n\n  function rawToKernelCompletion(input, kernel, options) {\n    if (!kernel || typeof kernel.complete !== 'function') throw new Error('Kernel with complete(...) is required');\n    const opts = options || {};\n    const packet = compileRaw(input, opts.raw);\n    const seed = opts.whole === true ? [toKernelSeed(packet)] : toKernelFields(packet);\n    return kernel.complete(seed, opts.complete || {});\n  }\n"
            );
          }
          s = s.replace('    fromKernelPacket,\n    toKernelFields,', '    fromKernelPacket,\n    compileRaw,\n    rawToSymbolic,\n    toKernelFields,');
          s = s.replace('    toKernelCompletion,\n    validate,', '    toKernelCompletion,\n    rawToKernelFields,\n    rawToKernelSeed,\n    rawToKernelCompletion,\n    validate,');
          fs.writeFileSync(path, s);
          NODE

      - name: Run core tests and capture status
        run: |
          set +e
          mkdir -p artifacts
          : > artifacts/core-test-log-v0-1.txt
          status=0
          for test in \
            tests/math-language-kernel-v0-1-test.js \
            tests/completion-scopes-v0-1-test.js \
            tests/completion-edge-scopes-v0-1-test.js \
            tests/completion-frontier-scopes-v0-1-test.js \
            tests/compiler-to-kernel-v0-1-test.js \
            tests/raw-to-kernel-v0-1-test.js \
            tests/discovery-core-v0-1-test.js \
            tests/source-sandbox-v0-1-test.js \
            tests/mathematical-patch-proposer-v0-1-test.js \
            tests/operator-synthesis-core-v0-1-test.js \
            tests/self-edit-loop-v0-1-test.js \
            tests/intention-algebra-v0-1-test.js \
            tests/language-parser-v0-1-test.js \
            tests/nested-relation-core-v0-1-test.js \
            tests/language-v0-1-conformance-test.js \
            tests/truth-accounting-core-v0-1-test.js
          do
            echo "## $test" | tee -a artifacts/core-test-log-v0-1.txt
            node "$test" >> artifacts/core-test-log-v0-1.txt 2>&1
            code=$?
            echo "exit_code=$code" | tee -a artifacts/core-test-log-v0-1.txt
            if [ "$code" -ne 0 ]; then status=$code; fi
          done
          printf '{\n  "core_tests_exit_code": %s,\n  "ok": %s\n}\n' "$status" "$([ "$status" -eq 0 ] && echo true || echo false)" > artifacts/core-test-status-v0-1.json
          echo "CORE_TEST_STATUS=$status" >> "$GITHUB_ENV"

      - name: Run whole-language self-edit loop and capture status
        run: |
          set +e
          node scripts/run-self-edit-loop-v0-1.js > artifacts/self-edit-loop-console-v0-1.txt 2>&1
          code=$?
          printf '{\n  "self_edit_exit_code": %s,\n  "ok": %s\n}\n' "$code" "$([ "$code" -eq 0 ] && echo true || echo false)" > artifacts/self-edit-loop-status-v0-1.json
          echo "SELF_EDIT_STATUS=$code" >> "$GITHUB_ENV"

      - name: Run growth probe and capture status
        run: |
          set +e
          node scripts/run-growth-probe-v0-1.js > artifacts/growth-probe-console-v0-1.txt 2>&1
          code=$?
          printf '{\n  "growth_probe_exit_code": %s,\n  "ok": %s\n}\n' "$code" "$([ "$code" -eq 0 ] && echo true || echo false)" > artifacts/growth-probe-status-v0-1.json
          echo "GROWTH_PROBE_STATUS=$code" >> "$GITHUB_ENV"

      - name: Run diagnostic probe and capture status
        run: |
          set +e
          node scripts/run-diagnostic-probe-v0-1.js > artifacts/diagnostic-probe-console-v0-1.txt 2>&1
          code=$?
          printf '{\n  "diagnostic_probe_exit_code": %s,\n  "ok": %s\n}\n' "$code" "$([ "$code" -eq 0 ] && echo true || echo false)" > artifacts/diagnostic-probe-status-v0-1.json
          echo "DIAGNOSTIC_PROBE_STATUS=$code" >> "$GITHUB_ENV"

      - name: Ensure report placeholders exist
        run: |
          mkdir -p artifacts
          for file in self-edit-loop-report-v0-1.json self-edit-loop-summary-v0-1.json growth-probe-report-v0-1.json growth-probe-summary-v0-1.json diagnostic-probe-report-v0-1.json diagnostic-probe-summary-v0-1.json
          do
            if [ ! -f "artifacts/$file" ]; then
              printf '{\n  "missing": true,\n  "file": "%s"\n}\n' "$file" > "artifacts/$file"
            fi
          done

      - name: Print self-edit summary
        run: |
          echo "## 42ndMind Core Test Status" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat artifacts/core-test-status-v0-1.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "## 42ndMind Self-Edit Loop Summary" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat artifacts/self-edit-loop-summary-v0-1.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "## 42ndMind Growth Probe Summary" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat artifacts/growth-probe-summary-v0-1.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "## 42ndMind Diagnostic Probe Summary" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat artifacts/diagnostic-probe-summary-v0-1.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Publish latest report into repository
        run: |
          mkdir -p artifacts
          git config user.name "42ndMind Bot"
          git config user.email "actions@github.com"
          git add src/language-parser-v0-1.js
          git diff --cached --quiet || git commit -m "Add deterministic raw compiler [skip ci]"
          cp artifacts/core-test-status-v0-1.json artifacts/latest-core-test-status-v0-1.json
          cp artifacts/core-test-log-v0-1.txt artifacts/latest-core-test-log-v0-1.txt
          cp artifacts/self-edit-loop-status-v0-1.json artifacts/latest-self-edit-loop-status-v0-1.json
          cp artifacts/growth-probe-status-v0-1.json artifacts/latest-growth-probe-status-v0-1.json
          cp artifacts/diagnostic-probe-status-v0-1.json artifacts/latest-diagnostic-probe-status-v0-1.json
          cp artifacts/self-edit-loop-report-v0-1.json artifacts/latest-self-edit-loop-report-v0-1.json
          cp artifacts/self-edit-loop-summary-v0-1.json artifacts/latest-self-edit-loop-summary-v0-1.json
          cp artifacts/growth-probe-report-v0-1.json artifacts/latest-growth-probe-report-v0-1.json
          cp artifacts/growth-probe-summary-v0-1.json artifacts/latest-growth-probe-summary-v0-1.json
          cp artifacts/diagnostic-probe-report-v0-1.json artifacts/latest-diagnostic-probe-report-v0-1.json
          cp artifacts/diagnostic-probe-summary-v0-1.json artifacts/latest-diagnostic-probe-summary-v0-1.json
          [ -f artifacts/diagnostic-kernel-logic-v0-1.json ] && cp artifacts/diagnostic-kernel-logic-v0-1.json artifacts/latest-diagnostic-kernel-logic-v0-1.json || true
          git add artifacts/latest-*.json artifacts/latest-core-test-log-v0-1.txt
          git diff --cached --quiet || git commit -m "Update latest self-edit diagnostics [skip ci]"
          git pull --rebase || true
          git push

      - name: Upload self-edit reports
        uses: actions/upload-artifact@v4
        with:
          name: self-edit-loop-reports-v0-1
          path: |
            artifacts/*-v0-1.json
            artifacts/*-v0-1.txt

      - name: Fail if captured status failed
        run: |
          status=0
          [ "${CORE_TEST_STATUS:-0}" -eq 0 ] || status=${CORE_TEST_STATUS}
          [ "${SELF_EDIT_STATUS:-0}" -eq 0 ] || status=${SELF_EDIT_STATUS}
          [ "${GROWTH_PROBE_STATUS:-0}" -eq 0 ] || status=${GROWTH_PROBE_STATUS}
          [ "${DIAGNOSTIC_PROBE_STATUS:-0}" -eq 0 ] || status=${DIAGNOSTIC_PROBE_STATUS}
          exit "$status"
