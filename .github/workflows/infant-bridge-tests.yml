name: Infant tests

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run test suite
        shell: bash
        run: |
          set -euo pipefail
          find tests -maxdepth 1 -type f -name '*.js' | sort | while read -r f; do
            echo "::group::$f"
            node "$f"
            echo "::endgroup::"
          done
