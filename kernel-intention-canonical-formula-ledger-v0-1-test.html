<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>42ndMind Intention Canonical Formula Ledger Test</title><style>body{margin:0;background:#0f1115;color:#eef2ff;font:14px ui-monospace,Menlo,Consolas,monospace}header{padding:16px;background:#11141b;border-bottom:1px solid #2a3040}main{padding:12px}section{background:#171a21;border:1px solid #2a3040;border-radius:10px;padding:12px}pre{white-space:pre-wrap;background:#0d1016;border:1px solid #2a3040;border-radius:10px;padding:10px;overflow:auto;max-height:760px}.ok{color:#9dffb4}.bad{color:#ff8b8b}a{color:#9db6ff}</style></head><body><header><h1>42ndMind Intention Canonical Formula Ledger Test</h1><div>Tests versioned, non-doctrinal storage for compiled formulas and staged revisions. No belief/world-model ledger.</div></header><main><section><h2 id="summary">Running...</h2><div><a href="intention-canonical-formula-ledger.html?v=ledger-1">canonical formula ledger page</a></div><pre id="out"></pre></section></main><script src="src/kernel-intention-discovery-v0-1.js?v=intent-1"></script><script src="src/kernel-intention-refinement-v0-1.js?v=refine-1"></script><script src="src/kernel-intention-necessity-test-v0-1.js?v=necessity-1"></script><script src="src/kernel-intention-neighbor-lattice-v0-1.js?v=lattice-3"></script><script src="src/kernel-intention-lattice-invariance-benchmark-v0-1.js?v=invariance-2"></script><script src="src/kernel-intention-formula-compiler-v0-1.js?v=formula-1"></script><script src="src/kernel-intention-concept-expansion-loop-v0-1.js?v=expansion-2"></script><script src="src/kernel-intention-contradiction-refinement-loop-v0-1.js?v=contradiction-1"></script><script src="src/kernel-intention-formula-revision-engine-v0-1.js?v=revision-1"></script><script src="src/kernel-intention-canonical-formula-ledger-v0-1.js?v=ledger-1"></script><script>const tests=[];let packet=null;function add(n,f){tests.push({name:n,fn:f})}function assert(c,m){if(!c)throw new Error(m)}function arr(v){return Array.isArray(v)?v:[]}function records(){return arr(packet&&packet.ledger_records)}function versions(){return records().flatMap(r=>arr(r.versions))}function hasVersion(record,type){return arr(record.versions).some(v=>v.source_type===type)}function shapeL1(terms){return Number(arr(terms).reduce((s,t)=>s+Math.abs(Number(t.coefficient)||0),0).toFixed(6))}function forceOutsideShape(v){const shape=new Set(arr(v.shape_terms).map(t=>t.dimension));return arr(v.force_terms).every(f=>!shape.has(f.dimension))}add('modules load and doctrine is ledger-only',()=>{assert(window.KernelIntentionCanonicalFormulaLedgerV01,'canonical formula ledger missing');assert(KernelIntentionCanonicalFormulaLedgerV01.VERSION==='0.1.0','version wrong');assert(typeof KernelIntentionCanonicalFormulaLedgerV01.runLedger==='function','runLedger missing');const d=KernelIntentionCanonicalFormulaLedgerV01.doctrine();assert(d.stores_formula_versions_not_world_beliefs===true,'world-belief separation missing');assert(d.no_person_event_or_narrative_belief_ledger===true,'belief ledger guard missing');assert(d.no_silent_source_mutation===true,'source mutation guard missing');assert(d.no_formula_replacement_without_version_trail===true,'version trail guard missing');assert(d.force_intensity_outside_shape==='F = M · i','force guard missing');assert(d.belief_movement==='none','belief movement wrong')});add('ledger runs and has 11 concepts',()=>{packet=KernelIntentionCanonicalFormulaLedgerV01.runLedger();assert(packet.ok===true,'packet not ok: '+JSON.stringify(packet.validation));assert(packet.source_expansion_ok===true,'source expansion not ok');assert(packet.source_revision_ok===true,'source revision not ok');assert(packet.ledger_record_count===11,'expected 11 ledger records');assert(records().length===11,'expected 11 records');assert(packet.belief_movement==='none','packet moved belief')});add('compiled and staged versions stored for every concept',()=>{records().forEach(r=>{assert(hasVersion(r,'compiled_formula'),r.concept+' missing compiled formula');assert(hasVersion(r,'staged_revision'),r.concept+' missing staged revision');assert(arr(r.versions).length>=2,r.concept+' version count < 2');assert(r.current_candidate_version&&r.current_candidate_version.includes('staged_revision'),r.concept+' current candidate is not staged revision')})});add('all L1 totals remain 1',()=>{versions().forEach(v=>{const l1=shapeL1(v.shape_terms);assert(l1===1,v.concept+' '+v.version_id+' l1 wrong: '+l1);assert(v.validation&&v.validation.ledger_l1_total===1,v.concept+' ledger validation l1 wrong')});assert(packet.validation.checks.all_l1_totals_equal_1===true,'packet l1 check failed')});add('force terms remain outside shape',()=>{versions().forEach(v=>assert(forceOutsideShape(v),v.concept+' '+v.version_id+' force leaked into shape'));assert(packet.validation.checks.force_terms_outside_shape===true,'packet force separation check failed')});add('candidate-only status and belief movement are preserved',()=>{assert(packet.doctrine_status==='candidate_not_doctrine','packet doctrine status wrong');versions().forEach(v=>{assert(v.promotion_status==='not_promoted',v.concept+' '+v.version_id+' promoted');assert(v.doctrine_status==='candidate_not_doctrine',v.concept+' '+v.version_id+' doctrine status wrong');assert(v.belief_movement==='none',v.concept+' '+v.version_id+' moved belief')});records().forEach(r=>{assert(r.doctrine_status==='candidate_not_doctrine',r.concept+' record doctrine status wrong');assert(r.belief_movement==='none',r.concept+' record moved belief')});assert(packet.validation.checks.all_promotion_status_not_promoted===true,'promotion status check failed');assert(packet.validation.checks.belief_movement_none===true,'belief movement check failed')});add('rollback data and validation snapshots are present',()=>{records().forEach(r=>{assert(r.rollback_available===true,r.concept+' rollback unavailable');assert(arr(r.rollback_targets).length>=1,r.concept+' rollback target missing');arr(r.versions).forEach(v=>{assert(v.validation&&v.validation.source_validation,v.concept+' '+v.version_id+' source validation missing');assert(v.formula_snapshot,v.concept+' '+v.version_id+' snapshot missing')})});assert(packet.validation.checks.rollback_data_present===true,'rollback check failed')});add('no silent overwrite or source mutation',()=>{records().forEach(r=>{const compiled=arr(r.versions).find(v=>v.source_type==='compiled_formula');const staged=arr(r.versions).find(v=>v.source_type==='staged_revision');assert(compiled&&staged,r.concept+' versions incomplete');assert(compiled.version_id!==staged.version_id,r.concept+' version overwritten');assert(arr(r.revision_trail).length>=arr(r.versions).length,r.concept+' trail too short');assert(staged.source_formula_snapshot&&staged.source_formula_snapshot.symbolic_formula===compiled.formula_snapshot.symbolic_formula,r.concept+' staged source formula snapshot changed');assert(JSON.stringify(staged.source_formula_snapshot.shape_terms)===JSON.stringify(compiled.formula_snapshot.shape_terms),r.concept+' staged source shape snapshot changed');assert(staged.formula_snapshot.revision_changes_source_coefficients===false,r.concept+' source coefficients changed');assert(staged.formula_snapshot.revision_changes_source_shape_terms===false,r.concept+' source shape terms changed')});assert(packet.validation.checks.no_silent_overwrite===true,'no silent overwrite check failed')});(async function run(){const results=[];for(const t of tests){try{await t.fn();results.push({name:t.name,passed:true})}catch(e){results.push({name:t.name,passed:false,error:e.message})}}const passed=results.filter(r=>r.passed).length;document.getElementById('summary').className=passed===tests.length?'ok':'bad';document.getElementById('summary').textContent=passed+'/'+tests.length+' passed';document.getElementById('out').textContent=JSON.stringify({packet_type:'42ndMind_intention_canonical_formula_ledger_test_report_v0_1',ok:passed===tests.length,ledger_record_count:packet&&packet.ledger_record_count,source_compiled_formula_count:packet&&packet.source_compiled_formula_count,source_revision_candidate_count:packet&&packet.source_revision_candidate_count,concepts:records().map(r=>({concept:r.concept,current_candidate_version:r.current_candidate_version,version_count:r.versions.length,rollback_available:r.rollback_available,doctrine_status:r.doctrine_status,belief_movement:r.belief_movement})),validation:packet&&packet.validation,results},null,2)})();</script></body></html>
