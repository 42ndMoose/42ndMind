<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>42ndMind Intention Contradiction/Refinement Loop Test</title><style>body{margin:0;background:#0f1115;color:#eef2ff;font:14px ui-monospace,Menlo,Consolas,monospace}header{padding:16px;background:#11141b;border-bottom:1px solid #2a3040}main{padding:12px}section{background:#171a21;border:1px solid #2a3040;border-radius:10px;padding:12px}pre{white-space:pre-wrap;background:#0d1016;border:1px solid #2a3040;border-radius:10px;padding:10px;overflow:auto;max-height:760px}.ok{color:#9dffb4}.bad{color:#ff8b8b}a{color:#9db6ff}</style></head><body><header><h1>42ndMind Intention Contradiction/Refinement Loop Test</h1><div>Tests cross-concept refinement pressure. No automatic rewrite. No doctrine promotion.</div></header><main><section><h2 id="summary">Running...</h2><div><a href="intention-contradiction-refinement.html?v=contradiction-1">contradiction/refinement page</a></div><pre id="out"></pre></section></main><script src="src/kernel-intention-discovery-v0-1.js?v=intent-1"></script><script src="src/kernel-intention-refinement-v0-1.js?v=refine-1"></script><script src="src/kernel-intention-necessity-test-v0-1.js?v=necessity-1"></script><script src="src/kernel-intention-neighbor-lattice-v0-1.js?v=lattice-3"></script><script src="src/kernel-intention-lattice-invariance-benchmark-v0-1.js?v=invariance-2"></script><script src="src/kernel-intention-formula-compiler-v0-1.js?v=formula-1"></script><script src="src/kernel-intention-concept-expansion-loop-v0-1.js?v=expansion-1"></script><script src="src/kernel-intention-contradiction-refinement-loop-v0-1.js?v=contradiction-1"></script><script>const tests=[];let packet=null;function add(n,f){tests.push({name:n,fn:f})}function assert(c,m){if(!c)throw new Error(m)}function arr(v){return Array.isArray(v)?v:[]}function pair(id){return arr(packet&&packet.pair_analyses).find(p=>p.id===id)}add('modules load',()=>{assert(window.KernelIntentionContradictionRefinementLoopV01,'loop missing');assert(KernelIntentionContradictionRefinementLoopV01.VERSION==='0.1.0','version wrong');assert(typeof KernelIntentionContradictionRefinementLoopV01.runLoop==='function','runLoop missing')});add('doctrine keeps contradiction separate from resolution',()=>{const d=KernelIntentionContradictionRefinementLoopV01.doctrine();assert(d.compares_intention_formulas_not_claim_facts===true,'comparison doctrine missing');assert(d.contradiction_detection_is_not_contradiction_resolution===true,'contradiction doctrine missing');assert(d.refinement_actions_are_candidate_not_doctrine===true,'candidate action doctrine missing');assert(d.does_not_rewrite_source_formulas===true,'rewrite guard missing');assert(d.belief_movement==='none','belief movement wrong')});add('loop runs on expanded formulas',()=>{packet=KernelIntentionContradictionRefinementLoopV01.runLoop();assert(packet.ok===true,'packet not ok: '+JSON.stringify(packet.validation));assert(packet.source_expansion_ok===true,'source expansion not ok');assert(packet.compiled_formula_count===11,'expected 11 formulas');assert(packet.pair_analysis_count===6,'expected 6 pair analyses');assert(packet.belief_movement==='none','packet moved belief')});add('formula integrity remains clean',()=>{arr(packet.formula_integrity).forEach(row=>{assert(row.ok===true,row.concept+' integrity failed: '+row.errors.join(','));assert(row.l1_total===1,row.concept+' l1 wrong');assert(row.review_status==='compiled_candidate_not_doctrine',row.concept+' promoted');assert(row.belief_movement==='none',row.concept+' moved belief')})});add('expected cross-concept pressure pairs exist',()=>{['consent_vs_coercion','request_vs_threat','trust_vs_betrayal','belief_vs_doubt','fear_vs_threat','manipulation_vs_coercion'].forEach(id=>{const p=pair(id);assert(p,'missing pair '+id);assert(p.contradiction_status==='structured_pressure_detected',id+' should be structured pressure');assert(p.severity==='refinement_pressure',id+' wrong severity');assert(p.action_status==='candidate_refinement_action_not_applied',id+' action applied too early');assert(p.belief_movement==='none',id+' moved belief')})});add('pair relations are found in lattice transitions',()=>{arr(packet.pair_analyses).forEach(p=>{arr(p.relation_checks).forEach(r=>{assert(r.relation_exists===true,p.id+' missing relation '+r.from+'-'+r.removed_dimension+'->'+r.to);assert(r.belief_movement==='none',p.id+' relation moved belief')})})});add('refinement actions are suggestions only',()=>{assert(arr(packet.proposed_refinement_actions).length>=6,'missing refinement actions');arr(packet.proposed_refinement_actions).forEach(a=>{assert(a.action_status==='candidate_refinement_action_not_applied','action auto-applied');assert(a.belief_movement==='none','action moved belief')})});add('validation report is clean',()=>{assert(packet.validation&&packet.validation.ok===true,'validation not ok');assert(arr(packet.validation.errors).length===0,'validation has errors');assert(packet.duplicate_dimension_pressure&&packet.duplicate_dimension_pressure.belief_movement==='none','duplicate pressure moved belief')});(async function run(){const results=[];for(const t of tests){try{await t.fn();results.push({name:t.name,passed:true})}catch(e){results.push({name:t.name,passed:false,error:e.message})}}const passed=results.filter(r=>r.passed).length;document.getElementById('summary').className=passed===tests.length?'ok':'bad';document.getElementById('summary').textContent=passed+'/'+tests.length+' passed';document.getElementById('out').textContent=JSON.stringify({packet_type:'42ndMind_intention_contradiction_refinement_loop_test_report_v0_1',ok:passed===tests.length,compiled_formula_count:packet&&packet.compiled_formula_count,pair_analysis_count:packet&&packet.pair_analysis_count,pair_analyses:packet&&packet.pair_analyses,duplicate_dimension_pressure:packet&&packet.duplicate_dimension_pressure,proposed_refinement_action_count:packet&&packet.proposed_refinement_actions&&packet.proposed_refinement_actions.length,validation:packet&&packet.validation,results},null,2)})();</script></body></html>
