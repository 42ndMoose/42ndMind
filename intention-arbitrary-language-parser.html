<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>42ndMind Arbitrary-Language Parser</title><style>body{margin:0;background:#0f1115;color:#eef2ff;font:14px ui-monospace,Menlo,Consolas,monospace}header{padding:16px 18px;background:#11141b;border-bottom:1px solid #2a3040}main{padding:12px;display:grid;grid-template-columns:470px 1fr;gap:12px}section{background:#171a21;border:1px solid #2a3040;border-radius:10px;padding:12px}textarea{width:100%;min-height:105px;background:#0d1016;color:#eef2ff;border:1px solid #2a3040;border-radius:10px;padding:10px;box-sizing:border-box;font:14px ui-monospace,Menlo,Consolas,monospace}button{background:#25345c;color:#eef2ff;border:1px solid #3f5592;padding:8px 10px;border-radius:8px;cursor:pointer;margin:3px 3px 8px 0}pre{white-space:pre-wrap;background:#0d1016;border:1px solid #2a3040;border-radius:10px;padding:10px;overflow:auto;max-height:760px}.ok{color:#9dffb4}.bad{color:#ff8b8b}.muted{color:#8b93a7}a{color:#9db6ff}.card{background:#10131a;border:1px solid #2a3040;border-radius:10px;padding:10px;margin:10px 0}.parse{border-top:1px solid #252b3a;padding:7px 0}.pill{display:inline-block;border:1px solid #2a3040;border-radius:999px;padding:1px 7px;margin:2px}.safe{color:#9dffb4}.warn{color:#ffd28b}@media(max-width:900px){main{grid-template-columns:1fr}}</style></head><body><header><h1>42ndMind Arbitrary-Language Parser</h1><div class="muted">Neutral text to candidate formula structure. Deterministic v0.1. Candidate only. No attribution.</div></header><main><section><a href="index.html">main</a> · <a href="intention-canonical-formula-ledger-v0-1-1.html?v=ledger-2">ledger v0.1.1</a> · <a href="kernel-intention-arbitrary-language-parser-v0-1-test.html?v=parser-1">test</a><p>Decision: <b id="decisionMetric">not run</b></p><p>Parse cases: <b id="parseMetric">0</b></p><textarea id="customInput">A person clearly agrees after understanding the scope and can still say no.</textarea><button onclick="runSamples()">Run sample parser</button><button onclick="runCustom()">Parse custom text</button><button onclick="showPacket()">Show packet</button><button onclick="showSummary()">Show summary</button><button onclick="copyOutput()">Copy output</button><div id="cards"></div></section><section><h2>Output</h2><pre id="out">No output yet.</pre></section></main><script src="src/kernel-intention-discovery-v0-1.js?v=intent-1"></script><script src="src/kernel-intention-refinement-v0-1.js?v=refine-1"></script><script src="src/kernel-intention-necessity-test-v0-1.js?v=necessity-1"></script><script src="src/kernel-intention-neighbor-lattice-v0-1.js?v=lattice-3"></script><script src="src/kernel-intention-lattice-invariance-benchmark-v0-1.js?v=invariance-2"></script><script src="src/kernel-intention-formula-compiler-v0-1.js?v=formula-1"></script><script src="src/kernel-intention-concept-expansion-loop-v0-1.js?v=expansion-2"></script><script src="src/kernel-intention-contradiction-refinement-loop-v0-1.js?v=contradiction-1"></script><script src="src/kernel-intention-formula-revision-engine-v0-1.js?v=revision-1"></script><script src="src/kernel-intention-canonical-formula-ledger-v0-1.js?v=ledger-1"></script><script src="src/kernel-intention-proof-output-v0-1.js?v=proof-1"></script><script src="src/kernel-intention-minimal-pair-library-v0-1.js?v=minpair-1"></script><script src="src/kernel-intention-dimension-splitting-v0-1.js?v=split-2"></script><script src="src/kernel-intention-coefficient-dimension-revision-engine-v0-1.js?v=codim-1"></script><script src="src/kernel-intention-canonical-formula-ledger-v0-1-1-patch.js?v=ledger-2"></script><script src="src/kernel-intention-arbitrary-language-parser-v0-1.js?v=parser-1"></script><script>let packet=null,last='';function esc(v){return String(v??'').replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]))}function arr(v){return Array.isArray(v)?v:[]}function setOut(v){last=typeof v==='string'?v:JSON.stringify(v,null,2);document.getElementById('out').textContent=last}function setMetrics(){const decisionEl=document.getElementById('decisionMetric');decisionEl.textContent=packet&&packet.ok?'PARSER_CANDIDATE_MATCH_READY':'HELD_FOR_REVIEW';decisionEl.className=packet&&packet.ok?'ok':'bad';document.getElementById('parseMetric').textContent=packet&&packet.parse_count||0}function runSamples(){try{packet=KernelIntentionArbitraryLanguageParserV01.runParser();setMetrics();renderCards();showSummary()}catch(e){document.getElementById('decisionMetric').textContent='ERROR';document.getElementById('decisionMetric').className='bad';setOut({ok:false,error:e.message,belief_movement:'none'})}}function runCustom(){const input=document.getElementById('customInput').value;try{packet=KernelIntentionArbitraryLanguageParserV01.runParser({inputs:[{id:'custom_input_001',text:input}]});setMetrics();renderCards();showPacket()}catch(e){document.getElementById('decisionMetric').textContent='ERROR';document.getElementById('decisionMetric').className='bad';setOut({ok:false,error:e.message,belief_movement:'none'})}}function renderCards(){document.getElementById('cards').innerHTML=arr(packet&&packet.parses).map(p=>{const top=p.top_candidate||{};return`<div class="card"><h3>${esc(p.parse_id)} · ${esc(p.parse_status)}</h3><p><span class="pill warn">top ${esc(top.concept)}</span><span class="pill safe">score ${esc(top.normalized_score)}</span><span class="pill safe">ambiguity ${esc(p.ambiguity_score)}</span><span class="pill safe">unresolved ${esc(top.unresolved_dimension_count)}</span></p><div class="muted">${esc(p.input_text)}</div><div class="parse"><b>Candidate version:</b> ${esc(top.candidate_version)}<br><b>Alias hits:</b> ${esc(arr(top.alias_hits).join(', '))}<br><b>Matched dimensions:</b> ${esc(arr(top.matched_dimensions).map(d=>d.parent_dimension).join(', '))}<br><b>Unresolved dimensions:</b> ${esc(arr(top.unresolved_dimensions).map(d=>d.parent_dimension).join(', '))}</div></div>`}).join('')||'No parses.'}function summary(){return{packet_type:'42ndMind_intention_arbitrary_language_parser_summary_view_v0_1',ok:packet&&packet.ok,source_ledger_ok:packet&&packet.source_ledger_ok,source_ledger_record_count:packet&&packet.source_ledger_record_count,source_proof_ok:packet&&packet.source_proof_ok,source_proof_count:packet&&packet.source_proof_count,parse_count:packet&&packet.parse_count,parses:arr(packet&&packet.parses).map(p=>({parse_id:p.parse_id,parse_status:p.parse_status,input_text:p.input_text,expected_concept:p.expected_concept,top_concept:p.top_candidate&&p.top_candidate.concept,top_version:p.top_candidate&&p.top_candidate.candidate_version,normalized_score:p.top_candidate&&p.top_candidate.normalized_score,ambiguity_score:p.ambiguity_score,unresolved_dimension_count:p.top_candidate&&p.top_candidate.unresolved_dimension_count,belief_movement:p.belief_movement})),validation:packet&&packet.validation,belief_movement:'none'}}function showSummary(){if(!packet)return runSamples();setOut(summary())}function showPacket(){if(!packet)return runSamples();setOut(packet)}async function copyOutput(){try{await navigator.clipboard.writeText(last);document.getElementById('out').textContent='Copied.\n\n'+last}catch(e){}}runSamples();</script></body></html>
