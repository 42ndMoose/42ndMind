<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>42ndMind Concept Admission Registry Test v0.1</title><style>body{margin:0;background:#0f1115;color:#eef2ff;font:14px ui-monospace,Menlo,Consolas,monospace}header{padding:16px;background:#11141b;border-bottom:1px solid #2a3040}main{padding:12px}section{background:#171a21;border:1px solid #2a3040;border-radius:10px;padding:12px}pre{white-space:pre-wrap;background:#0d1016;border:1px solid #2a3040;border-radius:10px;padding:10px;overflow:auto;max-height:760px}.ok{color:#9dffb4}.bad{color:#ff8b8b}a{color:#9db6ff}</style></head><body><header><h1>42ndMind Concept Admission Registry Test v0.1</h1><div>Registers newly learned words/meanings as candidate formula records. No doctrine promotion. No LLM. No lookup.</div></header><main><section><h2 id="summary">Running...</h2><div><a href="concept-admission-registry.html?v=admit-1">concept admission registry page</a></div><pre id="out"></pre></section></main><script src="src/kernel-intention-discovery-v0-1.js?v=intent-1"></script><script src="src/kernel-intention-refinement-v0-1.js?v=refine-1"></script><script src="src/kernel-intention-necessity-test-v0-1.js?v=necessity-1"></script><script src="src/kernel-intention-neighbor-lattice-v0-1.js?v=lattice-3"></script><script src="src/kernel-intention-lattice-invariance-benchmark-v0-1.js?v=invariance-2"></script><script src="src/kernel-intention-formula-compiler-v0-1.js?v=formula-1"></script><script src="src/kernel-intention-concept-expansion-loop-v0-1.js?v=expansion-2"></script><script src="src/kernel-intention-contradiction-refinement-loop-v0-1.js?v=contradiction-1"></script><script src="src/kernel-intention-formula-revision-engine-v0-1.js?v=revision-1"></script><script src="src/kernel-intention-canonical-formula-ledger-v0-1.js?v=ledger-1"></script><script src="src/kernel-intention-proof-output-v0-1.js?v=proof-1"></script><script src="src/kernel-intention-minimal-pair-library-v0-1.js?v=minpair-1"></script><script src="src/kernel-intention-dimension-splitting-v0-1.js?v=split-2"></script><script src="src/kernel-intention-coefficient-dimension-revision-engine-v0-1.js?v=codim-1"></script><script src="src/kernel-intention-canonical-formula-ledger-v0-1-1-patch.js?v=ledger-2"></script><script src="src/kernel-intention-formula-inspector-v0-1.js?v=inspect-1"></script><script src="src/kernel-concept-admission-registry-v0-1.js?v=admit-1"></script><script>const tests=[];let packet=null;function add(n,f){tests.push({name:n,fn:f})}function assert(c,m){if(!c)throw new Error(m)}function arr(v){return Array.isArray(v)?v:[]}function records(){return arr(packet&&packet.admission_records)}function validation(){return packet&&packet.validation||{}}function byConcept(c){return records().find(r=>r.concept===c)}add('module loads and doctrine admits candidate formulas only',()=>{assert(window.KernelIntentionFormulaInspectorV01,'formula inspector missing');assert(window.KernelConceptAdmissionRegistryV01,'concept admission module missing');assert(KernelConceptAdmissionRegistryV01.VERSION==='0.1.0','version wrong');assert(typeof KernelConceptAdmissionRegistryV01.runAdmissionRegistry==='function','runAdmissionRegistry missing');const d=KernelConceptAdmissionRegistryV01.doctrine();assert(d.admits_new_words_and_meanings_as_candidate_formula_records===true,'admission doctrine missing');assert(d.admission_does_not_promote_doctrine===true,'no-promotion doctrine missing');assert(d.provisional_formula_must_preserve_l1_1_when_formula_present===true,'L1 doctrine missing');assert(d.contradiction_pressure_creates_revision_hooks_not_silent_mutation===true,'revision hook doctrine missing');assert(d.no_llm===true,'no LLM doctrine missing');assert(d.no_source_lookup===true,'no lookup doctrine missing');assert(d.belief_movement==='none','belief movement wrong')});add('admission registry runs from formula inspector',()=>{packet=KernelConceptAdmissionRegistryV01.runAdmissionRegistry();assert(packet.ok===true,'packet not ok: '+JSON.stringify(validation()));assert(packet.source_formula_inspector_ok===true,'source inspector not ok');assert(packet.source_formula_inspection_count===11,'expected 11 source inspections');assert(packet.admission_record_count===6,'expected 6 admission records');assert(packet.llm_used===false,'packet used LLM');assert(packet.external_lookup_performed===false,'packet performed lookup');assert(packet.belief_movement==='none','packet moved belief')});add('six learned meanings are registered as candidate formulas',()=>{['permission','warning','skepticism','loyalty','pressure','deception'].forEach(c=>{const r=byConcept(c);assert(r,c+' missing');assert(r.admission_status==='candidate_formula_registered',c+' not formula registered');assert(r.current_candidate_version===c+'_v0001_admission_candidate',c+' version wrong')});assert(validation().checks.six_admission_records===true,'six record check failed');assert(validation().checks.all_registered_as_candidate_formulas===true,'formula registration check failed')});add('inherited and composite admission modes are both present',()=>{assert(records().some(r=>r.admission_mode==='inherit_formula'),'inherit mode missing');assert(records().some(r=>r.admission_mode==='composite_formula'),'composite mode missing');assert(byConcept('permission').admission_mode==='inherit_formula','permission should inherit');assert(byConcept('pressure').admission_mode==='composite_formula','pressure should be composite');assert(validation().checks.inherited_and_composite_modes_present===true,'mode check failed')});add('candidate formulas preserve L1 and force separation',()=>{records().forEach(r=>{const f=r.versions[0].formula_snapshot;assert(f,'formula missing for '+r.concept);assert(f.l1_total===1,r.concept+' l1 wrong: '+f.l1_total);assert(f.force_terms_outside_shape===true,r.concept+' force leaked into shape');assert(arr(f.shape_terms).length>=1,r.concept+' shape terms missing');assert(f.symbolic_formula.includes('F_'+r.concept),r.concept+' force equation missing in symbolic formula')});assert(validation().checks.all_formula_l1_totals_equal_1===true,'L1 check failed');assert(validation().checks.all_force_terms_outside_shape===true,'force check failed')});add('source formula snapshots, revision hooks, and rollback are present',()=>{records().forEach(r=>{assert(arr(r.versions[0].source_formula_snapshots).length>=1,r.concept+' source snapshots missing');arr(r.versions[0].source_formula_snapshots).forEach(s=>assert(s.formula_snapshot,s.concept+' snapshot missing'));assert(r.rollback_available===true,r.concept+' rollback unavailable');assert(arr(r.rollback_targets).length>=1,r.concept+' rollback targets missing')});records().filter(r=>arr(r.contradiction_notes).length>0).forEach(r=>assert(arr(r.revision_hooks).length===arr(r.contradiction_notes).length,r.concept+' revision hooks mismatch'));assert(validation().checks.all_source_snapshots_preserved===true,'source snapshot check failed');assert(validation().checks.revision_hooks_available_for_contradiction_notes===true,'revision hook check failed');assert(validation().checks.rollback_available===true,'rollback check failed')});add('inspector extension records are available',()=>{assert(arr(packet.inspector_extension_records).length===6,'expected 6 inspector extension records');packet.inspector_extension_records.forEach(r=>{assert(r.current_candidate&&r.current_candidate.symbolic_formula,r.concept+' inspector formula missing');assert(r.current_candidate.l1_total===1,r.concept+' inspector L1 wrong');assert(r.current_candidate.force_terms_outside_shape===true,r.concept+' inspector force wrong');assert(r.promotion_status==='not_promoted',r.concept+' inspector record promoted')});assert(validation().checks.inspector_extension_available===true,'inspector extension check failed')});add('no LLM, no lookup, candidate-only status, and belief movement are preserved',()=>{records().forEach(r=>{assert(r.llm_used===false,r.concept+' used LLM');assert(r.external_lookup_performed===false,r.concept+' performed lookup');assert(r.promotion_status==='not_promoted',r.concept+' promoted');assert(r.doctrine_status==='candidate_not_doctrine',r.concept+' doctrine status wrong');assert(r.belief_movement==='none',r.concept+' moved belief')});assert(validation().checks.no_llm_used===true,'no LLM check failed');assert(validation().checks.no_external_lookup===true,'no lookup check failed');assert(validation().checks.candidate_only_not_promoted===true,'candidate-only check failed');assert(validation().checks.belief_movement_none===true,'belief movement check failed');assert(arr(validation().errors).length===0,'validation errors present: '+validation().errors.join(','))});(async function run(){const results=[];for(const t of tests){try{await t.fn();results.push({name:t.name,passed:true})}catch(e){results.push({name:t.name,passed:false,error:e.message})}}const passed=results.filter(r=>r.passed).length;document.getElementById('summary').className=passed===tests.length?'ok':'bad';document.getElementById('summary').textContent=passed+'/'+tests.length+' passed';document.getElementById('out').textContent=JSON.stringify({packet_type:'42ndMind_concept_admission_registry_test_report_v0_1',ok:passed===tests.length,source_formula_inspection_count:packet&&packet.source_formula_inspection_count,admission_record_count:packet&&packet.admission_record_count,records:records().map(r=>({concept:r.concept,admission_mode:r.admission_mode,admission_status:r.admission_status,current_candidate_version:r.current_candidate_version,l1_total:r.versions[0].formula_snapshot&&r.versions[0].formula_snapshot.l1_total,force_terms_outside_shape:r.versions[0].formula_snapshot&&r.versions[0].formula_snapshot.force_terms_outside_shape,revision_hook_count:arr(r.revision_hooks).length,inspector_extension_available:r.inspector_extension_available,belief_movement:r.belief_movement})),validation:validation(),results},null,2)})();</script></body></html>
