<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>42ndMind Intention Proof Output</title><style>body{margin:0;background:#0f1115;color:#eef2ff;font:14px ui-monospace,Menlo,Consolas,monospace}header{padding:16px 18px;background:#11141b;border-bottom:1px solid #2a3040}main{padding:12px;display:grid;grid-template-columns:470px 1fr;gap:12px}section{background:#171a21;border:1px solid #2a3040;border-radius:10px;padding:12px}button{background:#25345c;color:#eef2ff;border:1px solid #3f5592;padding:8px 10px;border-radius:8px;cursor:pointer;margin:3px 3px 8px 0}pre{white-space:pre-wrap;background:#0d1016;border:1px solid #2a3040;border-radius:10px;padding:10px;overflow:auto;max-height:760px}.ok{color:#9dffb4}.bad{color:#ff8b8b}.muted{color:#8b93a7}a{color:#9db6ff}.card{background:#10131a;border:1px solid #2a3040;border-radius:10px;padding:10px;margin:10px 0}.step{border-top:1px solid #252b3a;padding:7px 0}.pill{display:inline-block;border:1px solid #2a3040;border-radius:999px;padding:1px 7px;margin:2px}.safe{color:#9dffb4}.warn{color:#ffd28b}@media(max-width:900px){main{grid-template-columns:1fr}}</style></head><body><header><h1>42ndMind Intention Proof Output</h1><div class="muted">Readable proof traces from canonical formula ledger records. Candidate only.</div></header><main><section><a href="index.html">main</a> · <a href="intention-canonical-formula-ledger.html?v=ledger-1">formula ledger</a> · <a href="kernel-intention-proof-output-v0-1-test.html?v=proof-1">test</a><p>Decision: <b id="decisionMetric">not run</b></p><p>Proofs: <b id="proofMetric">0</b></p><p>Proof steps: <b id="stepMetric">0</b></p><button onclick="runProofs()">Run proof output</button><button onclick="showPacket()">Show packet</button><button onclick="showSummary()">Show summary</button><button onclick="copyOutput()">Copy output</button><div id="cards"></div></section><section><h2>Output</h2><pre id="out">No output yet.</pre></section></main><script src="src/kernel-intention-discovery-v0-1.js?v=intent-1"></script><script src="src/kernel-intention-refinement-v0-1.js?v=refine-1"></script><script src="src/kernel-intention-necessity-test-v0-1.js?v=necessity-1"></script><script src="src/kernel-intention-neighbor-lattice-v0-1.js?v=lattice-3"></script><script src="src/kernel-intention-lattice-invariance-benchmark-v0-1.js?v=invariance-2"></script><script src="src/kernel-intention-formula-compiler-v0-1.js?v=formula-1"></script><script src="src/kernel-intention-concept-expansion-loop-v0-1.js?v=expansion-2"></script><script src="src/kernel-intention-contradiction-refinement-loop-v0-1.js?v=contradiction-1"></script><script src="src/kernel-intention-formula-revision-engine-v0-1.js?v=revision-1"></script><script src="src/kernel-intention-canonical-formula-ledger-v0-1.js?v=ledger-1"></script><script src="src/kernel-intention-proof-output-v0-1.js?v=proof-1"></script><script>let packet=null,last='';function esc(v){return String(v??'').replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]))}function arr(v){return Array.isArray(v)?v:[]}function setOut(v){last=typeof v==='string'?v:JSON.stringify(v,null,2);document.getElementById('out').textContent=last}function runProofs(){const decisionEl=document.getElementById('decisionMetric');try{packet=KernelIntentionProofOutputV01.runProofOutput();decisionEl.textContent=packet.ok?'PROOF_OUTPUT_READY':'HELD_FOR_REVIEW';decisionEl.className=packet.ok?'ok':'bad';document.getElementById('proofMetric').textContent=packet.proof_count;document.getElementById('stepMetric').textContent=packet.proof_step_count;renderCards();showSummary()}catch(e){decisionEl.textContent='ERROR';decisionEl.className='bad';setOut({ok:false,error:e.message,belief_movement:'none'})}}function renderCards(){document.getElementById('cards').innerHTML=arr(packet&&packet.proofs).map(p=>`<div class="card"><h3>${esc(p.concept)} · ${esc(p.doctrine_status)}</h3><p><span class="pill safe">steps ${esc(p.proof_step_count)}</span><span class="pill safe">L1 ${esc(p.observed_l1_total)}</span><span class="pill safe">force outside ${esc(p.force_terms_outside_shape)}</span><span class="pill safe">promotion ${esc(p.promotion_status)}</span></p><pre>${esc(p.proof_text.split('\n').slice(0,11).join('\n'))}</pre>${arr(p.proof_steps).map(s=>`<div class="step"><b>${esc(s.remove)}</b> <span class="pill warn">${esc(s.pressure_class)}</span><br>${esc(s.observed_transition)}<br><span class="muted">${esc(s.conclusion)}</span></div>`).join('')}</div>`).join('')||'No proof records.'}function summary(){return{packet_type:'42ndMind_intention_proof_output_summary_view_v0_1',ok:packet&&packet.ok,source_ledger_ok:packet&&packet.source_ledger_ok,source_ledger_record_count:packet&&packet.source_ledger_record_count,proof_count:packet&&packet.proof_count,proof_step_count:packet&&packet.proof_step_count,proofs:arr(packet&&packet.proofs).map(p=>({concept:p.concept,current_candidate_version:p.current_candidate_version,proof_step_count:p.proof_step_count,observed_l1_total:p.observed_l1_total,force_terms_outside_shape:p.force_terms_outside_shape,promotion_status:p.promotion_status,belief_movement:p.belief_movement})),validation:packet&&packet.validation,belief_movement:'none'}}function showSummary(){if(!packet)return runProofs();setOut(summary())}function showPacket(){if(!packet)return runProofs();setOut(packet)}async function copyOutput(){try{await navigator.clipboard.writeText(last);document.getElementById('out').textContent='Copied.\n\n'+last}catch(e){}}runProofs();</script></body></html>
