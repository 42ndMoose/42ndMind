<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>42ndMind Maturity Objective Test</title>
  <style>
    body { margin:0; font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; background:#0f1115; color:#eef2ff; }
    header { padding:16px 18px; border-bottom:1px solid #2a3040; background:#11141b; }
    main { padding:12px; }
    h1 { font:700 19px/1.2 system-ui,-apple-system,Segoe UI,sans-serif; margin:0 0 4px; }
    section { background:#171a21; border:1px solid #2a3040; border-radius:10px; padding:12px; margin-bottom:12px; }
    pre { white-space:pre-wrap; background:#0d1016; border:1px solid #2a3040; border-radius:10px; padding:10px; overflow:auto; }
    .ok { color:#9dffb4; }
    .bad { color:#ff8b8b; }
  </style>
</head>
<body>
<header>
  <h1>42ndMind Maturity Objective Test</h1>
  <div>Smoke test for the non-mutating maturity objective sidecar.</div>
</header>
<main>
  <section><h2 id="summary">Running...</h2><pre id="out"></pre></section>
</main>
<script src="src/maturity-objective-v0-1.js?v=0.1.0"></script>
<script>
  const tests = [];
  function add(name, fn) { tests.push({ name, fn }); }
  function assert(condition, message) { if (!condition) throw new Error(message); }

  add('module loads at v0.1.0', () => {
    assert(window.MaturityObjectiveV01, 'MaturityObjectiveV01 missing');
    assert(MaturityObjectiveV01.VERSION === '0.1.0', 'wrong version');
  });

  add('null origin is not maturity', () => {
    const r = MaturityObjectiveV01.assess({ x:0, y:0, z:0 });
    assert(r.surface.is_null_origin === true, 'origin not detected');
    assert(r.classification === 'null_origin_not_maturity', 'origin classified incorrectly');
    assert(r.belief_state_effect.belief_movement === 'none', 'assessment moved belief');
  });

  add('active surface is recognized', () => {
    const r = MaturityObjectiveV01.assess({ x:0, y:1, z:0, evidence_count:3, source_registry_summary:{ available:true, source_count:2 }, gates:{ counter_consideration:1, non_strawman:1, self_correction:1, contradiction_handling:1, reality_contact:1, non_self_sealing:1 } });
    assert(r.surface.is_active_surface === true, 'active surface not recognized');
    assert(r.doctrine.objective_maturity_target.y === 1, 'maturity target missing');
  });

  add('no evidence caps maturity', () => {
    const r = MaturityObjectiveV01.assess({ x:0, y:1, z:0, source_registry_summary:{ available:true, source_count:1 }, gates:{ counter_consideration:1, non_strawman:1, self_correction:1, contradiction_handling:1, reality_contact:1, non_self_sealing:1 } });
    assert(r.caps.some(c => c.reason === 'no_evidence_grounding'), 'missing no-evidence cap');
    assert(r.lanes.capped_maturity_score <= 0.35, 'no-evidence cap not applied');
  });

  add('unresolved contradiction caps upward movement', () => {
    const r = MaturityObjectiveV01.assess({ x:0, y:1, z:0, evidence_count:3, source_registry_summary:{ available:true, source_count:1 }, unresolved_contradiction_count:1, gates:{ counter_consideration:1, non_strawman:1, self_correction:1, contradiction_handling:1, reality_contact:1, non_self_sealing:1 } });
    assert(r.caps.some(c => c.reason === 'unresolved_contradiction_pressure'), 'missing contradiction cap');
    assert(r.classification === 'unresolved_pressure_capped', 'wrong unresolved classification');
  });

  add('self sealing caps harder', () => {
    const r = MaturityObjectiveV01.assess({ x:0, y:1, z:0, evidence_count:3, source_registry_summary:{ available:true, source_count:1 }, self_sealing_flags:1, gates:{ counter_consideration:1, non_strawman:1, self_correction:1, contradiction_handling:1, reality_contact:1, non_self_sealing:1 } });
    assert(r.caps.some(c => c.reason === 'self_sealing_pressure'), 'missing self-sealing cap');
    assert(r.lanes.capped_maturity_score <= 0.45, 'self-sealing cap not applied');
  });

  add('peak requires clean pressure', () => {
    const ok = MaturityObjectiveV01.canPromotePeak({ x:0, y:1, z:0, evidence_count:3, supporting_evidence_count:3, attacking_evidence_count:1, source_registry_summary:{ available:true, source_count:2 }, gates:{ counter_consideration:1, non_strawman:1, self_correction:1, contradiction_handling:1, reality_contact:1, non_self_sealing:1 } });
    assert(ok === true, 'clean peak candidate not accepted');
  });

  const results = tests.map(t => {
    try { t.fn(); return { name:t.name, passed:true }; }
    catch (e) { return { name:t.name, passed:false, error:e.message }; }
  });
  const passed = results.filter(r => r.passed).length;
  document.getElementById('summary').className = passed === results.length ? 'ok' : 'bad';
  document.getElementById('summary').textContent = `${passed}/${results.length} passed`;
  document.getElementById('out').textContent = JSON.stringify(results, null, 2);
</script>
</body>
</html>
