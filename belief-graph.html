<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>42ndMind Belief Graph</title>
  <style>
    :root { --bg:#0f1115; --panel:#171a21; --muted:#8b93a7; --text:#eef2ff; --line:#2a3040; --accent:#9db6ff; --bad:#ff8b8b; --good:#9dffb4; --warn:#ffd28b; }
    * { box-sizing: border-box; }
    body { margin:0; font: 15px/1.45 system-ui, -apple-system, Segoe UI, sans-serif; background:var(--bg); color:var(--text); }
    header { padding:18px 22px; border-bottom:1px solid var(--line); background:#11141b; position:sticky; top:0; z-index:5; }
    h1 { font-size:20px; margin:0 0 4px; }
    .sub { color:var(--muted); font-size:13px; }
    main { max-width:1200px; margin:0 auto; padding:16px; }
    section { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:14px; }
    h2 { font-size:15px; margin:0 0 10px; color:#dfe6ff; }
    h3 { font-size:13px; color:#c7d3ff; margin:12px 0 6px; }
    button { background:#25345c; color:var(--text); border:1px solid #3f5592; padding:8px 10px; border-radius:8px; cursor:pointer; margin:4px 4px 4px 0; }
    button:hover { background:#304274; }
    a { color:var(--accent); }
    .grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap:10px; }
    .node { background:#10131a; border:1px solid var(--line); border-radius:10px; padding:10px; }
    .node.root { border-color:#9db6ff; }
    .node.claim { border-left:4px solid #9db6ff; }
    .node.contradiction { border-left:4px solid #ff8b8b; }
    .node.stance_cluster { border-left:4px solid #ffd28b; }
    .node.principle_cluster { border-left:4px solid #9dffb4; }
    .muted { color:var(--muted); }
    .small { font-size:12px; }
    .good { color:var(--good); }
    .bad { color:var(--bad); }
    .warn { color:var(--warn); }
    .pill { display:inline-block; border:1px solid var(--line); border-radius:999px; padding:2px 8px; margin:2px; font-size:12px; color:#d6ddf5; background:#11151d; }
    pre { white-space:pre-wrap; overflow:auto; background:#0d1016; border:1px solid var(--line); border-radius:10px; padding:10px; color:#dfe6ff; max-height:520px; }
    .edge { background:#0d1016; border:1px solid var(--line); border-radius:10px; padding:8px; margin:6px 0; }
  </style>
</head>
<body>
  <header>
    <h1>Belief Graph View</h1>
    <div class="sub">Local octahedron states feeding stance clusters and the main worldview aggregate. Uses the same v0.2 kernel as the live LLM brain console.</div>
  </header>

  <main>
    <section>
      <h2>Controls</h2>
      <a href="./llm-brain.html">Back to live brain</a> · <a href="./index.html">human kernel UI</a>
      <button onclick="loadGraph()">Reload graph</button>
      <button onclick="copyGraphContext()">Copy graph context</button>
      <span id="status" class="small muted"></span>
    </section>

    <section>
      <h2>Root worldview</h2>
      <div id="rootView"></div>
    </section>

    <section>
      <h2>Graph notes</h2>
      <div id="graphNotes"></div>
    </section>

    <section>
      <h2>Nodes by scope</h2>
      <div id="nodesView" class="grid"></div>
    </section>

    <section>
      <h2>Links / merge pressure</h2>
      <div id="linksView"></div>
    </section>

    <section>
      <h2>Raw beliefGraph</h2>
      <pre id="rawGraph"></pre>
    </section>
  </main>

  <script src="src/epistemic-kernel-v0-2.js"></script>
  <script>
    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
    }
    function fmt(n) { return Number(n || 0).toFixed(3); }
    function clsForY(y) { return Number(y || 0) > 0.1 ? 'good' : Number(y || 0) < -0.1 ? 'bad' : 'warn'; }
    function stateFromStorage() {
      const raw = localStorage.getItem('epistemic_kernel_v0_state');
      if (!raw) return null;
      const parsed = JSON.parse(raw);
      const kernel = new EpistemicKernel(parsed);
      return kernel.snapshot();
    }
    function nodeHtml(node, isRoot = false) {
      const p = node.octahedron?.point || {x:0,y:0,z:0};
      const sem = node.semantic || {};
      const l1 = Math.abs(Number(p.x || 0)) + Math.abs(Number(p.y || 0)) + Math.abs(Number(p.z || 0));
      const notes = (node.notes || []).map(note => `<div class="small muted">${escapeHtml(note)}</div>`).join('');
      return `<div class="node ${isRoot ? 'root' : ''} ${escapeHtml(node.type)}">
        <div><b>${escapeHtml(node.label)}</b></div>
        <div class="small muted">${escapeHtml(node.type)} · ${escapeHtml(node.scope)} · status: ${escapeHtml(node.status || '')} · weight: ${fmt(node.weight)}</div>
        <div style="margin-top:6px">
          <span class="pill">x ${fmt(p.x)}</span>
          <span class="pill ${clsForY(p.y)}">y ${fmt(p.y)}</span>
          <span class="pill">z ${fmt(p.z)}</span>
          <span class="pill">L1 ${fmt(l1)}</span>
        </div>
        <div class="small muted">semantic: a ${fmt(sem.a)}, s ${fmt(sem.s)}, b ${fmt(sem.b)}</div>
        ${node.parent_id ? `<div class="small muted">parent: ${escapeHtml(node.parent_id)}</div>` : ''}
        ${notes}
      </div>`;
    }
    function loadGraph() {
      const state = stateFromStorage();
      const status = document.getElementById('status');
      if (!state) {
        status.textContent = 'No saved kernel state found. Open llm-brain.html or index.html and ingest something first.';
        return;
      }
      const graph = state.beliefGraph || { nodes: [], links: [], notes: [] };
      const root = graph.nodes.find(n => n.id === graph.root_id) || graph.nodes.find(n => n.type === 'main_worldview');
      document.getElementById('rootView').innerHTML = root ? nodeHtml(root, true) : '<div class="muted">No root node found.</div>';
      document.getElementById('graphNotes').innerHTML = (graph.notes || []).length
        ? graph.notes.map(note => `<div class="pill">${escapeHtml(note)}</div>`).join('')
        : '<div class="muted">No graph notes.</div>';
      document.getElementById('nodesView').innerHTML = (graph.nodes || [])
        .filter(n => n.id !== graph.root_id)
        .map(n => nodeHtml(n, false))
        .join('') || '<div class="muted">No child nodes yet.</div>';
      document.getElementById('linksView').innerHTML = (graph.links || []).map(link => `<div class="edge">
        <div><b>${escapeHtml(link.from)}</b> → <b>${escapeHtml(link.to)}</b></div>
        <div class="small">relation: <span class="pill ${link.relation === 'pressure_against_parent' ? 'bad' : link.relation === 'aligned_can_reinforce_parent' ? 'good' : 'warn'}">${escapeHtml(link.relation)}</span></div>
        <div class="small muted">child_y: ${fmt(link.child_y)} · parent_y: ${fmt(link.parent_y)}</div>
      </div>`).join('') || '<div class="muted">No links yet.</div>';
      document.getElementById('rawGraph').textContent = JSON.stringify(graph, null, 2);
      status.textContent = `Loaded ${graph.nodes?.length || 0} node(s), ${graph.links?.length || 0} link(s).`;
    }
    async function copyGraphContext() {
      const state = stateFromStorage();
      if (!state) return;
      const packet = {
        packet_type: 'epistemic_kernel_belief_graph_context',
        created_at: new Date().toISOString(),
        purpose: 'Paste this into an LLM so it can inspect the hierarchical belief graph.',
        graph: state.beliefGraph,
        root_octahedron: state.octahedron,
        semantic: state.semantic,
        counts: {
          claims: state.claims?.length || 0,
          evidence: state.evidence?.length || 0,
          contradictions: state.contradictions?.length || 0,
          questions: state.questions?.filter(q => q.status === 'open').length || 0,
          principles: state.principles?.length || 0,
        },
      };
      const text = JSON.stringify(packet, null, 2);
      try {
        await navigator.clipboard.writeText(text);
        document.getElementById('status').textContent = `Copied graph context (${text.length.toLocaleString()} chars).`;
      } catch (err) {
        document.getElementById('rawGraph').textContent = text;
        document.getElementById('status').textContent = 'Could not auto-copy. Graph context placed in raw box.';
      }
    }
    loadGraph();
  </script>
</body>
</html>
