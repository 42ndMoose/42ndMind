<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>42ndMind Intention Concept Expansion Loop Test</title><style>body{margin:0;background:#0f1115;color:#eef2ff;font:14px ui-monospace,Menlo,Consolas,monospace}header{padding:16px;background:#11141b;border-bottom:1px solid #2a3040}main{padding:12px}section{background:#171a21;border:1px solid #2a3040;border-radius:10px;padding:12px}pre{white-space:pre-wrap;background:#0d1016;border:1px solid #2a3040;border-radius:10px;padding:10px;overflow:auto;max-height:760px}.ok{color:#9dffb4}.bad{color:#ff8b8b}a{color:#9db6ff}</style></head><body><header><h1>42ndMind Intention Concept Expansion Loop Test</h1><div>Tests expanded intention concepts through discovery, refinement, necessity, lattice, invariance, and formula compilation.</div></header><main><section><h2 id="summary">Running...</h2><div><a href="intention-concept-expansion.html?v=expansion-2">concept expansion page</a></div><pre id="out"></pre></section></main><script src="src/kernel-intention-discovery-v0-1.js?v=intent-1"></script><script src="src/kernel-intention-refinement-v0-1.js?v=refine-1"></script><script src="src/kernel-intention-necessity-test-v0-1.js?v=necessity-1"></script><script src="src/kernel-intention-neighbor-lattice-v0-1.js?v=lattice-3"></script><script src="src/kernel-intention-lattice-invariance-benchmark-v0-1.js?v=invariance-2"></script><script src="src/kernel-intention-formula-compiler-v0-1.js?v=formula-1"></script><script src="src/kernel-intention-concept-expansion-loop-v0-1.js?v=expansion-1"></script><script>const tests=[];let packet=null;function add(n,f){tests.push({name:n,fn:f})}function assert(c,m){if(!c)throw new Error(m)}function arr(v){return Array.isArray(v)?v:[]}function formula(name){return arr(packet&&packet.compiled_packet&&packet.compiled_packet.compiled_formulas).find(f=>f.concept===name)}function l1(f){return Number(arr(f&&f.shape_terms).reduce((s,t)=>s+Math.abs(Number(t.coefficient)||0),0).toFixed(6))}add('modules load',()=>{assert(window.KernelIntentionConceptExpansionLoopV01,'expansion loop missing');assert(KernelIntentionConceptExpansionLoopV01.VERSION==='0.1.0','version wrong');assert(typeof KernelIntentionConceptExpansionLoopV01.runExpansion==='function','runExpansion missing')});add('doctrine keeps expansion candidate-only',()=>{const d=KernelIntentionConceptExpansionLoopV01.doctrine();assert(d.expands_intention_concepts_not_claim_facts===true,'expansion doctrine missing');assert(d.no_real_world_intent_attribution===true,'attribution guard missing');assert(d.expanded_concepts_are_candidate_not_doctrine===true,'candidate guard missing');assert(d.force_intensity_outside_shape==='F = M · i','force guard missing');assert(d.belief_movement==='none','belief movement wrong')});add('expansion loop runs full pipeline',()=>{packet=KernelIntentionConceptExpansionLoopV01.runExpansion();assert(packet.ok===true,'packet not ok: '+JSON.stringify(packet.validation));assert(packet.expanded_concept_count===11,'expected 11 concepts');assert(packet.source_summary.discovery_ok===true,'discovery not ok');assert(packet.source_summary.refinement_ok===true,'refinement not ok');assert(packet.source_summary.necessity_ok===true,'necessity not ok');assert(packet.source_summary.lattice_ok===true,'lattice not ok');assert(packet.source_summary.invariance_ok===true,'invariance not ok');assert(packet.source_summary.compiler_ok===true,'compiler not ok');assert(packet.belief_movement==='none','packet moved belief')});add('expected concepts are present',()=>{['consent','threat','request','refusal','trust','betrayal','doubt','belief','fear','coercion','manipulation'].forEach(name=>{assert(packet.expanded_concepts.includes(name),'missing expanded concept '+name);assert(formula(name),'missing compiled formula '+name)})});add('compiled formulas are unit-total and candidate-only',()=>{arr(packet.compiled_packet.compiled_formulas).forEach(f=>{assert(f.scope_total===1,f.concept+' scope not 1');assert(l1(f)===1,f.concept+' l1 not 1: '+l1(f));assert(f.review_status==='compiled_candidate_not_doctrine',f.concept+' promoted too early');assert(f.belief_movement==='none',f.concept+' moved belief');assert(f.symbolic_formula.includes('Σ|dimension_i| = 1'),f.concept+' missing unit-total formula');assert(f.symbolic_formula.includes('F_'+f.concept),f.concept+' missing force equation')})});add('force stays outside expanded formulas',()=>{arr(packet.compiled_packet.compiled_formulas).forEach(f=>{const shapeNames=new Set(arr(f.shape_terms).map(t=>t.dimension));assert(arr(f.force_terms).length===1,f.concept+' should have exactly one force term');arr(f.force_terms).forEach(force=>{assert(!shapeNames.has(force.dimension),f.concept+' force leaked into shape: '+force.dimension);assert(force.role==='force_intensity_outside_shape',f.concept+' wrong force role')})})});add('invariance and lattice outputs exist for expanded concepts',()=>{assert(packet.invariance_packet&&packet.invariance_packet.ok===true,'expanded invariance not ok');assert(packet.invariance_packet.case_count===11,'expected 11 invariance cases');assert(packet.invariance_packet.passed_case_count===11,'not all invariance cases passed');assert(packet.lattice_packet&&packet.lattice_packet.ok===true,'expanded lattice not ok');assert(packet.lattice_packet.summary.source_concept_count===11,'lattice source count wrong');assert(packet.lattice_packet.summary.edge_count>=55,'lattice edge count too low');arr(packet.compiled_packet.compiled_formulas).forEach(f=>{assert(arr(f.neighbor_transitions).length>=5,f.concept+' too few neighbor transitions');assert(f.invariance_status&&f.invariance_status.all_tested_cases_passed===true,f.concept+' invariance status not passed')})});add('validation report is clean',()=>{assert(packet.validation&&packet.validation.ok===true,'expansion validation not ok');assert(arr(packet.validation.errors).length===0,'expansion validation errors');assert(packet.compiled_packet.validation&&packet.compiled_packet.validation.ok===true,'compiler validation not ok');packet.compiled_packet.validation.validations.forEach(v=>{assert(v.ok===true,v.concept+' validation failed: '+v.errors.join(','));assert(v.shape_l1_total===1,v.concept+' validation l1 wrong');assert(v.force_term_count===1,v.concept+' validation force count wrong');assert(v.neighbor_transition_count>=5,v.concept+' validation transition count low')})});(async function run(){const results=[];for(const t of tests){try{await t.fn();results.push({name:t.name,passed:true})}catch(e){results.push({name:t.name,passed:false,error:e.message})}}const passed=results.filter(r=>r.passed).length;document.getElementById('summary').className=passed===tests.length?'ok':'bad';document.getElementById('summary').textContent=passed+'/'+tests.length+' passed';document.getElementById('out').textContent=JSON.stringify({packet_type:'42ndMind_intention_concept_expansion_loop_test_report_v0_1',ok:passed===tests.length,expanded_concept_count:packet&&packet.expanded_concept_count,expanded_concepts:packet&&packet.expanded_concepts,source_summary:packet&&packet.source_summary,lattice_summary:packet&&packet.lattice_packet&&packet.lattice_packet.summary,invariance_summary:packet&&{case_count:packet.invariance_packet.case_count,passed_case_count:packet.invariance_packet.passed_case_count},compiled_formula_count:packet&&packet.compiled_packet&&packet.compiled_packet.compiled_formula_count,validation:packet&&packet.validation,results},null,2)})();</script></body></html>
