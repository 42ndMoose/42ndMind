<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>42ndMind Intention Minimal-Pair Library Test</title><style>body{margin:0;background:#0f1115;color:#eef2ff;font:14px ui-monospace,Menlo,Consolas,monospace}header{padding:16px;background:#11141b;border-bottom:1px solid #2a3040}main{padding:12px}section{background:#171a21;border:1px solid #2a3040;border-radius:10px;padding:12px}pre{white-space:pre-wrap;background:#0d1016;border:1px solid #2a3040;border-radius:10px;padding:10px;overflow:auto;max-height:760px}.ok{color:#9dffb4}.bad{color:#ff8b8b}a{color:#9db6ff}</style></head><body><header><h1>42ndMind Intention Minimal-Pair Library Test</h1><div>Tests contrast-pair pressure generated from proof-output steps. Candidate only.</div></header><main><section><h2 id="summary">Running...</h2><div><a href="intention-minimal-pair-library.html?v=minpair-1">minimal-pair library page</a></div><pre id="out"></pre></section></main><script src="src/kernel-intention-discovery-v0-1.js?v=intent-1"></script><script src="src/kernel-intention-refinement-v0-1.js?v=refine-1"></script><script src="src/kernel-intention-necessity-test-v0-1.js?v=necessity-1"></script><script src="src/kernel-intention-neighbor-lattice-v0-1.js?v=lattice-3"></script><script src="src/kernel-intention-lattice-invariance-benchmark-v0-1.js?v=invariance-2"></script><script src="src/kernel-intention-formula-compiler-v0-1.js?v=formula-1"></script><script src="src/kernel-intention-concept-expansion-loop-v0-1.js?v=expansion-2"></script><script src="src/kernel-intention-contradiction-refinement-loop-v0-1.js?v=contradiction-1"></script><script src="src/kernel-intention-formula-revision-engine-v0-1.js?v=revision-1"></script><script src="src/kernel-intention-canonical-formula-ledger-v0-1.js?v=ledger-1"></script><script src="src/kernel-intention-proof-output-v0-1.js?v=proof-1"></script><script src="src/kernel-intention-minimal-pair-library-v0-1.js?v=minpair-1"></script><script>const tests=[];let packet=null;function add(n,f){tests.push({name:n,fn:f})}function assert(c,m){if(!c)throw new Error(m)}function arr(v){return Array.isArray(v)?v:[]}function pairs(){return arr(packet&&packet.minimal_pairs)}function groups(){return arr(packet&&packet.concept_groups)}add('modules load and doctrine is minimal-pair only',()=>{assert(window.KernelIntentionMinimalPairLibraryV01,'minimal-pair library missing');assert(KernelIntentionMinimalPairLibraryV01.VERSION==='0.1.0','version wrong');assert(typeof KernelIntentionMinimalPairLibraryV01.runMinimalPairLibrary==='function','runMinimalPairLibrary missing');const d=KernelIntentionMinimalPairLibraryV01.doctrine();assert(d.stores_minimal_pairs_for_formula_pressure===true,'pair pressure doctrine missing');assert(d.minimal_pairs_are_candidate_tests_not_doctrine===true,'candidate guard missing');assert(d.minimal_pairs_do_not_change_formulas===true,'formula mutation guard missing');assert(d.minimal_pairs_do_not_promote_versions===true,'promotion guard missing');assert(d.force_intensity_outside_shape==='F = M · i','force guard missing');assert(d.belief_movement==='none','belief movement wrong')});add('library runs from proof output',()=>{packet=KernelIntentionMinimalPairLibraryV01.runMinimalPairLibrary();assert(packet.ok===true,'packet not ok: '+JSON.stringify(packet.validation));assert(packet.source_proof_ok===true,'source proof not ok');assert(packet.source_proof_count===11,'expected 11 source proofs');assert(packet.source_proof_step_count===55,'expected 55 source proof steps');assert(packet.belief_movement==='none','packet moved belief')});add('eleven concepts and one hundred ten pairs are produced',()=>{assert(packet.concept_count===11,'expected 11 concepts');assert(packet.minimal_pair_count===110,'expected 110 minimal pairs');assert(groups().length===11,'expected 11 groups');assert(pairs().length===110,'expected 110 pair rows');assert(packet.validation.checks.eleven_concepts===true,'eleven concept check failed');assert(packet.validation.checks.one_hundred_ten_pairs===true,'110 pair check failed')});add('each concept has ten pairs split across two pair types',()=>{groups().forEach(g=>{assert(g.pair_count===10,g.concept+' pair count wrong: '+g.pair_count);assert(g.structural_contrast_count===5,g.concept+' structural count wrong');assert(g.dimension_absence_count===5,g.concept+' absence count wrong');assert(g.belief_movement==='none',g.concept+' moved belief')});assert(packet.validation.checks.ten_pairs_per_concept===true,'ten pairs per concept check failed')});add('all pairs are traceable to proof steps',()=>{pairs().forEach(p=>{assert(p.source_proof_id&&p.source_proof_id.length>0,p.pair_id+' missing source proof');assert(p.source_step_id&&p.source_step_id.length>0,p.pair_id+' missing source step');assert(p.expected_transition&&p.expected_transition.includes('->'),p.pair_id+' missing transition');assert(p.pressure_dimension&&p.pressure_dimension.length>0,p.pair_id+' missing pressure dimension');assert(p.expected_neighbor&&p.expected_neighbor.length>0,p.pair_id+' missing neighbor');assert(p.prompt&&p.prompt.includes('?'),p.pair_id+' missing prompt')});assert(packet.validation.checks.all_pairs_valid===true,'all pairs valid check failed')});add('all L1 totals remain 1',()=>{pairs().forEach(p=>assert(p.observed_l1_total===1,p.pair_id+' l1 wrong: '+p.observed_l1_total));assert(packet.validation.checks.all_l1_totals_equal_1===true,'packet l1 check failed')});add('force terms remain outside shape',()=>{pairs().forEach(p=>assert(p.force_terms_outside_shape===true,p.pair_id+' force leaked into shape'));assert(packet.validation.checks.force_terms_outside_shape===true,'packet force separation check failed')});add('candidate-only status and belief movement are preserved',()=>{pairs().forEach(p=>{assert(p.promotion_status==='not_promoted',p.pair_id+' promoted');assert(p.doctrine_status==='candidate_not_doctrine',p.pair_id+' doctrine status wrong');assert(p.belief_movement==='none',p.pair_id+' moved belief')});assert(packet.validation.checks.candidate_only_not_promoted===true,'candidate-only check failed');assert(packet.validation.checks.belief_movement_none===true,'belief movement check failed');assert(arr(packet.validation.errors).length===0,'validation errors present: '+packet.validation.errors.join(','))});(async function run(){const results=[];for(const t of tests){try{await t.fn();results.push({name:t.name,passed:true})}catch(e){results.push({name:t.name,passed:false,error:e.message})}}const passed=results.filter(r=>r.passed).length;document.getElementById('summary').className=passed===tests.length?'ok':'bad';document.getElementById('summary').textContent=passed+'/'+tests.length+' passed';document.getElementById('out').textContent=JSON.stringify({packet_type:'42ndMind_intention_minimal_pair_library_test_report_v0_1',ok:passed===tests.length,source_proof_count:packet&&packet.source_proof_count,source_proof_step_count:packet&&packet.source_proof_step_count,concept_count:packet&&packet.concept_count,minimal_pair_count:packet&&packet.minimal_pair_count,concept_groups:groups().map(g=>({concept:g.concept,pair_count:g.pair_count,structural_contrast_count:g.structural_contrast_count,dimension_absence_count:g.dimension_absence_count})),validation:packet&&packet.validation,results},null,2)})();</script></body></html>
