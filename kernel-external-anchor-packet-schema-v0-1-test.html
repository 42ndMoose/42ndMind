<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>42ndMind External Anchor Packet Schema Test v0.1</title><style>body{margin:0;background:#0f1115;color:#eef2ff;font:14px ui-monospace,Menlo,Consolas,monospace}header{padding:16px;background:#11141b;border-bottom:1px solid #2a3040}main{padding:12px}section{background:#171a21;border:1px solid #2a3040;border-radius:10px;padding:12px}pre{white-space:pre-wrap;background:#0d1016;border:1px solid #2a3040;border-radius:10px;padding:10px;overflow:auto;max-height:760px}.ok{color:#9dffb4}.bad{color:#ff8b8b}a{color:#9db6ff}</style></head><body><header><h1>42ndMind External Anchor Packet Schema Test v0.1</h1><div>Validates modular anchors for entities, events, dates, sources, evidence, and claim bridges. No LLM. No lookup.</div></header><main><section><h2 id="summary">Running...</h2><div><a href="external-anchor-packet-schema.html?v=anchor-1">external anchor packet schema page</a></div><pre id="out"></pre></section></main><script src="src/kernel-external-anchor-packet-schema-v0-1.js?v=anchor-1"></script><script>const tests=[];let packet=null;function add(n,f){tests.push({name:n,fn:f})}function assert(c,m){if(!c)throw new Error(m)}function arr(v){return Array.isArray(v)?v:[]}function validation(){return packet&&packet.validation||{}}function summary(){return packet&&packet.summary||{}}function anchorPacket(){return packet&&packet.anchor_packet||{}}add('module loads and doctrine keeps anchors modular',()=>{assert(window.KernelExternalAnchorPacketSchemaV01,'external anchor module missing');assert(KernelExternalAnchorPacketSchemaV01.VERSION==='0.1.0','version wrong');assert(typeof KernelExternalAnchorPacketSchemaV01.runAnchorSchema==='function','runAnchorSchema missing');assert(typeof KernelExternalAnchorPacketSchemaV01.buildClaimLanguageInputFromBridge==='function','bridge builder missing');const d=KernelExternalAnchorPacketSchemaV01.doctrine();assert(d.external_anchors_are_modular_not_formula_language===true,'modular anchor doctrine missing');assert(d.anchor_packets_are_context_not_truth===true,'context-not-truth doctrine missing');assert(d.source_lookup_is_not_automatic===true,'lookup guard missing');assert(d.llm_is_not_required===true,'LLM guard missing');assert(d.belief_movement==='none','belief movement wrong')});add('anchor schema runs and validates demo packet',()=>{packet=KernelExternalAnchorPacketSchemaV01.runAnchorSchema();assert(packet.ok===true,'packet not ok: '+JSON.stringify(validation()));assert(packet.llm_used===false,'packet used LLM');assert(packet.lookup_performed===false,'packet performed lookup');assert(packet.belief_movement==='none','packet moved belief');assert(validation().ok===true,'validation not ok')});add('anchor counts match schema baseline',()=>{assert(summary().entity_count===4,'expected 4 entities');assert(summary().event_count===4,'expected 4 events');assert(summary().date_count===3,'expected 3 dates');assert(summary().source_count===4,'expected 4 sources');assert(summary().evidence_count===5,'expected 5 evidence items');assert(summary().claim_bridge_count===2,'expected 2 claim bridges');assert(validation().checks.four_entities===true,'entity count check failed');assert(validation().checks.four_events===true,'event count check failed');assert(validation().checks.three_dates===true,'date count check failed');assert(validation().checks.four_sources===true,'source count check failed');assert(validation().checks.five_evidence_items===true,'evidence count check failed');assert(validation().checks.two_claim_bridges===true,'claim bridge count check failed')});add('all anchor references resolve',()=>{assert(validation().checks.all_anchor_refs_resolve===true,'reference resolution failed');arr(validation().anchor_validations).forEach(v=>assert(v.ok===true,v.anchor_kind+':'+v.anchor_id+' failed '+arr(v.errors).join(','))) });add('user context is not auto-truth',()=>{assert(validation().checks.user_context_not_auto_truth===true,'user context auto-truth risk');arr(anchorPacket().events).forEach(e=>assert(e.trust_posture==='not_auto_truth',e.event_id+' auto-truth risk'));arr(anchorPacket().claim_bridge_examples).forEach(b=>assert(b.bridge_status==='structured_context_bridge_not_truth',b.claim_id+' bridge auto-truth risk'))});add('source lookup, media lookup, and LLM use remain false',()=>{assert(validation().checks.source_lookup_not_performed===true,'source lookup check failed');assert(validation().checks.media_lookup_not_performed===true,'media lookup check failed');assert(validation().checks.no_llm_used===true,'no LLM check failed');arr(anchorPacket().sources).forEach(s=>assert(s.lookup_performed===false,s.source_id+' lookup performed'));arr(anchorPacket().evidence).forEach(e=>assert(e.media_lookup_performed===false,e.evidence_id+' media lookup performed'))});add('claim bridge projection creates claim-language input without truth promotion',()=>{const ap=anchorPacket();const claim=KernelExternalAnchorPacketSchemaV01.buildClaimLanguageInputFromBridge(ap,'claim_physical_contact_after_argument');assert(claim,'claim bridge projection missing');assert(claim.claim_id==='claim_physical_contact_after_argument','claim id wrong');assert(arr(claim.context.entities).length===2,'projected entity count wrong');assert(arr(claim.context.events).length===2,'projected event count wrong');assert(arr(claim.evidence).length===1,'projected evidence count wrong');assert(claim.bridge_status==='structured_context_bridge_not_truth','projected bridge status wrong');assert(claim.llm_used===false,'projected claim used LLM');assert(claim.external_lookup_performed===false,'projected claim performed lookup');assert(claim.belief_movement==='none','projected claim moved belief')});add('candidate-only status and belief movement are preserved',()=>{assert(anchorPacket().promotion_status==='not_promoted','packet promoted');assert(anchorPacket().doctrine_status==='candidate_not_doctrine','packet doctrine status wrong');assert(anchorPacket().belief_movement==='none','packet moved belief');assert(validation().checks.candidate_only_not_promoted===true,'candidate-only check failed');assert(validation().checks.belief_movement_none===true,'belief movement check failed');assert(arr(validation().errors).length===0,'validation errors present: '+validation().errors.join(','))});(async function run(){const results=[];for(const t of tests){try{await t.fn();results.push({name:t.name,passed:true})}catch(e){results.push({name:t.name,passed:false,error:e.message})}}const passed=results.filter(r=>r.passed).length;document.getElementById('summary').className=passed===tests.length?'ok':'bad';document.getElementById('summary').textContent=passed+'/'+tests.length+' passed';document.getElementById('out').textContent=JSON.stringify({packet_type:'42ndMind_external_anchor_packet_schema_test_report_v0_1',ok:passed===tests.length,summary:summary(),validation:validation(),claim_bridge_projection:packet?KernelExternalAnchorPacketSchemaV01.buildClaimLanguageInputFromBridge(anchorPacket(),'claim_physical_contact_after_argument'):null,results},null,2)})();</script></body></html>
