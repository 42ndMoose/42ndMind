<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>42ndMind Unified Formula Inspector Test v0.1.1</title><style>body{margin:0;background:#0f1115;color:#eef2ff;font:14px ui-monospace,Menlo,Consolas,monospace}header{padding:16px;background:#11141b;border-bottom:1px solid #2a3040}main{padding:12px}section{background:#171a21;border:1px solid #2a3040;border-radius:10px;padding:12px}pre{white-space:pre-wrap;background:#0d1016;border:1px solid #2a3040;border-radius:10px;padding:10px;overflow:auto;max-height:760px}.ok{color:#9dffb4}.bad{color:#ff8b8b}a{color:#9db6ff}</style></head><body><header><h1>42ndMind Unified Formula Inspector Test v0.1.1</h1><div>Tests one read-only inspector view for canonical ledger concepts and admitted candidate meanings.</div></header><main><section><h2 id="summary">Running...</h2><div><a href="intention-formula-inspector-v0-1-1.html?v=inspect-2">unified formula inspector page</a></div><pre id="out"></pre></section></main><script src="src/kernel-intention-discovery-v0-1.js?v=intent-1"></script><script src="src/kernel-intention-refinement-v0-1.js?v=refine-1"></script><script src="src/kernel-intention-necessity-test-v0-1.js?v=necessity-1"></script><script src="src/kernel-intention-neighbor-lattice-v0-1.js?v=lattice-3"></script><script src="src/kernel-intention-lattice-invariance-benchmark-v0-1.js?v=invariance-2"></script><script src="src/kernel-intention-formula-compiler-v0-1.js?v=formula-1"></script><script src="src/kernel-intention-concept-expansion-loop-v0-1.js?v=expansion-2"></script><script src="src/kernel-intention-contradiction-refinement-loop-v0-1.js?v=contradiction-1"></script><script src="src/kernel-intention-formula-revision-engine-v0-1.js?v=revision-1"></script><script src="src/kernel-intention-canonical-formula-ledger-v0-1.js?v=ledger-1"></script><script src="src/kernel-intention-proof-output-v0-1.js?v=proof-1"></script><script src="src/kernel-intention-minimal-pair-library-v0-1.js?v=minpair-1"></script><script src="src/kernel-intention-dimension-splitting-v0-1.js?v=split-2"></script><script src="src/kernel-intention-coefficient-dimension-revision-engine-v0-1.js?v=codim-1"></script><script src="src/kernel-intention-canonical-formula-ledger-v0-1-1-patch.js?v=ledger-2"></script><script src="src/kernel-intention-formula-inspector-v0-1.js?v=inspect-1"></script><script src="src/kernel-concept-admission-registry-v0-1.js?v=admit-1"></script><script src="src/kernel-intention-formula-inspector-v0-1-1-patch.js?v=inspect-2"></script><script>const tests=[];let packet=null;function add(n,f){tests.push({name:n,fn:f})}function assert(c,m){if(!c)throw new Error(m)}function arr(v){return Array.isArray(v)?v:[]}function records(){return arr(packet&&packet.formula_records)}function canonical(){return arr(packet&&packet.canonical_records)}function admitted(){return arr(packet&&packet.admitted_records)}function validation(){return packet&&packet.validation||{}}function byConcept(c){return records().find(r=>r.concept===c)}add('modules load and doctrine is unified inspector only',()=>{assert(window.KernelIntentionFormulaInspectorV01,'base inspector missing');assert(window.KernelConceptAdmissionRegistryV01,'admission registry missing');assert(window.KernelUnifiedFormulaInspectorV011,'unified inspector missing');assert(KernelUnifiedFormulaInspectorV011.VERSION==='0.1.1','version wrong');assert(typeof KernelUnifiedFormulaInspectorV011.inspectAllUnified==='function','inspectAllUnified missing');const d=KernelUnifiedFormulaInspectorV011.doctrine();assert(d.unified_inspector_shows_canonical_and_admitted_meanings===true,'unified doctrine missing');assert(d.canonical_formulas_remain_separate_from_admitted_candidate_formulas===true,'separation doctrine missing');assert(d.admitted_meanings_are_candidate_not_doctrine===true,'admitted candidate doctrine missing');assert(d.no_admitted_formula_auto_promotes_to_canonical_ledger===true,'no auto-promotion doctrine missing');assert(d.no_llm===true,'no LLM doctrine missing');assert(d.no_source_lookup===true,'no lookup doctrine missing');assert(d.belief_movement==='none','belief movement wrong')});add('unified inspector runs from formula inspector and admission registry',()=>{packet=KernelUnifiedFormulaInspectorV011.inspectAllUnified();assert(packet.ok===true,'packet not ok: '+JSON.stringify(validation()));assert(packet.source_formula_inspector_ok===true,'source formula inspector not ok');assert(packet.source_admission_registry_ok===true,'source admission registry not ok');assert(packet.canonical_count===11,'expected 11 canonical records');assert(packet.admitted_count===6,'expected 6 admitted records');assert(packet.total_formula_record_count===17,'expected 17 total records');assert(packet.llm_used===false,'packet used LLM');assert(packet.external_lookup_performed===false,'packet performed lookup');assert(packet.belief_movement==='none','packet moved belief')});add('canonical and admitted formula layers remain separate',()=>{canonical().forEach(r=>{assert(r.record_type==='canonical_formula',r.concept+' canonical record type wrong');assert(r.formula_origin_layer==='canonical_formula_ledger',r.concept+' canonical origin wrong');assert(r.proof_reference&&r.proof_reference.proof_id,r.concept+' canonical proof missing')});admitted().forEach(r=>{assert(r.record_type==='admitted_candidate_formula',r.concept+' admitted record type wrong');assert(r.formula_origin_layer==='concept_admission_registry',r.concept+' admitted origin wrong');assert(r.proof_reference===null,r.concept+' admitted record should not fake proof');assert(arr(r.source_formula_snapshots).length>=1,r.concept+' source snapshots missing')});assert(validation().checks.canonical_and_admitted_layers_separate===true,'layer separation check failed');assert(validation().checks.no_fake_proof_for_admitted_records===true,'fake proof check failed')});add('all expected concepts and admitted meanings are inspectable',()=>{['consent','threat','request','refusal','trust','betrayal','doubt','belief','fear','coercion','manipulation'].forEach(c=>assert(byConcept(c),c+' canonical concept missing'));['permission','warning','skepticism','loyalty','pressure','deception'].forEach(c=>assert(byConcept(c),c+' admitted meaning missing'));assert(validation().checks.eleven_canonical_records===true,'canonical count check failed');assert(validation().checks.six_admitted_records===true,'admitted count check failed');assert(validation().checks.seventeen_total_formula_records===true,'total count check failed')});add('all formulas preserve L1 and force separation',()=>{records().forEach(r=>{assert(r.current_candidate&&r.current_candidate.symbolic_formula,r.concept+' symbolic formula missing');assert(r.current_candidate.l1_total===1,r.concept+' L1 wrong: '+r.current_candidate.l1_total);assert(r.current_candidate.force_terms_outside_shape===true,r.concept+' force leaked into shape')});assert(validation().checks.all_l1_totals_equal_1===true,'L1 check failed');assert(validation().checks.all_force_terms_outside_shape===true,'force check failed')});add('admitted records expose source snapshots and revision hooks',()=>{const hookRecords=admitted().filter(r=>arr(r.contradiction_notes).length>0);assert(hookRecords.length>=1,'expected admitted records with hooks');hookRecords.forEach(r=>assert(arr(r.revision_hooks).length===arr(r.contradiction_notes).length,r.concept+' hook mismatch'));assert(validation().checks.admitted_source_snapshots_present===true,'source snapshot check failed');assert(validation().checks.admission_revision_hooks_visible===true,'revision hooks check failed')});add('selected inspection finds canonical and admitted records',()=>{const selectedCanonical=KernelUnifiedFormulaInspectorV011.inspectConceptUnified('consent',{unified_packet:packet});assert(selectedCanonical.ok===true,'selected consent failed');assert(selectedCanonical.match_count===1,'selected consent count wrong');assert(selectedCanonical.matches[0].record_type==='canonical_formula','selected consent not canonical');const selectedAdmitted=KernelUnifiedFormulaInspectorV011.inspectConceptUnified('permission',{unified_packet:packet});assert(selectedAdmitted.ok===true,'selected permission failed');assert(selectedAdmitted.match_count===1,'selected permission count wrong');assert(selectedAdmitted.matches[0].record_type==='admitted_candidate_formula','selected permission not admitted');const missing=KernelUnifiedFormulaInspectorV011.inspectConceptUnified('not_registered',{unified_packet:packet});assert(missing.ok===false,'missing concept should not inspect');assert(missing.match_count===0,'missing concept count wrong')});add('no LLM, no lookup, candidate-only status, and belief movement are preserved',()=>{records().forEach(r=>{assert(r.llm_used===false,r.concept+' used LLM');assert(r.external_lookup_performed===false,r.concept+' performed lookup');assert(r.promotion_status==='not_promoted',r.concept+' promoted');assert(r.doctrine_status==='candidate_not_doctrine',r.concept+' doctrine status wrong');assert(r.belief_movement==='none',r.concept+' moved belief')});assert(validation().checks.no_llm_used===true,'no LLM check failed');assert(validation().checks.no_external_lookup===true,'no lookup check failed');assert(validation().checks.candidate_only_not_promoted===true,'candidate-only check failed');assert(validation().checks.belief_movement_none===true,'belief movement check failed');assert(arr(validation().errors).length===0,'validation errors present: '+validation().errors.join(','))});(async function run(){const results=[];for(const t of tests){try{await t.fn();results.push({name:t.name,passed:true})}catch(e){results.push({name:t.name,passed:false,error:e.message})}}const passed=results.filter(r=>r.passed).length;document.getElementById('summary').className=passed===tests.length?'ok':'bad';document.getElementById('summary').textContent=passed+'/'+tests.length+' passed';document.getElementById('out').textContent=JSON.stringify({packet_type:'42ndMind_unified_formula_inspector_test_report_v0_1_1',ok:passed===tests.length,canonical_count:packet&&packet.canonical_count,admitted_count:packet&&packet.admitted_count,total_formula_record_count:packet&&packet.total_formula_record_count,records:records().map(r=>({concept:r.concept,record_type:r.record_type,formula_origin_layer:r.formula_origin_layer,current_candidate_version:r.current_candidate_version,l1_total:r.current_candidate&&r.current_candidate.l1_total,force_terms_outside_shape:r.current_candidate&&r.current_candidate.force_terms_outside_shape,revision_hook_count:arr(r.revision_hooks).length,promotion_status:r.promotion_status,belief_movement:r.belief_movement})),validation:validation(),results},null,2)})();</script></body></html>
