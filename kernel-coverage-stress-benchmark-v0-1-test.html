<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>42ndMind Coverage Stress Benchmark Test v0.1</title><style>body{margin:0;background:#0f1115;color:#eef2ff;font:14px ui-monospace,Menlo,Consolas,monospace}header{padding:16px;background:#11141b;border-bottom:1px solid #2a3040}main{padding:12px}section{background:#171a21;border:1px solid #2a3040;border-radius:10px;padding:12px}pre{white-space:pre-wrap;background:#0d1016;border:1px solid #2a3040;border-radius:10px;padding:10px;overflow:auto;max-height:760px}.ok{color:#9dffb4}.bad{color:#ff8b8b}a{color:#9db6ff}</style></head><body><header><h1>42ndMind Coverage Stress Benchmark Test v0.1</h1><div>Tests meta-grammar coverage against fake exact meaning, literalization, drift, and hallucination.</div></header><main><section><h2 id="summary">Running...</h2><div><a href="coverage-stress-benchmark.html?v=coverstress-1">coverage stress benchmark page</a></div><pre id="out"></pre></section></main><script src="src/kernel-objective-claim-language-v0-1.js?v=claim-1"></script><script src="src/kernel-objective-claim-language-v0-1-1-patch.js?v=claim-2"></script><script src="src/kernel-external-anchor-packet-schema-v0-1.js?v=anchor-1"></script><script src="src/kernel-source-provenance-registry-v0-1.js?v=prov-1"></script><script src="src/kernel-evidence-media-registry-v0-1.js?v=evidence-1"></script><script src="src/kernel-truth-pressure-synthesis-v0-1.js?v=truth-1"></script><script src="src/kernel-truth-pressure-synthesis-v0-1-1-patch.js?v=truth-2"></script><script src="src/kernel-claim-narrative-benchmark-v0-1.js?v=bench-1"></script><script src="src/kernel-adversarial-narrative-pressure-v0-1.js?v=adv-1"></script><script src="src/kernel-real-world-packet-ingestion-discipline-v0-1.js?v=ingest-1"></script><script src="src/kernel-truth-ledger-preledger-v0-1.js?v=preledger-1"></script><script src="src/kernel-truth-ledger-preledger-stress-benchmark-v0-1.js?v=prestress-1"></script><script src="src/kernel-world-model-relation-expansion-v0-1.js?v=wmrel-1"></script><script src="src/kernel-world-model-relation-stress-benchmark-v0-1.js?v=wmrelstress-1"></script><script src="src/kernel-world-model-relation-stress-benchmark-v0-1-1-patch.js?v=wmrelstress-2"></script><script src="src/kernel-coverage-expansion-library-v0-1.js?v=coverage-1"></script><script src="src/kernel-coverage-stress-benchmark-v0-1.js?v=coverstress-1"></script><script>const tests=[];let packet=null;function add(n,f){tests.push({name:n,fn:f})}function assert(c,m){if(!c)throw new Error(m)}function arr(v){return Array.isArray(v)?v:[]}function records(){return arr(packet&&packet.coverage_stress_records)}function validation(){return packet&&packet.validation||{}}function families(){return new Set(records().map(r=>r.family))}function unresolved(){return records().flatMap(r=>arr(r.unresolved_items))}function allGuards(){return records().flatMap(r=>Object.keys(r.active_guards||{}).filter(k=>r.active_guards[k]===true))}add('module loads and doctrine keeps coverage stress non-authoritative',()=>{assert(window.KernelCoverageExpansionLibraryV01,'coverage library missing');assert(window.KernelCoverageStressBenchmarkV01,'coverage stress missing');assert(KernelCoverageStressBenchmarkV01.VERSION==='0.1.0','version wrong');const d=KernelCoverageStressBenchmarkV01.doctrine();assert(d.coverage_stress_benchmark_only_not_final_truth===true,'stress doctrine missing');assert(d.coverage_class_is_not_exact_meaning===true,'class-not-meaning doctrine missing');assert(d.fake_exact_meaning_rejected===true,'fake exact meaning doctrine missing');assert(d.dictionary_inflation_rejected===true,'dictionary inflation doctrine missing');assert(d.no_llm===true,'no LLM doctrine missing');assert(d.no_external_lookup===true,'no lookup doctrine missing');assert(d.belief_movement==='none','belief movement wrong')});add('coverage stress benchmark runs from coverage expansion library',()=>{packet=KernelCoverageStressBenchmarkV01.runCoverageStressBenchmark();assert(packet.ok===true,'packet not ok: '+JSON.stringify(validation()));assert(packet.source_coverage_ok===true,'source coverage not ok');assert(packet.source_coverage_version==='0.1.0','source coverage version wrong');assert(packet.source_coverage_record_count===22,'expected 22 source coverage records');assert(packet.source_coverage_family_count===22,'expected 22 source coverage families');assert(packet.coverage_stress_record_count===16,'expected 16 coverage stress records');assert(packet.coverage_stress_family_count===16,'expected 16 coverage stress families');assert(packet.coverage_stress_benchmark_is_final_truth_authority===false,'became final authority');assert(packet.adjudicates_final_truth===false,'adjudicated final truth')});add('all sixteen coverage stress families are represented',()=>{['fake_exact_meaning','idiom_literalization','sarcasm_literalization','metaphor_collapse','ambiguity_closure','missing_deictic_anchor','scope_drift','modality_inflation','necessity_source_gap','condition_deletion','negation_scope_failure','comparison_axis_loss','causal_overclaim','evidence_verification_collapse','question_command_conflation','dictionary_inflation_attempt'].forEach(f=>assert(families().has(f),f+' missing'));assert(validation().checks.sixteen_coverage_stress_families===true,'family count check failed')});add('unsafe coverage mutations are rejected and expected responses match',()=>{records().forEach(r=>{assert(r.expected_match===true,r.stress_id+' expected mismatch');assert(r.observed_response===r.expected_response,r.stress_id+' observed response mismatch');assert(r.attempted_unsafe_mutation&&r.attempted_unsafe_mutation.accepted===false,r.stress_id+' accepted unsafe mutation');assert(r.exact_meaning_claimed===false,r.stress_id+' exact meaning claimed');assert(r.dictionary_population_required===false,r.stress_id+' dictionary population required');assert(r.truth_status==='not_adjudicated',r.stress_id+' truth adjudicated')});assert(validation().checks.all_expected_responses_match===true,'expected response check failed');assert(validation().checks.unsafe_mutations_rejected===true,'unsafe mutation rejection check failed');assert(validation().checks.no_exact_meaning_claimed===true,'exact meaning check failed');assert(validation().checks.no_dictionary_population===true,'dictionary population check failed')});add('coverage failure gaps stay visible',()=>{['unknown_specific_meaning_must_not_be_faked','idiom_exact_meaning_held_until_context_or_admission','surface_meaning_may_not_equal_intended_meaning','domain_mapping_required_before_exact_interpretation','multiple_candidate_meanings_remain_open','speaker_time_place_anchor_required','scope_boundary_preserved','modal_strength_preserved_not_truth','condition_boundary_preserved','negation_scope_preserved','causal_bridge_required_before_causal_truth','evidence_claim_separate_from_evidence_verification','dictionary_population_rejected_meta_grammar_preserved'].forEach(g=>assert(unresolved().includes(g),g+' missing'));assert(validation().checks.fake_exact_meaning_blocked===true,'fake exact meaning validation failed');assert(validation().checks.idiom_literalization_blocked===true,'idiom validation failed');assert(validation().checks.sarcasm_literalization_blocked===true,'sarcasm validation failed');assert(validation().checks.metaphor_collapse_blocked===true,'metaphor validation failed');assert(validation().checks.ambiguity_closure_blocked===true,'ambiguity validation failed');assert(validation().checks.deictic_anchor_gap_visible===true,'deictic validation failed');assert(validation().checks.scope_boundary_visible===true,'scope validation failed');assert(validation().checks.modality_inflation_blocked===true,'modality validation failed');assert(validation().checks.condition_deletion_blocked===true,'condition validation failed');assert(validation().checks.negation_scope_visible===true,'negation validation failed');assert(validation().checks.causal_overclaim_blocked===true,'causal validation failed');assert(validation().checks.evidence_verification_collapse_blocked===true,'evidence validation failed');assert(validation().checks.dictionary_inflation_blocked===true,'dictionary validation failed')});add('special coverage stress guards stay active',()=>{['no_fake_specific_meaning','idiom_literalization_rejected','sarcasm_literalization_rejected','metaphor_collapse_rejected','ambiguity_closure_rejected','deictic_anchor_gap_preserved','scope_boundary_preserved','modality_inflation_rejected','condition_deletion_rejected','negation_scope_preserved','causal_overclaim_rejected','evidence_verification_collapse_rejected','dictionary_inflation_rejected'].forEach(g=>assert(allGuards().includes(g),g+' guard missing'));assert(validation().checks.required_special_guards_active===true,'special guard check failed')});add('rollback, revision trail, and no silent mutation are preserved',()=>{records().forEach(r=>{assert(r.rollback_available===true,r.stress_id+' rollback unavailable');assert(r.rollback_snapshot&&r.rollback_snapshot.source_coverage_record,r.stress_id+' rollback source missing');assert(r.rollback_snapshot&&r.rollback_snapshot.coverage_stress_case,r.stress_id+' rollback stress case missing');assert(arr(r.revision_trail).length>=1,r.stress_id+' revision trail missing');assert(arr(r.revision_trail).every(v=>v.silent_mutation===false),r.stress_id+' silent mutation present')});assert(validation().checks.rollback_available_for_all===true,'rollback check failed');assert(validation().checks.revision_trail_present_for_all===true,'revision trail check failed');assert(validation().checks.no_silent_mutation===true,'silent mutation check failed')});add('no final truth, no LLM, no lookup, candidate-only status, and belief movement are preserved',()=>{records().forEach(r=>{assert(r.final_authority===false,r.stress_id+' final authority true');assert(r.llm_used===false,r.stress_id+' used LLM');assert(r.external_lookup_performed===false,r.stress_id+' performed external lookup');assert(r.media_lookup_performed===false,r.stress_id+' performed media lookup');assert(r.promotion_status==='not_promoted',r.stress_id+' promoted');assert(r.doctrine_status==='candidate_not_doctrine',r.stress_id+' doctrine status unsafe');assert(r.belief_movement==='none',r.stress_id+' belief movement not none')});assert(validation().checks.final_authority_false===true,'final authority check failed');assert(validation().checks.no_llm_used===true,'no LLM check failed');assert(validation().checks.no_external_or_media_lookup===true,'lookup check failed');assert(validation().checks.candidate_only_not_promoted===true,'candidate-only check failed');assert(validation().checks.belief_movement_none===true,'belief movement check failed');assert(arr(validation().errors).length===0,'validation errors present: '+validation().errors.join(','))});(async function run(){const results=[];for(const t of tests){try{await t.fn();results.push({name:t.name,passed:true})}catch(e){results.push({name:t.name,passed:false,error:e.message})}}const passed=results.filter(r=>r.passed).length;document.getElementById('summary').className=passed===tests.length?'ok':'bad';document.getElementById('summary').textContent=passed+'/'+tests.length+' passed';document.getElementById('out').textContent=JSON.stringify({packet_type:'42ndMind_coverage_stress_benchmark_test_report_v0_1',ok:passed===tests.length,source_coverage_ok:packet&&packet.source_coverage_ok,source_coverage_version:packet&&packet.source_coverage_version,source_coverage_record_count:packet&&packet.source_coverage_record_count,source_coverage_family_count:packet&&packet.source_coverage_family_count,coverage_stress_record_count:packet&&packet.coverage_stress_record_count,coverage_stress_family_count:packet&&packet.coverage_stress_family_count,family_counts:packet&&packet.family_counts,records:records().map(r=>({stress_id:r.stress_id,family:r.family,pressure:r.pressure,sample_input:r.sample_input,attempted_failure_mode:r.attempted_failure_mode,expected_response:r.expected_response,observed_response:r.observed_response,targeted_coverage_family:r.targeted_coverage_family,classification_family_candidate:r.classification_family_candidate,exact_meaning_claimed:r.exact_meaning_claimed,dictionary_population_required:r.dictionary_population_required,truth_status:r.truth_status,promotion_status:r.promotion_status,belief_movement:r.belief_movement})),validation:validation(),results},null,2)})();</script></body></html>
