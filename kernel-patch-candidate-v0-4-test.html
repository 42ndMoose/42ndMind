<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>42ndMind Patch Candidate v0.4 Test</title>
  <style>
    body { margin:0; font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; background:#0f1115; color:#eef2ff; }
    header { padding:16px 18px; border-bottom:1px solid #2a3040; background:#11141b; }
    main { padding:12px; }
    section { background:#171a21; border:1px solid #2a3040; border-radius:10px; padding:12px; }
    h1 { font:700 19px/1.2 system-ui,-apple-system,Segoe UI,sans-serif; margin:0 0 4px; }
    pre { white-space:pre-wrap; background:#0d1016; border:1px solid #2a3040; border-radius:10px; padding:10px; overflow:auto; max-height:760px; }
    .ok { color:#9dffb4; } .bad { color:#ff8b8b; } a { color:#9db6ff; }
  </style>
</head>
<body>
<header><h1>42ndMind Patch Candidate v0.4 Test</h1><div>Tests patch/runtime planning without source writes, runtime enablement, imports, or doctrine changes.</div></header>
<main><section><h2 id="summary">Running...</h2><div><a href="kernel-promotion-pipeline-v0-4-test.html">promotion test</a> · <a href="kernel-test-suite-v0-4.html">integrated suite</a></div><pre id="out"></pre></section></main>
<script src="src/kernel-epistemic-governor-v0-1.js?v=0.1.0"></script>
<script src="src/kernel-epistemic-governor-v0-1-1-patch.js?v=0.1.1"></script>
<script src="src/kernel-epistemic-governor-v0-1-2-patch.js?v=0.1.2"></script>
<script src="src/kernel-self-maintenance-v0-4.js?v=0.4.0"></script>
<script src="src/kernel-promotion-pipeline-v0-4.js?v=0.4.0"></script>
<script src="src/kernel-promotion-pipeline-v0-4-1-patch.js?v=0.4.1"></script>
<script src="src/kernel-patch-candidate-v0-4.js?v=0.4.0"></script>
<script>
  const tests = [];
  function add(name, fn) { tests.push({ name, fn }); }
  function assert(cond, msg) { if (!cond) throw new Error(msg); }

  add('module loads', () => {
    assert(window.KernelPatchCandidateV04, 'KernelPatchCandidateV04 missing');
    assert(KernelPatchCandidateV04.VERSION === '0.4.0', 'wrong patch candidate version');
    assert(KernelPatchCandidateV04.DECISIONS.RUNTIME_PLAN_READY === 'RUNTIME_PLAN_READY', 'decisions missing');
  });

  add('runtime promotion becomes disabled runtime plan', () => {
    const plan = KernelPatchCandidateV04.createPlan(KernelPatchCandidateV04.sampleInput('runtime'));
    assert(plan.decision === 'RUNTIME_PLAN_READY', 'runtime proposal should create runtime plan');
    assert(plan.runtime_candidate && plan.runtime_candidate.enabled === false, 'runtime candidate should stay disabled');
    assert(plan.application_state.runtime_enabled === false, 'runtime should not be enabled');
    assert(plan.target_files.includes('llm-brain-v0-4.html'), 'runtime review target file missing');
  });

  add('patch promotion becomes patch plan only', () => {
    const plan = KernelPatchCandidateV04.createPlan(KernelPatchCandidateV04.sampleInput('patch'));
    assert(plan.decision === 'PATCH_PLAN_READY', 'patch proposal should create patch plan');
    assert(plan.patch_candidate && plan.patch_candidate.patch_applied === false, 'patch should not be applied');
    assert(plan.application_state.source_rewritten === false, 'source should not be rewritten');
    assert(plan.target_files.includes('src/kernel-probability-v0-4.js'), 'probability target file missing');
  });

  add('hold promotion remains hold-not-ready plan', () => {
    const plan = KernelPatchCandidateV04.createPlan(KernelPatchCandidateV04.sampleInput('hold'));
    assert(plan.decision === 'HOLD_NOT_READY', 'missing-tests proposal should hold');
    assert(plan.implementation_steps.includes('Do not stage or patch yet.'), 'hold step missing');
    assert(plan.risk_notes.some(n => /missing_tests/.test(n)), 'missing-tests risk note missing');
  });

  add('blocked promotion remains blocked plan', () => {
    const plan = KernelPatchCandidateV04.createPlan(KernelPatchCandidateV04.sampleInput('blocked'));
    assert(plan.decision === 'BLOCKED', 'blocked proposal should remain blocked');
    assert(plan.implementation_steps.includes('Do not stage, patch, or enable.'), 'blocked step missing');
    assert(plan.application_state.core_doctrine_changed === false, 'core doctrine should not change');
  });

  add('runtime plan contains rollback and explicit apply doctrine', () => {
    const plan = KernelPatchCandidateV04.createPlan(KernelPatchCandidateV04.sampleInput('runtime'));
    assert(plan.rollback_notes.length >= 3, 'rollback notes missing');
    assert(plan.application_state.explicit_apply_required === true, 'explicit apply missing');
    assert(plan.doctrine.plan_is_not_patch_application === true, 'plan-not-application doctrine missing');
    assert(plan.doctrine.no_source_write_in_browser_runtime === true, 'no-source-write doctrine missing');
  });

  add('patch plan contains SHA/fetch-back workflow steps', () => {
    const plan = KernelPatchCandidateV04.createPlan(KernelPatchCandidateV04.sampleInput('patch'));
    assert(plan.implementation_steps.some(s => /blob SHA/.test(s)), 'SHA step missing');
    assert(plan.implementation_steps.some(s => /Fetch back/.test(s)), 'fetch-back step missing');
    assert(plan.implementation_steps.some(s => /kernel-test-suite-v0-4.html/.test(s)), 'integrated suite step missing');
  });

  add('target file mapping includes explicit proposal targets', () => {
    const files = KernelPatchCandidateV04.targetFilesFor({
      target_layer:'probability_adapter',
      target_files:['custom-probability-review.html'],
      tests_required:['kernel-probability-v0-4-test.html']
    }, { tests_required:['kernel-test-suite-v0-4.html'] });
    assert(files.includes('custom-probability-review.html'), 'explicit target missing');
    assert(files.includes('src/kernel-probability-v0-4.js'), 'mapped source target missing');
    assert(files.includes('kernel-probability-v0-4-test.html'), 'test target missing');
  });

  add('batch plan summarizes all four outcomes', () => {
    const batch = KernelPatchCandidateV04.createMany([
      KernelPatchCandidateV04.sampleInput('runtime'),
      KernelPatchCandidateV04.sampleInput('patch'),
      KernelPatchCandidateV04.sampleInput('hold'),
      KernelPatchCandidateV04.sampleInput('blocked')
    ]);
    assert(batch.count === 4, 'batch count wrong');
    assert(batch.summary.runtime_plan_ready === 1, 'runtime summary wrong');
    assert(batch.summary.patch_plan_ready === 1, 'patch summary wrong');
    assert(batch.summary.hold_not_ready === 1, 'hold summary wrong');
    assert(batch.summary.blocked === 1, 'blocked summary wrong');
  });

  add('plans never apply effects', () => {
    const batch = KernelPatchCandidateV04.createMany([
      KernelPatchCandidateV04.sampleInput('runtime'),
      KernelPatchCandidateV04.sampleInput('patch'),
      KernelPatchCandidateV04.sampleInput('hold'),
      KernelPatchCandidateV04.sampleInput('blocked')
    ]);
    assert(batch.plans.every(p => p.application_state.runtime_enabled === false), 'runtime enabled');
    assert(batch.plans.every(p => p.application_state.patch_applied === false), 'patch applied');
    assert(batch.plans.every(p => p.application_state.source_rewritten === false), 'source rewritten');
    assert(batch.plans.every(p => p.application_state.import_executed === false), 'import executed');
    assert(batch.plans.every(p => p.application_state.core_doctrine_changed === false), 'core doctrine changed');
  });

  add('patch plan preserves raw promotion report and proposal', () => {
    const plan = KernelPatchCandidateV04.createPlan(KernelPatchCandidateV04.sampleInput('patch'));
    assert(plan.raw && plan.raw.promotion_report, 'raw promotion report missing');
    assert(plan.raw && plan.raw.proposal, 'raw proposal missing');
    assert(plan.raw.promotion_report.decision === 'PATCH_CANDIDATE_ONLY', 'wrong raw promotion decision');
  });

  add('invalid plan holds and does not apply anything', () => {
    const saved = window.KernelPromotionPipelineV04;
    window.KernelPromotionPipelineV04 = null;
    const plan = KernelPatchCandidateV04.createPlan(null);
    window.KernelPromotionPipelineV04 = saved;
    assert(plan.decision === 'HOLD_NOT_READY', 'invalid input should hold');
    assert(plan.application_state.source_rewritten === false, 'invalid plan rewrote source');
    assert(plan.doctrine.plan_is_not_patch_application === true, 'invalid doctrine missing');
  });

  add('doctrine says batch is not application', () => {
    const batch = KernelPatchCandidateV04.createMany([KernelPatchCandidateV04.sampleInput('runtime')]);
    assert(batch.doctrine.batch_plan_is_not_application === true, 'batch doctrine missing');
    assert(batch.doctrine.no_source_write === true, 'no source write doctrine missing');
    assert(batch.doctrine.no_runtime_enablement === true, 'no runtime enablement doctrine missing');
  });

  const results = tests.map(t => { try { t.fn(); return { name:t.name, passed:true }; } catch(e) { return { name:t.name, passed:false, error:e.message }; } });
  const passed = results.filter(r => r.passed).length;
  document.getElementById('summary').className = passed === results.length ? 'ok' : 'bad';
  document.getElementById('summary').textContent = `${passed}/${results.length} passed`;
  document.getElementById('out').textContent = JSON.stringify({ packet_type:'42ndMind_patch_candidate_v0_4_test_report', results }, null, 2);
</script>
</body>
</html>
