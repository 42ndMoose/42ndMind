<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>42ndMind Epistemic Learning Drive Test v0.1</title><style>body{margin:0;background:#0f1115;color:#eef2ff;font:14px ui-monospace,Menlo,Consolas,monospace}header{padding:16px;background:#11141b;border-bottom:1px solid #2a3040}main{padding:12px}section{background:#171a21;border:1px solid #2a3040;border-radius:10px;padding:12px}pre{white-space:pre-wrap;background:#0d1016;border:1px solid #2a3040;border-radius:10px;padding:10px;overflow:auto;max-height:780px}.ok{color:#9dffb4}.bad{color:#ff8b8b}a{color:#9db6ff}</style></head><body><header><h1>42ndMind Epistemic Learning Drive Test v0.1</h1><div>Tests truth-seeking learning goals generated from curiosity bindings and raw philosophy text.</div></header><main><section><h2 id="summary">Running...</h2><pre id="out"></pre></section></main><script src="src/epistemic-kernel-v0-2.js?v=corebase-1"></script><script src="src/epistemic-kernel-v0-2-patches.js?v=coremig-1"></script><script src="src/kernel-brain-v0-4.js?v=brain-2"></script><script src="src/kernel-brain-epistemic-kernel-bridge-v0-1.js?v=bridge-2"></script><script src="src/epistemic-kernel-maturity-core-v0-1.js?v=maturity-2"></script><script src="src/epistemic-kernel-active-curiosity-v0-1.js?v=curiosity-2"></script><script src="src/epistemic-kernel-learning-drive-v0-1.js?v=learn-1"></script><script>const tests=[];let kernel=null,binding=null,boundBrain=null,event=null,answer1=null,answer2=null,learnAnswer=null;const philosophy=`race jokes should not be mistaken for racist jokes, and the boundary between the two won't always be obvious. but speaking about it will always be better than silencing it for the sake of malicious governance or overly and unnecessarily dodging sensitivity, as it prevents humanity from improving as a collective conscience. stereotyping comes from pattern recognition which is natural and is applied to any aspects rather than exclusively for race. stereotyping comes either from lack of internal reform, whether it's a specific culture in a neighborhood, or a group of delinquents in the classroom. or it comes from misconceptions where the environment should have the wisdom gained from good-faith, high-trust, collective conscience to be able to handle the misconception accordingly, without the need of any government policy to do so.`;function add(n,f){tests.push({name:n,fn:f})}function assert(c,m){if(!c)throw new Error(m)}function arr(v){return Array.isArray(v)?v:[]}function shared(){return kernel&&kernel.state&&kernel.state.unifiedCore}function curio(){return shared()&&shared().curiosityCore}function drive(){return shared()&&shared().learningDrive}add('learning drive patch loads on kernel, brain, and bridge',()=>{assert(window.EpistemicKernelLearningDriveV01,'learning drive missing');assert(EpistemicKernelLearningDriveV01.VERSION==='0.1.0','learning drive version wrong');assert(EpistemicKernel.__learningDrivePatchApplied===true,'EpistemicKernel learning patch missing');assert(KernelBrainV04.__learningDrivePatchApplied===true,'KernelBrain learning patch missing');assert(KernelBrainEpistemicKernelBridgeV01.__learningDrivePatchApplied===true,'Bridge learning patch missing')});add('binding creates learning drive inside shared state',()=>{kernel=new EpistemicKernel();binding=KernelBrainEpistemicKernelBridgeV01.bind(kernel);boundBrain=binding.bound_brain;assert(boundBrain.state===shared(),'bound brain is not same shared state');assert(drive(),'learningDrive missing');assert(drive().doctrine.learning_drive_lives_inside_owned_state===true,'learning doctrine missing');assert(drive().doctrine.curiosity_comes_from_truth_seeking_not_prompt_trigger_only===true,'truth-seeking doctrine missing');assert(typeof boundBrain.refreshLearningDrive==='function','boundBrain refreshLearningDrive missing');assert(typeof boundBrain.answerLearningQuestion==='function','boundBrain answerLearningQuestion missing')});add('raw philosophy creates learning goals beyond curiosity prompt queue',()=>{event=boundBrain.ingest(philosophy,{kind:'learning_drive_philosophy_test'});boundBrain.refreshActiveCuriosity('learning_drive_after_ingest');boundBrain.refreshLearningDrive('learning_drive_after_ingest');assert(arr(drive().learning_goals).length>0,'learning goals missing');assert(arr(drive().learning_questions).length>0,'learning questions missing');assert(drive().truth_chase_state==='truth_seeking_learning_goals_open','truth chase state not open');assert(drive().learning_appetite_score>0,'learning appetite not active');assert(arr(drive().learning_goals).some(g=>g.learning_need==='principle_scope_test'),'principle scope goal missing');assert(arr(drive().learning_goals).some(g=>g.learning_need==='causal_bridge_needed'),'causal bridge goal missing');assert(arr(drive().learning_goals).some(g=>g.learning_need==='boundary_definition_needed'),'boundary definition goal missing')});add('curiosity answers feed learned context and working belief candidates',()=>{answer1=boundBrain.answerActiveCuriosity('people are treating all race jokes as racist',{source:'test_curiosity_answer'});boundBrain.refreshLearningDrive('after_first_answer');assert(arr(drive().learned_context).some(c=>c.raw_answer==='people are treating all race jokes as racist'),'learned context missing first answer');assert(arr(drive().working_belief_candidates).length>0,'working belief candidates missing');assert(arr(drive().working_belief_candidates).some(b=>b.user_context_bound===true),'context-bound belief candidate missing');assert(arr(drive().working_belief_candidates).every(b=>b.truth_status==='not_adjudicated'),'belief candidate truth adjudicated')});add('learning drive keeps user answer as context, not truth',()=>{assert(answer1.truth_status==='not_adjudicated','curiosity answer truth adjudicated');assert(answer1.promotion_status==='not_promoted','curiosity answer promoted');assert(answer1.belief_movement==='none','curiosity answer belief moved');assert(arr(shared().beliefCommitments).length===0,'belief commitments present');arr(drive().learned_context).forEach(c=>assert(c.belief_movement==='none','learned context moved belief'))});add('learning question can be answered and satisfied without truth promotion',()=>{const open=drive().current_learning_goal;assert(open,'no current learning goal');learnAnswer=boundBrain.answerLearningQuestion('The scope is conditional: jokes need context, intent, trust, and room for correction; hostility or dehumanization crosses the boundary.',{source:'test_learning_answer'});assert(learnAnswer.status==='learning_answer_context_candidate_not_truth','learning answer status wrong');assert(learnAnswer.goal_id===open.goal_id,'learning answer did not target current goal');assert(arr(drive().learning_goals).some(g=>g.goal_id===open.goal_id&&g.satisfied===true),'learning goal not satisfied');assert(arr(drive().learning_questions).some(q=>q.goal_id===open.goal_id&&q.status==='satisfied_learning_question'),'learning question not satisfied');assert(learnAnswer.truth_status==='not_adjudicated','learning answer truth adjudicated');assert(learnAnswer.belief_movement==='none','learning answer belief moved')});add('learning drive still opens remaining truth-seeking goals after one answer',()=>{boundBrain.refreshLearningDrive('after_learning_answer_check');assert(arr(drive().learning_goals).some(g=>!g.satisfied),'no remaining goals');assert(arr(drive().unsatisfied_items).length>0,'unsatisfied items missing');assert(drive().current_learning_goal_id!==learnAnswer.goal_id,'same satisfied goal remained current');assert(drive().truth_chase_state==='truth_seeking_learning_goals_open','truth chase did not remain open for remaining goals')});add('learning drive remains candidate-only and maturity-compatible',()=>{assert(drive().truth_status==='not_adjudicated','drive truth adjudicated');assert(drive().promotion_status==='not_promoted','drive promoted');assert(drive().belief_movement==='none','drive belief moved');assert(drive().doctrine.working_belief_candidates_are_not_final_truth===true,'working belief doctrine missing');assert(drive().doctrine.objective_maturity_remains_identity_center===true,'maturity doctrine missing');assert(arr(shared().beliefCommitments).length===0,'belief commitments present after drive')});(async function run(){const results=[];for(const t of tests){try{await t.fn();results.push({name:t.name,passed:true})}catch(e){results.push({name:t.name,passed:false,error:e.message})}}const passed=results.filter(r=>r.passed).length;document.getElementById('summary').className=passed===tests.length?'ok':'bad';document.getElementById('summary').textContent=passed+'/'+tests.length+' passed';document.getElementById('out').textContent=JSON.stringify({packet_type:'42ndMind_epistemic_learning_drive_v0_1_test_report',ok:passed===tests.length,learning_drive_loaded:!!window.EpistemicKernelLearningDriveV01,shared_state_summary:shared()&&{state_type:shared().state_type,stats:shared().stats,events:arr(shared().runtimeEvents).length,beliefs:arr(shared().beliefCommitments).length},learningDrive:drive(),curiosityCore:curio(),answer1,learnAnswer,results},null,2)})();</script></body></html>
