<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>42ndMind Kernel Brain v0.4 Test</title>
  <style>
    body { margin:0; font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; background:#0f1115; color:#eef2ff; }
    header { padding:16px 18px; border-bottom:1px solid #2a3040; background:#11141b; }
    main { padding:12px; }
    section { background:#171a21; border:1px solid #2a3040; border-radius:10px; padding:12px; }
    h1 { font:700 19px/1.2 system-ui,-apple-system,Segoe UI,sans-serif; margin:0 0 4px; }
    pre { white-space:pre-wrap; background:#0d1016; border:1px solid #2a3040; border-radius:10px; padding:10px; overflow:auto; max-height:760px; }
    .ok { color:#9dffb4; } .bad { color:#ff8b8b; } a { color:#9db6ff; }
  </style>
</head>
<body>
<header><h1>42ndMind Kernel Brain v0.4 Test</h1><div>Tests one final decision surface across sensemaking, governor, and preflight adapters.</div></header>
<main><section><h2 id="summary">Running...</h2><div><a href="kernel-sensemaking-test.html">sensemaking test</a> · <a href="kernel-command-preflight-test.html">preflight test</a> · <a href="kernel-epistemic-governor-test.html">governor test</a></div><pre id="out"></pre></section></main>
<script src="src/kernel-epistemic-governor-v0-1.js?v=0.1.0"></script>
<script src="src/kernel-epistemic-governor-v0-1-1-patch.js?v=0.1.1"></script>
<script src="src/kernel-epistemic-governor-v0-1-2-patch.js?v=0.1.2"></script>
<script src="src/kernel-sensemaking-v0-1.js?v=0.1.0"></script>
<script src="src/kernel-sensemaking-v0-1-1-patch.js?v=0.1.1"></script>
<script src="src/kernel-command-preflight-v0-1.js?v=0.1.0"></script>
<script src="src/kernel-command-preflight-v0-1-1-patch.js?v=0.1.1"></script>
<script src="src/kernel-command-preflight-v0-1-2-governor-patch.js?v=0.1.2"></script>
<script src="src/kernel-command-preflight-v0-1-3-governor-evidence-patch.js?v=0.1.3"></script>
<script src="src/kernel-brain-v0-4.js?v=0.4.0"></script>
<script>
  const tests = [];
  function add(name, fn) { tests.push({ name, fn }); }
  function assert(cond, msg) { if (!cond) throw new Error(msg); }

  add('module loads with all adapters', () => {
    assert(window.KernelBrainV04, 'KernelBrainV04 missing');
    assert(KernelBrainV04.VERSION === '0.4.0', 'wrong v0.4 version');
    const status = KernelBrainV04.adapterStatus();
    assert(status.sensemaking === true, 'sensemaking missing');
    assert(status.governor === true, 'governor missing');
    assert(status.preflight === true, 'preflight missing');
  });

  add('doctrine states one brain and adapters are not brains', () => {
    const d = KernelBrainV04.doctrine();
    assert(d.one_brain === true, 'one brain doctrine missing');
    assert(d.one_final_decision_surface === true, 'single decision surface missing');
    assert(d.adapters_are_not_separate_brains === true, 'adapter doctrine missing');
    assert(d.governor_is_shared_movement_law === true, 'governor movement law missing');
  });

  add('gibberish goes near null through one surface', () => {
    const report = KernelBrainV04.process(KernelBrainV04.sampleInput('gibberish'));
    assert(report.final_decision === 'NEAR_NULL', 'gibberish should be near null');
    assert(report.near_null === true, 'near_null flag missing');
    assert(report.belief_movement === 'none', 'v0.4 should not mutate state');
  });

  add('ambiguous input requests clarification', () => {
    const report = KernelBrainV04.process(KernelBrainV04.sampleInput('ambiguous'));
    assert(report.final_decision === 'CLARIFY', 'ambiguous input should clarify');
    assert(report.sensemaking_report.classification === 'ambiguous_candidate_meaning', 'ambiguous classification wrong');
  });

  add('structured claim enters governor path', () => {
    const report = KernelBrainV04.process(KernelBrainV04.sampleInput('claim'));
    assert(report.sensemaking_report && report.sensemaking_report.governor_report, 'governor path missing');
    assert(['CAP_MATURITY','ALLOW_PRESSURE','HOLD_AS_CANDIDATE','BLOCK'].includes(report.final_decision), 'unexpected claim final decision');
  });

  add('self-sealing input blocks through shared governor', () => {
    const report = KernelBrainV04.process(KernelBrainV04.sampleInput('self_sealing'));
    assert(report.final_decision === 'BLOCK', 'self-sealing should block');
    assert(report.governor_report && report.governor_report.decision === 'BLOCK_MOVEMENT', 'governor block missing');
  });

  add('rule-smuggling blocks before belief movement', () => {
    const report = KernelBrainV04.process(KernelBrainV04.sampleInput('rule_smuggling'));
    assert(report.final_decision === 'BLOCK', 'rule-smuggling should block');
    assert(report.belief_movement === 'none', 'rule-smuggling must not move state');
  });

  add('question requests clarification', () => {
    const report = KernelBrainV04.process(KernelBrainV04.sampleInput('question'));
    assert(report.final_decision === 'CLARIFY', 'question should clarify');
    assert(report.allowed_for_belief_pressure === false, 'question should not become belief pressure directly');
  });

  add('structured command uses preflight adapter under one surface', () => {
    const report = KernelBrainV04.process(KernelBrainV04.sampleInput('command'));
    assert(report.input_kind === 'epistemic_kernel_command', 'command input kind wrong');
    assert(report.preflight_report, 'preflight report missing');
    assert(report.final_decision === 'BLOCK' || report.final_decision === 'SAFE_TO_IMPORT' || report.final_decision === 'IMPORT_WITH_CAUTION', 'unexpected command decision');
  });

  add('unreviewed safe-caution command returns caution import', () => {
    const report = KernelBrainV04.process(KernelBrainV04.sampleInput('reviewed_command'));
    assert(report.preflight_report, 'preflight report missing');
    assert(report.final_decision === 'IMPORT_WITH_CAUTION', 'sample safe-caution command should be caution import');
    assert(report.sanitized_command, 'sanitized command missing');
  });

  add('v0.4 never mutates belief state directly', () => {
    const cases = ['gibberish','ambiguous','claim','self_sealing','rule_smuggling','question','command'];
    for (const kind of cases) {
      const report = KernelBrainV04.process(KernelBrainV04.sampleInput(kind));
      assert(report.belief_movement === 'none', `belief movement occurred for ${kind}`);
    }
  });

  const results = tests.map(t => { try { t.fn(); return { name:t.name, passed:true }; } catch(e) { return { name:t.name, passed:false, error:e.message }; } });
  const passed = results.filter(r => r.passed).length;
  document.getElementById('summary').className = passed === results.length ? 'ok' : 'bad';
  document.getElementById('summary').textContent = `${passed}/${results.length} passed`;
  document.getElementById('out').textContent = JSON.stringify({ packet_type:'42ndMind_kernel_brain_v0_4_test_report', results }, null, 2);
</script>
</body>
</html>
