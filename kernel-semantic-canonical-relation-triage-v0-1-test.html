<script>
  const tests = [];
  let fullPacket = null;
  function add(name, fn) { tests.push({ name, fn }); }
  function assert(cond, msg) { if (!cond) throw new Error(msg); }

  const fixtureRelationReport = {
    packet_type: '42ndMind_semantic_canonical_relation_candidate_report_v0_1_fixture',
    summary: { candidate_count: 4 },
    relation_candidates: [
      { candidate_id:'r1', relation_kind:'canonical_equivalence', formal_statement:'expert ≡ settled under canonical signature {d3|d4}', local_label_metadata:['authority_transfer_pressure','closure_pressure'], review_requirement:'review', belief_movement:'none' },
      { candidate_id:'r2', relation_kind:'canonical_equivalence', formal_statement:'collusion ≡ coordinated under canonical signature {d1|d2}', local_label_metadata:['direct_link_evidence_burden','motive_agency_pressure'], review_requirement:'review', belief_movement:'none' },
      { candidate_id:'r3', relation_kind:'canonical_subset', formal_statement:'collusion ⊂ ulterior_motive_attribution; added dimensions in superset: {d11}', local_label_metadata:['direct_link_evidence_burden','intent_attribution_pressure','motive_agency_pressure'], review_requirement:'review', belief_movement:'none' },
      { candidate_id:'r4', relation_kind:'canonical_orthogonality', formal_statement:'emotionally_loaded ⟂ obfuscates; shared dimensions: ∅', local_label_metadata:['affective_pressure','ambiguity_pressure'], review_requirement:'review', belief_movement:'none' }
    ],
    belief_movement:'none'
  };

  add('modules load', () => {
    assert(window.KernelSemanticCanonicalRelationTriageV01, 'canonical relation triage missing');
    assert(window.KernelSemanticCanonicalRelationProposerV01, 'canonical relation proposer missing');
    assert(KernelSemanticCanonicalRelationTriageV01.VERSION === '0.1.0', 'version wrong');
  });

  add('doctrine preserves no belief movement', () => {
    const d = KernelSemanticCanonicalRelationTriageV01.doctrine();
    assert(d.relation_triage_classifies_formal_candidates_not_truth === true, 'triage doctrine missing');
    assert(d.equivalence_can_signal_true_structure_or_vocabulary_collapse === true, 'equivalence doctrine missing');
    assert(d.local_labels_are_metadata_for_human_review_not_final_math === true, 'label doctrine missing');
    assert(d.relation_triage_does_not_move_belief === true, 'movement doctrine missing');
    assert(d.belief_movement === 'none', 'belief movement wrong');
  });

  add('expert-settled equivalence is triaged as vocabulary collapse', () => {
    const row = KernelSemanticCanonicalRelationTriageV01.triageCandidate(fixtureRelationReport.relation_candidates[0]);
    assert(row.triage_type === 'likely_vocabulary_collapse_needs_source_status_vs_closure_split', 'expert-settled triage wrong');
    assert(row.severity === 'high', 'expert-settled severity wrong');
    assert(row.next_build_target === 'authority_closure_basis_refinement', 'expert-settled target wrong');
  });

  add('collusion-coordinated equivalence is triaged as illicit coordination gap', () => {
    const row = KernelSemanticCanonicalRelationTriageV01.triageCandidate(fixtureRelationReport.relation_candidates[1]);
    assert(row.triage_type === 'likely_vocabulary_collapse_needs_illicit_coordination_dimension', 'collusion-coordinated triage wrong');
    assert(row.recommended_action === 'add_distinguishing_dimension_for_covert_or_illicit_agreement', 'collusion action wrong');
  });

  add('subset relation is triaged as enrichment review', () => {
    const row = KernelSemanticCanonicalRelationTriageV01.triageCandidate(fixtureRelationReport.relation_candidates[2]);
    assert(row.triage_type === 'valid_subset_or_missing_intent_dimension_review', 'subset triage wrong');
    assert(row.next_build_target === 'motive_coordination_subset_probe', 'subset target wrong');
  });

  add('orthogonality relation is low-priority unless bridge matters', () => {
    const row = KernelSemanticCanonicalRelationTriageV01.triageCandidate(fixtureRelationReport.relation_candidates[3]);
    assert(row.triage_type === 'possible_true_separation_but_needs_bridge_examples', 'orthogonality triage wrong');
    assert(row.severity === 'low', 'orthogonality severity wrong');
  });

  add('triageRelationReport summarizes vocabulary collapse', () => {
    const report = KernelSemanticCanonicalRelationTriageV01.triageRelationReport(fixtureRelationReport);
    assert(report.packet_type === '42ndMind_semantic_canonical_relation_triage_report_v0_1', 'wrong report type');
    assert(report.summary.triage_count === 4, 'triage count wrong');
    assert(report.summary.vocabulary_collapse_count === 2, 'vocabulary collapse count wrong');
    assert(report.summary.high_severity_count === 2, 'high severity count wrong');
    assert(report.belief_movement === 'none', 'report moved belief');
  });

  add('module availability reports full path', () => {
    const a = KernelSemanticCanonicalRelationTriageV01.modulesAvailable();
    assert(a.relation_proposer === true, 'relation proposer unavailable');
  });

  add('loadProposeAndTriage runs current full path', async () => {
    fullPacket = await KernelSemanticCanonicalRelationTriageV01.loadProposeAndTriage({ min_template_observations:2, min_observations:2, limit:10, sentences_per_template:4, allowed_extra_pressures:0, min_strong_observations:4 });
    assert(fullPacket.ok === true, 'full triage packet not ok');
    assert(fullPacket.triage_report.summary.triage_count >= 1, 'expected triage rows');
    assert(fullPacket.triage_report.summary.vocabulary_collapse_count >= 1, 'expected vocabulary collapse candidates');
    assert(fullPacket.triage_report.belief_movement === 'none', 'triage report moved belief');
    assert(fullPacket.belief_movement === 'none', 'full packet moved belief');
  });

  (async function run(){
    const results = [];
    for (const t of tests) {
      try { await t.fn(); results.push({ name:t.name, passed:true }); }
      catch(e) { results.push({ name:t.name, passed:false, error:e.message }); }
    }
    const passed = results.filter(r => r.passed).length;
    document.getElementById('summary').className = passed === tests.length ? 'ok' : 'bad';
    document.getElementById('summary').textContent = `${passed}/${tests.length} passed`;
    document.getElementById('out').textContent = JSON.stringify({
      packet_type:'42ndMind_semantic_canonical_relation_triage_v0_1_test_report',
      full_triage_summary: fullPacket && fullPacket.summary,
      results
    }, null, 2);
  })();
</script>
