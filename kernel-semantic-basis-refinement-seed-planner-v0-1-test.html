<script>
  const tests = [];
  let fullPacket = null;
  function add(name, fn) { tests.push({ name, fn }); }
  function assert(cond, msg) { if (!cond) throw new Error(msg); }

  const fixtureTriageReport = {
    packet_type:'42ndMind_semantic_canonical_relation_triage_report_v0_1_fixture',
    summary:{ triage_count:4 },
    triage:[
      { next_build_target:'authority_closure_basis_refinement', severity:'high', formal_statement:'expert ≡ settled', belief_movement:'none' },
      { next_build_target:'coordination_collusion_basis_refinement', severity:'high', formal_statement:'collusion ≡ coordinated', belief_movement:'none' },
      { next_build_target:'accusation_motive_boundary_probe', severity:'medium', formal_statement:'reckless_accusation shares d1 with motive', belief_movement:'none' },
      { next_build_target:'motive_coordination_subset_probe', severity:'medium', formal_statement:'collusion ⊂ ulterior_motive_attribution', belief_movement:'none' }
    ],
    belief_movement:'none'
  };

  add('modules load', () => {
    assert(window.KernelSemanticBasisRefinementSeedPlannerV01, 'basis refinement seed planner missing');
    assert(window.KernelSemanticCanonicalRelationTriageV01, 'canonical relation triage missing');
    assert(KernelSemanticBasisRefinementSeedPlannerV01.VERSION === '0.1.0', 'version wrong');
  });

  add('doctrine preserves candidate status and unit-total rule', () => {
    const d = KernelSemanticBasisRefinementSeedPlannerV01.doctrine();
    assert(d.basis_refinement_sentences_are_candidates_not_seed_entries === true, 'candidate doctrine missing');
    assert(d.unit_total_rule_preserved_for_active_shapes === true, 'unit-total doctrine missing');
    assert(d.active_shape_l1_total === 'sum_abs_dimensions_equals_1', 'L1 doctrine wrong');
    assert(d.force_intensity_remains_separate_from_shape === true, 'force separation missing');
    assert(d.belief_movement === 'none', 'belief movement wrong');
  });

  add('target specs generate priority seed sentences', () => {
    const authority = KernelSemanticBasisRefinementSeedPlannerV01.targetSpec('authority_closure_basis_refinement');
    const collusion = KernelSemanticBasisRefinementSeedPlannerV01.targetSpec('coordination_collusion_basis_refinement');
    assert(authority.sentence_candidates.length === 4, 'authority sentence count wrong');
    assert(collusion.expected_new_dimensions.includes('covert_agreement_dimension'), 'collusion dimension missing');
  });

  add('groupTriageRows groups by target', () => {
    const groups = KernelSemanticBasisRefinementSeedPlannerV01.groupTriageRows(fixtureTriageReport.triage);
    assert(groups.length === 4, 'expected four groups');
    assert(groups.some(g => g.target === 'authority_closure_basis_refinement'), 'authority group missing');
  });

  add('buildTargetPlan creates authority split plan', () => {
    const group = { target:'authority_closure_basis_refinement', rows:[fixtureTriageReport.triage[0]] };
    const plan = KernelSemanticBasisRefinementSeedPlannerV01.buildTargetPlan(group);
    assert(plan.priority >= 100, 'authority priority too low');
    assert(plan.expected_new_dimensions.includes('source_status_dimension'), 'source status dimension missing');
    assert(plan.suggested_sentences.some(s => s.includes('expert')), 'expert sentence missing');
    assert(plan.belief_movement === 'none', 'target plan moved belief');
  });

  add('planFromTriage summarizes targets and sentences', () => {
    const plan = KernelSemanticBasisRefinementSeedPlannerV01.planFromTriage(fixtureTriageReport, { min_priority:50 });
    assert(plan.packet_type === '42ndMind_semantic_basis_refinement_seed_plan_v0_1', 'wrong packet type');
    assert(plan.summary.refinement_target_count === 4, 'target count wrong');
    assert(plan.summary.high_priority_refinement_target_count >= 2, 'high priority count wrong');
    assert(plan.summary.suggested_sentence_count === 16, 'sentence count wrong');
    assert(plan.summary.active_shape_l1_rule === 'sum_abs_dimensions_equals_1', 'active shape rule missing');
    assert(plan.belief_movement === 'none', 'plan moved belief');
  });

  add('analyzeSentences previews workbench matches without belief movement', () => {
    const preview = KernelSemanticBasisRefinementSeedPlannerV01.analyzeSentences([
      'The expert status raises inspection priority, but it does not close the question.',
      'Similar timing suggests coordination, while collusion requires evidence of a covert agreement.'
    ]);
    assert(preview.ok === true, 'preview not ok');
    assert(preview.sentence_count === 2, 'preview count wrong');
    assert(preview.results.every(r => r.belief_movement === 'none'), 'preview moved belief');
  });

  add('module availability reports full path', () => {
    const a = KernelSemanticBasisRefinementSeedPlannerV01.modulesAvailable();
    assert(a.relation_triage === true, 'relation triage unavailable');
    assert(a.workbench === true, 'workbench unavailable');
  });

  add('loadTriageAndPlan runs current full path', async () => {
    fullPacket = await KernelSemanticBasisRefinementSeedPlannerV01.loadTriageAndPlan({ min_template_observations:2, min_observations:2, limit:10, sentences_per_template:4, allowed_extra_pressures:0, min_strong_observations:4, min_priority:50, validate_with_workbench:true });
    assert(fullPacket.ok === true, 'full seed planner packet not ok');
    assert(fullPacket.seed_plan.summary.refinement_target_count >= 1, 'expected refinement targets');
    assert(fullPacket.seed_plan.summary.suggested_sentence_count >= 1, 'expected suggested sentences');
    assert(fullPacket.workbench_preview.sentence_count === fullPacket.seed_plan.summary.suggested_sentence_count, 'preview count mismatch');
    assert(fullPacket.seed_plan.belief_movement === 'none', 'seed plan moved belief');
    assert(fullPacket.belief_movement === 'none', 'full packet moved belief');
  });

  (async function run(){
    const results = [];
    for (const t of tests) {
      try { await t.fn(); results.push({ name:t.name, passed:true }); }
      catch(e) { results.push({ name:t.name, passed:false, error:e.message }); }
    }
    const passed = results.filter(r => r.passed).length;
    document.getElementById('summary').className = passed === tests.length ? 'ok' : 'bad';
    document.getElementById('summary').textContent = `${passed}/${tests.length} passed`;
    document.getElementById('out').textContent = JSON.stringify({
      packet_type:'42ndMind_semantic_basis_refinement_seed_planner_v0_1_test_report',
      full_seed_plan_summary: fullPacket && fullPacket.summary,
      full_workbench_preview_summary: fullPacket && fullPacket.workbench_preview && {
        sentence_count: fullPacket.workbench_preview.sentence_count,
        matched_count: fullPacket.workbench_preview.matched_count,
        unmatched_count: fullPacket.workbench_preview.unmatched_count
      },
      results
    }, null, 2);
  })();
</script>
