<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>42ndMind Intention Lattice Invariance Test</title><style>body{margin:0;background:#0f1115;color:#eef2ff;font:14px ui-monospace,Menlo,Consolas,monospace}header{padding:16px;background:#11141b;border-bottom:1px solid #2a3040}main{padding:12px}section{background:#171a21;border:1px solid #2a3040;border-radius:10px;padding:12px}pre{white-space:pre-wrap;background:#0d1016;border:1px solid #2a3040;border-radius:10px;padding:10px;overflow:auto;max-height:760px}.ok{color:#9dffb4}.bad{color:#ff8b8b}a{color:#9db6ff}</style></head><body><header><h1>42ndMind Intention Lattice Invariance Test</h1><div>Tests whether candidate intention-neighbor relations survive paraphrase, translation-like labels, role renaming, and force changes.</div></header><main><section><h2 id="summary">Running...</h2><div><a href="intention-lattice-invariance.html?v=invariance-2">invariance page</a></div><pre id="out"></pre></section></main><script src="src/kernel-intention-discovery-v0-1.js?v=intent-1"></script><script src="src/kernel-intention-refinement-v0-1.js?v=refine-1"></script><script src="src/kernel-intention-necessity-test-v0-1.js?v=necessity-1"></script><script src="src/kernel-intention-neighbor-lattice-v0-1.js?v=lattice-2"></script><script src="src/kernel-intention-lattice-invariance-benchmark-v0-1.js?v=invariance-2"></script><script>const tests=[];let packet=null;function add(n,f){tests.push({name:n,fn:f})}function assert(c,m){if(!c)throw new Error(m)}function arr(v){return Array.isArray(v)?v:[]}function byId(id){return arr(packet&&packet.case_results).find(r=>r.id===id)}add('modules load',()=>{assert(window.KernelIntentionDiscoveryV01,'discovery missing');assert(window.KernelIntentionRefinementV01,'refinement missing');assert(window.KernelIntentionNecessityTestV01,'necessity missing');assert(window.KernelIntentionNeighborLatticeV01,'lattice missing');assert(window.KernelIntentionLatticeInvarianceBenchmarkV01,'invariance benchmark missing');assert(KernelIntentionLatticeInvarianceBenchmarkV01.VERSION==='0.1.0','version wrong');assert(typeof KernelIntentionLatticeInvarianceBenchmarkV01.runBenchmark==='function','runBenchmark missing')});add('doctrine keeps benchmark candidate-only',()=>{const d=KernelIntentionLatticeInvarianceBenchmarkV01.doctrine();assert(d.benchmarks_intention_lattice_not_claim_facts===true,'benchmark doctrine missing');assert(d.no_real_world_intent_attribution===true,'attribution guard missing');assert(d.invariance_cases_are_candidate_not_doctrine===true,'candidate-only guard missing');assert(d.tests_structure_not_surface_english===true,'surface-English guard missing');assert(d.force_intensity_changes_must_not_change_concept_identity_relations===true,'force invariance guard missing');assert(d.belief_movement==='none','belief movement wrong')});add('benchmark runs against lattice',()=>{packet=KernelIntentionLatticeInvarianceBenchmarkV01.runBenchmark();assert(packet.ok===true,'packet not ok: '+JSON.stringify(packet.validation));assert(packet.source_lattice_ok===true,'source lattice not ok');assert(packet.case_count===5,'expected 5 benchmark cases');assert(packet.passed_case_count===5,'not all cases passed');assert(packet.belief_movement==='none','packet moved belief')});add('paraphrase and translation-like cases pass',()=>{const a=byId('lying_mistake_paraphrase_invariance');const b=byId('lying_fiction_translation_like_invariance');assert(a&&a.ok===true,'lying paraphrase case failed');assert(b&&b.ok===true,'lying translation-like case failed');assert(a.canonical.concept==='lying'&&a.canonical.dimension==='belief_assertion_mismatch'&&a.canonical.neighbor==='mistake','lying mistake canonical mismatch');assert(b.canonical.concept==='lying'&&b.canonical.dimension==='concealment_of_mismatch'&&b.canonical.neighbor==='fiction','lying fiction canonical mismatch')});add('force and role-renaming cases pass',()=>{const a=byId('desire_preference_force_invariance');const b=byId('promise_private_intention_role_rename_invariance');assert(a&&a.ok===true,'desire force-invariance case failed');assert(b&&b.ok===true,'promise role-rename case failed');assert(a.canonical.neighbor==='preference','desire canonical neighbor wrong');assert(b.canonical.neighbor==='private_intention','promise canonical neighbor wrong')});add('future-language case passes',()=>{const r=byId('promise_plan_future_language_invariance');assert(r&&r.ok===true,'promise future-language case failed');assert(r.canonical.concept==='promise','promise canonical concept wrong');assert(r.canonical.dimension==='recipient_reliance_invitation','promise reliance dimension wrong');assert(r.canonical.neighbor==='plan','promise plan neighbor wrong')});add('force scalar does not alter lattice signature',()=>{assert(packet.force_invariance&&packet.force_invariance.ok===true,'force invariance failed');assert(packet.force_invariance.tested_force_scalars.length===5,'force scalar count wrong');packet.force_invariance.variants.forEach(v=>{assert(v.unchanged===true,'force variant changed lattice at M='+v.M);assert(v.belief_movement==='none','force variant moved belief')})});add('validation report is clean',()=>{assert(packet.validation&&packet.validation.ok===true,'validation not ok');assert(arr(packet.validation.errors).length===0,'validation has errors');arr(packet.case_results).forEach(r=>{assert(r.ok===true,r.id+' failed');assert(r.canonical_ok===true,r.id+' canonical failed');assert(r.relation_exists===true,r.id+' relation missing');assert(r.belief_movement==='none',r.id+' moved belief')})});(async function run(){const results=[];for(const t of tests){try{await t.fn();results.push({name:t.name,passed:true})}catch(e){results.push({name:t.name,passed:false,error:e.message})}}const passed=results.filter(r=>r.passed).length;document.getElementById('summary').className=passed===tests.length?'ok':'bad';document.getElementById('summary').textContent=passed+'/'+tests.length+' passed';document.getElementById('out').textContent=JSON.stringify({packet_type:'42ndMind_intention_lattice_invariance_test_report_v0_1',ok:passed===tests.length,case_count:packet&&packet.case_count,passed_case_count:packet&&packet.passed_case_count,force_invariance:packet&&packet.force_invariance,case_results:packet&&packet.case_results,validation:packet&&packet.validation,results},null,2)})();</script></body></html>
