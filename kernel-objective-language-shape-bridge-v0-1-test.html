<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>42ndMind Objective Language Shape Bridge Test</title>
  <style>
    body{margin:0;font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:#0f1115;color:#eef2ff}
    header{padding:16px 18px;border-bottom:1px solid #2a3040;background:#11141b}
    main{padding:12px}section{background:#171a21;border:1px solid #2a3040;border-radius:10px;padding:12px}
    h1{font:700 19px/1.2 system-ui,-apple-system,Segoe UI,sans-serif;margin:0 0 4px}
    pre{white-space:pre-wrap;background:#0d1016;border:1px solid #2a3040;border-radius:10px;padding:10px;overflow:auto;max-height:760px}.ok{color:#9dffb4}.bad{color:#ff8b8b}a{color:#9db6ff}
  </style>
</head>
<body>
<header><h1>42ndMind Objective Language Shape Bridge Test</h1><div>Tests projection from semantic compressed vectors into unit-total active shapes.</div></header>
<main><section><h2 id="summary">Running...</h2><div><a href="objective-language-shape-bridge.html">objective language shape bridge page</a> · <a href="unit-total-nested-shape.html">unit-total page</a></div><pre id="out"></pre></section></main>
<script src="src/kernel-semantic-corpus-v0-1.js?v=0.1.0"></script>
<script src="src/kernel-semantic-corpus-combiner-v0-1.js?v=unit-total-1"></script>
<script src="src/kernel-semantic-pressure-registry-v0-1.js?v=0.1.0"></script>
<script src="src/kernel-semantic-pressure-registry-v0-1-1-patch.js?v=status-neg-1"></script>
<script src="src/kernel-semantic-vector-compressor-v0-1.js?v=0.1.0"></script>
<script src="src/kernel-unit-total-nested-shape-v0-1.js?v=0.1.0"></script>
<script src="src/kernel-objective-language-shape-bridge-v0-1.js?v=0.1.0"></script>
<script>
  const tests=[]; let packet=null, bridge=null, firstProjection=null;
  function add(name,fn){tests.push({name,fn});}
  function assert(cond,msg){if(!cond)throw new Error(msg);}
  function near(a,b,tol=1e-9){return Math.abs(Number(a)-Number(b))<=tol;}
  function asArray(v){return Array.isArray(v)?v:[];}

  add('modules load',()=>{
    assert(window.KernelSemanticCorpusCombinerV01,'combiner missing');
    assert(window.KernelSemanticVectorCompressorV01,'compressor missing');
    assert(window.KernelUnitTotalNestedShapeV01,'unit-total kernel missing');
    assert(window.KernelObjectiveLanguageShapeBridgeV01,'shape bridge missing');
    assert(KernelObjectiveLanguageShapeBridgeV01.VERSION==='0.1.0','bridge version wrong');
  });

  add('doctrine preserves shape and no belief movement',()=>{
    const d=KernelObjectiveLanguageShapeBridgeV01.doctrine();
    assert(d.semantic_vectors_can_be_projected_into_unit_total_shapes===true,'projection doctrine missing');
    assert(d.active_shape_l1_total==='sum_abs_dimensions_equals_1','active shape doctrine missing');
    assert(d.force_intensity_remains_separate_from_shape===true,'force separation doctrine missing');
    assert(d.local_labels_are_metadata_only===true,'label metadata doctrine missing');
    assert(d.belief_movement==='none','belief movement wrong');
  });

  add('load current corpus compress and bridge succeeds',async()=>{
    packet=await KernelObjectiveLanguageShapeBridgeV01.loadCompressAndBridge({basis:'pressure',min_observations:2});
    bridge=packet.bridge_report;
    assert(packet.ok===true,'bridge packet not ok');
    assert(packet.compressed_packet.vector_space.vector_count===146,'expected 146 semantic vectors');
    assert(bridge.projected_count===146,'expected 146 projections');
    assert(bridge.ok_count===146,'all projections should be ok');
    assert(packet.observations.length===146,'expected one observation per projection');
    assert(packet.belief_movement==='none','packet moved belief');
  });

  add('semantic vectors become unit-total active shapes',()=>{
    firstProjection=bridge.projections.find(p=>p.shape_report&&p.shape_report.leaf_dimension_count>=1);
    assert(firstProjection,'projection missing');
    assert(firstProjection.ok===true,'projection not ok');
    assert(near(firstProjection.shape_report.root_l1,1),'root L1 should be 1');
    assert(near(firstProjection.shape_report.flattened_l1,1),'flattened L1 should be 1');
    assert(firstProjection.shape.dimensions.every(d=>d.metadata&&d.metadata.local_label_metadata_only===true),'dimension labels should be metadata only');
  });

  add('anonymous signature ignores local labels',()=>{
    const check=KernelObjectiveLanguageShapeBridgeV01.labelInvarianceCheck(firstProjection.shape);
    assert(check.ok===true,'label invariance failed');
    assert(check.original_signature===check.renamed_signature,'anonymous signatures differ after renaming');
    assert(check.belief_movement==='none','label check moved belief');
  });

  add('basis choices produce valid shapes',()=>{
    const vector=packet.compressed_packet.vector_space.vectors.find(v=>Object.keys(v.operator_vector||{}).length&&Object.keys(v.pressure_vector||{}).length);
    ['pressure','operator','pressure_family','blocked_movement','required_check','allowed_movement'].forEach(basis=>{
      const p=KernelObjectiveLanguageShapeBridgeV01.semanticVectorToShape(vector,{basis});
      assert(p.ok===true,basis+' projection failed');
      assert(near(p.shape_report.flattened_l1,1),basis+' flattened L1 not 1');
    });
  });

  add('bridge observations are corpus-population ready but non-doctrinal',()=>{
    const obs=packet.observations[0];
    assert(obs.packet_type==='42ndMind_unit_total_semantic_shape_observation_v0_1','wrong observation type');
    assert(obs.anonymous_shape_signature,'anonymous shape signature missing');
    assert(obs.interpretation.includes('labels remain metadata only'),'interpretation missing');
    assert(packet.observations.every(o=>o.belief_movement==='none'),'observation moved belief');
  });

  add('repeated anonymous signatures are detected as structural reuse candidates',()=>{
    const summary=bridge.projection_summary;
    assert(summary.projection_count===146,'projection summary count wrong');
    assert(summary.anonymous_signature_count>=1,'anonymous signatures missing');
    assert(summary.repeated_anonymous_signatures.length>=1,'expected repeated structural signatures');
    assert(summary.belief_movement==='none','summary moved belief');
  });

  (async function run(){
    const results=[];
    for(const t of tests){try{await t.fn();results.push({name:t.name,passed:true});}catch(e){results.push({name:t.name,passed:false,error:e.message});}}
    const passed=results.filter(r=>r.passed).length;
    document.getElementById('summary').className=passed===tests.length?'ok':'bad';
    document.getElementById('summary').textContent=`${passed}/${tests.length} passed`;
    document.getElementById('out').textContent=JSON.stringify({
      packet_type:'42ndMind_objective_language_shape_bridge_v0_1_test_report',
      projected_count:bridge&&bridge.projected_count,
      ok_count:bridge&&bridge.ok_count,
      anonymous_signature_count:bridge&&bridge.projection_summary&&bridge.projection_summary.anonymous_signature_count,
      repeated_anonymous_signatures:bridge&&bridge.projection_summary&&bridge.projection_summary.repeated_anonymous_signatures,
      results
    },null,2);
  })();
</script>
</body>
</html>
