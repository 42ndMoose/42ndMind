<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>42ndMind Kernel Brain Owned Organism Test v0.4</title><style>body{margin:0;background:#0f1115;color:#eef2ff;font:14px ui-monospace,Menlo,Consolas,monospace}header{padding:16px;background:#11141b;border-bottom:1px solid #2a3040}main{padding:12px}section{background:#171a21;border:1px solid #2a3040;border-radius:10px;padding:12px}pre{white-space:pre-wrap;background:#0d1016;border:1px solid #2a3040;border-radius:10px;padding:10px;overflow:auto;max-height:780px}.ok{color:#9dffb4}.bad{color:#ff8b8b}a{color:#9db6ff}</style></head><body><header><h1>42ndMind Kernel Brain Owned Organism Test v0.4</h1><div>Tests KernelBrainV04 as an owned internal brain state, not an adapter-only coordinator.</div></header><main><section><h2 id="summary">Running...</h2><pre id="out"></pre></section></main><script src="src/kernel-brain-v0-4.js?v=brain-2"></script><script>const tests=[];let brain=null;let report=null;function add(n,f){tests.push({name:n,fn:f})}function assert(c,m){if(!c)throw new Error(m)}function arr(v){return Array.isArray(v)?v:[]}function state(){return brain&&brain.state}function events(){return arr(state()&&state().runtimeEvents)}function admissions(){return arr(state()&&state().admissionProposals)}add('KernelBrainV04 loads as owned brain v0.4.2',()=>{assert(window.KernelBrainV04,'KernelBrainV04 missing');assert(KernelBrainV04.VERSION==='0.4.2','version wrong');assert(typeof KernelBrainV04.createBrain==='function','createBrain missing');assert(typeof KernelBrainV04.createState==='function','createState missing');assert(typeof KernelBrainV04.ingest==='function','owned ingest helper missing');const d=KernelBrainV04.doctrine();assert(d.kernel_brain_owns_internal_state===true,'owned state doctrine missing');assert(d.modules_are_views_not_thought_sources===true,'modules-as-views doctrine missing');assert(d.receptors_are_internal_tables_not_external_registries===true,'internal receptors doctrine missing')});add('createBrain owns internal state and receptors without external globals',()=>{brain=KernelBrainV04.createBrain();assert(state(),'brain state missing');assert(state().state_type==='kernel_brain_v0_4_owned_state','wrong state type');assert(arr(state().receptors).length>=10,'internal receptors missing');assert(arr(state().receptors).every(r=>r.external===false),'external receptor present');assert(state().doctrine.meaning_claim_relation_pressure_admission_live_inside_brain===true,'inside-brain doctrine missing')});add('brain.ingest creates owned event, interpretations, meanings, pressure, and admissions',()=>{const e=brain.ingest('teh source says the valve isnt opne because pressure rose, and I am sure it proves the claim',{kind:'test_messy'});assert(e&&e.status==='kernel_brain_owned_candidate_event_not_truth','event status wrong');assert(events().some(x=>x.id===e.id),'event not stored');assert(arr(e.interpretations).some(i=>i.family==='claim_candidate'),'claim interpretation missing');assert(arr(e.interpretations).some(i=>i.family==='belief_pressure'),'belief pressure interpretation missing');assert(arr(e.candidate_packets).some(p=>p.type==='source_reference'),'source packet missing');assert(arr(e.candidate_relation_edges).some(r=>r.relation_family==='source_reports'),'source relation missing');assert(arr(e.candidate_relation_edges).some(r=>r.relation_family==='causes_or_contributes_to'),'causal relation missing');assert(state().meaningNodes.some(n=>n.kind==='typo_variant_candidate'),'typo meaning node missing');assert(Number(state().pressureState.source)>0,'source pressure missing');assert(Number(state().pressureState.causal)>0,'causal pressure missing');assert(Number(state().pressureState.belief)>0,'belief pressure missing');assert(admissions().some(a=>a.proposal_family==='typo_variant_subdivision'),'typo admission missing');assert(admissions().some(a=>a.proposal_family==='claim_scope_subdivision'),'claim scope admission missing')});add('brain.process uses same owned state instead of adapter-only coordination',()=>{report=brain.process('A screenshot shows a warning, but the media is not verified and source reports it.');assert(report&&report.packet_version==='0.4.2','report version wrong');assert(report.internal_brain_event,'internal brain event missing');assert(report.internal_brain_state_summary&&report.internal_brain_state_summary.owned_state===true,'owned state summary missing');assert(events().some(e=>e.id===report.internal_brain_event.id),'process event not in brain state');assert(events().some(e=>arr(e.candidate_packets).some(p=>p.type==='media_description')),'media packet missing after process');assert(Number(state().pressureState.media)>0,'media pressure missing')});add('process can still use optional adapters as reports, but adapters are not owners',()=>{assert(report.adapters_are_optional===true,'adapters optional flag missing');assert(report.doctrine.adapters_are_optional_external_reports===true,'adapter doctrine missing');assert(report.runtime_note&&report.runtime_note.includes('adapters can inform reports'),'runtime note missing');assert(report.internal_brain_state_summary.beliefs===0,'belief moved through adapter path')});add('graph exposes one owned brain root with owned meanings, claims, evidence, admissions',()=>{const snap=brain.snapshot();assert(snap.graph&&arr(snap.graph.nodes).some(n=>n.id==='kernel_brain_root'),'brain root missing');assert(arr(snap.graph.links).some(l=>l.from==='kernel_brain_root'&&l.relation==='owns_meaning'),'owned meaning link missing');assert(arr(snap.graph.links).some(l=>l.from==='kernel_brain_root'&&l.relation==='owns_admission'),'owned admission link missing');assert(snap.last_tick_summary&&snap.last_tick_summary.belief_movement==='none','tick summary belief movement wrong')});add('admissions remain candidate-only, no canonical mutation',()=>{assert(admissions().length>=3,'admissions missing');admissions().forEach(a=>{assert(a.status==='candidate_admission_not_canonical',a.id+' not candidate');assert(a.canonical_mutation_performed===false,a.id+' mutated canonical');assert(a.growth_mode==='subdivision_not_mass_inflation',a.id+' growth mode wrong');assert(a.belief_movement==='none',a.id+' belief moved')})});add('no final truth or belief movement occurs in KernelBrainV04 owned state',()=>{assert(state().beliefCommitments.length===0,'belief commitments not empty');events().forEach(e=>{assert(e.truth_status==='not_adjudicated',e.id+' truth adjudicated');assert(e.promotion_status==='not_promoted',e.id+' promoted');assert(e.belief_movement==='none',e.id+' belief moved')});assert(state().doctrine.no_final_truth_promotion===true,'no final truth doctrine missing');assert(state().doctrine.belief_movement==='none','belief movement doctrine wrong')});(async function run(){const results=[];for(const t of tests){try{await t.fn();results.push({name:t.name,passed:true})}catch(e){results.push({name:t.name,passed:false,error:e.message})}}const passed=results.filter(r=>r.passed).length;document.getElementById('summary').className=passed===tests.length?'ok':'bad';document.getElementById('summary').textContent=passed+'/'+tests.length+' passed';document.getElementById('out').textContent=JSON.stringify({packet_type:'42ndMind_kernel_brain_owned_organism_v0_4_test_report',ok:passed===tests.length,version:window.KernelBrainV04&&KernelBrainV04.VERSION,state_type:state()&&state().state_type,stats:state()&&state().stats,pressureState:state()&&state().pressureState,receptors:state()&&state().receptors,admissionProposals:state()&&state().admissionProposals,runtimeEvents:events().map(e=>({id:e.id,kind:e.kind,signals:e.signals,packets:arr(e.candidate_packets).map(p=>p.type),relations:arr(e.candidate_relation_edges).map(r=>r.relation_family),unresolved_items:e.unresolved_items,truth_status:e.truth_status,promotion_status:e.promotion_status,belief_movement:e.belief_movement})),process_report_summary:report&&{packet_version:report.packet_version,final_decision:report.final_decision,owned_state:report.internal_brain_state_summary&&report.internal_brain_state_summary.owned_state,adapters_are_optional:report.adapters_are_optional,belief_movement:report.belief_movement},results},null,2)})();</script></body></html>
