<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>42ndMind Source Trust Bridge v0.4 Test</title>
  <style>
    body { margin:0; font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; background:#0f1115; color:#eef2ff; }
    header { padding:16px 18px; border-bottom:1px solid #2a3040; background:#11141b; }
    main { padding:12px; }
    section { background:#171a21; border:1px solid #2a3040; border-radius:10px; padding:12px; }
    h1 { font:700 19px/1.2 system-ui,-apple-system,Segoe UI,sans-serif; margin:0 0 4px; }
    pre { white-space:pre-wrap; background:#0d1016; border:1px solid #2a3040; border-radius:10px; padding:10px; overflow:auto; max-height:760px; }
    .ok { color:#9dffb4; } .bad { color:#ff8b8b; } a { color:#9db6ff; }
  </style>
</head>
<body>
<header><h1>42ndMind Source Trust Bridge v0.4 Test</h1><div>Tests source-trust priors attached as provenance pressure, not belief movement.</div></header>
<main><section><h2 id="summary">Running...</h2><div><a href="kernel-source-trust-v0-4-test.html">source trust test</a> · <a href="kernel-source-patch-bridge-review.html">source patch bridge review</a></div><pre id="out"></pre></section></main>
<script src="src/kernel-source-trust-v0-4.js?v=0.4.0"></script>
<script src="src/kernel-source-trust-bridge-v0-4.js?v=0.4.0"></script>
<script>
  const tests = [];
  function add(name, fn) { tests.push({ name, fn }); }
  function assert(cond, msg) { if (!cond) throw new Error(msg); }

  add('module loads', () => {
    assert(window.KernelSourceTrustBridgeV04, 'KernelSourceTrustBridgeV04 missing');
    assert(KernelSourceTrustBridgeV04.VERSION === '0.4.0', 'wrong bridge version');
    assert(KernelSourceTrustBridgeV04.DECISIONS.BRIDGE_READY === 'BRIDGE_READY', 'decisions missing');
  });

  add('IFCN-style source becomes certification metadata pressure', () => {
    const packet = KernelSourceTrustBridgeV04.buildBridgePacket({ sources:KernelSourceTrustBridgeV04.sampleSources('ifcn') });
    assert(packet.decision === 'BRIDGE_READY' || packet.decision === 'HOLD_SOURCE_REVIEW', 'unexpected ifcn bridge decision');
    assert(packet.aggregate.any_certification_metadata === true, 'certification metadata aggregate missing');
    assert(packet.probability_constraints.certification_cannot_raise_probability_by_itself === true, 'certification probability constraint missing');
    assert(packet.recommended_kernel_effect === 'treat_certification_as_metadata_and_require_claim_level_evidence' || packet.recommended_kernel_effect === 'hold_or_lower_source_weight_until_verification_burden_is_answered', 'wrong recommended effect');
  });

  add('conflicted source becomes conflicted source pressure', () => {
    const packet = KernelSourceTrustBridgeV04.buildBridgePacket({ sources:KernelSourceTrustBridgeV04.sampleSources('conflicted') });
    assert(packet.decision === 'SOURCE_PRESSURE_CONFLICTED', 'conflicted source should be conflicted pressure');
    assert(packet.aggregate.any_conflicted === true, 'conflicted aggregate missing');
    assert(packet.probability_constraints.conflicted_source_caps_claim_support === true, 'conflicted probability cap missing');
    assert(packet.recommended_kernel_effect === 'add_attacking_evidence_and_cap_probability_until_independent_primary_support', 'wrong conflicted effect');
  });

  add('mixed source packet preserves primary and certification pressure', () => {
    const packet = KernelSourceTrustBridgeV04.buildBridgePacket({ sources:KernelSourceTrustBridgeV04.sampleSources('mixed') });
    assert(packet.aggregate.source_count === 2, 'mixed source count wrong');
    assert(packet.pressure_evidence.length === 2, 'pressure evidence count wrong');
    assert(packet.aggregate.any_certification_metadata === true, 'certification pressure missing');
    assert(packet.aggregate.verification_burden.includes('do_not_treat_certification_as_direct_evidence'), 'certification burden missing');
  });

  add('no source data does not inflate confidence', () => {
    const packet = KernelSourceTrustBridgeV04.buildBridgePacket({ sources:[] });
    assert(packet.decision === 'NO_SOURCE_DATA', 'empty source data should be no source data');
    assert(packet.recommended_kernel_effect === 'do_not_inflate_confidence_from_missing_source_data', 'wrong no-source effect');
    assert(packet.belief_movement === 'none', 'bridge moved belief');
  });

  add('pressure evidence is attacking metadata, not truth decision', () => {
    const trust = KernelSourceTrustV04.analyze(KernelSourceTrustV04.sampleSource('ifcn'));
    const evidence = KernelSourceTrustBridgeV04.pressureEvidenceFor(trust);
    assert(evidence.relation === 'attacks', 'source trust pressure should attack overtrust');
    assert(evidence.evidence_type === 'source_trust_pressure', 'wrong evidence type');
    assert(evidence.metadata_only === true, 'pressure evidence should be metadata-only');
    assert(evidence.certification_is_metadata_not_truth === true, 'certification flag missing');
  });

  add('attachToCommand appends source-trust pressure evidence', () => {
    const attached = KernelSourceTrustBridgeV04.attachToCommand(KernelSourceTrustBridgeV04.sampleCommand(), KernelSourceTrustBridgeV04.sampleSources('ifcn'));
    const packet = attached.command.commands[0].packet;
    assert(attached.import_executed === false, 'attach should not import');
    assert(attached.belief_movement === 'none', 'attach moved belief');
    assert(packet.evidence.some(e => e.evidence_type === 'source_trust_pressure'), 'source trust pressure not appended');
    assert(packet.meta.source_trust_bridge_decision, 'packet meta bridge decision missing');
  });

  add('attached command keeps source-trust bridge in metadata', () => {
    const attached = KernelSourceTrustBridgeV04.attachToCommand(KernelSourceTrustBridgeV04.sampleCommand(), KernelSourceTrustBridgeV04.sampleSources('mixed'));
    assert(attached.command.meta.source_trust_bridge, 'command meta bridge missing');
    assert(attached.command.meta.source_trust_prior_min >= 0 && attached.command.meta.source_trust_prior_min <= 1, 'source trust min out of bounds');
    assert(Array.isArray(attached.command.commands[0].packet.meta.source_trust_verification_burden), 'verification burden missing');
  });

  add('aggregate handles source trust reports directly', () => {
    const reports = [KernelSourceTrustV04.analyze(KernelSourceTrustV04.sampleSource('primary')), KernelSourceTrustV04.analyze(KernelSourceTrustV04.sampleSource('ifcn'))];
    const agg = KernelSourceTrustBridgeV04.aggregate(reports);
    assert(agg.source_count === 2, 'aggregate count wrong');
    assert(agg.minimum_trust_prior >= 0 && agg.minimum_trust_prior <= 1, 'aggregate min out of bounds');
    assert(agg.source_pressure_tags.length > 0, 'pressure tags missing');
  });

  add('doctrine prevents source trust from deciding truth', () => {
    const packet = KernelSourceTrustBridgeV04.buildBridgePacket({ sources:KernelSourceTrustBridgeV04.sampleSources('ifcn') });
    assert(packet.doctrine.source_trust_bridge_does_not_decide_truth === true, 'truth doctrine missing');
    assert(packet.doctrine.source_trust_bridge_does_not_import_commands === true, 'import doctrine missing');
    assert(packet.doctrine.certification_cannot_replace_evidence === true, 'certification doctrine missing');
    assert(packet.doctrine.claim_level_evidence_still_required === true, 'claim evidence doctrine missing');
  });

  const results = tests.map(t => { try { t.fn(); return { name:t.name, passed:true }; } catch(e) { return { name:t.name, passed:false, error:e.message }; } });
  const passed = results.filter(r => r.passed).length;
  document.getElementById('summary').className = passed === results.length ? 'ok' : 'bad';
  document.getElementById('summary').textContent = `${passed}/${results.length} passed`;
  document.getElementById('out').textContent = JSON.stringify({ packet_type:'42ndMind_source_trust_bridge_v0_4_test_report', results }, null, 2);
</script>
</body>
</html>
