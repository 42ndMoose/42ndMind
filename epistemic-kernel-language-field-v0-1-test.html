<!doctype html><html><head><meta charset="utf-8"><title>Kernel Language Field v0.1 Test</title><style>body{background:#0f1115;color:#eef2ff;font:14px monospace}pre{white-space:pre-wrap}.ok{color:#9f9}.bad{color:#f99}</style></head><body><h1 id="summary">Running...</h1><pre id="out"></pre>
<script src="src/epistemic-kernel-v0-2.js"></script><script src="src/epistemic-kernel-v0-2-patches.js"></script><script src="src/kernel-brain-v0-4.js"></script><script src="src/kernel-brain-epistemic-kernel-bridge-v0-1.js"></script><script src="src/epistemic-kernel-maturity-core-v0-1.js"></script><script src="src/epistemic-kernel-belief-memory-engine-v0-1.js"></script><script src="src/epistemic-kernel-belief-memory-engine-v0-1-1-patch.js"></script><script src="src/epistemic-kernel-attention-organism-v0-1.js"></script><script src="src/epistemic-kernel-unity-field-v0-1.js"></script><script src="src/epistemic-kernel-unity-field-v0-1-1-patch.js"></script><script src="src/epistemic-kernel-neural-field-v0-1.js"></script><script src="src/epistemic-kernel-language-field-v0-1.js"></script>
<script>
let k=new EpistemicKernel(), b=KernelBrainEpistemicKernelBridgeV01.bind(k).bound_brain;
function s(){return k.state.unifiedCore}function lf(){return s().kernelLanguageFieldCore}function nf(){return s().kernelNeuralFieldCore}function c(){return s().communicationCore}function m(){return s().maturityCore}function say(x){b.ingest(x,{kind:'language_field_test'});b.refreshKernelLanguageField('manual');return c().current_message.message}function ok(x,e){if(!x)throw Error(e)}function arr(v){return Array.isArray(v)?v:[]}function l1(term){let f=lf().term_fields[term];return f?Number(arr(f.dimensions).reduce((a,d)=>a+Math.abs(Number(d.weight||0)),0).toFixed(6)):0}const tests=[];function add(n,f){tests.push({name:n,fn:f})}
add('language field loads and patches',()=>{ok(window.EpistemicKernelLanguageFieldV01,'module missing');ok(EpistemicKernel.__kernelLanguageFieldPatchApplied,'kernel patch missing')});
add('seed root terms exist with unit-total fields',()=>{['one','language','meaning','intention','desire','belief','truth','knowledge','memory','communication','opinion','suspicion','speculation'].forEach(t=>{ok(lf().term_fields[t],'missing '+t);ok(Math.abs(l1(t)-1)<0.00001,'bad l1 '+t+' '+l1(t))})});
add('language input matures pressure-bearing fields',()=>{let msg=say('one, language, meaning, intention, desire, belief, truth, knowledge, memory, and communication should mature together');let r=lf().current_language_reading;ok(r.reading_kind==='language_field_maturation','bad reading '+r.reading_kind);['one','language','meaning','intention','desire','belief','truth','knowledge','memory','communication'].forEach(t=>ok(r.active_terms.includes(t),'missing active '+t));ok(r.unit_total_ok===true,'unit total not ok');ok(/unit-total = 1|truth, belief, memory, knowledge, and communication/i.test(msg),'bad msg '+msg)});
add('language field creates semantic relations and neural links',()=>{ok(arr(lf().semantic_relation_graph).length>0,'no semantic relations');ok(arr(lf().language_neural_links).some(x=>x.target_neuron==='language_math'),'no language_math link');ok(arr(lf().language_neural_links).some(x=>x.target_neuron==='truth_tracking'),'no truth link');ok(arr(lf().language_neural_links).some(x=>x.target_neuron==='communication_motor'),'no communication link')});
add('language field feeds neural learning deltas',()=>{ok(nf(),'neural field missing');ok(arr(nf().language_field_feedback).length>0,'no neural language feedback');ok(arr(nf().learning_deltas).some(d=>/language field maturation/.test(d.reason||'')),'no neural learning delta from language')});
add('desire and intention remain related but not collapsed',()=>{say('desire and intention should be related, but desire is not identical to intention');let rel=arr(lf().semantic_relation_graph).find(r=>(r.from_term==='desire'&&r.to_term==='intention')||(r.from_term==='intention'&&r.to_term==='desire'));ok(rel,'desire/intention relation missing');ok(/not_identical|candidate/.test(rel.relation_type),'relation failed distinction: '+rel.relation_type)});
add('no final truth promotion and maturity remains center',()=>{ok(m().core_philosophy==='objective_peak_philosophical_maturity','maturity missing');ok(lf().truth_status==='not_final','truth promoted');ok(lf().promotion_status==='not_promoted_to_final_truth','promoted');Object.values(lf().term_fields).forEach(f=>{ok(f.truth_status==='not_final','field truth promoted');ok(f.promotion_status==='not_promoted_to_final_truth','field promoted')})});
(async()=>{let r=[];for(const t of tests){try{await t.fn();r.push({name:t.name,passed:true})}catch(e){r.push({name:t.name,passed:false,error:e.message})}}let p=r.filter(x=>x.passed).length;summary.textContent=p+'/'+tests.length+' passed';summary.className=p===tests.length?'ok':'bad';out.textContent=JSON.stringify({ok:p===tests.length,kernelLanguageFieldCore:lf(),kernelNeuralFieldCore:nf(),communicationCore:c(),results:r},null,2)})();
</script></body></html>
