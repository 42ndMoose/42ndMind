<script src="src/kernel-semantic-validation-triage-planner-v0-1.js?v=0.1.0"></script>
<script>
  const tests = [];
  let fullPacket = null;
  function add(name, fn) { tests.push({ name, fn }); }
  function assert(cond, msg) { if (!cond) throw new Error(msg); }

  function row(overrides) {
    return Object.assign({
      sentence: 'fixture sentence',
      recommendation: 'revise',
      expected_pressure_signature: 'a_pressure|b_pressure',
      expected_pressures: ['a_pressure', 'b_pressure'],
      actual_pressures: ['a_pressure'],
      actual_operators: ['fixture(operator)'],
      match_count: 1,
      comparison: {
        missing_pressures: ['b_pressure'],
        extra_pressures: [],
        overmatch_flags: [],
        undermatch_flags: ['missing_expected_pressures']
      },
      belief_movement: 'none'
    }, overrides || {});
  }

  add('modules load', () => {
    assert(window.KernelSemanticTemplateValidationRunnerV01, 'validation runner missing');
    assert(window.KernelSemanticValidationTriagePlannerV01, 'triage planner missing');
    assert(KernelSemanticValidationTriagePlannerV01.VERSION === '0.1.0', 'triage version wrong');
  });

  add('doctrine preserves no belief movement', () => {
    const d = KernelSemanticValidationTriagePlannerV01.doctrine();
    assert(d.triage_classifies_validation_failures_not_truth === true, 'triage doctrine missing');
    assert(d.triage_actions_are_recommendations_not_source_edits === true, 'action doctrine missing');
    assert(d.triage_does_not_patch_source === true, 'patch doctrine missing');
    assert(d.belief_movement === 'none', 'belief movement doctrine wrong');
  });

  add('module availability reports validation runner', () => {
    const a = KernelSemanticValidationTriagePlannerV01.modulesAvailable();
    assert(a.validation_runner === true, 'validation runner unavailable');
  });

  add('pressure family classification works', () => {
    assert(KernelSemanticValidationTriagePlannerV01.pressureFamily('authority_transfer_pressure') === 'authority_source_status', 'authority family wrong');
    assert(KernelSemanticValidationTriagePlannerV01.pressureFamily('reputational_risk_pressure') === 'accusation_risk', 'accusation family wrong');
    assert(KernelSemanticValidationTriagePlannerV01.pressureFamily('contradiction_pressure') === 'contradiction_falsity', 'contradiction family wrong');
  });

  add('accepted row triages as clean', () => {
    const t = KernelSemanticValidationTriagePlannerV01.triageRow(row({ recommendation:'accept', actual_pressures:['a_pressure','b_pressure'], comparison:{ missing_pressures:[], extra_pressures:[], overmatch_flags:[], undermatch_flags:[] } }));
    assert(t.triage_type === 'accepted_clean', 'accepted row not clean');
    assert(t.recommended_action === 'keep_as_validated_seed_candidate', 'accepted action wrong');
    assert(t.belief_movement === 'none', 'triage moved belief');
  });

  add('unmatched row triages as sentence rewrite or grammar gap', () => {
    const t = KernelSemanticValidationTriagePlannerV01.triageRow(row({ recommendation:'reject', match_count:0, actual_pressures:[], actual_operators:[], comparison:{ missing_pressures:['a_pressure','b_pressure'], extra_pressures:[], overmatch_flags:[], undermatch_flags:['no_workbench_match'] } }));
    assert(t.triage_type === 'sentence_unmatched_by_workbench', 'unmatched type wrong');
    assert(t.severity === 'high', 'unmatched severity wrong');
    assert(t.next_build_target === 'sentence_rewrite_or_grammar_gap_review', 'unmatched target wrong');
  });

  add('productive overmatch is separated from failure', () => {
    const t = KernelSemanticValidationTriagePlannerV01.triageRow(row({ recommendation:'revise', expected_pressures:['closure_pressure'], actual_pressures:['closure_pressure','evidence_contact_pressure'], comparison:{ missing_pressures:[], extra_pressures:['evidence_contact_pressure'], overmatch_flags:['extra_pressures_review_needed'], undermatch_flags:[] } }));
    assert(t.triage_type === 'productive_overmatch', 'productive overmatch type wrong');
    assert(t.recommended_action === 'split_or_promote_as_richer_template_after_review', 'productive overmatch action wrong');
  });

  add('authority bundle overexpected is detected', () => {
    const t = KernelSemanticValidationTriagePlannerV01.triageRow(row({
      recommendation:'revise',
      expected_pressures:['authority_transfer_pressure','certification_pressure','closure_pressure','rating_pressure','reviewer_status_pressure','source_trust_pressure','trust_inflation_pressure'],
      actual_pressures:['authority_transfer_pressure'],
      comparison:{ missing_pressures:['certification_pressure','closure_pressure','rating_pressure','reviewer_status_pressure','source_trust_pressure','trust_inflation_pressure'], extra_pressures:[], overmatch_flags:[], undermatch_flags:['missing_expected_pressures'] }
    }));
    assert(t.triage_type === 'expected_authority_bundle_too_broad', 'authority bundle type wrong');
    assert(t.next_build_target === 'expected_signature_reduction', 'authority bundle target wrong');
  });

  add('false accusation gap is detected', () => {
    const t = KernelSemanticValidationTriagePlannerV01.triageRow(row({
      recommendation:'revise',
      expected_pressures:['accusation_pressure','contradiction_pressure','evidence_contact_pressure','reputational_risk_pressure'],
      actual_pressures:['closure_pressure','contradiction_pressure','evidence_contact_pressure','falsity_claim_pressure'],
      comparison:{ missing_pressures:['accusation_pressure','reputational_risk_pressure'], extra_pressures:['closure_pressure','falsity_claim_pressure'], overmatch_flags:['extra_pressures_review_needed'], undermatch_flags:['missing_expected_pressures'] }
    }));
    assert(t.triage_type === 'false_accusation_grammar_gap_or_template_wording_gap', 'false accusation gap type wrong');
    assert(t.next_build_target === 'false_accusation_grammar_patch_or_rewording', 'false accusation target wrong');
  });

  add('planFromValidation summarizes triage rows', () => {
    const validation = {
      packet_type:'42ndMind_semantic_template_validation_report_v0_1',
      validation_case_count:3,
      summary:{ sentence_count:3 },
      results:[
        row({ recommendation:'accept', actual_pressures:['a_pressure','b_pressure'], comparison:{ missing_pressures:[], extra_pressures:[], overmatch_flags:[], undermatch_flags:[] } }),
        row({ recommendation:'reject', match_count:0, actual_pressures:[], actual_operators:[], comparison:{ missing_pressures:['a_pressure','b_pressure'], extra_pressures:[], overmatch_flags:[], undermatch_flags:['no_workbench_match'] } }),
        row({ recommendation:'revise', expected_pressures:['closure_pressure'], actual_pressures:['closure_pressure','evidence_contact_pressure'], comparison:{ missing_pressures:[], extra_pressures:['evidence_contact_pressure'], overmatch_flags:['extra_pressures_review_needed'], undermatch_flags:[] } })
      ]
    };
    const packet = KernelSemanticValidationTriagePlannerV01.planFromValidation(validation);
    assert(packet.packet_type === '42ndMind_semantic_validation_triage_report_v0_1', 'wrong packet type');
    assert(packet.summary.triage_count === 3, 'triage count wrong');
    assert(packet.summary.revise_or_reject_count === 2, 'revise/reject count wrong');
    assert(packet.summary.triage_type_counts.accepted_clean === 1, 'accepted count wrong');
    assert(packet.belief_movement === 'none', 'packet moved belief');
  });

  add('loadValidateAndTriage runs current planner-validation path', async () => {
    fullPacket = await KernelSemanticValidationTriagePlannerV01.loadValidateAndTriage({ min_template_observations:2, min_observations:2, limit:10, sentences_per_template:4, allowed_extra_pressures:0 });
    assert(fullPacket.ok === true, 'full triage packet not ok');
    assert(fullPacket.validation_packet.validation.validation_case_count >= 31, 'expected current validation cases');
    assert(fullPacket.triage.summary.triage_count === fullPacket.validation_packet.validation.validation_case_count, 'triage count mismatch');
    assert(fullPacket.triage.summary.revise_or_reject_count >= 1, 'expected some revise/reject rows for triage');
    assert(fullPacket.belief_movement === 'none', 'full packet moved belief');
  });

  (async function run(){
    const results = [];
    for (const t of tests) {
      try { await t.fn(); results.push({ name:t.name, passed:true }); }
      catch(e) { results.push({ name:t.name, passed:false, error:e.message }); }
    }
    const passed = results.filter(r => r.passed).length;
    document.getElementById('summary').className = passed === results.length ? 'ok' : 'bad';
    document.getElementById('summary').textContent = `${passed}/${results.length} passed`;
    document.getElementById('out').textContent = JSON.stringify({
      packet_type:'42ndMind_semantic_validation_triage_planner_v0_1_test_report',
      full_triage_summary: fullPacket && fullPacket.summary,
      results
    }, null, 2);
  })();
</script>
