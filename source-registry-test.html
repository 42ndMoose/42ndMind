<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>42ndMind Source Registry Smoke Test</title>
  <style>
    body { margin:20px; font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; background:#0f1115; color:#eef2ff; }
    a { color:#9db6ff; }
    button { background:#25345c; color:#eef2ff; border:1px solid #3f5592; padding:8px 10px; border-radius:8px; cursor:pointer; margin:3px 3px 10px 0; font:13px system-ui,-apple-system,Segoe UI,sans-serif; }
    pre { white-space:pre-wrap; background:#171a21; border:1px solid #2a3040; border-radius:10px; padding:12px; }
    .pass { color:#9dffb4; }
    .fail { color:#ff8b8b; }
    .muted { color:#8b93a7; }
  </style>
</head>
<body>
  <h1>Source Registry Smoke Test</h1>
  <p><a href="source-registry.html">source registry</a> · <a href="llm-brain-v0-3.html">live brain v0.3</a> · <a href="dossier-source-graph.html">dossier graph</a> · <a href="source-trace-bridge.html">source trace bridge</a></p>
  <button onclick="copyOutput()">COPY output</button><span id="status" class="muted"></span>
  <pre id="out">Running...</pre>
<script src="src/source-registry-v0-1.js?v=0.1.1"></script>
<script>
  function run() {
    const report = SourceRegistryV01.importPacket(SourceRegistryV01.samplePacket());
    const registry = report.source_registry;
    const source = registry.sources[0] || {};
    const source2 = registry.sources[1] || {};
    const tracePacket = SourceRegistryV01.sourceTraceToPacket(SourceRegistryV01.sampleTrace());
    const traceReport = SourceRegistryV01.importPacket(tracePacket);
    const traceRegistry = traceReport.source_registry;
    const importEventSource = traceRegistry.sources.find(row => row.source_kind.endsWith('_import_event')) || {};
    const linkedSource = traceRegistry.sources.find(row => row.source_kind === 'linked_source_from_trace') || {};
    const cases = [
      ['version 0.1.1', SourceRegistryV01.VERSION === '0.1.1'],
      ['report type', report.packet_type === '42ndMind_source_registry_report'],
      ['registry type', registry.registry_type === '42ndMind_source_registry'],
      ['has sources', report.pass_checks.has_sources === true],
      ['two sample sources', registry.counts.sources === 2],
      ['source objects separate from claims', report.pass_checks.source_objects_separate_from_claims === true],
      ['source objects separate from evidence', report.pass_checks.source_objects_separate_from_evidence === true],
      ['retrieval status present', report.pass_checks.every_source_has_retrieval_status === true],
      ['provided by user status retained', source.retrieval_status === 'provided_by_user'],
      ['not retrieved status retained', source2.retrieval_status === 'not_retrieved'],
      ['trust notes present', report.pass_checks.has_trust_notes === true],
      ['unresolved source questions visible', report.pass_checks.has_unresolved_source_questions === true],
      ['claim links reference sources', report.pass_checks.claim_links_reference_sources === true],
      ['evidence links reference sources', report.pass_checks.evidence_links_reference_sources === true],
      ['source has attached claims', Array.isArray(source.attached_claim_ids) && source.attached_claim_ids.length >= 2],
      ['source has attached evidence', Array.isArray(source.attached_evidence_ids) && source.attached_evidence_ids.length >= 1],
      ['provenance is not proof', report.pass_checks.provenance_is_not_proof === true],
      ['retrieval is not verification', report.pass_checks.retrieval_is_not_verification === true],
      ['registry is non scoring', report.pass_checks.non_scoring === true],
      ['kernel owns belief movement', report.pass_checks.kernel_owns_belief_movement === true],
      ['metadata says not belief update', registry.meta.source_registry_not_belief_update === true],
      ['next extension is metadata only', report.next_kernel_state_extension.attach_as_metadata_only === true],
      ['scoring not allowed', report.next_kernel_state_extension.scoring_allowed === false],
      ['all sample checks passed', report.all_passed === true],
      ['trace conversion packet type', tracePacket.packet_type === '42ndMind_source_registry_packet'],
      ['trace conversion meta exists', tracePacket.conversion_meta && tracePacket.conversion_meta.converted_from === 'sourceTrace'],
      ['trace conversion is non scoring', tracePacket.conversion_meta.non_scoring === true],
      ['trace conversion provenance is not proof', tracePacket.conversion_meta.provenance_is_not_proof === true],
      ['trace conversion retrieval is not verification', tracePacket.conversion_meta.retrieval_is_not_verification === true],
      ['trace conversion produced sources', traceRegistry.counts.sources >= 2],
      ['trace conversion has import-event source', importEventSource.retrieval_status === 'provided_by_user'],
      ['trace conversion has linked source', linkedSource.retrieval_status === 'not_retrieved'],
      ['trace conversion preserves claim ids', importEventSource.attached_claim_ids && importEventSource.attached_claim_ids.length === 4],
      ['trace conversion preserves evidence ids', importEventSource.attached_evidence_ids && importEventSource.attached_evidence_ids.length === 7],
      ['trace conversion creates source questions', traceRegistry.counts.unresolved_source_questions >= 3],
      ['trace conversion report all passed', traceReport.all_passed === true]
    ];
    const passed = cases.filter(row => row[1]).length;
    const text = `Source Registry smoke test\n${passed}/${cases.length} passed\n\n` + cases.map(row => `${row[1] ? 'PASS' : 'FAIL'} ${row[0]}`).join('\n') + '\n\nSample report\n` + JSON.stringify(report, null, 2) + '\n\nTrace conversion report\n' + JSON.stringify(traceReport, null, 2);
    const out = document.getElementById('out');
    out.textContent = text;
    out.className = passed === cases.length ? 'pass' : 'fail';
  }
  async function copyOutput() {
    const text = document.getElementById('out').textContent;
    try { await navigator.clipboard.writeText(text); document.getElementById('status').textContent = `Copied output (${text.length.toLocaleString()} chars).`; }
    catch (error) { document.getElementById('status').textContent = 'Could not auto-copy. Select output manually.'; }
  }
  run();
</script>
</body>
</html>
