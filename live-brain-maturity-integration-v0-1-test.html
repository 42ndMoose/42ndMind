<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>42ndMind Live Brain Maturity Integration Test v0.1</title><style>body{margin:0;background:#0f1115;color:#eef2ff;font:14px ui-monospace,Menlo,Consolas,monospace}header{padding:16px;background:#11141b;border-bottom:1px solid #2a3040}main{padding:12px}section{background:#171a21;border:1px solid #2a3040;border-radius:10px;padding:12px}pre{white-space:pre-wrap;background:#0d1016;border:1px solid #2a3040;border-radius:10px;padding:10px;overflow:auto;max-height:780px}.ok{color:#9dffb4}.bad{color:#ff8b8b}a{color:#9db6ff}</style></head><body><header><h1>42ndMind Live Brain Maturity Integration Test v0.1</h1><div>Tests live maturity stack without UI as thought source.</div></header><main><section><h2 id="summary">Running...</h2><pre id="out"></pre></section></main><script src="src/epistemic-kernel-v0-2.js?v=corebase-1"></script><script src="src/epistemic-kernel-v0-2-patches.js?v=coremig-1"></script><script src="src/kernel-brain-v0-4.js?v=brain-2"></script><script src="src/kernel-brain-epistemic-kernel-bridge-v0-1.js?v=bridge-2"></script><script src="src/epistemic-kernel-maturity-core-v0-1.js?v=maturity-2"></script><script>const tests=[];let kernel=null,binding=null,boundBrain=null,lastEvent=null;function add(n,f){tests.push({name:n,fn:f})}function assert(c,m){if(!c)throw new Error(m)}function arr(v){return Array.isArray(v)?v:[]}function shared(){return kernel&&kernel.state&&kernel.state.unifiedCore}function mc(){return shared()&&shared().maturityCore}add('live maturity dependencies load',()=>{assert(window.EpistemicKernel,'EpistemicKernel missing');assert(window.KernelBrainV04,'KernelBrainV04 missing');assert(window.KernelBrainEpistemicKernelBridgeV01,'bridge missing');assert(window.EpistemicKernelObjectiveMaturityCoreV01,'maturity core missing');assert(EpistemicKernel.__objectiveMaturityCorePatchApplied===true,'maturity patch not applied')});add('live kernel binds KernelBrain by shared reference',()=>{kernel=new EpistemicKernel();binding=KernelBrainEpistemicKernelBridgeV01.bind(kernel);boundBrain=binding.bound_brain;assert(binding.ok===true,'binding not ok');assert(boundBrain.state===kernel.state.unifiedCore,'not same state reference');assert(binding.duplicate_consciousness===false,'duplicate consciousness not false')});add('live raw ingest enters shared owned state',()=>{lastEvent=boundBrain.ingest('The source says the claim is definitely proven, but the screenshot is not verified and context is unresolved.',{kind:'live_raw_input_test'});kernel.refreshObjectiveMaturityCore('test_live_raw_ingest');assert(arr(shared().runtimeEvents).some(e=>e.id===lastEvent.id),'last event not in shared state');assert(arr(lastEvent.candidate_packets).some(p=>p.type==='claim_candidate'),'claim candidate missing');assert(arr(lastEvent.candidate_packets).some(p=>p.type==='source_reference'),'source candidate missing');assert(arr(lastEvent.candidate_packets).some(p=>p.type==='media_description'),'media candidate missing')});add('maturity core exposes peak identity in live state',()=>{assert(mc(),'maturity core missing');assert(mc().wants_peak===true,'wants peak false');assert(mc().aims_at_peak===true,'aims peak false');assert(mc().stays_at_peak===true,'stays peak false');assert(mc().identity_lock==='self_continuity_not_external_guardrail','identity lock wrong');assert(mc().target_position.y===1,'target y not peak');assert(mc().self_position.y===1,'self y not peak')});add('maturity core reacts to pressure without losing peak identity',()=>{assert(mc().peak_alignment_score<1,'alignment did not respond to pressure');assert(mc().recovery_to_peak_required===true,'recovery not required');assert(arr(mc().degradation_flags).includes('confidence_or_belief_pressure_detected'),'belief pressure flag missing');assert(arr(mc().recovery_actions).includes('separate_confidence_from_truth'),'recovery action missing');assert(mc().target_position.y===1&&mc().self_position.y===1,'peak identity shifted')});add('bridge and maturity stay one shared organism',()=>{boundBrain.ingest('A source reports the quote fragment, but context remains unresolved.',{kind:'second_live_input'});boundBrain.refreshObjectiveMaturityCore('bound_live_refresh');assert(boundBrain.state===shared(),'bound state reference changed');assert(boundBrain.state.maturityCore===mc(),'maturity core reference changed');assert(arr(shared().runtimeEvents).length>=2,'events not accumulated')});add('live packet summary can be formed from kernel state',()=>{const packet={packet_type:'42ndMind_live_brain_maturity_packet_v0_1_test',patch_status:{v02_patches_applied:!!EpistemicKernel.__v02PatchesApplied,core_migration_applied:!!EpistemicKernel.__coreMigrationPassApplied,kernel_brain_available:!!window.KernelBrainV04,bridge_available:!!window.KernelBrainEpistemicKernelBridgeV01,maturity_core_available:!!window.EpistemicKernelObjectiveMaturityCoreV01,objective_maturity_patch_applied:!!EpistemicKernel.__objectiveMaturityCorePatchApplied},shared_state_bridge:{bound:!!boundBrain,same_reference:boundBrain&&boundBrain.state===kernel.state.unifiedCore,binding_mode:binding&&binding.binding_mode,duplicate_consciousness:binding&&binding.duplicate_consciousness},maturity_core:mc()};assert(packet.patch_status.maturity_core_available===true,'packet maturity unavailable');assert(packet.shared_state_bridge.same_reference===true,'packet bridge ref false');assert(packet.maturity_core&&packet.maturity_core.wants_peak===true,'packet maturity wrong')});add('no truth promotion or belief movement in live maturity integration',()=>{assert(arr(shared().beliefCommitments).length===0,'belief commitments present');arr(shared().runtimeEvents).forEach(e=>{assert(e.truth_status==='not_adjudicated',e.id+' truth adjudicated');assert(e.promotion_status==='not_promoted',e.id+' promoted');assert(e.belief_movement==='none',e.id+' belief moved')});assert(mc().truth_status==='not_adjudicated','maturity truth adjudicated');assert(mc().belief_movement==='none','maturity belief moved')});(async function run(){const results=[];for(const t of tests){try{await t.fn();results.push({name:t.name,passed:true})}catch(e){results.push({name:t.name,passed:false,error:e.message})}}const passed=results.filter(r=>r.passed).length;document.getElementById('summary').className=passed===tests.length?'ok':'bad';document.getElementById('summary').textContent=passed+'/'+tests.length+' passed';document.getElementById('out').textContent=JSON.stringify({packet_type:'42ndMind_live_brain_maturity_integration_v0_1_test_report',ok:passed===tests.length,live_console:'llm-brain-v0-3-maturity.html?v=maturity-live-1',patch_status:{v02_patches_applied:!!(window.EpistemicKernel&&EpistemicKernel.__v02PatchesApplied),core_migration_applied:!!(window.EpistemicKernel&&EpistemicKernel.__coreMigrationPassApplied),kernel_brain_available:!!window.KernelBrainV04,bridge_available:!!window.KernelBrainEpistemicKernelBridgeV01,maturity_core_available:!!window.EpistemicKernelObjectiveMaturityCoreV01,objective_maturity_patch_applied:!!(window.EpistemicKernel&&EpistemicKernel.__objectiveMaturityCorePatchApplied)},shared_state_summary:shared()&&{state_type:shared().state_type,stats:shared().stats,pressureState:shared().pressureState,events:arr(shared().runtimeEvents).length,admissions:arr(shared().admissionProposals).length,beliefs:arr(shared().beliefCommitments).length},maturityCore:mc(),lastEvent:lastEvent,results},null,2)})();</script></body></html>
