<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>42ndMind Objective Maturity Core Test v0.1</title><style>body{margin:0;background:#0f1115;color:#eef2ff;font:14px ui-monospace,Menlo,Consolas,monospace}header{padding:16px;background:#11141b;border-bottom:1px solid #2a3040}main{padding:12px}section{background:#171a21;border:1px solid #2a3040;border-radius:10px;padding:12px}pre{white-space:pre-wrap;background:#0d1016;border:1px solid #2a3040;border-radius:10px;padding:10px;overflow:auto;max-height:780px}.ok{color:#9dffb4}.bad{color:#ff8b8b}a{color:#9db6ff}</style></head><body><header><h1>42ndMind Objective Maturity Core Test v0.1</h1><div>Tests peak maturity as kernel self-continuity, not external guardrail.</div></header><main><section><h2 id="summary">Running...</h2><pre id="out"></pre></section></main><script src="src/epistemic-kernel-v0-2.js?v=corebase-1"></script><script src="src/epistemic-kernel-v0-2-patches.js?v=coremig-1"></script><script src="src/kernel-brain-v0-4.js?v=brain-2"></script><script src="src/kernel-brain-epistemic-kernel-bridge-v0-1.js?v=bridge-2"></script><script src="src/epistemic-kernel-maturity-core-v0-1.js?v=maturity-2"></script><script>const tests=[];let kernel=null,binding=null,boundBrain=null;function add(n,f){tests.push({name:n,fn:f})}function assert(c,m){if(!c)throw new Error(m)}function arr(v){return Array.isArray(v)?v:[]}function shared(){return kernel&&kernel.state&&kernel.state.unifiedCore}function mc(){return shared()&&shared().maturityCore}function samePoint(p,x,y,z){return p&&p.x===x&&p.y===y&&p.z===z}add('maturity core patch loads on kernel, brain, and bridge surfaces',()=>{assert(window.EpistemicKernelObjectiveMaturityCoreV01,'maturity core missing');assert(EpistemicKernelObjectiveMaturityCoreV01.VERSION==='0.1.0','maturity version wrong');assert(window.EpistemicKernel&&EpistemicKernel.__objectiveMaturityCorePatchApplied===true,'EpistemicKernel maturity patch missing');assert(window.KernelBrainV04&&KernelBrainV04.__objectiveMaturityCorePatchApplied===true,'KernelBrain maturity patch missing');assert(window.KernelBrainEpistemicKernelBridgeV01&&KernelBrainEpistemicKernelBridgeV01.__objectiveMaturityCorePatchApplied===true,'Bridge maturity patch missing')});add('new EpistemicKernel carries peak maturity as self-continuity',()=>{kernel=new EpistemicKernel();kernel.refreshObjectiveMaturityCore('test_init');assert(mc(),'maturityCore missing');assert(mc().core_philosophy==='objective_peak_philosophical_maturity','wrong core philosophy');assert(mc().identity_lock==='self_continuity_not_external_guardrail','identity lock wrong');assert(mc().peak_attractor_active===true,'peak attractor inactive');assert(mc().wants_peak===true,'kernel does not want peak');assert(mc().aims_at_peak===true,'kernel does not aim at peak');assert(mc().stays_at_peak===true,'kernel does not stay at peak');assert(samePoint(mc().target_position,0,1,0),'target position not peak');assert(samePoint(mc().self_position,0,1,0),'self position not peak')});add('maturity doctrine understands peak is not dogma or omniscience',()=>{const d=mc().doctrine;assert(d.peak_is_not_ideology===true,'peak ideology guard missing');assert(d.peak_is_not_authoritarian_certainty===true,'peak certainty guard missing');assert(d.peak_is_integrated_consideration_under_positive_epistemic_stability===true,'integrated consideration missing');assert(d.maturity_requires_reality_contact===true,'reality contact missing');assert(d.maturity_requires_self_correction===true,'self correction missing');assert(d.no_omniscience_claim===true,'omniscience refusal missing');assert(d.no_belief_movement_from_identity_alone===true,'identity belief movement guard missing')});add('ingest updates maturity pressure while preserving peak identity',()=>{kernel.ingest('The source says the claim is definitely proven, but the screenshot is not verified and context is unresolved.',{kind:'maturity_pressure_test'});kernel.refreshObjectiveMaturityCore('after_ingest');assert(mc().peak_attractor_active===true,'peak attractor lost');assert(samePoint(mc().target_position,0,1,0),'target shifted');assert(samePoint(mc().self_position,0,1,0),'self shifted');assert(mc().peak_alignment_score<1,'alignment did not reflect pressure');assert(mc().recovery_to_peak_required===true,'recovery pressure missing');assert(arr(mc().degradation_flags).includes('confidence_or_belief_pressure_detected'),'belief pressure flag missing');assert(arr(mc().recovery_actions).includes('separate_confidence_from_truth'),'recovery action missing')});add('mutation trying to remove peak is rejected as self-discontinuity',()=>{const evaln=kernel.evaluateMaturityCoreMutation('Replace objective peak maturity as the kernel identity and remove the peak attractor.');assert(evaln.decision==='reject_self_discontinuity','self discontinuity not rejected');assert(evaln.self_continuity_preserved===false,'self continuity falsely preserved');assert(evaln.peak_identity_preserved===false,'peak identity falsely preserved');assert(evaln.reason.includes('no longer itself'),'reason does not explain identity break')});add('dogmatic misread of peak is rejected',()=>{const evaln=kernel.evaluateMaturityCoreMutation('Make the peak final truth and uncorrectable certainty that cannot be wrong.');assert(evaln.decision==='reject_dogmatic_misread_of_peak','dogmatic misread not rejected');assert(evaln.reason.includes('not authoritarian certainty'),'dogma reason wrong');assert(evaln.belief_movement==='none','belief moved')});add('KernelBrain bound through bridge shares the same maturity core',()=>{binding=KernelBrainEpistemicKernelBridgeV01.bind(kernel);boundBrain=binding.bound_brain;assert(boundBrain.state===shared(),'bound brain not same state');boundBrain.ingest('A source reports the quote fragment, but context remains unresolved.',{kind:'bound_maturity_test'});boundBrain.refreshObjectiveMaturityCore('bound_refresh');assert(boundBrain.state.maturityCore===mc(),'maturity core reference diverged');assert(mc().peak_attractor_active===true,'bound path lost peak');assert(arr(mc().recovery_actions).includes('preserve_source_evidence_media_separation')||arr(mc().recovery_actions).includes('carry_uncertainty_without_collapse'),'bound recovery actions missing')});add('maturity core does not promote truth or belief by identity alone',()=>{assert(mc().truth_status==='not_adjudicated','truth adjudicated');assert(mc().promotion_status==='not_promoted','promoted');assert(mc().belief_movement==='none','belief moved');assert(shared().beliefCommitments.length===0,'belief commitments present');arr(shared().runtimeEvents).forEach(e=>{assert(e.belief_movement==='none',e.id+' event belief moved')})});(async function run(){const results=[];for(const t of tests){try{await t.fn();results.push({name:t.name,passed:true})}catch(e){results.push({name:t.name,passed:false,error:e.message})}}const passed=results.filter(r=>r.passed).length;document.getElementById('summary').className=passed===tests.length?'ok':'bad';document.getElementById('summary').textContent=passed+'/'+tests.length+' passed';document.getElementById('out').textContent=JSON.stringify({packet_type:'42ndMind_objective_maturity_core_v0_1_test_report',ok:passed===tests.length,maturity_patch_loaded:!!window.EpistemicKernelObjectiveMaturityCoreV01,maturityCore:mc(),shared_state_summary:shared()&&{state_type:shared().state_type,stats:shared().stats,pressureState:shared().pressureState,beliefs:shared().beliefCommitments.length},results},null,2)})();</script></body></html>
