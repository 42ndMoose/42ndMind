<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>42ndMind Objective Claim Trace</title><style>body{margin:0;background:#0f1115;color:#eef2ff;font:14px ui-monospace,Menlo,Consolas,monospace}header{padding:16px 18px;background:#11141b;border-bottom:1px solid #2a3040}main{padding:12px;display:grid;grid-template-columns:470px 1fr;gap:12px}section{background:#171a21;border:1px solid #2a3040;border-radius:10px;padding:12px}button{background:#25345c;color:#eef2ff;border:1px solid #3f5592;padding:8px 10px;border-radius:8px;cursor:pointer;margin:3px 3px 8px 0}pre{white-space:pre-wrap;background:#0d1016;border:1px solid #2a3040;border-radius:10px;padding:10px;overflow:auto;max-height:760px}.ok{color:#9dffb4}.bad{color:#ff8b8b}.muted{color:#8b93a7}a{color:#9db6ff}.card{background:#10131a;border:1px solid #2a3040;border-radius:10px;padding:10px;margin:10px 0}.trace{border-top:1px solid #252b3a;padding:7px 0}.pill{display:inline-block;border:1px solid #2a3040;border-radius:999px;padding:1px 7px;margin:2px}.safe{color:#9dffb4}.warn{color:#ffd28b}@media(max-width:900px){main{grid-template-columns:1fr}}</style></head><body><header><h1>42ndMind Objective Claim Trace</h1><div class="muted">Proof-style traces for objective claim-language outputs. No LLM. No source lookup. Candidate only.</div></header><main><section><a href="index.html">main</a> · <a href="objective-claim-language-v0-1-1.html?v=claim-2">claim language v0.1.1</a> · <a href="kernel-objective-claim-trace-v0-1-test.html?v=ctrace-1">test</a><p>Decision: <b id="decisionMetric">not run</b></p><p>Source version: <b id="sourceMetric">unknown</b></p><p>Traces: <b id="traceMetric">0</b></p><p>LLM used: <b id="llmMetric">unknown</b></p><p>Source lookup: <b id="lookupMetric">unknown</b></p><button onclick="runTrace()">Run claim traces</button><button onclick="showPacket()">Show packet</button><button onclick="showSummary()">Show summary</button><button onclick="copyOutput()">Copy output</button><div id="cards"></div></section><section><h2>Output</h2><pre id="out">No output yet.</pre></section></main><script src="src/kernel-objective-claim-language-v0-1.js?v=claim-1"></script><script src="src/kernel-objective-claim-language-v0-1-1-patch.js?v=claim-2"></script><script src="src/kernel-objective-claim-trace-v0-1.js?v=ctrace-1"></script><script>let packet=null,last='';function esc(v){return String(v??'').replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]))}function arr(v){return Array.isArray(v)?v:[]}function setOut(v){last=typeof v==='string'?v:JSON.stringify(v,null,2);document.getElementById('out').textContent=last}function setMetrics(){const decisionEl=document.getElementById('decisionMetric');decisionEl.textContent=packet&&packet.ok?'OBJECTIVE_CLAIM_TRACE_READY':'HELD_FOR_REVIEW';decisionEl.className=packet&&packet.ok?'ok':'bad';document.getElementById('sourceMetric').textContent=packet&&packet.source_claim_language_version||'unknown';document.getElementById('traceMetric').textContent=packet&&packet.trace_count||0;document.getElementById('llmMetric').textContent=String(packet&&packet.llm_used);document.getElementById('lookupMetric').textContent=String(packet&&packet.external_lookup_performed)}function runTrace(){try{packet=KernelObjectiveClaimTraceV01.runClaimTrace();setMetrics();renderCards();showSummary()}catch(e){document.getElementById('decisionMetric').textContent='ERROR';document.getElementById('decisionMetric').className='bad';setOut({ok:false,error:e.message,belief_movement:'none'})}}function renderCards(){document.getElementById('cards').innerHTML=arr(packet&&packet.traces).map(t=>`<div class="card"><h3>${esc(t.claim_id)} · ${esc(t.trace_kind)}</h3><p><span class="pill ${t.expected_match?'safe':'bad'}">expected ${esc(t.expected_match)}</span><span class="pill warn">${esc(t.truth_status_candidate)}</span><span class="pill safe">kind ${esc(t.claim_kind)}</span><span class="pill safe">deps ${esc(t.dependency_count)}</span><span class="pill safe">LLM ${esc(t.llm_used)}</span><span class="pill safe">lookup ${esc(t.external_lookup_performed)}</span></p><div class="muted">${esc(t.claim_text)}</div><div class="trace"><b>User context not auto-truth:</b> ${esc(t.user_context_not_auto_truth)}<br><b>Contradiction not resolved:</b> ${esc(t.contradiction_not_resolved)}<br><b>Hidden motive not decided:</b> ${esc(t.hidden_motive_not_decided)}<br><b>Dependencies:</b> ${esc(arr(t.dependencies).map(d=>d.dependency_type+':'+d.value).join(' | '))}</div><pre>${esc(t.trace_text)}</pre></div>`).join('')||'No traces.'}function summary(){return{packet_type:'42ndMind_objective_claim_trace_summary_view_v0_1',ok:packet&&packet.ok,source_claim_language_ok:packet&&packet.source_claim_language_ok,source_claim_language_version:packet&&packet.source_claim_language_version,source_claim_count:packet&&packet.source_claim_count,trace_count:packet&&packet.trace_count,llm_used:packet&&packet.llm_used,external_lookup_performed:packet&&packet.external_lookup_performed,traces:arr(packet&&packet.traces).map(t=>({trace_id:t.trace_id,claim_id:t.claim_id,trace_kind:t.trace_kind,claim_kind:t.claim_kind,truth_status_candidate:t.truth_status_candidate,dependency_count:t.dependency_count,user_context_not_auto_truth:t.user_context_not_auto_truth,contradiction_not_resolved:t.contradiction_not_resolved,hidden_motive_not_decided:t.hidden_motive_not_decided,llm_used:t.llm_used,external_lookup_performed:t.external_lookup_performed,belief_movement:t.belief_movement})),validation:packet&&packet.validation,belief_movement:'none'}}function showSummary(){if(!packet)return runTrace();setOut(summary())}function showPacket(){if(!packet)return runTrace();setOut(packet)}async function copyOutput(){try{await navigator.clipboard.writeText(last);document.getElementById('out').textContent='Copied.\n\n'+last}catch(e){}}runTrace();</script></body></html>
