<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>42ndMind Semantic Contrast Gap Planner v0.1 Test</title>
  <style>
    body { margin:0; font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; background:#0f1115; color:#eef2ff; }
    header { padding:16px 18px; border-bottom:1px solid #2a3040; background:#11141b; }
    main { padding:12px; }
    section { background:#171a21; border:1px solid #2a3040; border-radius:10px; padding:12px; }
    h1 { font:700 19px/1.2 system-ui,-apple-system,Segoe UI,sans-serif; margin:0 0 4px; }
    pre { white-space:pre-wrap; background:#0d1016; border:1px solid #2a3040; border-radius:10px; padding:10px; overflow:auto; max-height:760px; }
    .ok { color:#9dffb4; } .bad { color:#ff8b8b; } a { color:#9db6ff; }
  </style>
</head>
<body>
<header><h1>42ndMind Semantic Contrast Gap Planner v0.1 Test</h1><div>Tests bounded next-batch planning from distiller contrast gaps.</div></header>
<main><section><h2 id="summary">Running...</h2><div><a href="semantic-contrast-gap-planner.html">contrast gap planner</a> · <a href="semantic-language-distiller.html">language distiller</a> · <a href="semantic-operator-workbench.html">operator workbench</a></div><pre id="out"></pre></section></main>
<script src="src/kernel-semantic-corpus-v0-1.js?v=0.1.0"></script>
<script src="src/kernel-semantic-corpus-combiner-v0-1.js?v=0.1.0"></script>
<script src="src/kernel-semantic-language-distiller-v0-1.js?v=0.1.0"></script>
<script src="src/kernel-semantic-contrast-gap-planner-v0-1.js?v=0.1.0"></script>
<script>
  const tests = [];
  let plan = null;
  function add(name, fn) { tests.push({ name, fn }); }
  function assert(cond, msg) { if (!cond) throw new Error(msg); }

  add('modules load', () => {
    assert(window.KernelSemanticCorpusV01, 'KernelSemanticCorpusV01 missing');
    assert(window.KernelSemanticCorpusCombinerV01, 'KernelSemanticCorpusCombinerV01 missing');
    assert(window.KernelSemanticLanguageDistillerV01, 'KernelSemanticLanguageDistillerV01 missing');
    assert(window.KernelSemanticContrastGapPlannerV01, 'KernelSemanticContrastGapPlannerV01 missing');
    assert(KernelSemanticContrastGapPlannerV01.VERSION === '0.1.0', 'wrong planner version');
  });

  add('doctrine preserves planning boundary', () => {
    const d = KernelSemanticContrastGapPlannerV01.doctrine();
    assert(d.planner_suggests_review_batches_not_truth === true, 'review-batch doctrine missing');
    assert(d.suggested_sentences_are_seed_candidates_not_doctrine === true, 'seed candidate doctrine missing');
    assert(d.planner_does_not_patch_source === true, 'no source patch doctrine missing');
    assert(d.belief_movement === 'none', 'belief movement doctrine wrong');
  });

  add('load distiller and plan succeeds', async () => {
    plan = await KernelSemanticContrastGapPlannerV01.loadDistillAndPlan({ min_observations: 2, max_operator_targets: 5, max_sentences: 10 });
    assert(plan.ok === true, 'plan not ok');
    assert(plan.corpus_entry_count >= 53, 'corpus entry count too low');
    assert(plan.distillation_metrics.entries >= 53, 'distillation metrics not current');
    assert(plan.belief_movement === 'none', 'planner moved belief');
  });

  add('missing contrast items are ranked', () => {
    assert(Array.isArray(plan.ranked_missing_contrasts), 'ranked gaps missing');
    assert(plan.ranked_missing_contrasts.length === plan.contrast_gap_count, 'ranked count mismatch');
    assert(plan.ranked_missing_contrasts.every(x => typeof x.score === 'number'), 'missing scores');
  });

  add('planner selects template-backed targets', () => {
    assert(Array.isArray(plan.selected_operator_targets), 'selected targets missing');
    assert(plan.selected_operator_targets.length > 0, 'no selected targets');
    assert(plan.selected_operator_targets.length <= 5, 'too many selected targets');
    assert(plan.selected_operator_targets.every(t => t.rationale && t.score), 'target rationale/score missing');
  });

  add('suggested batch is bounded and actionable', () => {
    const batch = plan.suggested_batch;
    assert(batch.packet_type === '42ndMind_semantic_contrast_gap_suggested_batch_v0_1', 'wrong batch packet');
    assert(batch.sentence_count > 0, 'no suggested sentences');
    assert(batch.sentence_count <= 10, 'too many suggested sentences');
    assert(batch.intended_workflow.includes('ANALYZE only'), 'workflow boundary missing');
    assert(batch.sentences.every(s => typeof s === 'string' && s.length > 5), 'bad sentence');
  });

  add('batch text is newline-delimited for workbench paste', () => {
    const text = KernelSemanticContrastGapPlannerV01.batchText(plan);
    assert(text.includes('\n') || plan.suggested_batch.sentence_count === 1, 'batch text not newline-delimited');
    assert(text.split(/\n+/).filter(Boolean).length === plan.suggested_batch.sentence_count, 'batch text count mismatch');
  });

  add('planner includes distillation metrics', () => {
    const m = plan.distillation_metrics;
    assert(m.stable_mappings >= 48, 'stable mappings lower than expected current baseline');
    assert(m.weak_mappings <= 100, 'weak mappings unexpectedly high');
    assert(m.overmatch_risks === 0, 'expected no overmatch risks');
  });

  add('ranked gaps include template metadata where available', () => {
    assert(plan.ranked_missing_contrasts.some(g => g.known_template === true), 'no known template gap');
    assert(plan.ranked_missing_contrasts.every(g => g.rationale), 'missing gap rationale');
  });

  add('no source mutation doctrine is preserved in output', () => {
    assert(plan.doctrine.planner_does_not_patch_source === true, 'plan doctrine missing no patch');
    assert(plan.suggested_batch.rationale.length === plan.selected_operator_targets.length, 'rationale target mismatch');
  });

  (async function run(){
    const results = [];
    for (const t of tests) {
      try { await t.fn(); results.push({ name:t.name, passed:true }); }
      catch(e) { results.push({ name:t.name, passed:false, error:e.message }); }
    }
    const passed = results.filter(r => r.passed).length;
    document.getElementById('summary').className = passed === results.length ? 'ok' : 'bad';
    document.getElementById('summary').textContent = `${passed}/${results.length} passed`;
    document.getElementById('out').textContent = JSON.stringify({ packet_type:'42ndMind_semantic_contrast_gap_planner_v0_1_test_report', planned_sentence_count: plan && plan.suggested_batch ? plan.suggested_batch.sentence_count : 0, selected_targets: plan ? plan.selected_operator_targets : [], distillation_metrics: plan ? plan.distillation_metrics : null, results }, null, 2);
  })();
</script>
</body>
</html>
