<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>42ndMind Canonical Formula Ledger v0.1.1 Test</title><style>body{margin:0;background:#0f1115;color:#eef2ff;font:14px ui-monospace,Menlo,Consolas,monospace}header{padding:16px;background:#11141b;border-bottom:1px solid #2a3040}main{padding:12px}section{background:#171a21;border:1px solid #2a3040;border-radius:10px;padding:12px}pre{white-space:pre-wrap;background:#0d1016;border:1px solid #2a3040;border-radius:10px;padding:10px;overflow:auto;max-height:760px}.ok{color:#9dffb4}.bad{color:#ff8b8b}a{color:#9db6ff}</style></head><body><header><h1>42ndMind Canonical Formula Ledger v0.1.1 Test</h1><div>Tests ledger ingestion of v0003 coefficient/dimension revision candidate versions. Candidate only.</div></header><main><section><h2 id="summary">Running...</h2><div><a href="intention-canonical-formula-ledger-v0-1-1.html?v=ledger-2">ledger v0.1.1 page</a></div><pre id="out"></pre></section></main><script src="src/kernel-intention-discovery-v0-1.js?v=intent-1"></script><script src="src/kernel-intention-refinement-v0-1.js?v=refine-1"></script><script src="src/kernel-intention-necessity-test-v0-1.js?v=necessity-1"></script><script src="src/kernel-intention-neighbor-lattice-v0-1.js?v=lattice-3"></script><script src="src/kernel-intention-lattice-invariance-benchmark-v0-1.js?v=invariance-2"></script><script src="src/kernel-intention-formula-compiler-v0-1.js?v=formula-1"></script><script src="src/kernel-intention-concept-expansion-loop-v0-1.js?v=expansion-2"></script><script src="src/kernel-intention-contradiction-refinement-loop-v0-1.js?v=contradiction-1"></script><script src="src/kernel-intention-formula-revision-engine-v0-1.js?v=revision-1"></script><script src="src/kernel-intention-canonical-formula-ledger-v0-1.js?v=ledger-1"></script><script src="src/kernel-intention-proof-output-v0-1.js?v=proof-1"></script><script src="src/kernel-intention-minimal-pair-library-v0-1.js?v=minpair-1"></script><script src="src/kernel-intention-dimension-splitting-v0-1.js?v=split-2"></script><script src="src/kernel-intention-coefficient-dimension-revision-engine-v0-1.js?v=codim-1"></script><script src="src/kernel-intention-canonical-formula-ledger-v0-1-1-patch.js?v=ledger-2"></script><script>const tests=[];let packet=null;function add(n,f){tests.push({name:n,fn:f})}function assert(c,m){if(!c)throw new Error(m)}function arr(v){return Array.isArray(v)?v:[]}function records(){return arr(packet&&packet.ledger_records)}function versions(){return records().flatMap(r=>arr(r.versions))}function byType(r,t){return arr(r.versions).find(v=>v.source_type===t)}add('modules load and doctrine is ledger-ingestion only',()=>{assert(window.KernelIntentionCanonicalFormulaLedgerV011,'ledger v0.1.1 patch missing');assert(KernelIntentionCanonicalFormulaLedgerV011.VERSION==='0.1.1','version wrong');assert(typeof KernelIntentionCanonicalFormulaLedgerV011.runLedger==='function','runLedger missing');const d=KernelIntentionCanonicalFormulaLedgerV011.doctrine();assert(d.ingests_v0003_coefficient_dimension_revisions===true,'v0003 ingestion doctrine missing');assert(d.preserves_v0001_compiled_formula===true,'v0001 preservation guard missing');assert(d.preserves_v0002_staged_revision===true,'v0002 preservation guard missing');assert(d.appends_v0003_without_silent_overwrite===true,'overwrite guard missing');assert(d.belief_movement==='none','belief movement wrong')});add('ledger v0.1.1 runs from base ledger and coefficient-dimension revisions',()=>{packet=KernelIntentionCanonicalFormulaLedgerV011.runLedger();assert(packet.ok===true,'packet not ok: '+JSON.stringify(packet.validation));assert(packet.source_base_ledger_ok===true,'base ledger not ok');assert(packet.source_codim_revision_ok===true,'coefficient-dimension source not ok');assert(packet.source_base_ledger_record_count===11,'expected 11 base records');assert(packet.source_codim_revision_count===11,'expected 11 codim revisions');assert(packet.belief_movement==='none','packet moved belief')});add('eleven concepts and thirty-three total versions are present',()=>{assert(packet.ledger_record_count===11,'expected 11 records');assert(records().length===11,'expected 11 record rows');assert(packet.total_version_count===33,'expected 33 total versions');records().forEach(r=>assert(arr(r.versions).length>=3,r.concept+' version count < 3'));assert(packet.validation.checks.ledger_has_11_concepts===true,'11 concepts check failed');assert(packet.validation.checks.version_count_at_least_3_per_concept===true,'3 versions check failed')});add('v0001, v0002, and v0003 are preserved for every concept',()=>{records().forEach(r=>{assert(byType(r,'compiled_formula'),r.concept+' missing v0001 compiled formula');assert(byType(r,'staged_revision'),r.concept+' missing v0002 staged revision');assert(byType(r,'coefficient_dimension_revision'),r.concept+' missing v0003 coefficient dimension revision')});assert(packet.validation.checks.v0001_preserved_for_each_concept===true,'v0001 check failed');assert(packet.validation.checks.v0002_preserved_for_each_concept===true,'v0002 check failed');assert(packet.validation.checks.v0003_stored_for_each_concept===true,'v0003 check failed')});add('current candidate is v0003 and remains unpromoted',()=>{records().forEach(r=>{const v3=byType(r,'coefficient_dimension_revision');assert(r.current_candidate_version===v3.version_id,r.concept+' current candidate not v0003');assert(v3.promotion_status==='not_promoted',r.concept+' v0003 promoted');assert(v3.doctrine_status==='candidate_not_doctrine',r.concept+' v0003 doctrine status wrong')});assert(packet.validation.checks.current_candidate_is_v0003===true,'current candidate v0003 check failed');assert(packet.validation.checks.all_promotion_status_not_promoted===true,'promotion check failed')});add('v0003 has ten dimensions and all L1 totals remain 1',()=>{records().forEach(r=>{const v3=byType(r,'coefficient_dimension_revision');assert(arr(v3.shape_terms).length===10,r.concept+' v0003 dimension count wrong');arr(r.versions).forEach(v=>assert(v.validation&&v.validation.ledger_l1_total===1,r.concept+' '+v.version_id+' l1 wrong'))});assert(packet.validation.checks.v0003_dimension_count_10===true,'v0003 dimension count check failed');assert(packet.validation.checks.all_l1_totals_equal_1===true,'all l1 check failed')});add('force terms, rollback, and overwrite protection are preserved',()=>{records().forEach(r=>{assert(r.rollback_available===true,r.concept+' rollback unavailable');assert(arr(r.rollback_targets).length>=3,r.concept+' rollback targets missing');assert(new Set(arr(r.versions).map(v=>v.version_id)).size===arr(r.versions).length,r.concept+' duplicate version ids');arr(r.versions).forEach(v=>assert(v.validation&&v.validation.force_terms_outside_shape===true,r.concept+' '+v.version_id+' force leaked'))});assert(packet.validation.checks.force_terms_outside_shape===true,'force check failed');assert(packet.validation.checks.rollback_data_present===true,'rollback check failed');assert(packet.validation.checks.no_silent_overwrite===true,'overwrite check failed')});add('source snapshots and belief movement are preserved',()=>{records().forEach(r=>{const v3=byType(r,'coefficient_dimension_revision');assert(v3.source_formula_snapshot,r.concept+' v0003 source snapshot missing');assert(v3.formula_snapshot.source_formula_mutated===false,r.concept+' source formula mutated');assert(v3.belief_movement==='none',r.concept+' v0003 moved belief');assert(r.belief_movement==='none',r.concept+' record moved belief')});assert(packet.validation.checks.belief_movement_none===true,'belief movement check failed');assert(arr(packet.validation.errors).length===0,'validation errors present: '+packet.validation.errors.join(','))});(async function run(){const results=[];for(const t of tests){try{await t.fn();results.push({name:t.name,passed:true})}catch(e){results.push({name:t.name,passed:false,error:e.message})}}const passed=results.filter(r=>r.passed).length;document.getElementById('summary').className=passed===tests.length?'ok':'bad';document.getElementById('summary').textContent=passed+'/'+tests.length+' passed';document.getElementById('out').textContent=JSON.stringify({packet_type:'42ndMind_intention_canonical_formula_ledger_v0_1_1_test_report',ok:passed===tests.length,ledger_record_count:packet&&packet.ledger_record_count,total_version_count:packet&&packet.total_version_count,records:records().map(r=>({concept:r.concept,current_candidate_version:r.current_candidate_version,version_count:r.versions.length,version_types:r.versions.map(v=>v.source_type),rollback_available:r.rollback_available})),validation:packet&&packet.validation,results},null,2)})();</script></body></html>
