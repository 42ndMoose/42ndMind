<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>42ndMind Intention Cross-Language Benchmark Test</title><style>body{margin:0;background:#0f1115;color:#eef2ff;font:14px ui-monospace,Menlo,Consolas,monospace}header{padding:16px;background:#11141b;border-bottom:1px solid #2a3040}main{padding:12px}section{background:#171a21;border:1px solid #2a3040;border-radius:10px;padding:12px}pre{white-space:pre-wrap;background:#0d1016;border:1px solid #2a3040;border-radius:10px;padding:10px;overflow:auto;max-height:760px}.ok{color:#9dffb4}.bad{color:#ff8b8b}a{color:#9db6ff}</style></head><body><header><h1>42ndMind Intention Cross-Language Benchmark Test</h1><div>Tests versioned formula invariance across English, Indonesian, Tagalog, Japanese, Spanish, and Arabic surfaces. Candidate only.</div></header><main><section><h2 id="summary">Running...</h2><div><a href="intention-cross-language-benchmark.html?v=xlang-1">cross-language benchmark page</a></div><pre id="out"></pre></section></main><script src="src/kernel-intention-discovery-v0-1.js?v=intent-1"></script><script src="src/kernel-intention-refinement-v0-1.js?v=refine-1"></script><script src="src/kernel-intention-necessity-test-v0-1.js?v=necessity-1"></script><script src="src/kernel-intention-neighbor-lattice-v0-1.js?v=lattice-3"></script><script src="src/kernel-intention-lattice-invariance-benchmark-v0-1.js?v=invariance-2"></script><script src="src/kernel-intention-formula-compiler-v0-1.js?v=formula-1"></script><script src="src/kernel-intention-concept-expansion-loop-v0-1.js?v=expansion-2"></script><script src="src/kernel-intention-contradiction-refinement-loop-v0-1.js?v=contradiction-1"></script><script src="src/kernel-intention-formula-revision-engine-v0-1.js?v=revision-1"></script><script src="src/kernel-intention-canonical-formula-ledger-v0-1.js?v=ledger-1"></script><script src="src/kernel-intention-cross-language-benchmark-v0-1.js?v=xlang-1"></script><script>const tests=[];let packet=null;function add(n,f){tests.push({name:n,fn:f})}function assert(c,m){if(!c)throw new Error(m)}function arr(v){return Array.isArray(v)?v:[]}function cases(){return arr(packet&&packet.case_results)}function langs(){return arr(packet&&packet.language_summary)}add('modules load and doctrine is cross-language only',()=>{assert(window.KernelIntentionCrossLanguageBenchmarkV01,'cross-language benchmark missing');assert(KernelIntentionCrossLanguageBenchmarkV01.VERSION==='0.1.0','version wrong');assert(typeof KernelIntentionCrossLanguageBenchmarkV01.runBenchmark==='function','runBenchmark missing');const d=KernelIntentionCrossLanguageBenchmarkV01.doctrine();assert(d.benchmarks_language_invariance_not_claim_facts===true,'claim-fact guard missing');assert(d.no_person_event_or_narrative_belief_ledger===true,'belief ledger guard missing');assert(d.tests_formula_structure_not_surface_english===true,'surface-English guard missing');assert(d.force_intensity_outside_shape==='F = M · i','force guard missing');assert(d.belief_movement==='none','belief movement wrong')});add('benchmark runs from canonical ledger',()=>{packet=KernelIntentionCrossLanguageBenchmarkV01.runBenchmark();assert(packet.ok===true,'packet not ok: '+JSON.stringify(packet.validation));assert(packet.source_ledger_ok===true,'source ledger not ok');assert(packet.source_ledger_record_count===11,'expected 11 source ledger records');assert(packet.belief_movement==='none','packet moved belief')});add('six languages are covered',()=>{assert(packet.language_count===6,'expected 6 languages');const codes=arr(packet.languages).map(l=>l.code).sort().join(',');assert(codes==='ar,en,es,id,ja,tl','language set wrong: '+codes);langs().forEach(row=>{assert(row.case_count===11,row.language+' should have 11 cases');assert(row.passed_case_count===11,row.language+' should pass 11 cases');assert(row.ok===true,row.language+' summary not ok');assert(row.belief_movement==='none',row.language+' moved belief')})});add('eleven concepts and sixty-six cases are covered',()=>{assert(packet.concept_count===11,'expected 11 concepts');assert(packet.case_count===66,'expected 66 cases');assert(packet.passed_case_count===66,'expected 66 passed cases');assert(packet.validation.checks.eleven_concepts===true,'11 concept check failed');assert(packet.validation.checks.sixty_six_cases===true,'66 case check failed')});add('all language cases preserve concept and version identity',()=>{cases().forEach(row=>{assert(row.ok===true,row.id+' failed: '+arr(row.errors).join(','));assert(row.expected_concept===row.observed_concept,row.id+' concept changed');assert(row.expected_version_id===row.observed_version_id,row.id+' version changed');assert(row.expected_shape_signature===row.observed_shape_signature,row.id+' shape signature changed');assert(row.surface_concept&&row.surface_concept.length>0,row.id+' missing surface concept');assert(row.surface_frame&&row.surface_frame.length>0,row.id+' missing surface frame')})});add('all L1 totals remain 1',()=>{cases().forEach(row=>assert(row.observed_l1_total===1,row.id+' l1 wrong: '+row.observed_l1_total));assert(packet.validation.checks.all_l1_totals_equal_1===true,'packet l1 check failed')});add('force terms remain outside shape',()=>{cases().forEach(row=>assert(row.force_terms_outside_shape===true,row.id+' force leaked into shape'));assert(packet.validation.checks.force_terms_outside_shape===true,'packet force separation check failed')});add('candidate-only status and belief movement are preserved',()=>{assert(packet.validation.checks.candidate_only_not_promoted===true,'candidate-only check failed');assert(packet.validation.checks.belief_movement_none===true,'belief movement check failed');cases().forEach(row=>{assert(row.belief_movement==='none',row.id+' moved belief');assert(!arr(row.errors).includes('version_promoted'),row.id+' promoted')});assert(arr(packet.validation.errors).length===0,'validation errors present: '+packet.validation.errors.join(','))});(async function run(){const results=[];for(const t of tests){try{await t.fn();results.push({name:t.name,passed:true})}catch(e){results.push({name:t.name,passed:false,error:e.message})}}const passed=results.filter(r=>r.passed).length;document.getElementById('summary').className=passed===tests.length?'ok':'bad';document.getElementById('summary').textContent=passed+'/'+tests.length+' passed';document.getElementById('out').textContent=JSON.stringify({packet_type:'42ndMind_intention_cross_language_benchmark_test_report_v0_1',ok:passed===tests.length,language_count:packet&&packet.language_count,concept_count:packet&&packet.concept_count,case_count:packet&&packet.case_count,passed_case_count:packet&&packet.passed_case_count,language_summary:packet&&packet.language_summary,validation:packet&&packet.validation,results},null,2)})();</script></body></html>
