<script>
  const tests = [];
  let fullPacket = null;
  function add(name, fn) { tests.push({ name, fn }); }
  function assert(cond, msg) { if (!cond) throw new Error(msg); }

  const fixtureValidation = {
    packet_type: '42ndMind_semantic_template_validation_report_v0_1',
    validation_case_count: 3,
    results: [
      {
        sentence: 'The post makes a serious accusation without showing a direct evidence link.',
        recommendation: 'accept',
        expected_template_group: 'accusation_risk_direct_evidence_gap',
        expected_pressure_signature: 'accusation_pressure|direct_link_evidence_burden|evidence_gap_pressure|reputational_risk_pressure',
        expected_pressures: ['accusation_pressure','direct_link_evidence_burden','evidence_gap_pressure','reputational_risk_pressure'],
        actual_operators: ['reckless_accusation(actor,target,claim)'],
        actual_operator_names: ['reckless_accusation'],
        actual_pressures: ['accusation_pressure','direct_link_evidence_burden','evidence_gap_pressure','reputational_risk_pressure'],
        evidence_burden: ['Identify the direct evidence link.'],
        legitimacy_guards: ['Require actor, target, claim, and direct evidence link.'],
        contrast_classes: ['supported_accusation(claim)', 'false_accusation(claim)'],
        comparison: { missing_pressures: [], extra_pressures: [] },
        belief_movement: 'none'
      },
      {
        sentence: 'The article recklessly accused the official of misconduct without direct evidence.',
        recommendation: 'accept',
        expected_template_group: 'accusation_risk_direct_evidence_gap',
        expected_pressure_signature: 'accusation_pressure|direct_link_evidence_burden|evidence_gap_pressure|reputational_risk_pressure',
        expected_pressures: ['accusation_pressure','direct_link_evidence_burden','evidence_gap_pressure','reputational_risk_pressure'],
        actual_operators: ['reckless_accusation(actor,target,claim)'],
        actual_operator_names: ['reckless_accusation'],
        actual_pressures: ['accusation_pressure','direct_link_evidence_burden','evidence_gap_pressure','reputational_risk_pressure'],
        evidence_burden: ['Identify the direct evidence link.'],
        legitimacy_guards: ['Require actor, target, claim, and direct evidence link.'],
        contrast_classes: ['supported_accusation(claim)', 'false_accusation(claim)'],
        comparison: { missing_pressures: [], extra_pressures: [] },
        belief_movement: 'none'
      },
      {
        sentence: 'The claim calls the accusation false, so the contradictory evidence must be identified directly.',
        recommendation: 'reject',
        expected_template_group: 'false_accusation_direct_contradiction',
        expected_pressure_signature: 'accusation_pressure|contradiction_pressure|evidence_contact_pressure|reputational_risk_pressure',
        expected_pressures: ['accusation_pressure','contradiction_pressure','evidence_contact_pressure','reputational_risk_pressure'],
        actual_operators: [],
        actual_operator_names: [],
        actual_pressures: [],
        evidence_burden: [],
        legitimacy_guards: [],
        contrast_classes: [],
        comparison: { missing_pressures: ['accusation_pressure','contradiction_pressure','evidence_contact_pressure','reputational_risk_pressure'], extra_pressures: [] },
        belief_movement: 'none'
      }
    ]
  };

  add('modules load', () => {
    assert(window.KernelSemanticLawCandidateExtractorV01, 'law extractor missing');
    assert(window.KernelSemanticValidationTriagePlannerV01, 'triage planner missing');
    assert(KernelSemanticLawCandidateExtractorV01.VERSION === '0.1.0', 'law extractor version wrong');
  });

  add('doctrine preserves no belief movement', () => {
    const d = KernelSemanticLawCandidateExtractorV01.doctrine();
    assert(d.law_candidates_are_reviewable_equations_not_doctrine === true, 'law candidate doctrine missing');
    assert(d.objective_language_requires_repeatable_mapping_and_contrast_survival === true, 'objective language doctrine missing');
    assert(d.extractor_does_not_promote_doctrine === true, 'promotion doctrine missing');
    assert(d.belief_movement === 'none', 'belief movement doctrine wrong');
  });

  add('operator and pressure formatting works', () => {
    assert(KernelSemanticLawCandidateExtractorV01.operatorName('reckless_accusation(actor,target,claim)') === 'reckless_accusation', 'operator name parse wrong');
    assert(KernelSemanticLawCandidateExtractorV01.pressureSignature(['b_pressure', 'a_pressure']) === 'a_pressure|b_pressure', 'pressure signature wrong');
    assert(KernelSemanticLawCandidateExtractorV01.equationFor('x(a)', ['b', 'a']).includes('x :='), 'equation missing operator');
  });

  add('accepted and contested rows split correctly', () => {
    const accepted = KernelSemanticLawCandidateExtractorV01.acceptedRows(fixtureValidation);
    const contested = KernelSemanticLawCandidateExtractorV01.contestedRows(fixtureValidation);
    assert(accepted.length === 2, 'accepted rows wrong');
    assert(contested.length === 1, 'contested rows wrong');
  });

  add('groupAcceptedRows groups same operator/vector mapping', () => {
    const groups = KernelSemanticLawCandidateExtractorV01.groupAcceptedRows(KernelSemanticLawCandidateExtractorV01.acceptedRows(fixtureValidation));
    assert(groups.length === 1, 'expected one law group');
    assert(groups[0].operators[0] === 'reckless_accusation', 'wrong grouped operator');
    assert(groups[0].rows.length === 2, 'group observation count wrong');
  });

  add('extractFromValidation creates law candidate and boundary', () => {
    const report = KernelSemanticLawCandidateExtractorV01.extractFromValidation(fixtureValidation);
    assert(report.packet_type === '42ndMind_semantic_law_candidate_report_v0_1', 'wrong report type');
    assert(report.summary.law_candidate_count === 1, 'law candidate count wrong');
    assert(report.summary.contrast_boundary_count === 1, 'boundary count wrong');
    assert(report.law_candidates[0].equation.includes('reckless_accusation'), 'law equation missing operator');
    assert(report.law_candidates[0].observation_count === 2, 'law observation count wrong');
    assert(report.law_candidates[0].blocked_movement.includes('blocked'), 'blocked movement missing');
    assert(report.contrast_boundaries[0].boundary_status === 'hard_boundary_or_unmatched_language', 'boundary status wrong');
    assert(report.belief_movement === 'none', 'report moved belief');
  });

  add('buildLawCandidate preserves evidence burden and contrast classes', () => {
    const groups = KernelSemanticLawCandidateExtractorV01.groupAcceptedRows(KernelSemanticLawCandidateExtractorV01.acceptedRows(fixtureValidation));
    const law = KernelSemanticLawCandidateExtractorV01.buildLawCandidate(groups[0], { pressure_dimensions:['accusation_pressure','direct_link_evidence_burden','evidence_gap_pressure','reputational_risk_pressure'] });
    assert(law.evidence_burden.includes('Identify the direct evidence link.'), 'evidence burden missing');
    assert(law.contrast_classes.includes('supported_accusation(claim)'), 'contrast class missing');
    assert(law.binary_pressure_vector.accusation_pressure === 1, 'binary vector missing pressure');
    assert(law.allowed_movement === 'none_from_language_alone', 'allowed movement wrong');
  });

  add('extractor module availability reports triage path', () => {
    const a = KernelSemanticLawCandidateExtractorV01.modulesAvailable();
    assert(a.triage_planner === true, 'triage planner unavailable');
  });

  add('loadValidateTriageAndExtract runs current full path', async () => {
    fullPacket = await KernelSemanticLawCandidateExtractorV01.loadValidateTriageAndExtract({ min_template_observations:2, min_observations:2, limit:10, sentences_per_template:4, allowed_extra_pressures:0 });
    assert(fullPacket.ok === true, 'full law packet not ok');
    assert(fullPacket.law_report.summary.accepted_rows >= 1, 'expected accepted rows');
    assert(fullPacket.law_report.summary.law_candidate_count >= 1, 'expected law candidates');
    assert(fullPacket.law_report.law_candidates.every(l => l.belief_movement === 'none'), 'law candidate moved belief');
    assert(fullPacket.belief_movement === 'none', 'full packet moved belief');
  });

  (async function run(){
    const results = [];
    for (const t of tests) {
      try { await t.fn(); results.push({ name:t.name, passed:true }); }
      catch(e) { results.push({ name:t.name, passed:false, error:e.message }); }
    }
    const passed = results.filter(r => r.passed).length;
    document.getElementById('summary').className = passed === results.length ? 'ok' : 'bad';
    document.getElementById('summary').textContent = `${passed}/${results.length} passed`;
    document.getElementById('out').textContent = JSON.stringify({
      packet_type:'42ndMind_semantic_law_candidate_extractor_v0_1_test_report',
      full_law_summary: fullPacket && fullPacket.summary,
      results
    }, null, 2);
  })();
</script>
