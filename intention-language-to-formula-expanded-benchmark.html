ket</button><button onclick="showSummary()">Show summary</button><button onclick="copyOutput()">Copy output</button><div id="cards"></div></section><section><h2>Output</h2><pre id="out">No output yet.</pre></section></main><script src="src/kernel-intention-discovery-v0-1.js?v=intent-1"></script><script src="src/kernel-intention-refinement-v0-1.js?v=refine-1"></script><script src="src/kernel-intention-necessity-test-v0-1.js?v=necessity-1"></script><script src="src/kernel-intention-neighbor-lattice-v0-1.js?v=lattice-3"></script><script src="src/kernel-intention-lattice-invariance-benchmark-v0-1.js?v=invariance-2"></script><script src="src/kernel-intention-formula-compiler-v0-1.js?v=formula-1"></script><script src="src/kernel-intention-concept-expansion-loop-v0-1.js?v=expansion-2"></script><script src="src/kernel-intention-contradiction-refinement-loop-v0-1.js?v=contradiction-1"></script><script src="src/kernel-intention-formula-revision-engine-v0-1.js?v=revision-1"></script><script src="src/kernel-intention-canonical-formula-ledger-v0-1.js?v=ledger-1"></script><script src="src/kernel-intention-proof-output-v0-1.js?v=proof-1"></script><script src="src/kernel-intention-minimal-pair-library-v0-1.js?v=minpair-1"></script><script src="src/kernel-intention-dimension-splitting-v0-1.js?v=split-2"></script><script src="src/kernel-intention-coefficient-dimension-revision-engine-v0-1.js?v=codim-1"></script><script src="src/kernel-intention-canonical-formula-ledger-v0-1-1-patch.js?v=ledger-2"></script><script src="src/kernel-intention-arbitrary-language-parser-v0-1.js?v=parser-1"></script><script src="src/kernel-intention-arbitrary-language-parser-v0-1-1-patch.js?v=parser-2"></script><script>let packet=null,last='';function esc(v){return String(v??'').replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]))}function arr(v){return Array.isArray(v)?v:[]}function setOut(v){last=typeof v==='string'?v:JSON.stringify(v,null,2);document.getElementById('out').textContent=last}function setMetrics(){const decisionEl=document.getElementById('decisionMetric');decisionEl.textContent=packet&&packet.ok?'EXPANDED_LANGUAGE_TO_FORMULA_READY':'HELD_FOR_REVIEW';decisionEl.className=packet&&packet.ok?'ok':'bad';document.getElementById('parseMetric').textContent=packet&&packet.parse_count||0;document.getElementById('labelMetric').textContent=packet&&packet.labelled_case_count||0;document.getElementById('ambiguityMetric').textContent=packet&&packet.ambiguity_case_count||0;document.getElementById('unmatchedMetric').textContent=packet&&packet.unmatched_case_count||0}function runExpanded(){try{packet=KernelIntentionArbitraryLanguageParserV011.runExpandedParser();setMetrics();renderCards();showSummary()}catch(e){document.getElementById('decisionMetric').textContent='ERROR';document.getElementById('decisionMetric').className='bad';setOut({ok:false,error:e.message,belief_movement:'none'})}}function renderCards(){document.getElementById('cards').innerHTML=arr(packet&&packet.parses).map(p=>{const top=p.top_candidate||{};return`<div class="card"><h3>${esc(p.parse_id)} · ${esc(p.expected_mode)}</h3><p><span class="pill ${p.expected_match_v0_1_1?'safe':'bad'}">expected ${esc(p.expected_match_v0_1_1)}</span><span class="pill warn">status ${esc(p.parse_status)}</span><span class="pill safe">top ${esc(top.concept)}</span><span class="pill safe">ambiguity ${esc(p.ambiguity_score)}</span></p><div class="muted">${esc(p.input_text)}</div><div class="case"><b>Expected:</b> ${esc(p.expected_concept)}<br><b>Version:</b> ${esc(top.candidate_version)}<br><b>Alias hits:</b> ${esc(arr(top.alias_hits).join(', '))}<br><b>Unresolved dimensions:</b> ${esc(top.unresolved_dimension_count)}</div></div>`}).join('')||'No parses.'}function summary(){return{packet_type:'42ndMind_intention_language_to_formula_expanded_benchmark_summary_view_v0_1_1',ok:packet&&packet.ok,source_ledger_ok:packet&&packet.source_ledger_ok,source_ledger_record_count:packet&&packet.source_ledger_record_count,source_proof_ok:packet&&packet.source_proof_ok,source_proof_count:packet&&packet.source_proof_count,parse_count:packet&&packet.parse_count,labelled_case_count:packet&&packet.labelled_case_count,ambiguity_case_count:packet&&packet.ambiguity_case_count,unmatched_case_count:packet&&packet.unmatched_case_count,parses:arr(packet&&packet.parses).map(p=>({parse_id:p.parse_id,expected_mode:p.expected_mode,expected_concept:p.expected_concept,parse_status:p.parse_status,top_concept:p.top_candidate&&p.top_candidate.concept,top_version:p.top_candidate&&p.top_candidate.candidate_version,ambiguity_score:p.ambiguity_score,unresolved_dimension_count:p.top_candidate&&p.top_candidate.unresolved_dimension_count,expected_match_v0_1_1:p.expected_match_v0_1_1,belief_movement:p.belief_movement})),validation:packet&&packet.validation,belief_movement:'none'}}function showSummary(){if(!packet)return runExpanded();setOut(summary())}function showPacket(){if(!packet)return runExpanded();setOut(packet)}async function copyOutput(){try{await navigator.clipboard.writeText(last);document.getElementById('out').textContent='Copied.\n\n'+last}catch(e){}}runExpanded();</script></body></html>
