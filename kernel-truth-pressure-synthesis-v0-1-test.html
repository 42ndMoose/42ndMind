<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>42ndMind Truth Pressure Synthesis Test v0.1</title><style>body{margin:0;background:#0f1115;color:#eef2ff;font:14px ui-monospace,Menlo,Consolas,monospace}header{padding:16px;background:#11141b;border-bottom:1px solid #2a3040}main{padding:12px}section{background:#171a21;border:1px solid #2a3040;border-radius:10px;padding:12px}pre{white-space:pre-wrap;background:#0d1016;border:1px solid #2a3040;border-radius:10px;padding:10px;overflow:auto;max-height:760px}.ok{color:#9dffb4}.bad{color:#ff8b8b}a{color:#9db6ff}</style></head><body><header><h1>42ndMind Truth Pressure Synthesis Test v0.1</h1><div>Combines claim-language outputs, source provenance, and evidence/media summaries without final truth promotion.</div></header><main><section><h2 id="summary">Running...</h2><div><a href="truth-pressure-synthesis.html?v=truth-1">truth pressure synthesis page</a></div><pre id="out"></pre></section></main><script src="src/kernel-objective-claim-language-v0-1.js?v=claim-1"></script><script src="src/kernel-objective-claim-language-v0-1-1-patch.js?v=claim-2"></script><script src="src/kernel-external-anchor-packet-schema-v0-1.js?v=anchor-1"></script><script src="src/kernel-source-provenance-registry-v0-1.js?v=prov-1"></script><script src="src/kernel-evidence-media-registry-v0-1.js?v=evidence-1"></script><script src="src/kernel-truth-pressure-synthesis-v0-1.js?v=truth-1"></script><script>const tests=[];let packet=null;function add(n,f){tests.push({name:n,fn:f})}function assert(c,m){if(!c)throw new Error(m)}function arr(v){return Array.isArray(v)?v:[]}function records(){return arr(packet&&packet.synthesis_records)}function validation(){return packet&&packet.validation||{}}function byClaim(id){return records().find(r=>r.claim_id===id)}add('module loads and doctrine synthesizes pressure without truth promotion',()=>{assert(window.KernelObjectiveClaimLanguageV01,'claim language missing');assert(window.KernelEvidenceMediaRegistryV01,'evidence media missing');assert(window.KernelTruthPressureSynthesisV01,'truth synthesis missing');assert(KernelTruthPressureSynthesisV01.VERSION==='0.1.0','version wrong');assert(typeof KernelTruthPressureSynthesisV01.runSynthesis==='function','runSynthesis missing');const d=KernelTruthPressureSynthesisV01.doctrine();assert(d.synthesizes_truth_pressure_without_truth_promotion===true,'truth-pressure doctrine missing');assert(d.support_counterevidence_contradiction_narrative_propaganda_and_gaps_remain_separate===true,'separation doctrine missing');assert(d.contradiction_detection_is_not_contradiction_resolution===true,'contradiction doctrine missing');assert(d.narrative_pressure_is_not_hidden_motive_proof===true,'narrative doctrine missing');assert(d.propaganda_pressure_is_structural_not_external_fact_check===true,'propaganda doctrine missing');assert(d.no_llm===true,'no LLM doctrine missing');assert(d.no_source_lookup===true,'no lookup doctrine missing');assert(d.belief_movement==='none','belief movement wrong')});add('synthesis runs from claim language and evidence media registry',()=>{packet=KernelTruthPressureSynthesisV01.runSynthesis();assert(packet.ok===true,'packet not ok: '+JSON.stringify(validation()));assert(packet.source_claim_language_ok===true,'claim language not ok');assert(packet.source_evidence_media_ok===true,'evidence media not ok');assert(packet.source_claim_count===8,'expected 8 source claims');assert(packet.source_evidence_record_count===5,'expected 5 evidence records');assert(packet.external_claim_evidence_summary_count===4,'expected 4 claim evidence summaries');assert(packet.synthesis_record_count===8,'expected 8 synthesis records');assert(packet.llm_used===false,'packet used LLM');assert(packet.external_lookup_performed===false,'packet performed lookup');assert(packet.adjudicates_final_truth===false,'packet adjudicated final truth');assert(packet.belief_movement==='none','packet moved belief')});add('all expected pressure statuses are visible',()=>{const statuses=records().map(r=>r.synthesis_status_candidate);['evidence_supported_pressure_candidate','unsupported_unresolved_pressure_candidate','contradiction_pressure_visible_candidate','narrative_overclaim_pressure_visible_candidate','propaganda_pressure_visible_candidate','corroborated_pressure_candidate','causal_overclaim_pressure_visible_candidate','ambiguous_unresolved_pressure_candidate'].forEach(s=>assert(statuses.includes(s),s+' missing'));assert(validation().checks.evidence_support_visible===true,'evidence support check failed');assert(validation().checks.corroboration_visible===true,'corroboration check failed');assert(validation().checks.unsupported_unresolved_visible===true,'unsupported check failed');assert(validation().checks.contradiction_visible_not_resolved===true,'contradiction check failed');assert(validation().checks.narrative_overclaim_visible_not_motive_proof===true,'narrative check failed');assert(validation().checks.propaganda_pressure_visible_not_fact_check===true,'propaganda check failed');assert(validation().checks.causal_overclaim_visible===true,'causal check failed');assert(validation().checks.ambiguity_preserved===true,'ambiguity check failed')});add('pressure components stay separate and bounded',()=>{records().forEach(r=>{const c=r.pressure_components;['support_pressure','counter_pressure','contradiction_pressure','narrative_pressure','propaganda_pressure','unresolved_gap_pressure'].forEach(k=>{assert(typeof c[k]==='number',r.claim_id+' '+k+' not number');assert(c[k]>=0&&c[k]<=1,r.claim_id+' '+k+' out of range '+c[k])});assert(c.contradiction_resolution==='not_resolved',r.claim_id+' contradiction resolved')});assert(validation().checks.pressure_components_separate===true,'pressure separation check failed')});add('separation guards prevent false promotion',()=>{records().forEach(r=>{assert(r.separation_guards.support_is_not_truth===true,r.claim_id+' support guard missing');assert(r.separation_guards.counterevidence_is_not_disproof_by_itself===true,r.claim_id+' counter guard missing');assert(r.separation_guards.contradiction_is_not_resolved===true,r.claim_id+' contradiction guard missing');assert(r.separation_guards.narrative_pressure_is_not_motive_proof===true,r.claim_id+' narrative guard missing');assert(r.separation_guards.propaganda_pressure_is_not_external_fact_check===true,r.claim_id+' propaganda guard missing');assert(r.separation_guards.user_context_is_not_auto_truth===true,r.claim_id+' user context guard missing')})});add('external evidence summaries are linked without requiring final truth',()=>{assert(arr(packet.external_claim_evidence_summaries).length===4,'external claim summary count wrong');const direct=byClaim('claim_direct_video_context_001');assert(direct.external_evidence_pressure.external_bridge_status==='no_direct_external_summary_linked'||direct.external_evidence_pressure.external_bridge_status==='external_evidence_summary_linked','bridge status missing');const corroborated=byClaim('claim_independent_corroboration_001');assert(corroborated.synthesis_status_candidate==='corroborated_pressure_candidate','corroborated status wrong');records().forEach(r=>assert(r.external_evidence_pressure,'missing external evidence pressure for '+r.claim_id));assert(validation().checks.four_external_claim_evidence_summaries===true,'external summary check failed')});add('unresolved gaps remain visible',()=>{assert(records().some(r=>arr(r.unresolved_gap_notes).length>0),'no unresolved gap notes');assert(byClaim('claim_causal_overclaim_001').unresolved_gap_notes.includes('causal_bridge_required_before_causal_truth'),'causal gap missing');assert(byClaim('claim_motive_overclaim_001').unresolved_gap_notes.includes('motive_evidence_required_before_motive_truth'),'motive gap missing');assert(validation().checks.unresolved_gaps_visible===true,'unresolved gap check failed')});add('no LLM, no lookup, candidate-only status, and belief movement are preserved',()=>{records().forEach(r=>{assert(r.llm_used===false,r.claim_id+' used LLM');assert(r.external_lookup_performed===false,r.claim_id+' performed lookup');assert(r.promotion_status==='not_promoted',r.claim_id+' promoted');assert(r.doctrine_status==='candidate_not_doctrine',r.claim_id+' doctrine status wrong');assert(r.belief_movement==='none',r.claim_id+' moved belief');assert(r.contradiction_resolution==='not_resolved',r.claim_id+' contradiction resolved')});assert(validation().checks.no_llm_used===true,'no LLM check failed');assert(validation().checks.no_external_lookup===true,'no lookup check failed');assert(validation().checks.candidate_only_not_promoted===true,'candidate-only check failed');assert(validation().checks.belief_movement_none===true,'belief movement check failed');assert(arr(validation().errors).length===0,'validation errors present: '+validation().errors.join(','))});(async function run(){const results=[];for(const t of tests){try{await t.fn();results.push({name:t.name,passed:true})}catch(e){results.push({name:t.name,passed:false,error:e.message})}}const passed=results.filter(r=>r.passed).length;document.getElementById('summary').className=passed===tests.length?'ok':'bad';document.getElementById('summary').textContent=passed+'/'+tests.length+' passed';document.getElementById('out').textContent=JSON.stringify({packet_type:'42ndMind_truth_pressure_synthesis_test_report_v0_1',ok:passed===tests.length,source_claim_count:packet&&packet.source_claim_count,source_evidence_record_count:packet&&packet.source_evidence_record_count,external_claim_evidence_summary_count:packet&&packet.external_claim_evidence_summary_count,synthesis_record_count:packet&&packet.synthesis_record_count,aggregate:packet&&packet.aggregate,records:records().map(r=>({claim_id:r.claim_id,claim_kind:r.claim_kind,source_truth_status_candidate:r.source_truth_status_candidate,synthesis_status_candidate:r.synthesis_status_candidate,pressure_components:r.pressure_components,external_evidence_pressure:r.external_evidence_pressure,unresolved_gap_notes:r.unresolved_gap_notes,promotion_status:r.promotion_status,belief_movement:r.belief_movement})),validation:validation(),results},null,2)})();</script></body></html>
