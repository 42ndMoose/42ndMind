<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>42ndMind Source Trust v0.4 Test</title>
  <style>
    body { margin:0; font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; background:#0f1115; color:#eef2ff; }
    header { padding:16px 18px; border-bottom:1px solid #2a3040; background:#11141b; }
    main { padding:12px; }
    section { background:#171a21; border:1px solid #2a3040; border-radius:10px; padding:12px; }
    h1 { font:700 19px/1.2 system-ui,-apple-system,Segoe UI,sans-serif; margin:0 0 4px; }
    pre { white-space:pre-wrap; background:#0d1016; border:1px solid #2a3040; border-radius:10px; padding:10px; overflow:auto; max-height:760px; }
    .ok { color:#9dffb4; } .bad { color:#ff8b8b; } a { color:#9db6ff; }
  </style>
</head>
<body>
<header><h1>42ndMind Source Trust v0.4 Test</h1><div>Tests bounded source-class priors where certification is metadata, not truth.</div></header>
<main><section><h2 id="summary">Running...</h2><div><a href="kernel-source-patch-bridge-review.html">source patch bridge review</a> · <a href="kernel-test-suite-v0-4-activation.html">activation add-on suite</a></div><pre id="out"></pre></section></main>
<script src="src/kernel-source-trust-v0-4.js?v=0.4.0"></script>
<script>
  const tests = [];
  function add(name, fn) { tests.push({ name, fn }); }
  function assert(cond, msg) { if (!cond) throw new Error(msg); }

  add('module loads', () => {
    assert(window.KernelSourceTrustV04, 'KernelSourceTrustV04 missing');
    assert(KernelSourceTrustV04.VERSION === '0.4.0', 'wrong source trust version');
    assert(KernelSourceTrustV04.SOURCE_CLASSES.FACT_CHECK_CERTIFIED === 'fact_check_certified', 'source classes missing');
  });

  add('IFCN-style fact-check certification is metadata, not truth', () => {
    const report = KernelSourceTrustV04.analyze(KernelSourceTrustV04.sampleSource('ifcn'));
    assert(report.source_classes.includes('fact_check_certified'), 'fact-check class missing');
    assert(report.certification_is_metadata_not_truth === true, 'certification metadata flag missing');
    assert(report.automatic_trust_allowed === false, 'certification should not allow automatic trust');
    assert(report.claim_level_evidence_still_required === true, 'claim-level evidence requirement missing');
    assert(report.verification_burden.includes('do_not_treat_certification_as_direct_evidence'), 'certification burden missing');
  });

  add('primary document can strongly support source prior but still requires claim-level handling', () => {
    const report = KernelSourceTrustV04.analyze(KernelSourceTrustV04.sampleSource('primary'));
    assert(report.source_classes.includes('primary_document'), 'primary class missing');
    assert(report.decision === 'TRUST_PRIOR_STRONG', 'primary document should be strong prior');
    assert(report.can_support_claim_directly === true, 'primary source should be direct support-capable');
    assert(report.claim_level_evidence_still_required === true, 'claim-level handling still required');
  });

  add('legacy media source receives bounded prior and primary-source burden', () => {
    const report = KernelSourceTrustV04.analyze(KernelSourceTrustV04.sampleSource('legacy'));
    assert(report.source_classes.includes('legacy_media'), 'legacy class missing');
    assert(report.trust_prior_score < 0.5, 'legacy sample should not auto-score high');
    assert(report.verification_burden.includes('seek_primary_source_or_full_transcript'), 'legacy verification burden missing');
    assert(report.automatic_trust_allowed === false, 'legacy media should not auto-trust');
  });

  add('government-funded NGO advocacy source carries funding/network burden', () => {
    const report = KernelSourceTrustV04.analyze(KernelSourceTrustV04.sampleSource('ngo'));
    assert(report.source_classes.includes('government_funded_ngo'), 'government-funded NGO class missing');
    assert(report.source_classes.includes('advocacy_org'), 'advocacy class missing');
    assert(report.verification_burden.includes('check_funding_and_partner_network'), 'funding burden missing');
    assert(report.verification_burden.includes('separate_claim_from_advocacy_frame'), 'advocacy burden missing');
  });

  add('anonymous social post requires external corroboration', () => {
    const report = KernelSourceTrustV04.analyze(KernelSourceTrustV04.sampleSource('anonymous'));
    assert(report.source_classes.includes('anonymous_social_post'), 'anonymous class missing');
    assert(report.decision === 'HOLD_SOURCE_REVIEW' || report.decision === 'TRUST_PRIOR_LOW', 'anonymous source should be low or hold');
    assert(report.verification_burden.includes('require_external_corroborration_before_claim_support'), 'corroboration burden missing');
    assert(report.automatic_trust_allowed === false, 'anonymous post should not auto-trust');
  });

  add('fact-check source with primary evidence can improve but certification remains metadata', () => {
    const report = KernelSourceTrustV04.analyze(KernelSourceTrustV04.sampleSource('redeemed_fact_check'));
    assert(report.source_classes.includes('fact_check_certified'), 'fact-check class missing');
    assert(report.certification_is_metadata_not_truth === true, 'certification should remain metadata');
    assert(report.evidence_signals.direct_primary_evidence === true, 'primary evidence signal missing');
    assert(report.trust_prior_score > KernelSourceTrustV04.analyze(KernelSourceTrustV04.sampleSource('ifcn')).trust_prior_score, 'primary evidence should improve prior');
    assert(report.automatic_trust_allowed === false, 'certification should still block automatic trust');
  });

  add('repeated contradictions create conflicted trust prior', () => {
    const report = KernelSourceTrustV04.analyze({ id:'bad_history', type:'legacy media fact-check certified', history:{ contradiction_count:4, retraction_count:1 } });
    assert(report.decision === 'TRUST_PRIOR_CONFLICTED', 'repeated contradictions should create conflicted prior');
    assert(report.history_signals.contradiction_count === 4, 'contradiction count missing');
    assert(report.contradiction_memory_effect.repeated_source_contradictions_reduce_future_trust_prior === true, 'future trust reduction missing');
  });

  add('contradicted beliefs are archived, not erased', () => {
    const report = KernelSourceTrustV04.analyze(KernelSourceTrustV04.sampleSource('ifcn'));
    assert(report.contradiction_memory_effect.contradicted_claims_are_not_deleted === true, 'contradicted deletion doctrine missing');
    assert(report.contradiction_memory_effect.contradicted_claims_become_inactive_pressure === true, 'inactive pressure doctrine missing');
    assert(report.doctrine.contradicted_beliefs_are_archived_not_erased === true, 'archive doctrine missing');
  });

  add('unknown source remains bounded and reviewable', () => {
    const report = KernelSourceTrustV04.analyze(KernelSourceTrustV04.sampleSource('unknown'));
    assert(report.source_classes.includes('unknown'), 'unknown class missing');
    assert(report.trust_prior_score >= 0 && report.trust_prior_score <= 1, 'score out of bounds');
    assert(report.claim_level_evidence_still_required === true, 'claim evidence requirement missing');
  });

  add('batch report summarizes source trust classes', () => {
    const batch = KernelSourceTrustV04.analyzeMany([
      KernelSourceTrustV04.sampleSource('primary'),
      KernelSourceTrustV04.sampleSource('ifcn'),
      KernelSourceTrustV04.sampleSource('anonymous'),
      { id:'bad_history', type:'legacy media', history:{ contradiction_count:3 } }
    ]);
    assert(batch.count === 4, 'batch count wrong');
    assert(batch.summary.strong >= 1, 'strong summary missing');
    assert(batch.summary.conflicted >= 1, 'conflicted summary missing');
    assert(batch.doctrine.batch_source_review_is_not_claim_truth === true, 'batch truth doctrine missing');
  });

  add('detectClasses recognizes mixed labels', () => {
    const classes = KernelSourceTrustV04.detectClasses({ type:'IFCN certified government funded NGO advocacy report with legacy media partner' });
    assert(classes.includes('fact_check_certified'), 'fact-check class missing');
    assert(classes.includes('government_funded_ngo'), 'government class missing');
    assert(classes.includes('advocacy_org'), 'advocacy class missing');
    assert(classes.includes('legacy_media'), 'legacy class missing');
  });

  add('verification burden is deterministic for certification and low score', () => {
    const burden = KernelSourceTrustV04.verificationBurden(0.3, ['fact_check_certified'], {});
    assert(burden.includes('do_not_treat_certification_as_direct_evidence'), 'certification burden missing');
    assert(burden.includes('cap_claim_probability_until_independent_support'), 'probability cap burden missing');
  });

  add('doctrine states source class is prior, not truth', () => {
    const report = KernelSourceTrustV04.analyze(KernelSourceTrustV04.sampleSource('ifcn'));
    assert(report.doctrine.source_class_is_prior_not_truth === true, 'prior doctrine missing');
    assert(report.doctrine.certification_does_not_replace_evidence === true, 'certification doctrine missing');
    assert(report.doctrine.retrieval_is_not_verification === true, 'retrieval doctrine missing');
    assert(report.doctrine.source_trust_updates_must_remain_falsifiable === true, 'falsifiable update doctrine missing');
  });

  const results = tests.map(t => { try { t.fn(); return { name:t.name, passed:true }; } catch(e) { return { name:t.name, passed:false, error:e.message }; } });
  const passed = results.filter(r => r.passed).length;
  document.getElementById('summary').className = passed === results.length ? 'ok' : 'bad';
  document.getElementById('summary').textContent = `${passed}/${results.length} passed`;
  document.getElementById('out').textContent = JSON.stringify({ packet_type:'42ndMind_source_trust_v0_4_test_report', results }, null, 2);
</script>
</body>
</html>
