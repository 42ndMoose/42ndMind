<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>42ndMind Attention Organism Test v0.1</title><style>body{margin:0;background:#0f1115;color:#eef2ff;font:14px ui-monospace,Menlo,Consolas,monospace}header{padding:16px;background:#11141b;border-bottom:1px solid #2a3040}main{padding:12px}section{background:#171a21;border:1px solid #2a3040;border-radius:10px;padding:12px}pre{white-space:pre-wrap;background:#0d1016;border:1px solid #2a3040;border-radius:10px;padding:10px;overflow:auto;max-height:900px}.ok{color:#9dffb4}.bad{color:#ff8b8b}</style></head><body><header><h1>42ndMind Attention Organism Test v0.1</h1><div>Tests first-principles pressure selection, unit-total normalization, and growth by subdivision. Does not load narrow answer/factual reply patches.</div></header><main><section><h2 id="summary">Running...</h2><pre id="out"></pre></section></main>
<script src="src/epistemic-kernel-v0-2.js?v=corebase-1"></script>
<script src="src/epistemic-kernel-v0-2-patches.js?v=coremig-1"></script>
<script src="src/kernel-brain-v0-4.js?v=brain-2"></script>
<script src="src/kernel-brain-epistemic-kernel-bridge-v0-1.js?v=bridge-2"></script>
<script src="src/epistemic-kernel-maturity-core-v0-1.js?v=maturity-2"></script>
<script src="src/epistemic-kernel-belief-memory-engine-v0-1.js?v=belief-1"></script>
<script src="src/epistemic-kernel-belief-memory-engine-v0-1-1-patch.js?v=belief-3"></script>
<script src="src/epistemic-kernel-attention-organism-v0-1.js?v=ao-1"></script>
<script>
const tests=[];let kernel=null,binding=null,boundBrain=null;
function add(n,f){tests.push({name:n,fn:f})}
function assert(c,m){if(!c)throw new Error(m)}
function arr(v){return Array.isArray(v)?v:[]}
function shared(){return kernel&&kernel.state&&kernel.state.unifiedCore}
function ao(){return shared()&&shared().attentionOrganismCore}
function comm(){return shared()&&shared().communicationCore}
function bm(){return shared()&&shared().beliefMemoryCore}
function mat(){return shared()&&shared().maturityCore}
function say(raw,kind){boundBrain.ingest(raw,{kind:kind||'attention_organism_test'});if(boundBrain.refreshAttentionOrganism)boundBrain.refreshAttentionOrganism('manual_'+(kind||'input'));return {core:ao(),message:comm().current_message}}
function lastAction(){return ao()&&ao().selected_action}
function pressureSum(){return Number(arr(ao().unit_pressure_field).reduce((s,r)=>s+Number(r.normalized_pressure||0),0).toFixed(6))}
function hasBranch(kind){return arr(ao().concept_growth_map).some(b=>b.branch_kind===kind)}
add('attention organism loads and patches kernel, brain, and bridge',()=>{assert(window.EpistemicKernelAttentionOrganismV01,'attention organism missing');assert(EpistemicKernel.__attentionOrganismPatchApplied===true,'kernel patch missing');assert(KernelBrainV04.__attentionOrganismPatchApplied===true,'brain patch missing');assert(KernelBrainEpistemicKernelBridgeV01.__attentionOrganismPatchApplied===true,'bridge patch missing')});
add('binding creates attentionOrganismCore inside one shared unifiedCore state',()=>{kernel=new EpistemicKernel();binding=KernelBrainEpistemicKernelBridgeV01.bind(kernel);boundBrain=binding.bound_brain;assert(boundBrain.state===shared(),'bound brain does not share unified state');assert(ao(),'attentionOrganismCore missing');assert(ao().doctrine.first_principles_pressure_before_speech===true,'first principles doctrine missing');assert(ao().doctrine.unit_total_pressure_required===true,'unit-total doctrine missing');assert(ao().doctrine.no_specific_sentence_response_patching===true,'anti patch doctrine missing')});
add('learning offer selects source-role learning action from pressure, not fixed phrase response',()=>{say('you can ask me anything. i can give you answers one small info at a time.','learning_offer');assert(lastAction().action_kind==='ask_source_role_for_learning','wrong action: '+lastAction().action_kind);assert(/source-role/i.test(lastAction().reason),'reason not source-role');assert(pressureSum()===1,'unit pressure sum not 1: '+pressureSum());assert(comm().current_message.thought_kind==='attention_organism_action_projection','message not projected by organism');assert(/facts, meanings, worldview, or testing/i.test(comm().current_message.message),'speech did not express selected action')});
add('user identity statement stores source-bound memory, not final truth',()=>{say('my name is Miguel','identity_context');assert(lastAction().action_kind==='store_user_identity_context','identity action wrong: '+lastAction().action_kind);assert(hasBranch('user_identity_context_candidate'),'identity branch missing');assert(arr(bm().memory_items).some(m=>/my name is Miguel/i.test(m.statement)&&m.truth_status==='not_final'),'source-bound identity memory missing');assert(pressureSum()===1,'unit pressure sum not 1 after identity')});
add('question selects answer-or-admit-unknown instead of context fallback',()=>{say('who is the 47th president of the usa?','question_unknown');assert(lastAction().action_kind==='answer_or_admit_unknown','question action wrong: '+lastAction().action_kind);assert(/question|do not yet have|do not know|answer/i.test(comm().current_message.message),'question response not childlike/unknown');assert(!/I heard this as conversation context/.test(comm().current_message.message),'fell back to context')});
add('definition cue creates scoped meaning boundary action and branch',()=>{say('spakltktkk means spectacular','definition_candidate');assert(lastAction().action_kind==='ask_or_hold_meaning_boundary','definition action wrong: '+lastAction().action_kind);assert(hasBranch('definition_boundary_candidate'),'definition branch missing');assert(arr(ao().concept_growth_map).some(b=>b.branch_kind==='unknown_token_candidate'&&/spakltktkk/.test(b.seed)),'unknown token branch missing')});
add('assertion cue becomes provisional truth candidate action',()=>{say('trump is the 47th president of the united states of america','assertion_candidate');assert(lastAction().action_kind==='hold_truth_candidate_provisionally','assertion action wrong: '+lastAction().action_kind);assert(/provisionally|objective truth|verification/i.test(comm().current_message.message),'claim response lacks provisional discipline')});
add('unknown noisy input creates ambiguity pressure and candidate subdivisions',()=>{say('spakltktkk blarvon mizzled the floon','unknown_noise');assert(pressureSum()===1,'unit pressure sum not 1 after unknown noise');assert(arr(ao().unit_pressure_field).some(p=>p.pressure_kind==='ambiguity_pressure'&&p.normalized_pressure>0.1),'ambiguity pressure missing');assert(arr(ao().concept_growth_map).filter(b=>b.branch_kind==='unknown_token_candidate').length>=2,'unknown token subdivisions missing')});
add('objective maturity remains identity center while organism acts',()=>{assert(mat(),'maturity core missing');assert(mat().core_philosophy==='objective_peak_philosophical_maturity','maturity identity missing');assert(mat().wants_peak===true&&mat().aims_at_peak===true&&mat().stays_at_peak===true,'peak flags missing');assert(ao().truth_status==='not_final','attention organism truth promoted');assert(ao().promotion_status==='not_promoted_to_final_truth','attention organism promoted')});
add('organism does not require narrow answer/factual patches to communicate simply',()=>{assert(!window.EpistemicKernelAnswerProjectionV01,'narrow answer projection should not be loaded in this test');assert(!window.EpistemicKernelFactualClaimIntakeV01,'narrow factual intake should not be loaded in this test');assert(comm().current_message&&comm().current_message.thought_kind==='attention_organism_action_projection','organism did not project speech itself')});
(async function run(){const results=[];for(const t of tests){try{await t.fn();results.push({name:t.name,passed:true})}catch(e){results.push({name:t.name,passed:false,error:e.message})}}const passed=results.filter(r=>r.passed).length;document.getElementById('summary').className=passed===tests.length?'ok':'bad';document.getElementById('summary').textContent=passed+'/'+tests.length+' passed';document.getElementById('out').textContent=JSON.stringify({packet_type:'42ndMind_attention_organism_v0_1_test_report',ok:passed===tests.length,attention_organism_loaded:!!window.EpistemicKernelAttentionOrganismV01,attentionOrganismCore:ao(),communicationCore:comm(),beliefMemoryCore:bm(),maturityCore:mat(),results},null,2)})();
</script></body></html>
