<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>42ndMind Objective Claim-Language Test v0.1.1</title><style>body{margin:0;background:#0f1115;color:#eef2ff;font:14px ui-monospace,Menlo,Consolas,monospace}header{padding:16px;background:#11141b;border-bottom:1px solid #2a3040}main{padding:12px}section{background:#171a21;border:1px solid #2a3040;border-radius:10px;padding:12px}pre{white-space:pre-wrap;background:#0d1016;border:1px solid #2a3040;border-radius:10px;padding:10px;overflow:auto;max-height:760px}.ok{color:#9dffb4}.bad{color:#ff8b8b}a{color:#9db6ff}</style></head><body><header><h1>42ndMind Objective Claim-Language Test v0.1.1</h1><div>Patch: hidden-motive markers outrank generic causal markers. No LLM. No source lookup.</div></header><main><section><h2 id="summary">Running...</h2><div><a href="objective-claim-language-v0-1-1.html?v=claim-2">objective claim-language page v0.1.1</a></div><pre id="out"></pre></section></main><script src="src/kernel-objective-claim-language-v0-1.js?v=claim-1"></script><script src="src/kernel-objective-claim-language-v0-1-1-patch.js?v=claim-2"></script><script>const tests=[];let packet=null;function add(n,f){tests.push({name:n,fn:f})}function assert(c,m){if(!c)throw new Error(m)}function arr(v){return Array.isArray(v)?v:[]}function analyses(){return arr(packet&&packet.analyses)}function byStatus(s){return analyses().filter(a=>a.truth_status_candidate===s)}function byId(id){return analyses().find(a=>a.claim_id===id)}add('modules load and doctrine uses unified objective language grammar with motive priority',()=>{assert(window.KernelObjectiveClaimLanguageV01,'base claim-language module missing');assert(window.KernelObjectiveClaimLanguageV011,'claim-language v0.1.1 patch missing');assert(KernelObjectiveClaimLanguageV011.VERSION==='0.1.1','patch version wrong');assert(typeof KernelObjectiveClaimLanguageV011.runClaimLanguage==='function','runClaimLanguage missing');const d=KernelObjectiveClaimLanguageV011.doctrine();assert(d.claims_world_models_and_narratives_are_inside_the_same_objective_language_grammar===true,'unified language doctrine missing');assert(d.external_anchors_are_modular_registries_not_separate_language===true,'external anchor doctrine missing');assert(d.deterministic_without_llm===true,'deterministic/no-LLM doctrine missing');assert(d.motive_markers_outrank_generic_causal_markers===true,'motive priority doctrine missing');assert(d.hidden_motive_claim_requires_motive_evidence_dependency===true,'motive dependency doctrine missing');assert(d.belief_movement==='none','belief movement wrong')});add('claim language v0.1.1 runs without LLM or source lookup',()=>{packet=KernelObjectiveClaimLanguageV011.runClaimLanguage();assert(packet.ok===true,'packet not ok: '+JSON.stringify(packet.validation));assert(packet.claim_count===8,'expected 8 claims');assert(analyses().length===8,'expected 8 analyses');assert(packet.llm_used===false,'packet used LLM');assert(packet.external_lookup_performed===false,'packet performed lookup');assert(packet.belief_movement==='none','packet moved belief')});add('all eight expected truth statuses match',()=>{assert(packet.validation.checks.eight_claim_analyses===true,'eight claims check failed');assert(packet.validation.checks.all_expected_statuses_match===true,'expected statuses did not match');analyses().forEach(a=>{assert(a.expected_match===true,a.claim_id+' expected '+a.expected_truth_status+' got '+a.truth_status_candidate);assert(a.validation&&a.validation.ok===true,a.claim_id+' validation failed: '+arr(a.validation&&a.validation.errors).join(','))})});add('motive overclaim is motive-attribution and emits motive dependency',()=>{const motive=byId('claim_motive_overclaim_001');assert(motive,'motive claim missing');assert(motive.claim_kind==='motive_attribution_claim','motive claim kind wrong: '+motive.claim_kind);assert(motive.truth_status_candidate==='narrative_overclaim_pressure_candidate','motive truth status wrong: '+motive.truth_status_candidate);assert(arr(motive.dependencies).some(d=>d.dependency_type==='motive_evidence_required'),'motive evidence dependency missing');assert(!arr(motive.dependencies).some(d=>d.dependency_type==='causal_bridge_required'),'motive claim should not require causal bridge');assert(packet.validation.checks.motive_kind_and_dependency_correct===true,'motive validation check failed')});add('evidence support, corroboration, and unsupported unresolved statuses are detected',()=>{assert(byStatus('evidence_supported_candidate').length===1,'missing evidence supported candidate');assert(byStatus('corroborated_candidate').length===1,'missing corroborated candidate');assert(byStatus('unsupported_unresolved_candidate').length===1,'missing unsupported unresolved candidate');assert(packet.validation.checks.evidence_support_detected===true,'evidence support check failed');assert(packet.validation.checks.corroboration_detected===true,'corroboration check failed');assert(packet.validation.checks.unsupported_unresolved_preserved===true,'unsupported unresolved check failed')});add('contradiction, narrative, propaganda, and causal pressure are detected without resolving truth',()=>{assert(byStatus('contradiction_pressure_candidate').length===1,'missing contradiction pressure candidate');assert(byStatus('narrative_overclaim_pressure_candidate').length===1,'missing narrative overclaim candidate');assert(byStatus('propaganda_pressure_candidate').length===1,'missing propaganda pressure candidate');assert(byStatus('causal_overclaim_pressure_candidate').length===1,'missing causal overclaim candidate');const contradiction=byId('claim_contradiction_pressure_001');assert(contradiction.contradiction_pressure.contradiction_present===true,'contradiction not detected');assert(contradiction.contradiction_pressure.contradiction_resolution==='not_resolved','contradiction was resolved');assert(packet.validation.checks.contradiction_pressure_detected===true,'contradiction check failed');assert(packet.validation.checks.narrative_overclaim_detected===true,'narrative check failed');assert(packet.validation.checks.propaganda_pressure_detected===true,'propaganda check failed');assert(packet.validation.checks.causal_overclaim_detected===true,'causal check failed')});add('ambiguity remains unresolved and user context is not auto-truth',()=>{assert(byStatus('ambiguous_unresolved_candidate').length===1,'missing ambiguous unresolved candidate');analyses().forEach(a=>{assert(a.source_posture.user_supplied_context_not_auto_truth===true,a.claim_id+' context auto-truth risk');assert(a.narrative_pressure.hidden_motive_not_decided===true,a.claim_id+' hidden motive decided')});assert(packet.validation.checks.ambiguity_preserved===true,'ambiguity check failed')});add('dependencies, candidate-only status, and belief movement are preserved',()=>{analyses().forEach(a=>{assert(a.dependency_count>=1,a.claim_id+' missing dependencies');const regs=arr(a.dependencies).map(d=>d.registry);assert(regs.some(r=>/registry|reasoning_dependency/.test(r)),a.claim_id+' missing modular registry dependency');assert(a.promotion_status==='not_promoted',a.claim_id+' promoted');assert(a.doctrine_status==='candidate_not_doctrine',a.claim_id+' doctrine status wrong');assert(a.belief_movement==='none',a.claim_id+' moved belief');assert(a.llm_used===false,a.claim_id+' used LLM');assert(a.external_lookup_performed===false,a.claim_id+' performed lookup')});const causal=byId('claim_causal_overclaim_001');assert(arr(causal.dependencies).some(d=>d.dependency_type==='causal_bridge_required'), 'causal bridge dependency missing');assert(packet.validation.checks.no_llm_used===true,'no LLM check failed');assert(packet.validation.checks.no_external_lookup===true,'no lookup check failed');assert(packet.validation.checks.candidate_only_not_promoted===true,'candidate-only check failed');assert(packet.validation.checks.belief_movement_none===true,'belief movement check failed');assert(arr(packet.validation.errors).length===0,'validation errors present: '+packet.validation.errors.join(','))});(async function run(){const results=[];for(const t of tests){try{await t.fn();results.push({name:t.name,passed:true})}catch(e){results.push({name:t.name,passed:false,error:e.message})}}const passed=results.filter(r=>r.passed).length;document.getElementById('summary').className=passed===tests.length?'ok':'bad';document.getElementById('summary').textContent=passed+'/'+tests.length+' passed';document.getElementById('out').textContent=JSON.stringify({packet_type:'42ndMind_objective_claim_language_test_report_v0_1_1',ok:passed===tests.length,claim_count:packet&&packet.claim_count,analyses:analyses().map(a=>({claim_id:a.claim_id,claim_kind:a.claim_kind,truth_status_candidate:a.truth_status_candidate,expected_truth_status:a.expected_truth_status,expected_match:a.expected_match,dependency_count:a.dependency_count,dependency_types:arr(a.dependencies).map(d=>d.dependency_type),support_score:a.contradiction_pressure&&a.contradiction_pressure.support_score,counter_score:a.contradiction_pressure&&a.contradiction_pressure.counter_score,contradiction_present:a.contradiction_pressure&&a.contradiction_pressure.contradiction_present,narrative_pressure:a.narrative_pressure&&a.narrative_pressure.narrative_pressure,propaganda_pressure:a.narrative_pressure&&a.narrative_pressure.propaganda_pressure,llm_used:a.llm_used,external_lookup_performed:a.external_lookup_performed,belief_movement:a.belief_movement})),validation:packet&&packet.validation,results},null,2)})();</script></body></html>
