<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>42ndMind Intention Minimal-Pair Library</title><style>body{margin:0;background:#0f1115;color:#eef2ff;font:14px ui-monospace,Menlo,Consolas,monospace}header{padding:16px 18px;background:#11141b;border-bottom:1px solid #2a3040}main{padding:12px;display:grid;grid-template-columns:470px 1fr;gap:12px}section{background:#171a21;border:1px solid #2a3040;border-radius:10px;padding:12px}button{background:#25345c;color:#eef2ff;border:1px solid #3f5592;padding:8px 10px;border-radius:8px;cursor:pointer;margin:3px 3px 8px 0}pre{white-space:pre-wrap;background:#0d1016;border:1px solid #2a3040;border-radius:10px;padding:10px;overflow:auto;max-height:760px}.ok{color:#9dffb4}.bad{color:#ff8b8b}.muted{color:#8b93a7}a{color:#9db6ff}.card{background:#10131a;border:1px solid #2a3040;border-radius:10px;padding:10px;margin:10px 0}.pair{border-top:1px solid #252b3a;padding:7px 0}.pill{display:inline-block;border:1px solid #2a3040;border-radius:999px;padding:1px 7px;margin:2px}.safe{color:#9dffb4}.warn{color:#ffd28b}@media(max-width:900px){main{grid-template-columns:1fr}}</style></head><body><header><h1>42ndMind Intention Minimal-Pair Library</h1><div class="muted">Structured contrast-pair pressure from proof-output steps. Candidate only.</div></header><main><section><a href="index.html">main</a> · <a href="intention-proof-output.html?v=proof-1">proof output</a> · <a href="kernel-intention-minimal-pair-library-v0-1-test.html?v=minpair-1">test</a><p>Decision: <b id="decisionMetric">not run</b></p><p>Concepts: <b id="conceptMetric">0</b></p><p>Pairs: <b id="pairMetric">0</b></p><button onclick="runLibrary()">Run minimal-pair library</button><button onclick="showPacket()">Show packet</button><button onclick="showSummary()">Show summary</button><button onclick="copyOutput()">Copy output</button><div id="cards"></div></section><section><h2>Output</h2><pre id="out">No output yet.</pre></section></main><script src="src/kernel-intention-discovery-v0-1.js?v=intent-1"></script><script src="src/kernel-intention-refinement-v0-1.js?v=refine-1"></script><script src="src/kernel-intention-necessity-test-v0-1.js?v=necessity-1"></script><script src="src/kernel-intention-neighbor-lattice-v0-1.js?v=lattice-3"></script><script src="src/kernel-intention-lattice-invariance-benchmark-v0-1.js?v=invariance-2"></script><script src="src/kernel-intention-formula-compiler-v0-1.js?v=formula-1"></script><script src="src/kernel-intention-concept-expansion-loop-v0-1.js?v=expansion-2"></script><script src="src/kernel-intention-contradiction-refinement-loop-v0-1.js?v=contradiction-1"></script><script src="src/kernel-intention-formula-revision-engine-v0-1.js?v=revision-1"></script><script src="src/kernel-intention-canonical-formula-ledger-v0-1.js?v=ledger-1"></script><script src="src/kernel-intention-proof-output-v0-1.js?v=proof-1"></script><script src="src/kernel-intention-minimal-pair-library-v0-1.js?v=minpair-1"></script><script>let packet=null,last='';function esc(v){return String(v??'').replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]))}function arr(v){return Array.isArray(v)?v:[]}function setOut(v){last=typeof v==='string'?v:JSON.stringify(v,null,2);document.getElementById('out').textContent=last}function runLibrary(){const decisionEl=document.getElementById('decisionMetric');try{packet=KernelIntentionMinimalPairLibraryV01.runMinimalPairLibrary();decisionEl.textContent=packet.ok?'MINIMAL_PAIR_LIBRARY_READY':'HELD_FOR_REVIEW';decisionEl.className=packet.ok?'ok':'bad';document.getElementById('conceptMetric').textContent=packet.concept_count;document.getElementById('pairMetric').textContent=packet.minimal_pair_count;renderCards();showSummary()}catch(e){decisionEl.textContent='ERROR';decisionEl.className='bad';setOut({ok:false,error:e.message,belief_movement:'none'})}}function renderCards(){document.getElementById('cards').innerHTML=arr(packet&&packet.concept_groups).map(g=>`<div class="card"><h3>${esc(g.concept)}</h3><p><span class="pill safe">pairs ${esc(g.pair_count)}</span><span class="pill safe">structural ${esc(g.structural_contrast_count)}</span><span class="pill safe">absence ${esc(g.dimension_absence_count)}</span></p>${arr(g.pairs).map(p=>`<div class="pair"><b>${esc(p.left_term)} vs ${esc(p.right_term)}</b> <span class="pill warn">${esc(p.pair_type)}</span><br><span class="muted">${esc(p.prompt)}</span><br><span class="pill safe">L1 ${esc(p.observed_l1_total)}</span><span class="pill safe">force outside ${esc(p.force_terms_outside_shape)}</span><span class="pill">${esc(p.expected_transition)}</span></div>`).join('')}</div>`).join('')||'No minimal pairs.'}function summary(){return{packet_type:'42ndMind_intention_minimal_pair_library_summary_view_v0_1',ok:packet&&packet.ok,source_proof_ok:packet&&packet.source_proof_ok,source_proof_count:packet&&packet.source_proof_count,source_proof_step_count:packet&&packet.source_proof_step_count,concept_count:packet&&packet.concept_count,minimal_pair_count:packet&&packet.minimal_pair_count,concept_groups:arr(packet&&packet.concept_groups).map(g=>({concept:g.concept,pair_count:g.pair_count,structural_contrast_count:g.structural_contrast_count,dimension_absence_count:g.dimension_absence_count,belief_movement:g.belief_movement})),validation:packet&&packet.validation,belief_movement:'none'}}function showSummary(){if(!packet)return runLibrary();setOut(summary())}function showPacket(){if(!packet)return runLibrary();setOut(packet)}async function copyOutput(){try{await navigator.clipboard.writeText(last);document.getElementById('out').textContent='Copied.\n\n'+last}catch(e){}}runLibrary();</script></body></html>
