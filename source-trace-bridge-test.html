<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>42ndMind Source Trace Bridge Smoke Test</title>
  <style>
    body { margin:20px; font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; background:#0f1115; color:#eef2ff; }
    a { color:#9db6ff; }
    button { background:#25345c; color:#eef2ff; border:1px solid #3f5592; padding:8px 10px; border-radius:8px; cursor:pointer; margin:3px 3px 10px 0; font:13px system-ui,-apple-system,Segoe UI,sans-serif; }
    pre { white-space:pre-wrap; background:#171a21; border:1px solid #2a3040; border-radius:10px; padding:12px; }
    .pass { color:#9dffb4; }
    .fail { color:#ff8b8b; }
    .muted { color:#8b93a7; }
  </style>
</head>
<body>
  <h1>Source Trace Bridge Smoke Test</h1>
  <p><a href="source-trace-bridge.html">source trace bridge</a> · <a href="source-registry.html">source registry</a> · <a href="llm-brain-v0-3.html">live brain v0.3</a> · <a href="dossier-source-graph.html">dossier graph</a></p>
  <button onclick="copyOutput()">COPY output</button><span id="status" class="muted"></span>
  <pre id="out">Running...</pre>
<script>
  function asArray(value) { return Array.isArray(value) ? value : []; }
  function safeText(value) { return String(value ?? '').trim(); }
  function byId(rows) { return new Map(asArray(rows).map(row => [row.id, row])); }
  function compactClaim(row) {
    return row ? {
      id: row.id,
      client_id: row.client_id || null,
      text: row.text,
      scope: row.scope,
      status: row.status,
      confidence: row.confidence,
      source: row.source,
      evidence_for_count: asArray(row.evidence_for).length,
      evidence_against_count: asArray(row.evidence_against).length
    } : null;
  }
  function compactEvidence(row) {
    return row ? {
      id: row.id,
      text: row.text,
      relation: row.relation,
      claimId: row.claimId,
      strength: row.strength,
      confidence: row.confidence,
      source: row.source
    } : null;
  }
  function sourceRegistryMeta() {
    return {
      non_scoring: true,
      metadata_only: true,
      source_registry_not_belief_update: true,
      scoring_allowed: false,
      affects_claim_confidence: false,
      affects_gates: false,
      affects_root_worldview: false,
      provenance_is_not_proof: true,
      retrieval_is_not_verification: true
    };
  }
  function buildFixtureState() {
    const claims = [1,2,3,4].map(n => ({
      id: `claim_${n}`,
      client_id: `dossier_claim_d${n}`,
      text: `Dossier claim ${n}`,
      scope: n === 1 ? 'dossier_fact' : n === 2 ? 'dossier_inference' : n === 3 ? 'dossier_interpretation' : 'dossier_hypothesis',
      status: n === 1 ? 'active' : 'unresolved',
      confidence: n === 1 ? 1 : 0.55,
      source: 'structured_packet',
      evidence_for: n === 4 ? [] : [`evidence_${n}`],
      evidence_against: n === 1 ? [] : [`evidence_attack_${n}`]
    }));
    const evidence = [
      { id:'evidence_1', text:'source link supplied by user', relation:'supports', claimId:'claim_1', strength:'moderate', confidence:0.75, source:'structured_packet' },
      { id:'evidence_source_1', text:'source_link: https://example.invalid/source', relation:'supports', claimId:'claim_1', strength:'weak', confidence:0.5, source:'structured_packet' },
      { id:'evidence_2', text:'pattern match', relation:'supports', claimId:'claim_2', strength:'weak', confidence:0.55, source:'structured_packet' },
      { id:'evidence_attack_2', text:'counter_consideration: could be independent convergence', relation:'attacks', claimId:'claim_2', strength:'weak', confidence:0.45, source:'structured_packet' },
      { id:'evidence_3', text:'wording analysis', relation:'supports', claimId:'claim_3', strength:'weak', confidence:0.55, source:'structured_packet' },
      { id:'evidence_attack_3', text:'counter_consideration: alternate editorial explanation', relation:'attacks', claimId:'claim_3', strength:'weak', confidence:0.45, source:'structured_packet' },
      { id:'evidence_attack_4', text:'counter_consideration: needs stronger source evidence', relation:'attacks', claimId:'claim_4', strength:'weak', confidence:0.45, source:'structured_packet' }
    ];
    const questions = [1,2,3,4,5,6].map(n => ({
      id:`question_${n}`,
      text:`Open dossier pressure question ${n}`,
      status:'open',
      links:{ client_id:`dossier_claim_d${Math.min(4, Math.max(1, Math.ceil(n/2)))}`, source:'dossier_source_graph_v0_1' }
    }));
    return {
      claims,
      evidence,
      questions,
      observations:[],
      sourceTraces:[{
        trace_type:'structured_packet_import',
        source_title:'Dossier source graph import',
        source_kind:'dossier_source_graph',
        import_time:'2026-05-10T00:00:00.000Z',
        event_id:'event_test_source_trace',
        counts:{ claims:4, evidence:7, attacking_evidence:3, open_questions:6, observations:0 },
        source_links:['https://example.invalid/source'],
        claim_ids:claims.map(row => row.id),
        evidence_ids:evidence.map(row => row.id),
        meta:{ read_only_trace:true, persisted_in_kernel_state:true, grouped_from_event_log:true }
      }]
    };
  }
  function buildFixtureSavedSourceRegistry() {
    const registry = {
      registry_type:'42ndMind_source_registry',
      registry_version:'0.1.2',
      sources:[
        {
          id:'source_trace_event_test_source_trace_import_event',
          title:'Dossier source graph import import event',
          source_kind:'dossier_source_graph_import_event',
          retrieval_status:'provided_by_user',
          retrieval_method:'local_kernel_source_trace',
          trust_notes:['Converted from persisted kernel source trace; not independently retrieved by source registry.'],
          reliability_flags:['source_trace_conversion','requires_source_review','non_scoring_metadata'],
          attached_claim_ids:['claim_1','claim_2','claim_3','claim_4'],
          attached_evidence_ids:['evidence_1','evidence_source_1','evidence_2','evidence_attack_2','evidence_3','evidence_attack_3','evidence_attack_4'],
          unresolved_source_questions:['Which imported claims are directly supported by each source object?','Can the original source context be retrieved and checked independently?'],
          meta:{ non_scoring:true, source_object_not_truth:true, source_pressure_not_belief_movement:true, retrieval_status_not_verification:true }
        },
        {
          id:'source_trace_event_test_source_trace_linked_source_01',
          title:'Linked source 1 from Dossier source graph import',
          source_kind:'linked_source_from_trace',
          retrieval_status:'not_retrieved',
          retrieval_method:'link_extracted_from_source_trace',
          trust_notes:['Source link was extracted from a source trace and has not been retrieved by the registry.'],
          reliability_flags:['unretrieved_link','requires_context_review','non_scoring_metadata'],
          attached_claim_ids:['claim_1','claim_2','claim_3','claim_4'],
          attached_evidence_ids:['evidence_1','evidence_source_1','evidence_2','evidence_attack_2','evidence_3','evidence_attack_3','evidence_attack_4'],
          unresolved_source_questions:['Can this link be retrieved?','Does the linked context support the imported claim text, or only a narrower claim?'],
          meta:{ non_scoring:true, source_object_not_truth:true, source_pressure_not_belief_movement:true, retrieval_status_not_verification:true }
        }
      ],
      claim_source_links:Array.from({ length:8 }, (_, i) => ({ claim_id:`claim_${(i % 4) + 1}`, source_id:i < 4 ? 'source_trace_event_test_source_trace_import_event' : 'source_trace_event_test_source_trace_linked_source_01', relation:i < 4 ? 'grouped_by_import_trace' : 'possibly_cited_by_source_link' })),
      evidence_source_links:Array.from({ length:14 }, (_, i) => ({ evidence_id:`evidence_row_${i + 1}`, source_id:i < 7 ? 'source_trace_event_test_source_trace_import_event' : 'source_trace_event_test_source_trace_linked_source_01', relation:i < 7 ? 'grouped_by_import_trace' : 'possibly_derived_from_source_link' })),
      source_questions:Array.from({ length:6 }, (_, i) => ({ id:`source_question_${i + 1}`, source_id:i < 3 ? 'source_trace_event_test_source_trace_import_event' : 'source_trace_event_test_source_trace_linked_source_01', text:`Source question ${i + 1}`, status:'open' })),
      counts:{ sources:2, claim_source_links:8, evidence_source_links:14, source_questions:6, unresolved_source_questions:6, retrieved_verified:0, retrieved_unverified:0, not_retrieved:1 },
      meta:{ non_scoring:true, source_registry_not_belief_update:true, safe_to_attach_to_kernel_state_as_metadata:true, note:'This registry stores provenance and source pressure only. It does not verify facts or move belief state.' }
    };
    return {
      available:true,
      storage_key:'42ndMind_source_registry_v0_1',
      saved_at:'2026-05-10T00:01:00.000Z',
      sourceRegistry:registry,
      sourceRegistryReport:{ packet_type:'42ndMind_source_registry_report', packet_version:'0.1.2', source_registry:registry, all_passed:true },
      meta:sourceRegistryMeta()
    };
  }
  function sourceRegistrySummary(saved) {
    const registry = saved && saved.sourceRegistry;
    const sources = asArray(registry && registry.sources);
    const claimLinks = asArray(registry && registry.claim_source_links);
    const evidenceLinks = asArray(registry && registry.evidence_source_links);
    const sourceQuestions = asArray(registry && registry.source_questions);
    const counts = registry && registry.counts ? registry.counts : {};
    const statuses = sources.reduce((acc, source) => {
      const status = source.retrieval_status || 'unknown';
      acc[status] = (acc[status] || 0) + 1;
      return acc;
    }, {});
    return {
      available: !!(saved && saved.available && registry),
      storage_key:'42ndMind_source_registry_v0_1',
      saved_at:(saved && saved.saved_at) || '',
      counts:{
        sources:Number(counts.sources || sources.length || 0),
        claim_source_links:Number(counts.claim_source_links || claimLinks.length || 0),
        evidence_source_links:Number(counts.evidence_source_links || evidenceLinks.length || 0),
        source_questions:Number(counts.source_questions || sourceQuestions.length || 0),
        unresolved_source_questions:Number(counts.unresolved_source_questions || sources.reduce((sum, source) => sum + asArray(source.unresolved_source_questions).length, 0))
      },
      retrieval_statuses:statuses,
      doctrine:{ non_scoring:true, metadata_only:true, source_objects_separate_from_claims:true, source_objects_separate_from_evidence:true, provenance_is_not_proof:true, retrieval_is_not_verification:true, kernel_owns_belief_movement:true }
    };
  }
  function linkedOpenQuestions(state, trace) {
    const claimIds = new Set(asArray(trace.claim_ids));
    const evidenceIds = new Set(asArray(trace.evidence_ids));
    return asArray(state.questions).filter(question => {
      const links = question.links || {};
      if (question.status && question.status !== 'open') return false;
      if (claimIds.has(links.claim_id)) return true;
      if (evidenceIds.has(links.evidence_id)) return true;
      if (String(links.client_id || '').startsWith('dossier_claim_')) return true;
      if (links.source === 'dossier_source_graph_v0_1') return true;
      return false;
    });
  }
  function buildLocalPreviewFromTraces(traces, registrySummary) {
    const registryLine = registrySummary && registrySummary.available
      ? `Source registry: available as non-scoring metadata (${registrySummary.counts.sources} source object(s), ${registrySummary.counts.unresolved_source_questions} unresolved source question(s)). Provenance is not proof; retrieval is not verification.`
      : 'Source registry: no saved source registry metadata is currently available.';
    return registryLine + '\n\n' + asArray(traces).map((trace, index) => {
      const counts = trace.counts || {};
      const attacks = asArray(trace.attacking_evidence);
      const supports = asArray(trace.supporting_evidence);
      const questions = asArray(trace.open_questions);
      const liveCounters = attacks.map(row => safeText(row.text).replace(/^counter_consideration:\s*/i, '').trim()).filter(Boolean);
      return [
        `Source trace ${index + 1}: ${trace.source_title || trace.source_kind || 'structured import'}`,
        `Import kind: ${trace.source_kind || 'unknown'}.`,
        `Imported structure: ${counts.claims || 0} claim(s), ${counts.evidence || 0} evidence row(s), ${counts.attacking_evidence || attacks.length} attacking evidence row(s), ${counts.open_questions || questions.length} open question(s), ${counts.observations || 0} observation(s).`,
        'Interpretation: this import created provenance and pressure, not automatic truth. The kernel still owns belief movement.',
        `Support/attack split: ${supports.length} supporting row(s) and ${attacks.length} attacking row(s) are visible separately.`,
        liveCounters.length ? `Live counter-considerations: ${liveCounters.join('; ')}.` : 'Live counter-considerations: none detected in this trace.',
        `Unresolved pressure: ${questions.length} open question(s) remain active. Contradiction or pressure detection is not treated as resolution.`,
        'Guardrail: the LLM may explain this trace and registry, but it must not mutate state, promote coherence into truth, flatten counter-considerations, or propose rule promotion without user approval.'
      ].join('\n');
    }).join('\n\n');
  }
  function buildExplanationPacket(state, savedSourceRegistry) {
    const claims = byId(state.claims);
    const evidence = byId(state.evidence);
    const traces = asArray(state.sourceTraces);
    const registrySummary = sourceRegistrySummary(savedSourceRegistry);
    const tracePackets = traces.map(trace => {
      const linkedClaims = asArray(trace.claim_ids).map(id => compactClaim(claims.get(id))).filter(Boolean);
      const linkedEvidence = asArray(trace.evidence_ids).map(id => compactEvidence(evidence.get(id))).filter(Boolean);
      return {
        trace_type:trace.trace_type,
        source_title:trace.source_title,
        source_kind:trace.source_kind,
        import_time:trace.import_time,
        event_id:trace.event_id,
        counts:trace.counts,
        source_links:asArray(trace.source_links),
        linked_claims:linkedClaims,
        linked_evidence:linkedEvidence,
        attacking_evidence:linkedEvidence.filter(row => row.relation === 'attacks'),
        supporting_evidence:linkedEvidence.filter(row => row.relation !== 'attacks'),
        open_questions:linkedOpenQuestions(state, trace),
        explanation_guardrails:{
          explain_only:true,
          do_not_mutate_kernel_state:true,
          do_not_mutate_source_registry:true,
          do_not_promote_truth_from_coherence:true,
          preserve_counter_considerations:true,
          preserve_observation_count_as_low_signal_indicator:true,
          treat_source_trace_as_provenance_not_proof:true,
          treat_source_registry_as_metadata_not_proof:true,
          kernel_owns_belief_movement:true,
          llm_is_interface_not_brain:true
        }
      };
    });
    return {
      packet_type:'42ndMind_source_trace_explanation_packet',
      packet_version:'0.1.2',
      doctrine:{
        first_principles:true,
        epistemic_octahedron_consistent:true,
        null_origin_preserved:true,
        active_surface_rule:'|x| + |y| + |z| = 1 for active states',
        unresolved_pressure_must_remain_visible:true,
        contradiction_detection_is_not_contradiction_resolution:true,
        provenance_is_not_proof:true,
        retrieval_is_not_verification:true,
        no_rule_self_promotion:true
      },
      state_summary:{
        claims:asArray(state.claims).length,
        evidence:asArray(state.evidence).length,
        open_questions:linkedOpenQuestions(state, traces[0]).length,
        observations:asArray(state.observations).length,
        source_traces:traces.length,
        source_registry_available:registrySummary.available,
        source_registry_sources:registrySummary.counts.sources,
        source_registry_unresolved_questions:registrySummary.counts.unresolved_source_questions
      },
      source_traces:tracePackets,
      source_registry_summary:registrySummary,
      source_registry_metadata:savedSourceRegistry.available ? {
        available:true,
        storage_key:'42ndMind_source_registry_v0_1',
        saved_at:savedSourceRegistry.saved_at,
        sourceRegistry:savedSourceRegistry.sourceRegistry,
        sourceRegistryReport:savedSourceRegistry.sourceRegistryReport,
        meta:savedSourceRegistry.meta
      } : {
        available:false,
        storage_key:'42ndMind_source_registry_v0_1',
        reason:savedSourceRegistry.reason || 'no_saved_source_registry',
        meta:savedSourceRegistry.meta || sourceRegistryMeta()
      },
      local_preview:buildLocalPreviewFromTraces(tracePackets, registrySummary),
      requested_llm_behavior:[
        'Explain what sources were imported and what pressure they created.',
        'Explain source registry state as metadata only, not proof.',
        'Do not treat retrieval status or provenance as verification.',
        'Do not suggest belief-state changes unless framed as a proposed kernel command requiring user approval.'
      ]
    };
  }
  function buildPrompt(packet) {
    return [
      'You are explaining a 42ndMind source trace and source registry. The Epistemic Kernel owns belief movement. You are only the interface layer.',
      'Do not mutate state. Do not mutate the source registry. Do not promote truth. Do not flatten counter-considerations. Do not treat source provenance as proof. Do not treat retrieval status as verification.',
      JSON.stringify(packet, null, 2)
    ].join('\n\n');
  }
  function run() {
    try {
      const packet = buildExplanationPacket(buildFixtureState(), buildFixtureSavedSourceRegistry());
      const prompt = buildPrompt(packet);
      const trace = packet.source_traces[0] || { counts:{}, explanation_guardrails:{} };
      const registry = packet.source_registry_summary || { counts:{}, doctrine:{} };
      const cases = [
        ['packet type', packet.packet_type === '42ndMind_source_trace_explanation_packet'],
        ['packet version 0.1.2', packet.packet_version === '0.1.2'],
        ['one source trace', packet.state_summary.source_traces === 1],
        ['claims count', trace.counts.claims === 4],
        ['evidence count', trace.counts.evidence === 7],
        ['attacking evidence count', trace.counts.attacking_evidence === 3],
        ['observations omitted', trace.counts.observations === 0],
        ['linked claims preserved', trace.linked_claims.length === 4],
        ['linked evidence preserved', trace.linked_evidence.length === 7],
        ['attacking rows separated', trace.attacking_evidence.length === 3],
        ['open pressure visible', trace.open_questions.length === 6],
        ['first principles flag', packet.doctrine.first_principles === true],
        ['octahedron surface rule', packet.doctrine.active_surface_rule.includes('|x| + |y| + |z| = 1')],
        ['contradiction is not resolution', packet.doctrine.contradiction_detection_is_not_contradiction_resolution === true],
        ['provenance is not proof doctrine', packet.doctrine.provenance_is_not_proof === true],
        ['retrieval is not verification doctrine', packet.doctrine.retrieval_is_not_verification === true],
        ['no rule self-promotion', packet.doctrine.no_rule_self_promotion === true],
        ['explain only guardrail', trace.explanation_guardrails.explain_only === true],
        ['no kernel mutation guardrail', trace.explanation_guardrails.do_not_mutate_kernel_state === true],
        ['no source registry mutation guardrail', trace.explanation_guardrails.do_not_mutate_source_registry === true],
        ['source trace provenance not proof guardrail', trace.explanation_guardrails.treat_source_trace_as_provenance_not_proof === true],
        ['source registry metadata not proof guardrail', trace.explanation_guardrails.treat_source_registry_as_metadata_not_proof === true],
        ['LLM is interface guardrail', trace.explanation_guardrails.llm_is_interface_not_brain === true],
        ['source registry summary exists', packet.source_registry_summary && packet.source_registry_summary.available === true],
        ['source registry metadata exists', packet.source_registry_metadata && packet.source_registry_metadata.available === true],
        ['source registry source count', registry.counts.sources === 2],
        ['source registry unresolved questions', registry.counts.unresolved_source_questions === 6],
        ['source registry non-scoring doctrine', registry.doctrine.non_scoring === true],
        ['source registry metadata only doctrine', registry.doctrine.metadata_only === true],
        ['source registry provenance not proof doctrine', registry.doctrine.provenance_is_not_proof === true],
        ['source registry retrieval not verification doctrine', registry.doctrine.retrieval_is_not_verification === true],
        ['source registry meta non-scoring', packet.source_registry_metadata.meta.non_scoring === true],
        ['source registry scoring disallowed', packet.source_registry_metadata.meta.scoring_allowed === false],
        ['preview mentions source registry', packet.local_preview.includes('Source registry: available as non-scoring metadata')],
        ['prompt blocks mutation', prompt.includes('Do not mutate state')],
        ['prompt blocks source registry mutation', prompt.includes('Do not mutate the source registry')],
        ['prompt blocks truth promotion', prompt.includes('Do not promote truth')],
        ['prompt blocks retrieval as verification', prompt.includes('Do not treat retrieval status as verification')]
      ];
      const passed = cases.filter(row => row[1]).length;
      const text = `Source Trace Bridge smoke test\n${passed}/${cases.length} passed\n\n` + cases.map(row => `${row[1] ? 'PASS' : 'FAIL'} ${row[0]}`).join('\n') + '\n\n' + JSON.stringify(packet, null, 2);
      const out = document.getElementById('out');
      out.textContent = text;
      out.className = passed === cases.length ? 'pass' : 'fail';
    } catch (error) {
      const out = document.getElementById('out');
      out.textContent = `Source Trace Bridge smoke test crashed\n${error.message}\n\n${error.stack || ''}`;
      out.className = 'fail';
    }
  }
  async function copyOutput() {
    const text = document.getElementById('out').textContent;
    try { await navigator.clipboard.writeText(text); document.getElementById('status').textContent = `Copied output (${text.length.toLocaleString()} chars).`; }
    catch (error) { document.getElementById('status').textContent = 'Could not auto-copy. Select output manually.'; }
  }
  run();
</script>
</body>
</html>
