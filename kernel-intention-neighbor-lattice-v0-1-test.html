<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>42ndMind Intention Neighbor Lattice Test</title><style>body{margin:0;background:#0f1115;color:#eef2ff;font:14px ui-monospace,Menlo,Consolas,monospace}header{padding:16px;background:#11141b;border-bottom:1px solid #2a3040}main{padding:12px}section{background:#171a21;border:1px solid #2a3040;border-radius:10px;padding:12px}pre{white-space:pre-wrap;background:#0d1016;border:1px solid #2a3040;border-radius:10px;padding:10px;overflow:auto;max-height:760px}.ok{color:#9dffb4}.bad{color:#ff8b8b}a{color:#9db6ff}</style></head><body><header><h1>42ndMind Intention Neighbor Lattice Test</h1><div>Tests directed candidate lattice over intention concept shifts. No real-world intent attribution.</div></header><main><section><h2 id="summary">Running...</h2><div><a href="intention-neighbor-lattice.html?v=lattice-1">intention neighbor lattice page</a></div><pre id="out"></pre></section></main><script src="src/kernel-intention-discovery-v0-1.js?v=intent-1"></script><script src="src/kernel-intention-refinement-v0-1.js?v=refine-1"></script><script src="src/kernel-intention-necessity-test-v0-1.js?v=necessity-1"></script><script src="src/kernel-intention-neighbor-lattice-v0-1.js?v=lattice-1"></script><script>const tests=[];let packet=null;function add(n,f){tests.push({name:n,fn:f})}function assert(c,m){if(!c)throw new Error(m)}function arr(v){return Array.isArray(v)?v:[]}function node(id){return arr(packet&&packet.nodes).find(n=>n.id===id)}function edge(from,to,dim){return arr(packet&&packet.edges).find(e=>e.from===from&&e.to===to&&(!dim||e.removed_dimension===dim))}add('modules load',()=>{assert(window.KernelIntentionDiscoveryV01,'discovery missing');assert(window.KernelIntentionRefinementV01,'refinement missing');assert(window.KernelIntentionNecessityTestV01,'necessity missing');assert(window.KernelIntentionNeighborLatticeV01,'lattice missing');assert(KernelIntentionNeighborLatticeV01.VERSION==='0.1.0','version wrong');assert(typeof KernelIntentionNeighborLatticeV01.runLattice==='function','runLattice missing')});add('doctrine keeps lattice candidate-only',()=>{const d=KernelIntentionNeighborLatticeV01.doctrine();assert(d.maps_intention_concepts_not_claim_facts===true,'concept mapping doctrine missing');assert(d.no_real_world_intent_attribution===true,'attribution guard missing');assert(d.lattice_edges_are_candidate_not_doctrine===true,'candidate-only guard missing');assert(d.edge_weight_is_structural_pressure_not_truth===true,'edge-weight guard missing');assert(d.belief_movement==='none','belief movement wrong')});add('lattice runs from necessity output',()=>{packet=KernelIntentionNeighborLatticeV01.runLattice();assert(packet.ok===true,'packet not ok: '+JSON.stringify(packet.validation));assert(packet.source_necessity_ok===true,'source necessity not ok');assert(packet.summary.source_concept_count===3,'expected 3 source concepts');assert(packet.summary.node_count>=12,'too few nodes');assert(packet.summary.edge_count>=18,'too few edges');assert(packet.belief_movement==='none','packet moved belief')});add('source and neighbor nodes exist',()=>{['desire','lying','promise'].forEach(id=>{const n=node(id);assert(n,'missing source '+id);assert(n.node_type==='source_intention_concept',id+' wrong node type')});['preference','mistake','fiction','private_intention'].forEach(id=>assert(node(id),'missing neighbor '+id))});add('expected concept-shift edges exist',()=>{assert(edge('lying','mistake','belief_assertion_mismatch'),'missing lying -> mistake edge');assert(edge('desire','preference','attainment_pull'),'missing desire -> preference edge');assert(edge('promise','private_intention','recipient_reliance_invitation'),'missing promise -> private_intention edge');assert(edge('lying','fiction','concealment_of_mismatch'),'missing lying -> fiction edge')});add('edge types and weights are coherent',()=>{const collapse=arr(packet.edges).filter(e=>e.edge_type==='collapse_edge');const shifts=arr(packet.edges).filter(e=>e.edge_type==='neighbor_shift_edge');const boundary=arr(packet.edges).filter(e=>e.edge_type==='boundary_weaken_edge');const expr=arr(packet.edges).filter(e=>e.edge_type==='expression_weaken_edge');assert(collapse.length>=3,'missing collapse edges');assert(shifts.length>=6,'missing shift edges');assert(boundary.length>=2,'missing boundary edges');assert(expr.length>=3,'missing expression edges');arr(packet.edges).forEach(e=>{assert(e.structural_pressure_weight>0&&e.structural_pressure_weight<=1,'bad weight '+e.id);assert(e.candidate_status==='candidate_lattice_edge_not_doctrine','edge promoted '+e.id);assert(e.belief_movement==='none','edge moved belief '+e.id);assert(e.counterfactual_l1_total===1,'edge counterfactual not unit-total '+e.id)})});add('validation report is clean',()=>{assert(packet.validation&&packet.validation.ok===true,'validation not ok');assert(packet.validation.node_count===packet.summary.node_count,'validation node count mismatch');assert(packet.validation.edge_count===packet.summary.edge_count,'validation edge count mismatch');assert(arr(packet.validation.errors).length===0,'validation has errors')});add('lattice remains local concept math, not event ledger',()=>{arr(packet.nodes).forEach(n=>assert(n.belief_movement==='none','node moved belief '+n.id));assert(!arr(packet.nodes).some(n=>String(n.label).match(/bob|alice|trump|canada/i)),'found real-world entity leakage');assert(packet.doctrine.no_person_event_or_narrative_belief_ledger===true,'ledger guard missing')});(async function run(){const results=[];for(const t of tests){try{await t.fn();results.push({name:t.name,passed:true})}catch(e){results.push({name:t.name,passed:false,error:e.message})}}const passed=results.filter(r=>r.passed).length;document.getElementById('summary').className=passed===tests.length?'ok':'bad';document.getElementById('summary').textContent=passed+'/'+tests.length+' passed';document.getElementById('out').textContent=JSON.stringify({packet_type:'42ndMind_intention_neighbor_lattice_test_report_v0_1',ok:passed===tests.length,summary:packet&&packet.summary,sample_edges:packet&&packet.edges&&packet.edges.slice(0,12),validation:packet&&packet.validation,results},null,2)})();</script></body></html>
