<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>42ndMind Expanded Language-to-Formula Benchmark Test v0.1.2</title><style>body{margin:0;background:#0f1115;color:#eef2ff;font:14px ui-monospace,Menlo,Consolas,monospace}header{padding:16px;background:#11141b;border-bottom:1px solid #2a3040}main{padding:12px}section{background:#171a21;border:1px solid #2a3040;border-radius:10px;padding:12px}pre{white-space:pre-wrap;background:#0d1016;border:1px solid #2a3040;border-radius:10px;padding:10px;overflow:auto;max-height:760px}.ok{color:#9dffb4}.bad{color:#ff8b8b}a{color:#9db6ff}</style></head><body><header><h1>42ndMind Expanded Language-to-Formula Benchmark Test v0.1.2</h1><div>Patch: weak dimension-only noise is held out for unmatched controls. Candidate only.</div></header><main><section><h2 id="summary">Running...</h2><div><a href="intention-language-to-formula-expanded-benchmark-v0-1-2.html?v=parser-3">expanded benchmark page v0.1.2</a></div><pre id="out"></pre></section></main><script src="src/kernel-intention-discovery-v0-1.js?v=intent-1"></script><script src="src/kernel-intention-refinement-v0-1.js?v=refine-1"></script><script src="src/kernel-intention-necessity-test-v0-1.js?v=necessity-1"></script><script src="src/kernel-intention-neighbor-lattice-v0-1.js?v=lattice-3"></script><script src="src/kernel-intention-lattice-invariance-benchmark-v0-1.js?v=invariance-2"></script><script src="src/kernel-intention-formula-compiler-v0-1.js?v=formula-1"></script><script src="src/kernel-intention-concept-expansion-loop-v0-1.js?v=expansion-2"></script><script src="src/kernel-intention-contradiction-refinement-loop-v0-1.js?v=contradiction-1"></script><script src="src/kernel-intention-formula-revision-engine-v0-1.js?v=revision-1"></script><script src="src/kernel-intention-canonical-formula-ledger-v0-1.js?v=ledger-1"></script><script src="src/kernel-intention-proof-output-v0-1.js?v=proof-1"></script><script src="src/kernel-intention-minimal-pair-library-v0-1.js?v=minpair-1"></script><script src="src/kernel-intention-dimension-splitting-v0-1.js?v=split-2"></script><script src="src/kernel-intention-coefficient-dimension-revision-engine-v0-1.js?v=codim-1"></script><script src="src/kernel-intention-canonical-formula-ledger-v0-1-1-patch.js?v=ledger-2"></script><script src="src/kernel-intention-arbitrary-language-parser-v0-1.js?v=parser-1"></script><script src="src/kernel-intention-arbitrary-language-parser-v0-1-1-patch.js?v=parser-3"></script><script>const tests=[];let packet=null;function add(n,f){tests.push({name:n,fn:f})}function assert(c,m){if(!c)throw new Error(m)}function arr(v){return Array.isArray(v)?v:[]}function parses(){return arr(packet&&packet.parses)}function byMode(mode){return parses().filter(p=>p.expected_mode===mode)}function byId(id){return parses().find(p=>p.parse_id===id)}add('modules load and doctrine has weak-noise holdout',()=>{assert(window.KernelIntentionArbitraryLanguageParserV011,'parser v0.1.1 patch missing');assert(KernelIntentionArbitraryLanguageParserV011.VERSION==='0.1.1','version wrong');assert(typeof KernelIntentionArbitraryLanguageParserV011.runExpandedParser==='function','runExpandedParser missing');assert(typeof KernelIntentionArbitraryLanguageParserV011.isWeakDimensionOnlyNoise==='function','holdout detector missing');const d=KernelIntentionArbitraryLanguageParserV011.doctrine();assert(d.expands_parser_text_surface_without_doctrine_change===true,'expansion doctrine missing');assert(d.weak_dimension_only_noise_must_not_create_formula_match===true,'weak-noise doctrine missing');assert(d.unmatched_cases_must_remain_unmatched===true,'unmatched guard missing');assert(d.belief_movement==='none','belief movement wrong')});add('expanded parser runs from ledger and proof output',()=>{packet=KernelIntentionArbitraryLanguageParserV011.runExpandedParser();assert(packet.ok===true,'packet not ok: '+JSON.stringify(packet.validation));assert(packet.source_ledger_ok===true,'source ledger not ok');assert(packet.source_ledger_record_count===11,'expected 11 ledger records');assert(packet.source_proof_ok===true,'source proof not ok');assert(packet.source_proof_count===11,'expected 11 proof rows');assert(packet.belief_movement==='none','packet moved belief')});add('twenty-seven parse cases are produced',()=>{assert(packet.parse_count===27,'expected 27 parses');assert(parses().length===27,'expected 27 parse rows');assert(packet.validation.checks.twenty_seven_parse_cases===true,'27 parse check failed')});add('twenty-two labelled cases match expected concepts',()=>{assert(packet.labelled_case_count===22,'expected 22 labelled cases');assert(byMode('labelled').length===22,'expected 22 labelled rows');byMode('labelled').forEach(p=>{assert(p.expected_match_v0_1_1===true,p.parse_id+' expected '+p.expected_concept+' got '+(p.top_candidate&&p.top_candidate.concept));assert(p.top_candidate&&p.top_candidate.candidate_version.includes('v0003_coefficient_dimension_revision'),p.parse_id+' top candidate not v0003')});assert(packet.validation.checks.all_labelled_cases_match===true,'labelled match check failed')});add('three ambiguity cases remain visibly ambiguous',()=>{assert(packet.ambiguity_case_count===3,'expected 3 ambiguity cases');assert(byMode('ambiguity').length===3,'expected 3 ambiguity rows');byMode('ambiguity').forEach(p=>{assert(p.expected_match_v0_1_1===true,p.parse_id+' ambiguity not accepted');assert(p.parse_status==='ambiguous_candidate_match'||p.ambiguity_score>=0.75,p.parse_id+' ambiguity not visible')});assert(packet.validation.checks.three_ambiguity_cases_visible===true,'ambiguity check failed')});add('two negative controls remain unmatched with weak-noise holdout available',()=>{assert(packet.unmatched_case_count===2,'expected 2 unmatched cases');assert(byMode('unmatched').length===2,'expected 2 unmatched rows');byMode('unmatched').forEach(p=>{assert(p.parse_status==='unmatched',p.parse_id+' should be unmatched but was '+p.parse_status);assert(p.expected_match_v0_1_1===true,p.parse_id+' unmatched expectation failed')});assert(byId('expanded_unmatched_002').unmatched_holdout_applied===true,'under-table weak-noise holdout not applied');assert(packet.validation.checks.two_unmatched_cases_remain_unmatched===true,'unmatched check failed');assert(packet.validation.checks.weak_dimension_noise_holdout_available===true,'weak-noise holdout check failed')});add('unresolved dimensions and candidate-only status are preserved',()=>{parses().forEach(p=>{assert(p.belief_movement==='none',p.parse_id+' moved belief');if(p.expected_mode!=='unmatched'){assert(typeof p.top_candidate.unresolved_dimension_count==='number',p.parse_id+' missing unresolved count');assert(p.top_candidate.promotion_status==='not_promoted',p.parse_id+' promoted');assert(p.top_candidate.doctrine_status==='candidate_not_doctrine',p.parse_id+' doctrine status wrong')}});assert(packet.validation.checks.unresolved_dimensions_visible===true,'unresolved dimensions check failed');assert(packet.validation.checks.candidate_only_not_promoted===true,'candidate-only check failed')});add('validation report is clean',()=>{assert(packet.validation&&packet.validation.ok===true,'validation not ok');assert(packet.validation.checks.belief_movement_none===true,'belief movement check failed');assert(arr(packet.validation.errors).length===0,'validation errors present: '+packet.validation.errors.join(','))});(async function run(){const results=[];for(const t of tests){try{await t.fn();results.push({name:t.name,passed:true})}catch(e){results.push({name:t.name,passed:false,error:e.message})}}const passed=results.filter(r=>r.passed).length;document.getElementById('summary').className=passed===tests.length?'ok':'bad';document.getElementById('summary').textContent=passed+'/'+tests.length+' passed';document.getElementById('out').textContent=JSON.stringify({packet_type:'42ndMind_intention_language_to_formula_expanded_benchmark_test_report_v0_1_2',ok:passed===tests.length,source_ledger_record_count:packet&&packet.source_ledger_record_count,source_proof_count:packet&&packet.source_proof_count,parse_count:packet&&packet.parse_count,labelled_case_count:packet&&packet.labelled_case_count,ambiguity_case_count:packet&&packet.ambiguity_case_count,unmatched_case_count:packet&&packet.unmatched_case_count,unmatched_cases:byMode('unmatched').map(p=>({parse_id:p.parse_id,parse_status:p.parse_status,top_concept:p.top_candidate&&p.top_candidate.concept,ambiguity_score:p.ambiguity_score,unmatched_holdout_applied:p.unmatched_holdout_applied,unmatched_holdout_reason:p.unmatched_holdout_reason,expected_match_v0_1_1:p.expected_match_v0_1_1})),validation:packet&&packet.validation,results},null,2)})();</script></body></html>
