<script>
  const tests=[]; let packet=null;
  function add(name,fn){tests.push({name,fn});} function assert(cond,msg){if(!cond)throw new Error(msg);} function asArray(v){return Array.isArray(v)?v:[];}
  add('modules load',()=>{assert(window.KernelSemanticCanonicalRelationTriageRefinedV01,'refined triage missing');assert(window.KernelSemanticCanonicalRelationProposerRefinedV01,'refined proposer missing');assert(KernelSemanticCanonicalRelationTriageRefinedV01.VERSION==='0.1.0','version wrong');});
  add('doctrine preserves unit-total growth principle',()=>{const d=KernelSemanticCanonicalRelationTriageRefinedV01.doctrine();assert(d.unit_total_principle_allows_small_complete_shapes_to_refine_without_exceeding_one===true,'unit-total growth doctrine missing');assert(d.early_scope_can_be_complete_one_with_few_dimensions===true,'early scope doctrine missing');assert(d.mature_scope_remains_one_with_more_dimensions===true,'mature scope doctrine missing');assert(d.active_shape_l1_total==='sum_abs_dimensions_equals_1','active shape rule missing');assert(d.belief_movement==='none','belief movement wrong');});
  add('classifier still recognizes synthetic status-collapse regression',()=>{const row=KernelSemanticCanonicalRelationTriageRefinedV01.triageRemainingTarget({formal_statement:'unresolved ≡ not_settled ≡ not_collusion',canonical_signature:'d3',member_operators:['unresolved','not_settled','not_collusion'],local_label_metadata:['uncertainty_calibration_pressure']});assert(row.triage_type==='status_negation_vocabulary_collapse_needs_role_split','wrong status collapse triage');assert(row.severity==='high','status collapse should be high');});
  add('load refined propose and triage succeeds',async()=>{packet=await KernelSemanticCanonicalRelationTriageRefinedV01.loadRefinedProposeAndTriage({min_template_observations:2,min_observations:2,limit:10,sentences_per_template:4,allowed_extra_pressures:0,min_strong_observations:4});assert(packet.ok===true,'refined triage packet not ok');assert(packet.summary.split_checks_passed===true,'split checks failed');assert(packet.summary.critical_regression_count===0,'critical regression detected');assert(packet.belief_movement==='none','packet moved belief');});
  add('status-collapse target is absent after refinement',()=>{const rows=packet.triage_report.remaining_equivalence_triage;assert(!rows.some(r=>r.triage_type==='status_negation_vocabulary_collapse_needs_role_split'),'status collapse still remains in live triage');assert(!packet.triage_report.recommended_next_targets.includes('uncertainty_status_negation_basis_refinement'),'old status-negation target still recommended');});
  add('no belief movement anywhere',()=>{assert(packet.triage_report.belief_movement==='none','triage report moved belief');assert(asArray(packet.triage_report.remaining_equivalence_triage).every(r=>r.belief_movement==='none'),'remaining row moved belief');assert(asArray(packet.triage_report.relation_triage).every(r=>r.belief_movement==='none'),'relation row moved belief');});
  add('summary exposes refined triage counts',()=>{assert(packet.summary.relation_triage_count>=1,'relation triage missing');assert(packet.summary.high_severity_count===0,'unexpected high severity after status split');assert(packet.summary.objective_language_claim==='refined_relation_triage_guides_next_basis_refinement_not_final_math','objective claim wrong');});
  (async function run(){const results=[];for(const t of tests){try{await t.fn();results.push({name:t.name,passed:true});}catch(e){results.push({name:t.name,passed:false,error:e.message});}}const passed=results.filter(r=>r.passed).length;document.getElementById('summary').className=passed===results.length?'ok':'bad';document.getElementById('summary').textContent=`${passed}/${results.length} passed`;document.getElementById('out').textContent=JSON.stringify({packet_type:'42ndMind_refined_canonical_relation_triage_v0_1_test_report',summary:packet&&packet.summary,remaining_equivalence_triage:packet&&packet.triage_report&&packet.triage_report.remaining_equivalence_triage,recommended_next_targets:packet&&packet.triage_report&&packet.triage_report.recommended_next_targets,results},null,2);})();
</script>
