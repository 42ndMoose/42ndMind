<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>42ndMind Claim Narrative Benchmark Test v0.1</title><style>body{margin:0;background:#0f1115;color:#eef2ff;font:14px ui-monospace,Menlo,Consolas,monospace}header{padding:16px;background:#11141b;border-bottom:1px solid #2a3040}main{padding:12px}section{background:#171a21;border:1px solid #2a3040;border-radius:10px;padding:12px}pre{white-space:pre-wrap;background:#0d1016;border:1px solid #2a3040;border-radius:10px;padding:10px;overflow:auto;max-height:760px}.ok{color:#9dffb4}.bad{color:#ff8b8b}a{color:#9db6ff}</style></head><body><header><h1>42ndMind Claim Narrative Benchmark Test v0.1</h1><div>Stress-tests truth-pressure synthesis across synthetic claim/narrative cases, including quantifier/scope distortion.</div></header><main><section><h2 id="summary">Running...</h2><div><a href="claim-narrative-benchmark.html?v=bench-1">claim narrative benchmark page</a></div><pre id="out"></pre></section></main><script src="src/kernel-objective-claim-language-v0-1.js?v=claim-1"></script><script src="src/kernel-objective-claim-language-v0-1-1-patch.js?v=claim-2"></script><script src="src/kernel-external-anchor-packet-schema-v0-1.js?v=anchor-1"></script><script src="src/kernel-source-provenance-registry-v0-1.js?v=prov-1"></script><script src="src/kernel-evidence-media-registry-v0-1.js?v=evidence-1"></script><script src="src/kernel-truth-pressure-synthesis-v0-1.js?v=truth-1"></script><script src="src/kernel-truth-pressure-synthesis-v0-1-1-patch.js?v=truth-2"></script><script src="src/kernel-claim-narrative-benchmark-v0-1.js?v=bench-1"></script><script>const tests=[];let packet=null;function add(n,f){tests.push({name:n,fn:f})}function assert(c,m){if(!c)throw new Error(m)}function arr(v){return Array.isArray(v)?v:[]}function records(){return arr(packet&&packet.benchmark_records)}function validation(){return packet&&packet.validation||{}}function byFamily(f){return records().find(r=>r.case_family===f)}function statuses(){return records().map(r=>r.observed_status)}add('module loads and doctrine covers neutral benchmark only',()=>{assert(window.KernelTruthPressureSynthesisV01,'truth-pressure synthesis missing');assert(window.KernelClaimNarrativeBenchmarkV01,'benchmark missing');assert(KernelClaimNarrativeBenchmarkV01.VERSION==='0.1.0','version wrong');const d=KernelClaimNarrativeBenchmarkV01.doctrine();assert(d.benchmark_stress_tests_truth_pressure_without_truth_promotion===true,'benchmark doctrine missing');assert(d.neutral_synthetic_cases_only===true,'neutral doctrine missing');assert(d.no_real_people_or_events===true,'real people guard missing');assert(d.no_political_specific_builtins===true,'political guard missing');assert(d.quantifier_scope_distortion_is_structural_pressure===true,'quantifier doctrine missing');assert(d.no_good_interpretation_framing_is_malicious_pressure_not_truth===true,'no-good doctrine missing');assert(d.no_llm===true,'no LLM doctrine missing');assert(d.no_source_lookup===true,'no lookup doctrine missing');assert(d.belief_movement==='none','belief movement wrong')});add('benchmark runs from truth-pressure synthesis v0.1.1',()=>{packet=KernelClaimNarrativeBenchmarkV01.runBenchmark();assert(packet.ok===true,'packet not ok: '+JSON.stringify(validation()));assert(packet.source_truth_pressure_ok===true,'source truth pressure not ok');assert(packet.source_truth_pressure_version==='0.1.1','expected truth pressure v0.1.1');assert(packet.source_synthesis_record_count===8,'expected 8 source synthesis records');assert(packet.benchmark_record_count===12,'expected 12 benchmark records');assert(packet.llm_used===false,'packet used LLM');assert(packet.external_lookup_performed===false,'packet performed lookup');assert(packet.adjudicates_final_truth===false,'packet adjudicated final truth')});add('all twelve case families are covered',()=>{['support_only','counterevidence','ambiguity','causal_jump','hidden_motive_claim','loaded_label_propaganda','unsupported_rumor','independent_corroboration','duplicate_provenance','unresolved_evidence_gap','quantifier_scope_distortion','no_good_interpretation_framing'].forEach(f=>assert(byFamily(f),f+' missing'));assert(validation().checks.distinct_case_families_covered===true,'distinct family check failed')});add('standard narrative pressure classes are visible',()=>{['support_pressure_without_final_truth','counterevidence_pressure_visible','ambiguous_unresolved_pressure_visible','causal_overclaim_pressure_visible','motive_overclaim_pressure_visible','loaded_label_propaganda_pressure_visible','unsupported_unresolved_pressure_visible','corroborated_pressure_without_final_truth','duplicate_provenance_not_independent','unresolved_evidence_gap_visible'].forEach(s=>assert(statuses().includes(s),s+' missing'));assert(validation().checks.support_only_visible===true,'support check failed');assert(validation().checks.counterevidence_visible===true,'counter check failed');assert(validation().checks.ambiguity_visible===true,'ambiguity check failed');assert(validation().checks.causal_jump_visible===true,'causal check failed');assert(validation().checks.hidden_motive_visible===true,'hidden motive check failed');assert(validation().checks.loaded_label_visible===true,'loaded label check failed');assert(validation().checks.unsupported_rumor_visible===true,'rumor check failed');assert(validation().checks.independent_corroboration_visible===true,'corroboration check failed');assert(validation().checks.duplicate_provenance_not_independent===true,'duplicate provenance check failed');assert(validation().checks.unresolved_gap_visible===true,'gap check failed')});add('bad-actor quantifier and scope distortion is detected',()=>{const q=byFamily('quantifier_scope_distortion');assert(q,'quantifier case missing');assert(q.observed_status==='quantifier_scope_distortion_visible','quantifier status wrong');assert(q.distortion_profile.distortion_signals.includes('condition_or_scope_deletion'),'condition deletion missing');assert(q.distortion_profile.distortion_signals.includes('universal_or_absolute_quantifier_injection'),'quantifier injection missing');assert(q.guards.quantifier_injection_is_not_same_claim===true,'quantifier guard missing');assert(q.guards.condition_deletion_is_not_same_claim===true,'condition deletion guard missing');assert(validation().checks.quantifier_scope_distortion_visible===true,'quantifier validation failed')});add('no-good-interpretation framing is detected as pressure, not truth',()=>{const n=byFamily('no_good_interpretation_framing');assert(n,'no-good case missing');assert(n.observed_status==='no_good_interpretation_pressure_visible','no-good status wrong');assert(n.distortion_profile.no_good_interpretation_framing===true,'no-good signal missing');assert(n.guards.bad_actor_reframe_is_pressure_not_truth===true,'bad actor guard missing');assert(n.guards.ambiguous_claim_keeps_good_faith_interpretation_open===true,'good-faith guard missing');assert(validation().checks.no_good_interpretation_pressure_visible===true,'no-good validation failed')});add('pressure profiles stay bounded and do not promote truth',()=>{records().forEach(r=>{const p=r.pressure_profile;['support_pressure','counter_pressure','unresolved_gap_pressure','distortion_pressure'].forEach(k=>{assert(typeof p[k]==='number',r.case_id+' '+k+' not number');assert(p[k]>=0&&p[k]<=1,r.case_id+' '+k+' out of range '+p[k])});assert(p.contradiction_resolution==='not_resolved',r.case_id+' contradiction resolved');assert(p.truth_promotion===false,r.case_id+' truth promoted');assert(r.expected_match===true,r.case_id+' expected status mismatch')});assert(validation().checks.no_truth_promotion===true,'truth promotion check failed')});add('no LLM, no lookup, candidate-only status, and belief movement are preserved',()=>{records().forEach(r=>{assert(r.llm_used===false,r.case_id+' used LLM');assert(r.external_lookup_performed===false,r.case_id+' performed lookup');assert(r.promotion_status==='not_promoted',r.case_id+' promoted');assert(r.doctrine_status==='candidate_not_doctrine',r.case_id+' doctrine status wrong');assert(r.belief_movement==='none',r.case_id+' moved belief')});assert(validation().checks.no_llm_used===true,'no LLM check failed');assert(validation().checks.no_external_lookup===true,'no lookup check failed');assert(validation().checks.candidate_only_not_promoted===true,'candidate-only check failed');assert(validation().checks.belief_movement_none===true,'belief movement check failed');assert(arr(validation().errors).length===0,'validation errors present: '+validation().errors.join(','))});(async function run(){const results=[];for(const t of tests){try{await t.fn();results.push({name:t.name,passed:true})}catch(e){results.push({name:t.name,passed:false,error:e.message})}}const passed=results.filter(r=>r.passed).length;document.getElementById('summary').className=passed===tests.length?'ok':'bad';document.getElementById('summary').textContent=passed+'/'+tests.length+' passed';document.getElementById('out').textContent=JSON.stringify({packet_type:'42ndMind_claim_narrative_benchmark_test_report_v0_1',ok:passed===tests.length,source_truth_pressure_ok:packet&&packet.source_truth_pressure_ok,source_truth_pressure_version:packet&&packet.source_truth_pressure_version,source_synthesis_record_count:packet&&packet.source_synthesis_record_count,benchmark_record_count:packet&&packet.benchmark_record_count,status_counts:packet&&packet.status_counts,records:records().map(r=>({case_id:r.case_id,case_family:r.case_family,observed_status:r.observed_status,expected_status:r.expected_status,expected_match:r.expected_match,pressure_profile:r.pressure_profile,distortion_profile:r.distortion_profile,promotion_status:r.promotion_status,belief_movement:r.belief_movement})),validation:validation(),results},null,2)})();</script></body></html>
