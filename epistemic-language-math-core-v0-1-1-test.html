<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>42ndMind Language-Math Core Test v0.1.1</title><style>body{margin:0;background:#0f1115;color:#eef2ff;font:14px ui-monospace,Menlo,Consolas,monospace}header{padding:16px;background:#11141b;border-bottom:1px solid #2a3040}main{padding:12px}section{background:#171a21;border:1px solid #2a3040;border-radius:10px;padding:12px}pre{white-space:pre-wrap;background:#0d1016;border:1px solid #2a3040;border-radius:10px;padding:10px;overflow:auto;max-height:820px}.ok{color:#9dffb4}.bad{color:#ff8b8b}</style></head><body><header><h1>42ndMind Language-Math Core Test v0.1.1</h1><div>Tests conversational intent as a language-math relation, not a connector/chatbot layer.</div></header><main><section><h2 id="summary">Running...</h2><pre id="out"></pre></section></main><script src="src/kernel-intention-discovery-v0-1.js?v=intent-1"></script><script src="src/kernel-intention-refinement-v0-1.js?v=refine-1"></script><script src="src/kernel-intention-necessity-test-v0-1.js?v=necessity-1"></script><script src="src/kernel-intention-neighbor-lattice-v0-1.js?v=lattice-3"></script><script src="src/kernel-intention-lattice-invariance-benchmark-v0-1.js?v=invariance-2"></script><script src="src/kernel-intention-formula-compiler-v0-1.js?v=formula-1"></script><script src="src/kernel-intention-concept-expansion-loop-v0-1.js?v=expansion-2"></script><script src="src/kernel-intention-contradiction-refinement-loop-v0-1.js?v=contradiction-1"></script><script src="src/kernel-intention-formula-revision-engine-v0-1.js?v=revision-1"></script><script src="src/kernel-intention-canonical-formula-ledger-v0-1.js?v=ledger-1"></script><script src="src/kernel-intention-proof-output-v0-1.js?v=proof-1"></script><script src="src/kernel-intention-minimal-pair-library-v0-1.js?v=minpair-1"></script><script src="src/kernel-intention-dimension-splitting-v0-1.js?v=split-2"></script><script src="src/kernel-intention-coefficient-dimension-revision-engine-v0-1.js?v=codim-1"></script><script src="src/kernel-intention-canonical-formula-ledger-v0-1-1-patch.js?v=ledger-2"></script><script src="src/kernel-intention-formula-inspector-v0-1.js?v=inspect-1"></script><script src="src/kernel-concept-admission-registry-v0-1.js?v=admit-1"></script><script src="src/kernel-intention-formula-inspector-v0-1-1-patch.js?v=inspect-2"></script><script src="src/kernel-intention-arbitrary-language-parser-v0-1.js?v=parser-1"></script><script src="src/kernel-intention-arbitrary-language-parser-v0-1-1-patch.js?v=parser-3"></script><script src="src/kernel-objective-claim-language-v0-1.js?v=claim-1"></script><script src="src/kernel-objective-claim-language-v0-1-1-patch.js?v=claim-2"></script><script src="src/epistemic-kernel-v0-2.js?v=corebase-1"></script><script src="src/epistemic-kernel-v0-2-patches.js?v=coremig-1"></script><script src="src/kernel-brain-v0-4.js?v=brain-2"></script><script src="src/kernel-brain-epistemic-kernel-bridge-v0-1.js?v=bridge-2"></script><script src="src/epistemic-kernel-maturity-core-v0-1.js?v=maturity-2"></script><script src="src/epistemic-kernel-active-curiosity-v0-1.js?v=curiosity-2"></script><script src="src/epistemic-kernel-learning-drive-v0-1.js?v=learn-1"></script><script src="src/epistemic-kernel-belief-memory-engine-v0-1.js?v=belief-1"></script><script src="src/epistemic-kernel-belief-memory-engine-v0-1-1-patch.js?v=belief-3"></script><script src="src/epistemic-kernel-language-math-core-v0-1.js?v=langmath-1"></script><script src="src/epistemic-kernel-language-math-core-v0-1-1-patch.js?v=langmath-2"></script><script>const tests=[];let kernel=null,binding=null,boundBrain=null;function add(n,f){tests.push({name:n,fn:f})}function assert(c,m){if(!c)throw new Error(m)}function arr(v){return Array.isArray(v)?v:[]}function shared(){return kernel&&kernel.state&&kernel.state.unifiedCore}function lm(){return shared()&&shared().languageMathCore}function comm(){return shared()&&shared().communicationCore}function curio(){return shared()&&shared().curiosityCore}function mat(){return shared()&&shared().maturityCore}function has(rows,fn){return arr(rows).some(fn)}add('v0.1.1 patch loads without creating connector brain',()=>{assert(window.EpistemicKernelLanguageMathCoreV011Patch,'v0.1.1 patch missing');assert(EpistemicKernelLanguageMathCoreV011Patch.VERSION==='0.1.1','patch version wrong');assert(EpistemicKernel.__languageMathV011PatchApplied===true,'kernel v0.1.1 patch missing');assert(KernelBrainV04.__languageMathV011PatchApplied===true,'brain v0.1.1 patch missing');assert(KernelBrainEpistemicKernelBridgeV01.__languageMathV011PatchApplied===true,'bridge v0.1.1 patch missing')});add('binding keeps languageMathCore and communicationCore inside shared state',()=>{kernel=new EpistemicKernel();binding=KernelBrainEpistemicKernelBridgeV01.bind(kernel);boundBrain=binding.bound_brain;assert(boundBrain.state===shared(),'bound brain does not share unified state');assert(lm(),'languageMathCore missing');assert(comm(),'communicationCore missing');assert(lm().doctrine.communication_attention_is_not_external_connector===true,'connector refusal doctrine missing');assert(lm().doctrine.conversational_intent_is_language_math_relation===true,'intent-as-relation doctrine missing')});add('direct curiosity question is classified as request_self_state(curiosity)',()=>{boundBrain.ingest('are you curious? can you answer me?',{kind:'direct_curiosity_question'});boundBrain.refreshLanguageMathCore('after_direct_curiosity_question');const intent=arr(lm().intent_inference)[0];assert(intent,'intent inference missing');assert(intent.speech_act==='direct_question_to_kernel','speech act not direct question');assert(intent.inferred_user_intent==='request_kernel_self_state_answer','wrong inferred intent');assert(intent.requested_state_targets.includes('curiosity_state'),'curiosity target missing');assert(intent.requested_state_targets.includes('communication_capability'),'communication target missing');assert(/request_self_state/.test(intent.relation_formula),'intent relation formula missing')});add('kernel answers direct question from live state instead of generic context',()=>{assert(comm().current_message,'current message missing');assert(comm().current_message.thought_kind==='direct_self_state_answer','not a self-state answer');assert(/curious|curiosity/i.test(comm().current_message.message),'curiosity answer missing');assert(/answer/i.test(comm().current_message.message),'answer capability missing');assert(!/I heard this as conversation context/.test(comm().current_message.message),'fell back to inert context')});add('self-state answer records live state snapshot',()=>{const answer=arr(lm().self_state_answers)[0];assert(answer,'self-state answer missing');assert(answer.answer_kind==='curiosity_state_answer','wrong answer kind');assert(answer.state_snapshot&&answer.state_snapshot.curiosity,'curiosity snapshot missing');assert(answer.state_snapshot.language_math,'language math snapshot missing');assert(answer.state_snapshot.maturity&&answer.state_snapshot.maturity.wants_peak===true,'maturity snapshot missing')});add('ordinary semantic conflict still works after conversational intent patch',()=>{boundBrain.ingest('chicken means stretch',{kind:'semantic_remap_after_v011'});boundBrain.refreshLanguageMathCore('after_semantic_remap_v011');assert(has(lm().semantic_relation_claims,r=>r.source_term==='chicken'&&r.target_meaning==='stretch'),'semantic relation missing');assert(has(lm().semantic_conflicts,r=>r.source_term==='chicken'&&r.target_meaning==='stretch'),'semantic conflict missing');assert(comm().current_message.thought_kind==='semantic_conflict_question','semantic conflict communication overridden incorrectly')});add('benefit-of-doubt reply still carries as back-of-head context',()=>{boundBrain.ingest('I was testing whether you would blindly accept semantic remapping.',{kind:'benefit_reply_after_v011'});boundBrain.refreshLanguageMathCore('after_benefit_reply_v011');assert(has(lm().benefit_of_doubt_context,c=>/testing/.test(c.statement)),'benefit-of-doubt context missing');assert(has(lm().back_of_head_context,c=>c.use_policy==='may_inform_next_interpretation_without_truth_promotion'),'back-of-head context missing');assert(comm().current_message.thought_kind==='benefit_of_doubt_acknowledgement','benefit acknowledgement missing')});add('communication answers belief and memory self-state questions',()=>{boundBrain.ingest('what do you believe right now?',{kind:'belief_self_state_question'});boundBrain.refreshLanguageMathCore('after_belief_question');assert(comm().current_message.thought_kind==='direct_self_state_answer','belief question not answered');assert(/provisional belief|context/i.test(comm().current_message.message),'belief answer not state-based');boundBrain.ingest('what do you remember?',{kind:'memory_self_state_question'});boundBrain.refreshLanguageMathCore('after_memory_question');assert(comm().current_message.thought_kind==='direct_self_state_answer','memory question not answered');assert(/memory|formula/i.test(comm().current_message.message),'memory answer not state-based')});add('no final truth promotion occurs in conversational intent patch',()=>{assert(lm().truth_status==='not_final','language math core truth promoted');assert(lm().promotion_status==='not_promoted_to_final_truth','language math core promoted');assert(lm().belief_movement==='provisional_only','language math belief movement wrong');['intent_inference','self_state_answers','communication_pressure'].forEach(k=>arr(lm()[k]).forEach(row=>{assert(row.truth_status==='not_final',k+' truth promoted');assert(row.promotion_status==='not_promoted_to_final_truth',k+' promoted');assert(row.belief_movement==='provisional_only',k+' movement wrong')}));assert(comm().truth_status==='not_final','communication truth promoted');assert(comm().promotion_status==='not_promoted_to_final_truth','communication promoted')});add('objective maturity remains identity center',()=>{assert(mat(),'maturity core missing');assert(mat().core_philosophy==='objective_peak_philosophical_maturity','maturity philosophy wrong');assert(mat().wants_peak===true&&mat().aims_at_peak===true&&mat().stays_at_peak===true,'peak identity flags wrong')});(async function run(){const results=[];for(const t of tests){try{await t.fn();results.push({name:t.name,passed:true})}catch(e){results.push({name:t.name,passed:false,error:e.message})}}const passed=results.filter(r=>r.passed).length;document.getElementById('summary').className=passed===tests.length?'ok':'bad';document.getElementById('summary').textContent=passed+'/'+tests.length+' passed';document.getElementById('out').textContent=JSON.stringify({packet_type:'42ndMind_language_math_core_v0_1_1_test_report',ok:passed===tests.length,language_math_patch_loaded:!!window.EpistemicKernelLanguageMathCoreV011Patch,languageMathCore:lm(),communicationCore:comm(),curiosityCore:curio(),maturityCore:mat(),results},null,2)})();</script></body></html>
